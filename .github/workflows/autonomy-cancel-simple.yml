name: Autonomy cancel simple

on:
  push:
    branches: [autonomy-cancel-r1]
    paths: [scripts/.autonomy-cancel-trigger2]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/apply-autonomy-cancel-r1.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Release gates
        run: npm run release:check
      - name: Commit tested result
        run: |
          git config user.name orders-app-autonomy-bot
          git config user.email actions@users.noreply.github.com
          git add worker/domains/lifecycle.ts worker/index.ts src/App.tsx src/features/sections/OrderReturnsSection.tsx src/features/sections/OrderExchangeSection.tsx scripts/test-return-exchange-cancel-autonomy.mjs package.json
          git diff --cached --check
          git commit -m "Make return and exchange cancellation autonomous"
          git push origin HEAD:autonomy-cancel-r1
