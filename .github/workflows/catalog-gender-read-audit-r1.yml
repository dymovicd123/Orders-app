name: Catalog Gender Read Audit R1

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - .github/workflows/catalog-gender-read-audit-r1.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0

      - name: Apply read-neutral gender-default hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{label}: expected {count} anchors, got {actual}')
              p.write_text(s.replace(old, new, count))

          # Product identity reads already happen on the order path. Carry gender_scope in
          # those same rows instead of issuing a second D1 query just for the default.
          patch('worker/domains/catalog.ts',
              'SELECT id, name, category, external_id',
              'SELECT id, name, category, gender_scope, external_id',
              'canonical product selects', 2)
          patch('worker/domains/catalog.ts',
              'first<{ id: number; name: string; category: string; external_id?: string | null }>()',
              'first<{ id: number; name: string; category: string; gender_scope?: string | null; external_id?: string | null }>()',
              'canonical exact type')
          patch('worker/domains/catalog.ts',
              'all<{ id: number; name: string; category: string; external_id?: string | null }>()',
              'all<{ id: number; name: string; category: string; gender_scope?: string | null; external_id?: string | null }>()',
              'canonical list type')
          patch('worker/domains/catalog.ts',
              'SELECT p.id, p.name, p.category, p.external_id',
              'SELECT p.id, p.name, p.category, p.gender_scope, p.external_id',
              'alias product select')
          patch('worker/domains/catalog.ts',
              'first<{ id: number; name: string; category: string; external_id?: string | null }>();',
              'first<{ id: number; name: string; category: string; gender_scope?: string | null; external_id?: string | null }>();',
              'alias product type')

          old = '''export async function isCatalogProductGenderScopeEnabled(db: D1Database) {
            try {
              await db.prepare('SELECT gender_scope FROM catalog_products LIMIT 1').first();
              return true;
            } catch {
              return false;
            }
          }

          export async function getCatalogProductGenderScope(db: D1Database, productId: number): Promise<CatalogProductGenderScope> {
            if (!productId) return 'unisex';
            if (await isCatalogProductGenderScopeEnabled(db)) {
              const row = await db.prepare('SELECT gender_scope FROM catalog_products WHERE id = ? LIMIT 1').bind(productId).first<{ gender_scope: string }>();
              return normalizeCatalogProductGenderScope(row?.gender_scope);
            }
            const profile = await db.prepare(
              `SELECT
                 MAX(CASE WHEN UPPER(TRIM(COALESCE(gender,'')))='ЖЕН' THEN 1 ELSE 0 END) AS has_female,
                 MAX(CASE WHEN UPPER(TRIM(COALESCE(gender,'')))='МУЖ' THEN 1 ELSE 0 END) AS has_male,
                 MAX(CASE WHEN TRIM(COALESCE(gender,''))='' THEN 1 ELSE 0 END) AS has_blank
               FROM catalog_variants WHERE product_id = ? AND is_active = 1`
            ).bind(productId).first<Record<string, unknown>>();
            const female = toInt(profile?.has_female, 0) > 0;
            const male = toInt(profile?.has_male, 0) > 0;
            const blank = toInt(profile?.has_blank, 0) > 0;
            if (female && !male && !blank) return 'female';
            if (male && !female && !blank) return 'male';
            return 'unisex';
          }

          export async function resolveCatalogGenderForProduct(db: D1Database, productId: number, value: unknown) {
            const scope = await getCatalogProductGenderScope(db, productId);
            const explicitGender = normalizeCatalogCombinationGender(value);
            if (explicitGender === 'ЖЕН' || explicitGender === 'МУЖ') return { scope, gender: explicitGender };
            const fixed = catalogGenderForProductScope(scope);
            if (fixed) return { scope, gender: fixed };
            const gender = explicitGender;
            if (gender !== 'ЖЕН' && gender !== 'МУЖ') {
              throw new Error('Для товара «Унисекс» выберите пол конкретной вещи: ЖЕН или МУЖ.');
            }
            return { scope, gender };
          }'''
          new = '''export async function getCatalogProductGenderScope(db: D1Database, productId: number): Promise<CatalogProductGenderScope> {
            if (!productId) return 'unisex';
            const row = await db.prepare('SELECT gender_scope FROM catalog_products WHERE id = ? LIMIT 1').bind(productId).first<{ gender_scope: string }>();
            return normalizeCatalogProductGenderScope(row?.gender_scope);
          }

          export async function resolveCatalogGenderForProduct(db: D1Database, productId: number, value: unknown) {
            const explicitGender = normalizeCatalogCombinationGender(value);
            if (explicitGender === 'ЖЕН' || explicitGender === 'МУЖ') return { scope: null, gender: explicitGender };
            const scope = await getCatalogProductGenderScope(db, productId);
            const fixed = catalogGenderForProductScope(scope);
            if (fixed) return { scope, gender: fixed };
            throw new Error('Для товара «Унисекс» выберите пол конкретной вещи: ЖЕН или МУЖ.');
          }'''
          patch('worker/domains/catalog.ts', old, new, 'remove schema probes')

          patch('worker/domains/catalog.ts',
              "  const genderScopeEnabled = await isCatalogProductGenderScopeEnabled(db);\n  const productsResult = await db.prepare(\n    `SELECT\n      id, name, category, ${genderScopeEnabled ? 'gender_scope' : \"'unisex' AS gender_scope\"}, is_active, created_at, updated_at",
              "  const productsResult = await db.prepare(\n    `SELECT\n      id, name, category, gender_scope, is_active, created_at, updated_at",
              'catalog list schema probe')
          patch('worker/domains/catalog.ts',
              "  if (!await isCatalogProductGenderScopeEnabled(db)) {\n    throw new Error('Схема каталога ещё не поддерживает назначение товара по полу. Примените миграцию 0068 и повторите действие.');\n  }\n  const category = normalizeCatalogCategory(input.category);",
              "  const category = normalizeCatalogCategory(input.category);",
              'catalog create schema probe')
          patch('worker/domains/catalog.ts',
              "  if (genderScope !== undefined && !await isCatalogProductGenderScopeEnabled(db)) {\n    throw new Error('Схема каталога ещё не поддерживает назначение товара по полу. Примените миграцию 0068 и повторите действие.');\n  }\n  const isActive =",
              "  const isActive =",
              'catalog update schema probe')

          # Create-variant already reads the product. Include its scope in that same row.
          patch('worker/domains/catalog.ts',
              "  const product = await db.prepare('SELECT id FROM catalog_products WHERE id = ?').bind(productId).first<{ id: number }>();\n  if (!product) throw new Error('Product not found.');\n  const category = normalizeAudienceCategory(input.category, input.sizeLabel) as 'adult' | 'child';\n  const genderResolution = await resolveCatalogGenderForProduct(db, productId, input.gender);\n  const gender = genderResolution.gender;",
              "  const product = await db.prepare('SELECT id, gender_scope FROM catalog_products WHERE id = ?').bind(productId).first<{ id: number; gender_scope: string }>();\n  if (!product) throw new Error('Product not found.');\n  const category = normalizeAudienceCategory(input.category, input.sizeLabel) as 'adult' | 'child';\n  const explicitGender = normalizeCatalogCombinationGender(input.gender);\n  const gender = explicitGender === 'ЖЕН' || explicitGender === 'МУЖ'\n    ? explicitGender\n    : catalogGenderForProductScope(normalizeCatalogProductGenderScope(product.gender_scope));\n  if (gender !== 'ЖЕН' && gender !== 'МУЖ') throw new Error('Для товара «Унисекс» выберите пол конкретной вещи: ЖЕН или МУЖ.');",
              'create variant scope reuse')

          # Order resolver uses gender_scope from its existing product identity lookup.
          patch('worker/domains/order-reservations.ts',
              'findCatalogProductByIdentity, getCatalogProductGenderScope, isCatalogIdentityV3Enabled',
              'findCatalogProductByIdentity, isCatalogIdentityV3Enabled',
              'order resolver import remove extra reader')
          patch('worker/domains/order-reservations.ts',
              'normalizeCatalogCombinationGender, normalizeCatalogCombinationSize, resolveCatalogValueAlias',
              'normalizeCatalogCombinationGender, normalizeCatalogCombinationSize, normalizeCatalogProductGenderScope, resolveCatalogValueAlias',
              'order resolver import add scope normalizer')
          patch('worker/domains/order-reservations.ts',
              "const product = await findCatalogProductByIdentity(db, item.productName, 0, { activeOnly: true }) as { id: number; name: string; category: string } | null;",
              "const product = await findCatalogProductByIdentity(db, item.productName, 0, { activeOnly: true }) as { id: number; name: string; category: string; gender_scope?: string | null } | null;",
              'v2 product scope type')
          patch('worker/domains/order-reservations.ts',
              "    const productGenderScope = await getCatalogProductGenderScope(db, product.id);\n    gender = catalogGenderForProductScope(productGenderScope);",
              "    const productGenderScope = normalizeCatalogProductGenderScope(product.gender_scope);\n    gender = catalogGenderForProductScope(productGenderScope);",
              'v2 no second scope query')

          # Review context/resolution: include scope in existing product queries and product lists.
          patch('worker/domains/catalog-review.ts',
              'findCatalogProductByIdentity, getCatalogProductGenderScope, makeVariantExternalId',
              'findCatalogProductByIdentity, makeVariantExternalId',
              'review import remove scope read')
          patch('worker/domains/catalog-review.ts',
              "SELECT id, name, category FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1",
              "SELECT id, name, category, gender_scope FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1",
              'review context product query')
          patch('worker/domains/catalog-review.ts',
              "first<{ id: number; name: string; category: string }>()\n    : await findCatalogProductByIdentity(db, facts.productName, 0, { activeOnly: true }) as { id: number; name: string; category: string } | null;\n  const productGenderScope = product?.id ? await getCatalogProductGenderScope(db, product.id) : 'unisex';",
              "first<{ id: number; name: string; category: string; gender_scope?: string | null }>()\n    : await findCatalogProductByIdentity(db, facts.productName, 0, { activeOnly: true }) as { id: number; name: string; category: string; gender_scope?: string | null } | null;\n  const productGenderScope = product?.id ? normalizeCatalogProductGenderScope(product.gender_scope) : 'unisex';",
              'review context scope reuse')
          patch('worker/domains/catalog-review.ts',
              "{ results: [] as Array<{ id: number; name: string; category: string }> }\n    : await db.prepare(\n        `SELECT id, name, category FROM catalog_products WHERE is_active = 1 ORDER BY name COLLATE NOCASE, id LIMIT 300`\n      ).all<{ id: number; name: string; category: string }>();",
              "{ results: [] as Array<{ id: number; name: string; category: string; gender_scope?: string | null }> }\n    : await db.prepare(\n        `SELECT id, name, category, gender_scope FROM catalog_products WHERE is_active = 1 ORDER BY name COLLATE NOCASE, id LIMIT 300`\n      ).all<{ id: number; name: string; category: string; gender_scope?: string | null }>();",
              'review products list scope')
          patch('worker/domains/catalog-review.ts',
              "products: (productsResult.results || []).map((row) => ({ id: toInt(row.id, 0), name: cleanText(row.name), category: cleanText(row.category) })),",
              "products: (productsResult.results || []).map((row) => ({ id: toInt(row.id, 0), name: cleanText(row.name), category: cleanText(row.category), genderScope: normalizeCatalogProductGenderScope(row.gender_scope) })),",
              'review products result scope')
          patch('worker/domains/catalog-review.ts',
              "let product: { id: number; name: string } | null = null;\n  if (productId) {\n    product = await db.prepare(`SELECT id, name FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1`).bind(productId).first<{ id: number; name: string }>();",
              "let product: { id: number; name: string; gender_scope?: string | null } | null = null;\n  if (productId) {\n    product = await db.prepare(`SELECT id, name, gender_scope FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1`).bind(productId).first<{ id: number; name: string; gender_scope?: string | null }>();",
              'review resolution product scope')
          patch('worker/domains/catalog-review.ts',
              "const requestedGenderScope = product?.id ? await getCatalogProductGenderScope(db, product.id) : (cleanText(input.genderScope) ? normalizeCatalogProductGenderScope(input.genderScope) : null);",
              "const requestedGenderScope = product?.id ? normalizeCatalogProductGenderScope(product.gender_scope) : (cleanText(input.genderScope) ? normalizeCatalogProductGenderScope(input.genderScope) : null);",
              'review resolution no scope query')
          patch('worker/domains/catalog-review.ts',
              "const created = await createCatalogProduct(db, { name: requestedProductName, category });",
              "const created = await createCatalogProduct(db, { name: requestedProductName, category, genderScope: requestedGenderScope });",
              'review normal new product scope')

          # Lifecycle uses the same read-neutral pattern.
          patch('worker/domains/lifecycle.ts',
              'findCatalogProductByIdentity, getCatalogProductGenderScope, loadCanonicalVariantSnapshot',
              'findCatalogProductByIdentity, loadCanonicalVariantSnapshot',
              'lifecycle import remove scope read')
          # Workshop exact candidate gets the default when an old snapshot omitted gender.
          patch('worker/domains/lifecycle.ts',
              "const product = await findCatalogProductByIdentity(db, normalized.productName, 0, { activeOnly: true }) as { id: number } | null;\n  if (!product?.id) return { productId: null, variantId: null, matchStatus: 'unresolved_product', inputKey };",
              "const product = await findCatalogProductByIdentity(db, normalized.productName, 0, { activeOnly: true }) as { id: number; gender_scope?: string | null } | null;\n  if (!product?.id) return { productId: null, variantId: null, matchStatus: 'unresolved_product', inputKey };",
              'workshop candidate product scope')
          patch('worker/domains/lifecycle.ts',
              "  const gender = normalizeCatalogCombinationGender(normalized.gender);\n  const color =",
              "  const gender = normalizeCatalogCombinationGender(normalized.gender) || catalogGenderForProductScope(normalizeCatalogProductGenderScope(product.gender_scope));\n  if (gender !== 'ЖЕН' && gender !== 'МУЖ') return { productId: product.id, variantId: null, matchStatus: 'unresolved_attribute', inputKey };\n  const color =",
              'workshop candidate default')
          patch('worker/domains/lifecycle.ts',
              "SELECT id, name, category FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1",
              "SELECT id, name, category, gender_scope FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1",
              'lifecycle context product query')
          patch('worker/domains/lifecycle.ts',
              "first<{ id: number; name: string; category: string }>()\n    : await findCatalogProductByIdentity(db, facts.productName, 0, { activeOnly: true }) as { id: number; name: string; category: string } | null;\n  const productGenderScope = product?.id ? await getCatalogProductGenderScope(db, product.id) : 'unisex';",
              "first<{ id: number; name: string; category: string; gender_scope?: string | null }>()\n    : await findCatalogProductByIdentity(db, facts.productName, 0, { activeOnly: true }) as { id: number; name: string; category: string; gender_scope?: string | null } | null;\n  const productGenderScope = product?.id ? normalizeCatalogProductGenderScope(product.gender_scope) : 'unisex';",
              'lifecycle context scope reuse')
          patch('worker/domains/lifecycle.ts',
              "{ results: [] as Array<{ id: number; name: string; category: string }> }\n    : await db.prepare(`SELECT id, name, category FROM catalog_products WHERE is_active = 1 ORDER BY name COLLATE NOCASE, id LIMIT 300`).all<{ id: number; name: string; category: string }>();",
              "{ results: [] as Array<{ id: number; name: string; category: string; gender_scope?: string | null }> }\n    : await db.prepare(`SELECT id, name, category, gender_scope FROM catalog_products WHERE is_active = 1 ORDER BY name COLLATE NOCASE, id LIMIT 300`).all<{ id: number; name: string; category: string; gender_scope?: string | null }>();",
              'lifecycle products list scope')
          patch('worker/domains/lifecycle.ts',
              "products: (productsResult.results || []).map((row) => ({ id: toInt(row.id, 0), name: cleanText(row.name), category: cleanText(row.category) })),",
              "products: (productsResult.results || []).map((row) => ({ id: toInt(row.id, 0), name: cleanText(row.name), category: cleanText(row.category), genderScope: normalizeCatalogProductGenderScope(row.gender_scope) })),",
              'lifecycle products result scope')
          patch('worker/domains/lifecycle.ts',
              "let product: { id: number; name: string } | null = null;\n  if (productId) {\n    product = await db.prepare(`SELECT id, name FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1`).bind(productId).first<{ id: number; name: string }>();",
              "let product: { id: number; name: string; gender_scope?: string | null } | null = null;\n  if (productId) {\n    product = await db.prepare(`SELECT id, name, gender_scope FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1`).bind(productId).first<{ id: number; name: string; gender_scope?: string | null }>();",
              'lifecycle resolution product scope')
          patch('worker/domains/lifecycle.ts',
              "const requestedGenderScope = product?.id ? await getCatalogProductGenderScope(db, product.id) : (cleanText(input.genderScope) ? normalizeCatalogProductGenderScope(input.genderScope) : null);",
              "const requestedGenderScope = product?.id ? normalizeCatalogProductGenderScope(product.gender_scope) : (cleanText(input.genderScope) ? normalizeCatalogProductGenderScope(input.genderScope) : null);",
              'lifecycle resolution no scope query')

          # Product-choice UI in review/lifecycle should immediately reflect an existing product's
          # default, without overwriting a valid concrete gender already supplied by the human.
          patch('src/features/inventory/views/catalogLegacyAdminModes.tsx',
              "onChange={(event) => { setCatalogReviewFacts((current: any) => ({ ...current, productId: Number(event.target.value || 0) })); setCatalogReviewCreateProduct(false) }}",
              "onChange={(event) => { const productId = Number(event.target.value || 0); const selected = (catalogReviewContext.products || []).find((product: any) => Number(product.id) === productId); const scope = selected?.genderScope || ''; const fallbackGender = scope === 'female' ? 'ЖЕН' : scope === 'male' ? 'МУЖ' : ''; setCatalogReviewFacts((current: any) => ({ ...current, productId, genderScope: scope, gender: ['ЖЕН', 'МУЖ'].includes(normalizeSuggestion(current.gender)) ? current.gender : fallbackGender })); setCatalogReviewCreateProduct(false) }}",
              'review product chooser default')
          patch('src/features/inventory/views/catalogLegacyAdminModes.tsx',
              "onChange={(event) => { setInventoryLifecycleFacts((current: any) => ({ ...current, productId: Number(event.target.value || 0) })); setInventoryLifecycleCreateProduct(false) }}",
              "onChange={(event) => { const productId = Number(event.target.value || 0); const selected = catalogActiveProducts.find((product: any) => Number(product.id) === productId); const scope = selected?.genderScope || ''; const fallbackGender = scope === 'female' ? 'ЖЕН' : scope === 'male' ? 'МУЖ' : ''; setInventoryLifecycleFacts((current: any) => ({ ...current, productId, genderScope: scope, gender: ['ЖЕН', 'МУЖ'].includes(normalizeSuggestion(current.gender)) ? current.gender : fallbackGender })); setInventoryLifecycleCreateProduct(false) }}",
              'lifecycle product chooser default')

          # Strengthen static acceptance around non-blocking override and read-neutral behavior.
          t = Path('scripts/test-catalog-gender-scope-r1.mjs').read_text()
          extra = """
          check(!catalog.includes('isCatalogProductGenderScopeEnabled'), 'Normal catalog paths must not spend a D1 read probing the schema')
          check(catalog.includes('SELECT id, name, category, gender_scope, external_id'), 'Existing product identity reads must carry gender_scope')
          check(resolver.includes('normalizeCatalogProductGenderScope(product.gender_scope)'), 'Order resolver must reuse the product row for gender default')
          check(!resolver.includes('await getCatalogProductGenderScope(db, product.id)'), 'Order resolver must not issue a second gender-scope read')
          check(catalog.includes("if (explicitGender === 'ЖЕН' || explicitGender === 'МУЖ') return { scope: null, gender: explicitGender }"), 'Explicit human gender must bypass product default and extra scope read')
          check(!migration.includes("AND UPPER(TRIM(COALESCE(v.gender,''))) <> CASE p.gender_scope"), 'Migration must never rewrite explicit opposite-gender variants')
          """.strip()
          marker = "console.log('Catalog Gender Scope R1 semantic/static acceptance passed.')"
          if marker not in t: raise SystemExit('catalog test marker missing')
          Path('scripts/test-catalog-gender-scope-r1.mjs').write_text(t.replace(marker, extra + '\n\n' + marker, 1))
          PY

      - name: Add migration behavioral test
        run: |
          cat > scripts/test-catalog-gender-migration-r1.mjs <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'
          import { DatabaseSync } from 'node:sqlite'

          const root = process.cwd()
          const sql = fs.readFileSync(path.join(root, 'migrations/0068_v72_catalog_product_gender_scope.sql'), 'utf8')
          const db = new DatabaseSync(':memory:')
          db.exec(`
            PRAGMA foreign_keys = ON;
            CREATE TABLE catalog_products (id INTEGER PRIMARY KEY, name TEXT NOT NULL, category TEXT NOT NULL DEFAULT 'adult', is_active INTEGER NOT NULL DEFAULT 1, updated_at TEXT);
            CREATE TABLE catalog_stock_positions (id INTEGER PRIMARY KEY, product_id INTEGER, material TEXT, length TEXT, is_active INTEGER DEFAULT 1);
            CREATE TABLE catalog_variants (id INTEGER PRIMARY KEY, product_id INTEGER NOT NULL, stock_position_id INTEGER, category TEXT, gender TEXT, color TEXT, material TEXT, length TEXT, size_label TEXT, is_active INTEGER NOT NULL DEFAULT 1, updated_at TEXT);
            CREATE TABLE inventory_stock (id INTEGER PRIMARY KEY, inventory_source TEXT NOT NULL, product_id INTEGER, variant_id INTEGER, product_name_snapshot TEXT, gender_snapshot TEXT, color_snapshot TEXT, material_snapshot TEXT, length_snapshot TEXT, size_snapshot TEXT, quantity INTEGER DEFAULT 0, reserved_quantity INTEGER DEFAULT 0, updated_at TEXT);
            CREATE UNIQUE INDEX idx_inventory_stock_variant_unique ON inventory_stock(inventory_source, variant_id) WHERE variant_id IS NOT NULL;
            CREATE TABLE order_items (id INTEGER PRIMARY KEY, variant_id INTEGER, gender_snapshot TEXT);
            CREATE TABLE inventory_movements (id INTEGER PRIMARY KEY, variant_id INTEGER, gender_snapshot TEXT);
            CREATE TABLE workshop_tasks (id INTEGER PRIMARY KEY, variant_id INTEGER);
            CREATE TABLE inventory_reservations (id INTEGER PRIMARY KEY, variant_id INTEGER);
            CREATE TABLE catalog_input_aliases (id INTEGER PRIMARY KEY, variant_id INTEGER);
            CREATE TABLE inventory_lifecycle_events (id INTEGER PRIMARY KEY, variant_id INTEGER);
            CREATE TABLE inventory_transfer_items (id INTEGER PRIMARY KEY, variant_id INTEGER);
            CREATE TABLE inventory_stock_checks (id INTEGER PRIMARY KEY, variant_id INTEGER);
            CREATE TABLE inventory_stocktake_items (id INTEGER PRIMARY KEY, variant_id INTEGER);

            INSERT INTO catalog_products(id,name,category,is_active) VALUES
              (1,'ЕҢЛІК ШАПАН','adult',1),
              (2,'БЕЛГІСІЗ УНИСЕКС','adult',1),
              (3,'ҚОЗЫ КӨРПЕШ ШАПАН','adult',1);
            INSERT INTO catalog_stock_positions(id,product_id,material,length) VALUES (11,1,'СТАНДАРТ','СТАНДАРТ'),(21,2,'СТАНДАРТ','СТАНДАРТ'),(31,3,'СТАНДАРТ','СТАНДАРТ');
            INSERT INTO catalog_variants(id,product_id,stock_position_id,category,gender,color,material,length,size_label,is_active) VALUES
              (101,1,11,'adult','','ҚЫЗЫЛ','СТАНДАРТ','СТАНДАРТ','46',1),
              (102,1,11,'adult','ЖЕН','ҚЫЗЫЛ','СТАНДАРТ','СТАНДАРТ','46',1),
              (103,1,11,'adult','МУЖ','КӨК','СТАНДАРТ','СТАНДАРТ','48',1),
              (201,2,21,'adult','','АҚ','СТАНДАРТ','СТАНДАРТ','46',1),
              (202,2,21,'adult','','ҚАРА','СТАНДАРТ','СТАНДАРТ','48',1),
              (301,3,31,'adult','','ҚАРА','СТАНДАРТ','СТАНДАРТ','50',1);
            INSERT INTO inventory_stock(id,inventory_source,product_id,variant_id,product_name_snapshot,gender_snapshot,color_snapshot,material_snapshot,length_snapshot,size_snapshot,quantity,reserved_quantity) VALUES
              (1,'warehouse',1,101,'ЕҢЛІК ШАПАН','','ҚЫЗЫЛ','СТАНДАРТ','СТАНДАРТ','46',3,1),
              (2,'warehouse',1,102,'ЕҢЛІК ШАПАН','ЖЕН','ҚЫЗЫЛ','СТАНДАРТ','СТАНДАРТ','46',5,2),
              (3,'warehouse',1,103,'ЕҢЛІК ШАПАН','МУЖ','КӨК','СТАНДАРТ','СТАНДАРТ','48',7,0),
              (4,'warehouse',2,202,'БЕЛГІСІЗ УНИСЕКС','','ҚАРА','СТАНДАРТ','СТАНДАРТ','48',2,0);
            INSERT INTO order_items(id,variant_id,gender_snapshot) VALUES (1,101,''),(2,103,'МУЖ'),(3,202,'');
            INSERT INTO inventory_movements(id,variant_id,gender_snapshot) VALUES (1,101,''),(2,103,'МУЖ');
            INSERT INTO workshop_tasks(id,variant_id) VALUES (1,101);
            INSERT INTO inventory_reservations(id,variant_id) VALUES (1,101);
            INSERT INTO catalog_input_aliases(id,variant_id) VALUES (1,101);
            INSERT INTO inventory_lifecycle_events(id,variant_id) VALUES (1,101);
            INSERT INTO inventory_transfer_items(id,variant_id) VALUES (1,101);
            INSERT INTO inventory_stock_checks(id,variant_id) VALUES (1,101);
            INSERT INTO inventory_stocktake_items(id,variant_id) VALUES (1,101);
          `)

          db.exec(sql)

          const one = (sql, ...params) => db.prepare(sql).get(...params)
          const scope = (id) => one('SELECT gender_scope FROM catalog_products WHERE id=?', id).gender_scope
          const variant = (id) => one('SELECT gender,is_active FROM catalog_variants WHERE id=?', id)

          if (scope(1) !== 'female') throw new Error('ЕҢЛІК must be female-default')
          if (scope(2) !== 'unisex') throw new Error('ambiguous product must remain unisex')
          if (scope(3) !== 'male') throw new Error('approved male product must be male-default')
          if (variant(103).gender !== 'МУЖ' || variant(103).is_active !== 1) throw new Error('explicit opposite-gender override must be preserved')
          if (variant(301).gender !== 'МУЖ') throw new Error('blank male-default variant must be repaired in place')
          if (variant(101).is_active !== 0 || variant(102).gender !== 'ЖЕН') throw new Error('blank female duplicate must merge into canonical female variant')

          const mergedStock = one("SELECT quantity,reserved_quantity,gender_snapshot FROM inventory_stock WHERE inventory_source='warehouse' AND variant_id=102")
          if (mergedStock.quantity !== 8 || mergedStock.reserved_quantity !== 3 || mergedStock.gender_snapshot !== 'ЖЕН') throw new Error('stock merge must preserve totals and canonical current snapshot')
          const oppositeStock = one("SELECT quantity FROM inventory_stock WHERE inventory_source='warehouse' AND variant_id=103")
          if (oppositeStock.quantity !== 7) throw new Error('opposite-gender stock must remain untouched')

          const order = one('SELECT variant_id,gender_snapshot FROM order_items WHERE id=1')
          const movement = one('SELECT variant_id,gender_snapshot FROM inventory_movements WHERE id=1')
          if (order.variant_id !== 102 || order.gender_snapshot !== '') throw new Error('order link must move but historical gender snapshot must stay unchanged')
          if (movement.variant_id !== 102 || movement.gender_snapshot !== '') throw new Error('movement link must move but historical gender snapshot must stay unchanged')

          for (const table of ['workshop_tasks','inventory_reservations','catalog_input_aliases','inventory_lifecycle_events','inventory_transfer_items','inventory_stock_checks','inventory_stocktake_items']) {
            if (one(`SELECT variant_id FROM ${table} WHERE id=1`).variant_id !== 102) throw new Error(`${table} was not repointed to keeper variant`)
          }

          if (variant(201).is_active !== 0) throw new Error('unused unisex blank placeholder should be retired')
          if (variant(202).is_active !== 1) throw new Error('used/stocked ambiguous unisex blank variant must remain for human resolution')

          const repair = one('SELECT repair_mode,keeper_variant_id FROM catalog_gender_variant_repairs WHERE old_variant_id=101')
          if (repair.repair_mode !== 'merge' || repair.keeper_variant_id !== 102) throw new Error('repair audit row missing')

          console.log('Catalog Gender Migration R1 behavioral acceptance passed.')
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('package.json')
          s = p.read_text()
          old = '&& node scripts/test-catalog-gender-scope-r1.mjs\\",'
          new = '&& node scripts/test-catalog-gender-scope-r1.mjs && node scripts/test-catalog-gender-migration-r1.mjs\\",'
          if old not in s: raise SystemExit('package catalog test anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit audited implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker src scripts package.json
          git commit -m "Harden catalog gender defaults and D1 reads"
          git push origin HEAD:catalog-gender-cleanup-r1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Focused catalog gender tests
        run: |
          node scripts/test-catalog-gender-scope-r1.mjs
          node scripts/test-catalog-gender-migration-r1.mjs
      - name: Build
        run: npm run build
      - name: Full cumulative release check
        run: npm run release:check
