name: Branch2 Return V2 business fixes - one-time checked release
on:
  push:
    branches: [branch2]

permissions:
  contents: read

concurrency:
  group: cloudflare-branch2-return-v2-staging
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Branch2: activate Return V2 verified business fixes 20261115')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read reviewed Branch2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: stage
          persist-credentials: false

      - name: Read production identity guard only (never deploy Main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false

      - name: Setup tested runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: stage/package-lock.json

      - name: Verify Main isolation, Branch2 target and complete original migrations (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 ops/.github/scripts/branch2_v2_stage_guard.py --stage stage --expected-index 9

      - name: Verify exact reviewed additive migration bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files={
           '0133_return_v2_workshop_obligation.sql':'c6e0c9cf3412c30805742f64653c1d2e317cfc6c',
           '0134_return_v2_unreserved_obligation.sql':'55c063904c209185319f5016b2cf43d09f87fe86'
          }
          for filename,want in files.items():
              b=(Path('stage/migrations')/filename).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              if sha!=want:raise SystemExit('STOP: migration differs from reviewed file: '+filename)
          print('PASS: exact two reviewed migrations; no production target.')
          PY

      - name: Install and run full Branch2 regressions before any remote writes
        working-directory: stage
        run: |
          npm ci --no-audit --no-fund
          npm run verify:return-v2-branch2
          npm run release:check
          npm run build

      - name: Prepare strictly test-only Wrangler config and dry-run upload
        working-directory: stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          assert cfg['name']=='orders-app-branch2'
          assert len(cfg['d1_databases'])==1
          db=cfg['d1_databases'][0]
          assert db['binding']=='DB'
          assert db['database_id']=='0904a573-21ff-44d8-93b0-c9200f771702'
          assert db['database_name']=='orders_db_branch2_mirror_20261027'
          assert not cfg.get('env')
          assert cfg.get('vars',{}).get('RETURN_V2_ENABLED') not in ('true',True)
          cfg['vars']={**cfg.get('vars',{}),'RETURN_V2_ENABLED':'true'}
          Path('wrangler.return-v2-release.jsonc').write_text(json.dumps(cfg,indent=2)+'\n')
          print('PASS: only orders-app-branch2 / exact test D1.')
          PY
          npx --no-install wrangler deploy --config wrangler.return-v2-release.jsonc --name orders-app-branch2 --strict --dry-run

      - name: Apply only migrations 0133 and 0134 to exact Branch2 test D1
        working-directory: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          check_schema() {
            CHECK_MODE="$1" python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          root='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/0904a573-21ff-44d8-93b0-c9200f771702'
          sql="""SELECT instr(sql,'cancel_workshop_obligation') AS workshop,
             instr(sql,'cancel_unreserved_obligation') AS unreserved
             FROM sqlite_master WHERE type='table' AND name='return_v2_unified_lines'"""
          request=urllib.request.Request(root+'/query',method='POST',
           data=json.dumps({'sql':sql,'params':[]}).encode(),
           headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:obj=json.load(response)
          if not obj.get('success'):raise SystemExit('STOP: D1 schema query failed')
          found=(obj.get('result') or [{}])[0].get('results') or []
          if len(found)!=1:raise SystemExit('STOP: no unique return-v2 journal table')
          value=(int(found[0]['workshop'])>0,int(found[0]['unreserved'])>0)
          wanted={'before':(False,False),'after133':(True,False),'after134':(True,True)}[os.environ['CHECK_MODE']]
          if value!=wanted:raise SystemExit('STOP: Branch2 action schema not at expected checkpoint')
          print('PASS: Branch2 journal action checkpoint',os.environ['CHECK_MODE'])
          PY
          }
          check_schema before
          npx --no-install wrangler d1 execute orders_db_branch2_mirror_20261027 --config wrangler.jsonc --remote --file migrations/0133_return_v2_workshop_obligation.sql --yes
          check_schema after133
          npx --no-install wrangler d1 execute orders_db_branch2_mirror_20261027 --config wrangler.jsonc --remote --file migrations/0134_return_v2_unreserved_obligation.sql --yes
          check_schema after134

      - name: Publish only reviewed Branch2 Worker with Return V2 enabled
        working-directory: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy --config wrangler.return-v2-release.jsonc --name orders-app-branch2 --strict

      - name: Verify active Branch2 deployment version bindings and UAT flag (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/orders-app-branch2'
          def read(path):
            request=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token})
            with urllib.request.urlopen(request,timeout=30) as response:obj=json.load(response)
            if not obj.get('success'):raise SystemExit('STOP: Cloudflare API rejected '+path)
            return obj.get('result') or {}
          deployments=read('/deployments?per_page=1').get('deployments') or []
          if not deployments:raise SystemExit('STOP: no test deployment found')
          active=deployments[0].get('versions') or []
          if len(active)!=1 or float(active[0].get('percentage') or 0)!=100:
            raise SystemExit('STOP: Branch2 traffic is unexpectedly split')
          version=read('/versions/'+active[0]['version_id'])
          bindings=(version.get('resources') or {}).get('bindings') or []
          dbs=[b for b in bindings if b.get('name')=='DB']
          flags=[b for b in bindings if b.get('name')=='RETURN_V2_ENABLED']
          if len(dbs)!=1 or (dbs[0].get('database_id') or dbs[0].get('id'))!='0904a573-21ff-44d8-93b0-c9200f771702':
            raise SystemExit('STOP: active Worker does not bind exact Branch2 test D1')
          if len(flags)!=1 or flags[0].get('type')!='plain_text' or flags[0].get('text')!='true':
            raise SystemExit('STOP: active Worker does not have Return V2 enabled')
          print('PASS: ACTIVE Branch2-only version, 100% traffic, test D1 and flag=true.')
          print('Production Worker and D1 were never mutation targets.')
          PY
