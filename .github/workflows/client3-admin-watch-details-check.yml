name: Client3 admin watch logistics corrections verification
# Test manager Main scopes and admin-only watch details including ready/dispatched constraints.
on:
  push:
    branches: [client3/step2-admin-watch-logistics-corrections-20261103]
    paths: ['.github/workflows/client3-admin-watch-details-check.yml']
permissions: {contents: read}
jobs:
  corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Third Worker isolation
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          ! grep -Eq 'orders_db_prod|orders_db_branch2' wrangler.jsonc
      - run: npm ci
      - name: Main manager price/metadata correction, Client3 regression and compiled UI
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node scripts/client3/test-watch-main-free-text-ux-20261103.mjs
          npm run build
