name: Confirm deleted F3A7 read-only

on:
  push:
    branches: [diag/confirm-deleted-f3a7-20260902]
    paths:
      - scripts/.confirm-deleted-f3a7-20260902-trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Production order state — read only
        run: |
          set -euo pipefail
          curl --fail-with-body -sS 'https://orders-app.orders-clothes.workers.dev/api/orders/1242' | tee order.json
          node - <<'NODE'
          const fs = require('fs')
          const raw = JSON.parse(fs.readFileSync('order.json', 'utf8'))
          const order = raw.order || raw
          console.log(JSON.stringify({
            ok: raw.ok ?? true,
            id: order.id,
            external_id: order.external_id,
            order_status: order.order_status,
            shipping_status: order.shipping_status,
            updated_at: order.updated_at
          }, null, 2))
          if (Number(order.id) !== 1242) throw new Error('Unexpected order id')
          if (String(order.external_id || '') !== 'ORD-20260829144801-F3A7DDC3') throw new Error('Unexpected external id')
          if (String(order.order_status || '').toLowerCase() !== 'deleted') throw new Error('Order is not deleted')
          NODE
