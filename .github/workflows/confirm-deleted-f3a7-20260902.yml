name: Confirm deleted F3A7 read-only

on:
  push:
    branches: [diag/confirm-deleted-f3a7-20260902]
    paths:
      - scripts/.confirm-deleted-f3a7-20260902-trigger

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact order state — read only
        run: |
          npx wrangler d1 execute orders_db_prod --remote --command "SELECT id, external_id, order_status, shipping_status, archived_at, updated_at FROM orders WHERE external_id = 'ORD-20260829144801-F3A7DDC3' LIMIT 1;"
      - name: Verify related return — read only
        run: |
          npx wrangler d1 execute orders_db_prod --remote --command "SELECT id, order_id, amount, status, cancelled_at FROM returns WHERE id = 33 LIMIT 1;"
