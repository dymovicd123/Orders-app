name: Install pre-August maintenance route R2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-preaug-maintenance-route-r2.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: python3 scripts/install-preaug-maintenance-route.py
      - run: npm run typecheck
      - run: npm run build
      - name: Commit transient route
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-preaug-maintenance-route.yml .github/workflows/install-preaug-maintenance-route-r2.yml scripts/install-preaug-maintenance-route.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install one-shot pre-August shipping maintenance route'
          git push origin HEAD:main
