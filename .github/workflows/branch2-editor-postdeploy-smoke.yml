name: Branch2 Editor Postdeploy Smoke

on:
  push:
    branches: [safe/branch2-editor-postdeploy-smoke-20260902]
    paths:
      - scripts/.branch2-editor-postdeploy-smoke-trigger

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose live Branch2 and verify deployed editor bundle without mutation
        env:
          TARGET_URL: https://orders-app-branch2.orders-clothes.workers.dev/#orders
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')
          ;(async () => {
            const browser = await chromium.launch({ headless: true })

            // 1) Real Branch2, read-only: establish why the clean session has no edit button.
            const realPage = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            const realPageErrors = []
            const realConsoleErrors = []
            realPage.on('pageerror', error => realPageErrors.push(String(error?.stack || error)))
            realPage.on('console', msg => { if (msg.type() === 'error') realConsoleErrors.push(msg.text()) })
            await realPage.goto(process.env.TARGET_URL, { waitUntil: 'networkidle', timeout: 90000 })
            await realPage.waitForTimeout(1200)

            const live = await realPage.evaluate(async () => {
              const statusResponse = await fetch('/api/admin-mode/status', { credentials: 'include', cache: 'no-store' })
              const statusBody = await statusResponse.json().catch(() => null)
              const allOrdersResponse = await fetch('/api/orders?limit=100&offset=0&q=&status=all&shippingStatus=all&archiveMode=all&manager=&managerId=0&dateFrom=&dateTo=', {
                credentials: 'include',
                cache: 'no-store',
                headers: { 'X-Access-Role': 'manager' },
              })
              const allOrdersBody = await allOrdersResponse.json().catch(() => null)
              return {
                statusHttp: statusResponse.status,
                statusBody,
                ordersHttp: allOrdersResponse.status,
                ordersBody: allOrdersBody,
              }
            })
            const liveOrders = Array.isArray(live.ordersBody?.orders) ? live.ordersBody.orders : []
            const liveEligible = liveOrders.filter(order => !['deleted', 'archived'].includes(String(order?.order_status || '')) && String(order?.shipping_status || '') !== 'sent')
            const realEditCount = await realPage.getByRole('button', { name: 'Редактировать', exact: true }).count()
            const realTableRows = await realPage.locator('#orders-table tbody tr').count().catch(() => 0)
            console.log('REAL_TITLE', await realPage.title())
            console.log('REAL_ADMIN_STATUS_HTTP', live.statusHttp)
            console.log('REAL_ROLE', live.statusBody?.role || null)
            console.log('REAL_IS_ADMIN', Boolean(live.statusBody?.isAdmin))
            console.log('REAL_ORDERS_HTTP', live.ordersHttp)
            console.log('REAL_ALL_ORDERS_RETURNED', liveOrders.length)
            console.log('REAL_ALL_ORDERS_TOTAL', Number(live.ordersBody?.totalCount || live.ordersBody?.pagination?.totalCount || liveOrders.length))
            console.log('REAL_ELIGIBLE_RETURNED', liveEligible.length)
            console.log('REAL_DEFAULT_TABLE_ROWS', realTableRows)
            console.log('REAL_EDIT_BUTTON_COUNT', realEditCount)
            console.log('REAL_PAGE_ERRORS', JSON.stringify(realPageErrors))
            console.log('REAL_CONSOLE_ERRORS', JSON.stringify(realConsoleErrors))

            if ((await realPage.title()) !== 'Система заказов 2') throw new Error(`Unexpected Branch2 title: ${await realPage.title()}`)
            if (live.statusHttp !== 200 || live.statusBody?.role !== 'manager' || live.statusBody?.isAdmin) throw new Error('Clean Branch2 session is not the expected manager working mode')
            if (live.ordersHttp !== 200) throw new Error(`Branch2 orders read failed: ${live.ordersHttp}`)
            if (realPageErrors.length) throw new Error(`Real Branch2 runtime page errors: ${realPageErrors.join(' | ')}`)
            if (realConsoleErrors.some(line => /TypeError|ReferenceError|Failed to fetch dynamically imported module|ChunkLoadError/i.test(line))) throw new Error(`Real Branch2 runtime console errors: ${realConsoleErrors.join(' | ')}`)
            await realPage.close()

            // 2) Same deployed Branch2 JS bundle, but replace only the GET order-list read with a
            // synthetic in-memory order. This exercises the actual editor code without creating or
            // changing any Branch2 D1 row.
            const testPage = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            const pageErrors = []
            const consoleErrors = []
            const mutatingRequests = []
            testPage.on('pageerror', error => pageErrors.push(String(error?.stack || error)))
            testPage.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()) })
            testPage.on('request', request => {
              if (['POST', 'PATCH', 'PUT', 'DELETE'].includes(request.method())) mutatingRequests.push(`${request.method()} ${request.url()}`)
            })
            await testPage.route('**/api/orders?**', async route => {
              if (route.request().method() !== 'GET') return route.continue()
              const syntheticOrder = {
                id: 900000001,
                external_id: 'BRANCH2-EDITOR-SMOKE-NONPERSISTENT',
                order_date: '2026-09-02',
                manager_id: null,
                manager_name: 'ПРОВЕРКА',
                source_type: 'warehouse',
                customer_name: 'Проверка',
                customer_phone: '',
                city: '',
                delivery_type: '',
                comment: '',
                order_status: 'active',
                workshop_status: 'cancelled',
                shipping_status: 'not_sent',
                total_amount: 0,
                received_amount: 0,
                debt_amount: 0,
                return_amount: 0,
                items: [],
                payments: [],
              }
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ ok: true, orders: [syntheticOrder], periodStats: null, offset: 0, limit: 100, totalCount: 1, hasMore: false, hasPrevious: false }),
              })
            })

            await testPage.goto(process.env.TARGET_URL, { waitUntil: 'networkidle', timeout: 90000 })
            await testPage.waitForTimeout(1200)
            const editButtons = testPage.getByRole('button', { name: 'Редактировать', exact: true })
            const count = await editButtons.count()
            console.log('SYNTHETIC_EDIT_BUTTON_COUNT', count)
            if (!count) throw new Error('Deployed Branch2 bundle did not expose manager edit for the synthetic active/unshipped order')
            await editButtons.first().click()
            await testPage.waitForTimeout(1500)

            const shell = await testPage.locator('.erp-shell').count()
            const editorVisible = await testPage.locator('#editor').isVisible().catch(() => false)
            const editorText = (await testPage.locator('#editor').innerText().catch(() => '')).replace(/\s+/g, ' ')
            const saveButton = testPage.getByRole('button', { name: 'Сохранить изменения', exact: true })
            const saveVisible = await saveButton.isVisible().catch(() => false)
            const saveEnabled = await saveButton.isEnabled().catch(() => false)
            const commentLabel = testPage.locator('#editor label.wide-field').filter({ hasText: /^Комментарий$/ }).first()
            const commentInput = commentLabel.locator('input')
            const originalComment = await commentInput.inputValue()
            await commentInput.fill('__BRANCH2_EDITOR_LOCAL_ONLY__')
            const changedComment = await commentInput.inputValue()
            await commentInput.fill(originalComment)
            const restoredComment = await commentInput.inputValue()

            console.log('SYNTHETIC_AFTER_URL', testPage.url())
            console.log('SYNTHETIC_SHELL_COUNT', shell)
            console.log('SYNTHETIC_EDITOR_VISIBLE', editorVisible)
            console.log('SYNTHETIC_SAVE_VISIBLE', saveVisible)
            console.log('SYNTHETIC_SAVE_ENABLED', saveEnabled)
            console.log('SYNTHETIC_LOCAL_FIELD_CHANGED', changedComment === '__BRANCH2_EDITOR_LOCAL_ONLY__')
            console.log('SYNTHETIC_LOCAL_FIELD_RESTORED', restoredComment === originalComment)
            console.log('SYNTHETIC_PAGE_ERRORS', JSON.stringify(pageErrors))
            console.log('SYNTHETIC_CONSOLE_ERRORS', JSON.stringify(consoleErrors))
            console.log('SYNTHETIC_MUTATING_REQUESTS', JSON.stringify(mutatingRequests))

            if (!testPage.url().endsWith('/#editor')) throw new Error(`Unexpected Branch2 editor URL: ${testPage.url()}`)
            if (!shell || !editorVisible) throw new Error('Branch2 editor disappeared after edit click')
            if (!editorText.toLowerCase().includes('редактирование заказа')) throw new Error('Branch2 editor heading missing')
            if (!saveVisible || !saveEnabled) throw new Error('Branch2 save action is unavailable in manager working mode')
            if (changedComment !== '__BRANCH2_EDITOR_LOCAL_ONLY__' || restoredComment !== originalComment) throw new Error('Branch2 editor form does not accept/revert local field changes')
            if (mutatingRequests.length) throw new Error(`Branch2 smoke unexpectedly sent a mutating request: ${mutatingRequests.join(' | ')}`)
            if (pageErrors.length) throw new Error(`Branch2 synthetic runtime page errors: ${pageErrors.join(' | ')}`)
            if (consoleErrors.some(line => /TypeError|ReferenceError|Failed to fetch dynamically imported module|ChunkLoadError/i.test(line))) throw new Error(`Branch2 synthetic runtime console errors: ${consoleErrors.join(' | ')}`)

            await browser.close()
          })().catch(error => { console.error(error); process.exit(1) })
          NODE
