name: Diagnose reviewed resolver manual tests

on:
  push:
    branches: [branch2]
    paths: [.github/workflows/prepare-reviewed-resolver-tests.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      B2_DB_ID: 40065052-854e-44b8-bcd5-251bdd488301
    steps:
      - name: Diagnose partial UXR1 seed
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local sql="$1"
            curl -sS -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$B2_DB_ID/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" | jq .
          }
          echo '=== ORDERS ==='; q "SELECT id,external_id,shipping_status FROM orders WHERE external_id LIKE 'UXR1-%' ORDER BY id"
          echo '=== ITEMS ==='; q "SELECT o.external_id,oi.id,oi.quantity,oi.is_workshop,oi.variant_id,oi.stock_writeoff_status FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE o.external_id LIKE 'UXR1-%' ORDER BY o.id,oi.id"
          echo '=== WORKSHOP ==='; q "SELECT o.external_id,w.id,w.status,w.order_item_id FROM workshop_tasks w JOIN orders o ON o.id=w.order_id WHERE o.external_id LIKE 'UXR1-%'"
          echo '=== EXCHANGES ==='; q "SELECT o.external_id,e.id,e.status,e.old_order_item_id,e.new_order_item_id FROM exchanges e JOIN orders o ON o.id=e.order_id WHERE o.external_id LIKE 'UXR1-%'"
          echo '=== EXCHANGE ITEMS ==='; q "SELECT o.external_id,ei.id,ei.role,ei.order_item_id,ei.inventory_source FROM exchange_items ei JOIN exchanges e ON e.id=ei.exchange_id JOIN orders o ON o.id=e.order_id WHERE o.external_id LIKE 'UXR1-%'"
          echo '=== RESERVATIONS ==='; q "SELECT o.external_id,r.id,r.status,r.variant_id,r.unresolved_reason FROM inventory_reservations r JOIN orders o ON o.id=r.order_id WHERE o.external_id LIKE 'UXR1-%'"
          echo '=== STOCK ==='; q "SELECT id,variant_id,quantity,reserved_quantity,last_source_ref FROM inventory_stock WHERE last_source_ref='uxr1-manual-tests-20260920'"
