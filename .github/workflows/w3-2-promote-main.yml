name: Promote W3.2 to main

on:
  push:
    branches:
      - safe/w3-2-natural-recovery-20260905

permissions:
  contents: write

jobs:
  promote:
    if: "${{ github.event.head_commit.message == 'chore: promote W3.2 to main' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: safe/w3-2-natural-recovery-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Pin validated source and main baseline
        run: |
          set -euo pipefail
          VALIDATED='aa2ad694cd4edf88a62e461728177c526fdf30ef'
          MAIN_BASE='d52fc13a382ef77e97d9c049d56c7bd005aac5ad'
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          git cat-file -e "$VALIDATED^{commit}"
          echo "VALIDATED=$VALIDATED" >> "$GITHUB_ENV"
          echo "MAIN_BASE=$MAIN_BASE" >> "$GITHUB_ENV"

      - name: Build clean production candidate
        run: |
          set -euo pipefail
          git checkout -B main-candidate origin/main
          git checkout "$VALIDATED" -- \
            src/features/inventory/useInventoryAttentionActions.ts \
            src/features/inventory/views/renderInventoryAttentionPanel.tsx \
            src/features/sections/InventorySection.tsx \
            src/styles/188b-human-inventory-ui.css \
            worker/domains/lifecycle.ts \
            worker/domains/inventory-stocktake.ts \
            scripts/test-stocktake-functional-acceptance.mjs \
            scripts/test-operational-autonomy-r2.mjs \
            scripts/test-w2-human-warehouse.mjs \
            scripts/test-w2-attention-refresh-r1.mjs \
            scripts/test-step1906a-worker-modularization.mjs \
            scripts/test-step1906b-frontend-modularization.mjs \
            scripts/test-step192b2a-daily-warehouse.mjs \
            scripts/test-step192b2a2-attention-context.mjs \
            scripts/test-w3-2-natural-recovery.mjs \
            scripts/w3-2-natural-recovery-frontend-manifest.json \
            scripts/w3-2-natural-recovery-worker-manifest.json \
            package.json \
            docs/continuation/W3_2_NATURAL_RECOVERY_20260905.md
          git diff --check
          git diff --name-only "$MAIN_BASE" -- | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          docs/continuation/W3_2_NATURAL_RECOVERY_20260905.md
          package.json
          scripts/test-operational-autonomy-r2.mjs
          scripts/test-step1906a-worker-modularization.mjs
          scripts/test-step1906b-frontend-modularization.mjs
          scripts/test-step192b2a-daily-warehouse.mjs
          scripts/test-step192b2a2-attention-context.mjs
          scripts/test-stocktake-functional-acceptance.mjs
          scripts/test-w2-attention-refresh-r1.mjs
          scripts/test-w2-human-warehouse.mjs
          scripts/test-w3-2-natural-recovery.mjs
          scripts/w3-2-natural-recovery-frontend-manifest.json
          scripts/w3-2-natural-recovery-worker-manifest.json
          src/features/inventory/useInventoryAttentionActions.ts
          src/features/inventory/views/renderInventoryAttentionPanel.tsx
          src/features/sections/InventorySection.tsx
          src/styles/188b-human-inventory-ui.css
          worker/domains/inventory-stocktake.ts
          worker/domains/lifecycle.ts
          EOF
          sed -i 's/^          //' /tmp/expected-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          if grep -E '(^|/)(migrations?|schema)(/|\.|$)' /tmp/actual-files; then
            echo 'Unexpected migration/schema change'
            exit 1
          fi
          if grep -E '(^\.github/workflows/w3-2-|^scripts/apply-w3-2-|w3-2-trigger)' /tmp/actual-files; then
            echo 'Temporary W3.2 tooling leaked into candidate'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused W3.2 regression
        run: node scripts/test-w3-2-natural-recovery.mjs

      - name: Full cumulative release check
        run: npm run release:check

      - name: Database safety verification
        run: npm run verify:db-safety

      - name: Build
        run: npm run build

      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run

      - name: Commit and push clean Production
        run: |
          set -euo pipefail
          git diff --check
          test "$(git rev-parse origin/main)" = "$MAIN_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/inventory/useInventoryAttentionActions.ts \
            src/features/inventory/views/renderInventoryAttentionPanel.tsx \
            src/features/sections/InventorySection.tsx \
            src/styles/188b-human-inventory-ui.css \
            worker/domains/lifecycle.ts \
            worker/domains/inventory-stocktake.ts \
            scripts/test-stocktake-functional-acceptance.mjs \
            scripts/test-operational-autonomy-r2.mjs \
            scripts/test-w2-human-warehouse.mjs \
            scripts/test-w2-attention-refresh-r1.mjs \
            scripts/test-step1906a-worker-modularization.mjs \
            scripts/test-step1906b-frontend-modularization.mjs \
            scripts/test-step192b2a-daily-warehouse.mjs \
            scripts/test-step192b2a2-attention-context.mjs \
            scripts/test-w3-2-natural-recovery.mjs \
            scripts/w3-2-natural-recovery-frontend-manifest.json \
            scripts/w3-2-natural-recovery-worker-manifest.json \
            package.json \
            docs/continuation/W3_2_NATURAL_RECOVERY_20260905.md
          git diff --cached --check
          git commit -m 'W3.2: make Warehouse recovery natural and secondary'
          git push origin HEAD:main
