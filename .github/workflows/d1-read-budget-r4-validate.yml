name: D1 read budget R4 validate

on:
  push:
    branches: [safe/d1-read-budget-r4-20260902]
    paths:
      - scripts/.d1-read-budget-r4-validate-trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply R4 candidate
        run: python3 scripts/apply-d1-read-budget-r4-v3.py
      - name: Register exact R4 Worker delta
        run: node scripts/register-d1-read-budget-r4.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Database safety
        run: npm run verify:db-safety
      - name: Clean production build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orders-r4-validation"
          git config user.email "orders-r4-validation@users.noreply.github.com"
          git add src/App.tsx worker/domains/orders-read.ts package.json scripts/test-d1-read-budget-r4.mjs scripts/d1-read-budget-r4-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          git diff --cached --check
          git commit -m "Optimize remaining D1 read paths"
          git push origin HEAD:safe/d1-read-budget-r4-20260902
