name: Apply Catalog Integrity Deadends R1 Temp

on:
  push:
    branches:
      - catalog-integrity-deadends-r1
    paths:
      - .github/workflows/apply-catalog-integrity-deadends-r1-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-integrity-deadends-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Patch integrity dead ends
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const readPath = 'worker/domains/inventory-read.ts'
          let read = fs.readFileSync(readPath, 'utf8')
          const oldSelect = "      s.last_action, s.last_source_ref, s.updated_at, s.created_at\n"
          const newSelect = "      s.last_action, s.last_source_ref, s.updated_at, s.created_at,\n      active_variant.is_active AS catalog_variant_active, active_product.is_active AS catalog_product_active\n"
          const oldWhere = "       AND (s.variant_id IS NULL OR (active_variant.is_active = 1 AND active_product.is_active = 1))${searchClauses ? ` AND ${searchClauses}` : ''}\n"
          const newWhere = "       AND (\n         s.variant_id IS NULL\n         OR (active_variant.is_active = 1 AND active_product.is_active = 1)\n         OR COALESCE(s.quantity, 0) <> 0\n         OR COALESCE(s.reserved_quantity, 0) <> 0\n       )${searchClauses ? ` AND ${searchClauses}` : ''}\n"
          const oldMap = "      createdAt: cleanText(row.created_at),\n"
          const newMap = "      createdAt: cleanText(row.created_at),\n      catalogVariantActive: row.catalog_variant_active == null ? null : toInt(row.catalog_variant_active, 0) === 1,\n      catalogProductActive: row.catalog_product_active == null ? null : toInt(row.catalog_product_active, 0) === 1,\n      catalogArchived: Boolean(row.variant_id) && (toInt(row.catalog_variant_active, 0) !== 1 || toInt(row.catalog_product_active, 0) !== 1),\n"
          for (const [oldText, newText, label] of [[oldSelect,newSelect,'inventory select'],[oldWhere,newWhere,'inventory visibility'],[oldMap,newMap,'inventory status map']]) {
            if (!read.includes(oldText)) throw new Error(`Missing ${label} anchor`)
            read = read.replace(oldText, newText)
          }
          fs.writeFileSync(readPath, read)

          const movementPath = 'worker/domains/inventory-movement.ts'
          let movement = fs.readFileSync(movementPath, 'utf8')
          const oldProductType = "  type ProductRow = { id: number; name: string; category: string; external_id?: string | null; is_active?: number };\n"
          const newProductType = "  type ProductRow = { id: number; name: string; category: string; external_id?: string | null; is_active?: number; gender_scope?: string | null };\n"
          const oldProductSelect = "    `SELECT id, name, category, external_id, is_active FROM catalog_products ORDER BY id ASC`\n"
          const newProductSelect = "    `SELECT id, name, category, external_id, is_active, gender_scope FROM catalog_products ORDER BY id ASC`\n"
          const afterProductResolution = "  if (productForItem.some(row => !row?.id)) throw new Error('Не удалось создать или найти товар для складской операции. Обновите каталог и повторите действие.');\n\n"
          const genderBlock = `  const resolvedGenderForItem = rawItems.map((item, index) => {\n    const explicit = normalizeCatalogCombinationGender(item.gender);\n    if (explicit === 'ЖЕН' || explicit === 'МУЖ') return explicit;\n    const scope = cleanText(productForItem[index]?.gender_scope).toLowerCase();\n    if (scope === 'female') return 'ЖЕН';\n    if (scope === 'male') return 'МУЖ';\n    throw new Error('Для товара «Унисекс» выберите пол конкретной вещи: ЖЕН или МУЖ.');\n  });\n\n`
          const oldMissingKey = "    const key = variantKey(toInt(execution.id, 0), item.category, item.gender, item.color, item.size);\n"
          const newMissingKey = "    const gender = resolvedGenderForItem[index];\n    const key = variantKey(toInt(execution.id, 0), item.category, gender, item.color, item.size);\n"
          const oldMissingGender = "    const gender = normalizeCatalogCombinationGender(item.gender);\n"
          const oldReturnLookup = "    const variant = variantByKey.get(variantKey(toInt(execution.id, 0), item.category, item.gender, item.color, item.size));\n"
          const newReturnLookup = "    const resolvedGender = resolvedGenderForItem[index];\n    const variant = variantByKey.get(variantKey(toInt(execution.id, 0), item.category, resolvedGender, item.color, item.size));\n"
          const oldReturnGender = "      gender: normalizeCatalogCombinationGender(item.gender) || null,\n"
          const newReturnGender = "      gender: resolvedGender || null,\n"

          for (const [oldText,newText,label] of [[oldProductType,newProductType,'product type'],[oldProductSelect,newProductSelect,'product select']]) {
            if (!movement.includes(oldText)) throw new Error(`Missing ${label} anchor`)
            movement = movement.replace(oldText,newText)
          }
          if (!movement.includes(afterProductResolution) || movement.includes(genderBlock)) throw new Error('Gender resolution insertion anchor invalid')
          movement = movement.replace(afterProductResolution, afterProductResolution + genderBlock)
          if (!movement.includes(oldMissingKey)) throw new Error('Missing variant key anchor')
          movement = movement.replace(oldMissingKey,newMissingKey)
          const genderIndex = movement.indexOf(oldMissingGender, movement.indexOf(newMissingKey))
          if (genderIndex < 0) throw new Error('Missing obsolete missing-variant gender anchor')
          movement = movement.slice(0, genderIndex) + movement.slice(genderIndex + oldMissingGender.length)
          if (!movement.includes(oldReturnLookup) || !movement.includes(oldReturnGender)) throw new Error('Missing return gender anchors')
          movement = movement.replace(oldReturnLookup,newReturnLookup).replace(oldReturnGender,newReturnGender)
          fs.writeFileSync(movementPath,movement)

          const testPath = 'scripts/test-catalog-integrity-deadends-r1.mjs'
          fs.writeFileSync(testPath, `import fs from 'node:fs'\n\nlet failed = false\nconst check = (condition, message) => { if (!condition) { failed = true; console.error('FAIL:', message) } else console.log('OK:', message) }\nconst read = fs.readFileSync('worker/domains/inventory-read.ts','utf8')\nconst movement = fs.readFileSync('worker/domains/inventory-movement.ts','utf8')\ncheck(read.includes('OR COALESCE(s.quantity, 0) <> 0') && read.includes('OR COALESCE(s.reserved_quantity, 0) <> 0'), 'live stock on archived catalog identities stays visible')\ncheck(read.includes('catalogArchived:'), 'inventory response marks archived catalog identity')\ncheck(movement.includes('SELECT id, name, category, external_id, is_active, gender_scope FROM catalog_products'), 'bulk inventory resolver reuses existing product read for gender scope')\ncheck(movement.includes("if (scope === 'female') return 'ЖЕН'") && movement.includes("if (scope === 'male') return 'МУЖ'"), 'fixed product scope auto-fills inventory gender')\ncheck(movement.includes('Для товара «Унисекс» выберите пол конкретной вещи'), 'unisex blank inventory gender requires human choice')\ncheck(movement.includes("if (explicit === 'ЖЕН' || explicit === 'МУЖ') return explicit"), 'explicit human gender remains authoritative')\nif (failed) process.exit(1)\nconsole.log('Catalog integrity dead ends R1: OK')\n`)

          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath,'utf8'))
          if (!String(pkg.scripts?.['release:check'] || '').includes('test-catalog-integrity-deadends-r1.mjs')) {
            pkg.scripts['release:check'] = `${pkg.scripts['release:check']} && node scripts/test-catalog-integrity-deadends-r1.mjs`
          }
          fs.writeFileSync(packagePath, JSON.stringify(pkg,null,2)+'\n')
          NODE
      - name: Focused checks
        run: |
          node scripts/test-catalog-integrity-deadends-r1.mjs
          npm run build
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/inventory-read.ts worker/domains/inventory-movement.ts scripts/test-catalog-integrity-deadends-r1.mjs package.json
          git commit -m "Keep archived live stock operable and enforce gender defaults"
          git push origin HEAD:catalog-integrity-deadends-r1
