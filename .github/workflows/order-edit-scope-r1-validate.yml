name: Order Edit Scope R1 Validate

on:
  push:
    branches: [safe/order-edit-scope-r1-20260902]
    paths:
      - scripts/.order-edit-scope-r1-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/order-edit-scope-r1-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact order edit scope patch
        run: |
          python3 scripts/apply-order-edit-scope-r1.py
          node scripts/register-order-edit-scope-r1-worker.mjs
      - name: Targeted order edit regression
        run: node scripts/test-order-edit-autonomy.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Database safety gate
        run: npm run verify:db-safety
      - name: Clean production build
        run: |
          rm -rf dist
          npm run build
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run
      - name: Commit validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/orders-write.ts src/App.tsx src/features/sections/OrdersTableSection.tsx src/features/sections/OrderDetailsSection.tsx src/features/sections/OrderEditorSection.tsx scripts/test-order-edit-autonomy.mjs scripts/order-edit-scope-r1-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          if git diff --cached --quiet; then
            echo 'No validated changes to commit'
          else
            git commit -m 'Restore routine editing for closed unshipped orders'
            git push origin HEAD:safe/order-edit-scope-r1-20260902
          fi
