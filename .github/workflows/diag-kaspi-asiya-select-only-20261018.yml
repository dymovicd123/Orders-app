name: Production Kaspi and Asiya audit SELECT only 20261018
on:
  push:
    branches: ['diag/kaspi-asiya-production-audit-20261018']
    paths: ['.github/workflows/diag-kaspi-asiya-select-only-20261018.yml']
permissions:
  contents: read
jobs:
  select-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify locked production identity without deploy
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'diag/kaspi-asiya-production-audit-20261018'
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - name: Read managers, order sources, Kaspi debt and linked operations ONLY
        shell: bash
        run: |
          set -euo pipefail
          queries=(
            "SELECT order_status,shipping_status,CASE WHEN received_amount=0 THEN 'zero' WHEN debt_amount<=0 THEN 'paid' ELSE 'partial' END AS payment_bucket,COUNT(*) AS orders,COALESCE(SUM(total_amount),0) AS total,COALESCE(SUM(received_amount),0) AS received,COALESCE(SUM(debt_amount),0) AS debt FROM orders WHERE UPPER(TRIM(COALESCE(order_payment_method,'')))='КАСПИ МАГАЗИН' GROUP BY order_status,shipping_status,payment_bucket ORDER BY order_status,shipping_status,payment_bucket"
            "SELECT COUNT(*) AS total,COALESCE(SUM(total_amount),0) AS total_amount,COALESCE(SUM(received_amount),0) AS received_amount,COALESCE(SUM(debt_amount),0) AS debt_amount,COALESCE(SUM(CASE WHEN debt_amount>0 THEN 1 ELSE 0 END),0) AS with_debt,COALESCE(SUM(CASE WHEN received_amount>0 AND debt_amount>0 THEN 1 ELSE 0 END),0) AS partial FROM orders WHERE order_status='active' AND UPPER(TRIM(COALESCE(order_payment_method,'')))='КАСПИ МАГАЗИН'"
            "SELECT o.manager_id,COALESCE(m.name,o.manager_snapshot_name,'?') AS manager,COUNT(*) AS orders,COALESCE(SUM(o.debt_amount),0) AS debt,COALESCE(SUM(CASE WHEN o.debt_amount>0 THEN 1 ELSE 0 END),0) AS orders_with_debt FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE o.order_status='active' AND UPPER(TRIM(COALESCE(o.order_payment_method,'')))='КАСПИ МАГАЗИН' GROUP BY o.manager_id,manager ORDER BY debt DESC"
          )
          for i in "${!queries[@]}"; do
            echo "::group::SELECT ONLY $((i+1))"
            npx wrangler d1 execute orders_db_prod --config wrangler.jsonc --remote --command "${queries[$i]}" --json | jq -c '.[0].results'
            echo "::endgroup::"
          done
