name: P0 Branch2 exact hotfix uploaded Worker version GET-only
on:
  push:
    branches: [ops/p0-branch2-controlled-activation-20261030]
    paths:
      - '.github/workflows/p0-branch2-hotfix-version-inspect-once-20261030.yml'
permissions:
  contents: read
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Read only Cloudflare native upload build and exact Worker version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/p0-branch2-pinned-version-from-cloudflare-build-20261030.mjs
          node scripts/ops/p0-branch2-pinned-version-from-cloudflare-build-20261030.mjs
