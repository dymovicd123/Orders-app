name: OPPW4 sharedgpures preflight

on:
  push:
    branches:
      - exp/opppw4-sharedgpures-proton
    paths:
      - .github/workflows/opppw4-sharedgpures-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact Bannerlator Proton packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/opppw4-preflight/downloads
          cd /tmp/opppw4-preflight/downloads

          curl -fL --retry 3 --retry-delay 2 \
            -o ge-full-winedmo-sdk35.wcp \
            'https://github.com/The412Banner/proton-wine/releases/download/gefull-20260624-sdk35/GE-Proton-11.0-1-FULL-arm64ec-bionic-winedmo-sdk35.wcp'

          curl -fL --retry 3 --retry-delay 2 \
            -o proton-10.0-4-arm64ec-sdk35.wcp \
            'https://github.com/The412Banner/proton-wine/releases/download/build-arm64ec-refresh-20260722/proton-10.0-4-arm64ec-sdk35.wcp'

          sha256sum *.wcp | tee /tmp/opppw4-preflight/package-sha256.txt
          file *.wcp | tee /tmp/opppw4-preflight/package-file-types.txt

      - name: Extract WCP packages
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/opppw4-preflight
          mkdir ge p10
          tar -xf downloads/ge-full-winedmo-sdk35.wcp -C ge
          tar -xf downloads/proton-10.0-4-arm64ec-sdk35.wcp -C p10

          echo '=== GE top level ===' | tee package-layout.txt
          find ge -maxdepth 2 -type f -printf '%p\n' | sort | head -200 | tee -a package-layout.txt
          echo '=== P10 top level ===' | tee -a package-layout.txt
          find p10 -maxdepth 2 -type f -printf '%p\n' | sort | head -200 | tee -a package-layout.txt

      - name: Inspect package and prefix shared-GPU files
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/opppw4-preflight
          mkdir -p ge-prefix p10-prefix found/ge found/p10

          {
            echo '=== DIRECT FILE MATCHES IN WCP ==='
            echo '-- GE FULL winedmo --'
            find ge -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print || true
            echo '-- Proton 10.0-4 --'
            find p10 -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print || true
          } | tee sharedgpures-report.txt

          for side in ge p10; do
            prefix="$(find "$side" -type f -name 'prefixPack.txz' -print -quit || true)"
            echo "=== $side prefixPack: ${prefix:-NOT FOUND} ===" | tee -a sharedgpures-report.txt
            if [ -n "$prefix" ]; then
              echo '-- matching archive paths --' | tee -a sharedgpures-report.txt
              tar -tf "$prefix" | grep -Ei 'sharedgpu|shared_gpu|shared.*resource' | tee -a sharedgpures-report.txt || true
              tar -xf "$prefix" -C "${side}-prefix"
            fi
          done

          {
            echo '=== EXTRACTED PREFIX MATCHES ==='
            echo '-- GE FULL winedmo prefix --'
            find ge-prefix -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print || true
            echo '-- Proton 10.0-4 prefix --'
            find p10-prefix -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print || true
          } | tee -a sharedgpures-report.txt

          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp --parents "$f" found/ge/ 2>/dev/null || true
          done < <(find ge ge-prefix -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print)

          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp --parents "$f" found/p10/ 2>/dev/null || true
          done < <(find p10 p10-prefix -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print)

      - name: Compare matching binaries
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/opppw4-preflight
          {
            echo '=== HASHES ==='
            find ge ge-prefix p10 p10-prefix -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
            echo
            echo '=== FILE TYPES ==='
            while IFS= read -r -d '' f; do file "$f"; done < <(find ge ge-prefix p10 p10-prefix -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print0)
            echo
            echo '=== RELEVANT STRINGS ==='
            while IFS= read -r -d '' f; do
              echo "--- $f ---"
              strings -a "$f" | grep -Ei 'SharedGpuResource|shared resource|NtDuplicateObject|ObOpenObjectByPointer|QueryResourceInfo|KMT|DMA-BUF|dmabuf' | head -100 || true
            done < <(find ge ge-prefix p10 p10-prefix -type f \( -iname '*sharedgpu*' -o -iname '*shared_gpu*' -o -iname '*shared*resource*' \) -print0)
          } | tee -a sharedgpures-report.txt

      - name: Search all PE/sys binaries for SharedGpuResource marker
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/opppw4-preflight
          {
            echo '=== MARKER SEARCH (fallback) ==='
            for root in ge ge-prefix p10 p10-prefix; do
              echo "-- $root --"
              find "$root" -type f \( -iname '*.sys' -o -iname '*.dll' -o -iname '*.so' \) -print0 | while IFS= read -r -d '' f; do
                if grep -aEq 'SharedGpuResource|sharedgpures' "$f" 2>/dev/null; then
                  sha256sum "$f"
                  file "$f"
                  echo "$f"
                fi
              done
            done
          } | tee -a sharedgpures-report.txt

      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: opppw4-sharedgpures-preflight
          path: |
            /tmp/opppw4-preflight/sharedgpures-report.txt
            /tmp/opppw4-preflight/package-sha256.txt
            /tmp/opppw4-preflight/package-file-types.txt
            /tmp/opppw4-preflight/package-layout.txt
            /tmp/opppw4-preflight/found
          if-no-files-found: warn
          retention-days: 7
