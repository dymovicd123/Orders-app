name: Apply contextual catalog resolution 20260914

on:
  push:
    branches:
      - fix/contextual-catalog-resolution-20260914
    paths:
      - .github/workflows/apply-contextual-catalog-resolution-20260914.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply source patch
        run: python scripts/patch-contextual-catalog-resolution-20260914.py
      - name: Focused regression
        run: node scripts/test-contextual-catalog-resolution-r1.mjs
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Diff guard
        run: git diff --check
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/catalog-review.ts worker/index.ts src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add contextual catalog resolution before shipping"
          git push origin HEAD:fix/contextual-catalog-resolution-20260914

# R2: route guards corrected; source patch remains identical.
