name: W3.2 Natural recovery

on:
  push:
    branches:
      - safe/w3-2-natural-recovery-20260905

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: "${{ github.event.head_commit.message == 'chore: run W3.2 natural recovery patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: safe/w3-2-natural-recovery-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture accepted Attention baseline
        run: |
          node --input-type=module <<'NODE' > /tmp/w3-2-attention-before
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const normalize = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')
          const text = fs.readFileSync('src/features/inventory/views/renderInventoryAttentionPanel.tsx', 'utf8')
          const source = ts.createSourceFile('renderInventoryAttentionPanel.tsx', text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let fn = null
          const visit = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryAttentionPanel') fn = node; ts.forEachChild(node, visit) }
          source.forEachChild(visit)
          if (!fn?.body) throw new Error('renderInventoryAttentionPanel missing')
          const ret = [...fn.body.statements].find((statement) => ts.isReturnStatement(statement))
          if (!ret?.expression) throw new Error('Attention return missing')
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          const before = sha(normalize(expression.getText(source)))
          const w2 = JSON.parse(fs.readFileSync('scripts/w2-human-warehouse-frontend-manifest.json', 'utf8'))
          if (before !== w2.frontend.attentionReturnChange.after) throw new Error(`W3.2 Attention baseline mismatch: ${before} != ${w2.frontend.attentionReturnChange.after}`)
          console.log(before)
          NODE

      - name: Apply W3.2 patch
        run: python3 scripts/apply-w3-2-natural-recovery.py

      - name: Generate exact W3.2 frontend preservation manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const normalize = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')
          const text = fs.readFileSync('src/features/inventory/views/renderInventoryAttentionPanel.tsx', 'utf8')
          const source = ts.createSourceFile('renderInventoryAttentionPanel.tsx', text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let fn = null
          const visit = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryAttentionPanel') fn = node; ts.forEachChild(node, visit) }
          source.forEachChild(visit)
          if (!fn?.body) throw new Error('renderInventoryAttentionPanel missing')
          const ret = [...fn.body.statements].find((statement) => ts.isReturnStatement(statement))
          if (!ret?.expression) throw new Error('Attention return missing')
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          const before = fs.readFileSync('/tmp/w3-2-attention-before', 'utf8').trim()
          const after = sha(normalize(expression.getText(source)))
          fs.writeFileSync('scripts/w3-2-natural-recovery-frontend-manifest.json', JSON.stringify({
            version: 1,
            revision: 'w3-2-natural-recovery',
            frontend: { attentionReturnChange: { before, after } },
          }, null, 2) + '\n')
          console.log(`W3.2 Attention preservation: ${before} -> ${after}`)
          NODE

      - name: Diff safety
        run: git diff --check

      - name: Focused W3.2 regression
        run: node scripts/test-w3-2-natural-recovery.mjs

      - name: Full cumulative release check
        run: npm run release:check

      - name: Database safety verification
        run: npm run verify:db-safety

      - name: Build
        run: npm run build

      - name: Cloudflare dry run only
        run: npx wrangler deploy --dry-run

      - name: Confirm no migration change
        run: |
          if git diff --name-only | grep -E '(^|/)(migrations?|schema)(/|\.|$)' ; then
            echo 'Unexpected migration/schema change in W3.2'
            exit 1
          fi

      - name: Commit validated W3.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/inventory/useInventoryAttentionActions.ts \
            src/features/inventory/views/renderInventoryAttentionPanel.tsx \
            src/features/sections/InventorySection.tsx \
            src/styles/188b-human-inventory-ui.css \
            worker/domains/lifecycle.ts \
            worker/domains/inventory-stocktake.ts \
            scripts/test-w2-human-warehouse.mjs \
            scripts/test-w2-attention-refresh-r1.mjs \
            scripts/test-step1906b-frontend-modularization.mjs \
            scripts/test-w3-2-natural-recovery.mjs \
            scripts/w3-2-natural-recovery-frontend-manifest.json \
            package.json \
            docs/continuation/W3_2_NATURAL_RECOVERY_20260905.md
          git diff --cached --check
          git commit -m 'W3.2: make Warehouse recovery natural and secondary'
          git push origin HEAD:safe/w3-2-natural-recovery-20260905
