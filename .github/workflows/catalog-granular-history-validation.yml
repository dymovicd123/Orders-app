name: Temporary catalog granular history validation

on:
  push:
    branches:
      - w-catalog-history-ui-branch2-20260930
    paths:
      - 'worker/domains/catalog-retirement.ts'
      - 'worker/domains/catalog.ts'
      - 'src/features/inventory/views/CatalogRetirementHistory.tsx'
      - 'src/features/inventory/views/CatalogVariantGroupRetirementAction.tsx'
      - 'src/features/inventory/views/catalogPolishExecutionGroups.tsx'
      - 'src/styles/w6-3-catalog-polish.css'
      - 'migrations/0079_v72_catalog_granular_retirement_history.sql'
      - 'scripts/test-catalog-granular-retirement-history.mjs'
      - 'scripts/test-catalog-local-retirement.mjs'
      - 'scripts/test-catalog-safe-restore.mjs'
      - 'scripts/test-step1906a-worker-modularization.mjs'
      - 'scripts/test-step1906b-frontend-modularization.mjs'
      - 'scripts/test-step1906c-dead-code-cleanup.mjs'
      - 'scripts/catalog-granular-history-r1-worker-manifest.json'
      - 'scripts/catalog-granular-history-r1-frontend-manifest.json'
      - 'scripts/fixtures/catalog-granular-history-r1/**'
      - 'scripts/release-check.mjs'
      - '.github/workflows/catalog-granular-history-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run build
