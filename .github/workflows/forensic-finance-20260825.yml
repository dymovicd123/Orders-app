name: Finance forensic 2026-08-25

on:
  push:
    branches:
      - forensic-finance-20260825

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Inspect cash register boundaries
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          base="https://orders-app.$subdomain.workers.dev"

          echo "===== CASH STATE ====="
          curl --fail-with-body -sS "$base/api/finance/cash-register" | jq '.'

          echo "===== CASH CYCLES ====="
          curl --fail-with-body -sS "$base/api/finance/cash-register/cycles?limit=50" | jq '.'
