name: Finance forensic 2026-08-25

on:
  push:
    branches:
      - forensic-finance-20260825

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Read-only Primary finance forensic through production API
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_API_TOKEN:-}" ]]; then
            echo "Cloudflare secrets missing" >&2
            exit 2
          fi

          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          if [[ -z "$subdomain" ]]; then
            echo "Could not resolve workers.dev subdomain" >&2
            echo "$subdomain_json" | jq '{success,errors}'
            exit 3
          fi
          base="https://orders-app.$subdomain.workers.dev"
          echo "Resolved production Worker URL"

          finance="$(curl --fail-with-body -sS "$base/api/reports/finance?startDate=2026-08-24&endDate=2026-08-24")"
          active="$(curl --fail-with-body -sS "$base/api/orders?dateFrom=2026-08-24&dateTo=2026-08-24&limit=200&archiveMode=active")"
          all_orders="$(curl --fail-with-body -sS "$base/api/orders?dateFrom=2026-08-24&dateTo=2026-08-24&limit=200&archiveMode=all")"
          archived="$(curl --fail-with-body -sS "$base/api/orders?dateFrom=2026-08-24&dateTo=2026-08-24&limit=200&archiveMode=archived")"

          echo "===== FINANCE_OVERVIEW ====="
          jq '{startDate,endDate,overview,reports:{paymentKinds:.reports.paymentKinds,consistency:.reports.consistency}}' <<<"$finance"

          echo "===== PAYMENT_OPERATIONS ====="
          jq '[.reports.paymentOperations[] | {id,orderId,externalOrderId,orderDate,paymentDate,method,amount,operationType,dateRelation,dateOffsetDays}]' <<<"$finance"

          echo "===== ACTIVE_ORDERS_24 ====="
          jq '{count,orders:[.orders[] | {id,external_id,order_date,total_amount,received_amount,debt_amount,return_amount,order_status,shipping_status}]}' <<<"$active"

          echo "===== ALL_NON_DELETED_ORDERS_24 ====="
          jq '{count,orders:[.orders[] | {id,external_id,order_date,total_amount,received_amount,debt_amount,return_amount,order_status,shipping_status}]}' <<<"$all_orders"

          echo "===== ARCHIVED_ORDERS_24 ====="
          jq '{count,orders:[.orders[] | {id,external_id,order_date,total_amount,received_amount,debt_amount,return_amount,order_status,shipping_status}]}' <<<"$archived"

          echo "===== SUM_CHECKS ====="
          jq -n --argjson active "$active" --argjson all "$all_orders" --argjson archived "$archived" '{activeSum:([$active.orders[].total_amount] | add // 0),allNonDeletedSum:([$all.orders[].total_amount] | add // 0),archivedSum:([$archived.orders[].total_amount] | add // 0),activeCount:($active.orders|length),allCount:($all.orders|length),archivedCount:($archived.orders|length)}'
