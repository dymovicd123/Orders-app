name: Finance forensic 2026-08-25

on:
  push:
    branches:
      - forensic-finance-20260825

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Inspect remaining late primary lineage
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          base="https://orders-app.$subdomain.workers.dev"

          for external in ORD-20260815191304-7791 ORD-20260710-180328-2415; do
            echo "===== ORDER $external ====="
            orders="$(curl --fail-with-body -sS "$base/api/orders?q=$external&archiveMode=all&limit=200")"
            jq '{count,orders}' <<<"$orders"
            echo "===== MONEY HISTORY $external ====="
            history="$(curl --fail-with-body -sS "$base/api/finance/money-history?q=$external&dateFrom=2026-07-01&dateTo=2026-08-25&limit=100")"
            jq '.' <<<"$history"
          done

          echo "===== PAYMENT OPS TARGETS ====="
          finance="$(curl --fail-with-body -sS "$base/api/reports/finance?startDate=2026-07-01&endDate=2026-08-25")"
          jq '[.reports.paymentOperations[] | select(.externalId == "ORD-20260815191304-7791" or .externalId == "ORD-20260710-180328-2415") | {id,orderId,externalId,orderDate,paymentDate,createdAt,paymentKind,operationType,dateRelation,dateOffsetDays,amount,method,manager,customer}]' <<<"$finance"
