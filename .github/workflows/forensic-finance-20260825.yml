name: Finance forensic 2026-08-25

on:
  push:
    branches:
      - forensic-finance-20260825

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Resolve order creation and payment lineage
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          base="https://orders-app.$subdomain.workers.dev"

          for external in ORD-20260824110308-E2CE748F ORD-20260824083328-9B614DAD; do
            echo "===== ORDER $external ====="
            orders="$(curl --fail-with-body -sS "$base/api/orders?q=$external&archiveMode=all&limit=200")"
            jq '{count,orders}' <<<"$orders"
            echo "===== MONEY HISTORY $external ====="
            history="$(curl --fail-with-body -sS "$base/api/finance/money-history?q=$external&dateFrom=2026-08-20&dateTo=2026-08-25&limit=100")"
            jq '.' <<<"$history"
          done
