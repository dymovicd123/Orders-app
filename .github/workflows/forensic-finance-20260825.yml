name: Finance forensic 2026-08-25

on:
  push:
    branches:
      - forensic-finance-20260825

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      D1_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
    steps:
      - name: Read-only Primary finance forensic
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_API_TOKEN:-}" ]]; then
            echo "Cloudflare secrets missing" >&2
            exit 2
          fi

          query() {
            local label="$1"
            local sql="$2"
            echo "===== $label ====="
            if [[ ! "$sql" =~ ^[[:space:]]*SELECT ]]; then
              echo "Non-SELECT SQL blocked" >&2
              exit 3
            fi
            payload="$(jq -nc --arg sql "$sql" '{sql:$sql}')"
            curl --fail-with-body -sS \
              -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$D1_ID/query" \
              -d "$payload" \
              | jq '{success,errors,result:[.result[]? | {results,meta}]}'
          }

          query "ORDERS_2026_08_24" "SELECT id, external_id, order_date, total_amount, received_amount, debt_amount, return_amount, order_status, manager_id FROM orders WHERE order_date = '2026-08-24' ORDER BY id;"
          query "ORDER_TOTALS_BY_STATUS_2026_08_24" "SELECT order_status, COUNT(*) AS order_count, COALESCE(SUM(total_amount),0) AS total_sales, COALESCE(SUM(received_amount),0) AS order_received, COALESCE(SUM(debt_amount),0) AS debt FROM orders WHERE order_date = '2026-08-24' GROUP BY order_status ORDER BY order_status;"
          query "PAYMENTS_MADE_2026_08_24" "SELECT p.id, p.order_id, o.external_id, o.order_date, p.payment_date, p.method, p.amount, p.payment_kind, o.order_status FROM payments p JOIN orders o ON o.id = p.order_id WHERE p.payment_date = '2026-08-24' AND o.order_status <> 'deleted' ORDER BY p.id;"
          query "PRIMARY_PAYMENTS_BY_ORDER_DATE_2026_08_24" "SELECT o.order_date, COUNT(*) AS payment_rows, COALESCE(SUM(p.amount),0) AS total FROM payments p JOIN orders o ON o.id = p.order_id WHERE p.payment_date = '2026-08-24' AND o.order_status <> 'deleted' AND p.payment_kind NOT IN ('debt_close','extra') AND NOT EXISTS (SELECT 1 FROM exchanges e WHERE e.payment_id = p.id AND COALESCE(e.status,'completed') <> 'cancelled' AND e.financial_action = 'extra_payment') GROUP BY o.order_date ORDER BY o.order_date;"
          query "NON_24_ORDER_PRIMARY_PAYMENTS" "SELECT p.id, p.order_id, o.external_id, o.order_date, p.amount, p.method, p.payment_kind, o.order_status FROM payments p JOIN orders o ON o.id = p.order_id WHERE p.payment_date = '2026-08-24' AND o.order_status <> 'deleted' AND o.order_date <> '2026-08-24' AND p.payment_kind NOT IN ('debt_close','extra') AND NOT EXISTS (SELECT 1 FROM exchanges e WHERE e.payment_id = p.id AND COALESCE(e.status,'completed') <> 'cancelled' AND e.financial_action = 'extra_payment') ORDER BY p.id;"
          query "DEBT_CLOSE_2026_08_24" "SELECT p.id, p.order_id, o.external_id, o.order_date, p.amount, p.method, o.order_status FROM payments p JOIN orders o ON o.id = p.order_id WHERE p.payment_date = '2026-08-24' AND p.payment_kind = 'debt_close' AND o.order_status <> 'deleted' ORDER BY p.id;"
          query "FORTY_THOUSAND_ORDERS_2026_08_24" "SELECT id, external_id, total_amount, received_amount, debt_amount, return_amount, order_status, manager_id FROM orders WHERE order_date = '2026-08-24' AND (total_amount = 40000 OR received_amount = 40000 OR debt_amount = 40000) ORDER BY id;"
