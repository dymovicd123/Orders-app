name: Finance forensic 2026-08-25

on:
  push:
    branches:
      - forensic-finance-20260825

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Audit finance date relations
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          base="https://orders-app.$subdomain.workers.dev"
          finance="$(curl --fail-with-body -sS "$base/api/reports/finance?startDate=2026-01-01&endDate=2026-08-25")"

          echo "===== OVERVIEW ====="
          jq '{startDate,endDate,overview,reconciliation:.reports.consistency}' <<<"$finance"

          echo "===== DATE_RELATION_BY_KIND ====="
          jq '[.reports.paymentOperations[] | {operationType,dateRelation}] | group_by([.operationType,.dateRelation]) | map({operationType:.[0].operationType,dateRelation:.[0].dateRelation,count:length})' <<<"$finance"

          echo "===== NON_SAME_DAY_OPERATIONS ====="
          jq '[.reports.paymentOperations[] | select(.dateRelation != "same_day") | {id,orderId,externalId,orderDate,paymentDate,createdAt,paymentKind,operationType,dateRelation,dateOffsetDays,amount,method,manager,customer}]' <<<"$finance"

          echo "===== PRIMARY_AFTER_ORDER ====="
          jq '[.reports.paymentOperations[] | select(.operationType == "order_payment" and .dateRelation == "after_order") | {id,orderId,externalId,orderDate,paymentDate,createdAt,dateOffsetDays,amount,method,manager,customer}]' <<<"$finance"

          echo "===== PRIMARY_BEFORE_ORDER ====="
          jq '[.reports.paymentOperations[] | select(.operationType == "order_payment" and .dateRelation == "before_order") | {id,orderId,externalId,orderDate,paymentDate,createdAt,dateOffsetDays,amount,method,manager,customer}]' <<<"$finance"

          echo "===== DEBT_CLOSE_RELATIONS ====="
          jq '[.reports.paymentOperations[] | select(.operationType == "debt_close") | {id,orderId,externalId,orderDate,paymentDate,createdAt,dateRelation,dateOffsetDays,amount,method,manager}]' <<<"$finance"

          echo "===== PAYMENT_TOTALS_BY_KIND ====="
          jq '.reports.paymentKinds' <<<"$finance"
