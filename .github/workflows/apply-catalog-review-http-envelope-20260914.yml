name: Apply catalog review HTTP envelope fix 20260914

on:
  push:
    branches:
      - fix/catalog-review-http-envelope-20260914
    paths:
      - .github/workflows/apply-catalog-review-http-envelope-20260914.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-review-http-envelope-20260914
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply guarded patch
        run: python scripts/apply-catalog-review-http-envelope-20260914.py
      - run: npm ci
      - name: Focused regression
        run: node scripts/test-contextual-catalog-resolution-r1.mjs
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff guard
        run: git diff --check
      - name: Commit guarded fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add src/App.tsx src/app/utils.ts scripts/test-contextual-catalog-resolution-r1.mjs scripts/contextual-catalog-resolution-r1-frontend-manifest.json scripts/test-step1906b-frontend-modularization.mjs
          git commit -m "fix: open catalog resolver for non-2xx shipping blockers"
          git push origin HEAD:fix/catalog-review-http-envelope-20260914
