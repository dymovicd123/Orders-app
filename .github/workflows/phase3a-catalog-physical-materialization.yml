name: Phase 3A catalog physical materialization

on:
  push:
    branches:
      - safe/phase3a-catalog-physical-materialization-20260827
    paths:
      - .github/workflows/phase3a-catalog-physical-materialization.yml

permissions:
  contents: write

jobs:
  phase3a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/phase3a-catalog-physical-materialization-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Phase 3A source and regression boundaries
        shell: bash
        run: |
          set -euo pipefail
          cp worker/domains/order-reservations.ts /tmp/order-reservations.before.ts
          cp worker/domains/catalog-review.ts /tmp/catalog-review.before.ts
          cp worker/domains/inventory-movement.ts /tmp/inventory-movement.before.ts
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'start marker missing in {path}: {start}')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f'end marker missing in {path}: {end}')
              p.write_text(text[:a] + replacement.rstrip() + text[b:])

          p = Path('worker/domains/order-reservations.ts')
          text = p.read_text()
          text = text.replace(
              "import { catalogReferenceDbValueExists, catalogReferenceValueExists, createCatalogCombinationV3, ensureCatalogExecutionV3, findCatalogCombinationV3, findCatalogExecutionV3, findCatalogProductByIdentity, isCatalogIdentityV3Enabled, isHumanInventoryModelEnabled, loadCanonicalVariantSnapshot, makeVariantExternalId, normalizeCatalogCombinationColor, normalizeCatalogCombinationGender, normalizeCatalogCombinationSize, resolveCatalogValueAlias } from './catalog.ts'",
              "import { catalogReferenceDbValueExists, catalogReferenceValueExists, findCatalogCombinationV3, findCatalogExecutionV3, findCatalogProductByIdentity, isCatalogIdentityV3Enabled, isHumanInventoryModelEnabled, loadCanonicalVariantSnapshot, makeVariantExternalId, normalizeCatalogCombinationColor, normalizeCatalogCombinationGender, normalizeCatalogCombinationSize, resolveCatalogValueAlias } from './catalog.ts'",
          )
          p.write_text(text)

          replace_between(
              'worker/domains/order-reservations.ts',
              'export async function resolveCatalogProductAndVariantV2(',
              '\n\nexport async function resolveCatalogProductAndVariant(',
              r'''export async function resolveCatalogProductAndVariantV2(
            db: D1Database,
            item: ReturnType<typeof normalizeOrderItems>[number],
          ): Promise<ResolvedOrderCatalogReference> {
            if (!await isCatalogIdentityV3Enabled(db)) return await resolveCatalogProductAndVariantV2Flat(db, item);
            const inputKey = catalogOrderInputKey(item);
            const product = await findCatalogProductByIdentity(db, item.productName, 0, { activeOnly: true }) as { id: number; name: string; category: string } | null;
            if (!product?.id) return { productId: null, variantId: null, matchStatus: 'unresolved_product', inputKey };

            const category = normalizeAudienceCategory(item.category, item.size);
            const material = await resolveCatalogValueAlias(db, 'material', canonicalStockPositionValue(item.material));
            const length = await resolveCatalogValueAlias(db, 'length', canonicalStockPositionValue(item.length));
            const gender = normalizeCatalogCombinationGender(item.gender);
            const rawColor = upperText(item.color);
            const color = await resolveCatalogValueAlias(db, 'color', normalizeCatalogCombinationColor(item.color));
            const size = await resolveCatalogValueAlias(db, category === 'child' ? 'child_age' : 'size', normalizeCatalogCombinationSize(item.size));

            // Phase 3A: order entry is lookup-only. An order expresses demand; it must not
            // manufacture a Warehouse/Boutique SKU merely because all typed values are known.
            // New executions/combinations are materialized by physical stock facts such as
            // arrival, found-on-stocktake and explicit stock-affecting lifecycle resolution.
            const existingExecution = await findCatalogExecutionV3(db, product.id, material, length);
            if (existingExecution?.id) {
              const existing = await findCatalogCombinationV3(db, existingExecution.id, category, gender, color, size);
              if (existing?.id) {
                let omittedColorConflictsWithConcreteSibling = false;
                if (!rawColor) {
                  const profile = await db.prepare(
                    `SELECT MAX(CASE WHEN TRIM(COALESCE(color,'')) <> '' AND UPPER(TRIM(color)) <> 'БЕЗ ЦВЕТА' THEN 1 ELSE 0 END) AS has_color
                     FROM catalog_variants
                     WHERE product_id = ? AND stock_position_id = ? AND is_active = 1
                       AND COALESCE(category,'adult') = ?`
                  ).bind(product.id, existingExecution.id, category).first<{ has_color: number }>();
                  omittedColorConflictsWithConcreteSibling = toInt(profile?.has_color, 0) > 0;
                }
                if (!omittedColorConflictsWithConcreteSibling) {
                  return { productId: toInt(product.id, 0) || null, variantId: toInt(existing.id, 0) || null, matchStatus: 'matched', inputKey };
                }
                return { productId: toInt(product.id, 0) || null, variantId: null, matchStatus: 'unresolved_attribute', inputKey };
              }
            }

            // Blank color is never interpreted as permission to invent a no-color SKU.
            if (!rawColor) {
              return { productId: toInt(product.id, 0) || null, variantId: null, matchStatus: 'unresolved_attribute', inputKey };
            }

            // Unknown dictionary values remain ambiguity, not catalog creation.
            const sizeKind = category === 'child' ? 'child_age' : 'size';
            if (
              !await catalogReferenceDbValueExists(db, 'material', material)
              || !await catalogReferenceDbValueExists(db, 'length', length)
              || (gender && gender !== 'ЖЕН' && gender !== 'МУЖ')
              || (upperText(item.color) && !await catalogReferenceValueExists(db, 'color', color))
              || (size && !await catalogReferenceValueExists(db, sizeKind, size))
            ) {
              return { productId: toInt(product.id, 0) || null, variantId: null, matchStatus: 'unresolved_attribute', inputKey };
            }

            if (!existingExecution?.id) {
              return { productId: toInt(product.id, 0) || null, variantId: null, matchStatus: 'unresolved_execution', inputKey };
            }

            // A historical alias is accepted only when it independently points to the exact
            // already-existing execution and dimensions. It is never allowed to create identity.
            try {
              const alias = await db.prepare(
                `SELECT v.id AS variant_id, v.product_id, v.stock_position_id,
                        COALESCE(v.category, 'adult') AS category, COALESCE(v.gender, '') AS gender,
                        COALESCE(v.color, '') AS color, COALESCE(v.size_label, '') AS size_label
                 FROM catalog_input_aliases a
                 JOIN catalog_variants v ON v.id = a.variant_id
                 JOIN catalog_products p ON p.id = v.product_id
                 WHERE a.input_key = ? AND v.is_active = 1 AND p.is_active = 1
                 LIMIT 1`
              ).bind(inputKey).first<{
                variant_id: number; product_id: number; stock_position_id: number | null;
                category: string; gender: string; color: string; size_label: string;
              }>();
              if (
                alias?.variant_id && alias?.product_id === product.id && alias.stock_position_id === existingExecution.id
                && cleanText(alias.category) === category
                && normalizeCatalogCombinationGender(alias.gender) === gender
                && normalizeCatalogCombinationColor(alias.color) === color
                && normalizeCatalogCombinationSize(alias.size_label) === size
              ) {
                return { productId: product.id, variantId: toInt(alias.variant_id, 0) || null, matchStatus: 'alias', inputKey };
              }
            } catch {
              // Alias table is additive. Canonical lookup remains authoritative if unavailable.
            }

            return { productId: toInt(product.id, 0) || null, variantId: null, matchStatus: 'unresolved_variant', inputKey };
          }'''
          )

          p = Path('worker/domains/catalog-review.ts')
          text = p.read_text()
          text = text.replace(
              "import type { ReferenceKind } from '../core/types.ts'\n",
              "",
          )
          text = text.replace(
              "import { assertCatalogProductAliasTargetAvailable, catalogReferenceDbValueExists, createCatalogCombinationV3, createCatalogProduct, ensureCatalogExecutionV3, findCatalogCombinationV3, findCatalogExecutionV3, findCatalogProductByIdentity, makeVariantExternalId, normalizeCatalogCombinationColor, normalizeCatalogCombinationGender, normalizeCatalogCombinationSize, rememberCatalogProductAlias, rememberCatalogValueAlias, resolveCatalogValueAlias } from './catalog.ts'",
              "import { assertCatalogProductAliasTargetAvailable, catalogReferenceDbValueExists, createCatalogProduct, findCatalogCombinationV3, findCatalogExecutionV3, findCatalogProductByIdentity, normalizeCatalogCombinationColor, normalizeCatalogCombinationGender, normalizeCatalogCombinationSize, rememberCatalogProductAlias, rememberCatalogValueAlias, resolveCatalogValueAlias } from './catalog.ts'",
          )
          text = text.replace("import { upsertReferenceValue } from './references.ts'\n", "")
          p.write_text(text)

          replace_between(
              'worker/domains/catalog-review.ts',
              'export async function resolveCatalogReviewFacts(',
              '\n\n\nexport async function excludeCatalogReviewQueueItem(',
              r'''export async function resolveCatalogReviewFacts(db: D1Database, orderItemId: number, input: CatalogReviewFactsInput): Promise<CatalogResolutionResponse> {
            const anchor = await db.prepare(
              `SELECT oi.*, o.external_id, o.shipping_status, o.shipping_date, o.order_status, o.archived_at
               FROM order_items oi JOIN orders o ON o.id = oi.order_id WHERE oi.id = ? LIMIT 1`
            ).bind(orderItemId).first<Record<string, unknown>>();
            if (!anchor?.id) throw new Error('Позиция заказа для разбора не найдена.');
            const inputKey = normalizedCatalogReviewKey(anchor);
            const candidates = await fetchCatalogReviewResolutionCandidates(db, toInt(anchor.order_id, 0));
            const matching = (candidates.results || []).filter((row) => normalizedCatalogReviewKey(row) === inputKey);
            if (!matching.length) throw new Error('Эта задача уже разобрана. Обновите список.');

            const workshopRows = matching.filter((row) => toInt(row.is_workshop, 0) === 1);
            const normalRows = matching.filter((row) => toInt(row.is_workshop, 0) !== 1);
            const category = normalizeAudienceCategory(input.category ?? anchor.audience_type, input.size ?? anchor.size_snapshot);
            const createProduct = Boolean(input.createProduct);
            let productId = Math.max(0, toInt(input.productId, 0));
            const requestedProductName = cleanText(input.productName) || cleanText(anchor.product_name_snapshot);

            let product: { id: number; name: string } | null = null;
            if (productId) {
              product = await db.prepare(`SELECT id, name FROM catalog_products WHERE id = ? AND is_active = 1 LIMIT 1`).bind(productId).first<{ id: number; name: string }>();
              if (!product?.id) throw new Error('Выбранный товар не найден или отключён.');
            } else if (!createProduct) {
              throw new Error('Выберите существующий товар или явно подтвердите создание нового базового товара.');
            } else {
              if (!requestedProductName) throw new Error('Введите название нового товара для каталога.');
              const duplicate = await findCatalogProductByIdentity(db, requestedProductName);
              if (duplicate?.id) throw new Error(`Такой базовый товар уже существует: ${cleanText(duplicate.name)}. Выберите его вместо создания дубля.`);
            }

            // Alias conflicts are checked before any allowed base-product creation.
            await assertCatalogProductAliasTargetAvailable(db, anchor.product_name_snapshot, product?.id || 0);

            const material = await resolveCatalogValueAlias(db, 'material', canonicalStockPositionValue(input.material ?? anchor.material_snapshot));
            const length = await resolveCatalogValueAlias(db, 'length', canonicalStockPositionValue(input.length ?? anchor.length_snapshot));
            const gender = normalizeCatalogCombinationGender(input.gender ?? anchor.gender_snapshot);
            const color = await resolveCatalogValueAlias(db, 'color', normalizeCatalogCombinationColor(input.color ?? anchor.color_snapshot));
            const size = await resolveCatalogValueAlias(db, category === 'child' ? 'child_age' : 'size', normalizeCatalogCombinationSize(input.size ?? anchor.size_snapshot));

            // Pure Workshop resolution intentionally stops at the base product.
            if (!normalRows.length) {
              if (!product?.id) {
                const created = await createCatalogProduct(db, { name: requestedProductName, category });
                productId = toInt(created.id, 0);
                product = { id: productId, name: cleanText(created.name) };
              }
              if (!product?.id) throw new Error('Не удалось определить базовый товар.');
              const timestamp = new Date().toISOString();
              await rememberCatalogProductAlias(db, anchor.product_name_snapshot, product.id, timestamp);
              let workshopLinked = 0;
              for (const row of workshopRows) {
                const id = toInt(row.id ?? row.order_item_id, 0);
                if (!id) continue;
                await db.prepare(`UPDATE order_items SET product_id = ?, variant_id = NULL, stock_writeoff_status = 'workshop' WHERE id = ?`).bind(product.id, id).run();
                await db.prepare(`UPDATE workshop_tasks SET product_id = ?, variant_id = NULL, updated_at = ? WHERE order_item_id = ?`).bind(product.id, timestamp, id).run();
                workshopLinked += 1;
              }
              return { ok: true, linked: workshopLinked, workshopLinked, message: `Цеховая позиция связана с товаром «${cleanText(product.name)}». Складская комбинация для неё не требуется.` };
            }

            if (gender && gender !== 'ЖЕН' && gender !== 'МУЖ') throw new Error('Пол должен быть выбран из списка.');

            // Phase 3A: ordinary order review may create/confirm the BASE product, but it may
            // only link an already-existing physical execution/variation. It must not create
            // reference values, executions or catalog_variants from demand alone.
            if (!product?.id) {
              const created = await createCatalogProduct(db, { name: requestedProductName, category });
              productId = toInt(created.id, 0);
              product = { id: productId, name: cleanText(created.name) };
            }
            if (!product?.id) throw new Error('Не удалось определить базовый товар.');

            const execution = await findCatalogExecutionV3(db, product.id, material, length);
            const combination = execution?.id
              ? await findCatalogCombinationV3(db, execution.id, category, gender, color, size)
              : null;
            if (!combination?.id) {
              throw new Error('Такой складской вариант ещё не зарегистрирован физической операцией. Разбор заказа не создаёт новые исполнения или вариации: они появятся после прихода, ревизии или другого явного движения товара.');
            }

            const timestamp = new Date().toISOString();
            const selected = await db.prepare(
              `SELECT v.id AS variant_id, v.product_id, p.name AS product_name, COALESCE(v.category, p.category, 'adult') AS category,
                      v.gender, v.color, v.material, v.length, v.size_label
               FROM catalog_variants v JOIN catalog_products p ON p.id = v.product_id
               WHERE v.id = ? AND v.is_active = 1 AND p.is_active = 1 LIMIT 1`
            ).bind(combination.id).first<CatalogReviewSelectedVariant>();
            if (!selected?.variant_id) throw new Error('Не удалось получить существующую комбинацию товара.');

            await rememberCatalogProductAlias(db, anchor.product_name_snapshot, product.id, timestamp);
            await rememberCatalogValueAlias(db, 'material', anchor.material_snapshot, material, timestamp);
            await rememberCatalogValueAlias(db, 'length', anchor.length_snapshot, length, timestamp);
            await rememberCatalogValueAlias(db, 'color', anchor.color_snapshot, color, timestamp);
            await rememberCatalogValueAlias(db, category === 'child' ? 'child_age' : 'size', anchor.size_snapshot, size, timestamp);
            const result = await resolveCatalogReviewRows(db, matching, selected, inputKey, timestamp, { writeAlias: false });
            const workshopLinked = matching.filter((row) => toInt(row.is_workshop, 0) === 1 && toInt(row.id ?? row.order_item_id, 0) > 0 && toInt(row.order_id, 0) > 0).length;
            return {
              ...result,
              workshopLinked,
              createdCombination: false,
              message: `Позиции связаны с существующей складской комбинацией: ${result.linked}.`,
            };
          }'''
          )

          p = Path('worker/domains/inventory-movement.ts')
          text = p.read_text()
          old = "export async function resolveInventoryCreatableItemsBulk(\n  db: D1Database,\n  rawItems: ReturnType<typeof normalizeInventoryItem>[],\n): Promise<InventoryResolvedItem[]> {\n  if (!rawItems.length) return [];"
          new = "export async function resolveInventoryCreatableItemsBulk(\n  db: D1Database,\n  rawItems: ReturnType<typeof normalizeInventoryItem>[],\n  options: { allowCatalogMaterialization?: boolean } = {},\n): Promise<InventoryResolvedItem[]> {\n  if (!rawItems.length) return [];\n  const allowCatalogMaterialization = options.allowCatalogMaterialization !== false;"
          if old not in text: raise SystemExit('inventory resolver signature marker missing')
          text = text.replace(old, new, 1)
          old = "  if (!await isCatalogIdentityV3Enabled(db)) {\n    const fallback: InventoryResolvedItem[] = [];"
          new = "  if (!await isCatalogIdentityV3Enabled(db)) {\n    if (!allowCatalogMaterialization) throw new Error('Эта операция требует уже существующую складскую комбинацию. Обновите данные и выберите зарегистрированный вариант.');\n    const fallback: InventoryResolvedItem[] = [];"
          if old not in text: raise SystemExit('inventory legacy fallback marker missing')
          text = text.replace(old, new, 1)
          old = "  if (missingProducts.size) {\n    const missingProductsJson"
          new = "  if (missingProducts.size) {\n    if (!allowCatalogMaterialization) throw new Error('Эта операция не может создавать новый товар или складскую комбинацию. Сначала зарегистрируйте физический товар через приход или ревизию.');\n    const missingProductsJson"
          if old not in text: raise SystemExit('missingProducts marker missing')
          text = text.replace(old, new, 1)
          old = "  if (missingExecutions.size) {\n    const executionJson"
          new = "  if (missingExecutions.size) {\n    if (!allowCatalogMaterialization) throw new Error('Эта операция не может создавать новое исполнение товара. Используйте уже зарегистрированную складскую комбинацию.');\n    const executionJson"
          if old not in text: raise SystemExit('missingExecutions marker missing')
          text = text.replace(old, new, 1)
          old = "  if (missingVariants.size) {\n    const variantsJson"
          new = "  if (missingVariants.size) {\n    if (!allowCatalogMaterialization) throw new Error('Эта операция не может создавать новую вариацию товара. Она должна сначала появиться из физического прихода, ревизии или другого явного приёма.');\n    const variantsJson"
          if old not in text: raise SystemExit('missingVariants marker missing')
          text = text.replace(old, new, 1)
          old = "    const createdResolved = await resolveInventoryCreatableItemsBulk(db, creatableRaw);"
          new = "    const createdResolved = await resolveInventoryCreatableItemsBulk(db, creatableRaw, {\n      allowCatalogMaterialization: ['arrival', 'return', 'revision'].includes(movementType),\n    });"
          if old not in text: raise SystemExit('inventory bulk call marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Structural allow-list: Phase 3A is chained after the already accepted Phase 1B hash.
          p = Path('scripts/test-step1906a-worker-modularization.mjs')
          text = p.read_text()
          text = text.replace(
              "const phase1bWorkshopReturnDispositionPath = path.join(root, 'scripts/phase1b-workshop-return-disposition-worker-manifest.json')\n",
              "const phase1bWorkshopReturnDispositionPath = path.join(root, 'scripts/phase1b-workshop-return-disposition-worker-manifest.json')\nconst phase3aCatalogMaterializationPath = path.join(root, 'scripts/phase3a-catalog-physical-materialization-worker-manifest.json')\n",
              1,
          )
          text = text.replace(
              "  const phase1bWorkshopReturnDispositionChanges = phase1bWorkshopReturnDisposition.changes || {}\n",
              "  const phase1bWorkshopReturnDispositionChanges = phase1bWorkshopReturnDisposition.changes || {}\n  check(fs.existsSync(phase3aCatalogMaterializationPath), 'Phase 3A catalog physical-materialization Worker manifest missing')\n  const phase3aCatalogMaterialization = JSON.parse(fs.readFileSync(phase3aCatalogMaterializationPath, 'utf8'))\n  check(phase3aCatalogMaterialization?.version === 1 && phase3aCatalogMaterialization?.revision === 'phase3a-catalog-physical-materialization-r1', 'Phase 3A catalog physical-materialization Worker manifest invalid')\n  const phase3aCatalogMaterializationChanges = phase3aCatalogMaterialization.changes || {}\n",
              1,
          )
          old = """    const phase1bWorkshopReturnDispositionChanged = phase1bWorkshopReturnDispositionChanges[name]\n    if (phase1bWorkshopReturnDispositionChanged) {\n      check(phase1bWorkshopReturnDispositionChanged.before === acceptedPostFinanceF9DatePriorityHash, `Phase 1B Workshop return disposition baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === phase1bWorkshopReturnDispositionChanged.after, `Worker declaration changed beyond exact Phase 1B Workshop return disposition allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostFinanceF9DatePriorityHash, `Worker declaration body changed beyond accepted Finance F1-F9 / Phase 1B deltas: ${name}`)\n    }\n"""
          new = """    const phase1bWorkshopReturnDispositionChanged = phase1bWorkshopReturnDispositionChanges[name]\n    let acceptedPostPhase1bWorkshopReturnDispositionHash = acceptedPostFinanceF9DatePriorityHash\n    if (phase1bWorkshopReturnDispositionChanged) {\n      check(phase1bWorkshopReturnDispositionChanged.before === acceptedPostFinanceF9DatePriorityHash, `Phase 1B Workshop return disposition baseline hash mismatch: ${name}`)\n      acceptedPostPhase1bWorkshopReturnDispositionHash = phase1bWorkshopReturnDispositionChanged.after\n    }\n    const phase3aCatalogMaterializationChanged = phase3aCatalogMaterializationChanges[name]\n    if (phase3aCatalogMaterializationChanged) {\n      check(phase3aCatalogMaterializationChanged.before === acceptedPostPhase1bWorkshopReturnDispositionHash, `Phase 3A catalog physical-materialization baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === phase3aCatalogMaterializationChanged.after, `Worker declaration changed beyond exact Phase 3A catalog physical-materialization allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostPhase1bWorkshopReturnDispositionHash, `Worker declaration body changed beyond accepted Finance F1-F9 / Phase 1B / Phase 3A deltas: ${name}`)\n    }\n"""
          if old not in text: raise SystemExit('1906A final Phase1B hash block marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Wire permanent Phase 3A regression into the full release gate.
          p = Path('package.json')
          text = p.read_text()
          old = 'node scripts/test-phase2-smart-daily-stock.mjs && node scripts/test-stocktake-functional-acceptance.mjs'
          new = 'node scripts/test-phase2-smart-daily-stock.mjs && node scripts/test-phase3a-catalog-physical-materialization.mjs && node scripts/test-stocktake-functional-acceptance.mjs'
          if old not in text: raise SystemExit('package release:check marker missing')
          p.write_text(text.replace(old, new, 1))
          PY

          cat > scripts/test-phase3a-catalog-physical-materialization.mjs <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'

          const root = process.cwd()
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8')
          const check = (condition, message) => { if (!condition) throw new Error(message) }
          function section(text, startMarker, endMarker) {
            const start = text.indexOf(startMarker)
            check(start >= 0, `Section start missing: ${startMarker}`)
            const end = text.indexOf(endMarker, start + startMarker.length)
            check(end > start, `Section end missing: ${endMarker}`)
            return text.slice(start, end)
          }

          try {
            const reservations = read('worker/domains/order-reservations.ts')
            const review = read('worker/domains/catalog-review.ts')
            const movement = read('worker/domains/inventory-movement.ts')
            const stocktake = read('worker/domains/inventory-stocktake.ts')
            const lifecycle = read('worker/domains/lifecycle.ts')
            const catalog = read('worker/domains/catalog.ts')
            const pkg = JSON.parse(read('package.json'))

            const orderResolver = section(reservations, 'export async function resolveCatalogProductAndVariantV2(', 'export async function resolveCatalogProductAndVariant(')
            check(orderResolver.includes('order entry is lookup-only'), 'Ordinary order resolver is not explicitly lookup-only')
            check(orderResolver.includes("matchStatus: 'unresolved_execution'") && orderResolver.includes("matchStatus: 'unresolved_variant'"), 'Missing execution/variation is not preserved as unresolved demand')
            for (const forbidden of ['ensureCatalogExecutionV3(', 'createCatalogCombinationV3(', 'INSERT INTO catalog_stock_positions', 'INSERT INTO catalog_variants']) {
              check(!orderResolver.includes(forbidden), `Ordinary order resolver can still materialize catalog identity via ${forbidden}`)
            }

            const workshopResolver = section(reservations, 'export async function resolveWorkshopCatalogProductOnly(', 'export async function ensureHumanInventoryStockRow(')
            check(workshopResolver.includes('variantId: null'), 'Workshop resolver no longer stops at base product')

            const reviewResolver = section(review, 'export async function resolveCatalogReviewFacts(', 'export async function excludeCatalogReviewQueueItem(')
            check(reviewResolver.includes('only link an already-existing physical execution/variation'), 'Catalog review does not encode lookup-only normal-order semantics')
            check(reviewResolver.includes('findCatalogExecutionV3') && reviewResolver.includes('findCatalogCombinationV3'), 'Catalog review cannot link an existing physical combination')
            check(reviewResolver.includes('Разбор заказа не создаёт новые исполнения или вариации'), 'Catalog review lacks a clear physical-registration boundary')
            for (const forbidden of ['ensureCatalogExecutionV3(', 'createCatalogCombinationV3(', 'upsertReferenceValue(']) {
              check(!reviewResolver.includes(forbidden), `Catalog review can still create non-physical SKU identity via ${forbidden}`)
            }
            check(reviewResolver.includes('createCatalogProduct('), 'Explicit base-product creation was accidentally removed from catalog review')

            const bulkResolver = section(movement, 'export async function resolveInventoryCreatableItemsBulk(', 'export async function applyInventoryMovement(')
            check(bulkResolver.includes('allowCatalogMaterialization'), 'Inventory resolver has no explicit materialization policy')
            check(bulkResolver.includes('if (!allowCatalogMaterialization)'), 'Inventory resolver does not fail closed when materialization is forbidden')
            const movementApply = section(movement, 'export async function applyInventoryMovement(', 'export type PreparedInventoryTransferItem')
            check(movementApply.includes("allowCatalogMaterialization: ['arrival', 'return', 'revision'].includes(movementType)"), 'Inventory materialization is not limited to physical intake/revision movement kinds')

            const stocktakeAdd = section(stocktake, 'export async function addInventoryStocktakeCombination(', 'export async function listInventoryCycleCountSuggestions(')
            check(stocktakeAdd.includes('ensureCatalogExecutionV3') && stocktakeAdd.includes('INSERT OR IGNORE INTO catalog_variants'), 'Found-on-stocktake can no longer materialize physical catalog identity')

            const lifecycleResolve = section(lifecycle, 'export async function resolveInventoryLifecycleFacts(', '\n}')
            check(lifecycleResolve.includes('ensureCatalogExecutionV3') && lifecycleResolve.includes('createCatalogCombinationV3'), 'Explicit stock-affecting lifecycle resolution can no longer materialize a physical SKU')

            const baseProductCreate = section(catalog, 'export async function createCatalogProduct(', 'export async function updateCatalogProduct(')
            check(baseProductCreate.includes('INSERT INTO catalog_products'), 'Base catalog product creation is missing')
            check(!baseProductCreate.includes('catalog_variants') && !baseProductCreate.includes('catalog_stock_positions'), 'Creating a base product still creates synthetic execution/variation rows')

            check(String(pkg.scripts?.['release:check'] || '').includes('test-phase3a-catalog-physical-materialization.mjs'), 'Phase 3A regression is not wired into release:check')
            console.log('PHASE 3A CATALOG PHYSICAL MATERIALIZATION TESTS PASSED — orders/review are lookup-only while physical intake, stocktake discovery and explicit lifecycle intake retain controlled SKU materialization')
          } catch (error) {
            console.error(`PHASE 3A CATALOG PHYSICAL MATERIALIZATION TESTS FAILED: ${error?.message || error}`)
            process.exit(1)
          }
          EOF

          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'

          const targets = {
            resolveCatalogProductAndVariantV2: ['/tmp/order-reservations.before.ts', 'worker/domains/order-reservations.ts'],
            resolveCatalogReviewFacts: ['/tmp/catalog-review.before.ts', 'worker/domains/catalog-review.ts'],
            resolveInventoryCreatableItemsBulk: ['/tmp/inventory-movement.before.ts', 'worker/domains/inventory-movement.ts'],
            applyInventoryMovement: ['/tmp/inventory-movement.before.ts', 'worker/domains/inventory-movement.ts'],
          }
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const declaration = (file, name) => {
            const text = fs.readFileSync(file, 'utf8')
            const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            for (const statement of source.statements) {
              if ((ts.isFunctionDeclaration(statement) || ts.isClassDeclaration(statement) || ts.isInterfaceDeclaration(statement) || ts.isTypeAliasDeclaration(statement) || ts.isEnumDeclaration(statement)) && statement.name?.text === name) {
                return statement.getText(source).replace(/^export\s+/, '')
              }
              if (ts.isVariableStatement(statement)) {
                const names = statement.declarationList.declarations.flatMap((d) => ts.isIdentifier(d.name) ? [d.name.text] : [])
                if (names.includes(name)) return statement.getText(source).replace(/^export\s+/, '')
              }
            }
            throw new Error(`Declaration not found: ${name} in ${file}`)
          }
          const changes = {}
          for (const [name, [beforeFile, afterFile]] of Object.entries(targets)) {
            changes[name] = { before: sha(declaration(beforeFile, name)), after: sha(declaration(afterFile, name)) }
          }
          fs.writeFileSync('scripts/phase3a-catalog-physical-materialization-worker-manifest.json', JSON.stringify({
            version: 1,
            revision: 'phase3a-catalog-physical-materialization-r1',
            source: 'branch2 Phase 2 clean source',
            changes,
          }, null, 2) + '\n')
          NODE
      - name: Inspect Phase 3A diff
