name: Finance F7 persist verified promotion

on:
  push:
    branches:
      - finance-f7-prod-promotion

permissions:
  contents: write

jobs:
  persist-promotion:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f7-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply reviewed Finance commits in order
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commits=(
            d79f4b68b0b7248c889956eb5b6bf48564ccb4e9
            7e3a8e5b355d07c3ad567adcb9ec5074d1cc7fd6
            5d74258d25104aab39dbdb1d5e0526159418da0d
            1b5b9168b8ba174778ae2749ed49118f068375ff
            1c26ecff52168c7b3a86230cd1502d53cd67d456
            f37137fed1f50f065c4e4e3fc8123153c55678fe
            3404604c744723cb7abe09bd9ebcd529c15e8727
          )
          for sha in "${commits[@]}"; do
            echo "=== cherry-pick $sha ==="
            if ! git cherry-pick "$sha"; then
              echo "CHERRY_PICK_CONFLICT=$sha"
              git status --short
              git diff --name-only --diff-filter=U || true
              exit 1
            fi
          done
          git show origin/branch2:scripts/test-finance-f2-trace.mjs > scripts/test-finance-f2-trace.mjs
          test "$(git hash-object scripts/test-finance-f2-trace.mjs)" = "e892dde38e38a858c530683ad5e030ffa072123f"
      - name: Full release gate on exact main-based tree
        run: npm run release:check
      - name: Commit exact allow-listed promotion tree
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/test-finance-f2-trace.mjs
          git rm .github/workflows/finance-f7-prod-dry-run.yml
          git commit -m "Assemble verified Finance F7 production promotion [finance-f7-verified]"

          cat > /tmp/expected-finance-files.txt <<'EOF'
          scripts/finance-f2-trace-worker-manifest.json
          scripts/finance-f4-money-journal-worker-manifest.json
          scripts/finance-f5-business-semantics-worker-manifest.json
          scripts/finance-f6-dead-metrics-worker-manifest.json
          scripts/finance-f6-delete-money-history-worker-manifest.json
          scripts/finance-f6-report-semantics-worker-manifest.json
          scripts/finance-order-date-sync-worker-manifest.json
          scripts/release-check.mjs
          scripts/test-finance-f2-trace.mjs
          scripts/test-finance-f3-summary-ux.mjs
          scripts/test-finance-f4-money-journal.mjs
          scripts/test-finance-f5-adjacent-regression.mjs
          scripts/test-finance-f5-entry-semantics.mjs
          scripts/test-finance-f6-release-audit.mjs
          scripts/test-step1906a-worker-modularization.mjs
          scripts/test-step192b2a4-order-create-save-integrity.mjs
          src/App.tsx
          src/app/types.ts
          src/app/utils.ts
          src/features/renderers/FinanceDashboardRenderer.tsx
          src/features/renderers/FinanceReportContentRenderer.tsx
          src/features/sections/OrderEditorSection.tsx
          src/styles/finance-f4-money-journal.css
          worker/domains/cash.ts
          worker/domains/finance-reports.ts
          worker/domains/money.ts
          worker/domains/orders-write.ts
          worker/domains/returns-exchanges.ts
          EOF
          sed -i 's/^          //' /tmp/expected-finance-files.txt
          sort -u /tmp/expected-finance-files.txt -o /tmp/expected-finance-files.txt
          git diff --name-only origin/main...HEAD | sort -u > /tmp/actual-finance-files.txt
          echo '=== Exact final Production candidate diff ==='
          cat /tmp/actual-finance-files.txt
          diff -u /tmp/expected-finance-files.txt /tmp/actual-finance-files.txt
          if grep -Eq '^migrations/' /tmp/actual-finance-files.txt; then exit 1; fi
          if grep -Ei 'arrival|приход' /tmp/actual-finance-files.txt; then exit 1; fi
          test -z "$(git status --porcelain)"
          git push origin HEAD:finance-f7-prod-promotion
