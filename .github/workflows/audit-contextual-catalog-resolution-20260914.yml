name: Audit contextual catalog resolution 20260914

on:
  push:
    branches:
      - fix/contextual-catalog-resolution-20260914
    paths:
      - .github/workflows/audit-contextual-catalog-resolution-20260914.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read-only production evidence
        shell: bash
        run: |
          set -euo pipefail
          q() { echo "=== $1 ==="; npx wrangler d1 execute orders_db_prod --remote --command="$2" --json; }
          q recent_doker_orders "SELECT oi.id AS order_item_id, oi.order_id, o.external_id, o.order_date, o.shipping_status, oi.product_name_snapshot, oi.audience_type, oi.gender_snapshot, oi.color_snapshot, oi.material_snapshot, oi.length_snapshot, oi.size_snapshot, oi.product_id, oi.variant_id, oi.stock_writeoff_status, oi.source_type FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE UPPER(TRIM(COALESCE(oi.product_name_snapshot,''))) LIKE '%ДОКЕР%' AND o.order_date >= '2026-09-01' ORDER BY oi.id DESC LIMIT 30"
          q doker_catalog_products "SELECT p.id AS product_id, p.name, p.category, p.is_active FROM catalog_products p WHERE UPPER(TRIM(p.name)) LIKE '%ДОКЕР%' ORDER BY p.id"
          q doker_variants "SELECT v.id AS variant_id, v.product_id, p.name AS product_name, v.category, v.gender, v.color, v.material, v.length, v.size_label, v.is_active, v.stock_position_id FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id WHERE UPPER(TRIM(p.name)) LIKE '%ДОКЕР%' ORDER BY v.product_id,v.id LIMIT 200"
          q dubai_recent_orders "SELECT oi.id AS order_item_id, oi.order_id, o.external_id, o.order_date, o.shipping_status, oi.product_name_snapshot, oi.audience_type, oi.gender_snapshot, oi.color_snapshot, oi.material_snapshot, oi.length_snapshot, oi.size_snapshot, oi.product_id, oi.variant_id, oi.stock_writeoff_status, oi.source_type FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE (UPPER(TRIM(COALESCE(oi.product_name_snapshot,''))) LIKE '%ДУБАЙ%' OR UPPER(TRIM(COALESCE(oi.material_snapshot,''))) LIKE '%ДУБАЙ%') AND o.order_date >= '2026-09-01' ORDER BY oi.id DESC LIMIT 30"
          q unresolved_recent "SELECT oi.id AS order_item_id, oi.order_id, o.external_id, o.order_date, oi.product_name_snapshot, oi.product_id, oi.variant_id, oi.gender_snapshot, oi.color_snapshot, oi.material_snapshot, oi.length_snapshot, oi.size_snapshot FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE oi.quantity>0 AND (oi.product_id IS NULL OR oi.variant_id IS NULL) AND COALESCE(o.order_status,'active') NOT IN ('deleted','archived') AND COALESCE(o.shipping_status,'not_sent')<>'sent' AND o.order_date >= '2026-09-01' ORDER BY oi.id DESC LIMIT 100"
