name: Fix Catalog Gender Read Audit Anchor R1

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - .github/workflows/fix-catalog-gender-read-audit-anchor-r1.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0
      - name: Make type anchor deterministic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/catalog-gender-read-audit-r1.yml')
          s = p.read_text()
          old_label = "              'canonical exact type')"
          new_label = "              'canonical exact/alias types', 2)"
          if old_label not in s:
              raise SystemExit('canonical type label not found')
          s = s.replace(old_label, new_label, 1)
          alias = "          patch('worker/domains/catalog.ts',\n              'first<{ id: number; name: string; category: string; external_id?: string | null }>();',\n              'first<{ id: number; name: string; category: string; gender_scope?: string | null; external_id?: string | null }>();',\n              'alias product type')\n"
          if alias not in s:
              raise SystemExit('alias type block not found')
          s = s.replace(alias, '', 1)
          p.write_text(s)
          PY
      - name: Commit audit workflow repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-catalog-gender-read-audit-anchor-r1.yml
          git add .github/workflows/catalog-gender-read-audit-r1.yml
          git commit -m "Repair catalog gender read audit anchor"
          git push origin HEAD:catalog-gender-cleanup-r1
