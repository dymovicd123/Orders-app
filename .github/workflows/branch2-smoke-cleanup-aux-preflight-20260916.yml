name: Branch2 smoke auxiliary cleanup preflight

on:
  push:
    branches:
      - ops/branch2-manager-seed-20260916
    paths:
      - .github/workflows/branch2-smoke-cleanup-aux-preflight-20260916.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify Branch2 target
        run: |
          set -euo pipefail
          grep -q '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -q '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -q 'orders_db_prod' wrangler.jsonc
      - name: Read auxiliary smoke artifacts only
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --command="
          SELECT sql FROM sqlite_master WHERE type='table' AND name='customers';
          SELECT request_id,operation_type,status,step,target_type,target_id,target_ref,last_error FROM critical_operations WHERE request_id LIKE 'smoke-%' ORDER BY created_at,request_id;
          SELECT request_id,entity_type,entity_key,entity_id FROM critical_operation_entities WHERE request_id LIKE 'smoke-%' ORDER BY request_id,entity_type,entity_key;
          SELECT id,order_id,external_order_id,event_type,title FROM activity_log WHERE order_id IN (1,2) OR external_order_id IN ('SMOKE-WH-20260916T155955Z-35118350672','SMOKE-WS-20260916T155955Z-35118350672') ORDER BY id;
          SELECT order_id,search_text FROM order_search_orders_fts WHERE order_id IN (1,2);
          SELECT order_id,search_text FROM order_search_items_fts WHERE order_id IN (1,2);
          SELECT order_id,search_text FROM order_search_payments_fts WHERE order_id IN (1,2);
          SELECT order_id,external_id,action,source FROM order_manager_audit WHERE order_id IN (1,2) ORDER BY id;
          SELECT order_id,external_order_id,event_type,amount_delta FROM financial_events WHERE order_id IN (1,2) ORDER BY id;
          SELECT order_id,external_order_id,entry_type,amount FROM cash_register_entries WHERE order_id IN (1,2) ORDER BY id;"
