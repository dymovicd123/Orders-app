name: Branch2 guarded fixed-gender legacy cleanup 20260930

on:
  push:
    branches:
      - repair/catalog-fixed-gender-legacy-20260930
    paths:
      - '.github/workflows/catalog-fixed-gender-legacy-cleanup-20260930.yml'

permissions:
  contents: read

jobs:
  repair:
    name: Guarded Branch2 D1 legacy gender cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Hard-stop on Branch2 database identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "repair/catalog-fixed-gender-legacy-20260930" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Production identity detected. Refusing correction." >&2
            exit 20
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Verify exact audited target and zero operational footprint
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
          WITH target(id) AS (
            VALUES (158),(254),(288),(315),(450),(654),(670),(854),(862),(893),(1016),(1022),(1082)
          ),
          mismatch AS (
            SELECT v.id
            FROM catalog_variants v
            JOIN catalog_products p ON p.id=v.product_id
            WHERE v.is_active=1 AND p.is_active=1
              AND (
                (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%ЖЕН%')
                OR (p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%МУЖ%')
              )
          )
          SELECT
            (SELECT COUNT(*) FROM target) AS expected_target_count,
            (SELECT COUNT(*) FROM mismatch) AS all_active_mismatch_count,
            (SELECT COUNT(*) FROM mismatch WHERE id IN (SELECT id FROM target)) AS target_active_mismatch_count,
            COALESCE((SELECT SUM(COALESCE(s.quantity,0)) FROM inventory_stock s WHERE s.variant_id IN (SELECT id FROM target)),0) AS physical,
            COALESCE((SELECT SUM(COALESCE(s.reserved_quantity,0)) FROM inventory_stock s WHERE s.variant_id IN (SELECT id FROM target)),0) AS stock_reserved,
            COALESCE((SELECT SUM(COALESCE(r.quantity,0)) FROM inventory_reservations r WHERE r.status='active' AND r.variant_id IN (SELECT id FROM target)),0) AS active_reservation,
            (SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id=oi.order_id
              WHERE oi.variant_id IN (SELECT id FROM target)
                AND COALESCE(o.order_status,'active')='active'
                AND COALESCE(o.shipping_status,'not_sent')<>'sent'
                AND COALESCE(oi.quantity,0)>0) AS open_order_items,
            (SELECT COUNT(*) FROM workshop_tasks wt WHERE wt.variant_id IN (SELECT id FROM target) AND wt.status IN ('active','ready')) AS active_workshop_tasks,
            (SELECT COUNT(*) FROM inventory_lifecycle_events e WHERE e.variant_id IN (SELECT id FROM target) AND e.status='pending') AS pending_lifecycle,
            (SELECT COUNT(*) FROM inventory_stocktake_items i JOIN inventory_stocktake_sessions st ON st.id=i.session_id
              WHERE i.variant_id IN (SELECT id FROM target) AND st.status='active') AS active_stocktake;
          " --json)"
          echo "$result"
          [[ "$(jq -r '.[0].results[0].expected_target_count // 0' <<<"$result")" == "13" ]]
          [[ "$(jq -r '.[0].results[0].all_active_mismatch_count // 0' <<<"$result")" == "13" ]]
          [[ "$(jq -r '.[0].results[0].target_active_mismatch_count // 0' <<<"$result")" == "13" ]]
          [[ "$(jq -r '.[0].results[0].physical // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].stock_reserved // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].active_reservation // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].open_order_items // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].active_workshop_tasks // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].pending_lifecycle // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].active_stocktake // 0' <<<"$result")" == "0" ]]

      - name: Retire only the exact audited legacy mismatches
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
          WITH target(id) AS (
            VALUES (158),(254),(288),(315),(450),(654),(670),(854),(862),(893),(1016),(1022),(1082)
          ),
          safe AS (
            SELECT 1
            WHERE
              (SELECT COUNT(*)
               FROM catalog_variants v
               JOIN catalog_products p ON p.id=v.product_id
               WHERE v.id IN (SELECT id FROM target)
                 AND v.is_active=1 AND p.is_active=1
                 AND (
                   (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%ЖЕН%')
                   OR (p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%МУЖ%')
                 )) = 13
              AND
              (SELECT COUNT(*)
               FROM catalog_variants v
               JOIN catalog_products p ON p.id=v.product_id
               WHERE v.is_active=1 AND p.is_active=1
                 AND (
                   (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%ЖЕН%')
                   OR (p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%МУЖ%')
                 )) = 13
              AND NOT EXISTS (
                SELECT 1 FROM inventory_stock s
                WHERE s.variant_id IN (SELECT id FROM target)
                  AND (COALESCE(s.quantity,0)<>0 OR COALESCE(s.reserved_quantity,0)<>0)
              )
              AND NOT EXISTS (
                SELECT 1 FROM inventory_reservations r
                WHERE r.variant_id IN (SELECT id FROM target) AND r.status='active' AND COALESCE(r.quantity,0)<>0
              )
              AND NOT EXISTS (
                SELECT 1 FROM order_items oi JOIN orders o ON o.id=oi.order_id
                WHERE oi.variant_id IN (SELECT id FROM target)
                  AND COALESCE(o.order_status,'active')='active'
                  AND COALESCE(o.shipping_status,'not_sent')<>'sent'
                  AND COALESCE(oi.quantity,0)>0
              )
              AND NOT EXISTS (
                SELECT 1 FROM workshop_tasks wt
                WHERE wt.variant_id IN (SELECT id FROM target) AND wt.status IN ('active','ready')
              )
              AND NOT EXISTS (
                SELECT 1 FROM inventory_lifecycle_events e
                WHERE e.variant_id IN (SELECT id FROM target) AND e.status='pending'
              )
              AND NOT EXISTS (
                SELECT 1 FROM inventory_stocktake_items i
                JOIN inventory_stocktake_sessions st ON st.id=i.session_id
                WHERE i.variant_id IN (SELECT id FROM target) AND st.status='active'
              )
          )
          UPDATE catalog_variants
          SET is_active=0, updated_at=CURRENT_TIMESTAMP
          WHERE id IN (SELECT id FROM target)
            AND is_active=1
            AND EXISTS (SELECT 1 FROM safe);
          " --json

      - name: Verify clean post-state
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
          WITH target(id) AS (
            VALUES (158),(254),(288),(315),(450),(654),(670),(854),(862),(893),(1016),(1022),(1082)
          )
          SELECT
            (SELECT COUNT(*) FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
              WHERE v.is_active=1 AND p.is_active=1 AND (
                (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%ЖЕН%')
                OR (p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,''))) LIKE '%МУЖ%')
              )) AS remaining_active_mismatch_count,
            (SELECT COUNT(*) FROM catalog_variants WHERE id IN (SELECT id FROM target) AND is_active=0) AS retired_target_count,
            (SELECT COUNT(*) FROM catalog_variants v
              WHERE v.is_active=0 AND (
                EXISTS(SELECT 1 FROM inventory_stock s WHERE s.variant_id=v.id AND (COALESCE(s.quantity,0)<>0 OR COALESCE(s.reserved_quantity,0)<>0))
                OR EXISTS(SELECT 1 FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active' AND COALESCE(r.quantity,0)<>0)
              )) AS inactive_variants_with_live_stock_or_reservation;
          " --json)"
          echo "$result"
          [[ "$(jq -r '.[0].results[0].remaining_active_mismatch_count // -1' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].retired_target_count // -1' <<<"$result")" == "13" ]]
          [[ "$(jq -r '.[0].results[0].inactive_variants_with_live_stock_or_reservation // -1' <<<"$result")" == "0" ]]
          echo "Branch2 legacy fixed-gender mismatch cleanup completed safely."
