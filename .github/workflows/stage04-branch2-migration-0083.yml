name: Stage04 Branch2 settlement foundation 0083

on:
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/stage04-branch2-migration-0083.yml'

permissions:
  contents: read

jobs:
  apply:
    name: Apply additive settlement schema to Branch2 D1 only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact Branch2 SHA
        uses: actions/checkout@v4

      - name: Hard-stop on branch, D1 identity and migration scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "branch2" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc || grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc; then
            echo "Production D1 identity detected: abort." >&2
            exit 20
          fi
          migration=migrations/0083_v72_workshop_settlement_foundation.sql
          grep -Fq 'CREATE TABLE IF NOT EXISTS workshop_settlement_events' "$migration"
          grep -Fq 'CREATE TRIGGER IF NOT EXISTS trg_workshop_settlement_no_update' "$migration"
          grep -Fq 'CREATE TRIGGER IF NOT EXISTS trg_workshop_settlement_no_delete' "$migration"
          if grep -Eiq '^[[:space:]]*(INSERT|UPDATE|DELETE|ALTER|DROP|REPLACE)[[:space:]]' "$migration"; then
            echo "Migration has data changes or unsafe DDL." >&2
            exit 21
          fi
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]] || {
            echo "Missing Branch2 migration Cloudflare credentials." >&2
            exit 22
          }

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate migration and Branch2 binding locally
        run: |
          set -euo pipefail
          node scripts/test-branch2-environment.mjs
          node scripts/test-stage04a-workshop-settlements.mjs

      - name: Capture pre-migration business fingerprint
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS order_total,
              (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS order_received,
              (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS order_debt,
              (SELECT COUNT(*) FROM payments) AS payment_count,
              (SELECT COUNT(*) FROM workshop_tasks) AS workshop_task_count
          " --json)"
          before="$(jq -cS '.[0].results[0]' <<<"$result")"
          [[ -n "$before" && "$before" != "null" ]] || exit 23
          printf '%s' "$before" > /tmp/stage04a-before.json
          schema="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT COUNT(*) AS count FROM sqlite_master
            WHERE type = 'table' AND name = 'workshop_settlement_events'
          " --json)"
          count="$(jq -r '.[0].results[0].count // -1' <<<"$schema")"
          [[ "$count" == "0" || "$count" == "1" ]] || exit 24
          echo "$count" > /tmp/stage04a-exists-before

      - name: Apply 0083 to isolated Branch2 D1 if absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(cat /tmp/stage04a-exists-before)" == "0" ]]; then
            npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --file migrations/0083_v72_workshop_settlement_foundation.sql
          else
            echo "Existing Branch2 settlement schema detected; checking it without reapplying."
          fi

      - name: Verify schema is empty on first activation and existing business data is untouched
        shell: bash
        run: |
          set -euo pipefail
          schema="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM pragma_table_info('workshop_settlement_events') WHERE name IN ('event_key','amount_delta','business_date','related_event_id')) AS required_columns,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('trg_workshop_settlement_no_update','trg_workshop_settlement_no_delete')) AS immutable_triggers,
              (SELECT COUNT(*) FROM workshop_settlement_events) AS event_count
          " --json)"
          echo "$schema"
          cols="$(jq -r '.[0].results[0].required_columns // -1' <<<"$schema")"
          triggers="$(jq -r '.[0].results[0].immutable_triggers // -1' <<<"$schema")"
          events="$(jq -r '.[0].results[0].event_count // -1' <<<"$schema")"
          [[ "$cols" == "4" && "$triggers" == "2" ]] || {
            echo "Settlement schema drift; refusing activation." >&2
            exit 25
          }
          if [[ "$(cat /tmp/stage04a-exists-before)" == "0" && "$events" != "0" ]]; then
            echo "New schema unexpectedly contains historical financial rows." >&2
            exit 26
          fi
          after_json="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS order_total,
              (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS order_received,
              (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS order_debt,
              (SELECT COUNT(*) FROM payments) AS payment_count,
              (SELECT COUNT(*) FROM workshop_tasks) AS workshop_task_count
          " --json)"
          after="$(jq -cS '.[0].results[0]' <<<"$after_json")"
          [[ "$after" == "$(cat /tmp/stage04a-before.json)" ]] || {
            echo "Business fingerprint changed during schema activation." >&2
            exit 27
          }
          echo "STAGE04-A BRANCH2 MIGRATION PASSED — only isolated schema added; existing business fingerprint preserved."
