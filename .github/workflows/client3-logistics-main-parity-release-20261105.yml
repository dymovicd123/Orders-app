name: Client3 ORIGINAL — Main parity logistics and handover
on:
  push:
    branches: [release/client3-logistics-main-parity-20261105]
    paths: ['.github/workflows/client3-logistics-main-parity-release-20261105.yml']
permissions: {contents: read}
concurrency:
  group: client3-original-logistics-main-parity-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      REAL_WORKER: orders-app-client3-old-client
      REAL_DB: orders_db_client3_old_client
      REAL_ID: 0717f239-6d81-4837-8586-777d94e22c53
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Strict original Client3 only, exact source and change list
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/client3-logistics-main-parity-20261105
          test "$(git rev-parse HEAD^)" = 077c4f40787024759b56b05a80441d7b1fcf6f47
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(jq -r .name wrangler.jsonc)" = "$REAL_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = "$REAL_ID"
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = "$REAL_DB"
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          python3 - <<'PY'
          import subprocess
          allowed={
            'src/WatchClient3App.tsx',
            '.github/workflows/client3-logistics-main-parity-release-20261105.yml',
          }
          actual=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert actual==allowed, 'Unexpected or missing release files: '+repr(actual.symmetric_difference(allowed))
          assert not any(x.startswith('migrations/') or x in ('wrangler.jsonc','package.json','package-lock.json') for x in actual)
          print('CLIENT3_SCOPED_LOGISTICS_RELEASE_GUARD_PASS')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Build and relevant logistics, handover, SKU, order editor regressions
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --experimental-strip-types scripts/client3/test-watch-logistics-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-handover-after-revision-20261103.mjs
          node --experimental-strip-types scripts/client3/test-watch-order-editor-delete-release-20261105.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-catalog-v6-release-20261104.mjs
          node --experimental-strip-types scripts/client3/test-watch-provision-20261102.mjs
          echo CLIENT3_LOGISTICS_RELEASE_REGRESSION_PASS
      - name: Read-only live D1 migration guards and foreign key checks
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_variant_attributes_v6') v6,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_retirement_operations') retirement,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='retired_order_item_issues') retired_issues,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='order_dispatch_items') dispatch_items,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_logistics_jobs') logistics_jobs,
            (SELECT COUNT(*) FROM orders) orders_count,
            (SELECT COUNT(*) FROM order_items) order_items_count,
            (SELECT COUNT(*) FROM order_dispatch_items) sent_items_count" |
            jq -e '.[0].results[0]|select(.v6==1 and .retirement==1 and .retired_issues==1 and .dispatch_items==1 and .logistics_jobs==1)'
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results|length==0'
          echo CLIENT3_LIVE_D1_READONLY_PREFLIGHT_PASS
      - name: Deploy ONLY original Client3 worker; no migration or D1 write
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = "$REAL_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = "$REAL_ID"
          npx wrangler deploy --config wrangler.jsonc
          echo CLIENT3_MAIN_PARITY_LOGISTICS_DEPLOY_PASS
      - name: Verify exact published JS, protected routes and D1 FK
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          asset="$(grep -Eo 'src="/assets/[^"]+\.js"' dist/client/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$asset"
          test -s "dist/client$asset"
          verified=0
          for i in $(seq 1 12); do
            code="$(curl -sSL --max-time 20 -o /tmp/c3-home -w '%{http_code}' "$base/?logistics=$GITHUB_SHA" || true)"
            file="$(curl -sSL --max-time 25 -o /tmp/c3-js -w '%{http_code}' "$base$asset" || true)"
            if test "$code" = 200 && grep -Eq 'id="root"|type="module"' /tmp/c3-home &&
              test "$file" = 200 && cmp -s "dist/client$asset" /tmp/c3-js; then
              verified=1
              echo "CLIENT3_LIVE_JS_IDENTICAL_PASS attempt=$i asset=$asset"
              break
            fi
            sleep 3
          done
          test "$verified" = 1
          for path in '/api/client3/watches/logistics?brand=TAUWACH' '/api/client3/watches/orders/1/send' '/api/client3/watches/orders/1/stock-handover?brand=TAUWACH' '/api/client3/watches/orders/1/delete-chain?brand=TAUWACH'; do
            status="$(curl -sS --max-time 20 -o /tmp/c3-anonymous -w '%{http_code}' "$base$path")"
            echo "CLIENT3_ANON_HTTP $status $path"
            test "$status" = 401 -o "$status" = 403 -o "$status" = 405
          done
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results|length==0'
          echo CLIENT3_MAIN_PARITY_LOGISTICS_RELEASE_VERIFIED
