name: Seed Production system admin dymovicd

on:
  push:
    branches:
      - seed-prod-system-admin-dymovicd
    paths:
      - '.github/workflows/seed-prod-system-admin-dymovicd.yml'

permissions:
  contents: read

jobs:
  seed:
    name: Create unlinked Production system administrator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact seed commit
        uses: actions/checkout@v4

      - name: Hard-stop on Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "seed-prod-system-admin-dymovicd" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders-app-branch2' wrangler.jsonc || grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then
            echo "Branch2 identity detected. Refusing Production seed." >&2
            exit 20
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify clean auth state and capture business fingerprint
        shell: bash
        run: |
          set -euo pipefail
          auth="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "SELECT
            (SELECT COUNT(*) FROM app_users WHERE login IS NOT NULL AND trim(login) <> '') AS provisioned_users,
            (SELECT COUNT(*) FROM app_users WHERE lower(login)='dymovicd') AS dymovicd_rows,
            (SELECT COUNT(*) FROM app_users WHERE role='admin' AND is_active=1 AND login IS NOT NULL AND trim(login) <> '') AS active_admins,
            (SELECT COUNT(*) FROM app_sessions) AS sessions_count" --json)"
          echo "$auth"
          row="$(jq -c '.[0].results[0]' <<<"$auth")"
          [[ "$(jq -r '.provisioned_users' <<<"$row")" == "0" ]] || { echo "A provisioned account already exists. Refusing system-admin seed." >&2; exit 21; }
          [[ "$(jq -r '.dymovicd_rows' <<<"$row")" == "0" ]] || { echo "dymovicd already exists." >&2; exit 22; }
          [[ "$(jq -r '.active_admins' <<<"$row")" == "0" ]] || exit 23

          business="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS orders_total,
            (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS orders_received,
            (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS orders_debt,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COALESCE(SUM(quantity),0) FROM order_items) AS order_items_quantity,
            (SELECT COUNT(*) FROM payments) AS payments_count,
            (SELECT COALESCE(SUM(amount),0) FROM payments) AS payments_amount,
            (SELECT COUNT(*) FROM managers) AS managers_count,
            (SELECT COUNT(*) FROM customers) AS customers_count" --json)"
          echo "$business"
          jq -cS '.[0].results[0]' <<<"$business" > /tmp/business-before.json

      - name: Insert system administrator with forced password change
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "PRAGMA foreign_keys = ON;
            INSERT INTO app_users (
              email, login, password_hash, role, manager_id, display_name,
              is_active, must_change_password, password_updated_at, created_at, updated_at
            ) VALUES (
              'dymovicd@orders.invalid',
              'dymovicd',
              'pbkdf2$30000$yqMIlPV0cqsAUeP1qFdNfA$lbovexUQGpwT6nyNKKu6OdRhBWjs5wlbwFKOM9H-KFQ',
              'admin',
              NULL,
              'Системный администратор',
              1,
              1,
              datetime('now'),
              datetime('now'),
              datetime('now')
            );
            INSERT INTO auth_audit_log (
              event_type, actor_user_id, target_user_id, actor_login, target_login, details, created_at
            )
            SELECT
              'auth_user_created',
              NULL,
              id,
              'system-provision',
              login,
              'role=admin; managerId=none; active=yes; temporaryPassword=yes; systemAccount=yes',
              datetime('now')
            FROM app_users
            WHERE lower(login)='dymovicd'
            LIMIT 1;"

      - name: Verify system-admin isolation and unchanged business data
        shell: bash
        run: |
          set -euo pipefail
          auth="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "SELECT
            (SELECT COUNT(*) FROM app_users WHERE login IS NOT NULL AND trim(login) <> '') AS provisioned_users,
            (SELECT COUNT(*) FROM app_users WHERE lower(login)='dymovicd' AND role='admin' AND is_active=1 AND manager_id IS NULL AND must_change_password=1) AS exact_system_admin,
            (SELECT length(password_hash) FROM app_users WHERE lower(login)='dymovicd') AS password_hash_length,
            (SELECT substr(password_hash,1,6) FROM app_users WHERE lower(login)='dymovicd') AS password_hash_prefix,
            (SELECT COUNT(*) FROM app_sessions s JOIN app_users u ON u.id=s.user_id WHERE lower(u.login)='dymovicd') AS system_admin_sessions,
            (SELECT COUNT(*) FROM auth_audit_log WHERE event_type='auth_user_created' AND target_login='dymovicd' AND actor_login='system-provision') AS seed_audit_events" --json)"
          echo "$auth"
          row="$(jq -c '.[0].results[0]' <<<"$auth")"
          [[ "$(jq -r '.provisioned_users' <<<"$row")" == "1" ]] || exit 30
          [[ "$(jq -r '.exact_system_admin' <<<"$row")" == "1" ]] || exit 31
          [[ "$(jq -r '.password_hash_length' <<<"$row")" == "79" ]] || exit 32
          [[ "$(jq -r '.password_hash_prefix' <<<"$row")" == "pbkdf2" ]] || exit 33
          [[ "$(jq -r '.system_admin_sessions' <<<"$row")" == "0" ]] || exit 34
          [[ "$(jq -r '.seed_audit_events' <<<"$row")" == "1" ]] || exit 35

          business="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS orders_total,
            (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS orders_received,
            (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS orders_debt,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COALESCE(SUM(quantity),0) FROM order_items) AS order_items_quantity,
            (SELECT COUNT(*) FROM payments) AS payments_count,
            (SELECT COALESCE(SUM(amount),0) FROM payments) AS payments_amount,
            (SELECT COUNT(*) FROM managers) AS managers_count,
            (SELECT COUNT(*) FROM customers) AS customers_count" --json)"
          echo "$business"
          before="$(cat /tmp/business-before.json)"
          after="$(jq -cS '.[0].results[0]' <<<"$business")"
          [[ "$after" == "$before" ]] || {
            echo "Business fingerprint changed during system-admin seed." >&2
            echo "Before: $before" >&2
            echo "After:  $after" >&2
            exit 36
          }
          echo "Production system admin dymovicd created: unlinked, active, forced password change, business data unchanged."
