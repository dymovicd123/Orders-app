name: Dashboard attention step 2 priority

on:
  push:
    branches:
      - dashboard-workshop-attention-r1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-workshop-attention-r1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prioritize workshop deadlines
        run: python scripts/tmp-dashboard-attention-step2.py
      - name: Typecheck
        run: npm run typecheck
      - name: Commit priority change and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-attention-step2-priority.yml scripts/tmp-dashboard-attention-step2.py
          git add worker/domains/inventory-read.ts
          git commit -m "Dashboard: prioritize workshop deadlines"
          git push origin HEAD:dashboard-workshop-attention-r1
