name: Branch2 Barcode public HTTP diagnostic (READ ONLY)

on:
  push:
    branches:
      - feature/barcode-sku-branch2-20261116
    paths:
      - .github/workflows/ci-barcode-branch2-http-diagnostic-20261116.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect external Branch2 HTTP only — NO credentials or writes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          host='https://orders-app-branch2.orders-clothes.workers.dev'
          for path in ['/api/health','/api/auth/status','/']:
            for agent in ['OrdersBarcodeSmoke/1.0','Mozilla/5.0']:
              url=host+path
              request=urllib.request.Request(url,headers={'User-Agent':agent,'Accept':'application/json,text/html'})
              try:
                with urllib.request.urlopen(request,timeout=15) as response:
                  status=response.status
                  headers=response.headers
                  body=response.read(280).decode('utf-8','replace')
              except urllib.error.HTTPError as error:
                status=error.code
                headers=error.headers
                body=error.read(280).decode('utf-8','replace')
              except Exception as error:
                print('REQUEST_EXCEPTION',path,agent,type(error).__name__,str(error)[:180])
                continue
              print('HTTP_RESULT',path,agent,'status=',status,'server=',headers.get('server'),
                    'cf-ray=',headers.get('cf-ray'),'content-type=',headers.get('content-type'),
                    'preview=',repr(body[:210]))
          print('READ_ONLY_DIAGNOSTIC_COMPLETED')
          PY
