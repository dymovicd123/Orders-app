name: Branch2 KPI unshipped and net returns
on:
  push:
    branches: [branch2]
    paths:
      - 'worker/domains/product-kpi.ts'
      - 'scripts/test-branch2-kpi-unshipped-net-20261103.mjs'
      - '.github/workflows/branch2-kpi-unshipped-net-20261103.yml'
  pull_request:
    branches: [branch2]
    paths:
      - 'worker/domains/product-kpi.ts'
      - 'scripts/test-branch2-kpi-unshipped-net-20261103.mjs'
      - '.github/workflows/branch2-kpi-unshipped-net-20261103.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: KPI sold quantity, unshipped and refunds
        run: node --experimental-strip-types scripts/test-branch2-kpi-unshipped-net-20261103.mjs
      - name: TypeScript
        run: npm run typecheck
