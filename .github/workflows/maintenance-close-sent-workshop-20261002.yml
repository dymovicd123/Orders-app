name: Maintenance close sent Workshop tasks 2026-10-02

on:
  push:
    branches:
      - 'maintenance/close-sent-workshop-20261002'
    paths:
      - '.github/workflows/maintenance-close-sent-workshop-20261002.yml'

permissions:
  contents: read

jobs:
  repair:
    name: Close stale Workshop tasks for already-sent orders
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact maintenance commit
        uses: actions/checkout@v4

      - name: Hard-stop on branch and Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "maintenance/close-sent-workshop-20261002" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders-app-branch2' wrangler.jsonc || grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then
            echo "Branch2 identity detected. Refusing Production repair." >&2
            exit 20
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit exact stale-task population and capture immutable fingerprint
        shell: bash
        run: |
          set -euo pipefail

          # A sent order may legitimately get a NEW Workshop task from a later completed Exchange.
          # Those replacement tasks are explicitly excluded. Everything else here is an impossible
          # stale state: original Workshop work is still active although the order is already sent.
          candidates="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT
              wt.id AS task_id,
              wt.order_id,
              wt.order_item_id,
              wt.external_order_id,
              wt.product_name_snapshot,
              wt.quantity,
              wt.created_at AS task_created_at,
              o.order_date,
              o.shipping_date,
              o.order_status,
              o.workshop_status
            FROM workshop_tasks wt
            JOIN orders o ON o.id = wt.order_id
            WHERE wt.status = 'active'
              AND COALESCE(wt.quantity, 0) > 0
              AND COALESCE(o.shipping_status, 'not_sent') = 'sent'
              AND COALESCE(o.order_status, 'active') NOT IN ('deleted', 'archived')
              AND NOT EXISTS (
                SELECT 1
                FROM exchanges e
                WHERE COALESCE(e.status, 'completed') <> 'cancelled'
                  AND e.order_id = wt.order_id
                  AND e.new_order_item_id IS NOT NULL
                  AND e.new_order_item_id = wt.order_item_id
              )
            ORDER BY o.order_date, wt.external_order_id, wt.id
          " --json)"
          echo "=== stale original Workshop tasks on already-sent orders ==="
          echo "$candidates" | jq '.[0].results'

          candidate_count="$(jq -r '.[0].results | length' <<<"$candidates")"
          [[ "$candidate_count" =~ ^[0-9]+$ ]]
          if (( candidate_count > 25 )); then
            echo "Unexpectedly broad repair scope: $candidate_count tasks. Refusing automatic mutation." >&2
            exit 21
          fi

          task_ids="$(jq -c '[.[0].results[].task_id] | unique' <<<"$candidates")"
          order_ids="$(jq -c '[.[0].results[].order_id] | unique' <<<"$candidates")"
          printf '%s' "$candidate_count" > /tmp/candidate-count
          printf '%s' "$task_ids" > /tmp/task-ids.json
          printf '%s' "$order_ids" > /tmp/order-ids.json

          protected="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT
              wt.id AS task_id,
              wt.external_order_id,
              wt.product_name_snapshot,
              wt.quantity,
              e.id AS exchange_id,
              e.exchange_date
            FROM workshop_tasks wt
            JOIN orders o ON o.id = wt.order_id
            JOIN exchanges e
              ON e.order_id = wt.order_id
             AND e.new_order_item_id = wt.order_item_id
             AND COALESCE(e.status, 'completed') <> 'cancelled'
            WHERE wt.status = 'active'
              AND COALESCE(wt.quantity, 0) > 0
              AND COALESCE(o.shipping_status, 'not_sent') = 'sent'
            ORDER BY e.exchange_date, wt.id
          " --json)"
          echo "=== protected sent-order Workshop tasks created by later Exchanges; NOT TOUCHED ==="
          echo "$protected" | jq '.[0].results'
          jq -r '.[0].results | length' <<<"$protected" > /tmp/protected-count

          fingerprint="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM orders WHERE COALESCE(shipping_status,'not_sent')='sent') AS sent_orders,
              (SELECT COUNT(*) FROM orders WHERE COALESCE(shipping_status,'not_sent')<>'sent') AS unsent_orders,
              (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS orders_received,
              (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS orders_debt,
              (SELECT COUNT(*) FROM order_items) AS order_items_count,
              (SELECT COALESCE(SUM(quantity),0) FROM order_items) AS order_items_quantity,
              (SELECT COUNT(*) FROM payments) AS payments_count,
              (SELECT COALESCE(SUM(amount),0) FROM payments) AS payments_amount,
              (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_sum,
              (SELECT COUNT(*) FROM inventory_reservations) AS reservation_rows,
              (SELECT COUNT(*) FROM exchanges WHERE COALESCE(status,'completed')<>'cancelled') AS active_exchanges,
              (SELECT COUNT(*) FROM returns WHERE COALESCE(status,'completed')<>'cancelled') AS active_returns,
              (SELECT COUNT(*) FROM workshop_tasks) AS workshop_task_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM workshop_tasks) AS workshop_task_quantity
          " --json)"
          echo "=== immutable fingerprint before ==="
          echo "$fingerprint" | jq '.[0].results[0]'
          jq -cS '.[0].results[0]' <<<"$fingerprint" > /tmp/before.json

      - name: Mark only stale original Workshop tasks done
        shell: bash
        run: |
          set -euo pipefail
          candidate_count="$(cat /tmp/candidate-count)"
          if [[ "$candidate_count" == "0" ]]; then
            echo "No stale Workshop tasks found; nothing to mutate."
            exit 0
          fi

          task_ids="$(cat /tmp/task-ids.json)"
          order_ids="$(cat /tmp/order-ids.json)"

          # Only task status/timestamp changes here. Quantity, order shipping, money and stock are untouched.
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            UPDATE workshop_tasks
            SET status = 'done',
                updated_at = datetime('now')
            WHERE id IN (SELECT CAST(value AS INTEGER) FROM json_each('$task_ids'))
              AND status = 'active'
              AND COALESCE(quantity,0) > 0
              AND EXISTS (
                SELECT 1 FROM orders o
                WHERE o.id = workshop_tasks.order_id
                  AND COALESCE(o.shipping_status,'not_sent') = 'sent'
                  AND COALESCE(o.order_status,'active') NOT IN ('deleted','archived')
              )
              AND NOT EXISTS (
                SELECT 1 FROM exchanges e
                WHERE COALESCE(e.status,'completed') <> 'cancelled'
                  AND e.order_id = workshop_tasks.order_id
                  AND e.new_order_item_id IS NOT NULL
                  AND e.new_order_item_id = workshop_tasks.order_item_id
              )
          "

          # Refresh only the compatibility Workshop cache for the exact affected orders.
          # If a protected Exchange task is still active, the order correctly remains in_workshop.
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            UPDATE orders
            SET workshop_status = CASE
                  WHEN EXISTS (
                    SELECT 1 FROM workshop_tasks wt
                    WHERE wt.order_id = orders.id AND wt.status = 'active' AND COALESCE(wt.quantity,0) > 0
                  ) THEN 'in_workshop'
                  ELSE 'ready'
                END,
                updated_at = datetime('now')
            WHERE id IN (SELECT CAST(value AS INTEGER) FROM json_each('$order_ids'))
          "

      - name: Postflight prove shipping stock and money unchanged
        shell: bash
        run: |
          set -euo pipefail
          candidate_count="$(cat /tmp/candidate-count)"
          task_ids="$(cat /tmp/task-ids.json)"

          remaining="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT COUNT(*) AS count
            FROM workshop_tasks wt
            JOIN orders o ON o.id = wt.order_id
            WHERE wt.status = 'active'
              AND COALESCE(wt.quantity,0) > 0
              AND COALESCE(o.shipping_status,'not_sent') = 'sent'
              AND COALESCE(o.order_status,'active') NOT IN ('deleted','archived')
              AND NOT EXISTS (
                SELECT 1 FROM exchanges e
                WHERE COALESCE(e.status,'completed') <> 'cancelled'
                  AND e.order_id = wt.order_id
                  AND e.new_order_item_id IS NOT NULL
                  AND e.new_order_item_id = wt.order_item_id
              )
          " --json)"
          echo "=== remaining stale tasks ==="
          echo "$remaining" | jq '.[0].results[0]'
          [[ "$(jq -r '.[0].results[0].count // -1' <<<"$remaining")" == "0" ]] || exit 30

          if [[ "$candidate_count" != "0" ]]; then
            done_rows="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
              SELECT COUNT(*) AS count
              FROM workshop_tasks
              WHERE id IN (SELECT CAST(value AS INTEGER) FROM json_each('$task_ids'))
                AND status = 'done'
            " --json)"
            echo "$done_rows" | jq '.[0].results[0]'
            [[ "$(jq -r '.[0].results[0].count // -1' <<<"$done_rows")" == "$candidate_count" ]] || {
              echo "Not every exact candidate ended as done." >&2
              exit 31
            }
          fi

          protected_after="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT COUNT(*) AS count
            FROM workshop_tasks wt
            JOIN orders o ON o.id = wt.order_id
            JOIN exchanges e
              ON e.order_id = wt.order_id
             AND e.new_order_item_id = wt.order_item_id
             AND COALESCE(e.status,'completed') <> 'cancelled'
            WHERE wt.status='active'
              AND COALESCE(wt.quantity,0)>0
              AND COALESCE(o.shipping_status,'not_sent')='sent'
          " --json)"
          [[ "$(jq -r '.[0].results[0].count // -1' <<<"$protected_after")" == "$(cat /tmp/protected-count)" ]] || {
            echo "A protected Exchange Workshop task changed unexpectedly." >&2
            exit 32
          }

          after="$(npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM orders WHERE COALESCE(shipping_status,'not_sent')='sent') AS sent_orders,
              (SELECT COUNT(*) FROM orders WHERE COALESCE(shipping_status,'not_sent')<>'sent') AS unsent_orders,
              (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS orders_received,
              (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS orders_debt,
              (SELECT COUNT(*) FROM order_items) AS order_items_count,
              (SELECT COALESCE(SUM(quantity),0) FROM order_items) AS order_items_quantity,
              (SELECT COUNT(*) FROM payments) AS payments_count,
              (SELECT COALESCE(SUM(amount),0) FROM payments) AS payments_amount,
              (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_sum,
              (SELECT COUNT(*) FROM inventory_reservations) AS reservation_rows,
              (SELECT COUNT(*) FROM exchanges WHERE COALESCE(status,'completed')<>'cancelled') AS active_exchanges,
              (SELECT COUNT(*) FROM returns WHERE COALESCE(status,'completed')<>'cancelled') AS active_returns,
              (SELECT COUNT(*) FROM workshop_tasks) AS workshop_task_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM workshop_tasks) AS workshop_task_quantity
          " --json)"
          echo "=== immutable fingerprint after ==="
          echo "$after" | jq '.[0].results[0]'
          before="$(cat /tmp/before.json)"
          after_norm="$(jq -cS '.[0].results[0]' <<<"$after")"
          [[ "$after_norm" == "$before" ]] || {
            echo "A shipping/money/stock/count invariant changed unexpectedly." >&2
            echo "Before: $before" >&2
            echo "After:  $after_norm" >&2
            exit 33
          }

          echo "REPAIR PASSED: closed $candidate_count stale original Workshop task(s); shipping, stock, reservations, money, returns/exchanges and task quantities are unchanged."
