name: Client3 original D1 engraving migration ledger audit (READ ONLY)
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-original-d1-migration-audit-20261104.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24",cache: npm}
      - name: Exact live Client3 only
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - name: Migration registry fields (no write)
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json --command="PRAGMA table_info('d1_migrations')" |
            jq -e '.[0].results | map({name,type,notnull,pk})'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json --command="SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 5" |
            jq -e '.[0].results'
      - name: Inspect exact engraving table, index, legacy readiness and backfill (no write)
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_engraving_item_readiness') AS has_table,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_watch_engraving_ready_actor') AS has_index,
            (SELECT COUNT(*) FROM pragma_table_info('watch_logistics_events') WHERE name='order_item_id') AS has_event_item_column,
            (SELECT COUNT(*) FROM d1_migrations WHERE name='1004_watch_item_engraving_readiness.sql') AS recorded_migration,
            (SELECT COUNT(*) FROM watch_engraving_item_readiness) AS completed_item_records,
            (SELECT COUNT(*) FROM watch_logistics_jobs lj
              WHERE lj.status='ready' AND lj.ready_at IS NOT NULL
                AND (SELECT COUNT(*) FROM order_items oi JOIN watch_order_item_details wi ON wi.order_item_id=oi.id
                  WHERE oi.order_id=lj.order_id AND oi.quantity>0 AND LENGTH(TRIM(wi.engraving_text))>0)=1
                AND EXISTS (SELECT 1 FROM order_items oi JOIN watch_order_item_details wi ON wi.order_item_id=oi.id
                  LEFT JOIN watch_engraving_item_readiness ri
                    ON ri.order_item_id=oi.id AND ri.engraving_text=wi.engraving_text
                  WHERE oi.order_id=lj.order_id AND oi.quantity>0 AND LENGTH(TRIM(wi.engraving_text))>0
                    AND ri.order_item_id IS NULL)) AS unbackfilled_single_ready,
            (SELECT COUNT(*) FROM watch_logistics_jobs lj
              WHERE lj.status='ready' AND EXISTS (
                SELECT 1 FROM order_items oi JOIN watch_order_item_details wi ON wi.order_item_id=oi.id
                LEFT JOIN watch_engraving_item_readiness ri
                  ON ri.order_item_id=oi.id AND ri.engraving_text=wi.engraving_text
                WHERE oi.order_id=lj.order_id AND oi.quantity>0
                  AND LENGTH(TRIM(wi.engraving_text))>0 AND ri.order_item_id IS NULL
              )) AS ambiguous_ready_orders" |
            jq -e '.[0].results[0] | select(.has_table==1 and .has_index==1 and .has_event_item_column==1)'
      - name: DB foreign key integrity (no write)
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results | length==0'
      - run: echo "CLIENT3_ORIGINAL_SCHEMA_READ_ONLY_AUDIT_COMPLETE"
