name: Client3 Main-style atomic staff login isolated release
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-atomic-staff-create-guarded-release-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Restrict to Client3 accepted staff code and isolated D1
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(git rev-parse HEAD^)" = fc427b4a548a7a1098e0d940739bd9482a06f390
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/client3-atomic-staff-create-guarded-release-20261103.yml'
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -q 'const withAccess=input.createAccount===true' worker/domains/client3-watch-team-main.ts
          grep -q 'createAccount:true' src/features/client3/WatchTeamMainPanel.tsx
      - run: npm ci
      - name: Validate manager account atomic onboarding and two-brand logistics
        run: node --experimental-strip-types scripts/client3/test-watch-shared-cash-team-20261103.mjs
      - name: Validate watch orders, inventory, finance and returns
        run: node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
      - name: TypeScript and Vite build
        run: npm run build
      - name: Pre-deploy schema and read-only business counts
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM managers) employees,
              (SELECT COUNT(*) FROM app_users) accounts,
              (SELECT COUNT(*) FROM orders) orders,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) inventory,
              (SELECT COUNT(*) FROM financial_events) finance_events" |
            jq -ce '(if type=="array" then .[0].results[0] else .results[0] end) | select(.employees>=0 and .accounts>=1)' >/tmp/staff-before.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA table_info(managers)" |
            jq -e '(if type=="array" then .[0].results else .results end) |
              map(.name) | index("birth_date")!=null'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" |
            jq -e '(if type=="array" then .[0].results else .results end) | length==0'
      - name: Deploy ONLY Client3 Worker, no D1 migrations or business changes
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Check live authorization, protected routes, post-deploy integrity
        run: |
          set -euo pipefail
          base='https://orders-app-client3-old-client.orders-clothes.workers.dev'
          test "$(curl -sSL -o /tmp/client3-index -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-index
          for path in '/api/client3/watches/team' '/api/client3/watches/brands' '/api/auth/users'; do
            status="$(curl -sS -o /tmp/client3-api -w '%{http_code}' --max-time 30 "$base$path")"
            test "$status" = 401 -o "$status" = 403
          done
          status="$(curl -sS -o /tmp/client3-anon -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"name":"UNAUTHORIZED","role":"Менеджер","createAccount":true,"login":"unauth","password":"TempPassword2026"}' \
            "$base/api/client3/watches/team/employees")"
          test "$status" = 401 -o "$status" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" |
            jq -e '(if type=="array" then .[0].results else .results end) | length==0'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM managers) employees,
              (SELECT COUNT(*) FROM app_users) accounts,
              (SELECT COUNT(*) FROM orders) orders,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) inventory,
              (SELECT COUNT(*) FROM financial_events) finance_events" |
            jq -ce '(if type=="array" then .[0].results[0] else .results[0] end)' >/tmp/staff-after.json
          if ! diff -u /tmp/staff-before.json /tmp/staff-after.json; then
            echo 'Concurrent user operations changed business counts; not a deployment failure.'
          fi
          echo CLIENT3_STAFF_ONE_CLICK_RELEASE_SUCCESS
      - name: Record verified Client3-only release
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 Main-style one-step employee+login+temporary password DEPLOYED and regression-tested: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. PR #780, manager and logist atomic SQL tests, real schema, TS/build, auth smoke, FK checked. No migrations, business writes or Main/Branch2 changes. Old order/account cleanup is separate and pending."
      - name: Record blocked release
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 one-click employee onboarding release FAILED or BLOCKED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Do not claim deployed until checked."
