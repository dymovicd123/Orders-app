name: W3.1A Warehouse reliability

on:
  push:
    branches:
      - safe/w3-1a-warehouse-reliability-20260905

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.event.head_commit.message == 'chore: run W3.1A patch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: safe/w3-1a-warehouse-reliability-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply W3.1A patch
        run: python3 scripts/apply-w3-1a-warehouse-reliability.py

      - name: Diff safety
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused W3.1A regression
        run: node scripts/test-w3-1a-warehouse-reliability.mjs

      - name: Full cumulative release check
        run: npm run release:check

      - name: Database safety verification
        run: npm run verify:db-safety

      - name: Build
        run: npm run build

      - name: Cloudflare dry run only
        run: npx wrangler deploy --dry-run

      - name: Confirm no migration change
        run: |
          if git diff --name-only | grep -E '(^|/)(migrations?|schema)(/|\.|$)' ; then
            echo 'Unexpected migration/schema change in W3.1A'
            exit 1
          fi

      - name: Commit validated W3.1A
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/features/inventory/views/renderInventoryMovementPanel.tsx package.json scripts/test-w3-1a-warehouse-reliability.mjs docs/continuation/W3_1A_WAREHOUSE_RELIABILITY_20260905.md
          git diff --cached --check
          git commit -m 'W3.1A: restore Warehouse operational reliability'
          git push origin HEAD:safe/w3-1a-warehouse-reliability-20260905
