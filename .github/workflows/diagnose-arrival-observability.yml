name: Diagnose arrival observability

on:
  push:
    branches:
      - safe/arrival-save-reliability-20260829
    paths:
      - .github/workflows/diagnose-arrival-observability.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query recent Production Worker errors
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date +%s%3N)
          FROM=$((NOW - 60*60*1000))
          cat > /tmp/query.json <<JSON
          {
            "queryId":"arrival-hotfix-diagnostic",
            "timeframe":{"from":${FROM},"to":${NOW}},
            "limit":200,
            "parameters":{
              "datasets":["cloudflare-workers"],
              "filterCombination":"and",
              "filters":[
                {"key":"\$metadata.service","operation":"eq","type":"string","value":"orders-app","kind":"filter"}
              ],
              "needle":{"value":"inventory","isRegex":false,"matchCase":false},
              "view":"events"
            }
          }
          JSON
          STATUS=$(curl -sS -o /tmp/result.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/workers/observability/telemetry/query" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json)
          echo "HTTP ${STATUS}"
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          if not data.get('success'):
              print(json.dumps({'success':False,'errors':data.get('errors',[]),'messages':data.get('messages',[])}, ensure_ascii=False))
              raise SystemExit(2)
          events=((data.get('result') or {}).get('events') or {}).get('events') or []
          print('events=', len(events))
          for e in events:
              md=e.get('$metadata') or {}
              print(json.dumps({
                  'ts':e.get('timestamp'), 'level':md.get('level'), 'status':md.get('statusCode'),
                  'trigger':md.get('trigger'), 'url':md.get('url'), 'message':md.get('message'),
                  'error':md.get('error'), 'source':e.get('source')
              }, ensure_ascii=False)[:5000])
          PY
