name: Production manager schema parity SELECT only
on:
  push:
    branches:
      - 'audit/main-order-lifecycle-live-*'
    paths:
      - 'scripts/ops/readonly-prod-schema-parity-20261020.mjs'
      - '.github/workflows/audit-manager-schema-readonly.yml'
permissions:
  contents: read
jobs:
  schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Enforce production-only read-only schema source
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
      - run: npm ci
      - name: Inspect manager and audit DDL without reading business records
        run: node scripts/ops/readonly-prod-schema-parity-20261020.mjs
