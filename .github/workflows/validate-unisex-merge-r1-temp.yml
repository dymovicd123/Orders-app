name: Validate Unisex Merge R1 Temp

on:
  push:
    branches:
      - catalog-unisex-merge-r1-work2
    paths:
      - .github/workflows/validate-unisex-merge-r1-temp.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-unisex-merge-r1-work2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/test-catalog-unisex-merge-r1.mjs
      - run: npm run release:check
      # rerun after structural manifest layering
