name: Client3 one-time isolated Cloudflare installation

on:
  push:
    branches:
      - client3/isolated-stabilization-20261020
    paths:
      - '.github/workflows/client3-initial-deploy.yml'

permissions:
  contents: read

concurrency:
  group: client3-first-deploy
  cancel-in-progress: false

jobs:
  initial-install:
    if: "${{ github.event.head_commit.message == 'Client3: APPROVED first isolated Cloudflare deployment 2026-10-20' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact deployment isolation and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "client3/isolated-stabilization-20261020" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
          status="$(curl -sS --connect-timeout 12 --max-time 30 -o /tmp/client3workers.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          [[ "$status" == "200" ]]
          jq -e '.success == true and ([.result[]? | select(.id == "orders-app-client3-old-client")] | length == 0)' \
            /tmp/client3workers.json >/dev/null
          echo 'Third Worker name is unused; main and branch2 Worker deployments are out of scope.'
      - name: Install dependencies
        run: npm ci
      - name: Validate clean schema and protected identities
        run: node scripts/client3/test-fresh.mjs
      - name: Run resolver, finance, exchange and warehouse regressions
        run: node scripts/client3/stability-gate.mjs
      - name: Build SPA assets required by local Worker and remote deployment
        run: npm run build
      - name: Run real local Worker and disposable D1 scenarios
        run: node scripts/client3/test-runtime-local.mjs
      - name: Create independent remote D1, verify its empty data, and deploy only Client3 Worker
        run: node scripts/client3/release-isolated.mjs --deploy
      - name: Preserve nonsecret Client3 binding config for verified future updates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: client3-initial-isolated-binding
          path: wrangler.client3.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish installation status (bootstrap deliberately locked)
        if: success()
        run: |
          echo '### Client3 isolated Worker installed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Main/branch2 were not deployed. Client3 bootstrap is deliberately locked until a NEW ADMIN_MODE_PASSWORD is provisioned.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No existing customer business data was copied.' >> "$GITHUB_STEP_SUMMARY"
