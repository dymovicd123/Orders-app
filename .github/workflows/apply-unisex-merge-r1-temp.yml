name: Apply Unisex Merge R1 Temp

on:
  push:
    branches: [catalog-unisex-merge-r1]
    paths: [.github/workflows/apply-unisex-merge-r1-temp.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-unisex-merge-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply implementation and focused functional test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/domains/catalog.ts')
          s=p.read_text()
          old="""       AND COALESCE(category, 'adult') = ?
       AND COALESCE(gender, '') = ?
       AND COALESCE(color, '') = ?
       AND COALESCE(size_label, '') = ?
"""
          new="""       AND COALESCE(category, 'adult') = ?
       AND CASE
         WHEN UPPER(TRIM(COALESCE(gender, ''))) LIKE '%ЖЕН%' THEN 'ЖЕН'
         WHEN UPPER(TRIM(COALESCE(gender, ''))) LIKE '%МУЖ%' THEN 'МУЖ'
         ELSE UPPER(TRIM(COALESCE(gender, '')))
       END = ?
       AND CASE
         WHEN TRIM(COALESCE(color, '')) = '' THEN 'БЕЗ ЦВЕТА'
         ELSE UPPER(TRIM(color))
       END = ?
       AND CASE
         WHEN UPPER(TRIM(COALESCE(size_label, ''))) IN ('', 'БЕЗ РАЗМЕРА', 'БЕЗРАЗМЕРА', 'Б/Р') THEN ''
         ELSE UPPER(TRIM(size_label))
       END = ?
"""
          assert s.count(old)==1, f'duplicate resolver anchor count={s.count(old)}'
          s=s.replace(old,new)
          old="""    if (identityChanged && await catalogVariantHasOperationalUsage(db, id)) {
      const productScope = genderOnlyIdentityChange && existingGender === '' && (gender === 'ЖЕН' || gender === 'МУЖ')
        ? await getCatalogProductGenderScope(db, productId)
        : null;
      const safeLegacyUnisexGenderCorrection = productScope === 'unisex'
        && isActive === 1
        && !deactivating
        && !duplicate?.id;
      if (safeLegacyUnisexGenderCorrection) {
        await db.batch([
          db.prepare('UPDATE catalog_variants SET gender = ?, updated_at = ? WHERE id = ?').bind(gender, timestamp, id),
          db.prepare('UPDATE inventory_stock SET gender_snapshot = ?, updated_at = ? WHERE variant_id = ?').bind(gender, timestamp, id),
          db.prepare(`INSERT OR REPLACE INTO catalog_gender_variant_repairs
             (old_variant_id, keeper_variant_id, product_id, target_gender, repair_mode, repaired_at)
             VALUES (?, ?, ?, ?, 'in_place', ?)`).bind(id, id, productId, gender, timestamp),
        ]);
        return { ok: true, correctedGender: true, merged: false };
      }
      if (productScope === 'unisex' && duplicate?.id) {
        throw new Error('Для выбранного пола уже существует такая же комбинация. Её нужно безопасно объединить с текущей позицией; обычное редактирование не должно терять остаток или историю.');
      }
      throw new Error('Эта комбинация уже использовалась в заказах или движениях склада. Нельзя переписать её историю. Создайте правильную комбинацию отдельно; старую затем можно отключить.');
    }
"""
          new="""    const hasOperationalUsage = identityChanged ? await catalogVariantHasOperationalUsage(db, id) : false;
    const productScope = genderOnlyIdentityChange && existingGender === '' && (gender === 'ЖЕН' || gender === 'МУЖ')
      ? await getCatalogProductGenderScope(db, productId)
      : null;

    if (productScope === 'unisex' && duplicate?.id) {
      const previousMerge = await db.prepare(
        `SELECT keeper_variant_id, target_gender, repair_mode
         FROM catalog_gender_variant_repairs
         WHERE old_variant_id = ? LIMIT 1`
      ).bind(id).first<Record<string, unknown>>();
      if (cleanText(previousMerge?.repair_mode) === 'merge') {
        if (toInt(previousMerge?.keeper_variant_id, 0) === toInt(duplicate.id, 0)
          && normalizeCatalogCombinationGender(previousMerge?.target_gender) === gender) {
          return { ok: true, correctedGender: true, merged: true, keeperVariantId: toInt(duplicate.id, 0), replayed: true };
        }
        throw new Error('Эта старая позиция уже была объединена с другой канонической комбинацией. Обновите каталог перед новым исправлением.');
      }

      const sourceIsActive = toInt(existing.is_active, 1) === 1;
      if (!sourceIsActive || isActive !== 1 || deactivating) {
        throw new Error('Эта старая позиция уже не активна. Обновите каталог и повторите исправление на актуальной карточке.');
      }

      const blockers = await db.prepare(
        `SELECT
           EXISTS(
             SELECT 1
             FROM inventory_stocktake_items i
             JOIN inventory_stocktake_sessions s ON s.id = i.session_id
             WHERE i.variant_id IN (?, ?) AND s.status = 'active'
             LIMIT 1
           ) AS active_stocktake,
           EXISTS(
             SELECT 1
             FROM inventory_transfer_items source_item
             JOIN inventory_transfer_items target_item
               ON target_item.transfer_id = source_item.transfer_id
              AND target_item.variant_id = ?
             JOIN inventory_transfer_documents d ON d.id = source_item.transfer_id
             WHERE source_item.variant_id = ? AND d.status = 'applied'
             LIMIT 1
           ) AS applied_transfer_collision`
      ).bind(id, duplicate.id, duplicate.id, id).first<Record<string, unknown>>();
      if (toInt(blockers?.active_stocktake, 0)) {
        throw new Error('Нельзя объединить позиции во время активной ревизии. Завершите или отмените ревизию и повторите исправление.');
      }
      if (toInt(blockers?.applied_transfer_collision, 0)) {
        throw new Error('Эти две позиции встречаются в одном действующем документе перемещения. Сначала завершите разбор перемещения, затем повторите объединение.');
      }

      const stockResult = await db.prepare(
        `SELECT id, inventory_source, variant_id
         FROM inventory_stock
         WHERE variant_id IN (?, ?)
         ORDER BY inventory_source ASC, id ASC`
      ).bind(id, duplicate.id).all<Record<string, unknown>>();
      const stockRows = stockResult.results || [];
      const targetStockBySource = new Map<string, number>();
      for (const row of stockRows) {
        if (toInt(row.variant_id, 0) === toInt(duplicate.id, 0)) {
          targetStockBySource.set(cleanText(row.inventory_source), toInt(row.id, 0));
        }
      }

      const mergeStatements = [
        db.prepare('UPDATE order_items SET variant_id = ? WHERE variant_id = ?').bind(duplicate.id, id),
        db.prepare('UPDATE inventory_movements SET variant_id = ? WHERE variant_id = ?').bind(duplicate.id, id),
        db.prepare('UPDATE workshop_tasks SET variant_id = ? WHERE variant_id = ?').bind(duplicate.id, id),
        db.prepare('UPDATE inventory_reservations SET variant_id = ? WHERE variant_id = ?').bind(duplicate.id, id),
        db.prepare('UPDATE catalog_input_aliases SET variant_id = ? WHERE variant_id = ?').bind(duplicate.id, id),
        db.prepare('UPDATE inventory_lifecycle_events SET variant_id = ? WHERE variant_id = ?').bind(duplicate.id, id),
        db.prepare('UPDATE inventory_stock_checks SET variant_id = ? WHERE variant_id = ?').bind(duplicate.id, id),
        db.prepare(
          `UPDATE inventory_transfer_items
           SET variant_id = ?
           WHERE variant_id = ?
             AND NOT EXISTS (
               SELECT 1 FROM inventory_transfer_items sibling
               WHERE sibling.transfer_id = inventory_transfer_items.transfer_id
                 AND sibling.variant_id = ?
                 AND sibling.id <> inventory_transfer_items.id
             )`
        ).bind(duplicate.id, id, duplicate.id),
        db.prepare(
          `UPDATE inventory_stocktake_items
           SET variant_id = ?
           WHERE variant_id = ?
             AND NOT EXISTS (
               SELECT 1 FROM inventory_stocktake_items sibling
               WHERE sibling.session_id = inventory_stocktake_items.session_id
                 AND sibling.variant_id = ?
                 AND sibling.id <> inventory_stocktake_items.id
             )`
        ).bind(duplicate.id, id, duplicate.id),
      ];

      for (const sourceStock of stockRows) {
        if (toInt(sourceStock.variant_id, 0) !== id) continue;
        const sourceStockId = toInt(sourceStock.id, 0);
        const source = cleanText(sourceStock.inventory_source);
        const targetStockId = targetStockBySource.get(source) || 0;
        if (targetStockId) {
          mergeStatements.push(
            db.prepare(
              `UPDATE inventory_stock
               SET quantity = COALESCE(quantity, 0) + COALESCE((SELECT quantity FROM inventory_stock WHERE id = ? AND variant_id = ?), 0),
                   reserved_quantity = COALESCE(reserved_quantity, 0) + COALESCE((SELECT reserved_quantity FROM inventory_stock WHERE id = ? AND variant_id = ?), 0),
                   updated_at = ?
               WHERE id = ? AND variant_id = ?`
            ).bind(sourceStockId, id, sourceStockId, id, timestamp, targetStockId, duplicate.id),
            db.prepare(
              `UPDATE inventory_stock
               SET quantity = 0,
                   reserved_quantity = 0,
                   last_action = 'Объединение позиции каталога',
                   last_source_ref = ?,
                   updated_at = ?
               WHERE id = ? AND variant_id = ?`
            ).bind(`catalog-merge:${id}->${duplicate.id}`, timestamp, sourceStockId, id),
          );
        } else {
          mergeStatements.push(
            db.prepare(
              `UPDATE inventory_stock
               SET variant_id = ?, product_id = ?, updated_at = ?
               WHERE id = ? AND variant_id = ?`
            ).bind(duplicate.id, productId, timestamp, sourceStockId, id),
          );
        }
      }

      mergeStatements.push(
        db.prepare(
          `UPDATE inventory_stock
           SET product_id = ?,
               product_name_snapshot = (SELECT p.name FROM catalog_products p WHERE p.id = ?),
               gender_snapshot = (SELECT NULLIF(v.gender, '') FROM catalog_variants v WHERE v.id = ?),
               color_snapshot = (SELECT NULLIF(v.color, '') FROM catalog_variants v WHERE v.id = ?),
               material_snapshot = (SELECT NULLIF(v.material, '') FROM catalog_variants v WHERE v.id = ?),
               length_snapshot = (SELECT NULLIF(v.length, '') FROM catalog_variants v WHERE v.id = ?),
               size_snapshot = (SELECT NULLIF(v.size_label, '') FROM catalog_variants v WHERE v.id = ?),
               external_product_id = (SELECT p.external_id FROM catalog_products p WHERE p.id = ?),
               external_variant_id = (SELECT v.external_id FROM catalog_variants v WHERE v.id = ?),
               reserved_quantity = COALESCE((
                 SELECT SUM(r.quantity)
                 FROM inventory_reservations r
                 WHERE r.variant_id = ?
                   AND r.inventory_source = inventory_stock.inventory_source
                   AND r.status = 'active'
               ), 0),
               updated_at = ?
           WHERE variant_id = ?`
        ).bind(productId, productId, duplicate.id, duplicate.id, duplicate.id, duplicate.id, duplicate.id, productId, duplicate.id, duplicate.id, timestamp, duplicate.id),
        db.prepare('UPDATE catalog_variants SET is_active = 0, updated_at = ? WHERE id = ? AND is_active = 1').bind(timestamp, id),
        db.prepare(
          `INSERT OR REPLACE INTO catalog_gender_variant_repairs
           (old_variant_id, keeper_variant_id, product_id, target_gender, repair_mode, repaired_at)
           VALUES (?, ?, ?, ?, 'merge', ?)`
        ).bind(id, duplicate.id, productId, gender, timestamp),
      );
      await db.batch(mergeStatements);
      return { ok: true, correctedGender: true, merged: true, keeperVariantId: toInt(duplicate.id, 0) };
    }

    if (identityChanged && hasOperationalUsage) {
      const safeLegacyUnisexGenderCorrection = productScope === 'unisex'
        && isActive === 1
        && !deactivating
        && !duplicate?.id;
      if (safeLegacyUnisexGenderCorrection) {
        await db.batch([
          db.prepare('UPDATE catalog_variants SET gender = ?, updated_at = ? WHERE id = ?').bind(gender, timestamp, id),
          db.prepare('UPDATE inventory_stock SET gender_snapshot = ?, updated_at = ? WHERE variant_id = ?').bind(gender, timestamp, id),
          db.prepare(`INSERT OR REPLACE INTO catalog_gender_variant_repairs
             (old_variant_id, keeper_variant_id, product_id, target_gender, repair_mode, repaired_at)
             VALUES (?, ?, ?, ?, 'in_place', ?)`).bind(id, id, productId, gender, timestamp),
        ]);
        return { ok: true, correctedGender: true, merged: false };
      }
      throw new Error('Эта комбинация уже использовалась в заказах или движениях склада. Нельзя переписать её историю. Создайте правильную комбинацию отдельно; старую затем можно отключить.');
    }
"""
          assert s.count(old)==1, f'merge branch anchor count={s.count(old)}'
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('src/features/inventory/views/renderInventoryCatalogPanel.tsx')
          s=p.read_text()
          old='Старой унисекс-позиции без пола можно выбрать ЖЕН или МУЖ даже при наличии истории: если такой же конкретной комбинации ещё нет, система сохранит тот же SKU и текущий остаток. Для остальных полей действует прежняя защита: если комбинация уже использовалась, сервер не позволит её переписать.'
          new='Старой унисекс-позиции без пола можно выбрать ЖЕН или МУЖ даже при наличии истории. Если такой комбинации ещё нет, система сохранит тот же SKU; если ЖЕН/МУЖ-дубль уже есть, система безопасно объединит позиции, не теряя текущий остаток и исторические подписи. Для остальных полей действует прежняя защита: использованную идентичность сервер не перепишет.'
          assert s.count(old)==1, f'UI copy anchor count={s.count(old)}'
          p.write_text(s.replace(old,new))
          PY
          cat > scripts/test-catalog-unisex-merge-r1.mjs <<'NODE'
          import fs from 'node:fs'
          import { DatabaseSync } from 'node:sqlite'
          import { updateCatalogVariant } from '../worker/domains/catalog.ts'

          class Prepared {
            constructor(db, sql, params = []) { this.db = db; this.sql = sql; this.params = params }
            bind(...params) { return new Prepared(this.db, this.sql, params) }
            first() { return this.db.prepare(this.sql).get(...this.params) ?? null }
            all() { return { results: this.db.prepare(this.sql).all(...this.params) } }
            run() {
              const result = this.db.prepare(this.sql).run(...this.params)
              return { success: true, meta: { last_row_id: Number(result.lastInsertRowid || 0), changes: Number(result.changes || 0) } }
            }
          }
          class D1Fixture {
            constructor(db) { this.db = db }
            prepare(sql) { return new Prepared(this.db, sql) }
            batch(statements) {
              this.db.exec('BEGIN IMMEDIATE')
              try {
                const results = statements.map(statement => statement.run())
                this.db.exec('COMMIT')
                return results
              } catch (error) {
                this.db.exec('ROLLBACK')
                throw error
              }
            }
          }
          const check = (condition, message) => { if (!condition) throw new Error(message); console.log('OK:', message) }
          const expectReject = async (fn, fragment, message) => {
            let caught = null
            try { await fn() } catch (error) { caught = error }
            check(caught instanceof Error && caught.message.includes(fragment), message)
          }
          function setup() {
            const db = new DatabaseSync(':memory:')
            db.exec(`
              PRAGMA foreign_keys=ON;
              CREATE TABLE catalog_products(id INTEGER PRIMARY KEY,name TEXT,category TEXT,gender_scope TEXT,is_active INTEGER,external_id TEXT,updated_at TEXT);
              CREATE TABLE catalog_stock_positions(id INTEGER PRIMARY KEY,product_id INTEGER,material TEXT,length TEXT,is_active INTEGER);
              CREATE TABLE catalog_variants(id INTEGER PRIMARY KEY,external_id TEXT,product_id INTEGER,stock_position_id INTEGER,category TEXT,gender TEXT,color TEXT,material TEXT,length TEXT,size_label TEXT,is_active INTEGER,sort_order INTEGER,updated_at TEXT);
              CREATE UNIQUE INDEX uq_variant_raw ON catalog_variants(stock_position_id,category,COALESCE(gender,''),COALESCE(color,''),COALESCE(size_label,'')) WHERE is_active=1;
              CREATE TABLE catalog_identity_meta(key TEXT PRIMARY KEY,value TEXT);
              INSERT INTO catalog_identity_meta VALUES('catalog_identity_v3','active');
              CREATE TABLE catalog_gender_variant_repairs(old_variant_id INTEGER PRIMARY KEY,keeper_variant_id INTEGER,product_id INTEGER,target_gender TEXT,repair_mode TEXT,repaired_at TEXT);
              CREATE TABLE reference_values(id INTEGER PRIMARY KEY,kind TEXT,value TEXT,is_active INTEGER);
              CREATE TABLE catalog_value_aliases(id INTEGER PRIMARY KEY,kind TEXT,alias_key TEXT,canonical_value TEXT);
              CREATE TABLE order_items(id INTEGER PRIMARY KEY,variant_id INTEGER,gender_snapshot TEXT);
              CREATE TABLE inventory_stock(id INTEGER PRIMARY KEY,inventory_source TEXT,product_id INTEGER,variant_id INTEGER,product_name_snapshot TEXT,gender_snapshot TEXT,color_snapshot TEXT,material_snapshot TEXT,length_snapshot TEXT,size_snapshot TEXT,quantity INTEGER,reserved_quantity INTEGER,last_action TEXT,last_source_ref TEXT,external_product_id TEXT,external_variant_id TEXT,updated_at TEXT);
              CREATE UNIQUE INDEX uq_stock_variant ON inventory_stock(inventory_source,variant_id) WHERE variant_id IS NOT NULL;
              CREATE TABLE inventory_movements(id INTEGER PRIMARY KEY,variant_id INTEGER,gender_snapshot TEXT);
              CREATE TABLE workshop_tasks(id INTEGER PRIMARY KEY,variant_id INTEGER,status TEXT);
              CREATE TABLE inventory_reservations(id INTEGER PRIMARY KEY,variant_id INTEGER,inventory_source TEXT,quantity INTEGER,status TEXT);
              CREATE TABLE catalog_input_aliases(id INTEGER PRIMARY KEY,input_key TEXT UNIQUE,variant_id INTEGER);
              CREATE TABLE inventory_lifecycle_events(id INTEGER PRIMARY KEY,variant_id INTEGER,status TEXT);
              CREATE TABLE inventory_transfer_documents(id INTEGER PRIMARY KEY,status TEXT);
              CREATE TABLE inventory_transfer_items(id INTEGER PRIMARY KEY,transfer_id INTEGER,variant_id INTEGER,quantity INTEGER DEFAULT 1,UNIQUE(transfer_id,variant_id));
              CREATE TABLE inventory_stock_checks(id INTEGER PRIMARY KEY,variant_id INTEGER);
              CREATE TABLE inventory_stocktake_sessions(id TEXT PRIMARY KEY,status TEXT);
              CREATE TABLE inventory_stocktake_items(id INTEGER PRIMARY KEY,session_id TEXT,stock_id INTEGER,variant_id INTEGER,status TEXT,UNIQUE(session_id,variant_id));
            `)
            return { raw: db, d1: new D1Fixture(db) }
          }
          function seedPair(raw, { sourceId=1, targetId=2, size='48', targetSize=size, sourceQty=2, targetQty=3, sameSource=true, stocktakeCollision=true } = {}) {
            raw.prepare(`INSERT INTO catalog_products VALUES(10,'TEST','adult','unisex',1,'PROD-10','')`).run()
            raw.prepare(`INSERT INTO catalog_stock_positions VALUES(20,10,'СТАНДАРТ','СТАНДАРТ',1)`).run()
            raw.prepare(`INSERT INTO catalog_variants VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`).run(sourceId,'SRC',10,20,'adult',null,'ТЕМНО-СИНИЙ','СТАНДАРТ','СТАНДАРТ',size,1,0,'')
            raw.prepare(`INSERT INTO catalog_variants VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)`).run(targetId,'TGT',10,20,'adult','ЖЕН','ТЕМНО-СИНИЙ','СТАНДАРТ','СТАНДАРТ',targetSize,1,0,'')
            raw.prepare(`INSERT INTO order_items VALUES(100,?,?,?)`).run(sourceId,null)
            raw.prepare(`INSERT INTO inventory_movements VALUES(200,?,NULL)`).run(sourceId)
            raw.prepare(`INSERT INTO inventory_stock VALUES(300,'warehouse',10,?,'TEST',NULL,'ТЕМНО-СИНИЙ','СТАНДАРТ','СТАНДАРТ',?, ?,0,'before','x','PROD-10','SRC','')`).run(sourceId,size,sourceQty)
            raw.prepare(`INSERT INTO inventory_stock VALUES(301,?,10,?,'TEST','ЖЕН','ТЕМНО-СИНИЙ','СТАНДАРТ','СТАНДАРТ',?, ?,0,'before','y','PROD-10','TGT','')`).run(sameSource?'warehouse':'boutique',targetId,targetSize,targetQty)
            raw.prepare(`INSERT INTO inventory_stocktake_sessions VALUES('DONE','completed')`).run()
            raw.prepare(`INSERT INTO inventory_stocktake_items VALUES(400,'DONE',300,?,'applied')`).run(sourceId)
            if (stocktakeCollision) raw.prepare(`INSERT INTO inventory_stocktake_items VALUES(401,'DONE',301,?,'applied')`).run(targetId)
          }

          {
            const { raw, d1 } = setup(); seedPair(raw)
            const result = await updateCatalogVariant(d1,1,{gender:'ЖЕН'})
            check(result.merged === true && result.keeperVariantId === 2,'used blank SKU merges into selected concrete sibling')
            check(raw.prepare('SELECT quantity FROM inventory_stock WHERE id=301').get().quantity===5,'same-source physical quantities roll up once')
            check(raw.prepare('SELECT quantity FROM inventory_stock WHERE id=300').get().quantity===0,'historical source stock anchor is preserved but emptied')
            check(raw.prepare('SELECT is_active,gender FROM catalog_variants WHERE id=1').get().is_active===0 && raw.prepare('SELECT gender FROM catalog_variants WHERE id=1').get().gender===null,'source SKU retires without rewriting its historical blank gender')
            check(raw.prepare('SELECT variant_id,gender_snapshot FROM order_items WHERE id=100').get().variant_id===2 && raw.prepare('SELECT gender_snapshot FROM order_items WHERE id=100').get().gender_snapshot===null,'technical order link moves while textual snapshot stays historical')
            check(raw.prepare('SELECT variant_id FROM inventory_stocktake_items WHERE id=400').get().variant_id===1,'completed stocktake collision keeps its exact historical source identity')
            check(raw.prepare("SELECT keeper_variant_id,repair_mode,target_gender FROM catalog_gender_variant_repairs WHERE old_variant_id=1").get().repair_mode==='merge','merge is audited')
            const replay = await updateCatalogVariant(d1,1,{gender:'ЖЕН'})
            check(replay.replayed===true && raw.prepare('SELECT quantity FROM inventory_stock WHERE id=301').get().quantity===5,'lost-response retry is idempotent and cannot double-add stock')
          }
          {
            const { raw, d1 } = setup(); seedPair(raw,{size:'Без размера',targetSize:'Без размера',sourceQty:179,targetQty:10,sameSource:false,stocktakeCollision:false})
            const result = await updateCatalogVariant(d1,1,{gender:'ЖЕН'})
            check(result.merged===true,'legacy Без размера sentinel resolves as the same semantic SKU')
            const moved=raw.prepare('SELECT variant_id,quantity,gender_snapshot FROM inventory_stock WHERE id=300').get()
            check(moved.variant_id===2 && moved.quantity===179 && moved.gender_snapshot==='ЖЕН','different-source stock row keeps its stock id and quantity while repointing to keeper')
          }
          {
            const { raw, d1 } = setup(); seedPair(raw,{stocktakeCollision:false})
            raw.prepare(`INSERT INTO inventory_stocktake_sessions VALUES('LIVE','active')`).run()
            raw.prepare(`INSERT INTO inventory_stocktake_items VALUES(450,'LIVE',300,1,'pending')`).run()
            await expectReject(()=>updateCatalogVariant(d1,1,{gender:'ЖЕН'}),'активной ревизии','active stocktake blocks merge before mutation')
            check(raw.prepare('SELECT is_active FROM catalog_variants WHERE id=1').get().is_active===1,'blocked stocktake merge leaves source active')
          }
          {
            const { raw, d1 } = setup(); seedPair(raw,{stocktakeCollision:false})
            raw.prepare(`INSERT INTO inventory_transfer_documents VALUES(50,'applied')`).run()
            raw.prepare(`INSERT INTO inventory_transfer_items VALUES(51,50,1,1)`).run()
            raw.prepare(`INSERT INTO inventory_transfer_items VALUES(52,50,2,1)`).run()
            await expectReject(()=>updateCatalogVariant(d1,1,{gender:'ЖЕН'}),'действующем документе перемещения','same applied transfer collision blocks merge')
            check(raw.prepare('SELECT is_active FROM catalog_variants WHERE id=1').get().is_active===1,'blocked transfer merge leaves source active')
          }

          const worker=fs.readFileSync('worker/domains/catalog.ts','utf8')
          check(worker.includes("IN ('', 'БЕЗ РАЗМЕРА', 'БЕЗРАЗМЕРА', 'Б/Р')"),'duplicate lookup normalizes legacy no-size sentinels')
          check(worker.includes("repair_mode, repaired_at)\n           VALUES (?, ?, ?, ?, 'merge', ?)"),'merge audit path is present')
          console.log('Catalog unisex merge R1: OK')
          NODE
          node --experimental-strip-types scripts/test-catalog-unisex-merge-r1.mjs
          npx tsc -b --pretty false
          npm run build
      - name: Commit focused implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/catalog.ts src/features/inventory/views/renderInventoryCatalogPanel.tsx scripts/test-catalog-unisex-merge-r1.mjs
          git commit -m "Support safe unisex SKU merge correction"
          git push origin HEAD:catalog-unisex-merge-r1
