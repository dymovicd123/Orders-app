name: Branch2 QA 2200 fully cancelled dispatch evidence - read only
on:
  push:
    branches: [branch2]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      startsWith(github.event.head_commit.message, 'Branch2: inspect QA2200 cancelled dispatch once 20261115')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact test D1 dispatch/reservation evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          dbid='0904a573-21ff-44d8-93b0-c9200f771702'
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+dbid
          def req(path,body=None):
            if body is None:data=None;method='GET'
            else:data=json.dumps(body).encode();method='POST'
            request=urllib.request.Request(url+path,data=data,method=method,headers={
              'Authorization':'Bearer '+token,'Content-Type':'application/json'})
            with urllib.request.urlopen(request,timeout=30) as res:obj=json.load(res)
            if not obj.get('success'):raise SystemExit('STOP: test D1 read rejected')
            return obj['result']
          if req('')['name']!='orders_db_branch2_mirror_20261027':
            raise SystemExit('STOP: wrong D1')
          sql="""SELECT oi.id AS item_id,oi.quantity AS item_qty,oi.stock_writeoff_status AS item_status,
            oi.variant_id,
            ir.id AS res_id,ir.quantity AS res_qty,ir.status AS res_status,
            di.id AS dispatch_item_id,di.quantity AS dispatch_qty,
            di.cancelled_quantity AS cancelled_qty,di.movement_id,
            d.status AS dispatch_status,
            (SELECT COUNT(*) FROM order_dispatch_corrections c WHERE c.dispatch_item_id=di.id) AS correction_count,
            (SELECT COALESCE(SUM(CASE WHEN c.stock_restored=1 THEN 1 ELSE 0 END),0)
             FROM order_dispatch_corrections c WHERE c.dispatch_item_id=di.id) AS restored_count
          FROM order_items oi
          LEFT JOIN inventory_reservations ir ON ir.order_item_id=oi.id
          LEFT JOIN order_dispatch_items di ON di.order_item_id=oi.id
          LEFT JOIN order_dispatches d ON d.id=di.dispatch_id
          WHERE oi.order_id=2200 ORDER BY oi.id,ir.id,di.id"""
          result=req('/query',{'sql':sql,'params':[]})
          print('QA2200_ORDER_ROWS:',json.dumps(result[0]['results'],ensure_ascii=False))
          sql="""SELECT stock.inventory_source,stock.variant_id,stock.quantity,stock.reserved_quantity
          FROM inventory_stock stock WHERE stock.variant_id IN
            (SELECT DISTINCT variant_id FROM order_items WHERE order_id=2200 AND variant_id IS NOT NULL)"""
          result=req('/query',{'sql':sql,'params':[]})
          print('QA2200_STOCK_ROWS:',json.dumps(result[0]['results'],ensure_ascii=False))
          print('PASS: read-only test D1; no customer details or production writes.')
          PY
