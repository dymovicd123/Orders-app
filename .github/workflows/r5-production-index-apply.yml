name: R5.1 Production index apply

on:
  push:
    branches: [safe/d1-read-budget-r5-warehouse-20260902]
    paths:
      - scripts/.r5-production-apply-trigger

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_DB_NAME: orders_db_prod
      EXPECTED_DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact Production target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Cloudflare credentials are missing." >&2
            exit 2
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('wrangler.jsonc').read_text()
          name = re.search(r'"database_name"\s*:\s*"([^"]+)"', text)
          dbid = re.search(r'"database_id"\s*:\s*"([^"]+)"', text)
          assert name and name.group(1) == 'orders_db_prod', f'Unexpected database_name: {name.group(1) if name else None}'
          assert dbid and dbid.group(1) == '17e68a41-1d58-4a36-8a63-47c3e32443c4', f'Unexpected database_id: {dbid.group(1) if dbid else None}'
          print('Exact Production D1 target verified: orders_db_prod / 17e68a41-1d58-4a36-8a63-47c3e32443c4')
          PY

      - run: npm ci

      - name: Production preflight read
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='index' AND name IN ('idx_inventory_stock_source_variant','idx_return_items_order_item_return','idx_inventory_lifecycle_order_item_status','idx_inventory_stocktake_completed_source_time') ORDER BY name;"

      - name: Apply R5.1 indexes one statement at a time
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --command "CREATE INDEX IF NOT EXISTS idx_inventory_stock_source_variant ON inventory_stock(inventory_source, variant_id) WHERE variant_id IS NOT NULL;"
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --command "CREATE INDEX IF NOT EXISTS idx_return_items_order_item_return ON return_items(order_item_id, return_id) WHERE order_item_id IS NOT NULL;"
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --command "CREATE INDEX IF NOT EXISTS idx_inventory_lifecycle_order_item_status ON inventory_lifecycle_events(order_item_id, status) WHERE order_item_id IS NOT NULL;"
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --command "CREATE INDEX IF NOT EXISTS idx_inventory_stocktake_completed_source_time ON inventory_stocktake_sessions(inventory_source, completed_at DESC) WHERE status = 'completed' AND completed_at IS NOT NULL;"
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --command "PRAGMA optimize;"

      - name: Verify all four Production indexes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --json --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND name IN ('idx_inventory_stock_source_variant','idx_return_items_order_item_return','idx_inventory_lifecycle_order_item_status','idx_inventory_stocktake_completed_source_time') ORDER BY name;")"
          printf '%s\n' "$OUT"
          python3 - "$OUT" <<'PY'
          import json, sys
          payload = json.loads(sys.argv[1])
          rows = []
          for block in payload if isinstance(payload, list) else [payload]:
              rows.extend((block or {}).get('results') or [])
          names = {row.get('name') for row in rows}
          expected = {
              'idx_inventory_stock_source_variant',
              'idx_return_items_order_item_return',
              'idx_inventory_lifecycle_order_item_status',
              'idx_inventory_stocktake_completed_source_time',
          }
          missing = expected - names
          if missing:
              raise SystemExit(f'Missing Production indexes after apply: {sorted(missing)}')
          print('R5.1 PRODUCTION APPLY PASSED — all four additive indexes exist.')
          PY
