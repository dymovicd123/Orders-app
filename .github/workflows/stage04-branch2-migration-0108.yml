name: Stage04 Branch2 exact legacy SKU capture migration 0108
on:
  push:
    branches: [branch2]
    paths: ['.github/workflows/stage04-branch2-migration-0108.yml']
permissions:
  contents: read
concurrency:
  group: stage04-branch2-schema-0108
  cancel-in-progress: false
jobs:
  apply:
    name: Branch2-only unique legacy SKU Catalog cost trigger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Forbid production access and validate migration scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == branch2 ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -Eq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -Fq 'DROP TRIGGER IF EXISTS trg_workshop_settlement_completion' migrations/0108_v72_workshop_unique_legacy_sku_pricing.sql
          grep -Fq 'COUNT(*)=1' migrations/0108_v72_workshop_unique_legacy_sku_pricing.sql
          if grep -Ei '(^|[[:space:]])(ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE|UPDATE[[:space:]]+workshop_settlement_capture_control)' migrations/0108_v72_workshop_unique_legacy_sku_pricing.sql; then
            echo 'Unexpected data migration or capture change' >&2; exit 34
          fi
      - run: npm ci
      - name: Run Stage04 Workshop capture and missing-price history checks
        run: |
          node scripts/test-stage04a-workshop-settlements.mjs
          node scripts/test-stage04b-workshop-status-capture.mjs
          node scripts/test-stage04b2-workshop-catalog-cost.mjs
          node scripts/test-stage04b3-unique-legacy-sku-capture.mjs
          node --experimental-strip-types scripts/test-stage04c-workshop-payments.mjs
          node --experimental-strip-types scripts/test-stage04d-workshop-settlements.mjs
      - name: Read-only D1 baseline and explicit already-activated preflight
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM workshop_settlement_capture_control WHERE enabled=1 AND activated_at IS NOT NULL) AS capture_on,
              (SELECT COUNT(*) FROM workshop_settlement_capture_control) AS capture_rows,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_completion_reversal') AS reversal_exists,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_no_update') AS immutable_exists,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_completion' AND sql LIKE '%catalog_execution_prices%') AS catalog_capture_exists,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_completion' AND sql LIKE '%v2.is_active%') AS unique_capture_exists,
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items) AS order_items_count,
              (SELECT COUNT(*) FROM payments) AS customer_payment_count,
              (SELECT COUNT(*) FROM workshop_tasks) AS workshop_task_count,
              (SELECT COUNT(*) FROM workshop_settlement_events) AS journal_count,
              (SELECT COALESCE(SUM(amount_delta),0) FROM workshop_settlement_events) AS journal_sum,
              (SELECT COUNT(*) FROM workshop_settlement_events WHERE event_type='completion' AND amount_delta IS NULL) AS unpriced_captures
          " --json)"
          jq -cS '.[0].results[0]' <<<"$result" > /tmp/0108-before.json
          jq -e '.capture_on==1 and .capture_rows==1 and .reversal_exists==1 and .immutable_exists==1 and .catalog_capture_exists==1 and (.unique_capture_exists==0 or .unique_capture_exists==1)' /tmp/0108-before.json
          echo 'BRANCH2 0108 preflight (business counts only):'
          jq '{capture_on,unique_capture_exists,workshop_task_count,journal_count,unpriced_captures}' /tmp/0108-before.json
      - name: Install exact-SKU trigger on Branch2 only
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(jq -r .unique_capture_exists /tmp/0108-before.json)" == "0" ]]; then
            npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc \
              --file migrations/0108_v72_workshop_unique_legacy_sku_pricing.sql
          else
            echo '0108 already installed, no schema mutation.'
          fi
      - name: Verify enabled state and ZERO business/history drift
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM workshop_settlement_capture_control WHERE enabled=1 AND activated_at IS NOT NULL) AS capture_on,
              (SELECT COUNT(*) FROM workshop_settlement_capture_control) AS capture_rows,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_completion_reversal') AS reversal_exists,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_no_update') AS immutable_exists,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_completion' AND sql LIKE '%catalog_execution_prices%') AS catalog_capture_exists,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_workshop_settlement_completion' AND sql LIKE '%v2.is_active%') AS unique_capture_exists,
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items) AS order_items_count,
              (SELECT COUNT(*) FROM payments) AS customer_payment_count,
              (SELECT COUNT(*) FROM workshop_tasks) AS workshop_task_count,
              (SELECT COUNT(*) FROM workshop_settlement_events) AS journal_count,
              (SELECT COALESCE(SUM(amount_delta),0) FROM workshop_settlement_events) AS journal_sum,
              (SELECT COUNT(*) FROM workshop_settlement_events WHERE event_type='completion' AND amount_delta IS NULL) AS unpriced_captures
          " --json)"
          jq -cS '.[0].results[0]' <<<"$result" > /tmp/0108-after.json
          jq -e '.capture_on==1 and .unique_capture_exists==1' /tmp/0108-after.json
          jq -cS 'del(.unique_capture_exists)' /tmp/0108-before.json > /tmp/0108-before-facts.json
          jq -cS 'del(.unique_capture_exists)' /tmp/0108-after.json > /tmp/0108-after-facts.json
          cmp /tmp/0108-before-facts.json /tmp/0108-after-facts.json
          echo 'STAGE04-B3 BRANCH2 PASSED — exact legacy SKU pricing trigger installed, capture remains on, existing business data unchanged.'
