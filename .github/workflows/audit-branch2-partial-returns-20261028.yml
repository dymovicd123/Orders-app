name: Branch2 partial returns read-only data audit
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'scripts/audit-branch2-partial-returns-20261028.mjs'
      - 'scripts/test-branch2-partial-return-sequence-20261028.mjs'
      - '.github/workflows/audit-branch2-partial-returns-20261028.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - name: Verify sequential partial returns and physical states locally
        run: node scripts/test-branch2-partial-return-sequence-20261028.mjs
      - name: Read only the isolated Branch2 D1 copy, no writes
        run: node scripts/audit-branch2-partial-returns-20261028.mjs
