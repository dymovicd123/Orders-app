name: Branch2-only pre-barcode warehouse data integrity read-only audit
on:
  push:
    branches: [audit/branch2-warehouse-barcode-readiness-20261030]
    paths:
      - '.github/workflows/warehouse-d1-select-audit-once-20261030.yml'
permissions:
  contents: read
jobs:
  stock-identity-reservations:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: SELECT-only inventory-stock, active reservations and catalog SKU identity
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/barcode-readiness-branch2-live-d1-selects-20261030.mjs
          node scripts/ops/barcode-readiness-branch2-live-d1-selects-20261030.mjs
