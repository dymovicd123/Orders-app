name: Client3 ORIGINAL — scoped deleted SKU v6 release
on:
  push:
    branches: [release/client3-delete-v6-20261104]
    paths:
      - '.github/workflows/client3-approved-delete-v6-release-20261104.yml'
permissions:
  contents: write
concurrency:
  group: client3-original-delete-v6-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      REAL_WORKER: orders-app-client3-old-client
      REAL_DB: orders_db_client3_old_client
      REAL_ID: 0717f239-6d81-4837-8586-777d94e22c53
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Strict isolated Client3 release and exact source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/client3-delete-v6-20261104
          test "$(git rev-parse HEAD^)" = 83fd5b438e0a15b0b8be846f24e34567fa21008b
          test "$(git hash-object migrations/client3-watch/0006_client3_watch_sku_generations.sql)" = eba95a2f254b46d1ac47ce37bda958de9563b10c
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).name)")" = "$REAL_WORKER"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).d1_databases[0].database_id)")" = "$REAL_ID"
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).d1_databases[0].database_name)")" = "$REAL_DB"
          python3 - <<'PY'
          import subprocess
          allowed={
            'migrations/client3-watch/0006_client3_watch_sku_generations.sql',
            'worker/domains/catalog-retirement.ts',
            'worker/domains/client3-watch-catalog-delete.ts',
            'worker/domains/client3-watch-catalog-edit.ts',
            'worker/domains/client3-watch-catalog.ts',
            'worker/domains/client3-watch-history.ts',
            'worker/domains/client3-watch-provision.ts',
            'worker/domains/client3-watch-order-manual.ts',
            'worker/domains/client3-watch-revision-session.ts',
            'worker/domains/client3-watch-demand.ts',
            'worker/domains/client3-watch-returns.ts',
            'worker/domains/client3-watches.ts',
            'worker/domains/client3-watch-orders-read.ts',
            'src/features/client3/WatchCatalogDeleteAction.tsx',
            'src/features/client3/WatchCatalogEditor.tsx',
            'src/features/client3/WatchCatalogRetiredHistory.tsx',
            'src/features/client3/WatchCatalogVariantEditAction.tsx',
            'src/styles/client3-watch-catalog-polish.css',
            'src/styles/client3-watch-retired-history.css',
            'scripts/client3/test-watch-catalog-v6-release-20261104.mjs',
            'scripts/client3/test-watch-catalog-20261102.mjs',
            '.github/workflows/client3-approved-delete-v6-release-20261104.yml',
          }
          modified=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert modified==allowed, 'Unexpected or missing release files: '+repr(modified.symmetric_difference(allowed))
          from pathlib import Path
          mig=Path('migrations/client3-watch/0006_client3_watch_sku_generations.sql').read_text()
          import re
          ddl=re.findall(r'^\s*CREATE\s+(?:TABLE|INDEX)\s+IF\s+NOT\s+EXISTS\b',mig,re.I|re.M)
          assert len(ddl)==2,'v6 must create exactly one table and index'
          assert not re.search(r'^\s*(ALTER|DROP|UPDATE|DELETE|INSERT|REPLACE|TRUNCATE)\b',mig,re.I|re.M)
          print('SCOPED_CLIENT3_RELEASE_PATH_AND_MIGRATION_GUARDS_PASS')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Install and build exact isolated release
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: Exact retired SKU generations and stock/lifecycle regressions
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-catalog-v6-release-20261104.mjs
          node --experimental-strip-types scripts/client3/test-watch-catalog-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-provision-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-logistics-20261102.mjs
      - name: Read-only original D1 preflight — never apply pending 1004
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_variant_attributes_v5') v5,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_variant_attributes_v6') v6,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_retirement_operations') retirement_operations,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_retirement_history_events') retirement_history,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_order_details') watch_orders,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_engraving_item_readiness') engraving,
            (SELECT COUNT(*) FROM pragma_table_info('return_items') WHERE name='physical_tracking') returns_tracking,
            (SELECT COUNT(*) FROM pragma_table_info('exchanges') WHERE name='refund_return_id') exchange_finance" |
            jq -e '.[0].results[0]|select(.v5==1 and .v6>=0 and .retirement_operations==1 and .retirement_history==1 and .watch_orders==1 and .engraving==1 and .returns_tracking==1 and .exchange_finance==1)'
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results|length==0'
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM orders) orders_count,
            (SELECT COUNT(*) FROM order_items) item_count,
            (SELECT COUNT(*) FROM payments) payment_count,
            (SELECT COUNT(*) FROM inventory_movements) movement_count,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_total" |
            jq -c '.[0].results[0]' | tee /tmp/client3-before.json
          echo CLIENT3_ORIGINAL_READ_ONLY_PREFLIGHT_PASS
      - name: Install only additive v6 into original Client3 D1; no business row writes
        run: |
          set -euo pipefail
          test "$REAL_DB" = orders_db_client3_old_client
          test "$REAL_ID" = 0717f239-6d81-4837-8586-777d94e22c53
          actual="$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).d1_databases[0].database_id)")"
          test "$actual" = "$REAL_ID"
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc \
            --file=migrations/client3-watch/0006_client3_watch_sku_generations.sql
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_variant_attributes_v6') v6,
            (SELECT COUNT(*) FROM pragma_table_info('watch_variant_attributes_v6') WHERE name='watch_variant_id') identity,
            (SELECT COUNT(*) FROM pragma_table_info('watch_variant_attributes_v6') WHERE name='bracelet_color') strap,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_watch_v6_product_identity') v6index" |
            jq -e '.[0].results[0]|select(.v6==1 and .identity==1 and .strap==1 and .v6index==1)'
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results|length==0'
          echo ORIGINAL_CLIENT3_D1_V6_INSTALLED
      - name: Deploy exactly original Client3 Worker, no Main or Branch2
        run: |
          set -euo pipefail
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).name)")" = "$REAL_WORKER"
          npx wrangler deploy --config wrangler.jsonc
      - name: Verify compiled live Client3 assets, protected API, and foreign keys
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          for i in $(seq 1 10); do
            status="$(curl -sSL -o /tmp/c3-home -w '%{http_code}' --max-time 25 "$base/?c3_release=$GITHUB_SHA" || true)"
            if test "$status" = 200; then break; fi
            sleep 3
          done
          test "$status" = 200
          grep -Eq 'id="root"|type="module"' /tmp/c3-home
          asset="$(grep -Eo 'src="/assets/[^"]+\.js"' dist/client/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$asset"
          curl -fsSL --max-time 30 "$base$asset" >/tmp/c3-asset.js
          cmp -s "dist/client$asset" /tmp/c3-asset.js
          for path in '/api/client3/watches/orders?brand=TAUWACH' '/api/client3/watches/catalog/retired?brand=TAUWACH'; do
            status="$(curl -sS -o /tmp/c3-anon -w '%{http_code}' --max-time 20 "$base$path")"
            test "$status" = 401 -o "$status" = 403
          done
          npx wrangler d1 execute "$REAL_DB" --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results|length==0'
          echo CLIENT3_ORIGINAL_V6_RELEASE_VERIFIED
      - name: Write completion marker on release branch for independent GitHub read
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-status
          printf 'source_sha=%s\nstatus=%s\nrun_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\nworker=%s\ndatabase=%s\n' \
            "$GITHUB_SHA" "$JOB_STATUS" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$REAL_WORKER" "$REAL_DB" \
            > .release-status/client3-delete-v6-20261104.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-status/client3-delete-v6-20261104.txt
          git commit -m "ci(client3): record isolated v6 release result for run $GITHUB_RUN_ID" || true
          git push origin "HEAD:refs/heads/release/client3-delete-v6-20261104" || true
