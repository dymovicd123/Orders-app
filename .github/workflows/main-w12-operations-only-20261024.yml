name: Main W12 Operations Only
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/app/types.ts'
      - 'src/app/controllers/useOperationalViewModel.ts'
      - 'src/features/sections/InventorySection.tsx'
      - 'src/features/inventory/**'
      - 'src/styles/193-unified-inventory-operations.css'
      - 'src/styles/188e4-stocktake-usability.css'
      - 'worker/domains/inventory-movement.ts'
      - 'worker/domains/warehouse-operation-feedback.ts'
      - 'worker/index.ts'
      - 'scripts/test-w*-*.mjs'
      - '.github/workflows/main-w12-operations-only-20261024.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-w12-operations-only-20261024.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Operations SQL/runtime, regressions and application build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unified arrival, writeoff, transfer, correction UI
        run: |
          node --experimental-strip-types scripts/test-w6-unified-operations.mjs
          node --experimental-strip-types scripts/test-w8-warehouse-operation-integrity.mjs
          node --experimental-strip-types scripts/test-w9-correction-inline-variants.mjs
          node --experimental-strip-types scripts/test-w10-stock-label-legibility.mjs
      - name: Real SQL correction, reversal and transfer
        run: |
          node --experimental-strip-types scripts/test-w11-manual-correction-runtime.mjs
          node scripts/test-step191d-transfer-runtime-safety.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
      - name: Full TypeScript build
        run: npm run build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Strict operations-only scope and production D1 binding
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          baseline="ad9ae6e7f6663065575a92b58a1658de6a839caf"
          git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"
          changes="$(git diff --name-only "$baseline" "$GITHUB_SHA")"
          test -n "$changes"
          while IFS= read -r file;do
            [[ -z "$file" ]] && continue
            case "$file" in
              src/App.tsx|\
              src/app/types.ts|\
              src/app/controllers/useOperationalViewModel.ts|\
              src/features/sections/InventorySection.tsx|\
              src/features/inventory/unifiedOperationMath.ts|\
              src/features/inventory/views/InventoryUnifiedQuantityWorkspace.tsx|\
              src/features/inventory/views/StocktakeSharedInputs.tsx|\
              src/features/inventory/views/renderInventoryMovementPanel.tsx|\
              src/features/inventory/views/renderInventoryStocktakePanel.tsx|\
              src/styles/193-unified-inventory-operations.css|\
              src/styles/188e4-stocktake-usability.css|\
              worker/domains/inventory-movement.ts|\
              worker/domains/warehouse-operation-feedback.ts|\
              worker/index.ts|\
              scripts/test-w6-unified-operations.mjs|\
              scripts/test-w8-warehouse-operation-integrity.mjs|\
              scripts/test-w9-correction-inline-variants.mjs|\
              scripts/test-w10-stock-label-legibility.mjs|\
              scripts/test-w11-manual-correction-runtime.mjs|\
              .github/workflows/main-w12-operations-only-20261024.yml) ;;
              *) echo "Unreviewed main change: $file"; exit 11 ;;
            esac
          done <<< "$changes"
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders_db_branch2' wrangler.jsonc;then exit 12;fi
          if grep -Eq '^(migrations/|wrangler.jsonc|package.*json)' <<< "$changes";then exit 13;fi
          git diff --exit-code "$baseline" "$GITHUB_SHA" -- src/features/inventory/views/renderInventoryOverviewPanel.tsx src/features/inventory/views/renderInventoryHistoryPanel.tsx src/features/inventory/views/renderInventoryAttentionPanel.tsx
      - run: npm ci
      - name: Real SQL, operation UX, and safe quantity validation
        run: |
          node --experimental-strip-types scripts/test-w6-unified-operations.mjs
          node --experimental-strip-types scripts/test-w8-warehouse-operation-integrity.mjs
          node --experimental-strip-types scripts/test-w9-correction-inline-variants.mjs
          node --experimental-strip-types scripts/test-w10-stock-label-legibility.mjs
          node --experimental-strip-types scripts/test-w11-manual-correction-runtime.mjs
          node scripts/test-step191d-transfer-runtime-safety.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
      - name: Compile production bundle
        run: npm run build
      - name: Verify updated operation palette present in output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const files=fs.readdirSync('dist/client/assets')
          if(!files.some(file=>/\.(?:css|js)$/.test(file) && fs.readFileSync('dist/client/assets/'+file,'utf8').includes('--w12-accent')))throw Error('New operation CSS missing in main bundle')
          if(!files.some(file=>file.endsWith('.js') && fs.readFileSync('dist/client/assets/'+file,'utf8').includes('stocktake-reused-operations')))throw Error('Unified operation UI missing in main bundle')
          NODE
      - name: Deploy main Worker (no migrations)
        run: npx wrangler deploy
      - name: Confirm main site healthy
        run: |
          node --input-type=module <<'NODE'
          const host='https://orders-app.orders-clothes.workers.dev'
          for(let i=0;i<7;i++){
            try{
              const result=await fetch(host+'/?main_operations='+Date.now(),{cache:'no-store'})
              if(!result.ok || !(await result.text()).includes('/assets/'))throw Error('Main HTML unhealthy')
              console.log('MAIN_OPERATIONS_DEPLOYED')
              process.exit(0)
            }catch(e){if(i===6)throw e;await new Promise(r=>setTimeout(r,4000))}
          }
          NODE
