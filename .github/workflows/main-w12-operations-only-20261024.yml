name: Main W12 Operations Only
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/app/types.ts'
      - 'src/app/controllers/useOperationalViewModel.ts'
      - 'src/features/sections/InventorySection.tsx'
      - 'src/features/inventory/views/InventoryUnifiedQuantityWorkspace.tsx'
      - 'src/features/inventory/views/StocktakeSharedInputs.tsx'
      - 'src/styles/193-unified-inventory-operations.css'
      - 'src/styles/188e4-stocktake-usability.css'
      - 'worker/domains/warehouse-operation-feedback.ts'
      # The 2026-10-24 W12 panel gate is not a generic SKU/release gate.
      # Current inventory-movement/Worker regressions belong to executable
      # SQL + Worker/D1 tests; old snapshot-string tests must not block them.
      - 'scripts/test-w6-unified-operations.mjs'
      - 'scripts/test-w8-warehouse-operation-integrity.mjs'
      - 'scripts/test-w9-correction-inline-variants.mjs'
      - 'scripts/test-w10-stock-label-legibility.mjs'
      - '.github/workflows/main-w12-operations-only-20261024.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-w12-operations-only-20261024.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Operations SQL/runtime, regressions and application build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Unified arrival, writeoff, transfer, correction UI
        run: |
          node --experimental-strip-types scripts/test-w6-unified-operations.mjs
          node --experimental-strip-types scripts/test-w8-warehouse-operation-integrity.mjs
          node --experimental-strip-types scripts/test-w9-correction-inline-variants.mjs
          node --experimental-strip-types scripts/test-w10-stock-label-legibility.mjs
      - name: Real SQL correction, reversal and transfer
        run: |
          node --experimental-strip-types scripts/test-w11-manual-correction-runtime.mjs
          node scripts/test-step191d-transfer-runtime-safety.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
      - name: Full TypeScript build
        run: npm run build
