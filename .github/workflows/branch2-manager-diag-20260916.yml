name: Branch2 manager fixture diagnostic

on:
  push:
    branches:
      - audit/branch2-live-resolver-smoke-20260916
    paths:
      - .github/workflows/branch2-manager-diag-20260916.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read Branch2 managers only
        run: npx wrangler d1 execute orders_db_branch2 --remote --command="SELECT id,name,is_active FROM managers ORDER BY id;"
