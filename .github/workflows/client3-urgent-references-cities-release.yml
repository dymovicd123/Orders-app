name: Client3 urgent visible Russian references and read-only Main city copy release
on:
  push:
    branches: [client3/urgent-reference-russian-cities-20261103]
    paths: ['.github/workflows/client3-urgent-references-cities-release.yml']
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Release gate exact accepted candidate, third Worker and D1 only
        run: |
          set -eEuo pipefail
          trap 'printf "RELEASE_GATE_FAILED line %s: %s\\n" "$LINENO" "$BASH_COMMAND"' ERR
          test "$GITHUB_REF" = refs/heads/client3/urgent-reference-russian-cities-20261103
          test "$(git rev-parse HEAD^)" = 3739e45f4af92b8326c23710b927e93848c49ac1
          # Only the audited workflow itself may differ from accepted application SHA.
          test "$(git diff --name-only 3739e45f4af92b8326c23710b927e93848c49ac1 HEAD)" = .github/workflows/client3-urgent-references-cities-release.yml
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/client3-urgent-references-cities-release.yml
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41598802234 --jq .conclusion)" = success
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41598802234 --jq .head_sha)" = 3739e45f4af92b8326c23710b927e93848c49ac1
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci
      - name: Build tested Client3 only
        run: npm run build
      - name: Read-only pre-deploy third D1 counts, reserves and FK
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list orders_db_client3_old_client --remote --config wrangler.jsonc > /tmp/client3-stage5-migrations
          pending="$(grep -Eo '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/client3-stage5-migrations | sort -u || true)"
          if test -n "$pending"; then test "$pending" = 1000_russian_cities_leather_colors.sql; fi
          printf 'Pending isolated Client3 migrations: %s\n' "\${pending:-none}"
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
             (SELECT COUNT(*) FROM orders) orders_count,
             (SELECT COUNT(*) FROM order_items) items_count,
             (SELECT COUNT(*) FROM payments) payments_count,
             (SELECT COUNT(*) FROM financial_events) events_count,
             (SELECT COUNT(*) FROM returns) returns_count,
             (SELECT COUNT(*) FROM exchanges) exchanges_count,
             (SELECT COUNT(*) FROM inventory_movements) movements_count,
             (SELECT COUNT(*) FROM inventory_stock_checks) stock_checks_count,
             (SELECT COUNT(*) FROM inventory_stock) stock_rows,
             (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
             (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum,
             (SELECT COUNT(*) FROM watch_products) watch_products_count,
             (SELECT COUNT(*) FROM watch_variants) watch_variants_count,
             (SELECT COUNT(*) FROM app_users WHERE login='owner-monitor' AND role='admin' AND is_active=1) admin_exists,
             (SELECT COUNT(*) FROM sqlite_master WHERE name='watch_variant_attributes_v5') extensions_ready" \
             | jq -ce '.[0].results[0] | select(.orders_count>=2 and .admin_exists==1 and .extensions_ready==1)' > /tmp/client3-stage5-before
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
      - name: Apply ONLY isolated additive watch alias table migration
        run: |
          set -euo pipefail
          pending="$(grep -Eo '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/client3-stage5-migrations | sort -u || true)"
          if test -n "$pending"; then
            test "$pending" = 1000_russian_cities_leather_colors.sql
            printf 'y\n' | npx wrangler d1 migrations apply orders_db_client3_old_client --remote --config wrangler.jsonc
          fi
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name='watch_city_values'" \
            | jq -e '.[0].results | length==1'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT COUNT(*) AS n FROM watch_city_values WHERE kind='cities' AND is_active=1" \
            | jq -e '.[0].results[0].n>=46'
      - name: Import ACTIVE cities from Main via SELECT only; write to Client3 only
        run: |
          set -euo pipefail
          # Main is used only as a READ-ONLY source. Never deploy or write to Main.
          cat > /tmp/client3-city-main-readonly.jsonc <<'MAINCFG'
          {
            "name":"orders-city-readonly",
            "d1_databases":[{
              "binding":"DB",
              "database_name":"orders_db_prod",
              "database_id":"17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          MAINCFG
          npx wrangler d1 execute orders_db_prod --remote \
            --config /tmp/client3-city-main-readonly.jsonc --json \
            --command="SELECT value FROM reference_values WHERE kind='city' AND is_active=1 ORDER BY value LIMIT 4999" \
            > /tmp/client3-city-main-readonly.json
          node scripts/client3/sync-main-watch-cities-20261103.mjs \
            /tmp/client3-city-main-readonly.json /tmp/client3-city-sync.sql
          # Import is solely into Client3, never through the Main config.
          printf 'y\n' | npx wrangler d1 execute orders_db_client3_old_client --remote \
            --config wrangler.jsonc --file=/tmp/client3-city-sync.sql
          expected=$(jq '.[0].results | length' /tmp/client3-city-main-readonly.json)
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT COUNT(*) AS n FROM watch_city_values WHERE kind='cities' AND is_active=1" \
            | jq -e --argjson n "$expected" '.[0].results[0].n>=46 and .[0].results[0].n>=$n'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT COUNT(*) AS n FROM watch_reference_values WHERE kind='leatherColors' AND is_active=1 AND (REPLACE(value,'Ё','Е')='ЧЕРНЫЙ' OR value='КОРИЧНЕВЫЙ')" \
            | jq -e '.[0].results[0].n>=2'
      - name: Deploy third Worker only (Russian labels and additive city list)
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Published third app, protected endpoints and unchanged D1
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          test "$(curl -sSL -o /tmp/client3-stage5-html -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-stage5-html
          for endpoint in /api/client3/watches/stock/revision/start /api/client3/watches/stock/revision/count /api/client3/watches/stock/revision/complete /api/client3/watches/stock/revision/cancel /api/client3/watches/stock/bulk; do
            code=$(curl -sS -o /tmp/client3-stage5-guard -w '%{http_code}' --max-time 30 -X POST \
              -H 'Content-Type: application/json' --data '{"brand":"TAUWACH"}' "$base$endpoint")
            test "$code" = 401 -o "$code" = 403
          done
          for method in GET POST; do
            code=$(curl -sS -o /tmp/client3-ref-auth -w '%{http_code}' --max-time 30 \
              -X "$method" -H 'Content-Type: application/json' \
              --data '{"kind":"cities","value":"UNAUTHORIZED"}' \
              "$base/api/client3/watches/references")
            test "$code" = 401 -o "$code" = 403
          done
          for method in GET POST DELETE; do
            code=$(curl -sS -o /tmp/client3-stage5-alias-guard -w '%{http_code}' --max-time 30 \
              -X "$method" -H 'Content-Type: application/json' \
              --data '{"brand":"TAUWACH","watchProductId":1,"alias":"unauthorized"}' \
              "$base/api/client3/watches/catalog/model-aliases?brand=TAUWACH&watchProductId=1")
            test "$code" = 401 -o "$code" = 403
          done
          code=$(curl -sS -o /tmp/client3-stage5-history -w '%{http_code}' --max-time 30 \
            "$base/api/client3/watches/stock/history?brand=TAUWACH")
          test "$code" = 401 -o "$code" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
             (SELECT COUNT(*) FROM orders) orders_count,
             (SELECT COUNT(*) FROM order_items) items_count,
             (SELECT COUNT(*) FROM payments) payments_count,
             (SELECT COUNT(*) FROM financial_events) events_count,
             (SELECT COUNT(*) FROM returns) returns_count,
             (SELECT COUNT(*) FROM exchanges) exchanges_count,
             (SELECT COUNT(*) FROM inventory_movements) movements_count,
             (SELECT COUNT(*) FROM inventory_stock_checks) stock_checks_count,
             (SELECT COUNT(*) FROM inventory_stock) stock_rows,
             (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
             (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum,
             (SELECT COUNT(*) FROM watch_products) watch_products_count,
             (SELECT COUNT(*) FROM watch_variants) watch_variants_count,
             (SELECT COUNT(*) FROM app_users WHERE login='owner-monitor' AND role='admin' AND is_active=1) admin_exists,
             (SELECT COUNT(*) FROM sqlite_master WHERE name='watch_variant_attributes_v5') extensions_ready" \
            | jq -ce '.[0].results[0]' > /tmp/client3-stage5-after
          diff -u /tmp/client3-stage5-before /tmp/client3-stage5-after
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
          echo CLIENT3_STAGE5_WAREHOUSE_RESOLVER_RELEASE_SUCCESS
      - name: Report successful bounded Stage5 milestone
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Urgent Client3 Russian reference selectors, Main cities and leather colors LIVE: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Exact accepted tests https://github.com/dymovicd123/Orders-app/actions/runs/41598802234. Fixed native Windows watch variant selects (dark readable text, fallback choices), translated watch reference labels to Russian uppercase without changing SKU identity, added ЧЕРНЫЙ/КОРИЧНЕВЫЙ leather colors, 46 seed Main cities plus READ-ONLY copy of all currently active Main city references to isolated Client3. City suggestions in orders remain editable/free-text. All Main-backed stock/order/return/exchange regressions pass. THIRD Worker only; ONE additive Client3 city table and leather-color seed migration, NO remote business/stock/reservation writes, counts and FK unchanged; Main and Branch2 untouched. Still OPEN: authenticated desktop/mobile roles walkthrough and serialized cross-brand same-source persistent revisions; arbitrary model aliases now available."
      - name: Record release failure/blocker, never claim success
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Urgent Client3 references/cities release FAILED/BLOCKED; inspect run https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Exact accepted source 3739e45f4af92b8326c23710b927e93848c49ac1; no Main/Branch2 release attempted."
