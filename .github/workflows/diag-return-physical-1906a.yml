name: Diagnose return physical 1906A

on:
  push:
    branches:
      - returns-physical-intake-r1
    paths:
      - .github/workflows/diag-return-physical-1906a.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: returns-physical-intake-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact declaration diff
        run: node .github/scripts/diag-return-physical-1906a.mjs
