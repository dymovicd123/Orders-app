name: Finalize return physical 1906A

on:
  push:
    branches:
      - returns-physical-intake-r1
    paths:
      - .github/workflows/finalize-return-physical-1906a.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: returns-physical-intake-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate exact manifest and 1906A layer
        run: node .github/scripts/finalize-return-physical-1906a.mjs
      - name: Validate focused and 1906A
        run: |
          node scripts/test-return-exchange-physical-receipt-r1.mjs
          node scripts/test-step1906a-worker-modularization.mjs
      - name: Commit permanent registration and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/scripts/diag-return-physical-1906a.mjs \
            .github/workflows/diag-return-physical-1906a.yml \
            .github/scripts/finalize-return-physical-1906a.mjs \
            .github/workflows/finalize-return-physical-1906a.yml \
            .github/workflows/validate-return-physical-r1.yml
          git add scripts/returns-physical-intake-r1-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          git commit -m "Register physical intake Worker structural delta"
          git push origin HEAD:returns-physical-intake-r1
