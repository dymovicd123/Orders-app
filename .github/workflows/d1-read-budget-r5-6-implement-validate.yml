name: D1 read budget R5.6 implement and validate

on:
  push:
    branches: [safe/d1-read-budget-r5-6-finance-summary-20260904]
    paths:
      - scripts/.d1-read-budget-r5-6-implement-trigger

permissions:
  contents: write

jobs:
  implement-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r5-6-finance-summary-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact R5.6 safe-branch patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_exact(path, old, new, expected=1):
              p=Path(path); text=p.read_text()
              count=text.count(old)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected} exact matches, found {count}')
              p.write_text(text.replace(old,new))

          replace_exact(
              'worker/domains/references.ts',
              "AND COALESCE(oi.stock_writeoff_status, '') IN ('writeoff_disabled', 'pending_manual_writeoff')",
              "AND oi.stock_writeoff_status IN ('writeoff_disabled', 'pending_manual_writeoff')",
          )
          replace_exact(
              'worker/domains/orders-read.ts',
              'WHERE COALESCE(is_workshop, 0) = 1\n        GROUP BY order_id',
              'WHERE is_workshop = 1\n        GROUP BY order_id',
          )

          migration = '''-- R5.6 — measured Finance / Orders Summary D1 read-budget indexes.\n-- Additive indexes only. They must not alter orders, payments, returns, stock, reservations,\n-- workshop tasks, writeoff state, or any other business row. Runtime predicate rewrites paired\n-- with this migration were separately benchmarked as truth-equivalent on the Production snapshot.\n\n-- /api/reports/orders-summary: payment-date range + order validation + SUM(amount).\nCREATE INDEX IF NOT EXISTS idx_payments_payment_date_order_amount\n  ON payments(payment_date, order_id, amount);\n\n-- Global current-debt card. The exact partial predicate matches the runtime query.\nCREATE INDEX IF NOT EXISTS idx_orders_current_debt_partial\n  ON orders(debt_amount)\n  WHERE debt_amount > 0 AND order_status <> 'deleted';\n\n-- Routine pending-writeoff counter. Only non-workshop positive-quantity rows are candidates.\nCREATE INDEX IF NOT EXISTS idx_order_items_pending_writeoff_status_order\n  ON order_items(stock_writeoff_status, order_id)\n  WHERE is_workshop = 0 AND quantity > 0;\n\n-- Orders period summary: preserve every workshop quantity, including historical edge values;\n-- only replace COALESCE(is_workshop, 0) = 1 with the logically identical is_workshop = 1.\nCREATE INDEX IF NOT EXISTS idx_order_items_workshop_order_quantity\n  ON order_items(order_id, quantity)\n  WHERE is_workshop = 1;\n\nPRAGMA optimize;\n'''
          Path('migrations/0066_v72_d1_read_budget_r5_finance_summary_indexes.sql').write_text(migration)

          test = r'''import fs from 'node:fs'\n\nconst migration = fs.readFileSync('migrations/0066_v72_d1_read_budget_r5_finance_summary_indexes.sql', 'utf8')\nconst references = fs.readFileSync('worker/domains/references.ts', 'utf8')\nconst ordersRead = fs.readFileSync('worker/domains/orders-read.ts', 'utf8')\nconst fail = (message) => { throw new Error(message) }\nconst check = (condition, message) => { if (!condition) fail(message) }\n\ntry {\n  check(!/\\b(?:INSERT|UPDATE|DELETE|REPLACE)\\b/i.test(migration), 'R5.6 migration must not mutate business rows')\n  check(!/\\b(?:DROP|ALTER)\\b/i.test(migration), 'R5.6 migration must be additive only')\n  for (const marker of [\n    'idx_payments_payment_date_order_amount',\n    'idx_orders_current_debt_partial',\n    'idx_order_items_pending_writeoff_status_order',\n    'idx_order_items_workshop_order_quantity',\n  ]) check(migration.includes(marker), `R5.6 index missing: ${marker}`)\n  check(migration.includes('ON payments(payment_date, order_id, amount)'), 'R5.6 payment covering index shape changed')\n  check(migration.includes("WHERE debt_amount > 0 AND order_status <> 'deleted'"), 'R5.6 current-debt partial truth changed')\n  check(migration.includes('WHERE is_workshop = 0 AND quantity > 0'), 'R5.6 pending-writeoff partial scope changed')\n  check(migration.includes('WHERE is_workshop = 1;'), 'R5.6 workshop summary partial scope changed')\n\n  check(references.includes("AND oi.stock_writeoff_status IN ('writeoff_disabled', 'pending_manual_writeoff')"), 'Pending writeoff query is not indexable')\n  check(!references.includes("COALESCE(oi.stock_writeoff_status, '') IN ('writeoff_disabled', 'pending_manual_writeoff')"), 'Pending writeoff COALESCE scan predicate returned')\n  check(ordersRead.includes('WHERE is_workshop = 1\\n        GROUP BY order_id'), 'Orders summary workshop predicate is not indexable')\n  check(!ordersRead.includes('WHERE COALESCE(is_workshop, 0) = 1\\n        GROUP BY order_id'), 'Orders summary workshop COALESCE scan predicate returned')\n\n  console.log('D1 READ BUDGET R5.6 TESTS PASSED — measured additive indexes; writeoff/workshop predicate truth preserved')\n} catch (error) {\n  console.error(`D1 READ BUDGET R5.6 TESTS FAILED: ${error?.message || error}`)\n  process.exit(1)\n}\n'''.replace('\\n','\n')
          Path('scripts/test-d1-read-budget-r5-6.mjs').write_text(test)

          package_path=Path('package.json')
          package=json.loads(package_path.read_text())
          old='node scripts/test-d1-read-budget-r5-5.mjs && node scripts/test-manager-routine-access-r1.mjs'
          new='node scripts/test-d1-read-budget-r5-5.mjs && node scripts/test-d1-read-budget-r5-6.mjs && node scripts/test-manager-routine-access-r1.mjs'
          release=package['scripts']['release:check']
          if release.count(old)!=1: raise RuntimeError('package.json R5.5 release anchor changed')
          package['scripts']['release:check']=release.replace(old,new)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2)+'\n')

          gate=Path('scripts/test-step1906c-dead-code-cleanup.mjs')
          text=gate.read_text()
          old="'0065_v72_d1_read_budget_r5_workshop_variant_order_index.sql']"
          new="'0065_v72_d1_read_budget_r5_workshop_variant_order_index.sql', '0066_v72_d1_read_budget_r5_finance_summary_indexes.sql']"
          if text.count(old)!=1: raise RuntimeError('190.6C additive migration anchor changed')
          gate.write_text(text.replace(old,new))
          PY

          git diff --check
          git status --short
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Focused R5.6 regression
        run: node scripts/test-d1-read-budget-r5-6.mjs
      - name: Database safety
        run: npm run verify:db-safety
      - name: Typecheck
        run: npm run typecheck
      - name: Full release gate
        run: npm run release:check
      - name: Production build
        run: npm run build
      - name: Worker dry-run
        run: npx wrangler deploy --dry-run
      - name: Commit validated R5.6 implementation to safe branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/domains/references.ts worker/domains/orders-read.ts migrations/0066_v72_d1_read_budget_r5_finance_summary_indexes.sql scripts/test-d1-read-budget-r5-6.mjs scripts/test-step1906c-dead-code-cleanup.mjs package.json
          git diff --cached --check
          git commit -m 'R5.6: reduce finance and orders summary D1 reads'
          git push origin HEAD:safe/d1-read-budget-r5-6-finance-summary-20260904
