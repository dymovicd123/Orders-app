name: Stage03 Production schema prep 0073-0074

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage03-production-schema-prep-0073-0074.yml'

permissions:
  contents: read

jobs:
  apply:
    name: Apply Stage03 0073 then 0074 to Production D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4

      - name: Hard-stop on environment or migration drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders-app-branch2' wrangler.jsonc || grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then
            echo "Branch2 binding detected. Refusing Production schema prep." >&2
            exit 20
          fi

          migration73='migrations/0073_v72_order_item_pricing_foundation.sql'
          grep -Fq "ADD COLUMN pricing_mode TEXT NOT NULL DEFAULT 'legacy_manual_total'" "$migration73"
          grep -Fq "CHECK (pricing_mode IN ('legacy_manual_total', 'itemized_v1'))" "$migration73"
          grep -Fq 'ADD COLUMN catalog_price_snapshot INTEGER' "$migration73"
          grep -Fq 'catalog_price_snapshot IS NULL OR catalog_price_snapshot >= 0' "$migration73"
          if grep -Eiq '\b(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM|REPLACE[[:space:]]+INTO)\b' "$migration73"; then
            echo "Migration 0073 contains a business-row write/backfill. Refusing migration." >&2
            exit 21
          fi
          if grep -Fiq 'catalog_execution_prices' "$migration73"; then
            echo "Migration 0073 attempts to infer historic prices from current Catalog. Refusing migration." >&2
            exit 22
          fi

          migration74='migrations/0074_v72_retained_order_pricing_mode.sql'
          grep -Fq 'ALTER TABLE retained_order_summaries' "$migration74"
          grep -Fq "ADD COLUMN pricing_mode TEXT NOT NULL DEFAULT 'legacy_manual_total'" "$migration74"
          grep -Fq "CHECK (pricing_mode IN ('legacy_manual_total', 'itemized_v1'))" "$migration74"
          if grep -Eiq '\b(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM|REPLACE[[:space:]]+INTO)\b' "$migration74"; then
            echo "Migration 0074 contains a business-row write/backfill. Refusing migration." >&2
            exit 23
          fi
          if grep -Fiq 'catalog_execution_prices' "$migration74" || grep -Fiq 'catalog_price_snapshot' "$migration74"; then
            echo "Migration 0074 attempts to infer retained pricing from Catalog data. Refusing migration." >&2
            exit 24
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Preflight Production schema state
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM pragma_table_info('orders') WHERE name = 'pricing_mode') AS orders_pricing_mode,
              (SELECT COUNT(*) FROM pragma_table_info('order_items') WHERE name = 'catalog_price_snapshot') AS items_catalog_snapshot,
              (SELECT COUNT(*) FROM pragma_table_info('retained_order_summaries') WHERE name = 'pricing_mode') AS retained_pricing_mode"             --json)"
          echo "$result"
          orders_col="$(jq -r '.[0].results[0].orders_pricing_mode // -1' <<<"$result")"
          items_col="$(jq -r '.[0].results[0].items_catalog_snapshot // -1' <<<"$result")"
          retained_col="$(jq -r '.[0].results[0].retained_pricing_mode // -1' <<<"$result")"

          if [[ "$orders_col" != "$items_col" ]]; then
            echo "Partial 0073 state detected: orders.pricing_mode=$orders_col order_items.catalog_price_snapshot=$items_col. Refusing automatic repair." >&2
            exit 25
          fi
          [[ "$orders_col" == "0" || "$orders_col" == "1" ]] || {
            echo "Unexpected 0073 schema counts." >&2
            exit 26
          }
          [[ "$retained_col" == "0" || "$retained_col" == "1" ]] || {
            echo "Unexpected 0074 schema count." >&2
            exit 27
          }
          echo "PRE_0073_PRESENT=$orders_col" >> "$GITHUB_ENV"
          echo "PRE_0074_PRESENT=$retained_col" >> "$GITHUB_ENV"

      - name: Capture Production finance fingerprints
        shell: bash
        run: |
          set -euo pipefail
          live="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COALESCE(SUM(total_amount), 0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount), 0) FROM orders) AS orders_received,
              (SELECT COALESCE(SUM(debt_amount), 0) FROM orders) AS orders_debt,
              (SELECT COALESCE(SUM(return_amount), 0) FROM orders) AS orders_return,
              (SELECT COUNT(*) FROM order_items) AS item_count,
              (SELECT COALESCE(SUM(quantity), 0) FROM order_items) AS item_quantity,
              (SELECT COALESCE(SUM(unit_price), 0) FROM order_items) AS item_unit_price_sum,
              (SELECT COALESCE(SUM(line_total), 0) FROM order_items) AS item_line_total_sum,
              (SELECT COUNT(*) FROM payments) AS payment_count,
              (SELECT COALESCE(SUM(amount), 0) FROM payments) AS payment_amount,
              (SELECT COUNT(*) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_count,
              (SELECT COALESCE(SUM(amount), 0) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_amount,
              (SELECT COUNT(*) FROM exchanges WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_exchange_count"             --json)"
          echo "$live"
          live_fp="$(jq -cS '.[0].results[0]' <<<"$live")"
          [[ -n "$live_fp" && "$live_fp" != "null" ]] || {
            echo "Could not capture Production live finance fingerprint." >&2
            exit 28
          }
          printf '%s' "$live_fp" > /tmp/stage03-prod-live-before.json

          retained="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM retained_order_summaries) AS retained_count,
              (SELECT COALESCE(SUM(total_amount), 0) FROM retained_order_summaries) AS retained_total,
              (SELECT COALESCE(SUM(received_amount), 0) FROM retained_order_summaries) AS retained_received,
              (SELECT COALESCE(SUM(debt_amount), 0) FROM retained_order_summaries) AS retained_debt,
              (SELECT COALESCE(SUM(return_amount), 0) FROM retained_order_summaries) AS retained_return,
              (SELECT COALESCE(SUM(item_count), 0) FROM retained_order_summaries) AS retained_items,
              (SELECT COALESCE(SUM(payment_count), 0) FROM retained_order_summaries) AS retained_payments,
              (SELECT COALESCE(SUM(return_count), 0) FROM retained_order_summaries) AS retained_returns"             --json)"
          echo "$retained"
          retained_fp="$(jq -cS '.[0].results[0]' <<<"$retained")"
          [[ -n "$retained_fp" && "$retained_fp" != "null" ]] || {
            echo "Could not capture Production retained-history fingerprint." >&2
            exit 29
          }
          printf '%s' "$retained_fp" > /tmp/stage03-prod-retained-before.json

      - name: Apply 0073 if absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRE_0073_PRESENT" == "1" ]]; then
            echo "0073 columns already exist; verifying instead of reapplying."
          else
            npx wrangler d1 execute orders_db_prod               --remote               --config wrangler.jsonc               --file migrations/0073_v72_order_item_pricing_foundation.sql
          fi

      - name: Verify 0073 legacy classification and zero historical price snapshots
        shell: bash
        run: |
          set -euo pipefail
          orders_schema="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT name, type, \"notnull\" AS not_null, dflt_value FROM pragma_table_info('orders') WHERE name='pricing_mode'"             --json)"
          items_schema="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT name, type FROM pragma_table_info('order_items') WHERE name='catalog_price_snapshot'"             --json)"
          echo "$orders_schema"
          echo "$items_schema"
          [[ "$(jq -r '.[0].results | length' <<<"$orders_schema")" == "1" ]] || {
            echo "orders.pricing_mode column is missing or duplicated." >&2
            exit 30
          }
          [[ "$(jq -r '.[0].results[0].type // ""' <<<"$orders_schema")" == "TEXT" && "$(jq -r '.[0].results[0].not_null // 0' <<<"$orders_schema")" == "1" && "$(jq -r '.[0].results[0].dflt_value // ""' <<<"$orders_schema")" == "'legacy_manual_total'" ]] || {
            echo "orders.pricing_mode column shape/default is not the expected Stage03 contract." >&2
            exit 31
          }
          [[ "$(jq -r '.[0].results | length' <<<"$items_schema")" == "1" && "$(jq -r '.[0].results[0].type // ""' <<<"$items_schema")" == "INTEGER" ]] || {
            echo "order_items.catalog_price_snapshot column shape is not the expected Stage03 contract." >&2
            exit 32
          }

          orders="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT
              COUNT(*) AS orders_count,
              SUM(CASE WHEN pricing_mode='legacy_manual_total' THEN 1 ELSE 0 END) AS legacy_count,
              SUM(CASE WHEN pricing_mode='itemized_v1' THEN 1 ELSE 0 END) AS itemized_count,
              SUM(CASE WHEN pricing_mode IS NULL OR pricing_mode NOT IN ('legacy_manual_total','itemized_v1') THEN 1 ELSE 0 END) AS invalid_count
              FROM orders"             --json)"
          echo "$orders"
          orders_count="$(jq -r '.[0].results[0].orders_count // 0' <<<"$orders")"
          legacy_count="$(jq -r '.[0].results[0].legacy_count // 0' <<<"$orders")"
          itemized_count="$(jq -r '.[0].results[0].itemized_count // 0' <<<"$orders")"
          invalid_count="$(jq -r '.[0].results[0].invalid_count // 0' <<<"$orders")"
          [[ "$legacy_count" == "$orders_count" && "$itemized_count" == "0" && "$invalid_count" == "0" ]] || {
            echo "Before Stage03 runtime rollout, all existing Production orders must remain legacy/manual." >&2
            exit 33
          }

          items="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT COUNT(*) AS snapshot_rows FROM order_items WHERE catalog_price_snapshot IS NOT NULL"             --json)"
          echo "$items"
          [[ "$(jq -r '.[0].results[0].snapshot_rows // 0' <<<"$items")" == "0" ]] || {
            echo "Historical Production order items unexpectedly received Catalog price snapshots." >&2
            exit 34
          }

      - name: Apply 0074 if absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRE_0074_PRESENT" == "1" ]]; then
            echo "0074 column already exists; verifying instead of reapplying."
          else
            npx wrangler d1 execute orders_db_prod               --remote               --config wrangler.jsonc               --file migrations/0074_v72_retained_order_pricing_mode.sql
          fi

      - name: Verify 0074 retained legacy classification
        shell: bash
        run: |
          set -euo pipefail
          schema="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT name, type, \"notnull\" AS not_null, dflt_value FROM pragma_table_info('retained_order_summaries') WHERE name='pricing_mode'"             --json)"
          echo "$schema"
          [[ "$(jq -r '.[0].results | length' <<<"$schema")" == "1" && "$(jq -r '.[0].results[0].type // ""' <<<"$schema")" == "TEXT" && "$(jq -r '.[0].results[0].not_null // 0' <<<"$schema")" == "1" && "$(jq -r '.[0].results[0].dflt_value // ""' <<<"$schema")" == "'legacy_manual_total'" ]] || {
            echo "retained_order_summaries.pricing_mode column shape/default is not the expected Stage03 contract." >&2
            exit 35
          }

          retained="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT
              COUNT(*) AS retained_count,
              SUM(CASE WHEN pricing_mode='legacy_manual_total' THEN 1 ELSE 0 END) AS legacy_count,
              SUM(CASE WHEN pricing_mode='itemized_v1' THEN 1 ELSE 0 END) AS itemized_count,
              SUM(CASE WHEN pricing_mode IS NULL OR pricing_mode NOT IN ('legacy_manual_total','itemized_v1') THEN 1 ELSE 0 END) AS invalid_count
              FROM retained_order_summaries"             --json)"
          echo "$retained"
          retained_count="$(jq -r '.[0].results[0].retained_count // 0' <<<"$retained")"
          legacy_count="$(jq -r '.[0].results[0].legacy_count // 0' <<<"$retained")"
          itemized_count="$(jq -r '.[0].results[0].itemized_count // 0' <<<"$retained")"
          invalid_count="$(jq -r '.[0].results[0].invalid_count // 0' <<<"$retained")"
          [[ "$legacy_count" == "$retained_count" && "$itemized_count" == "0" && "$invalid_count" == "0" ]] || {
            echo "Before Stage03 runtime rollout, all retained Production history must remain legacy/manual." >&2
            exit 36
          }

      - name: Verify Production finance fingerprints unchanged
        shell: bash
        run: |
          set -euo pipefail
          live="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COALESCE(SUM(total_amount), 0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount), 0) FROM orders) AS orders_received,
              (SELECT COALESCE(SUM(debt_amount), 0) FROM orders) AS orders_debt,
              (SELECT COALESCE(SUM(return_amount), 0) FROM orders) AS orders_return,
              (SELECT COUNT(*) FROM order_items) AS item_count,
              (SELECT COALESCE(SUM(quantity), 0) FROM order_items) AS item_quantity,
              (SELECT COALESCE(SUM(unit_price), 0) FROM order_items) AS item_unit_price_sum,
              (SELECT COALESCE(SUM(line_total), 0) FROM order_items) AS item_line_total_sum,
              (SELECT COUNT(*) FROM payments) AS payment_count,
              (SELECT COALESCE(SUM(amount), 0) FROM payments) AS payment_amount,
              (SELECT COUNT(*) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_count,
              (SELECT COALESCE(SUM(amount), 0) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_amount,
              (SELECT COUNT(*) FROM exchanges WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_exchange_count"             --json)"
          after_live="$(jq -cS '.[0].results[0]' <<<"$live")"
          before_live="$(cat /tmp/stage03-prod-live-before.json)"
          [[ "$after_live" == "$before_live" ]] || {
            echo "Production live finance fingerprint changed during Stage03 schema prep." >&2
            echo "Before: $before_live" >&2
            echo "After:  $after_live" >&2
            exit 37
          }

          retained="$(npx wrangler d1 execute orders_db_prod             --remote             --config wrangler.jsonc             --command "SELECT
              (SELECT COUNT(*) FROM retained_order_summaries) AS retained_count,
              (SELECT COALESCE(SUM(total_amount), 0) FROM retained_order_summaries) AS retained_total,
              (SELECT COALESCE(SUM(received_amount), 0) FROM retained_order_summaries) AS retained_received,
              (SELECT COALESCE(SUM(debt_amount), 0) FROM retained_order_summaries) AS retained_debt,
              (SELECT COALESCE(SUM(return_amount), 0) FROM retained_order_summaries) AS retained_return,
              (SELECT COALESCE(SUM(item_count), 0) FROM retained_order_summaries) AS retained_items,
              (SELECT COALESCE(SUM(payment_count), 0) FROM retained_order_summaries) AS retained_payments,
              (SELECT COALESCE(SUM(return_count), 0) FROM retained_order_summaries) AS retained_returns"             --json)"
          after_retained="$(jq -cS '.[0].results[0]' <<<"$retained")"
          before_retained="$(cat /tmp/stage03-prod-retained-before.json)"
          [[ "$after_retained" == "$before_retained" ]] || {
            echo "Production retained-history fingerprint changed during Stage03 schema prep." >&2
            echo "Before: $before_retained" >&2
            echo "After:  $after_retained" >&2
            exit 38
          }

          echo "Stage03 Production schema prep verified: 0073/0074 are present, all pre-rollout history remains legacy-classified, no historical Catalog snapshots were fabricated, and finance fingerprints are unchanged."
