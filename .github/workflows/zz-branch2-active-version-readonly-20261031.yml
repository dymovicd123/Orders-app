name: "Branch2 active Cloudflare version audit — GET ONLY, NO DEPLOY"
on:
  push:
    branches: [audit/branch2-active-version-readonly-20261031]
    paths:
      - '.github/workflows/zz-branch2-active-version-readonly-20261031.yml'
      - 'scripts/ops/branch2-active-version-readonly-20261031.mjs'
permissions:
  contents: read
jobs:
  read-only:
    if: github.ref == 'refs/heads/audit/branch2-active-version-readonly-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Syntax validation
        run: node --check scripts/ops/branch2-active-version-readonly-20261031.mjs
      - name: Read only active deployments, preview version and upload-only trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ops/branch2-active-version-readonly-20261031.mjs
