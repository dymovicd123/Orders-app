name: Main Timesheet Action Autosave Scoped Port CI 20261121
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/team/**'
      - 'src/features/sections/TeamSection.tsx'
      - 'src/app/types.ts'
      - 'worker/domains/team-weekly-schedule.ts'
      - 'worker/domains/team-schedule-access.ts'
      - 'worker/index.ts'
      - 'scripts/test-team-*.mjs'
      - 'scripts/test-main-timesheet-autosave-port-20261121.mjs'
      - '.github/workflows/ci-main-timesheet-autosave-port-20261121.yml'
permissions:
  contents: read
jobs:
  scoped-main-port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Main supervisor, role isolation and weekly autosave
        run: |
          set -euo pipefail
          node scripts/test-main-timesheet-autosave-port-20261121.mjs
          node scripts/test-team-schedule-supervisor-20261121.mjs
          node scripts/test-team-weekly-schedule-20261121.mjs
          node scripts/test-team-week-autosave-20261121.mjs
          node scripts/test-team-weekly-navigation-save-20261121.mjs
          node scripts/test-team-timesheet-bulk-safe-20261110.mjs
          node scripts/test-team-timesheet-mobile-ux-20261110.mjs
          node scripts/test-team-timesheet-report-v2-20261110.mjs
          node scripts/test-team-attendance-v1-20261110.mjs
          node scripts/test-team-attendance-manager-ux-20261110.mjs
          node scripts/test-main-manager-three-workspaces-20261022.mjs
          node scripts/test-auth-production-team-access.mjs
          node scripts/test-main-attendance-schema-preserve-20261110.mjs
      - name: Recheck current Main business regression gate
        run: node scripts/test-main-current-business-release-20261031.mjs
      - name: Main production build
        run: npm run build
      - name: Verify production target and Worker package, never deploy
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          grep -Fq '"keep_vars": true' wrangler.jsonc
          ! grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const src=readFileSync('wrangler.jsonc','utf8')
          const safe=src.replace(/"build":\s*\{\s*"command":\s*"npm run build"\s*\},/,'')
          if(safe===src)throw Error('Missing build entry in current Main')
          writeFileSync('.main-timesheet-qa.jsonc',safe)
          NODE
          npx --no-install wrangler deploy --config .main-timesheet-qa.jsonc --name orders-app --keep-vars --strict --dry-run --outdir .main-timesheet-qa-only
