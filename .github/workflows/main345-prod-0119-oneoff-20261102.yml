name: Main Stage345 one-off additive 0119 production migration
on:
  push:
    branches: [candidate/main-stage345-port-20261102]
    paths:
      - '.github/workflows/main345-prod-0119-oneoff-20261102.yml'
permissions:
  contents: read
concurrency:
  group: orders345-main-prod-schema-0119
  cancel-in-progress: false
jobs:
  migrate-0119:
    if: github.ref == 'refs/heads/candidate/main-stage345-port-20261102' && startsWith(github.event.head_commit.message, 'candidate(main345-migration):')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Exact Main baseline, reviewed additive migration and environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/candidate/main-stage345-port-20261102'
          test "$(git rev-parse HEAD^)" = '42d51460fa09c84a55ab0c62f9d3aa4537495aad'
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = '68eb304be61483145345ba0a9259a05398b9aecb'
          git merge-base --is-ancestor 68eb304be61483145345ba0a9259a05398b9aecb HEAD
          test "$(git hash-object migrations/0119_v72_order_dispatch_lineage.sql)" = 'c26335986db20a775ef302a43e39bc7737c149ae'
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          ! grep -Eiq '^[[:space:]]*(UPDATE|DELETE|DROP|ALTER|INSERT|REPLACE)[[:space:]]' migrations/0119_v72_order_dispatch_lineage.sql
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'MAIN345_PREDEPLOY_SCHEMA_SCOPE_PASS'
      - name: Reverify tested candidate before production D1 migration
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-work733-smart-exchange-inbox-20261101.mjs
          node --experimental-strip-types scripts/test-stage345-concurrent-return-exchange-http-20261031.mjs
          node --experimental-strip-types scripts/test-stage345-concurrent-legacy-return-exchange-http-20261031.mjs
          node --experimental-strip-types scripts/test-stage5b-http-routes-20261101.mjs
          node --experimental-strip-types scripts/test-stage5b-dispatch-atomic-d1-20261101.mjs
          npm run release:check
          npm run build
      - name: Read-only D1 schema preflight and business fingerprint
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --json --command="SELECT (SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('order_dispatches','order_dispatch_items','order_dispatch_corrections')) AS n, (SELECT count(*) FROM order_items) AS items, (SELECT count(*) FROM orders) AS orders" > /tmp/main345-pre-schema.json
          jq -e '.[0].results[0].n==0 and .[0].results[0].items>0 and .[0].results[0].orders>0' /tmp/main345-pre-schema.json
          cat > /tmp/main345-fingerprint.sql <<'SQL'
          SELECT
            (SELECT count(*) FROM orders) AS orders_count,
            (SELECT coalesce(sum(total_amount),0) FROM orders) AS orders_total,
            (SELECT coalesce(sum(received_amount),0) FROM orders) AS orders_received,
            (SELECT coalesce(sum(debt_amount),0) FROM orders) AS orders_debt,
            (SELECT count(*) FROM order_items) AS item_count,
            (SELECT coalesce(sum(quantity),0) FROM order_items) AS item_quantity,
            (SELECT count(*) FROM payments) AS payment_count,
            (SELECT count(*) FROM returns) AS return_count,
            (SELECT count(*) FROM exchanges) AS exchange_count,
            (SELECT count(*) FROM inventory_movements) AS movements_count,
            (SELECT count(*) FROM inventory_stock) AS stock_count,
            (SELECT coalesce(sum(quantity),0) FROM inventory_stock) AS physical_total,
            (SELECT coalesce(sum(reserved_quantity),0) FROM inventory_stock) AS reserved_total,
            (SELECT count(*) FROM inventory_reservations) AS reservation_count;
          SQL
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --json --command="$(cat /tmp/main345-fingerprint.sql)" | jq -cS '.[0].results[0]' > /tmp/main345-business-before.json
          test -s /tmp/main345-business-before.json
          echo 'PROD_BUSINESS_FINGERPRINT_BEFORE_CAPTURED'
      - name: Capture mandatory D1 Time Travel restore bookmark before any write
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/17e68a41-1d58-4a36-8a63-47c3e32443c4/time_travel/bookmark"             | jq -er 'if .success==true and (.result.bookmark|type=="string") and (.result.bookmark|length>=32) then .result.bookmark else error("Restore bookmark unavailable") end' > /tmp/main345-restore-bookmark
          test -s /tmp/main345-restore-bookmark
          echo "D1 Time Travel bookmark BEFORE 0119: $(cat /tmp/main345-restore-bookmark)" >> "$GITHUB_STEP_SUMMARY"
          echo 'No automatic restoration; later real customer orders must be preserved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply ONLY schema 0119 to production D1 (never backlog migrations)
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/main345-restore-bookmark
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file migrations/0119_v72_order_dispatch_lineage.sql
      - name: Verify 3 new empty tables, 3 indexes, and unchanged business fingerprint
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --json --command="SELECT (SELECT count(*) FROM sqlite_master WHERE type='table' AND name IN ('order_dispatches','order_dispatch_items','order_dispatch_corrections')) AS n, (SELECT count(*) FROM sqlite_master WHERE type='index' AND name IN ('idx_order_dispatches_order','idx_order_dispatch_items_item','idx_order_dispatch_items_reservation','idx_order_dispatch_corrections_item')) AS idx, (SELECT count(*) FROM order_dispatches) AS d, (SELECT count(*) FROM order_dispatch_items) AS di, (SELECT count(*) FROM order_dispatch_corrections) AS dc" > /tmp/main345-schema-after.json
          jq -e '.[0].results[0] | .n==3 and .idx==4 and .d==0 and .di==0 and .dc==0' /tmp/main345-schema-after.json
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --json --command="$(cat /tmp/main345-fingerprint.sql)" | jq -cS '.[0].results[0]' > /tmp/main345-business-after.json
          diff -u /tmp/main345-business-before.json /tmp/main345-business-after.json
          echo 'MAIN345_PRODUCTION_SCHEMA_0119_MIGRATED_AND_BUSINESS_UNCHANGED'
