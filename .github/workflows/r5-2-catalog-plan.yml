name: R5.2 catalog plan forensic

on:
  push:
    branches: [safe/r5-2-warehouse-summary-20260902]
    paths:
      - scripts/.r5-2-catalog-plan-trigger

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect Production catalog-attention plan — read only
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          function run(label, sql) {
            const out = execFileSync('npx', ['wrangler','d1','execute','orders_db_prod','--remote','--command',sql,'--json'], {encoding:'utf8', maxBuffer:20*1024*1024})
            const p = JSON.parse(out); const r = Array.isArray(p) ? p[0] : p
            if (!r?.success) throw new Error(`${label} failed`)
            console.log(`R5_2_CATALOG ${label} rows_read=${r.meta?.rows_read ?? 'na'} results=${JSON.stringify(r.results || [])}`)
            return r.results || []
          }
          run('order_items_indexes', `PRAGMA index_list('order_items')`)
          run('orders_indexes', `PRAGMA index_list('orders')`)
          run('sizes', `SELECT (SELECT COUNT(*) FROM order_items) AS order_items_total,
            (SELECT COUNT(*) FROM order_items WHERE quantity > 0 AND (product_id IS NULL OR variant_id IS NULL)) AS unresolved_total,
            (SELECT COUNT(*) FROM order_items WHERE quantity > 0 AND (product_id IS NULL OR variant_id IS NULL) AND datetime(COALESCE(NULLIF(created_at,''),'1970-01-01')) >= datetime('now','-30 days')) AS unresolved_item_recent,
            (SELECT COUNT(*) FROM order_items WHERE quantity > 0 AND (product_id IS NULL OR variant_id IS NULL) AND COALESCE(is_workshop,0)=0) AS unresolved_nonworkshop,
            (SELECT COUNT(*) FROM order_items WHERE quantity > 0 AND product_id IS NULL AND COALESCE(is_workshop,0)=1) AS unresolved_workshop`)
          const where = `oi.quantity > 0
            AND (oi.product_id IS NULL OR oi.variant_id IS NULL)
            AND COALESCE(oi.stock_writeoff_status, '') NOT IN ('catalog_excluded', 'catalog_excluded_history', 'workshop_no_catalog')
            AND COALESCE(o.order_status, 'active') NOT IN ('deleted', 'archived')
            AND COALESCE(o.archived_at, '') = ''
            AND COALESCE((SELECT SUM(ri.quantity) FROM return_items ri JOIN returns r ON r.id=ri.return_id WHERE ri.order_item_id=oi.id AND COALESCE(r.status,'completed') <> 'cancelled'),0) < oi.quantity
            AND datetime(COALESCE(NULLIF(oi.created_at, ''), NULLIF(o.created_at, ''), o.order_date || 'T00:00:00Z')) >= datetime('now','-30 days')
            AND ((COALESCE(oi.is_workshop,0)=1 AND oi.product_id IS NULL AND EXISTS (SELECT 1 FROM workshop_tasks wt WHERE wt.order_item_id=oi.id AND wt.quantity>0 AND wt.status IN ('active','ready')))
              OR (COALESCE(oi.is_workshop,0)=0 AND COALESCE(o.shipping_status,'not_sent') <> 'sent'))
            AND NOT EXISTS (SELECT 1 FROM inventory_lifecycle_events e WHERE e.status='pending' AND e.order_item_id=oi.id)`
          const group = `UPPER(TRIM(COALESCE(oi.product_name_snapshot, ''))),
            CASE WHEN UPPER(TRIM(COALESCE(oi.audience_type, ''))) LIKE '%ДЕТ%' OR LOWER(TRIM(COALESCE(oi.audience_type, '')))='child' THEN 'child' ELSE 'adult' END,
            UPPER(TRIM(COALESCE(oi.gender_snapshot, ''))), UPPER(TRIM(COALESCE(oi.color_snapshot, ''))),
            CASE WHEN TRIM(COALESCE(oi.material_snapshot, ''))='' THEN 'СТАНДАРТ' ELSE UPPER(TRIM(oi.material_snapshot)) END,
            CASE WHEN TRIM(COALESCE(oi.length_snapshot, ''))='' THEN 'СТАНДАРТ' ELSE UPPER(TRIM(oi.length_snapshot)) END,
            UPPER(TRIM(COALESCE(oi.size_snapshot, '')))`
          run('current_plan', `EXPLAIN QUERY PLAN SELECT COUNT(*) FROM (SELECT 1 FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE ${where} GROUP BY ${group})`)
          run('current_count', `SELECT COUNT(*) AS catalog_count FROM (SELECT 1 FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE ${where} GROUP BY ${group})`)
          run('eligible_ids', `SELECT COUNT(*) AS eligible_rows FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE ${where}`)
          run('blank_created_recent_candidates', `SELECT COUNT(*) AS blank_created FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE oi.quantity>0 AND (oi.product_id IS NULL OR oi.variant_id IS NULL) AND TRIM(COALESCE(oi.created_at,''))='' AND datetime(COALESCE(NULLIF(o.created_at,''),o.order_date||'T00:00:00Z')) >= datetime('now','-30 days')`)
          NODE
