name: Apply catalog resolution R2 patch

on:
  push:
    branches:
      - fix/catalog-resolution-r2-20260914
    paths:
      - scripts/patch-catalog-resolution-r2.py
      - scripts/contextual-catalog-resolution-r2-worker-manifest.json
      - .github/workflows/apply-catalog-resolution-r2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-resolution-r2-20260914
      - name: Apply guarded R2 patch
        run: python3 scripts/patch-catalog-resolution-r2.py
      - name: Commit exact accepted deltas
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/domains/catalog.ts scripts/test-step1906a-worker-modularization.mjs scripts/step1906a-worker-declaration-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "test: accept exact catalog resolution R2 worker delta"
          git push origin HEAD:fix/catalog-resolution-r2-20260914
# corrected-preservation-trigger
