name: "One-shot Branch2 returned order 1563 exact atomic reservation closure 20261031"
on:
  push:
    branches: [ops/branch2-return-1563-exact-reconciliation-20261031]
    paths: [.github/workflows/zz-branch2-1563-oneoff-apply-20261031.yml]
permissions:
  contents: read
concurrency:
  group: branch2-oneoff-return-1563-20261031
  cancel-in-progress: false
jobs:
  close-exact-return:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check exact historical return and reservation identity without writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ops/repair-1563-branch2-20261031.mjs --check
      - name: Single atomic Branch2-only returned-order reconciliation with CAS and postflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REPAIR_1563_EXPLICIT_APPROVAL: branch2-1563-return-closure-20261031
        run: node scripts/ops/repair-1563-branch2-20261031.mjs --apply
