name: Inspect cross-DB Sep20 recovery

on:
  push:
    branches: [branch2]
    paths: [.github/workflows/inspect-branch2-test-residue.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      PROD_DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      B2_DB_ID: 40065052-854e-44b8-bcd5-251bdd488301
    steps:
      - name: Compare Sep20 orders in Production and Branch2
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local db="$1"; shift
            local sql="$1"
            curl --fail-with-body -sS -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$db/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" | jq -c '.result[]?.results // []'
          }
          echo '=== PROD SEP20 ORDERS ==='
          q "$PROD_DB_ID" "SELECT o.*,m.name AS manager_name FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE o.order_date='2026-09-20' OR datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') ORDER BY o.id"
          echo '=== B2 SEP20 ORDERS ==='
          q "$B2_DB_ID" "SELECT o.*,m.name AS manager_name FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE o.order_date='2026-09-20' OR datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') ORDER BY o.id"
          echo '=== B2 NONTEST WINDOW ORDERS ==='
          q "$B2_DB_ID" "SELECT o.*,m.name AS manager_name FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') AND datetime(o.created_at)<=datetime('2026-09-20T06:40:00Z') AND o.external_id NOT LIKE 'TEST-%' AND o.external_id NOT LIKE 'RES-%' AND o.external_id NOT LIKE 'AUTO-RES-%' ORDER BY o.id"
          echo '=== PROD NONTEST WINDOW ORDERS ==='
          q "$PROD_DB_ID" "SELECT o.*,m.name AS manager_name FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') AND datetime(o.created_at)<=datetime('2026-09-20T06:40:00Z') AND o.external_id NOT LIKE 'TEST-%' AND o.external_id NOT LIKE 'RES-%' AND o.external_id NOT LIKE 'AUTO-RES-%' ORDER BY o.id"
          echo '=== B2 NONTEST WINDOW ITEMS ==='
          q "$B2_DB_ID" "SELECT o.external_id,oi.* FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') AND datetime(o.created_at)<=datetime('2026-09-20T06:40:00Z') AND o.external_id NOT LIKE 'TEST-%' AND o.external_id NOT LIKE 'RES-%' AND o.external_id NOT LIKE 'AUTO-RES-%' ORDER BY o.id,oi.id"
          echo '=== B2 NONTEST WINDOW PAYMENTS ==='
          q "$B2_DB_ID" "SELECT o.external_id,p.* FROM payments p JOIN orders o ON o.id=p.order_id WHERE datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') AND datetime(o.created_at)<=datetime('2026-09-20T06:40:00Z') AND o.external_id NOT LIKE 'TEST-%' AND o.external_id NOT LIKE 'RES-%' AND o.external_id NOT LIKE 'AUTO-RES-%' ORDER BY o.id,p.id"
          echo '=== B2 NONTEST WINDOW WORKSHOP ==='
          q "$B2_DB_ID" "SELECT o.external_id,w.* FROM workshop_tasks w JOIN orders o ON o.id=w.order_id WHERE datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') AND datetime(o.created_at)<=datetime('2026-09-20T06:40:00Z') AND o.external_id NOT LIKE 'TEST-%' AND o.external_id NOT LIKE 'RES-%' AND o.external_id NOT LIKE 'AUTO-RES-%' ORDER BY o.id,w.id"
          echo '=== B2 NONTEST WINDOW RESERVATIONS ==='
          q "$B2_DB_ID" "SELECT o.external_id,r.* FROM inventory_reservations r JOIN orders o ON o.id=r.order_id WHERE datetime(o.created_at)>=datetime('2026-09-19T21:20:00Z') AND datetime(o.created_at)<=datetime('2026-09-20T06:40:00Z') AND o.external_id NOT LIKE 'TEST-%' AND o.external_id NOT LIKE 'RES-%' AND o.external_id NOT LIKE 'AUTO-RES-%' ORDER BY o.id,r.id"
