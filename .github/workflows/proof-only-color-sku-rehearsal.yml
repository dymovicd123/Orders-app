name: Stage: proof-only production-color SKU rehearsal
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'scripts/ops/rehearse-production-catalog-color-20261016.mjs'
      - '.github/workflows/proof-only-color-sku-rehearsal.yml'
permissions:
  contents: read
jobs:
  proof-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Code syntax and credentials fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ops/rehearse-production-catalog-color-20261016.mjs
          [[ "$GITHUB_BASE_REF" == 'branch2' ]]
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
      - name: Setup production identity for SELECT-only snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/production-readonly-wrangler.jsonc" <<'CFG'
          {
            "name": "orders-app-audit-readonly",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/production-readonly-wrangler.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Read ONLY prod characteristics/stock into runner SQLite and ROLLBACK rehearsal
        run: node scripts/ops/rehearse-production-catalog-color-20261016.mjs
