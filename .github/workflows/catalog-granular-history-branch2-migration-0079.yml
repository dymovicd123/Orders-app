name: Catalog granular history Branch2 migration 0079

on:
  push:
    branches:
      - branch2
    paths:
      - '.github/workflows/catalog-granular-history-branch2-migration-0079.yml'
      - 'migrations/0079_v72_catalog_granular_retirement_history.sql'

permissions:
  contents: read

jobs:
  apply:
    name: Apply 0079 to Branch2 D1 only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Branch2 identity and additive scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "branch2" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then exit 20; fi
          migration='migrations/0079_v72_catalog_granular_retirement_history.sql'
          grep -Fq 'catalog_retirement_history_events' "$migration"
          if grep -Eiq '\b(UPDATE|DELETE[[:space:]]+FROM|INSERT[[:space:]]+INTO[[:space:]]+(catalog_variants|inventory_stock|order_items|inventory_reservations))\b' "$migration"; then
            echo "0079 contains business-row mutation" >&2
            exit 21
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply additive history schema
        run: npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --file migrations/0079_v72_catalog_granular_retirement_history.sql
      - name: Verify table and indexes
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_retirement_history_events') AS table_count,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_catalog_retirement_history_events_created') AS created_index_count,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_catalog_retirement_history_events_product') AS product_index_count;" --json)"
          echo "$result"
          [[ "$(jq -r '.[0].results[0].table_count' <<<"$result")" == "1" ]]
          [[ "$(jq -r '.[0].results[0].created_index_count' <<<"$result")" == "1" ]]
          [[ "$(jq -r '.[0].results[0].product_index_count' <<<"$result")" == "1" ]]
