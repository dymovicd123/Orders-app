name: Resolver user session read-only audit

on:
  push:
    branches:
      - audit/resolver-user-session-20260916
    paths:
      - .github/workflows/resolver-user-session-readonly-20260916.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify Branch2-only binding
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "orders-app-branch2"' wrangler.jsonc
          grep -q '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -q '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -q 'orders_db_prod' wrangler.jsonc
      - name: Read current resolver test state only
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT id,external_id,shipping_status,shipping_date,order_status,total_amount,received_amount,debt_amount,comment
          FROM orders WHERE id IN (6,7,8,9,10) ORDER BY id;
          SELECT id,order_id,product_id,variant_id,product_name_snapshot,audience_type,gender_snapshot,color_snapshot,material_snapshot,length_snapshot,size_snapshot,is_workshop,source_type,stock_writeoff_status,quantity
          FROM order_items WHERE order_id IN (6,7,8,9,10) ORDER BY order_id,id;
          SELECT v.id AS variant_id,v.product_id,p.name AS product_name,v.stock_position_id,v.category,v.gender,v.color,v.material,v.length,v.size_label,v.is_active
          FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
          WHERE v.id IN (SELECT DISTINCT variant_id FROM order_items WHERE order_id IN (6,7,8,9,10) AND variant_id IS NOT NULL)
          ORDER BY v.id;
          SELECT kind,value,is_active FROM reference_values WHERE UPPER(value) LIKE '%TEST%' OR UPPER(value) LIKE '%КОСТЮМ%' ORDER BY kind,value;
          SELECT input_key,variant_id,created_at,updated_at FROM catalog_input_aliases WHERE UPPER(input_key) LIKE '%TEST RESOLVER%' OR UPPER(input_key) LIKE '%TESTМАТЕРИАЛ%' ORDER BY updated_at DESC LIMIT 50;
          SELECT id,order_id,order_item_id,inventory_source,product_id,variant_id,quantity,status,unresolved_reason,created_at,updated_at,released_at
          FROM inventory_reservations WHERE order_id IN (6,7,8,9,10) ORDER BY order_id,order_item_id,id;
          SQL
          )
          npx wrangler d1 execute orders_db_branch2 --remote --json --command="$SQL" | tee /tmp/resolver-user-session.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/resolver-user-session.json','utf8'));
          if(!Array.isArray(x)||x.some(r=>!r.success||Number(r?.meta?.rows_written||0)!==0)) throw new Error('Audit was not read-only or failed');
          console.log('READ_ONLY_RESOLVER_SESSION_AUDIT_OK');
          NODE
