name: Client3 Stage5 bulk inventory and Main palette isolated acceptance
on:
  push:
    branches: [client3/stage5-bulk-ops-palette-20261103]
    paths: ['.github/workflows/client3-stage5-bulk-acceptance-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Strict third-system isolation and Main W12 semantic palette
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/stage5-bulk-ops-palette-20261103
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import assert from 'node:assert/strict'
          const ui=readFileSync('src/features/client3/WatchWarehouseMain.tsx','utf8')
          const palette=readFileSync('src/styles/client3-watch-main-warehouse.css','utf8')
          const bulk=readFileSync('src/features/client3/WatchBulkOperations.tsx','utf8')
          const bulkStyle=readFileSync('src/styles/client3-watch-bulk.css','utf8')
          assert(ui.includes('data-unified-operation={mode==='))
          assert(ui.includes('<WatchBulkOperations brand={brand}'))
          for(const [mode,color] of Object.entries({
             arrival:'#15803d',writeoff:'#b91c1c',transfer:'#a16207',manual_set:'#1d4ed8'
          })){
             assert(palette.includes('data-unified-operation="'+mode+'"'))
             assert(palette.includes('--w12-accent:'+color))
          }
          for(const mode of ['arrival','writeoff','transfer'])
            assert(bulk.includes("kind:mode")&&bulkStyle.includes('data-operation="'+mode+'"')||
              (mode==='arrival'&&bulk.includes("kind:mode")))
          assert(!/\/api\/inventory\/(problems|issues)/.test(bulk))
          console.log('CLIENT3_STAGE5_MAIN_COLOR_PALETTE_PASS')
          NODE
      - run: npm ci
      - name: Full Main inventory, stocktake, resolver and order regressions
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node scripts/client3/test-watch-main-free-text-ux-20261103.mjs
          npm run build
      - name: Report exact stage 5 acceptance result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 Stage5 bulk operations and original Main W12 palette: $JOB_RESULT. Source $GITHUB_SHA. Run https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. No remote D1 writes or deploy. Problems queue remains excluded."
