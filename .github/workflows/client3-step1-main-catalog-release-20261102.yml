name: Client3 Step1 Main catalog + editable references RELEASE (third only)
# Deploy V5 extension tables after proven Main-stock, money, historical FK and deletion checks.
on:
  push:
    branches: [client3/step1-main-catalog-references-20261102]
    paths: ['.github/workflows/client3-step1-main-catalog-release-20261102.yml']
permissions: {contents: read}
jobs:
  third-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Hard block Main/Branch2 workers and D1
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/step1-main-catalog-references-20261102
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci
      - name: Test historical order FK migration, Main catalog deletion and business engine
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-main-step1-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-shared-references-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-catalog-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node scripts/client3/test-main-workflow-parity-20261102.mjs
          npm run build
      - name: Time Travel bookmark (saved in runner, not printed)
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info orders_db_client3_old_client --config wrangler.jsonc > /tmp/client3-step1-bookmark
          grep -Eiq bookmark /tmp/client3-step1-bookmark
      - name: Read-only proof of preserved third tenant data and only V5 pending
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items) AS items_count,
              (SELECT COUNT(*) FROM payments) AS payments_count,
              (SELECT COUNT(*) FROM app_users) AS users_count,
              (SELECT COUNT(*) FROM app_users WHERE login='owner-monitor' AND role='admin' AND is_active=1) AS monitoring_admin,
              (SELECT COUNT(*) FROM watch_products) AS products_count,
              (SELECT COUNT(*) FROM watch_variants) AS variants_count,
              (SELECT COUNT(*) FROM watch_order_item_details) AS watch_order_items_count,
              (SELECT COUNT(*) FROM inventory_stock) AS stock_count,
              (SELECT COUNT(*) FROM inventory_reservations) AS reserves_count,
              (SELECT COUNT(*) FROM watch_reference_values) AS references_count" \
            | jq -ce '.[0].results[0] | select(.orders_count>=2 and .payments_count>=2 and .users_count>=5 and .monitoring_admin==1 and .references_count>=7)' > /tmp/client3-step1-before
          npx wrangler d1 migrations list orders_db_client3_old_client --remote --config wrangler.jsonc > /tmp/client3-step1-pending
          ! grep -Eq '000[1234]_client3_' /tmp/client3-step1-pending
          if grep -Fq '0005_client3_editable_sku_references.sql' /tmp/client3-step1-pending; then
            test "$(grep -Ec '000[0-9]+.*\.sql' /tmp/client3-step1-pending)" = 1
            touch /tmp/client3-step1-migration-needed
          else
            test "$(grep -Ec '000[0-9]+.*\.sql' /tmp/client3-step1-pending || true)" = 0
            npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
              --command="SELECT COUNT(*) AS schema_ready FROM sqlite_master WHERE type='table' AND name IN ('watch_reference_values_v5','watch_variant_attributes_v5')" \
              | jq -e '.[0].results[0].schema_ready==2'
            echo 'V5 already applied; skip schema changes.'
          fi
      - name: Apply ONLY additive V5 reference/SKU migration to third D1
        run: |
          set -euo pipefail
          if test -f /tmp/client3-step1-migration-needed; then
            npx wrangler d1 migrations apply orders_db_client3_old_client --remote --config wrangler.jsonc
          else
            echo 'No pending migration; read-only re-verification.'
          fi
      - name: Verify every historical count, FK integrity and reference seeds
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items) AS items_count,
              (SELECT COUNT(*) FROM payments) AS payments_count,
              (SELECT COUNT(*) FROM app_users) AS users_count,
              (SELECT COUNT(*) FROM app_users WHERE login='owner-monitor' AND role='admin' AND is_active=1) AS monitoring_admin,
              (SELECT COUNT(*) FROM watch_products) AS products_count,
              (SELECT COUNT(*) FROM watch_variants) AS variants_count,
              (SELECT COUNT(*) FROM watch_order_item_details) AS watch_order_items_count,
              (SELECT COUNT(*) FROM inventory_stock) AS stock_count,
              (SELECT COUNT(*) FROM inventory_reservations) AS reserves_count,
              (SELECT COUNT(*) FROM watch_reference_values_v5 WHERE kind='movements') AS movement_references,
              (SELECT COUNT(*) FROM watch_reference_values_v5 WHERE kind='bracelets') AS bracelet_references,
              (SELECT COUNT(*) FROM watch_reference_values_v5 WHERE kind='dials') AS dial_references" \
            | jq -ce '.[0].results[0]' > /tmp/client3-step1-after
          jq -e --slurpfile b /tmp/client3-step1-before '
            .orders_count==$b[0].orders_count and .items_count==$b[0].items_count and
            .payments_count==$b[0].payments_count and .users_count==$b[0].users_count and
            .monitoring_admin==1 and .products_count==$b[0].products_count and
            .variants_count==$b[0].variants_count and .watch_order_items_count==$b[0].watch_order_items_count and
            .stock_count==$b[0].stock_count and .reserves_count==$b[0].reserves_count and
            .movement_references>=2 and .bracelet_references>=3 and .dial_references>=8
          ' /tmp/client3-step1-after
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
      - name: Deploy only third Worker
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Smoke public UI and reject unauthenticated catalogue writes
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          test "$(curl -sSL -o /tmp/client3-step1-html -w '%{http_code}' --max-time 25 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-step1-html
          code=$(curl -sS -o /tmp/client3-step1-protected -w '%{http_code}' --max-time 25 \
            "$base/api/client3/watches/references")
          test "$code" = 401 -o "$code" = 403
          echo CLIENT3_STEP1_MAIN_CATALOG_REFERENCES_RELEASED_THIRD_ONLY
