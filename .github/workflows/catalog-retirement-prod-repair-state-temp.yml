name: Temporary Production Catalog repair state check

on:
  push:
    branches:
      - release/catalog-retirement-main-20260930
    paths:
      - '.github/workflows/catalog-retirement-prod-repair-state-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Read-only state after interrupted repair
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard-lock Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "release/catalog-retirement-main-20260930" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
          ! grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: SELECT-only exact state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT id,inventory_source,product_id,variant_id,gender_snapshot,color_snapshot,quantity,reserved_quantity,last_action,last_source_ref
          FROM inventory_stock WHERE id IN (151,730) ORDER BY id;

          SELECT COUNT(*) AS mismatch_count, GROUP_CONCAT(id, ',') AS mismatch_ids FROM (
            SELECT v.id FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
            WHERE v.is_active=1 AND p.is_active=1
              AND ((p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,'')))='МУЖ')
                OR (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,'')))='ЖЕН'))
            ORDER BY v.id
          );

          SELECT COUNT(*) AS inactive_live_count, GROUP_CONCAT(id, ',') AS inactive_live_ids FROM (
            SELECT v.id FROM catalog_variants v
            WHERE v.is_active=0 AND (
              EXISTS (SELECT 1 FROM inventory_stock s WHERE s.variant_id=v.id AND (COALESCE(s.quantity,0)<>0 OR COALESCE(s.reserved_quantity,0)<>0))
              OR EXISTS (SELECT 1 FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active' AND COALESCE(r.quantity,0)<>0)
            ) ORDER BY v.id
          );

          SELECT
            (SELECT is_active FROM catalog_products WHERE id=41) AS product41_active,
            (SELECT is_active FROM catalog_stock_positions WHERE id=94) AS execution94_active,
            (SELECT is_active FROM catalog_variants WHERE id=207) AS v207_active,
            (SELECT is_active FROM catalog_variants WHERE id=356) AS v356_active,
            (SELECT is_active FROM catalog_variants WHERE id=1065) AS v1065_active,
            (SELECT is_active FROM catalog_variants WHERE id=1066) AS v1066_active;

          SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COUNT(*) FROM inventory_reservations) AS reservations_count,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_total,
            (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS stock_reserved_total,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_reservations WHERE status='active') AS active_reserved_total;
          " --json
