name: Branch2 W6 Unified Inventory Release
on:
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/w6-branch2-selective-deploy.yml'
permissions:
  contents: read
  statuses: write
jobs:
  safe-w6-branch2-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Allow only reviewed W6 changes and require isolated Branch2 D1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "branch2"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          baseline="6e3b6a1e3e38eed4780913e521a4dc92bfbc2470"
          git cat-file -e "$baseline^{commit}"
          diff="$(git diff --name-only "$baseline" "$GITHUB_SHA")"
          test -n "$diff"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              src/App.tsx|\
              src/app/controllers/useOperationalViewModel.ts|\
              src/features/inventory/views/renderInventoryMovementPanel.tsx|\
              src/features/inventory/views/InventoryUnifiedQuantityWorkspace.tsx|\
              src/features/inventory/unifiedOperationMath.ts|\
              src/styles/193-unified-inventory-operations.css|\
              scripts/test-w6-unified-operations.mjs|\
              scripts/verify-w6-branch2-live.mjs|\
              .github/workflows/w6-unified-warehouse-operations.yml|\
              .github/workflows/w6-branch2-selective-deploy.yml) ;;
              *) echo "Unexpected change: $file. Stop warehouse deployment." >&2; exit 11 ;;
            esac
          done <<< "$diff"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "PRODUCTION DATABASE detected; refuse deploy" >&2
            exit 12
          fi
          git diff --name-only "$baseline" "$GITHUB_SHA" | grep -Fq "InventoryUnifiedQuantityWorkspace.tsx"
          git diff --name-only "$baseline" "$GITHUB_SHA" | grep -Fq "unifiedOperationMath.ts"
      - run: npm ci
      - name: W6 quantity, no-op, SKU and source safety
        run: node --experimental-strip-types scripts/test-w6-unified-operations.mjs
      - name: Existing reliable stock movements and stocktake
        run: |
          node scripts/test-arrival-save-reliability.mjs
          node scripts/test-arrival-variant-integrity-r2.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
      - name: Compile complete Worker and UI
        run: npm run build
      - name: Deploy Branch2 Worker, no migration
        run: npx wrangler deploy
      - name: Confirm public W6 interface
        run: node scripts/verify-w6-branch2-live.mjs
      - name: Mark selective Branch2 release success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg u "$target" '{state:"success",context:"w6-branch2-deploy",description:"W6 reviewed, built and public UI verified",target_url:$u}')" >/dev/null
