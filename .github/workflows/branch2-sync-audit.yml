name: Branch2 sync audit

on:
  push:
    branches: [safe/branch2-sync-audit-20260902]
    paths:
      - .github/workflows/branch2-sync-audit.yml
      - scripts/.branch2-sync-audit-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository migration inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "repo_migration_count=$(find migrations -maxdepth 1 -type f -name '*.sql' | wc -l)"
          find migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 15
      - name: Resolve live Branch2 D1 — READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json | tee /tmp/d1-list.json
          echo '=== matching Branch2 databases ==='
          jq '[.[] | select(.name == "orders_db_branch2")] | map({uuid,name,created_at,version})' /tmp/d1-list.json
          count="$(jq '[.[] | select(.name == "orders_db_branch2")] | length' /tmp/d1-list.json)"
          test "$count" -eq 1
      - name: Branch2 D1 migration history — READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          echo '=== d1_migrations ==='
          npx wrangler d1 execute orders_db_branch2 --remote --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id" --json | tee /tmp/branch2-migrations.json
          echo '=== tables ==='
          npx wrangler d1 execute orders_db_branch2 --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" --json | tee /tmp/branch2-tables.json
          echo '=== Branch2 safety setting ==='
          npx wrangler d1 execute orders_db_branch2 --remote --command "SELECT key, value FROM app_settings WHERE key='require_stored_admin_password'" --json || true
