name: Main Ethno manual-history finalization empty schema 0109
on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/0109_v72_catalog_manual_movement_finalization.sql'
      - '.github/workflows/main-ethno-manual-finalization-schema-0109.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-ethno-manual-finalization-schema-0109.yml'
permissions:
  contents: read
concurrency:
  group: main-ethno-0109-empty-schema
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prove production identity and additive SQL only
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == "pull_request" || "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${GITHUB_BASE_REF:-main}" == 'main' ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          [[ "$(git hash-object migrations/0109_v72_catalog_manual_movement_finalization.sql)" == '06314e11b70918ae5a133b076f397fbbb27d0511' ]]
          ! grep -Eiq '^[[:space:]]*(UPDATE|DELETE|REPLACE|DROP|TRUNCATE|ALTER)[[:space:]]' migrations/0109_v72_catalog_manual_movement_finalization.sql
      - run: npm ci
      - name: Verify migration trigger and journal with local SQLite only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs');const {DatabaseSync}=require('node:sqlite')
          const d=new DatabaseSync(':memory:')
          d.exec('PRAGMA foreign_keys=ON;CREATE TABLE catalog_variants(id INTEGER PRIMARY KEY);CREATE TABLE inventory_movements(id INTEGER PRIMARY KEY);CREATE TABLE inventory_stock_checks(id INTEGER PRIMARY KEY);CREATE TABLE inventory_movement_reversals(original_movement_id INTEGER,reversal_movement_id INTEGER);')
          d.exec(fs.readFileSync('migrations/0109_v72_catalog_manual_movement_finalization.sql','utf8'))
          if(d.prepare("SELECT COUNT(*) n FROM sqlite_master WHERE name IN ('catalog_manual_movement_finalizations','catalog_manual_finalization_validations','catalog_manual_finalization_reversal_guard')").get().n!==3)throw Error('Wrong schema')
          d.close()
          JS
      - name: Capture read-only production fingerprint and exact schema state
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
          (SELECT COUNT(*) FROM order_items) AS items_count,
          (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
          (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_total,
          (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_total,
          (SELECT COUNT(*) FROM inventory_movements) AS movement_rows,
          (SELECT COUNT(*) FROM inventory_stock_checks) AS stock_check_rows,
          (SELECT COUNT(*) FROM inventory_reservations) AS reservations,
          (SELECT COUNT(*) FROM payments) AS payment_rows,
          (SELECT COALESCE(SUM(amount),0) FROM payments) AS payments_total,
          (SELECT COUNT(*) FROM financial_events) AS finance_rows,
          (SELECT COUNT(*) FROM catalog_variant_consolidations) AS sku_merges
          " --json | jq -cSe '.[0].results[0]' > /tmp/main0109-before.json
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT COUNT(*) AS n FROM sqlite_master WHERE name IN (
          'catalog_manual_movement_finalizations','catalog_manual_finalization_validations','catalog_manual_finalization_reversal_guard')
          " --json | jq -r '.[0].results[0].n' > /tmp/main0109-schema-state
          [[ "$(cat /tmp/main0109-schema-state)" == 0 || "$(cat /tmp/main0109-schema-state)" == 3 ]]
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT id,variant_id,inventory_source,quantity,reserved_quantity FROM inventory_stock WHERE variant_id IN (1280,1532) ORDER BY id;
          SELECT id,variant_id,quantity_delta,quantity_after,reference_type FROM inventory_movements WHERE id IN (4876,5400) ORDER BY id;
          SELECT id,source_variant_id,target_variant_id FROM catalog_variant_consolidations WHERE source_variant_id=1532;
          " --json | jq -cS '[.[] | .results]' > /tmp/main0109-pair-before.json
      - name: Apply inert schema only on exact production main database
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(cat /tmp/main0109-schema-state)" == 0 ]]; then
            npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file migrations/0109_v72_catalog_manual_movement_finalization.sql
          else
            echo 'Schema already present, no DDL writes'
          fi
      - name: Independently prove zero business mutations
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
          (SELECT COUNT(*) FROM order_items) AS items_count,
          (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
          (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_total,
          (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_total,
          (SELECT COUNT(*) FROM inventory_movements) AS movement_rows,
          (SELECT COUNT(*) FROM inventory_stock_checks) AS stock_check_rows,
          (SELECT COUNT(*) FROM inventory_reservations) AS reservations,
          (SELECT COUNT(*) FROM payments) AS payment_rows,
          (SELECT COALESCE(SUM(amount),0) FROM payments) AS payments_total,
          (SELECT COUNT(*) FROM financial_events) AS finance_rows,
          (SELECT COUNT(*) FROM catalog_variant_consolidations) AS sku_merges
          " --json | jq -cSe '.[0].results[0]' > /tmp/main0109-after.json
          cmp /tmp/main0109-before.json /tmp/main0109-after.json
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT id,variant_id,inventory_source,quantity,reserved_quantity FROM inventory_stock WHERE variant_id IN (1280,1532) ORDER BY id;
          SELECT id,variant_id,quantity_delta,quantity_after,reference_type FROM inventory_movements WHERE id IN (4876,5400) ORDER BY id;
          SELECT id,source_variant_id,target_variant_id FROM catalog_variant_consolidations WHERE source_variant_id=1532;
          " --json | jq -cS '[.[] | .results]' > /tmp/main0109-pair-after.json
          cmp /tmp/main0109-pair-before.json /tmp/main0109-pair-after.json
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT (SELECT COUNT(*) FROM sqlite_master WHERE name IN (
          'catalog_manual_movement_finalizations','catalog_manual_finalization_validations','catalog_manual_finalization_reversal_guard')) AS schema_count,
          (SELECT COUNT(*) FROM catalog_manual_movement_finalizations) AS closed_rows,
          (SELECT COUNT(*) FROM catalog_manual_finalization_validations) AS validations
          " --json | jq -e '.[0].results[0] | .schema_count==3 and .closed_rows==0 and .validations==0'
          echo 'MAIN 0109 EMPTY SCHEMA VERIFIED: unchanged stock, order, payment and movement data'
