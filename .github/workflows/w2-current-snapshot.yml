name: W2 current snapshot

on:
  push:
    branches:
      - safe/w2-human-warehouse-20260905

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload W2 transfer state
        uses: actions/upload-artifact@v4
        with:
          name: w2-current-state
          path: |
            .w2tmp
            src/App.tsx
            src/app/controllers/useWorkspaceViewModel.tsx
            src/styles/00-foundation.css
            src/styles/160-inventory-matrix-usability.css
            src/styles/188b-human-inventory-ui.css
            scripts/release-check.mjs
            scripts/test-w1-warehouse-reliability.mjs
            scripts/step1906b-frontend-preservation-manifest.json
            scripts/test-step1906b-frontend-modularization.mjs
          include-hidden-files: true
          retention-days: 1
