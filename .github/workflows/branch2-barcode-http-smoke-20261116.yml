name: Branch2 barcode read-only HTTP smoke 2026-11-16
on:
  push:
    branches: [branch2]
    paths:
      - .github/workflows/branch2-barcode-http-smoke-20261116.yml
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public response classifications without login (NO WRITES)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          root='https://orders-app-branch2.orders-clothes.workers.dev'
          paths=['/','/api/health','/api/auth/status','/api/barcodes/lookup?code=OCS1-000001-0X']
          for path in paths:
            req=urllib.request.Request(root+path,headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) OrdersApp-Branch2-Smoke/1.0',
              'Accept':'application/json,text/html;q=0.9,*/*;q=0.8'})
            try:
              with urllib.request.urlopen(req,timeout=20) as res:
                status=res.status;headers=res.headers;body=res.read(300)
            except urllib.error.HTTPError as err:
              status=err.code;headers=err.headers;body=err.read(300)
            print('SMOKE_PATH='+path.split('?')[0])
            print('SMOKE_HTTP='+str(status))
            for name in ('server','content-type','cf-mitigated','x-frame-options','location'):
              if headers.get(name):print('HEADER_'+name.upper().replace('-','_')+'='+headers.get(name,'')[:150])
            print('BODY_KIND=' + ('json' if body.lstrip().startswith(b'{') else 'html' if b'<html' in body.lower() else 'other'))
            if path=='/api/health' and status!=200:print('HEALTH_NOT_PUBLICLY_ACCESSIBLE')
          print('BRANCH2_HTTP_SMOKE_READONLY_COMPLETE')
          PY
