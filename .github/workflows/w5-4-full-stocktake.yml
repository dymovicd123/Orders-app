name: W5.4 full stocktake UX

on:
  push:
    branches: [safe/w5-4-use-this]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/w5-4-use-this
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/w5-4-manifest-helper.mjs before
      - run: python3 scripts/w5-4-patcher.py
      - run: node scripts/w5-4-manifest-helper.mjs after
      - run: python3 scripts/w5-4-gate-patcher.py
      - run: git diff --check
      - run: node scripts/test-w5-4-full-stocktake.mjs
      - run: npm run release:check
      - run: npm run verify:db-safety
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      - name: Ensure no migration or schema change
        run: |
          if git diff --name-only | grep -E '(^|/)(migrations?|schema)(/|\.|$)'; then
            echo 'Unexpected migration/schema change in W5.4'
            exit 1
          fi
      - name: Commit validated candidate
        run: |
          rm .github/workflows/w5-4-full-stocktake.yml
          rm scripts/w5-4-patcher.py scripts/w5-4-manifest-helper.mjs scripts/w5-4-gate-patcher.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'W5.4: clarify full stocktake flow'
          git push origin HEAD:safe/w5-4-use-this
