name: W7 history race hardening

on:
  push:
    branches:
      - w7-sku-history-price-readiness-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[w7-race-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w7-sku-history-price-readiness-audit
      - run: python scripts/apply-w7-history-race-hardening.py
      - name: Commit hardening
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "W7: harden history request races [w7-race-applied]"
          git push origin HEAD:w7-sku-history-price-readiness-audit
