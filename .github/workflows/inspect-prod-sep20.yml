name: Inspect prod Sep20 orders

on:
  push:
    branches: [ops-inspect-prod-sep20]
    paths: [.github/workflows/inspect-prod-sep20.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      PROD_DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
    steps:
      - name: Inspect production orders for Sep20 Kazakhstan day
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local sql="$1"
            curl --fail-with-body -sS -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$PROD_DB_ID/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" | jq -c '.result[]?.results // []'
          }
          echo '=== PROD ORDER_DATE SEP20 ==='
          q "SELECT o.id,o.external_id,o.order_date,o.manager_id,m.name AS manager_name,o.city,o.delivery_type,o.source_type,o.workshop_status,o.order_status,o.total_amount,o.received_amount,o.debt_amount,o.return_amount,o.shipping_status,o.shipping_date,o.comment,o.created_at,o.updated_at FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE o.order_date='2026-09-20' ORDER BY o.id"
          echo '=== PROD CREATED SEP20 KZ ==='
          q "SELECT o.id,o.external_id,o.order_date,o.manager_id,m.name AS manager_name,o.city,o.delivery_type,o.order_status,o.total_amount,o.shipping_status,o.created_at,o.updated_at FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE datetime(o.created_at)>=datetime('2026-09-19T19:00:00Z') AND datetime(o.created_at)<datetime('2026-09-20T19:00:00Z') ORDER BY o.id"
          echo '=== PROD UPDATED SEP20 KZ ==='
          q "SELECT o.id,o.external_id,o.order_date,o.manager_id,m.name AS manager_name,o.order_status,o.shipping_status,o.created_at,o.updated_at FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE datetime(o.updated_at)>=datetime('2026-09-19T19:00:00Z') AND datetime(o.updated_at)<datetime('2026-09-20T19:00:00Z') ORDER BY o.id"
          echo '=== PROD LATEST 20 ORDERS ==='
          q "SELECT o.id,o.external_id,o.order_date,o.manager_id,m.name AS manager_name,o.order_status,o.shipping_status,o.created_at,o.updated_at FROM orders o LEFT JOIN managers m ON m.id=o.manager_id ORDER BY o.id DESC LIMIT 20"
