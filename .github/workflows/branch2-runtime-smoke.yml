name: Branch2 Runtime Schema Smoke

on:
  push:
    branches: [safe/branch2-runtime-smoke-20260902]
    paths:
      - scripts/.branch2-runtime-smoke-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BASE_URL: https://orders-app-branch2.orders-clothes.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read-only Branch2 API smoke
        shell: bash
        run: |
          set -euo pipefail
          check_json() {
            label="$1"; path="$2"
            code="$(curl -sS -o /tmp/resp.json -w '%{http_code}' "$BASE_URL$path")"
            echo "$label -> HTTP $code"
            cat /tmp/resp.json | jq -c 'if type == "object" then {ok, message, count, total, pageCount, service} else . end'
            test "$code" -ge 200 -a "$code" -lt 300
            jq -e 'if type == "object" and has("ok") then .ok != false else true end' /tmp/resp.json >/dev/null
          }
          check_json health '/api/health'
          check_json orders '/api/orders?limit=20&offset=0'
          check_json attention '/api/inventory/attention'
          check_json stocktakes '/api/inventory/stocktakes?source=warehouse&limit=20'
          check_json references '/api/reference-data'
          check_json clients '/api/clients?limit=20&offset=0'
      - name: Confirm Branch2 D1 is actively serving reads
        run: |
          npx wrangler d1 insights orders_db_branch2 --sort-type=sum --sort-by=reads --sort-direction=DESC --limit=20 --timePeriod=1h --json > /tmp/branch2-insights.json
          jq -e 'type == "array"' /tmp/branch2-insights.json >/dev/null
          echo "insight_queries=$(jq 'length' /tmp/branch2-insights.json)"
          jq -c '.[0:5] | map({totalRowsRead, numberOfTimesRun, query:(.query[0:120])})' /tmp/branch2-insights.json
