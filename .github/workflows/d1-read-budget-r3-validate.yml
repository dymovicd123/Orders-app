name: D1 Read Budget R3 Validate

on:
  push:
    branches: [safe/d1-read-budget-r3-20260902b]
    paths:
      - scripts/.d1-read-budget-r3-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r3-20260902b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply exact R3 candidate
        run: |
          python3 scripts/repair-d1-read-budget-r3-patcher.py
          python3 scripts/apply-d1-read-budget-r3.py
          node scripts/register-d1-read-budget-r3-worker.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Database safety gate
        run: npm run verify:db-safety
      - name: Clean production build
        run: |
          rm -rf dist
          npm run build
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/sections/DashboardSection.tsx src/features/finance/useFinanceReportReads.ts worker/domains/finance-reports.ts worker/domains/warehouse-attention.ts scripts/test-d1-read-budget-r3.mjs scripts/d1-read-budget-r3-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs package.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Optimize D1 read paths R3"
            git push origin HEAD:safe/d1-read-budget-r3-20260902b
          fi
