name: Branch2 unexpected active deployment forensic GET only
on:
  push:
    branches: [audit/branch2-warehouse-barcode-readiness-20261030]
    paths:
      - '.github/workflows/warehouse-current-deployment-drift-get-once-20261030.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Cloudflare live Worker state GET-only (no deploy, no D1)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/barcode-readiness-branch2-build-get-20261030.mjs
          node scripts/ops/barcode-readiness-branch2-build-get-20261030.mjs
