name: R5.8 Finance apply

on:
  push:
    branches:
      - safe/d1-read-budget-r5-8-finance-20260904

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply measured Finance read-budget optimization
        run: |
          set -euo pipefail
          python3 scripts/apply-r5-8-finance.py
          npm run test:d1-read-budget-r5-8
          npm run typecheck
          npm run build
          npm run verify:db-safety
      - name: Commit R5.8 code and remove one-shot helpers
        run: |
          set -euo pipefail
          rm .github/workflows/r5-8-finance-apply.yml
          rm scripts/apply-r5-8-finance.py
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add worker/domains/finance-reports.ts scripts/test-d1-read-budget-r5-8.mjs package.json .github/workflows/r5-8-finance-apply.yml scripts/apply-r5-8-finance.py
          git commit -m "R5.8: reuse Finance payment rows for aggregates"
          git push origin HEAD:safe/d1-read-budget-r5-8-finance-20260904
