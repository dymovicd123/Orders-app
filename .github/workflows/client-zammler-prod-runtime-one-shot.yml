name: CLIENT-ZAMMLER runtime one-shot patch

on:
  push:
    branches:
      - client-zammler-prod-runtime-20260924
    paths:
      - '.github/workflows/client-zammler-prod-runtime-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-zammler-prod-runtime-20260924
          fetch-depth: 0
      - name: Apply exact App wiring patch and refresh structural manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          app_path = Path('src/App.tsx')
          manifest_path = Path('scripts/client-zammler-prod-runtime-frontend-manifest.json')
          workflow_path = Path('.github/workflows/client-zammler-prod-runtime-one-shot.yml')

          text = app_path.read_text(encoding='utf-8')
          before = "    getStockQuantityForVariant,\n    getWorkshopInvoiceImportanceLabel,"
          after = "    getStockQuantityForVariant,\n    getWorkshopInvoiceDeadlineLabel,\n    getWorkshopInvoiceImportanceLabel,"
          if text.count(before) != 1:
              raise SystemExit('Exact Workshop deadline formatter anchor is not unique')
          text = text.replace(before, after)
          app_path.write_text(text, encoding='utf-8')

          raw = app_path.read_bytes()
          git_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['files']['src/App.tsx']['afterGitBlob'] = git_blob
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          workflow_path.unlink()
          print('Updated App blob:', git_blob)
          PY
      - name: Commit exact one-shot patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx scripts/client-zammler-prod-runtime-frontend-manifest.json .github/workflows/client-zammler-prod-runtime-one-shot.yml
          git commit -m "CLIENT-ZAMMLER PROD B2: wire Workshop deadline formatter"
          git push origin HEAD:client-zammler-prod-runtime-20260924
