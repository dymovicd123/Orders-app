name: Cloudflare Branch2 - Verify Existing Token (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-branch2-readonly-verify
  cancel-in-progress: false

jobs:
  check-branch2:
    name: Verify existing GitHub secrets and Branch2 D1 access
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate token and inspect ONLY Branch2 D1 (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '').strip()
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '').strip()
          if not token or not account:
              print('FAILED: missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret.')
              sys.exit(2)
          if len(account) != 32 or not all(c in '0123456789abcdefABCDEF' for c in account):
              print('FAILED: CLOUDFLARE_ACCOUNT_ID does not look like a 32-character account identifier.')
              sys.exit(2)

          # Exact Branch2 D1 ID from the branch2 wrangler.jsonc.
          # No endpoint here points to Main and no API mutator is used.
          db_id = '0904a573-21ff-44d8-93b0-c9200f771702'
          expected_name = 'orders_db_branch2_mirror_20261027'
          root = 'https://api.cloudflare.com/client/v4'

          def cloudflare(path, payload=None):
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}
              data = None
              method = 'GET'
              if payload is not None:
                  # D1 SQL SELECT uses HTTP POST in Cloudflare's API.
                  # The database is not modified by the query.
                  method = 'POST'
                  data = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(root + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as err:
                  try:
                      body = json.loads(err.read().decode('utf-8'))
                  except Exception:
                      body = {}
                  return err.code, body

          print('GitHub repository secrets: present (values not shown).')
          # User-token verification may not support account-scoped tokens.
          # The decisive access check is the actual Branch2 D1 read below.
          status, verification = cloudflare('/user/tokens/verify')
          if status == 200 and verification.get('success'):
              print('Cloudflare token verify:', verification.get('result', {}).get('status', 'unknown'))
          else:
              print('Cloudflare token verify: unavailable (HTTP %s); testing actual D1 access.' % status)

          status, details = cloudflare('/accounts/' + account + '/d1/database/' + db_id)
          if status != 200 or not details.get('success'):
              codes = [str(e.get('code', 'unknown')) for e in details.get('errors', [])]
              print('FAILED: Branch2 D1 database lookup denied (HTTP %s, Cloudflare codes %s).' % (status, ','.join(codes) or 'n/a'))
              print('Check token permissions D1 Read/Write, account selection, and GitHub secret values.')
              sys.exit(3)
          found_name = details.get('result', {}).get('name')
          if found_name != expected_name:
              print('FAILED: D1 database ID does not match expected Branch2 database name.')
              sys.exit(4)
          print('Cloudflare Branch2 D1: found expected database; read access confirmed.')

          tables = [
              'return_v2_prepared_operations', 'return_v2_prepared_items',
              'return_v2_postings', 'return_v2_cancellations',
              'return_v2_unified_postings', 'return_v2_unified_lines',
              'return_v2_unified_cancellations', 'return_v2_metadata_edits',
              'return_v2_resumed_dispatches'
          ]
          columns = [
              ('return_items', 'contract_quantity_applied'),
              ('return_v2_prepared_operations', 'baseline_order_updated_at'),
              ('return_v2_prepared_items', 'baseline_order_item_quantity'),
              ('return_v2_unified_postings', 'intent_fingerprint'),
              ('return_v2_unified_lines', 'receipt_intent'),
              ('return_v2_unified_lines', 'reservation_release'),
              ('return_v2_unified_lines', 'stock_quantity_change'),
              ('return_v2_unified_cancellations', 'refund_recovered_at'),
              ('return_v2_metadata_edits', 'intent_json'),
              ('return_v2_resumed_dispatches', 'expected_order_version')
          ]
          table_literals = ','.join("'" + t + "'" for t in tables)
          expressions = [
              "(SELECT COUNT(*) FROM pragma_table_info('%s') WHERE name='%s')" % (t, c)
              for t, c in columns
          ]
          sql = ("SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' "
                 "AND name IN (%s)) AS table_count, (%s) AS column_count"
                 % (table_literals, ' + '.join(expressions)))
          status, answer = cloudflare('/accounts/' + account + '/d1/database/' + db_id + '/query',
                                      {'sql': sql, 'params': []})
          if status != 200 or not answer.get('success'):
              codes = [str(e.get('code', 'unknown')) for e in answer.get('errors', [])]
              print('FAILED: Branch2 D1 SQL SELECT unavailable (HTTP %s, Cloudflare codes %s).' %
                    (status, ','.join(codes) or 'n/a'))
              sys.exit(5)
          results = answer.get('result') or []
          first = results[0] if isinstance(results, list) and results else {}
          rows = first.get('results', []) if isinstance(first, dict) else []
          if not rows:
              print('FAILED: SQL SELECT did not return expected schema counts.')
              sys.exit(6)
          if first.get('meta', {}).get('changes', 0):
              print('FAILED: unexpected database modifications reported by SELECT.')
              sys.exit(7)
          table_count = int(rows[0]['table_count'])
          column_count = int(rows[0]['column_count'])
          print('Return V2 migrations: %s/9 required tables, %s/10 critical columns.' %
                (table_count, column_count))
          if table_count == 9 and column_count == 10:
              print('RESULT: TOKEN AND BRANCH2 D1 ACCESS OK; V2 schema capability complete.')
          else:
              print('RESULT: TOKEN AND BRANCH2 D1 ACCESS OK; V2 schema incomplete (expected before migration).')
          print('READ ONLY: no migration, write, deployment, flag change, or Main access.')
          PY
