name: "READ ONLY main standard/no-size SKU inventory audit"
on:
  push:
    branches: [feature/main-source-first-order-picker-20261106]
    paths: [.github/workflows/audit-main-size-standard-readonly-20261107.yml]
permissions:
  contents: read
jobs:
  catalog-size-only:
    if: github.ref == 'refs/heads/feature/main-source-first-order-picker-20261106'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - run: npm ci
      - name: Aggregate actual product SKU sizes and sources (SELECT only)
        shell: bash
        run: |
          set -euo pipefail
          SQL="$(cat <<'SQL'
          SELECT CASE WHEN UPPER(TRIM(COALESCE(v.size_label,'')))='СТАНДАРТ' THEN 'СТАНДАРТ'
            WHEN UPPER(TRIM(COALESCE(v.size_label,'')))='0' THEN '0'
            WHEN UPPER(TRIM(COALESCE(v.size_label,''))) IN ('','БЕЗ РАЗМЕРА','БЕЗРАЗМЕРА','Б/Р') THEN 'NO_SIZE'
            ELSE 'OTHER' END AS size_group,
            COUNT(*) AS variants, COUNT(DISTINCT v.product_id) AS models,
            SUM(CASE WHEN s.inventory_source='warehouse' THEN 1 ELSE 0 END) AS stock_warehouse,
            SUM(CASE WHEN s.inventory_source='boutique' THEN 1 ELSE 0 END) AS stock_boutique,
            SUM(CASE WHEN s.quantity>0 THEN s.quantity ELSE 0 END) AS physical_positive
          FROM catalog_variants v LEFT JOIN inventory_stock s ON s.variant_id=v.id
          WHERE v.is_active=1
          GROUP BY size_group ORDER BY size_group;
          SQL
          )"
          npx wrangler d1 execute orders_db_prod --config wrangler.jsonc --remote --command "$SQL" --json | jq -c '.[0].results'
      - name: Read-only standard-size example SKUs (no customer data)
        run: |
          SQL="$(cat <<'SQL'
          SELECT p.name AS model, v.id AS sku, v.size_label AS size,
                 v.gender, v.color, v.material, v.length, s.inventory_source AS source,
                 s.quantity AS physical, s.reserved_quantity AS cached_reserved
          FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
          LEFT JOIN inventory_stock s ON s.variant_id=v.id
          WHERE v.is_active=1 AND UPPER(TRIM(COALESCE(v.size_label,'')))='СТАНДАРТ'
          ORDER BY CASE WHEN s.quantity>0 THEN 0 ELSE 1 END, v.id LIMIT 18;
          SQL
          )"
          npx wrangler d1 execute orders_db_prod --config wrangler.jsonc --remote --command "$SQL" --json | jq -c '.[0].results'
          echo 'READ_ONLY_AUDIT_FINISHED_NO_DATA_WRITES'
