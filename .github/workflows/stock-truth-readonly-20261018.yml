name: One-time read-only production stock truth audit
on:
  push:
    branches: [audit/production-stock-truth-readonly-20261018]
    paths: [.github/workflows/stock-truth-readonly-20261018.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify isolated audit branch and production target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "audit/production-stock-truth-readonly-20261018" ]]
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          node --check scripts/ops/stock-truth-readonly-20261018.mjs
      - run: npm ci
      - name: SELECT-only inventory diagnostics, aggregated and bounded
        run: node scripts/ops/stock-truth-readonly-20261018.mjs
