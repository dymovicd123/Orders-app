name: Client3 Watch variant and Stock guarded hotfix deploy
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-variant-stock-guarded-release-20261103.yml']

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Guard exact accepted source, isolated Client3 Worker and D1
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(git rev-parse HEAD^)" = bd0ca261454ebd6dc4cb280a210272270a72c6ec
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/client3-variant-stock-guarded-release-20261103.yml'
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41620802636 --jq .conclusion)" = success
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41620802636 --jq .head_sha)" = bd0ca261454ebd6dc4cb280a210272270a72c6ec
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci
      - name: Rebuild accepted watch variant and stock hotfix
        run: npm run build
      - name: Live isolated third D1 snapshot and FK verification
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM order_items) items_count,
              (SELECT COUNT(*) FROM payments) payments_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM returns) returns_count,
              (SELECT COUNT(*) FROM exchanges) exchanges_count,
              (SELECT COUNT(*) FROM inventory_movements) movement_count,
              (SELECT COUNT(*) FROM inventory_stock) stock_count,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_quantity,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved_quantity,
              (SELECT COUNT(*) FROM watch_products) watch_models,
              (SELECT COUNT(*) FROM watch_variants) watch_variants,
              (SELECT COUNT(*) FROM catalog_variants) catalog_variants,
              (SELECT COUNT(*) FROM watch_shared_cash_register) cash_registers,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries" \
              | jq -ce '.[0].results[0] | select(.orders_count>=0)' > /tmp/client3-variant-before.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
      - name: Deploy third watches Worker ONLY, no D1 migrations
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Live API smoke and unchanged physical/financial data after deploy
        run: |
          set -euo pipefail
          base='https://orders-app-client3-old-client.orders-clothes.workers.dev'
          test "$(curl -sSL -o /tmp/client3-index -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-index
          for path in \
            '/api/client3/watches/catalog?brand=TAUWACH' \
            '/api/client3/watches/models?brand=TAUWACH' \
            '/api/client3/watches/references' \
            '/api/client3/watches/stock/history?brand=TAUWACH'; do
            status="$(curl -sS -o /tmp/client3-api-check -w '%{http_code}' --max-time 30 "$base$path")"
            test "$status" = 401 -o "$status" = 403
          done
          status="$(curl -sS -o /tmp/client3-post-check -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"brand":"TAUWACH","watchProductId":1,"gender":"male","movement":"quartz","braceletMaterial":"steel","dialColor":"black"}' \
            "$base/api/client3/watches/catalog/variants")"
          test "$status" = 401 -o "$status" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM order_items) items_count,
              (SELECT COUNT(*) FROM payments) payments_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM returns) returns_count,
              (SELECT COUNT(*) FROM exchanges) exchanges_count,
              (SELECT COUNT(*) FROM inventory_movements) movement_count,
              (SELECT COUNT(*) FROM inventory_stock) stock_count,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_quantity,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved_quantity,
              (SELECT COUNT(*) FROM watch_products) watch_models,
              (SELECT COUNT(*) FROM watch_variants) watch_variants,
              (SELECT COUNT(*) FROM catalog_variants) catalog_variants,
              (SELECT COUNT(*) FROM watch_shared_cash_register) cash_registers,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries" \
              | jq -ce '.[0].results[0]' > /tmp/client3-variant-after.json
          diff -u /tmp/client3-variant-before.json /tmp/client3-variant-after.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
          echo 'CLIENT3_VARIANT_AND_ZERO_STOCK_HOTFIX_VERIFIED'
      - name: Record confirmed Client3-only deploy
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 catalog variants + stock hotfix DEPLOYED and verified: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Accepted source bd0ca261454ebd6dc4cb280a210272270a72c6ec passed SQL stock/variant tests, cash/team regression, full TypeScript and build: https://github.com/dymovicd123/Orders-app/actions/runs/41620802636. No migrations; before/after all watch catalog, inventory, order and cash snapshots equal; FK pass. Only Client3 Worker. Manual authenticated UI acceptance still pending."
      - name: Record blocked release, do not claim success
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 variant + zero-stock hotfix release FAILED or BLOCKED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Check failing step before declaring deployment. Main/Branch2 not targeted."
