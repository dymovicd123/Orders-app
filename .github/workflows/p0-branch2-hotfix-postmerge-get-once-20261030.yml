name: P0 Branch2 final hotfix Cloudflare GET verification
on:
  push:
    branches: [ops/p0-branch2-controlled-activation-20261030]
    paths:
      - '.github/workflows/p0-branch2-hotfix-postmerge-get-once-20261030.yml'
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify native version-only upload and unchanged active Branch2 deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/p0-branch2-post-hotfix-cloudflare-get-20261030.mjs
          node scripts/ops/p0-branch2-post-hotfix-cloudflare-get-20261030.mjs
