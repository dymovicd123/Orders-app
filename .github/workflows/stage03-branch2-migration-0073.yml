name: Stage03 Branch2 migration 0073

on:
  push:
    branches:
      - branch2
    paths:
      - '.github/workflows/stage03-branch2-migration-0073.yml'

permissions:
  contents: read

jobs:
  apply:
    name: Apply 0073 to Branch2 D1 only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact Branch2 commit
        uses: actions/checkout@v4

      - name: Hard-stop on environment or migration drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "branch2" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Production D1 binding detected. Refusing migration." >&2
            exit 20
          fi

          migration='migrations/0073_v72_order_item_pricing_foundation.sql'
          grep -Fq "ADD COLUMN pricing_mode TEXT NOT NULL DEFAULT 'legacy_manual_total'" "$migration"
          grep -Fq "CHECK (pricing_mode IN ('legacy_manual_total', 'itemized_v1'))" "$migration"
          grep -Fq 'ADD COLUMN catalog_price_snapshot INTEGER' "$migration"
          grep -Fq 'catalog_price_snapshot IS NULL OR catalog_price_snapshot >= 0' "$migration"

          if grep -Eiq '\b(INSERT[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)\b' "$migration"; then
            echo "Migration 0073 contains a business-row write/backfill. Refusing migration." >&2
            exit 21
          fi
          if grep -Fiq 'catalog_execution_prices' "$migration"; then
            echo "Migration 0073 attempts to read/copy current Catalog prices. Refusing migration." >&2
            exit 22
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture historical finance fingerprint
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 \
            --remote \
            --config wrangler.jsonc \
            --command "SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COALESCE(SUM(total_amount), 0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount), 0) FROM orders) AS orders_received,
              (SELECT COALESCE(SUM(debt_amount), 0) FROM orders) AS orders_debt,
              (SELECT COALESCE(SUM(return_amount), 0) FROM orders) AS orders_return,
              (SELECT COUNT(*) FROM order_items) AS item_count,
              (SELECT COALESCE(SUM(quantity), 0) FROM order_items) AS item_quantity,
              (SELECT COALESCE(SUM(unit_price), 0) FROM order_items) AS item_unit_price_sum,
              (SELECT COALESCE(SUM(line_total), 0) FROM order_items) AS item_line_total_sum,
              (SELECT COUNT(*) FROM payments) AS payment_count,
              (SELECT COALESCE(SUM(amount), 0) FROM payments) AS payment_amount,
              (SELECT COUNT(*) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_count,
              (SELECT COALESCE(SUM(amount), 0) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_amount,
              (SELECT COUNT(*) FROM exchanges WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_exchange_count" \
            --json)"
          echo "$result"
          fingerprint="$(jq -cS '.[0].results[0]' <<<"$result")"
          [[ -n "$fingerprint" && "$fingerprint" != "null" ]] || {
            echo "Could not capture pre-migration finance fingerprint." >&2
            exit 23
          }
          printf '%s' "$fingerprint" > /tmp/stage03-f3-before.json
          echo "Pre-migration fingerprint: $fingerprint"

      - name: Apply migration 0073 to Branch2 D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 \
            --remote \
            --config wrangler.jsonc \
            --file migrations/0073_v72_order_item_pricing_foundation.sql

      - name: Verify 0073 schema classification and zero price backfill
        shell: bash
        run: |
          set -euo pipefail

          orders_result="$(npx wrangler d1 execute orders_db_branch2 \
            --remote \
            --config wrangler.jsonc \
            --command "SELECT
              COUNT(*) AS orders_count,
              SUM(CASE WHEN pricing_mode = 'legacy_manual_total' THEN 1 ELSE 0 END) AS legacy_count,
              SUM(CASE WHEN pricing_mode = 'itemized_v1' THEN 1 ELSE 0 END) AS itemized_count,
              SUM(CASE WHEN pricing_mode IS NULL OR pricing_mode NOT IN ('legacy_manual_total', 'itemized_v1') THEN 1 ELSE 0 END) AS invalid_count
              FROM orders" \
            --json)"
          echo "$orders_result"
          orders_count="$(jq -r '.[0].results[0].orders_count // 0' <<<"$orders_result")"
          legacy_count="$(jq -r '.[0].results[0].legacy_count // 0' <<<"$orders_result")"
          itemized_count="$(jq -r '.[0].results[0].itemized_count // 0' <<<"$orders_result")"
          invalid_count="$(jq -r '.[0].results[0].invalid_count // 0' <<<"$orders_result")"
          [[ "$legacy_count" == "$orders_count" && "$itemized_count" == "0" && "$invalid_count" == "0" ]] || {
            echo "Existing orders were not classified purely as legacy/manual." >&2
            exit 24
          }

          items_result="$(npx wrangler d1 execute orders_db_branch2 \
            --remote \
            --config wrangler.jsonc \
            --command "SELECT
              COUNT(*) AS item_count,
              SUM(CASE WHEN catalog_price_snapshot IS NOT NULL THEN 1 ELSE 0 END) AS snapshot_rows
              FROM order_items" \
            --json)"
          echo "$items_result"
          snapshot_rows="$(jq -r '.[0].results[0].snapshot_rows // 0' <<<"$items_result")"
          [[ "$snapshot_rows" == "0" ]] || {
            echo "Historical order items unexpectedly received Catalog price snapshots." >&2
            exit 25
          }

      - name: Verify historical finance fingerprint unchanged
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 \
            --remote \
            --config wrangler.jsonc \
            --command "SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COALESCE(SUM(total_amount), 0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount), 0) FROM orders) AS orders_received,
              (SELECT COALESCE(SUM(debt_amount), 0) FROM orders) AS orders_debt,
              (SELECT COALESCE(SUM(return_amount), 0) FROM orders) AS orders_return,
              (SELECT COUNT(*) FROM order_items) AS item_count,
              (SELECT COALESCE(SUM(quantity), 0) FROM order_items) AS item_quantity,
              (SELECT COALESCE(SUM(unit_price), 0) FROM order_items) AS item_unit_price_sum,
              (SELECT COALESCE(SUM(line_total), 0) FROM order_items) AS item_line_total_sum,
              (SELECT COUNT(*) FROM payments) AS payment_count,
              (SELECT COALESCE(SUM(amount), 0) FROM payments) AS payment_amount,
              (SELECT COUNT(*) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_count,
              (SELECT COALESCE(SUM(amount), 0) FROM returns WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_return_amount,
              (SELECT COUNT(*) FROM exchanges WHERE COALESCE(status, 'completed') <> 'cancelled') AS active_exchange_count" \
            --json)"
          echo "$result"
          after="$(jq -cS '.[0].results[0]' <<<"$result")"
          before="$(cat /tmp/stage03-f3-before.json)"
          [[ "$after" == "$before" ]] || {
            echo "Historical finance fingerprint changed during migration." >&2
            echo "Before: $before" >&2
            echo "After:  $after" >&2
            exit 26
          }
          echo "Stage03 migration 0073 verified on Branch2 D1: all existing orders remain legacy/manual, Catalog snapshots remain NULL, and historical finance aggregates are unchanged."
