name: Arrival Production read-only forensic 5 2026-10-06

on:
  push:
    branches:
      - diag-arrival-prod-20261006
    paths:
      - '.github/workflows/arrival-prod-readonly-forensic5-20261006.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard-stop on Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "diag-arrival-prod-20261006" ]]
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: List today's target Arrivals
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT m.id, m.inventory_source, m.product_name_snapshot, m.gender_snapshot, m.color_snapshot,
                   m.material_snapshot, m.length_snapshot, m.size_snapshot, m.quantity_delta,
                   m.reference_id, m.created_at
            FROM inventory_movements m
            WHERE m.movement_type='arrival'
              AND m.created_at >= '2026-10-06T14:30:00'
              AND m.product_name_snapshot IN ('ЭТНО КАРДИГАН','СӘУЛЕТ ЖИЛЕТ','АЙ-НӘЗІК ЖИЛЕТІ','ВОРОТНИК','СИНИЙ БОМБЕР')
            ORDER BY m.created_at, m.id;
          " --json
