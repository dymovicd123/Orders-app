name: F3A7 production verification

on:
  push:
    branches: [ops/f3a7-production-verification-20260902]
    paths:
      - .github/workflows/f3a7-production-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE: https://orders-app.orders-clothes.workers.dev
      TARGET_EXTERNAL_ID: ORD-20260829144801-F3A7DDC3
      ORDER_ID: '1242'
      IDEMPOTENCY_KEY: order-delete-ORD-20260829144801-F3A7DDC3-not-issued-v1
    steps:
      - name: Verify Production health
        run: |
          set -euo pipefail
          curl --fail-with-body -sS "$BASE/api/health" | tee health.json
          jq -e '.ok == true and .service == "orders-app"' health.json >/dev/null
      - name: Exact safe read and identity check
        id: before
        run: |
          set -euo pipefail
          detail="$(curl --fail-with-body -sS "$BASE/api/orders/$ORDER_ID")"
          echo "$detail"
          jq -e --argjson id "$ORDER_ID" --arg ext "$TARGET_EXTERNAL_ID" '.ok == true and .order.id == $id and .order.external_id == $ext' <<<"$detail" >/dev/null
          status="$(jq -r '.order.order_status' <<<"$detail")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo 'Exact identity confirmed: orderId=1242.'
      - name: Delete only if still not deleted
        if: steps.before.outputs.status != 'deleted'
        run: |
          set -euo pipefail
          body="$(mktemp)"
          http="$(curl -sS -o "$body" -w '%{http_code}' -X POST "$BASE/api/orders/$ORDER_ID/delete" \
            -H 'Content-Type: application/json' \
            -H 'X-Access-Role: manager' \
            -H 'X-Access-User: production-f3a7-verification' \
            -H "X-Idempotency-Key: $IDEMPOTENCY_KEY" \
            --data "{\"requestId\":\"$IDEMPOTENCY_KEY\",\"comment\":\"Удаление подтверждённого ошибочного дубля; физически товар клиенту не выдавался\",\"physicalOutcome\":\"not_issued\"}")"
          cat "$body"
          test "$http" = "200"
          jq -e '.ok == true' "$body" >/dev/null
      - name: Verify deleted order, return and shipping
        run: |
          set -euo pipefail
          detail="$(curl --fail-with-body -sS "$BASE/api/orders/$ORDER_ID")"
          echo "$detail"
          jq -e --argjson id "$ORDER_ID" --arg ext "$TARGET_EXTERNAL_ID" '
            .ok == true and
            .order.id == $id and
            .order.external_id == $ext and
            .order.order_status == "deleted" and
            .order.shipping_status == "not_sent" and
            .order.shipping_date == null and
            .order.workshop_status == "cancelled" and
            ([.order.returns[]? | select(.id == 33)] | length == 1) and
            ([.order.returns[]? | select(.id == 33)][0].status == "cancelled") and
            ([.order.returns[]? | select((.status // "completed") != "cancelled")] | length == 0)
          ' <<<"$detail" >/dev/null

          q="$(jq -rn --arg v "$TARGET_EXTERNAL_ID" '$v|@uri')"
          history="$(curl --fail-with-body -sS "$BASE/api/returns?limit=20&offset=0&q=$q&status=all")"
          echo "$history"
          jq -e --arg ext "$TARGET_EXTERNAL_ID" '[.returns[]? | select(.externalId == $ext and .id == 33 and .status == "cancelled")] | length == 1' <<<"$history" >/dev/null
      - name: Verify no active exchange or handover obligation
        run: |
          set -euo pipefail
          q="$(jq -rn --arg v "$TARGET_EXTERNAL_ID" '$v|@uri')"
          exchanges="$(curl --fail-with-body -sS "$BASE/api/exchanges?limit=100&offset=0&q=$q&status=all")"
          echo "$exchanges"
          jq -e --arg ext "$TARGET_EXTERNAL_ID" '[.exchanges[]? | select(((.externalId // .external_id // "") == $ext) and ((.status // "completed") != "cancelled"))] | length == 0' <<<"$exchanges" >/dev/null

          handover="$(curl --fail-with-body -sS "$BASE/api/orders/$ORDER_ID/stock-handover")"
          echo "$handover"
          jq -e '.ok == true and ([.items[]? | select(.reservationStatus == "active" or .reservationStatus == "fulfilled")] | length == 0)' <<<"$handover" >/dev/null
      - name: Confirm no repeat mutation was executed
        if: steps.before.outputs.status == 'deleted'
        run: |
          echo 'Order was already deleted at the first live read. The delete POST step was skipped, so no second Physical mutation was possible.'
          echo 'Original successful Production deletion returned falseShipmentRestoredQuantity=0 and falseShipmentFreshnessProtectedQuantity=1.'
