name: Apply finance business-date R1

on:
  push:
    branches:
      - fix/finance-business-date-r1-20260916

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/finance-business-date-r1-20260916
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply bounded patch
        run: python3 scripts/patch-finance-business-date-r1.py
      - name: Focused finance regression
        run: node scripts/test-finance-day-transparency.mjs
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: Diff check
        run: git diff --check
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/renderers/FinanceDashboardRenderer.tsx scripts/test-finance-day-transparency.mjs scripts/finance-day-transparency-manifest.json
          git commit -m "Use business dates as the finance journal axis"
          git push origin HEAD:fix/finance-business-date-r1-20260916
