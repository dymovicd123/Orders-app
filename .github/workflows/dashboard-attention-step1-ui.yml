name: Dashboard attention step 1 UI

on:
  push:
    branches:
      - dashboard-workshop-attention-r1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-workshop-attention-r1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove unused stock dashboard UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          section_path = Path('src/features/sections/DashboardSection.tsx')
          text = section_path.read_text(encoding='utf-8')
          for token in ['    dashboardLowStock,\n', '    openDashboardStockItem,\n']:
              if text.count(token) != 1:
                  raise SystemExit(f'destructure anchor mismatch: {token!r} -> {text.count(token)}')
              text = text.replace(token, '', 1)

          replacements = {
              '                  <p>Главные цифры месяца по дате заказа, горячие остатки и незавершённый цех.</p>': '                  <p>Главные цифры месяца и незавершённый цех. Просроченные и срочные заказы выносятся вперёд.</p>',
              '                <div className="summary-card warning-card"><span>Критичные остатки</span><strong>{dashboardSummary.criticalStockCount}</strong></div>\n': '',
              '                      <p className="mini-panel-note">Склад сортируется по спросу из заказов, цех — по сроку ожидания.</p>': '                      <p className="mini-panel-note">Здесь только цех: просрочка, дедлайны, срочность и долгое ожидание.</p>',
              '                    <span className="soft-badge">{dashboardLowStock.length + dashboardWorkshopWarnings.length}</span>': '                    <span className="soft-badge">{dashboardWorkshopWarnings.length}</span>',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'UI anchor mismatch: {old[:70]!r} -> {text.count(old)}')
              text = text.replace(old, new, 1)

          stock_start = text.index('                    <div className="dashboard-attention-column">\n                      <div className="dashboard-list-head">\n                        <strong>Критические остатки склада</strong>')
          workshop_start = text.index('                    <div className="dashboard-attention-column">\n                      <div className="dashboard-list-head">\n                        <strong>Цех долго в ожидании</strong>', stock_start)
          text = text[:stock_start] + text[workshop_start:]
          if 'Критические остатки склада' in text or 'dashboardLowStock' in text:
              raise SystemExit('stock dashboard UI still present')
          section_path.write_text(text, encoding='utf-8')

          css_path = Path('src/styles/20-inventory-dashboard.css')
          css = css_path.read_text(encoding='utf-8')
          old_css = '.dashboard-attention-grid {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 12px;\n}'
          new_css = '.dashboard-attention-grid {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr);\n  gap: 12px;\n}'
          if css.count(old_css) != 1:
              raise SystemExit(f'dashboard attention CSS anchor mismatch: {css.count(old_css)}')
          css = css.replace(old_css, new_css, 1)
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Commit UI change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-attention-step1-ui.yml
          git add src/features/sections/DashboardSection.tsx src/styles/20-inventory-dashboard.css
          git commit -m "Dashboard: focus attention panel on workshop"
          git push origin HEAD:dashboard-workshop-attention-r1
