name: Branch2 individual label preparation guarded publish (NO Main)
on:
  push:
    branches: [branch2]
    paths:
      - .github/workflows/branch2-unit-label-preparation-controlled-20261116.yml
permissions:
  contents: read
concurrency:
  group: branch2-controlled-worker-deployment
  cancel-in-progress: false
jobs:
  branch2-only:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Strict one-shot Branch2-only release guard
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '66b3ea6e42c5e38ce255931c420a819a4f175274'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          assert cfg['name']=='orders-app-branch2'
          assert cfg['main']=='worker/index.ts'
          assert cfg.get('env') is None
          assert cfg['d1_databases']==[{
            'binding':'DB','database_name':'orders_db_branch2_mirror_20261027',
            'database_id':'0904a573-21ff-44d8-93b0-c9200f771702'
          }]
          cfg['keep_vars']=True
          cfg['send_metrics']=False
          Path('.branch2-barcode-preparation-config.jsonc').write_text(json.dumps(cfg,indent=2)+'\n')
          print('BRANCH2_ONLY_SOURCE_TARGET_PASS')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Verify individual SKU correctness, cancellation and release build
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/branch2-barcode-preparation-release-guard-20261116.py
          node scripts/test-barcode-sku-foundation.mjs
          node scripts/test-barcode-sku-http-domain-20261116.mjs
          node scripts/test-barcode-sku-scanner-ui-20261116.mjs
          node scripts/test-barcode-sku-workflow-ux-20261116.mjs
          node scripts/test-barcode-unit-foundation-20261116.mjs
          node scripts/test-barcode-unit-catalog-integrity-20261116.mjs
          node scripts/test-barcode-unit-label-preparation-20261116.mjs
          npm run build
      - name: Dry run Worker upload without changing Cloudflare
        run: |
          npx --no-install wrangler deploy --config .branch2-barcode-preparation-config.jsonc --name orders-app-branch2 --keep-vars --strict --dry-run --outdir .branch2-barcode-label-preview
      - name: Preflight remote Branch2 D1 and bindings (READ ONLY)
        run: python3 scripts/branch2-barcode-preparation-release-guard-20261116.py before
      - name: Apply ONLY additive 0138 preparation safety guard to Branch2 D1
        run: |
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --yes --file migrations/0138_barcode_unit_preparation_capacity.sql
      - name: Verify migrated Branch2 schema is empty and complete (READ ONLY)
        run: python3 scripts/branch2-barcode-preparation-release-guard-20261116.py after
      - name: Deploy only Branch2 Worker and client preserving existing secrets
        run: |
          npx --no-install wrangler deploy --config .branch2-barcode-preparation-config.jsonc --name orders-app-branch2 --keep-vars --strict
      - name: Re-verify Branch2 Worker bindings and unchanged schema (READ ONLY)
        run: python3 scripts/branch2-barcode-preparation-release-guard-20261116.py worker-after
      - name: Public Branch2 smoke with explicit User-Agent (READ ONLY)
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.error
          base='https://orders-app-branch2.orders-clothes.workers.dev'
          def get(path):
              for attempt in range(1,6):
                  request=urllib.request.Request(base+path,headers={
                      'User-Agent':'OrdersBarcodeBranch2ReadOnlyVerification/1.0',
                      'Accept':'application/json,text/html,*/*'})
                  try:
                      with urllib.request.urlopen(request,timeout=25) as response:
                          if response.status==200:return response.read()
                          print('STATUS',path,response.status)
                  except urllib.error.HTTPError as error:
                      print('HTTP_ERROR',path,error.code,'attempt',attempt)
                  except Exception as error:
                      print('HTTP_EXCEPTION',path,type(error).__name__,'attempt',attempt)
                  time.sleep(2)
              raise SystemExit('BRANCH2_SMOKE_FAILED '+path)
          health=json.loads(get('/api/health'))
          if health.get('ok') is not True:raise SystemExit('HEALTH_NOT_OK')
          page=get('/').decode('utf8','replace')
          if '<html' not in page.lower():raise SystemExit('ROOT_HTML_NOT_OK')
          match=re.search(r'<script[^>]*src="(/assets/[^"]+)"',page)
          if not match or len(get(match.group(1)))<1000:raise SystemExit('ASSET_NOT_OK')
          print('BRANCH2_BARCODE_INDIVIDUAL_LABEL_RELEASE_VERIFIED')
          PY
