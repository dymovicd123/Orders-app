name: R5.3 search index read-only preflight

on:
  push:
    branches:
      - safe/d1-read-budget-r5-3-search-index-20260903
    paths:
      - scripts/.r5-3-search-index-readonly-trigger

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9d068f53a06eebc4c056ba050d582133
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_DB_UUID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      PROD_DB_NAME: orders_db_prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm Production FTS capability and search-table baseline
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const dbUuid = process.env.PROD_DB_UUID
          const expectedName = process.env.PROD_DB_NAME
          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbUuid}`
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }
          const infoResponse = await fetch(base, { headers })
          const info = await infoResponse.json()
          if (!infoResponse.ok || !info?.success || info?.result?.name !== expectedName) throw new Error('Production D1 identity check failed')
          async function query(sql, params = []) {
            const response = await fetch(`${base}/query`, { method: 'POST', headers, body: JSON.stringify({ sql, params }) })
            const payload = await response.json()
            if (!response.ok || !payload?.success) throw new Error(payload?.errors?.map(e => e.message).join('; ') || `HTTP ${response.status}`)
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result
            if (Number(result?.meta?.rows_written ?? 0) !== 0) throw new Error('Read-only preflight reported writes')
            return result?.results || []
          }
          const capability = await query(`SELECT sqlite_version() AS sqlite_version, sqlite_compileoption_used('ENABLE_FTS5') AS fts5`)
          const existing = await query(`SELECT name, type FROM sqlite_master WHERE name IN ('order_search_orders_fts','order_search_items_fts','order_search_payments_fts') ORDER BY name`)
          const counts = await query(`SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COUNT(*) FROM payments) AS payments_count`)
          console.log('Capability:', JSON.stringify(capability))
          console.log('Existing R5.3 search objects:', JSON.stringify(existing))
          console.log('Source row counts:', JSON.stringify(counts))
          console.log('READ_ONLY=PASS')
          NODE
