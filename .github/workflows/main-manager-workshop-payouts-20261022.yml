name: Main Manager Workshop Payouts
on:
  push:
    branches: [fix/main-manager-workshop-payouts-20261022]
    paths:
      - '.github/workflows/main-manager-workshop-payouts-20261022.yml'
      - 'scripts/main-workshop-manager-payouts-gate-20261022.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'worker/index.ts'
      - 'worker/domains/workshop-settlements.ts'
      - 'src/features/sections/WorkshopSection.tsx'
      - 'src/features/workshop/WorkshopSettlementsPanel.tsx'
      - 'scripts/test-workshop-manager-payouts-20261022.mjs'
      - 'scripts/main-workshop-manager-payouts-gate-20261022.mjs'
      - 'scripts/main-resolver-selective-release-20261022.mjs'
      - '.github/workflows/main-manager-workshop-payouts-20261022.yml'
permissions:
  contents: read
jobs:
  main-payout-and-frozen-release:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify production config only, no D1 commands
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
      - run: npm ci
      - name: Manager payout actor/idempotency roles and pristine Main release
        run: npm run release:check
