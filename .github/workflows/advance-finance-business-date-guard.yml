name: Advance finance business-date guard

on:
  push:
    branches:
      - fix/finance-business-date-r1-20260916

permissions:
  contents: write

jobs:
  advance-guard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-business-date-r1-20260916
      - name: Advance human finance marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/release-check.mjs')
          text = path.read_text(encoding='utf-8')
          old = "for (const marker of ['История денег', 'Здесь видно, как менялись деньги в системе']) {"
          new = "for (const marker of ['Операции по датам', 'Операции идут по дате, к которой относятся деньги']) {"
          if text.count(old) != 1:
              raise SystemExit('finance preservation marker anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit guard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release-check.mjs
          git commit -m "Advance finance journal preservation marker"
          git push origin HEAD:fix/finance-business-date-r1-20260916
