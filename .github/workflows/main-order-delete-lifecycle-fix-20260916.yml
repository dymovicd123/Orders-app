name: Prepare production order delete lifecycle fix

on:
  push:
    branches:
      - ops/branch2-manager-seed-20260916
    paths:
      - .github/workflows/main-order-delete-lifecycle-fix-20260916.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-delete-working-mode-lifecycle-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact main-derived baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f183c41a6f02a4bb996d174516ef9e0b1ba04eaa"
          grep -q '"name": "orders-app"' wrangler.jsonc
          grep -q 'orders_db_prod' wrangler.jsonc
          ! grep -q 'orders_db_branch2' wrangler.jsonc
      - run: npm ci
      - name: Apply narrow lifecycle fix and accepted Worker delta
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          write_path = Path('worker/domains/orders-write.ts')
          write = write_path.read_text()
          old_sig = "export async function updateOrderCritical(\n  db: D1Database,\n  id: number,\n  input: OrderInput,\n  actor: AuthUser | null,\n  checkedBy: string,\n) {"
          new_sig = "export async function updateOrderCritical(\n  db: D1Database,\n  id: number,\n  input: OrderInput,\n  actor: AuthUser | null,\n  checkedBy: string,\n  options: { lifecycleAction?: 'order_delete' } = {},\n) {"
          if write.count(old_sig) != 1:
              raise SystemExit('updateOrderCritical signature baseline drift')
          write = write.replace(old_sig, new_sig, 1)
          old_guard = "      const nextShippingStatus = input.shippingStatus !== undefined\n        ? normalizeShippingStatus(input.shippingStatus)\n        : existingShippingStatus;\n      if (workingModeEdit && (\n        nextOrderStatus !== existingOrderStatus\n        || nextWorkshopStatus !== existingWorkshopStatus\n        || nextShippingStatus !== existingShippingStatus\n      )) {"
          new_guard = "      const nextShippingStatus = input.shippingStatus !== undefined\n        ? normalizeShippingStatus(input.shippingStatus)\n        : existingShippingStatus;\n      const dedicatedOrderDelete = options.lifecycleAction === 'order_delete'\n        && deletingOrder\n        && nextWorkshopStatus === existingWorkshopStatus\n        && nextShippingStatus === existingShippingStatus;\n      if (workingModeEdit && !dedicatedOrderDelete && (\n        nextOrderStatus !== existingOrderStatus\n        || nextWorkshopStatus !== existingWorkshopStatus\n        || nextShippingStatus !== existingShippingStatus\n      )) {"
          if write.count(old_guard) != 1:
              raise SystemExit('working-mode lifecycle guard baseline drift')
          write_path.write_text(write.replace(old_guard, new_guard, 1))

          delete_path = Path('worker/domains/order-delete.ts')
          deletion = delete_path.read_text()
          old_call = "    actor ?? null,\n    checkedBy,\n  )"
          new_call = "    actor ?? null,\n    checkedBy,\n    { lifecycleAction: 'order_delete' },\n  )"
          if deletion.count(old_call) != 1:
              raise SystemExit('deleteOrderSafely call baseline drift')
          delete_path.write_text(deletion.replace(old_call, new_call, 1))

          test_path = Path('scripts/test-order-delete-mobility.mjs')
          test = test_path.read_text()
          old_reads = "  const worker = read('worker/index.ts')\n  const deletion = read('worker/domains/order-delete.ts')"
          if test.count(old_reads) != 1:
              raise SystemExit('order-delete test read baseline drift')
          test = test.replace(old_reads, old_reads + "\n  const ordersWrite = read('worker/domains/orders-write.ts')", 1)
          old_assert = "  check(deletion.includes('requestId: `${requestId}:order`'), 'final logical deletion is not retry-idempotent')\n  check(deletion.includes(\"orderStatus: 'deleted'\"), 'existing logical deletion path is not reused')"
          new_assert = old_assert + "\n  check(deletion.includes(\"{ lifecycleAction: 'order_delete' }\"), 'dedicated delete path does not declare its lifecycle action')\n  check(ordersWrite.includes(\"options: { lifecycleAction?: 'order_delete' } = {}\"), 'order editor lacks a typed internal lifecycle-action option')\n  check(ordersWrite.includes(\"options.lifecycleAction === 'order_delete'\"), 'dedicated delete lifecycle bypass is missing')\n  check(ordersWrite.includes('workingModeEdit && !dedicatedOrderDelete'), 'ordinary working-mode lifecycle edits are no longer protected')\n  check(ordersWrite.includes('nextWorkshopStatus === existingWorkshopStatus'), 'dedicated delete bypass is not constrained against workshop lifecycle changes')\n  check(ordersWrite.includes('nextShippingStatus === existingShippingStatus'), 'dedicated delete bypass is not constrained against shipping lifecycle changes')"
          if test.count(old_assert) != 1:
              raise SystemExit('order-delete test assertion baseline drift')
          test_path.write_text(test.replace(old_assert, new_assert, 1))
          PY

          node <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          import { execFileSync } from 'node:child_process'
          const sha = value => crypto.createHash('sha256').update(value).digest('hex')
          function declarationText(file, name, text) {
            const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            for (const statement of source.statements) {
              let names = []
              if ((ts.isFunctionDeclaration(statement) || ts.isClassDeclaration(statement) || ts.isInterfaceDeclaration(statement) || ts.isTypeAliasDeclaration(statement) || ts.isEnumDeclaration(statement)) && statement.name) names = [statement.name.text]
              else if (ts.isVariableStatement(statement)) names = statement.declarationList.declarations.flatMap(d => ts.isIdentifier(d.name) ? [d.name.text] : [])
              if (names.includes(name)) return statement.getText(source).replace(/^export\s+/, '')
            }
            throw new Error(`Declaration ${name} missing in ${file}`)
          }
          const changes = {}
          for (const [name,file] of [['deleteOrderSafely','worker/domains/order-delete.ts'],['updateOrderCritical','worker/domains/orders-write.ts']]) {
            const beforeText = execFileSync('git',['show',`HEAD:${file}`],{encoding:'utf8'})
            const afterText = fs.readFileSync(file,'utf8')
            changes[name] = {before:sha(declarationText(file,name,beforeText)),after:sha(declarationText(file,name,afterText))}
            if (changes[name].before === changes[name].after) throw new Error(`${name} did not change`)
          }
          fs.writeFileSync('scripts/order-delete-working-mode-lifecycle-worker-manifest.json', JSON.stringify({version:1,revision:'order-delete-working-mode-lifecycle-r1',changes},null,2)+'\n')
          NODE

          python <<'PY'
          from pathlib import Path
          path = Path('scripts/test-step1906a-worker-modularization.mjs')
          text = path.read_text()
          end_marker = "fs.writeFileSync(legacyPath, patched)"
          if text.count(end_marker) != 1:
              raise SystemExit('Worker gate final marker drift')
          layer = "\n".join([
              "const orderDeleteLifecycle = JSON.parse(fs.readFileSync(path.join(root, 'scripts/order-delete-working-mode-lifecycle-worker-manifest.json'), 'utf8'))",
              "if (orderDeleteLifecycle.version !== 1 || orderDeleteLifecycle.revision !== 'order-delete-working-mode-lifecycle-r1' || Object.keys(orderDeleteLifecycle.changes || {}).sort().join(',') !== 'deleteOrderSafely,updateOrderCritical') throw new Error('Order delete lifecycle Worker allow-list changed')",
              "patched = 'const orderDeleteLifecycleChanges = ' + JSON.stringify(orderDeleteLifecycle.changes) + '\\n' + patched",
              "const orderDeleteLifecycleHashAnchor = '        return sha(declarations.get(name)) === (resolverUxChanged ? resolverUxChanged.after : acceptedFinanceR3HistoricalCashHash)'",
              "if (!patched.includes(orderDeleteLifecycleHashAnchor)) throw new Error('Order delete lifecycle predecessor anchor missing')",
              "patched = patched.replace(orderDeleteLifecycleHashAnchor, [",
              "  '        const acceptedPostResolverUxHash = resolverUxChanged ? resolverUxChanged.after : acceptedFinanceR3HistoricalCashHash',",
              "  '        const orderDeleteLifecycleChanged = orderDeleteLifecycleChanges[name]',",
              "  \"        if (orderDeleteLifecycleChanged) check(orderDeleteLifecycleChanged.before === acceptedPostResolverUxHash, 'Order delete lifecycle predecessor drifted: ' + name)\",",
              "  '        return sha(declarations.get(name)) === (orderDeleteLifecycleChanged ? orderDeleteLifecycleChanged.after : acceptedPostResolverUxHash)',",
              "].join('\\n'))",
              "const orderDeleteLifecycleAddedAnchor = '    check(sha(declarations.get(name)) === acceptedHash, operationalAutonomyA4Changed\\n      ? `Order delete mobility declaration changed beyond exact Operational Autonomy A4 allow-list: ${name}`\\n      : `Order delete mobility declaration changed beyond exact allow-list: ${name}`)\\n'",
              "if (!patched.includes(orderDeleteLifecycleAddedAnchor)) throw new Error('Order delete lifecycle added-declaration anchor missing')",
              "patched = patched.replace(orderDeleteLifecycleAddedAnchor, [",
              "  '    const orderDeleteLifecycleChanged = orderDeleteLifecycleChanges[name]',",
              "  '    if (orderDeleteLifecycleChanged) {',",
              "  \"      check(orderDeleteLifecycleChanged.before === acceptedHash, 'Order delete lifecycle added-declaration predecessor drifted: ' + name)\",",
              "  '      acceptedHash = orderDeleteLifecycleChanged.after',",
              "  '    }',",
              "  '    check(sha(declarations.get(name)) === acceptedHash, orderDeleteLifecycleChanged',",
              "  '      ? `Order delete mobility declaration changed beyond exact lifecycle-fix allow-list: ${name}`',",
              "  '      : (operationalAutonomyA4Changed',",
              "  '        ? `Order delete mobility declaration changed beyond exact Operational Autonomy A4 allow-list: ${name}`',",
              "  '        : `Order delete mobility declaration changed beyond exact allow-list: ${name}`))',",
              "  '',",
              "].join('\\n'))",
              "",
          ])
          path.write_text(text.replace(end_marker, layer + end_marker, 1))
          PY

          git diff --check
      - name: Focused delete regression
        run: node scripts/test-order-delete-mobility.mjs
      - name: Worker integrity regression
        run: node scripts/test-step1906a-worker-modularization.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full release gate
        run: npm run release:check
      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add worker/domains/orders-write.ts worker/domains/order-delete.ts scripts/test-order-delete-mobility.mjs scripts/test-step1906a-worker-modularization.mjs scripts/order-delete-working-mode-lifecycle-worker-manifest.json
          git commit -m "Fix dedicated order deletion in working mode"
          git push origin HEAD:fix/order-delete-working-mode-lifecycle-20260916
