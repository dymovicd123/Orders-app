name: Run Catalog Gender Hardening R2

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - .github/workflows/run-catalog-gender-hardening-r2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Generate focused implementation
        run: node scripts/apply-catalog-gender-hardening-r2.mjs
      - name: Prove and refresh W6 exact manifest
        run: node scripts/refresh-w6-manifest-for-gender-r2.mjs
      - name: Generate exact 1906A acceptance layer
        run: node scripts/apply-catalog-gender-1906a-layer.mjs
      - name: Focused catalog acceptance
        run: |
          node scripts/test-catalog-gender-scope-r1.mjs
          node scripts/test-catalog-gender-migration-r1.mjs
      - name: Build
        run: npm run build
      - name: Trace exact catalog router delta
        run: node scripts/diagnose-catalog-gender-router.mjs
      - name: Exact Worker structural acceptance
        run: node scripts/test-step1906a-worker-modularization.mjs
      - name: Full cumulative release check
        run: npm run release:check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0068_v72_catalog_product_gender_scope.sql package.json scripts/test-catalog-gender-scope-r1.mjs scripts/test-catalog-gender-migration-r1.mjs scripts/w6-4-catalog-sku-card-worker-manifest.json scripts/catalog-gender-scope-r1-worker-manifest.json scripts/test-step1906a-worker-modularization-legacy.mjs scripts/test-step1906a-worker-modularization.mjs worker/domains/catalog.ts worker/domains/catalog-review.ts src/app/controllers/useWorkspaceViewModel.tsx src/app/controllers/useOperationalViewModel.ts src/features/inventory/views/renderInventoryCatalogPanel.tsx
          git commit -m "Harden catalog gender cleanup and adjacent flows"
          git push origin HEAD:catalog-gender-cleanup-r1
