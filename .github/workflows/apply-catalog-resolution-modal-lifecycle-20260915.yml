name: Apply catalog resolution modal lifecycle hotfix

on:
  push:
    branches:
      - fix/catalog-resolution-modal-lifecycle-20260915
    paths:
      - .github/workflows/apply-catalog-resolution-modal-lifecycle-20260915.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-resolution-modal-lifecycle-20260915
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Apply guarded lifecycle patch
        run: python scripts/patch-catalog-resolution-modal-lifecycle-20260915.py
      - name: Focused regression
        run: node scripts/test-contextual-catalog-resolution-r1.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/orders/OrderCatalogResolutionModal.tsx scripts/test-contextual-catalog-resolution-r1.mjs scripts/contextual-catalog-resolution-r1-frontend-manifest.json
          git diff --cached --check
          git commit -m "fix: keep catalog resolver open until explicit resolution"
          git push origin HEAD:fix/catalog-resolution-modal-lifecycle-20260915
