name: Orders August candidate proof

on:
  push:
    branches:
      - ops/orders-august-candidate-proof-20260904

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: orders_db_prod
      EXPECTED_MAIN_SHA: 6256d003f2c3c15cb1b8e675f0c225a6732cdc68
      OPS_WORKFLOW: .github/workflows/orders-august-candidate-proof.yml
      DATE_FROM: 2026-08-01
      DATE_TO: 2026-08-31
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Guard exact R5.8 source and Production database
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          unexpected="$(git diff --name-only "$EXPECTED_MAIN_SHA"..HEAD | grep -vFx "$OPS_WORKFLOW" || true)"
          test -z "$unexpected"
          npx --no-install wrangler whoami >/tmp/whoami.txt
          npx --no-install wrangler d1 execute "$DB_NAME" --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='orders'" >/tmp/marker.json
          jq -e '.[0].meta.rows_written == 0 and (.[0].meta.changed_db == false) and (.[0].results|length) == 1' /tmp/marker.json >/dev/null
      - name: Prove sequential-page and handover candidates
        shell: bash
        run: |
          set -euo pipefail
          measure() {
            key="$1"; sql="$2"; out="/tmp/${key}.json"
            npx --no-install wrangler d1 execute "$DB_NAME" --remote --json --command "$sql" > "$out"
            jq -e '.[0].meta.rows_written == 0 and (.[0].meta.changed_db == false)' "$out" >/dev/null
            echo "R59B|$key|rows_read=$(jq -r '.[0].meta.rows_read // 0' "$out")|result_rows=$(jq -r '.[0].results | length' "$out")|duration_ms=$(jq -r '.[0].meta.duration // 0' "$out")"
          }

          fields="o.id,o.external_id,o.order_date,o.manager_id,CASE WHEN m.id IS NOT NULL THEN m.name WHEN NULLIF(TRIM(COALESCE(o.manager_snapshot_name,'')),'') IS NOT NULL THEN o.manager_snapshot_name || ' · исторический менеджер' ELSE 'Менеджер требует уточнения' END AS manager_name,o.manager_snapshot_name,COALESCE(m.color_key,'#64748B') AS manager_color,c.phone_normalized AS customer_phone,c.display_name AS customer_name,o.city,o.delivery_type,o.source_type,o.workshop_status,o.order_status,o.shipping_status,o.shipping_date,o.total_amount,o.received_amount,o.debt_amount,o.return_amount,o.comment,o.archived_at,o.archived_by,o.archive_reason,o.archive_batch_id"
          where="o.order_status NOT IN ('deleted','archived') AND o.order_date >= '$DATE_FROM' AND o.order_date <= '$DATE_TO'"

          for offset in 0 100 200 300 400; do
            page=$((offset/100+1))
            measure "base_p$page" "SELECT $fields FROM orders o LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id WHERE $where ORDER BY o.order_date DESC,o.id DESC LIMIT 100 OFFSET $offset"
          done
          for page in 2 3 4 5; do
            prev=$((page-1))
            cursor_date="$(jq -r '.[0].results[-1].order_date' /tmp/base_p${prev}.json)"
            cursor_id="$(jq -r '.[0].results[-1].id' /tmp/base_p${prev}.json)"
            measure "keyset_p$page" "SELECT $fields FROM orders o LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id WHERE $where AND (o.order_date < '$cursor_date' OR (o.order_date = '$cursor_date' AND o.id < $cursor_id)) ORDER BY o.order_date DESC,o.id DESC LIMIT 100"
            test "$(jq -c '.[0].results|map(.external_id)' /tmp/base_p${page}.json)" = "$(jq -c '.[0].results|map(.external_id)' /tmp/keyset_p${page}.json)"
            echo "R59B_KEYSET_EXACT|page=$page|true"
          done

          measure full_summary "SELECT COUNT(o.id) AS order_count,COALESCE(SUM(o.total_amount),0) AS total_amount,COALESCE(SUM(o.received_amount),0) AS payment_amount,COALESCE(SUM(o.debt_amount),0) AS debt_amount,COALESCE(SUM((SELECT COALESCE(SUM(oi.quantity),0) FROM order_items oi WHERE oi.order_id=o.id AND oi.is_workshop=1)),0) AS workshop_units FROM orders o WHERE $where"
          measure payment_summary "SELECT COUNT(p.id) AS payment_count,COALESCE(SUM(p.amount),0) AS payment_amount FROM payments p JOIN orders o ON o.id=p.order_id WHERE o.order_status NOT IN ('deleted','archived') AND p.payment_date >= '$DATE_FROM' AND p.payment_date <= '$DATE_TO'"
          measure return_summary "SELECT COUNT(r.id) AS return_count,COALESCE(SUM(r.amount),0) AS return_amount FROM returns r JOIN orders o ON o.id=r.order_id WHERE o.order_status NOT IN ('deleted','archived') AND COALESCE(r.status,'completed')<>'cancelled' AND r.return_date >= '$DATE_FROM' AND r.return_date <= '$DATE_TO'"
          measure count_only "SELECT COUNT(o.id) AS order_count FROM orders o WHERE $where"
          test "$(jq -r '.[0].results[0].order_count' /tmp/full_summary.json)" = "$(jq -r '.[0].results[0].order_count' /tmp/count_only.json)"
          echo "R59B_COUNT_EXACT|true|count=$(jq -r '.[0].results[0].order_count' /tmp/count_only.json)"

          ids="$(jq -r '.[0].results[0:80]|map(.id|tostring)|join(",")' /tmp/base_p1.json)"
          scoped="WITH active_reservations AS (SELECT r.id AS reservation_id,r.order_id,r.order_item_id,r.inventory_source,r.variant_id,r.quantity AS reservation_quantity FROM inventory_reservations r WHERE r.order_id IN ($ids) AND r.status='active' AND r.variant_id IS NOT NULL),workshop_orders AS (SELECT oi.order_id FROM order_items oi JOIN (SELECT DISTINCT order_id FROM active_reservations) ao ON ao.order_id=oi.order_id WHERE COALESCE(oi.is_workshop,0)=1 AND oi.quantity>0 GROUP BY oi.order_id),scoped_items AS (SELECT oi.order_id,oi.id AS order_item_id,COALESCE(NULLIF(oi.inventory_obligation_key,''),'legacy-order-item:'||oi.id) AS obligation_key,COALESCE(NULLIF(oi.inventory_obligation_origin_at,''),oi.created_at) AS origin_at,o.order_date,ar.inventory_source,ar.variant_id,CASE WHEN wo.order_id IS NULL THEN 0 ELSE 1 END AS has_workshop FROM active_reservations ar JOIN order_items oi ON oi.id=ar.order_item_id JOIN orders o ON o.id=oi.order_id LEFT JOIN workshop_orders wo ON wo.order_id=oi.order_id WHERE COALESCE(oi.is_workshop,0)=0 AND oi.quantity>0)"
          old_full="$scoped SELECT si.order_item_id,(SELECT json_array(-s.rowid,s.completed_at) FROM inventory_stocktake_sessions s WHERE s.inventory_source=si.inventory_source AND s.status='completed' AND s.completed_at IS NOT NULL AND s.id NOT LIKE 'REV-%-P-%' AND datetime(s.started_at)<=datetime(si.origin_at) AND date(s.completed_at,'+5 hours')>=date(si.order_date) AND NOT EXISTS (SELECT 1 FROM inventory_stock_checks exact_sku WHERE exact_sku.inventory_source=si.inventory_source AND exact_sku.variant_id=si.variant_id AND exact_sku.reference_type='stocktake' AND exact_sku.reference_id=s.id) ORDER BY datetime(s.completed_at) DESC,s.rowid DESC LIMIT 1) AS full_point FROM scoped_items si ORDER BY si.order_item_id"
          measure old_full "$old_full"

          joined_full="$scoped,full_candidates AS MATERIALIZED (SELECT si.order_item_id,s.rowid AS stocktake_rowid,s.completed_at,ROW_NUMBER() OVER (PARTITION BY si.order_item_id ORDER BY datetime(s.completed_at) DESC,s.rowid DESC) AS rn FROM scoped_items si JOIN inventory_stocktake_sessions s ON s.inventory_source=si.inventory_source AND s.status='completed' AND s.completed_at IS NOT NULL AND s.id NOT LIKE 'REV-%-P-%' AND datetime(s.started_at)<=datetime(si.origin_at) AND date(s.completed_at,'+5 hours')>=date(si.order_date) LEFT JOIN inventory_stock_checks exact_sku ON exact_sku.inventory_source=si.inventory_source AND exact_sku.variant_id=si.variant_id AND exact_sku.reference_type='stocktake' AND exact_sku.reference_id=s.id WHERE exact_sku.id IS NULL) SELECT si.order_item_id,CASE WHEN fc.stocktake_rowid IS NULL THEN NULL ELSE json_array(-fc.stocktake_rowid,fc.completed_at) END AS full_point FROM scoped_items si LEFT JOIN full_candidates fc ON fc.order_item_id=si.order_item_id AND fc.rn=1 ORDER BY si.order_item_id"
          measure joined_full "$joined_full"
          test "$(jq -c '.[0].results' /tmp/old_full.json)" = "$(jq -c '.[0].results' /tmp/joined_full.json)"
          echo "R59B_FULL_EXACT|true"

          measure stockcheck_indexes "SELECT name,sql FROM sqlite_master WHERE type='index' AND tbl_name='inventory_stock_checks' ORDER BY name"
          echo "R59B_INDEXES|$(jq -c '.[0].results' /tmp/stockcheck_indexes.json)"

          python - <<'PY'
          import json
          def rr(n):
            with open('/tmp/'+n+'.json',encoding='utf-8') as f:return int(json.load(f)[0]['meta'].get('rows_read') or 0)
          full=rr('full_summary')+rr('payment_summary')+rr('return_summary')
          print(f'R59B_SUMMARY|full={full}|count_only={rr("count_only")}|saved={full-rr("count_only")}|pct={(full-rr("count_only"))*100/full:.1f}')
          for p in range(2,6):
            b=rr(f'base_p{p}');k=rr(f'keyset_p{p}')
            print(f'R59B_PAGE|page={p}|baseline={b}|keyset={k}|saved={b-k}|pct={(b-k)*100/b:.1f}')
          print(f'R59B_FULLSTOCKTAKE|old={rr("old_full")}|joined={rr("joined_full")}|saved={rr("old_full")-rr("joined_full")}')
          PY
          echo R59B_OK
