name: Branch2 return status hint UI-only release
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'src/features/sections/OrderReturnsSection.tsx'
      - '.github/workflows/branch2-return-hint-cleanup-20261028.yml'
  push:
    branches: [branch2]
    paths:
      - 'src/features/sections/OrderReturnsSection.tsx'
      - '.github/workflows/branch2-return-hint-cleanup-20261028.yml'
permissions:
  contents: read
concurrency:
  group: branch2-return-hint-cleanup-20261028
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Verify only the redundant hint is removed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const source=readFileSync('src/features/sections/OrderReturnsSection.tsx','utf8')
          if(source.includes('Это учётная отметка отправки, а не подтверждение того, что товары уже вернулись обратно.')) throw Error('Old hint remains')
          if(!source.includes('По системе:'))throw Error('Shipping status display lost')
          NODE
      - run: npm ci
      - run: npm run build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/branch2'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Ensure Branch2 Worker and D1, UI-only release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = branch2
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2_mirror_20261027"' wrangler.jsonc
          grep -Fq '"database_id": "0904a573-21ff-44d8-93b0-c9200f771702"' wrangler.jsonc
          ! grep -Eiq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
          while IFS= read -r file; do
            case "$file" in
              src/features/sections/OrderReturnsSection.tsx|.github/workflows/branch2-return-hint-cleanup-20261028.yml) ;;
              *) echo "Unexpected file in Branch2 UI-only release: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)
      - run: npm ci
      - run: npm run build
      - name: Publish Branch2 only, without database writes
        run: npx wrangler deploy
      - name: Verify Branch2 origin
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://orders-app-branch2.orders-clothes.workers.dev/?return_hint_cleanup='+Date.now(),{cache:'no-store'})
          if(!response.ok||!(await response.text()).includes('/assets/'))throw Error('Branch2 unavailable')
          console.log('BRANCH2_RETURN_HINT_CLEANUP_DEPLOY_OK')
          NODE
