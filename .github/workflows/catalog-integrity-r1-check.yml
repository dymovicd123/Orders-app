name: Catalog integrity R1 focused verification

on:
  push:
    branches: [ci-catalog-integrity-r1-20261009]
    paths:
      - '.github/workflows/catalog-integrity-r1-check.yml'
      - 'src/app/types.ts'
      - 'worker/domains/references.ts'
      - 'worker/domains/catalog.ts'
      - 'src/app/controllers/useOperationalViewModel.ts'
      - 'src/features/sections/ReferencesSection.tsx'
      - 'src/App.tsx'
      - 'scripts/test-catalog-integrity-r1-references.mjs'

permissions:
  contents: read

jobs:
  verify:
    name: Reference integrity focused tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact feature SHA
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Focused reference and semantic SKU tests
        run: |
          set -euo pipefail
          node scripts/test-catalog-integrity-r1-references.mjs
          node scripts/test-catalog-resolver-r12-catalog-consistency.mjs
          node scripts/test-catalog-resolver-r13-known-facts.mjs
          node scripts/test-catalog-semantic-sku-identity.mjs
      - name: TypeScript and Vite production build
        run: npm run build
