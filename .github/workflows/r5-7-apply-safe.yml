name: R5.7 safe Orders Summary implementation

on:
  push:
    branches:
      - safe/d1-read-budget-r5-7-orders-summary-20260904

permissions:
  contents: write

jobs:
  apply:
    name: Apply measured R5.7 runtime optimization on safe branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard exact R5.6 parent
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fd0f509912a2939c8e9f0b84a7093b82a1d47c60 HEAD
          unexpected="$(git diff --name-only fd0f509912a2939c8e9f0b84a7093b82a1d47c60..HEAD | grep -vFx '.github/workflows/r5-7-apply-safe.yml' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Safe branch already contains unexpected changes:" >&2
            echo "$unexpected" >&2
            exit 10
          fi

      - name: Apply exact source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          orders = Path('worker/domains/orders-read.ts')
          text = orders.read_text(encoding='utf-8')
          anchor = "  const dateTo = cleanText(url.searchParams.get('dateTo'));\n  let aggregateNeedsManagerJoin = false;"
          replacement = "  const dateTo = cleanText(url.searchParams.get('dateTo'));\n  // R5.7: the Orders UI does not consume paymentCount. Keep the legacy default for every\n  // caller, but allow the UI to skip the global payments scan when paymentAmount can be\n  // read from the already-canonical per-order received_amount values.\n  const includePaymentCount = cleanText(url.searchParams.get('includePaymentCount')) !== '0';\n  let aggregateNeedsManagerJoin = false;"
          if text.count(anchor) != 1:
              raise SystemExit('orders-read includePaymentCount anchor mismatch')
          text = text.replace(anchor, replacement, 1)

          old_order_fallback = '''    orderStats = await db.prepare(`
      SELECT
        COUNT(o.id) AS order_count,
        COALESCE(SUM(o.total_amount), 0) AS total_amount,
        COALESCE(SUM(o.debt_amount), 0) AS debt_amount,
        COALESCE(SUM(COALESCE(workshop_items.workshop_units, 0)), 0) AS workshop_units
      ${aggregateJoins}
      LEFT JOIN (
        SELECT order_id, COALESCE(SUM(quantity), 0) AS workshop_units
        FROM order_items
        WHERE is_workshop = 1
        GROUP BY order_id
      ) workshop_items ON workshop_items.order_id = o.id
      ${orderWhereParts.length ? `WHERE ${orderWhereParts.join(' AND ')}` : ''}`
    ).bind(...orderBindings).first<Record<string, unknown>>();'''
          new_order_fallback = '''    // R5.7 Production forensic: materializing every Workshop group cost 5,212 rows_read
    // for the active fallback. The correlated lookup uses the existing partial covering index and
    // produced exactly the same totals at 3,739 rows_read. received_amount is included at no extra
    // scan so the ordinary active UI can avoid a second full payments aggregate below.
    orderStats = await db.prepare(`
      SELECT
        COUNT(o.id) AS order_count,
        COALESCE(SUM(o.total_amount), 0) AS total_amount,
        COALESCE(SUM(o.received_amount), 0) AS payment_amount,
        COALESCE(SUM(o.debt_amount), 0) AS debt_amount,
        COALESCE(SUM((
          SELECT COALESCE(SUM(oi.quantity), 0)
          FROM order_items oi
          WHERE oi.order_id = o.id AND oi.is_workshop = 1
        )), 0) AS workshop_units
      ${aggregateJoins}
      ${orderWhereParts.length ? `WHERE ${orderWhereParts.join(' AND ')}` : ''}`
    ).bind(...orderBindings).first<Record<string, unknown>>();'''
          if text.count(old_order_fallback) != 1:
              raise SystemExit('orders-read order fallback anchor mismatch')
          text = text.replace(old_order_fallback, new_order_fallback, 1)

          old_payment_block = '''  } else {
    [paymentStats, returnStats] = await Promise.all([
      db.prepare(`
        SELECT COUNT(p.id) AS payment_count, COALESCE(SUM(p.amount), 0) AS payment_amount
        FROM payments p
        JOIN orders o ON o.id = p.order_id
        ${aggregateNeedsManagerJoin ? 'LEFT JOIN managers m ON m.id = o.manager_id' : ''}
        ${aggregateNeedsCustomerJoin ? 'LEFT JOIN customers c ON c.id = o.customer_id' : ''}
        ${paymentWhereParts.length ? `WHERE ${paymentWhereParts.join(' AND ')}` : ''}`
      ).bind(...paymentBindings).first<Record<string, unknown>>(),
      db.prepare(`
        SELECT COUNT(r.id) AS return_count, COALESCE(SUM(r.amount), 0) AS return_amount
        FROM returns r
        JOIN orders o ON o.id = r.order_id
        ${aggregateNeedsManagerJoin ? 'LEFT JOIN managers m ON m.id = o.manager_id' : ''}
        ${aggregateNeedsCustomerJoin ? 'LEFT JOIN customers c ON c.id = o.customer_id' : ''}
        ${returnWhereParts.length ? `WHERE ${returnWhereParts.join(' AND ')}` : ''}`
      ).bind(...returnBindings).first<Record<string, unknown>>(),
    ]);
  }

  const totalCount = toInt(orderStats?.order_count, 0);'''
          new_payment_block = '''  } else {
    const returnStatsPromise = db.prepare(`
      SELECT COUNT(r.id) AS return_count, COALESCE(SUM(r.amount), 0) AS return_amount
      FROM returns r
      JOIN orders o ON o.id = r.order_id
      ${aggregateNeedsManagerJoin ? 'LEFT JOIN managers m ON m.id = o.manager_id' : ''}
      ${aggregateNeedsCustomerJoin ? 'LEFT JOIN customers c ON c.id = o.customer_id' : ''}
      ${returnWhereParts.length ? `WHERE ${returnWhereParts.join(' AND ')}` : ''}`
    ).bind(...returnBindings).first<Record<string, unknown>>();

    // Production invariant check before R5.7: all 1,295 active orders had received_amount equal to
    // SUM(payments.amount), with zero mismatches. That equivalence is valid for any subset of those
    // active orders as long as there is no payment-date window. Other archive/status/date modes keep
    // the legacy payments query unchanged. The default API behavior also keeps the exact count.
    const canUseOrderReceivedPaymentAmount = !includePaymentCount
      && archiveMode === 'active'
      && (status === 'all' || status === 'active')
      && !dateFrom
      && !dateTo;

    if (canUseOrderReceivedPaymentAmount) {
      paymentStats = { payment_count: null, payment_amount: toInt(orderStats?.payment_amount, 0) };
      returnStats = await returnStatsPromise;
    } else {
      [paymentStats, returnStats] = await Promise.all([
        db.prepare(`
          SELECT COUNT(p.id) AS payment_count, COALESCE(SUM(p.amount), 0) AS payment_amount
          FROM payments p
          JOIN orders o ON o.id = p.order_id
          ${aggregateNeedsManagerJoin ? 'LEFT JOIN managers m ON m.id = o.manager_id' : ''}
          ${aggregateNeedsCustomerJoin ? 'LEFT JOIN customers c ON c.id = o.customer_id' : ''}
          ${paymentWhereParts.length ? `WHERE ${paymentWhereParts.join(' AND ')}` : ''}`
        ).bind(...paymentBindings).first<Record<string, unknown>>(),
        returnStatsPromise,
      ]);
    }
  }

  const totalCount = toInt(orderStats?.order_count, 0);'''
          if text.count(old_payment_block) != 1:
              raise SystemExit('orders-read payment fallback anchor mismatch')
          text = text.replace(old_payment_block, new_payment_block, 1)

          old_count = "      paymentCount: toInt(paymentStats?.payment_count, 0),"
          new_count = "      paymentCount: paymentStats?.payment_count == null ? null : toInt(paymentStats.payment_count, 0),"
          if text.count(old_count) != 1:
              raise SystemExit('orders-read paymentCount response anchor mismatch')
          text = text.replace(old_count, new_count, 1)
          orders.write_text(text, encoding='utf-8')

          replace_once(
              'src/App.tsx',
              "        dateTo: activeFilters.dateTo,\n      })",
              "        dateTo: activeFilters.dateTo,\n        // R5.7: the Orders UI never renders paymentCount. For the ordinary active/no-date view,\n        // let the Worker reuse canonical received_amount instead of scanning all payments.\n        includePaymentCount: activeFilters.archiveMode === 'active' && !activeFilters.dateFrom && !activeFilters.dateTo ? '0' : '1',\n      })",
              'App includePaymentCount',
          )

          replace_once(
              'src/app/types.ts',
              '  paymentCount: number\n',
              '  paymentCount: number | null\n',
              'OrderPeriodStats paymentCount nullable',
          )

          # R5.6 guard stays meaningful after changing from a materialized Workshop subquery to an
          # indexed correlated lookup. Accept either indexable shape, still reject COALESCE(is_workshop).
          r56 = Path('scripts/test-d1-read-budget-r5-6.mjs')
          r56text = r56.read_text(encoding='utf-8')
          old_r56 = "  check(ordersRead.includes('FROM order_items\\n        WHERE is_workshop = 1\\n        GROUP BY order_id'), 'Orders summary workshop predicate is not indexable')\n  check(!ordersRead.includes('FROM order_items\\n        WHERE COALESCE(is_workshop, 0) = 1\\n        GROUP BY order_id'), 'Orders summary workshop COALESCE scan predicate returned')"
          new_r56 = "  check(ordersRead.includes('WHERE oi.order_id = o.id AND oi.is_workshop = 1') || ordersRead.includes('FROM order_items\\n        WHERE is_workshop = 1\\n        GROUP BY order_id'), 'Orders summary workshop predicate is not indexable')\n  check(!ordersRead.includes('COALESCE(is_workshop, 0) = 1'), 'Orders summary workshop COALESCE scan predicate returned')"
          if r56text.count(old_r56) != 1:
              raise SystemExit('R5.6 regression guard anchor mismatch')
          r56.write_text(r56text.replace(old_r56, new_r56, 1), encoding='utf-8')

          test = r'''import fs from 'node:fs'

const ordersRead = fs.readFileSync('worker/domains/orders-read.ts', 'utf8')
const app = fs.readFileSync('src/App.tsx', 'utf8')
const types = fs.readFileSync('src/app/types.ts', 'utf8')
const fail = (message) => { throw new Error(message) }
const check = (condition, message) => { if (!condition) fail(message) }

try {
  check(ordersRead.includes("const includePaymentCount = cleanText(url.searchParams.get('includePaymentCount')) !== '0';"), 'R5.7 opt-out must remain backward-compatible by default')
  check(ordersRead.includes('WHERE oi.order_id = o.id AND oi.is_workshop = 1'), 'R5.7 Workshop aggregate must use the indexed correlated lookup')
  check(!ordersRead.includes('LEFT JOIN (\n        SELECT order_id, COALESCE(SUM(quantity), 0) AS workshop_units'), 'R5.7 old materialized Workshop aggregate returned')
  check(ordersRead.includes('COALESCE(SUM(o.received_amount), 0) AS payment_amount'), 'R5.7 order aggregate must expose canonical received amount')
  check(ordersRead.includes("archiveMode === 'active'\n      && (status === 'all' || status === 'active')\n      && !dateFrom\n      && !dateTo"), 'R5.7 payment fast path lost its active/no-date safety boundary')
  check(ordersRead.includes('payment_count: null, payment_amount: toInt(orderStats?.payment_amount, 0)'), 'R5.7 fast path must explicitly mark paymentCount as not requested')
  check(ordersRead.includes('const returnStatsPromise = db.prepare(`'), 'R5.7 return aggregate must stay exact in both paths')
  check(ordersRead.includes('SELECT COUNT(p.id) AS payment_count, COALESCE(SUM(p.amount), 0) AS payment_amount'), 'R5.7 legacy exact payment aggregate must remain for default/date/archive callers')
  check(app.includes("includePaymentCount: activeFilters.archiveMode === 'active' && !activeFilters.dateFrom && !activeFilters.dateTo ? '0' : '1'"), 'Orders UI must opt out only for active no-date views')
  check(types.includes('paymentCount: number | null'), 'OrderPeriodStats must represent a deliberately omitted payment count')
  console.log('D1 READ BUDGET R5.7 TESTS PASSED — measured Orders Summary fallback uses indexed Workshop lookup and skips the payments scan only inside the proven active/no-date boundary')
} catch (error) {
  console.error(`D1 READ BUDGET R5.7 TESTS FAILED: ${error?.message || error}`)
  process.exit(1)
}
'''
          Path('scripts/test-d1-read-budget-r5-7.mjs').write_text(test, encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          marker = 'node scripts/test-d1-read-budget-r5-6.mjs'
          addition = marker + ' && node scripts/test-d1-read-budget-r5-7.mjs'
          release = data['scripts']['release:check']
          if 'test-d1-read-budget-r5-7.mjs' not in release:
              if marker not in release:
                  raise SystemExit('package release:check R5.6 anchor missing')
              data['scripts']['release:check'] = release.replace(marker, addition, 1)
          data['scripts']['test:d1-read-budget-r5-7'] = 'node scripts/test-d1-read-budget-r5-7.mjs'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Focused validation before commit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-d1-read-budget-r5-6.mjs
          node scripts/test-d1-read-budget-r5-7.mjs
          npm run typecheck
          npm run verify:db-safety

      - name: Commit safe implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r5-7-apply-safe.yml
          git config user.name 'dymovicd123'
          git config user.email 'dymovicd@gmail.com'
          git add worker/domains/orders-read.ts src/App.tsx src/app/types.ts scripts/test-d1-read-budget-r5-6.mjs scripts/test-d1-read-budget-r5-7.mjs package.json .github/workflows/r5-7-apply-safe.yml
          git diff --cached --check
          git commit -m 'R5.7: reduce Orders Summary fallback reads'
          git push origin HEAD:safe/d1-read-budget-r5-7-orders-summary-20260904
