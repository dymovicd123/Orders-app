name: 'Read-only forensic Ethno six SKU duplicate lineage'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-ethno-six-variant-lineage-20261016.mjs'
      - '.github/workflows/readonly-ethno-six-variant-lineage-20261016.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify read-only production identity
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ops/readonly-ethno-six-variant-lineage-20261016.mjs
          [[ "$GITHUB_BASE_REF" == 'main' ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          cat > "$RUNNER_TEMP/production-ethno-six-readonly.jsonc" <<'CFG'
          {
            "name": "orders-app-ethno-six-readonly",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/production-ethno-six-readonly.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Audit six pairs and historical linkage across correction/consolidation/stock/operations
        run: node scripts/ops/readonly-ethno-six-variant-lineage-20261016.mjs
