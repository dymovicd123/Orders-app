name: R5.5 production index apply

on:
  push:
    branches:
      - safe/d1-read-budget-r5-5-prod-apply-final-20260903

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_ACCOUNT_ID: 9d068f53a06eebc4c056ba050d582133
      EXPECTED_DB_NAME: orders_db_prod
      EXPECTED_DB_UUID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact Cloudflare account and Production D1 target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]]; then
            echo "Refusing apply: Cloudflare account mismatch." >&2
            exit 2
          fi
          databases="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
          uuid="$(jq -r --arg name "$EXPECTED_DB_NAME" '.result[]? | select(.name == $name) | .uuid // empty' <<<"$databases" | head -n1)"
          if [[ "$uuid" != "$EXPECTED_DB_UUID" ]]; then
            echo "Refusing apply: Production D1 identity mismatch: name=$EXPECTED_DB_NAME uuid=${uuid:-missing}" >&2
            exit 3
          fi
          echo "Verified Production D1: $EXPECTED_DB_NAME / $EXPECTED_DB_UUID"

      - name: Preflight read — index state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --json \
            --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND name='idx_catalog_variants_product_active_desc_sort';"

      - name: Apply R5.5 additive index only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --json \
            --command "CREATE INDEX IF NOT EXISTS idx_catalog_variants_product_active_desc_sort ON catalog_variants(product_id, is_active DESC, sort_order ASC);"

      - name: Postflight read — exact index definition
        shell: bash
        run: |
          set -euo pipefail
          out="$(npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --json \
            --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND name='idx_catalog_variants_product_active_desc_sort';")"
          echo "$out"
          grep -F 'idx_catalog_variants_product_active_desc_sort' <<<"$out" >/dev/null
          grep -F 'catalog_variants(product_id, is_active DESC, sort_order ASC)' <<<"$out" >/dev/null

      - name: Postflight read — planner uses R5.5 index
        shell: bash
        run: |
          set -euo pipefail
          plan="$(npx wrangler d1 execute "$EXPECTED_DB_NAME" --remote --json \
            --command "EXPLAIN QUERY PLAN SELECT id FROM catalog_variants WHERE product_id=1 ORDER BY is_active DESC, sort_order ASC, id ASC LIMIT 1;")"
          echo "$plan"
          grep -F 'idx_catalog_variants_product_active_desc_sort' <<<"$plan" >/dev/null
          if grep -F 'USE TEMP B-TREE' <<<"$plan" >/dev/null; then
            echo "Unexpected temp sort remains after R5.5 index." >&2
            exit 4
          fi
          echo "R5.5 PRODUCTION APPLY PASSED — exact Production D1 verified, additive index exists, planner uses it without temp sort."
