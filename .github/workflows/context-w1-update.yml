name: Context W1 update

on:
  push:
    branches:
      - context/project-continuation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical continuation
        run: python scripts/update-w1-continuation.py
      - name: Commit context and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/context-w1-update.yml scripts/update-w1-continuation.py
          git add docs/continuation/CURRENT_PROJECT_CONTEXT.md
          git commit -m "Context: record W1 Production release and next research step"
          git push origin HEAD:${GITHUB_REF_NAME}
