name: "Stages 1+2 unified native D1 acceptance (NO DEPLOY)"
on:
  push:
    branches: [test/branch2-unified-stage1-stage2-native-20261031]
    paths:
      - '.github/workflows/zz-stage2-native-d1-unified-20261031.yml'
      - 'scripts/test-stage2-unified-native-http-20261031.mjs'
      - 'src/App.tsx'
      - 'scripts/test-branch2-critical-native-d1-metadata-20261031.mjs'
      - 'worker/domains/critical.ts'
      - 'worker/domains/orders-write.ts'
      - 'worker/domains/order-reservations.ts'

permissions:
  contents: read
jobs:
  d1-real:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      # Deliberate: NEVER provide Cloudflare credentials to this isolated test.
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - name: Reproducible dependencies and current Worker/client build
        run: |
          npm ci
          npm run build
      - name: Strict local-only D1 database migration and canonical schema smoke
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test/branch2-unified-stage1-stage2-native-20261031"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -d migrations
          grep -Fq '"database_name": "orders_db_branch2_mirror_20261027"' wrangler.jsonc
          state="$RUNNER_TEMP/branch2-reservation-disposable-d1-$GITHUB_RUN_ID"
          mkdir -p "$state"
          echo "LOCAL_STATE=$state" >> "$GITHUB_ENV"
          # Historical SQL migrations include PRAGMA foreign_keys=ON/OFF,
          # which the native D1 authorizer rejects (SQLITE_AUTH). Remove only
          # those no-op-for-D1 PRAGMA lines in an EPHEMERAL fixture copy;
          # NEVER edit checked-in migrations or Branch2 D1.
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync,readdirSync} from 'node:fs'
          import path from 'node:path'
          const source=readFileSync('wrangler.jsonc','utf8')
          const token='"database_id": "0904a573-21ff-44d8-93b0-c9200f771702"'
          if(!source.includes(token))throw Error('Branch2 D1 binding changed; stop')
          mkdirSync('.d1-acceptance-migrations',{recursive:true})
          let drops=0,temporaryTables=0,legacyManagerShadow=0
          for(const file of readdirSync('migrations').filter(x=>/^[0-9].*\.sql$/.test(x))){
            const original=readFileSync(path.join('migrations',file),'utf8')
            const sanitized=original
              .replace(/^\s*PRAGMA\s+foreign_keys\s*=\s*(?:ON|OFF)\s*;\s*$/gmi,()=>{drops++;return ''})
              // D1 disallows CREATE TEMP TABLE (SQLITE_AUTH); fixture-only staging.
              .replace(/\bCREATE\s+TEMP(?:ORARY)?\s+TABLE\b/gi,()=>{temporaryTables++;return 'CREATE TABLE'})
              // Historical 0035 needs PRAGMA foreign_keys=OFF during managers
              // rebuild. Native D1 authorizer rejects that toggle, so SQLite
              // automatically redirects FK references to the OLD table.
              // Preserve that shadow table only in this synthetic fixture to
              // let the isolated auth bootstrap run; no production SQL altered.
              // Do NOT use this fixture to certify managerial FK migrations.
              .replace(/DROP TABLE managers_step126_old\s*;/gi,()=>{legacyManagerShadow++;return '-- Local D1 test only: keep FK-compatible manager shadow'})
            writeFileSync(path.join('.d1-acceptance-migrations',file),sanitized)
          }
          if(drops<3||temporaryTables<1||legacyManagerShadow!==1)throw Error('Unexpected ephemeral SQL fixture compatibility needs')
          const config=source.replace(token,token+',\n     "migrations_dir": ".d1-acceptance-migrations"')
            .replace('"assets": {','"assets": {\n    "directory": "./dist/client",')
          writeFileSync('.d1-acceptance-config.jsonc',config)
          console.log('NATIVE_D1_EPHEMERAL_MIGRATION_AUTHORIZE_COMPAT',JSON.stringify({drops,temporaryTables,legacyManagerShadow}))
          NODE
          npx wrangler d1 migrations apply orders_db_branch2_mirror_20261027 --local --config .d1-acceptance-config.jsonc --persist-to="$state" > "$RUNNER_TEMP/d1-migrations.log" 2>&1 || {
            tail -n 80 "$RUNNER_TEMP/d1-migrations.log"
            exit 1
          }
          # Historical migrations may be older than the live deployed D1 schema.
          # Test-only compatibility already documented by the in-memory HTTP fixture:
          # do NOT apply this ALTER to checked-in migrations or any remote D1.
          npx wrangler d1 execute orders_db_branch2_mirror_20261027 --local --persist-to="$state" --command="SELECT name FROM pragma_table_info('orders') WHERE name='manager_snapshot_name'" --json > "$RUNNER_TEMP/order-columns.json"
          has_snapshot="$(node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/order-columns.json','utf8'))
          const rows=Array.isArray(result)?result.flatMap(x=>x.results||[]):(result.results||[])
          console.log(rows.some(row=>row.name==='manager_snapshot_name')?'yes':'no')
          NODE
          )"
          echo "BRANCH2_NATIVE_D1_HISTORIC_MIGRATION_MANAGER_SNAPSHOT_COLUMN=$has_snapshot"
          if test "$has_snapshot" = no; then
            npx wrangler d1 execute orders_db_branch2_mirror_20261027 --local --persist-to="$state" --command="ALTER TABLE orders ADD COLUMN manager_snapshot_name TEXT"
            echo "BRANCH2_NATIVE_D1_FIXTURE_ONLY_MANAGER_SNAPSHOT_ADAPTER_APPLIED"
          fi
          npx wrangler d1 execute orders_db_branch2_mirror_20261027 --local --persist-to="$state" --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('inventory_stock','inventory_reservations','inventory_movements','catalog_variants','inventory_stock_checks') ORDER BY name" --json > "$RUNNER_TEMP/local-d1-check.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const raw=readFileSync(process.env.RUNNER_TEMP+'/local-d1-check.json','utf8').trim()
          const v=JSON.parse(raw)
          const rows=Array.isArray(v)?v.flatMap(x=>x.results||[]):(v.results||[])
          const expected=['catalog_variants','inventory_movements','inventory_reservations','inventory_stock','inventory_stock_checks']
          assert.deepEqual(rows.map(x=>x.name),expected)
          console.log('BRANCH2_LOCAL_CLOUDFLARE_D1_SCHEMA_PASS',JSON.stringify({tables:rows.length,remoteCredentials:false}))
          NODE
      - name: Native workerd HTTP requests and persisted D1 readback
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config .d1-acceptance-config.jsonc --local --persist-to="$LOCAL_STATE" --ip 127.0.0.1 --port 8798 --var ADMIN_MODE_LOGIN:admin --var ADMIN_MODE_PASSWORD:synthetic-bootstrap-ui-2026 > "$RUNNER_TEMP/b2-native-workerd.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 'http://127.0.0.1:8798/' || true)"
            if test "$code" = 200; then ready=1; break; fi
            sleep 1
          done
          if test "$ready" -ne 1; then tail -n 100 "$RUNNER_TEMP/b2-native-workerd.log"; exit 1; fi
          node scripts/test-stage2-unified-native-http-20261031.mjs || { tail -n 140 "$RUNNER_TEMP/b2-native-workerd.log"; exit 1; }
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readdirSync} from 'node:fs'
          import path from 'node:path'
          import {DatabaseSync} from 'node:sqlite'
          const root=process.env.LOCAL_STATE
          const files=readdirSync(root,{recursive:true}).map(String).filter(x=>/\.sqlite$/.test(x))
          assert(files.length>0)
          let found=0
          for(const rel of files){
            const db=new DatabaseSync(path.join(root,rel),{readOnly:true})
            if(!db.prepare("SELECT 1 FROM sqlite_master WHERE type='table' AND name='order_items'").get()){db.close();continue}
            const stock=db.prepare(\`SELECT s.inventory_source,v.size_label,s.quantity,s.reserved_quantity
              FROM inventory_stock s JOIN catalog_variants v ON v.id=s.variant_id
              JOIN catalog_products p ON p.id=v.product_id
              WHERE p.name='CI STAGE2 ARRIVAL ATOMIC CANONICAL'
              ORDER BY s.inventory_source,v.size_label\`).all()
            if(!stock.length){db.close();continue}
            found++
            assert.deepEqual(stock.map(x=>[x.inventory_source,x.size_label,Number(x.quantity),Number(x.reserved_quantity)]),
              [['boutique','46',1,0],['boutique','48',1,0],['warehouse','46',4,0],['warehouse','48',0,0]])
            const moves=db.prepare(\`SELECT inventory_source,movement_type,quantity_delta,reference_type
              FROM inventory_movements WHERE product_name_snapshot='CI STAGE2 ARRIVAL ATOMIC CANONICAL'
              ORDER BY id\`).all()
            assert.equal(moves.length,9,'One D1 movement per real physical fact; transfer has two halves, retries none')
            const count=(type)=>moves.filter(x=>x.reference_type===type).length
            assert.equal(count('manual'),5,'Three arrivals, one correction, one writeoff')
            assert.equal(count('transfer_out'),1)
            assert.equal(count('transfer_in'),1)
            assert.equal(count('quick_stocktake'),1)
            assert.equal(count('stocktake'),1)
            assert.equal(moves.reduce((sum,x)=>sum+Number(x.quantity_delta),0),6,
              'Physical movement total must reconcile with four ending positions')
            const checks=db.prepare(\`SELECT check_type,variant_id,expected_quantity,counted_quantity
              FROM inventory_stock_checks
              WHERE variant_id IN (SELECT v.id FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
                WHERE p.name='CI STAGE2 ARRIVAL ATOMIC CANONICAL')\`).all()
            assert(checks.some(x=>x.check_type==='manual_set'&&Number(x.expected_quantity)===1&&Number(x.counted_quantity)===3),
              'Real correction checkpoint missing')
            assert(checks.some(x=>x.check_type==='quick_stocktake'&&Number(x.expected_quantity)===2&&Number(x.counted_quantity)===4),
              'Quick physical check missing')
            assert(checks.some(x=>x.check_type==='full_stocktake'&&Number(x.counted_quantity)===1),
              'Full revision checkpoint missing')
            const pending=db.prepare(\`SELECT COUNT(*) AS n FROM inventory_reservations
              WHERE variant_id IN (SELECT v.id FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
                WHERE p.name='CI STAGE2 ARRIVAL ATOMIC CANONICAL')\`).get()
            assert.equal(Number(pending.n),0,'Physical operations must not fabricate a reservation')
            console.log('BRANCH2_STAGE2_UNIFIED_NATIVE_D1_READBACK_PASS',JSON.stringify({
              stock,movementCount:moves.length,checkCount:checks.length,reserved:0,replayDelta:0
            }))
            db.close()
          }
          assert.equal(found,1,'One and only one isolated D1 backing database must contain synthetic results')
          NODE
          echo BRANCH2_STAGE2_UNIFIED_NATIVE_ACCEPTANCE_PASS
