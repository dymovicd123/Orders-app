name: R6.3 structural finalize

on:
  push:
    branches:
      - d1-read-budget-r6-3-manager-summary-reuse

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-read-budget-r6-3-manager-summary-reuse
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register exact listFinanceReports delta
        shell: bash
        run: |
          git fetch origin main
          node <<'NODE'
          const fs = require('fs')
          const cp = require('child_process')
          const crypto = require('crypto')
          const ts = require('typescript')

          const functionHash = (sourceText) => {
            const source = ts.createSourceFile('finance-reports.ts', sourceText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            const statement = source.statements.find((item) => ts.isFunctionDeclaration(item) && item.name?.text === 'listFinanceReports')
            if (!statement) throw new Error('listFinanceReports declaration not found')
            const text = statement.getText(source).replace(/^export\s+/, '')
            return crypto.createHash('sha256').update(text).digest('hex')
          }

          const beforeSource = cp.execFileSync('git', ['show', 'origin/main:worker/domains/finance-reports.ts'], { encoding: 'utf8' })
          const afterSource = fs.readFileSync('worker/domains/finance-reports.ts', 'utf8')
          const before = functionHash(beforeSource)
          const after = functionHash(afterSource)
          if (before === after) throw new Error('R6.3 listFinanceReports hash did not change')

          const manifest = {
            version: 1,
            revision: 'd1-read-budget-r6-3-manager-summary-reuse-r1',
            changes: { listFinanceReports: { before, after } },
          }
          fs.writeFileSync('scripts/d1-read-budget-r6-3-worker-manifest.json', JSON.stringify(manifest, null, 2) + '\n')

          const path = 'scripts/test-step1906a-worker-modularization.mjs'
          let text = fs.readFileSync(path, 'utf8')
          const pathAnchor = "const operationalAutonomyA5ManifestPath = path.join(root, 'scripts/operational-autonomy-a5-worker-manifest.json')\n"
          if (!text.includes(pathAnchor)) throw new Error('R6.3 manifest-path anchor missing')
          text = text.replace(pathAnchor, pathAnchor + "const d1ReadBudgetR63ManifestPath = path.join(root, 'scripts/d1-read-budget-r6-3-worker-manifest.json')\n")

          const validationAnchor = "if (!operationalAutonomyA5Manifest.router?.block) throw new Error('Operational Autonomy A5 Worker route block missing')\n"
          if (!text.includes(validationAnchor)) throw new Error('R6.3 manifest-validation anchor missing')
          const validationBlock = [
            validationAnchor.trimEnd(),
            "const d1ReadBudgetR63Manifest = JSON.parse(fs.readFileSync(d1ReadBudgetR63ManifestPath, 'utf8'))",
            "if (d1ReadBudgetR63Manifest?.version !== 1 || d1ReadBudgetR63Manifest?.revision !== 'd1-read-budget-r6-3-manager-summary-reuse-r1') throw new Error('D1 read budget R6.3 Worker manifest invalid')",
            "if (Object.keys(d1ReadBudgetR63Manifest.changes || {}).join(',') !== 'listFinanceReports') throw new Error('D1 read budget R6.3 Worker allow-list widened unexpectedly')",
            '',
          ].join('\n')
          text = text.replace(validationAnchor, validationBlock)

          const writeAnchor = 'fs.writeFileSync(legacyPath, patched)\n'
          if (!text.includes(writeAnchor)) throw new Error('R6.3 final structural anchor missing')
          const r63Layer = [
            "const r63InjectedAnchor = 'const operationalAutonomyA4RouteBlock = ' + JSON.stringify(operationalAutonomyA4RouteBlock) + '\\n'",
            "if (!patched.includes(r63InjectedAnchor)) throw new Error('1906A R6.3 injected anchor missing')",
            "patched = patched.replace(r63InjectedAnchor, r63InjectedAnchor + 'const d1ReadBudgetR63Changes = ' + JSON.stringify(d1ReadBudgetR63Manifest.changes || {}) + '\\n')",
            "const r63CheckAnchor = '    check(\\n      sha(declarations.get(name)) === acceptedPostCatalogUnisexMergeHash,\\n'",
            "if (!patched.includes(r63CheckAnchor)) throw new Error('1906A R6.3 declaration check anchor missing')",
            "const r63CheckReplacement = [",
            "  '    check(',",
            "  '      (() => {',",
            "  '        const d1ReadBudgetR63Changed = d1ReadBudgetR63Changes[name]',",
            "  '        if (!d1ReadBudgetR63Changed) return sha(declarations.get(name)) === acceptedPostCatalogUnisexMergeHash',",
            "  \"        check(d1ReadBudgetR63Changed.before === acceptedPostCatalogUnisexMergeHash, 'D1 read budget R6.3 baseline hash mismatch: ' + name)\",",
            "  '        return sha(declarations.get(name)) === d1ReadBudgetR63Changed.after',",
            "  '      })(),',",
            "].join('\\n') + '\\n'",
            "patched = patched.replace(r63CheckAnchor, r63CheckReplacement)",
            '',
          ].join('\n')
          text = text.replace(writeAnchor, r63Layer + writeAnchor)
          fs.writeFileSync(path, text)
          console.log(JSON.stringify({ before, after }))
          NODE
      - name: Run focused R6.3 and 1906A
        run: |
          node scripts/test-d1-read-budget-r6-3.mjs
          node scripts/test-o1-report-scopes.mjs
          node scripts/test-step1906a-worker-modularization.mjs
      - name: Commit structural registration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r6-3-structural-finalize.yml
          git add scripts/d1-read-budget-r6-3-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          git commit -m "R6.3: register finance report structural delta"
          git push origin HEAD:d1-read-budget-r6-3-manager-summary-reuse
