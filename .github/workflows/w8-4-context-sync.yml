name: W8.4 context sync

on:
  push:
    branches:
      - w8-4-final-mobile-acceptance

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w8-4-final-mobile-acceptance
          fetch-depth: 0
      - name: Update continuation
        run: python scripts/w8-4-sync-context.py
      - name: Commit continuation
        run: |
          if git diff --quiet -- docs/continuation/WAREHOUSE_CURRENT_CONTEXT.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/continuation/WAREHOUSE_CURRENT_CONTEXT.md
          git commit -m 'W8.4: sync Warehouse continuation [w8.4-context]'
          git push origin HEAD:w8-4-final-mobile-acceptance
