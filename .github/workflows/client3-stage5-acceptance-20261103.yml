name: Client3 Stage5 warehouse and SKU resolver isolated acceptance (NO DEPLOY)
on:
  push:
    branches: [client3/stage5-warehouse-resolver-20261103]
    paths: ['.github/workflows/client3-stage5-acceptance-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Verify strictly third Client3 environment, no Issues queue
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/stage5-warehouse-resolver-20261103
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          ! grep -Eqi 'problems|issues-queue' src/features/client3/WatchWarehouseStage5.tsx
      - run: npm ci
      - name: Full-schema real Main stock/revision/resolver/order/finance acceptance
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node scripts/client3/test-watch-main-free-text-ux-20261103.mjs
          npm run build
      - name: Record verified acceptance or blocker on Client3 plan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 Stage5 warehouse and resolver isolated acceptance: $JOB_RESULT. Source $GITHUB_SHA. Run https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. No remote D1 writes, no Worker deploy; no Problems queue transferred."
