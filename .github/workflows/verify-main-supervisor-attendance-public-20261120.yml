name: Verify Main warehouse supervisor attendance public assets after propagation
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-main-supervisor-attendance-public-20261120.yml]
permissions:
  contents: read
jobs:
  public-only:
    if: github.repository == 'dymovicd123/Orders-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact workflow-only ref and public Worker health and JS (READ ONLY)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '076c5d230b698a0d08db8dd85d35fd4dea60e186'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/verify-main-supervisor-attendance-public-20261120.yml'
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.error
          base='https://orders-app.orders-clothes.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'OrdersSupervisorAttendancePublicVerifier/1.0','Accept':'*/*','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return response.status,response.headers.get('Content-Type',''),response.read()
          for attempt in range(15):
              try:
                  status,ct,body=get('/api/health')
                  assert status==200 and json.loads(body).get('ok') is True,'Health not OK'
                  status,ct,html=get('/')
                  assert status==200 and b'<html' in html.lower(),'No HTML root'
                  paths=re.findall(rb'<script[^>]+src="(/assets/[^"]+)"',html)
                  assert paths,'No JS entry in HTML'
                  js_path=paths[0].decode()
                  status,ct,js=get(js_path)
                  if status!=200 or len(js)<=1000 or js.lstrip().lower().startswith(b'<!doctype html'):
                      raise ValueError('JS edge not propagated: '+str((status,ct,len(js))))
                  print('MAIN_SUPERVISOR_ATTENDANCE_PUBLIC_VERIFIED',js_path,len(js))
                  break
              except Exception as ex:
                  print('Main edge smoke retry',attempt+1,str(ex)[:120])
                  if attempt==14:raise
                  time.sleep(3)
          PY
