name: D1 read budget R5.5 resolver benchmark

on:
  push:
    branches: [safe/d1-read-budget-r5-5-profile-20260903]
    paths:
      - scripts/.d1-read-budget-r5-5-resolver-trigger

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_DB_UUID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      PROD_DB_NAME: orders_db_prod
    steps:
      - uses: actions/checkout@v4
      - name: Compare current and candidate resolver SQL on Production — read only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const uuid = process.env.PROD_DB_UUID
          const expectedName = process.env.PROD_DB_NAME
          if (!accountId || !token || !uuid || !expectedName) throw new Error('Missing required environment')
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }

          async function dbInfo() {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${uuid}`, { headers })
            const payload = await response.json()
            if (!response.ok || !payload?.success) throw new Error(`D1 identity read failed: HTTP ${response.status}`)
            return payload.result
          }

          async function query(sql) {
            const normalized = String(sql).trim().replace(/^EXPLAIN\s+QUERY\s+PLAN\s+/i, '').trim()
            if (!/^(SELECT|WITH)\b/i.test(normalized)) throw new Error('Benchmark only permits SELECT/WITH/EXPLAIN reads')
            if (/\b(INSERT|UPDATE|DELETE|REPLACE|CREATE|DROP|ALTER|PRAGMA|VACUUM|REINDEX|ANALYZE)\b/i.test(normalized)) {
              throw new Error('Mutation-capable SQL rejected by benchmark guard')
            }
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${uuid}/query`, {
              method: 'POST', headers, body: JSON.stringify({ sql, params: [] }),
            })
            const payload = await response.json()
            if (!response.ok || !payload?.success) {
              const message = payload?.errors?.map(e => e?.message).filter(Boolean).join('; ') || `HTTP ${response.status}`
              throw new Error(message)
            }
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result
            const rowsWritten = Number(result?.meta?.rows_written ?? result?.meta?.rowsWritten ?? 0)
            if (rowsWritten !== 0) throw new Error(`Read-only benchmark unexpectedly wrote ${rowsWritten} rows`)
            return {
              rows: Array.isArray(result?.results) ? result.results : [],
              rowsRead: Number(result?.meta?.rows_read ?? result?.meta?.rowsRead ?? 0),
              rowsWritten,
              duration: Number(result?.meta?.duration ?? 0),
            }
          }

          const info = await dbInfo()
          const actualName = String(info?.name || '')
          const actualUuid = String(info?.uuid || info?.id || uuid)
          if (actualName !== expectedName || actualUuid !== uuid) throw new Error(`Production identity mismatch: ${actualName}/${actualUuid}`)
          console.log(`PRODUCTION_IDENTITY_OK name=${actualName} uuid=${actualUuid}`)

          const sample = await query(`
            SELECT oi.id
            FROM order_items oi
            JOIN orders o ON o.id = oi.order_id
            WHERE oi.quantity > 0
              AND o.order_status NOT IN ('deleted', 'archived')
            ORDER BY oi.id DESC
            LIMIT 80
          `)
          const allIds = sample.rows.map(row => Number(row.id)).filter(Number.isFinite)
          if (!allIds.length) throw new Error('No representative order items found')
          console.log(`SAMPLE_IDS count=${allIds.length} sample_rows_read=${sample.rowsRead}`)

          function placeholders(ids) { return ids.join(',') }
          function baseline(ids) {
            return `SELECT
              oi.id AS item_id,
              COALESCE(oi.variant_id, cv_product.variant_id, cv_fallback.variant_id, 0) AS resolved_variant_id
            FROM order_items oi
            LEFT JOIN (
              SELECT cpv.product_id, MIN(cpv.variant_id) AS variant_id
              FROM catalog_product_variants cpv
              GROUP BY cpv.product_id
            ) cv_product ON cv_product.product_id = oi.product_id
            LEFT JOIN (
              SELECT MIN(cv2.id) AS variant_id
              FROM catalog_variants cv2
            ) cv_fallback ON 1 = 1
            WHERE oi.id IN (${placeholders(ids)})`
          }
          function correlated(ids) {
            return `SELECT
              oi.id AS item_id,
              COALESCE(
                oi.variant_id,
                (SELECT MIN(cpv.variant_id) FROM catalog_product_variants cpv WHERE cpv.product_id = oi.product_id),
                (SELECT MIN(cv2.id) FROM catalog_variants cv2),
                0
              ) AS resolved_variant_id
            FROM order_items oi
            WHERE oi.id IN (${placeholders(ids)})`
          }
          function scoped(ids) {
            return `WITH target_items AS MATERIALIZED (
              SELECT oi.id AS item_id, oi.variant_id, oi.product_id
              FROM order_items oi
              WHERE oi.id IN (${placeholders(ids)})
            ),
            target_products AS MATERIALIZED (
              SELECT DISTINCT product_id
              FROM target_items
              WHERE variant_id IS NULL AND product_id IS NOT NULL
            ),
            product_min AS MATERIALIZED (
              SELECT cpv.product_id, MIN(cpv.variant_id) AS variant_id
              FROM catalog_product_variants cpv
              JOIN target_products tp ON tp.product_id = cpv.product_id
              GROUP BY cpv.product_id
            ),
            fallback AS MATERIALIZED (
              SELECT MIN(id) AS variant_id FROM catalog_variants
            )
            SELECT ti.item_id,
                   COALESCE(ti.variant_id, pm.variant_id, fallback.variant_id, 0) AS resolved_variant_id
            FROM target_items ti
            LEFT JOIN product_min pm ON pm.product_id = ti.product_id
            CROSS JOIN fallback`
          }
          function canon(rows) {
            return rows.map(row => ({ item_id: Number(row.item_id), resolved_variant_id: Number(row.resolved_variant_id) }))
              .sort((a,b) => a.item_id - b.item_id)
          }
          function same(a,b) { return JSON.stringify(canon(a)) === JSON.stringify(canon(b)) }

          const sizes = [...new Set([1, 10, 30, 60, allIds.length].filter(n => n <= allIds.length))]
          for (const size of sizes) {
            const ids = allIds.slice(0, size)
            const current = await query(baseline(ids))
            const corr = await query(correlated(ids))
            const scope = await query(scoped(ids))
            if (!same(current.rows, corr.rows)) throw new Error(`Correlated candidate changed resolver truth at size=${size}`)
            if (!same(current.rows, scope.rows)) throw new Error(`Scoped candidate changed resolver truth at size=${size}`)
            console.log(`SIZE=${size} EQUIVALENT rows=${current.rows.length}`)
            console.log(`SIZE=${size} BASELINE rows_read=${current.rowsRead} duration_ms=${current.duration}`)
            console.log(`SIZE=${size} CORRELATED rows_read=${corr.rowsRead} duration_ms=${corr.duration} ratio=${current.rowsRead ? (corr.rowsRead/current.rowsRead).toFixed(4) : 'n/a'}`)
            console.log(`SIZE=${size} SCOPED rows_read=${scope.rowsRead} duration_ms=${scope.duration} ratio=${current.rowsRead ? (scope.rowsRead/current.rowsRead).toFixed(4) : 'n/a'}`)
          }

          const planIds = allIds.slice(0, Math.min(30, allIds.length))
          for (const [label, sql] of [['BASELINE', baseline(planIds)], ['CORRELATED', correlated(planIds)], ['SCOPED', scoped(planIds)]]) {
            const plan = await query(`EXPLAIN QUERY PLAN ${sql}`)
            console.log(`${label}_PLAN_BEGIN`)
            for (const row of plan.rows) console.log(String(row.detail || JSON.stringify(row)))
            console.log(`${label}_PLAN_END`)
          }
          NODE
