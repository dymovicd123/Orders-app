name: Old ordinary order post-stocktake handover safety
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'worker/domains/order-reservations.ts'
      - 'worker/index.ts'
      - 'src/App.tsx'
      - 'src/features/sections/OrdersTableSection.tsx'
      - 'scripts/test-old-order-post-stocktake-handover-r1.mjs'
      - 'scripts/test-old-order-post-stocktake-guard-r1.mjs'
      - 'scripts/test-handover-cas-after-revision-r2.mjs'
      - '.github/workflows/test-old-order-post-stocktake-handover.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Actual SQLite compact/detail checkpoint regression, September order
        run: node --experimental-strip-types scripts/test-old-order-post-stocktake-handover-r1.mjs
      - name: Actual SQLite handover CAS and no-double-stock reconciliation
        run: node --experimental-strip-types scripts/test-handover-cas-after-revision-r2.mjs
      - name: Verify shipment guard and plain-language review UI
        run: node scripts/test-old-order-post-stocktake-guard-r1.mjs
      - name: TypeScript production build
        run: npm run build
