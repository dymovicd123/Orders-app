name: W7 inventory preservation apply

on:
  push:
    branches:
      - w7-sku-history-price-readiness-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[w7-inventory-preserved]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w7-sku-history-price-readiness-audit
          fetch-depth: 1
      - name: Apply exact InventorySection preservation chain
        run: python scripts/apply-w7-inventory-preservation.py
      - name: Commit preservation delta
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "W7: preserve exact InventorySection delta [w7-inventory-preserved]"
          git push origin HEAD:w7-sku-history-price-readiness-audit
