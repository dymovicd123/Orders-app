# Rerun after Step 192A1 frontend physical-state guard adaptation.
name: Validate return physical intake R1

on:
  push:
    branches:
      - returns-physical-intake-r1
    paths:
      - .github/workflows/validate-return-physical-r1.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: returns-physical-intake-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused physical receipt regression
        run: node scripts/test-return-exchange-physical-receipt-r1.mjs
      - name: Cumulative release gate after structural registration
        run: npm run release:check
      - name: Production build
        run: npm run build
