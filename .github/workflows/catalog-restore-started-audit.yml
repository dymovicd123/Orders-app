name: Temporary Branch2 restore-started audit

on:
  push:
    branches:
      - w-catalog-ready-resume-branch2-20260930
    paths:
      - '.github/workflows/catalog-restore-started-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Branch2 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read-only restore audit
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
          SELECT
            COUNT(*) AS started_rows,
            COUNT(DISTINCT retirement_id) AS distinct_started_retirements
          FROM catalog_retirement_restores
          WHERE status='started';
          SELECT retirement_id, COUNT(*) AS started_count
          FROM catalog_retirement_restores
          WHERE status='started'
          GROUP BY retirement_id
          HAVING COUNT(*) > 1
          ORDER BY retirement_id;
          " --json
