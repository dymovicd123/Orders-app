name: Finance F7 Production read-only acceptance

on:
  push:
    branches:
      - finance-f7-prod-acceptance

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Read-only Production Finance acceptance
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          test -n "$subdomain"
          base="https://orders-app.$subdomain.workers.dev"

          echo '=== HEALTH ==='
          health="$(curl --fail-with-body -sS "$base/api/health")"
          jq '{ok,service,time}' <<<"$health"
          jq -e '.ok == true and .service == "orders-app"' <<<"$health" >/dev/null

          echo '=== FINANCE 2026-08-24 ==='
          finance="$(curl --fail-with-body -sS "$base/api/reports/finance?startDate=2026-08-24&endDate=2026-08-24")"
          jq '{startDate,endDate,overview,reconciliation:.reports.consistency,paymentKinds:.reports.paymentKinds,crossDate:.reports.crossDatePaymentOperations,cities:.reports.cities}' <<<"$finance"

          jq -e '
            .ok == true and
            .startDate == "2026-08-24" and .endDate == "2026-08-24" and
            (.reports.paymentOperations | type == "array") and
            (.reports.paymentKinds | type == "array") and
            (.reports.paymentMethods | type == "array") and
            (.reports.crossDatePaymentOperations | type == "array") and
            (.reports.traceScope.selectedPeriodOnly == true) and
            (.reports.consistency.ok == true) and
            (.overview | has("collectionRate") | not) and
            (.overview | has("returnRate") | not) and
            (all(.reports.cities[]; has("clients") and has("managers"))) and
            (all(.reports.paymentOperations[] | select(.operationType == "order_extra"); .operationLabel == "Закрытие долга (старый тип)"))
          ' <<<"$finance" >/dev/null

          gross="$(jq '[.reports.paymentOperations[].amount] | add // 0' <<<"$finance")"
          methods="$(jq '[.reports.paymentMethods[].total] | add // 0' <<<"$finance")"
          kinds="$(jq '[.reports.paymentKinds[].total] | add // 0' <<<"$finance")"
          overview_gross="$(jq '.overview.grossReceived' <<<"$finance")"
          test "$gross" = "$methods"
          test "$gross" = "$kinds"
          test "$gross" = "$overview_gross"

          echo "RECONCILED_GROSS=$gross"
          echo "SALES=$(jq -r '.overview.totalSales' <<<"$finance")"
          echo "PERIOD_DEBT=$(jq -r '.overview.periodDebt' <<<"$finance")"
          echo "CROSS_DATE_COUNT=$(jq -r '.reports.crossDatePaymentOperations | length' <<<"$finance")"
          echo "CROSS_DATE_TOTAL=$(jq -r '[.reports.crossDatePaymentOperations[].amount] | add // 0' <<<"$finance")"

          echo '=== MONEY HISTORY 2026-08-24 ==='
          history="$(curl --fail-with-body -sS "$base/api/finance/money-history?dateFrom=2026-08-24&dateTo=2026-08-24&limit=100")"
          jq '{ok,count,hasMore,summary,eventSample:(.events[:10] | map({externalOrderId,eventDate,eventType,operationLabel,amountDelta,traceCode,traceSeverity,sourceType,sourceId}))}' <<<"$history"
          jq -e '
            .ok == true and
            (.events | type == "array") and
            (.summary.totalIn | type == "number") and
            (.summary.totalOut | type == "number") and
            (.summary.net | type == "number") and
            (all(.events[]; has("eventDate") and has("eventAt") and has("eventType") and has("operationLabel") and has("traceCode") and has("traceSeverity")))
          ' <<<"$history" >/dev/null

          echo '=== CASH REGISTER READ ==='
          cash="$(curl --fail-with-body -sS "$base/api/finance/cash-register")"
          jq '{ok,initialized,autoTrackingEnabled,activatedAt,currentBalance,totalIn,totalOut,todayIn,todayOut,entryCount:(.entries|length)}' <<<"$cash"
          jq -e '.ok == true and (.entries | type == "array")' <<<"$cash" >/dev/null

          echo 'FINANCE_F7_PRODUCTION_READONLY_ACCEPTANCE=PASS'
