name: Fix Catalog Gender Driver Duplicate Anchors

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - .github/workflows/fix-catalog-gender-driver-duplicate-init.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0
      - name: Fix duplicate legacy blocking-label patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-catalog-gender-cleanup-r1.mjs')
          s = p.read_text()
          before = '''replaceOnce('src/features/inventory/views/catalogLegacyAdminModes.tsx',
            "gender: 'пол' } as any)[field]).join(', ')}.",
            "gender: 'пол', genderScope: 'назначение товара по полу' } as any)[field]).join(', ')}.",
          )'''
          after = '''{
            const rel = 'src/features/inventory/views/catalogLegacyAdminModes.tsx'
            const before = "gender: 'пол' } as any)[field]).join(', ')}."
            const after = "gender: 'пол', genderScope: 'назначение товара по полу' } as any)[field]).join(', ')}."
            const source = read(rel)
            const count = source.split(before).length - 1
            if (count !== 2) throw new Error(`Expected two legacy blocking-label maps in ${rel}, got ${count}`)
            write(rel, source.split(before).join(after))
          }'''
          if before not in s:
              raise SystemExit('legacy blocking-label driver block not found')
          p.write_text(s.replace(before, after, 1))
          PY
      - name: Commit driver fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply-catalog-gender-cleanup-r1.mjs
          git commit -m "Fix duplicate legacy gender-scope label patch"
          git push origin HEAD:catalog-gender-cleanup-r1
