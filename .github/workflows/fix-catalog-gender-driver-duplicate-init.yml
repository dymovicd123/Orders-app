name: Fix Catalog Gender Acceptance Test Generator

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - .github/workflows/fix-catalog-gender-driver-duplicate-init.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0
      - name: Fix newline-safe resolver acceptance generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-catalog-gender-cleanup-r1.yml')
          s = p.read_text()
          old = """              \"check(resolver.includes('const enteredGender = normalizeCatalogCombinationGender(item.gender)'), 'Order resolver must respect an explicit human gender')\\\\ncheck(resolver.includes('if (!gender) {\\\\n    const productGenderScope = await getCatalogProductGenderScope'), 'Order resolver may read product scope only for omitted gender')\","""
          new = """              \"check(resolver.includes('const enteredGender = normalizeCatalogCombinationGender(item.gender)'), 'Order resolver must respect an explicit human gender')\\\\ncheck(resolver.includes('if (!gender) {'), 'Order resolver must branch before reading product scope')\\\\ncheck(resolver.includes('const productGenderScope = await getCatalogProductGenderScope(db, product.id)'), 'Order resolver must use product scope only as fallback data')\","""
          if old not in s:
              raise SystemExit('resolver acceptance generator anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit generator fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-catalog-gender-cleanup-r1.yml
          git commit -m "Fix catalog gender acceptance test generation"
          git push origin HEAD:catalog-gender-cleanup-r1
