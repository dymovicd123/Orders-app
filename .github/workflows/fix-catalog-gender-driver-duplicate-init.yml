name: Fix Catalog Gender Product Draft Reset

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - .github/workflows/fix-catalog-gender-driver-duplicate-init.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0
      - name: Add gender scope to post-save draft reset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-catalog-gender-cleanup-r1.mjs')
          s = p.read_text()
          marker = "\nconsole.log('Catalog Gender Scope R1 patch applied.')"
          patch = "\n// App catalog save/reset must keep the product draft shape complete after genderScope is introduced.\nreplaceOnce('src/App.tsx',\n  \"    setCatalogProductDraft({ id: 0, name: '', category: catalogCategoryFilter === 'child' ? 'child' : 'adult' })\",\n  \"    setCatalogProductDraft({ id: 0, name: '', category: catalogCategoryFilter === 'child' ? 'child' : 'adult', genderScope: '' })\",\n)\n"
          if "post-save draft shape complete" in s:
              raise SystemExit('driver already contains App draft reset patch')
          if marker not in s:
              raise SystemExit('driver end marker not found')
          p.write_text(s.replace(marker, patch + marker, 1))
          PY
      - name: Commit driver fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply-catalog-gender-cleanup-r1.mjs
          git commit -m "Fix catalog product draft reset generation"
          git push origin HEAD:catalog-gender-cleanup-r1
