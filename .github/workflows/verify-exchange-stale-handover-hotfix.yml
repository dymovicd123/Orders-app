name: Verify exchange stale handover hotfix

on:
  push:
    branches:
      - safe/exchange-stale-handover-hotfix-20260901
    paths:
      - .github/workflows/verify-exchange-stale-handover-hotfix.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/exchange-stale-handover-hotfix-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply exchange recovery source and regression assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker/domains/returns-exchanges.ts')
          text = p.read_text()
          old_import = "import { resolveCatalogProductAndVariantV2 } from './order-reservations.ts'"
          new_import = "import { fulfillOrderReservationsV2, resolveCatalogProductAndVariantV2 } from './order-reservations.ts'"
          if text.count(old_import) != 1:
              raise SystemExit('reservation import anchor changed')
          text = text.replace(old_import, new_import, 1)
          old_decl = "  const oldItem = await getOrderItemForReturnOrExchange(db, orderId, oldItemId);"
          if text.count(old_decl) != 1:
              raise SystemExit('old item declaration anchor changed')
          text = text.replace(old_decl, "  let oldItem = await getOrderItemForReturnOrExchange(db, orderId, oldItemId);", 1)
          old_guard = "\n".join([
              "  if (!operationContext.baselineCaptured && humanInventoryModelEnabled && !oldItemIsWorkshop && !orderItemWasPhysicallyIssued(oldItem)) {",
              "    throw new Error(`Позиция «${cleanText(oldItem.product_name_snapshot)}» по учёту ещё не была физически выдана / отправлена. До выдачи это не обмен физической вещи — измените состав неотправленного заказа вместо обмена, иначе резерв и остаток разойдутся.`);",
              "  }",
          ])
          new_guard = "\n".join([
              "  const oldItemNeedsHandoverReconciliation = Boolean(",
              "    !operationContext.baselineCaptured && humanInventoryModelEnabled",
              "    && !oldItemIsWorkshop",
              "    && !orderItemWasPhysicallyIssued(oldItem)",
              "  );",
          ])
          if text.count(old_guard) != 1:
              raise SystemExit('old hard handover guard changed')
          text = text.replace(old_guard, new_guard, 1)
          baseline_anchor = "  if (!operationContext.baselineCaptured) {\n    operationContext = {"
          if text.count(baseline_anchor) != 1:
              raise SystemExit('baseline anchor changed')
          reconciliation = "\n".join([
              "  // Emergency exchange recovery: earlier shipping failures could leave a physically issued",
              "  // customer item as an active reservation. Reconcile only this line before accepting it back,",
              "  // so the old outbound and the exchange return are both recorded without double-counting stock.",
              "  if (oldItemNeedsHandoverReconciliation) {",
              "    const handover = await fulfillOrderReservationsV2(",
              "      db,",
              "      orderId,",
              "      cleanText((existing as any).external_id),",
              "      timestamp,",
              "      { orderItemIds: [oldItemId], checkedBy: 'exchange_reconciliation' },",
              "    );",
              "    oldItem = await getOrderItemForReturnOrExchange(db, orderId, oldItemId);",
              "    if (!oldItem || !orderItemWasPhysicallyIssued(oldItem)) {",
              "      const unresolved = Math.max(0, toInt((handover as any)?.unresolved, 0));",
              "      throw new Error(unresolved",
              "        ? `Старая позиция обмена «${cleanText(oldItem?.product_name_snapshot)}» ещё не распознана складом. Сначала разберите эту позицию, чтобы обмен не потерял движение товара.`",
              "        : `Не удалось безопасно восстановить выдачу старой позиции «${cleanText(oldItem?.product_name_snapshot)}». Обмен остановлен без приёма новой вещи.`);",
              "    }",
              "  }",
              "",
          ])
          text = text.replace(baseline_anchor, reconciliation + baseline_anchor, 1)
          p.write_text(text)
          t = Path('scripts/test-phase1c-workshop-return-safety.mjs')
          test = t.read_text()
          marker = "  check(createExchange.includes(\"oldItemIsWorkshop && oldReturnSource === 'boutique'\"), 'Exchange Workshop -> Boutique guard missing')\n"
          if test.count(marker) != 1:
              raise SystemExit('phase1c exchange anchor changed')
          extra = "\n".join([
              "  check(createExchange.includes('oldItemNeedsHandoverReconciliation'), 'Exchange still hard-blocks stale unfulfilled customer handover')",
              "  check(createExchange.includes('fulfillOrderReservationsV2('), 'Exchange does not reconcile the missing old-item outbound movement')",
              "  check(createExchange.includes(\"{ orderItemIds: [oldItemId], checkedBy: 'exchange_reconciliation' }\"), 'Exchange reconciliation is not scoped to the exact old order line')",
              "  const exchangeNewPrecheck = createExchange.indexOf('// Resolve/check a canonical outgoing replacement before the exchange mutates the old item.')",
              "  const exchangeReconcile = createExchange.indexOf('if (oldItemNeedsHandoverReconciliation) {')",
              "  const exchangeBaseline = createExchange.indexOf('if (!operationContext.baselineCaptured) {', exchangeReconcile)",
              "  check(exchangeNewPrecheck >= 0 && exchangeReconcile > exchangeNewPrecheck && exchangeBaseline > exchangeReconcile, 'Exchange stale-handover reconciliation runs before validation or after mutation baseline')",
              "  check(createExchange.includes('oldItem = await getOrderItemForReturnOrExchange(db, orderId, oldItemId)'), 'Exchange does not refresh old item after handover reconciliation')",
              "  check(createExchange.includes('if (!oldItem || !orderItemWasPhysicallyIssued(oldItem))'), 'Exchange can continue after failed stale-handover reconciliation')",
              "",
          ])
          test = test.replace(marker, marker + extra, 1)
          t.write_text(test)
          PY
      - name: Record exact createExchange declaration delta
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          import { execFileSync } from 'node:child_process'
          const digest = value => crypto.createHash('sha256').update(value).digest('hex')
          const declaration = (sourceText, name) => {
            const source = ts.createSourceFile('returns-exchanges.ts', sourceText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            for (const statement of source.statements) {
              if (ts.isFunctionDeclaration(statement) && statement.name?.text === name) return statement.getText(source).replace(/^export\s+/, '')
            }
            throw new Error(`declaration not found: ${name}`)
          }
          const beforeText = execFileSync('git', ['show', 'HEAD:worker/domains/returns-exchanges.ts'], { encoding: 'utf8' })
          const afterText = fs.readFileSync('worker/domains/returns-exchanges.ts', 'utf8')
          const manifest = { version: 1, revision: 'exchange-stale-handover-r1', changes: { createExchange: { before: digest(declaration(beforeText, 'createExchange')), after: digest(declaration(afterText, 'createExchange')) } } }
          fs.writeFileSync('scripts/exchange-stale-handover-worker-manifest.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
      - name: Extend Worker declaration gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-step1906a-worker-modularization.mjs')
          text = p.read_text()
          a1 = "const shippingShortageHotfixPath = path.join(root, 'scripts/shipping-shortage-hotfix-worker-manifest.json')\n"
          if text.count(a1) != 1:
              raise SystemExit('manifest path anchor changed')
          text = text.replace(a1, a1 + "const exchangeStaleHandoverPath = path.join(root, 'scripts/exchange-stale-handover-worker-manifest.json')\n", 1)
          a2 = "  const shippingShortageHotfixChanges = shippingShortageHotfix.changes || {}\n"
          if text.count(a2) != 1:
              raise SystemExit('manifest load anchor changed')
          load = "\n".join([
              a2.rstrip('\n'),
              "  check(fs.existsSync(exchangeStaleHandoverPath), 'Exchange stale-handover Worker manifest missing')",
              "  const exchangeStaleHandover = JSON.parse(fs.readFileSync(exchangeStaleHandoverPath, 'utf8'))",
              "  check(exchangeStaleHandover?.version === 1 && exchangeStaleHandover?.revision === 'exchange-stale-handover-r1', 'Exchange stale-handover Worker manifest invalid')",
              "  const exchangeStaleHandoverChanges = exchangeStaleHandover.changes || {}",
              "",
          ])
          text = text.replace(a2, load, 1)
          old = "\n".join([
              "    const shippingShortageHotfixChanged = shippingShortageHotfixChanges[name]",
              "    if (shippingShortageHotfixChanged) {",
              "      check(shippingShortageHotfixChanged.before === acceptedPostArrivalReliabilityHash, `Shipping shortage hotfix baseline hash mismatch: ${name}`)",
              "      check(sha(declarations.get(name)) === shippingShortageHotfixChanged.after, `Worker declaration changed beyond exact Shipping shortage hotfix allow-list: ${name}`)",
              "    } else {",
              "      check(sha(declarations.get(name)) === acceptedPostArrivalReliabilityHash, `Worker declaration body changed beyond accepted Finance F1-F9 / Phase 1B / Arrival reliability / Shipping shortage deltas: ${name}`)",
              "    }",
          ])
          new = "\n".join([
              "    const shippingShortageHotfixChanged = shippingShortageHotfixChanges[name]",
              "    let acceptedPostShippingShortageHash = acceptedPostArrivalReliabilityHash",
              "    if (shippingShortageHotfixChanged) {",
              "      check(shippingShortageHotfixChanged.before === acceptedPostArrivalReliabilityHash, `Shipping shortage hotfix baseline hash mismatch: ${name}`)",
              "      acceptedPostShippingShortageHash = shippingShortageHotfixChanged.after",
              "    }",
              "    const exchangeStaleHandoverChanged = exchangeStaleHandoverChanges[name]",
              "    if (exchangeStaleHandoverChanged) {",
              "      check(exchangeStaleHandoverChanged.before === acceptedPostShippingShortageHash, `Exchange stale-handover baseline hash mismatch: ${name}`)",
              "      check(sha(declarations.get(name)) === exchangeStaleHandoverChanged.after, `Worker declaration changed beyond exact Exchange stale-handover allow-list: ${name}`)",
              "    } else {",
              "      check(sha(declarations.get(name)) === acceptedPostShippingShortageHash, `Worker declaration body changed beyond accepted Finance F1-F9 / Phase 1B / Arrival reliability / Shipping shortage / Exchange stale-handover deltas: ${name}`)",
              "    }",
          ])
          if text.count(old) != 1:
              raise SystemExit('terminal declaration gate changed')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Verify protected Arrival source unchanged
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD | grep -Ei 'arrival|115B'; then
            echo 'Arrival-related file unexpectedly changed' >&2
            exit 2
          fi
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Commit tested hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-exchange-stale-handover-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover stale handover before customer exchange'
          git push origin HEAD:safe/exchange-stale-handover-hotfix-20260901
