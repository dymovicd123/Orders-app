name: Unisex Gender Correction Preflight Temp

on:
  push:
    branches:
      - catalog-unisex-gender-correction-r1
    paths:
      - .github/workflows/unisex-gender-correction-preflight-temp.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read-only Production preflight
        shell: bash
        run: |
          set -euo pipefail
          q() { local title="$1"; shift; echo; echo "===== $title ====="; npx wrangler d1 execute orders_db_prod --remote --command="$*"; }
          q 'USED_UNISEX_BLANK_WITH_CONCRETE_SIBLINGS' "SELECT p.name, b.id AS blank_id, b.stock_position_id, b.category, b.color, b.size_label, GROUP_CONCAT(s.id || ':' || s.gender) AS siblings FROM catalog_variants b JOIN catalog_products p ON p.id=b.product_id JOIN catalog_variants s ON s.product_id=b.product_id AND s.stock_position_id=b.stock_position_id AND COALESCE(s.category,'adult')=COALESCE(b.category,'adult') AND UPPER(TRIM(COALESCE(s.color,'')))=UPPER(TRIM(COALESCE(b.color,''))) AND TRIM(COALESCE(s.size_label,''))=TRIM(COALESCE(b.size_label,'')) AND s.id<>b.id AND s.is_active=1 AND UPPER(TRIM(COALESCE(s.gender,''))) IN ('ЖЕН','МУЖ') WHERE b.is_active=1 AND p.is_active=1 AND p.gender_scope='unisex' AND TRIM(COALESCE(b.gender,''))='' AND (EXISTS(SELECT 1 FROM inventory_stock x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM order_items x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_movements x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM workshop_tasks x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_reservations x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_lifecycle_events x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_transfer_items x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_stock_checks x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_stocktake_items x WHERE x.variant_id=b.id)) GROUP BY p.name,b.id,b.stock_position_id,b.category,b.color,b.size_label ORDER BY p.name,b.id;"
          q 'USED_UNISEX_BLANK_COUNTS' "SELECT COUNT(*) AS used_blank_count, SUM(CASE WHEN EXISTS(SELECT 1 FROM catalog_variants s WHERE s.product_id=b.product_id AND s.stock_position_id=b.stock_position_id AND COALESCE(s.category,'adult')=COALESCE(b.category,'adult') AND UPPER(TRIM(COALESCE(s.color,'')))=UPPER(TRIM(COALESCE(b.color,''))) AND TRIM(COALESCE(s.size_label,''))=TRIM(COALESCE(b.size_label,'')) AND s.id<>b.id AND s.is_active=1 AND UPPER(TRIM(COALESCE(s.gender,''))) IN ('ЖЕН','МУЖ')) THEN 1 ELSE 0 END) AS with_concrete_sibling FROM catalog_variants b JOIN catalog_products p ON p.id=b.product_id WHERE b.is_active=1 AND p.is_active=1 AND p.gender_scope='unisex' AND TRIM(COALESCE(b.gender,''))='' AND (EXISTS(SELECT 1 FROM inventory_stock x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM order_items x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_movements x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM workshop_tasks x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_reservations x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_lifecycle_events x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_transfer_items x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_stock_checks x WHERE x.variant_id=b.id) OR EXISTS(SELECT 1 FROM inventory_stocktake_items x WHERE x.variant_id=b.id));"
          echo PREFLIGHT_COMPLETE
