name: P0 Branch2 forensic deployment drift and D1 bookmark
on:
  push:
    branches: [ops/p0-branch2-controlled-activation-20261030]
    paths:
      - '.github/workflows/p0-branch2-readonly-preflight-20261030.yml'
permissions:
  contents: read
jobs:
  inspect-only:
    if: github.ref == 'refs/heads/ops/p0-branch2-controlled-activation-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Strict GET-only Worker, version, deployment, native trigger and D1 bookmark inspection
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/p0-branch2-release-preflight-readonly-20261030.mjs
          node scripts/ops/p0-branch2-release-preflight-readonly-20261030.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: branch2-p0-pre-deploy-d1-bookmark
          path: release-proof/branch2-before-p0.json
          retention-days: 7
          if-no-files-found: error
