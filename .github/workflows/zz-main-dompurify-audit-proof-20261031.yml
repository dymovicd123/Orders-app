name: "Main DOMPurify transitive production audit proof (no deploy)"
on:
  push:
    branches: [fix/main-dompurify-production-audit-20261031]
    paths: ['.github/workflows/zz-main-dompurify-audit-proof-20261031.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - name: Replace precisely ONE transitive DOMPurify lock entry with published patched version in EPHEMERAL checkout
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {execFileSync} from 'node:child_process'
          import {readFileSync,writeFileSync} from 'node:fs'
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'))
          const node=lock.packages['node_modules/dompurify']
          assert.equal(node.version,'3.4.15','Unexpected lock baseline; stop')
          const info=JSON.parse(execFileSync('npm',['view','dompurify@3.4.17','version','dist.integrity','dist.tarball','--json'],{encoding:'utf8'}))
          assert.equal(info.version,'3.4.17')
          assert.match(info['dist.tarball'],/^https:\/\/registry\.npmjs\.org\/dompurify\/\-\/dompurify-3\.4\.17\.tgz$/)
          assert.match(info['dist.integrity'],/^sha512-/)
          node.version=info.version
          node.resolved=info['dist.tarball']
          node.integrity=info['dist.integrity']
          writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n')
          console.log('DOMPURIFY_PATCHED_LOCK_METADATA',JSON.stringify({version:node.version,resolved:node.resolved,integrity:node.integrity}))
          NODE
      - name: Repair HIGH-risk development toolchain in EPHEMERAL checkout
        run: |
          npm pkg set 'devDependencies.vite=^8.1.6' 'overrides.undici=7.30.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import assert from 'node:assert/strict'
          const p=JSON.parse(readFileSync('package.json','utf8'))
          const lock=JSON.parse(readFileSync('package-lock.json','utf8'))
          assert.equal(p.overrides.undici,'7.30.1')
          assert.equal(lock.packages['node_modules/dompurify'].version,'3.4.17')
          for(const key of ['dompurify','undici','vite']){
            const x=lock.packages['node_modules/'+key]
            console.log('PATCHED_TOOLCHAIN_PACKAGE',JSON.stringify({key,version:x.version,resolved:x.resolved,integrity:x.integrity}))
          }
          NODE
          git diff --stat -- package.json package-lock.json
      - name: npm ci on exact reproducible patched lock
        run: npm ci
      - name: Real production dependency audit — MUST pass
        run: npm audit --omit=dev --audit-level=moderate
      - name: High-risk dev dependency audit — MUST pass
        run: npm audit --audit-level=high
      - name: Full TypeScript and Vite build
        run: npm run build
      - name: Save ONLY audited dependency manifests back to this candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/main-dompurify-production-audit-20261031"
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fxq package.json
          git diff --name-only | grep -Fxq package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): patch DOMPurify, Undici and Vite without weakening audits'
          git push origin "HEAD:refs/heads/fix/main-dompurify-production-audit-20261031"

