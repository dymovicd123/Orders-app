name: Move pre-August maintenance route under API

on:
  push:
    branches: [main]
    paths: [.github/workflows/move-preaug-maintenance-under-api.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Move one-shot route into Worker-first API namespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/index.ts')
          text=p.read_text()
          old="/__maintenance/preaug-20260831-1fe7c9c45d0b4a2d"
          new="/api/__maintenance/preaug-20260831-1fe7c9c45d0b4a2d"
          if text.count(old) != 1:
              raise SystemExit(f'expected one maintenance path, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - run: npm run release:check
      - name: Commit tested route path fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/move-preaug-maintenance-under-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move pre-August maintenance route under API'
          git push origin HEAD:main
