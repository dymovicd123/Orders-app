name: System cost audit 20260912

on:
  push:
    branches:
      - audit/system-cost-20260912
    paths:
      - .github/workflows/audit-system-cost-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --json
      - name: Full dependency audit
        continue-on-error: true
        run: npm audit --json
      - name: Outdated direct dependencies
        continue-on-error: true
        run: npm outdated --json
