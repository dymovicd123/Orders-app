name: System cost audit 20260912

on:
  push:
    branches:
      - audit/system-cost-20260912
    paths:
      - .github/workflows/audit-system-cost-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read-only Production indexes and cardinalities
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local name="$1"
            local sql="$2"
            local file="/tmp/${name}.sql"
            printf '%s\n' "$sql" > "$file"
            echo "=== ${name} ==="
            npx wrangler d1 execute orders_db_prod --remote --file="$file" --json
          }

          query order_items_indexes "PRAGMA index_list('order_items');"
          query orders_indexes "PRAGMA index_list('orders');"
          query return_items_indexes "PRAGMA index_list('return_items');"
          query returns_indexes "PRAGMA index_list('returns');"
          query lifecycle_indexes "PRAGMA index_list('inventory_lifecycle_events');"
          query workshop_indexes "PRAGMA index_list('workshop_tasks');"

          query order_item_cardinality "SELECT COUNT(*) AS all_order_items, SUM(CASE WHEN NULLIF(TRIM(COALESCE(oi.created_at, '')), '') IS NULL THEN 1 ELSE 0 END) AS missing_item_created_at, SUM(CASE WHEN (oi.product_id IS NULL OR oi.variant_id IS NULL) THEN 1 ELSE 0 END) AS unresolved_identity_rows FROM order_items oi;"

          cat > /tmp/current_operational_unresolved.sql <<'SQL'
          SELECT COUNT(*) AS current_operational_unresolved_rows
          FROM order_items oi
          JOIN orders o ON o.id = oi.order_id
          WHERE oi.quantity > 0
            AND (oi.product_id IS NULL OR oi.variant_id IS NULL)
            AND COALESCE(oi.stock_writeoff_status, '') NOT IN ('catalog_excluded', 'catalog_excluded_history', 'workshop_no_catalog')
            AND COALESCE(o.order_status, 'active') NOT IN ('deleted', 'archived')
            AND COALESCE(o.archived_at, '') = ''
            AND COALESCE((SELECT SUM(ri.quantity) FROM return_items ri JOIN returns r ON r.id = ri.return_id WHERE ri.order_item_id = oi.id AND COALESCE(r.status, 'completed') <> 'cancelled'), 0) < oi.quantity
            AND datetime(COALESCE(NULLIF(oi.created_at, ''), NULLIF(o.created_at, ''), o.order_date || 'T00:00:00Z')) >= datetime('now', '-30 days')
            AND ((COALESCE(oi.is_workshop, 0) = 1 AND oi.product_id IS NULL AND EXISTS (SELECT 1 FROM workshop_tasks wt WHERE wt.order_item_id = oi.id AND wt.quantity > 0 AND wt.status IN ('active', 'ready'))) OR (COALESCE(oi.is_workshop, 0) = 0 AND COALESCE(o.shipping_status, 'not_sent') <> 'sent'))
            AND NOT EXISTS (SELECT 1 FROM inventory_lifecycle_events e WHERE e.status = 'pending' AND e.order_item_id = oi.id);
          SQL
          echo '=== current_operational_unresolved ==='
          npx wrangler d1 execute orders_db_prod --remote --file=/tmp/current_operational_unresolved.sql --json

          query relevant_missing_item_created_at "SELECT COUNT(*) AS relevant_missing_item_created_at FROM order_items oi JOIN orders o ON o.id = oi.order_id WHERE oi.quantity > 0 AND (oi.product_id IS NULL OR oi.variant_id IS NULL) AND NULLIF(TRIM(COALESCE(oi.created_at, '')), '') IS NULL AND COALESCE(o.order_status, 'active') NOT IN ('deleted', 'archived');"

      - name: Read-only Production EXPLAIN exact unresolved catalog count
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/explain_catalog.sql <<'SQL'
          EXPLAIN QUERY PLAN
          SELECT COUNT(*) FROM (
            SELECT 1
            FROM order_items oi
            JOIN orders o ON o.id = oi.order_id
            WHERE oi.quantity > 0
              AND (oi.product_id IS NULL OR oi.variant_id IS NULL)
              AND COALESCE(oi.stock_writeoff_status, '') NOT IN ('catalog_excluded', 'catalog_excluded_history', 'workshop_no_catalog')
              AND COALESCE(o.order_status, 'active') NOT IN ('deleted', 'archived')
              AND COALESCE(o.archived_at, '') = ''
              AND COALESCE((SELECT SUM(ri.quantity) FROM return_items ri JOIN returns r ON r.id = ri.return_id WHERE ri.order_item_id = oi.id AND COALESCE(r.status, 'completed') <> 'cancelled'), 0) < oi.quantity
              AND datetime(COALESCE(NULLIF(oi.created_at, ''), NULLIF(o.created_at, ''), o.order_date || 'T00:00:00Z')) >= datetime('now', '-30 days')
              AND ((COALESCE(oi.is_workshop, 0) = 1 AND oi.product_id IS NULL AND EXISTS (SELECT 1 FROM workshop_tasks wt WHERE wt.order_item_id = oi.id AND wt.quantity > 0 AND wt.status IN ('active', 'ready'))) OR (COALESCE(oi.is_workshop, 0) = 0 AND COALESCE(o.shipping_status, 'not_sent') <> 'sent'))
              AND NOT EXISTS (SELECT 1 FROM inventory_lifecycle_events e WHERE e.status = 'pending' AND e.order_item_id = oi.id)
            GROUP BY UPPER(TRIM(COALESCE(oi.product_name_snapshot, ''))), CASE WHEN UPPER(TRIM(COALESCE(oi.audience_type, ''))) LIKE '%ДЕТ%' OR LOWER(TRIM(COALESCE(oi.audience_type, ''))) = 'child' THEN 'child' ELSE 'adult' END, UPPER(TRIM(COALESCE(oi.gender_snapshot, ''))), UPPER(TRIM(COALESCE(oi.color_snapshot, ''))), CASE WHEN TRIM(COALESCE(oi.material_snapshot, '')) = '' THEN 'СТАНДАРТ' ELSE UPPER(TRIM(oi.material_snapshot)) END, CASE WHEN TRIM(COALESCE(oi.length_snapshot, '')) = '' THEN 'СТАНДАРТ' ELSE UPPER(TRIM(oi.length_snapshot)) END, UPPER(TRIM(COALESCE(oi.size_snapshot, '')))
          );
          SQL
          npx wrangler d1 execute orders_db_prod --remote --file=/tmp/explain_catalog.sql --json
