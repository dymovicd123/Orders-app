name: System cost audit 20260912

on:
  push:
    branches:
      - audit/system-cost-20260912
    paths:
      - .github/workflows/audit-system-cost-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate expensive query sources only
        shell: bash
        run: |
          set -euo pipefail
          for pattern in \
            'earlier_reservable_units' \
            'COALESCE(oi.product_id, 0) <= 0' \
            'COUNT(*) AS count FROM returns WHERE order_id' \
            'COUNT(*) AS count FROM exchanges WHERE order_id' \
            'UPPER(TRIM(name)) = UPPER(TRIM(?))'
          do
            echo "=== $pattern ==="
            grep -RInF --exclude-dir=node_modules --exclude-dir=dist "$pattern" worker src scripts || true
          done
