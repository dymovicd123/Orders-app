name: Stage01 Branch2 R14 apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    name: branch2-r14-migration-apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Hard guard Branch2 target
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "orders-app-branch2"' wrangler.jsonc
          grep -q '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -q '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -q 'orders_db_prod' wrangler.jsonc

      - name: Preflight R14 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS order_items_count FROM order_items; SELECT COUNT(*) AS fts_rows_count FROM order_search_items_fts;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('trg_order_search_items_ai','trg_order_search_items_ad','trg_order_search_items_au','trg_order_search_catalog_products_au','trg_order_search_catalog_variants_au') ORDER BY name;"

      - name: Apply only R14 canonical search migration to Branch2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --file migrations/0070_v72_stage01_canonical_order_search.sql

      - name: Verify R14 after apply
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('trg_order_search_items_ai','trg_order_search_items_ad','trg_order_search_items_au','trg_order_search_catalog_products_au','trg_order_search_catalog_variants_au') ORDER BY name;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS order_items_count FROM order_items; SELECT COUNT(*) AS fts_rows_count FROM order_search_items_fts;"
