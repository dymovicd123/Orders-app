name: One-shot Branch2 editorial stock reports and Russian Word release
# Same demand calculations; more readable finance dashboard and native Russian DOCX exports.
on:
  pull_request:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-warehouse-reports-release-20261110.yml'
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-warehouse-reports-release-20261110.yml'
permissions:
  contents: read
concurrency:
  group: branch2-warehouse-report-release-20261110
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify isolated test Worker and no Production D1 target
        run: node scripts/branch2-manual-release.mjs --check
      - name: Check read-only finance and complete Excel report
        run: |
          npm ci
          node scripts/test-warehouse-capital-readonly-20261110.mjs
          node scripts/test-warehouse-reports-excel-20261110.mjs
          node scripts/test-warehouse-report-documents-20261111.mjs
          node scripts/test-warehouse-reports-navigation-20261111.mjs
      - name: Real Wrangler package preview, no publishing
        run: node scripts/branch2-manual-release.mjs --ci-preview
  release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/branch2' &&
      startsWith(github.event.head_commit.message, 'release(branch2): editorial stock reports docx')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Lock branch, review parent, code and unchanged original Statistics page
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git branch --show-current)" = 'branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '982d9310b02fb6551c26166f4691c4c0a47afc5b'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/branch2-warehouse-reports-release-20261110.yml'
          test "$(git hash-object src/features/inventory/views/InventoryDemandStatistics.tsx)" = 'b491e4e2b4938ca43efdfc9d5836aff77b3cefdf'
          test "$(git hash-object src/features/inventory/views/inventory-demand-statistics.css)" = '867f906165ca1c8c4058c72979178f479769a175'
          test "$(git hash-object worker/domains/warehouse-demand.ts)" = 'e0a35dd872f8d1a7bf5a6aa9c6fe310784993967'
          test "$(git hash-object src/features/inventory/views/WarehouseReportsWorkspace.tsx)" = 'deed1f0ec00959d8d187089f8d0fae2a4180bafd'
          test "$(git hash-object src/features/inventory/views/warehouse-report-workspace.css)" = 'bade69f77b051be619a4d60172c6fbd155c5e8e0'
          test "$(git hash-object src/features/inventory/views/warehouseReportExcel.ts)" = 'aa14d117160e119090ef7ceea874de87175ef20b'
          test "$(git hash-object worker/domains/warehouse-capital.ts)" = '1bf091334396d6230cac1c6eccd121783e7da9d2'
          test "$(git hash-object src/features/inventory/views/warehouseReportDocument.ts)" = '9da777eff3b76b358e03d6afacc65630f99e4b3e'
          test "$(git hash-object src/features/inventory/views/warehouseReportLocale.ts)" = 'b1c540ce28755797cc61977d294b153b6058db95'
          test "$(git hash-object scripts/test-warehouse-report-documents-20261111.mjs)" = '38dfaed3dbd6963a98205606e672dbbdf61ec833'
          test "$(git hash-object src/app/controllers/useOperationalViewModel.ts)" = 'ab5f981c7d10f97b1911d1f061242af3d3d495f5'
          test "$(git hash-object src/App.tsx)" = 'a7ce34ae263e34d6a271c91904dceebc6b1bf967'
          test "$(git hash-object scripts/test-warehouse-reports-navigation-20261111.mjs)" = '92579f4d62d9fe7397caee8cf12da0f2a8e77f8a'
          test "$(git hash-object shared/warehouse-capital-types.ts)" = '08c8ea5f1743b9eebf76666276f2abef4e2004eb'
          test "$(git hash-object src/features/sections/InventorySection.tsx)" = 'c3913995ddf297229c600c1a44a8f3474ffc6ed1'
          test "$(git hash-object src/app/types.ts)" = '1ce8fb8ec368caa60bdf4adc63db2a4ed5f45bf3'
          test "$(git hash-object worker/index.ts)" = 'd806f28af72c73a6d05c6f123c4cb03507c04204'
          test "$(git hash-object .github/workflows/quality-check.yml)" = 'e76c77db57c949ade4a30c48475aa980577b3cf1'
          test "$(git hash-object scripts/test-warehouse-capital-readonly-20261110.mjs)" = '614e820a9222c766381cf3e1e81c7241bec56b4a'
          test "$(git hash-object scripts/test-warehouse-reports-excel-20261110.mjs)" = 'b830e27fda965bbe4589bd3a4a7ef55ad66cdf34'
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/branch2-manual-release.mjs --check
          echo 'BRANCH2_EDITORIAL_WORD_REPORTS_SOURCE_PASS'
      - name: Verify actual Branch2 stock schema SELECT-only
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-warehouse-capital-readonly-20261110.mjs
          node scripts/test-warehouse-reports-excel-20261110.mjs
          node scripts/test-warehouse-report-documents-20261111.mjs
          node scripts/test-warehouse-reports-navigation-20261111.mjs
          schema="$(npx --no-install wrangler d1 execute orders_db_branch2_mirror_20261027 --remote --config wrangler.jsonc --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('inventory_stock','catalog_variants','catalog_products')) AS base_tables, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_execution_prices') AS price_table" --json)"
          printf '%s' "$schema" | jq -e 'if type == "array" then .[0].results[0] else .results[0] end | .base_tables == 3 and (.price_table == 0 or .price_table == 1)'
          echo 'BRANCH2_EDITORIAL_REPORTS_D1_READ_ONLY_PASS'
      - name: Recheck business gate, build and publish ONLY Branch2 Worker
        shell: bash
        run: |
          set -euo pipefail
          node scripts/branch2-manual-release.mjs --publish --sha "$GITHUB_SHA" --confirm BRANCH2-ONLY
      - name: Verify anonymous clients cannot retrieve warehouse financial costs
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            auth="$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' https://orders-app-branch2.orders-clothes.workers.dev/api/auth/status)"
            finance="$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' https://orders-app-branch2.orders-clothes.workers.dev/api/reports/warehouse-capital)"
            if [[ "$auth" == 200 && "$finance" == 401 ]]; then
              echo "BRANCH2_EDITORIAL_REPORTS_PUBLISHED_FINANCE_GUARDED: $GITHUB_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "Unexpected anonymous status: auth=$auth finance=$finance" >&2
          exit 1
