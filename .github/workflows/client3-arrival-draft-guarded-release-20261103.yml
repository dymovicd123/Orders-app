name: Client3 arrival draft reload and review hotfix - guarded release
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-arrival-draft-guarded-release-20261103.yml']

permissions:
  contents: read
  issues: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Guard exact accepted Client3-only source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(git rev-parse HEAD^)" = 8f2c93f6f93eddcf4a650d520b124cb9b8309b5e
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/client3-arrival-draft-guarded-release-20261103.yml'
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci
      - name: Arrival reload, two-tab isolation and 31 SKU regression
        run: node --experimental-strip-types scripts/client3/test-watch-arrival-draft-20261103.mjs
      - name: Order, stock, returns and finance regression
        run: node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
      - name: Team, accounts and shared cash regression
        run: node --experimental-strip-types scripts/client3/test-watch-shared-cash-team-20261103.mjs
      - name: TypeScript and release bundle
        run: npm run build
      - name: Read-only Client3 stock and cash baseline
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM inventory_movements) movements,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries" |
            jq -ce '(if type=="array" then .[0].results[0] else .results[0] end)' > /tmp/arrival-before.json
          cat /tmp/arrival-before.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" |
            jq -e '(if type=="array" then .[0].results else .results end) | length==0'
      - name: Deploy isolated Client3 Worker only, no migrations
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Live smoke, guarded API and D1 integrity
        run: |
          set -euo pipefail
          base='https://orders-app-client3-old-client.orders-clothes.workers.dev'
          test "$(curl -sSL -o /tmp/client3-index -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-index
          for endpoint in '/api/client3/watches/catalog?brand=TAUWACH' \
            '/api/client3/watches/stock/history?brand=TAUWACH'; do
            status="$(curl -sS -o /tmp/client3-api -w '%{http_code}' --max-time 30 "$base$endpoint")"
            test "$status" = 401 -o "$status" = 403
          done
          status="$(curl -sS -o /tmp/client3-write -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"brand":"TAUWACH","source":"office","kind":"arrival","requestId":"noauth-arrival","items":[{"watchVariantId":1,"quantity":500}]}' \
            "$base/api/client3/watches/stock/bulk")"
          test "$status" = 401 -o "$status" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" |
            jq -e '(if type=="array" then .[0].results else .results end) | length==0'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM inventory_movements) movements,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries" |
            jq -ce '(if type=="array" then .[0].results[0] else .results[0] end)' > /tmp/arrival-after.json
          if ! diff -u /tmp/arrival-before.json /tmp/arrival-after.json; then
            echo 'Concurrent customer activity changed counts; no D1 update commands were run by this workflow.'
          fi
          echo CLIENT3_ARRIVAL_DRAFT_AND_REVIEW_RELEASE_SAFE_SUCCESS
      - name: Record confirmed isolated Client3 arrival release
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 arrival reload-persistent drafts + review 100 SKU hotfix DEPLOYED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. PR #781 merged. Two-tab sessionStorage isolation + reload state, 31/101-SKU boundary tests, full SQLite orders/stock, cash/team regressions, TypeScript and build passed. Worker-only release; no migrations, no D1 writes or inventory changes by release. FK/auth smoke PASS. Existing old-tab unsaved numbers could not be preserved before upgrade; client agreed to enter again. Main/Branch2 untouched. Authenticated browser acceptance still pending."
      - name: Report release failure, no false success claim
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 arrival draft hotfix release BLOCKED/FAILED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Check failed step and live deployment before claiming success. Main/Branch2 not targeted."
