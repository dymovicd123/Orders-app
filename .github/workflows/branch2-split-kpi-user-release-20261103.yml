name: Guarded Branch2 Worker promotion (reviewed opt-in only)
# Reuses the previously successful Branch2 isolated release channel.
# No generic auto deploy. Changing this workflow requires a reviewed PR.
on:
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-split-kpi-user-release-20261103.yml'

permissions:
  contents: read
concurrency:
  group: branch2-controlled-worker-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/branch2' && startsWith(github.event.head_commit.message, 'release(branch2):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify explicitly approved exact Branch2 release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git branch --show-current)" = 'branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # PR #814 was fully reviewed. Only this child may be published.
          test "$(git rev-parse HEAD^)" = '7ddb6b54403978cf793e6e9c299668bd214592e5'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/branch2-split-kpi-user-release-20261103.yml'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node scripts/branch2-manual-release.mjs --check
      - name: Publish verified Branch2 Worker only, no D1 writes or migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/branch2-manual-release.mjs --publish --sha "$GITHUB_SHA" --confirm BRANCH2-ONLY
