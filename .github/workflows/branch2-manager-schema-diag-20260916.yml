name: Compare manager schema read-only

on:
  push:
    branches:
      - ops/branch2-manager-seed-20260916
    paths:
      - .github/workflows/branch2-manager-schema-diag-20260916.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Branch2 managers schema
        run: npx wrangler d1 execute orders_db_branch2 --remote --command="SELECT sql FROM sqlite_master WHERE type='table' AND name='managers'; PRAGMA index_list(managers);"
      - name: Production managers schema read-only
        run: npx wrangler d1 execute orders_db_prod --remote --command="SELECT sql FROM sqlite_master WHERE type='table' AND name='managers'; PRAGMA index_list(managers); SELECT id,name,is_active FROM managers ORDER BY id;"
