name: R5.9 implement Orders pagination read budget

on:
  push:
    branches:
      - safe/d1-read-budget-r5-9-orders-pagination-20260904

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply narrowly-scoped R5.9 source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              return text.replace(old, new, 1)

          worker_path = Path('worker/domains/orders-read.ts')
          worker = worker_path.read_text(encoding='utf-8')
          worker = replace_once(worker,
          "  const includePaymentCount = cleanText(url.searchParams.get('includePaymentCount')) !== '0';\n  let aggregateNeedsManagerJoin = false;",
          "  const includePaymentCount = cleanText(url.searchParams.get('includePaymentCount')) !== '0';\n  // R5.9: subsequent UI pages may reuse the period summary already loaded on page 1.\n  // Legacy/API callers keep the exact previous response by default.\n  const includePeriodStats = cleanText(url.searchParams.get('includePeriodStats')) !== '0';\n  const pageCursorDate = cleanText(url.searchParams.get('afterOrderDate'));\n  const pageCursorId = toInt(url.searchParams.get('afterOrderId'), 0);\n  const hasPageCursor = offset > 0 && /^\\d{4}-\\d{2}-\\d{2}$/.test(pageCursorDate) && pageCursorId > 0;\n  let aggregateNeedsManagerJoin = false;",
          'worker params')
          worker = replace_once(worker,
          "  if (dateTo) {\n    orderWhereParts.push('o.order_date <= ?');\n    orderBindings.push(normalizeDate(dateTo));\n  }\n\n  const paymentWhereParts = [...baseWhereParts];",
          "  if (dateTo) {\n    orderWhereParts.push('o.order_date <= ?');\n    orderBindings.push(normalizeDate(dateTo));\n  }\n\n  // R5.9: a cursor is only a page-read accelerator. Aggregate filters stay unchanged so totals\n  // continue to describe the complete selected period/filter, not only the tail after the cursor.\n  const pageWhereParts = [...orderWhereParts];\n  const pageBindings = [...orderBindings];\n  if (hasPageCursor) {\n    pageWhereParts.push('(o.order_date < ? OR (o.order_date = ? AND o.id < ?))');\n    pageBindings.push(pageCursorDate, pageCursorDate, pageCursorId);\n  }\n\n  const paymentWhereParts = [...baseWhereParts];",
          'worker page where')
          worker = replace_once(worker,
          "    ${orderWhereParts.length ? `WHERE ${orderWhereParts.join(' AND ')}` : ''}\n    ORDER BY o.order_date DESC, o.id DESC\n    LIMIT ? OFFSET ?`\n  ).bind(...orderBindings, limit, offset).all<OrderListRow>();",
          "    ${pageWhereParts.length ? `WHERE ${pageWhereParts.join(' AND ')}` : ''}\n    ORDER BY o.order_date DESC, o.id DESC\n    LIMIT ? OFFSET ?`\n  ).bind(...pageBindings, limit, hasPageCursor ? 0 : offset).all<OrderListRow>();",
          'worker page query')
          worker = replace_once(worker,
          "  const completeOrderResult = offset === 0 && orders.length < limit;\n\n  let orderStats: Record<string, unknown> | null = null;\n  if (completeOrderResult) {",
          "  const completeOrderResult = includePeriodStats && offset === 0 && orders.length < limit;\n\n  let orderStats: Record<string, unknown> | null = null;\n  if (!includePeriodStats) {\n    // The UI already owns the exact periodStats from page 1. Only totalCount/hasMore must be\n    // refreshed here. Production proof for August: 2,423 -> 447 rows_read for this summary step.\n    orderStats = await db.prepare(`\n      SELECT COUNT(o.id) AS order_count\n      ${aggregateJoins}\n      ${orderWhereParts.length ? `WHERE ${orderWhereParts.join(' AND ')}` : ''}\n    `).bind(...orderBindings).first<Record<string, unknown>>();\n  } else if (completeOrderResult) {",
          'worker lean count')
          worker = replace_once(worker,
          "  let paymentStats: Record<string, unknown> | null = null;\n  let returnStats: Record<string, unknown> | null = null;\n  if (completeOrderResult) {",
          "  let paymentStats: Record<string, unknown> | null = null;\n  let returnStats: Record<string, unknown> | null = null;\n  if (!includePeriodStats) {\n    // Intentionally skipped: the caller reuses the exact page-1 periodStats.\n  } else if (completeOrderResult) {",
          'worker skip secondary stats')
          old_period = "    periodStats: {\n      orderCount: toInt(orderStats?.order_count, 0),\n      totalAmount: toInt(orderStats?.total_amount, 0),\n      paymentCount: paymentStats?.payment_count == null ? null : toInt(paymentStats.payment_count, 0),\n      paymentAmount: toInt(paymentStats?.payment_amount, 0),\n      debtAmount: toInt(orderStats?.debt_amount, 0),\n      returnCount: toInt(returnStats?.return_count, 0),\n      returnAmount: toInt(returnStats?.return_amount, 0),\n      workshopUnits: toInt(orderStats?.workshop_units, 0),\n    },"
          new_period = "    periodStats: includePeriodStats ? {\n      orderCount: toInt(orderStats?.order_count, 0),\n      totalAmount: toInt(orderStats?.total_amount, 0),\n      paymentCount: paymentStats?.payment_count == null ? null : toInt(paymentStats.payment_count, 0),\n      paymentAmount: toInt(paymentStats?.payment_amount, 0),\n      debtAmount: toInt(orderStats?.debt_amount, 0),\n      returnCount: toInt(returnStats?.return_count, 0),\n      returnAmount: toInt(returnStats?.return_amount, 0),\n      workshopUnits: toInt(orderStats?.workshop_units, 0),\n    } : null,"
          worker = replace_once(worker, old_period, new_period, 'worker period response')
          worker_path.write_text(worker, encoding='utf-8')

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(app,
          "  async function loadDashboard(forceReferences = false, overrideFilters: typeof filters = filters, overrideOffset = orderPageOffset) {",
          "  async function loadDashboard(\n    forceReferences = false,\n    overrideFilters: typeof filters = filters,\n    overrideOffset = orderPageOffset,\n    pageReadOptions: { afterOrderDate?: string; afterOrderId?: number; reusePeriodStats?: boolean } | null = null,\n  ) {",
          'app load signature')
          app = replace_once(app,
          "        includePaymentCount: activeFilters.archiveMode === 'active' && !activeFilters.dateFrom && !activeFilters.dateTo ? '0' : '1',\n      })\n\n      const ordersResponse = await apiFetch(`/api/orders?${params.toString()}`)",
          "        includePaymentCount: activeFilters.archiveMode === 'active' && !activeFilters.dateFrom && !activeFilters.dateTo ? '0' : '1',\n      })\n      // R5.9: the visible pagination remains offset/page based, but sequential Next may provide\n      // the last loaded row as an internal seek cursor. The Worker keeps offset as the logical page.\n      if (overrideOffset > 0 && pageReadOptions?.afterOrderDate && Number(pageReadOptions.afterOrderId || 0) > 0) {\n        params.set('afterOrderDate', pageReadOptions.afterOrderDate)\n        params.set('afterOrderId', String(pageReadOptions.afterOrderId))\n      }\n      // The period summary is invariant while only the page changes. Reuse the exact page-1 value\n      // and ask the Worker for count-only pagination metadata instead of repeating three aggregates.\n      if (pageReadOptions?.reusePeriodStats && orderPeriodStats) params.set('includePeriodStats', '0')\n\n      const ordersResponse = await apiFetch(`/api/orders?${params.toString()}`)",
          'app params')
          app = replace_once(app,
          "      setOrders(nextOrders)\n      setOrderPeriodStats(ordersData.periodStats || null)\n      const nextOffset = Number(ordersData.offset || 0)",
          "      setOrders(nextOrders)\n      if (ordersData.periodStats) {\n        setOrderPeriodStats(ordersData.periodStats)\n      } else if (!pageReadOptions?.reusePeriodStats) {\n        setOrderPeriodStats(null)\n      }\n      const nextOffset = Number(ordersData.offset || 0)",
          'app preserve summary')
          app = replace_once(app,
          "  async function changeOrderPage(direction: 'previous' | 'next') {\n    const step = Math.max(20, Number(orderPageInfo.limit || 100))\n    const nextOffset = direction === 'next'\n      ? orderPageInfo.offset + step\n      : Math.max(0, orderPageInfo.offset - step)\n    if (nextOffset === orderPageInfo.offset) return\n    await loadDashboard(false, filters, nextOffset)\n    window.setTimeout(() => document.getElementById('orders')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0)\n  }",
          "  async function changeOrderPage(direction: 'previous' | 'next') {\n    const step = Math.max(20, Number(orderPageInfo.limit || 100))\n    const nextOffset = direction === 'next'\n      ? orderPageInfo.offset + step\n      : Math.max(0, orderPageInfo.offset - step)\n    if (nextOffset === orderPageInfo.offset) return\n    const lastOrder = direction === 'next' && orders.length ? orders[orders.length - 1] : null\n    await loadDashboard(false, filters, nextOffset, {\n      afterOrderDate: lastOrder?.order_date || '',\n      afterOrderId: Number(lastOrder?.id || 0),\n      reusePeriodStats: true,\n    })\n    window.setTimeout(() => document.getElementById('orders')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0)\n  }",
          'app page navigation')
          app_path.write_text(app, encoding='utf-8')

          test_path = Path('scripts/test-d1-read-budget-r5-9.mjs')
          test_path.write_text("""import fs from 'node:fs'\n\nconst worker = fs.readFileSync('worker/domains/orders-read.ts', 'utf8')\nconst app = fs.readFileSync('src/App.tsx', 'utf8')\nconst fail = (message) => { throw new Error(message) }\nconst check = (condition, message) => { if (!condition) fail(message) }\n\ntry {\n  check(worker.includes(\"const includePeriodStats = cleanText(url.searchParams.get('includePeriodStats')) !== '0';\"), 'R5.9 must keep full periodStats as the default API contract')\n  check(worker.includes(\"const hasPageCursor = offset > 0 && /^\\\\d{4}-\\\\d{2}-\\\\d{2}$/.test(pageCursorDate) && pageCursorId > 0;\"), 'R5.9 cursor must require a logical later page and a valid date/id pair')\n  check(worker.includes(\"pageWhereParts.push('(o.order_date < ? OR (o.order_date = ? AND o.id < ?))');\"), 'R5.9 cursor must preserve order_date DESC, id DESC seek semantics')\n  check(worker.includes('.bind(...pageBindings, limit, hasPageCursor ? 0 : offset).all<OrderListRow>();'), 'R5.9 cursor must not double-apply OFFSET')\n  check(worker.includes('if (!includePeriodStats) {\\n    // The UI already owns the exact periodStats from page 1.'), 'R5.9 page reuse must use count-only summary metadata')\n  check(worker.includes('periodStats: includePeriodStats ? {'), 'R5.9 full summary must remain available to default callers')\n  check(app.includes(\"params.set('afterOrderDate', pageReadOptions.afterOrderDate)\"), 'Orders UI must pass the sequential seek cursor only when available')\n  check(app.includes(\"params.set('includePeriodStats', '0')\"), 'Orders UI must opt out of repeated period aggregates only when it can reuse prior stats')\n  check(app.includes('} else if (!pageReadOptions?.reusePeriodStats) {\\n        setOrderPeriodStats(null)'), 'Orders UI must preserve prior periodStats only for page-only navigation')\n  check(app.includes(\"const lastOrder = direction === 'next' && orders.length ? orders[orders.length - 1] : null\"), 'Only Next navigation may derive a seek cursor from the current last row')\n  console.log('D1 READ BUDGET R5.9 TESTS PASSED — sequential Orders pages use a seek cursor, page-only navigation reuses exact periodStats, and legacy API defaults remain unchanged')\n} catch (error) {\n  console.error(`D1 READ BUDGET R5.9 TESTS FAILED: ${error?.message || error}`)\n  process.exit(1)\n}\n""", encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          release = package['scripts']['release:check']
          anchor = ' && node scripts/test-d1-read-budget-r5-8.mjs'
          if anchor not in release:
              raise SystemExit('package release anchor missing')
          package['scripts']['release:check'] = release.replace(anchor, anchor + ' && node scripts/test-d1-read-budget-r5-9.mjs', 1)
          package['scripts']['test:d1-read-budget-r5-9'] = 'node scripts/test-d1-read-budget-r5-9.mjs'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Focused validation
        run: |
          npm run test:d1-read-budget-r5-9
          npm run typecheck
          npm run build
          npm run verify:db-safety
      - name: Commit implementation to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/orders-read.ts src/App.tsx scripts/test-d1-read-budget-r5-9.mjs package.json
          git diff --cached --check
          git commit -m "R5.9: optimize sequential Orders pagination reads"
          git push origin HEAD:safe/d1-read-budget-r5-9-orders-pagination-20260904
