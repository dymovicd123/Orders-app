name: Finance F5 safety audit patch

on:
  push:
    branches:
      - finance-f5-entry-semantics

permissions:
  contents: write

jobs:
  patch-check-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f5-safe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Finance F5 safety patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-finance-f5-safety-patch.py')
          text = path.read_text(encoding='utf-8')
          insert_after = "def replace_once(path, old, new, label):\n    text = read(path)\n    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected exactly one match, got {count}')\n    write(path, text.replace(old, new, 1))\n\n"
          replacement = insert_after + "\ndef replace_last_once(path, old, new, label):\n    text = read(path)\n    index = text.rfind(old)\n    if index < 0:\n        raise SystemExit(f'{label}: last-match marker not found')\n    write(path, text[:index] + new + text[index + len(old):])\n\n"
          if insert_after not in text:
              raise SystemExit('replace_once helper marker missing')
          text = text.replace(insert_after, replacement, 1)
          marker = "# Preserve unsaved explicit payment rows when the non-money order PATCH succeeds; do not close the editor over them.\nreplace_once("
          if marker not in text:
              raise SystemExit('pending-payment patch marker missing')
          text = text.replace(marker, marker.replace('replace_once(', 'replace_last_once('), 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/tmp-finance-f5-safety-patch.py
          python3 - <<'PY'
          from pathlib import Path

          # Scope the adjacent assertion to the actual PATCH payload, not local draft restoration.
          test_path = Path('scripts/test-finance-f5-adjacent-regression.mjs')
          test = test_path.read_text(encoding='utf-8')
          old = "check(!persistBlock.includes('payments:'), 'Order editor PATCH still sends a payment collection and can trigger rewrite-all')"
          new = "check(!persistBlock.includes('payments: nextDraft.payments.map'), 'Order editor PATCH still sends the full payment collection and can trigger rewrite-all')"
          if old not in test:
              raise SystemExit('adjacent payload assertion marker missing')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')

          # Do not add a new App hook solely for payment-row busy state; reuse the established savingOrder flag.
          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          hook = "  const [editorPaymentSavingIndex, setEditorPaymentSavingIndex] = useState<number | null>(null)\n"
          if hook not in app:
              raise SystemExit('temporary editorPaymentSavingIndex hook missing')
          app = app.replace(hook, '', 1)
          app = app.replace("    if (!editorDraft || !selectedOrder) return\n", "    if (!editorDraft || !selectedOrder || savingOrder) return\n", 1)
          app = app.replace('    setEditorPaymentSavingIndex(index)\n', '    setSavingOrder(true)\n', 1)
          app = app.replace('      setEditorPaymentSavingIndex(null)\n', '      setSavingOrder(false)\n', 1)
          app = app.replace(', editorOpen, editorPaymentSavingIndex, editorReturnSector,', ', editorOpen, editorReturnSector,', 1)

          # The first safety helper used an overly broad replacement range. Restore the neighboring
          # item/debt helpers exactly as they exist in branch2 before handleSelectDebtOrder.
          neighbor_helpers = '''  function addEditorItem() {
            setEditorDraft((current) => current ? { ...current, items: [...current.items, createEmptyEditorItem()] } : current)
          }

          function removeEditorItem(index: number) {
            setEditorDraft((current) => {
              if (!current) return current
              const nextItems = current.items.filter((_, itemIndex) => itemIndex !== index)
              return { ...current, items: nextItems.length ? nextItems : [createEmptyEditorItem()] }
            })
          }

          function updateDebtPayment(index: number, field: keyof EditorPayment, value: string | number) {
            setDebtPayments((current) => current.map((payment, paymentIndex) => (
              paymentIndex === index ? { ...payment, [field]: value, paymentKind: 'debt_close' } : payment
            )))
          }

          function addDebtPayment() {
            setDebtPayments((current) => [...current, createDebtClosePayment()])
          }

          function removeDebtPayment(index: number) {
            setDebtPayments((current) => {
              const next = current.filter((_, paymentIndex) => paymentIndex !== index)
              return next.length ? next : [createDebtClosePayment()]
            })
          }

          '''
          # Normalize heredoc indentation introduced by YAML before inserting TS.
          neighbor_helpers = ''.join(line[10:] if line.startswith('          ') else line for line in neighbor_helpers.splitlines(True))
          handle_marker = '  function handleSelectDebtOrder(orderId: number) {'
          if handle_marker not in app:
              raise SystemExit('handleSelectDebtOrder marker missing')
          for required in ['function addEditorItem()', 'function removeEditorItem(index: number)', 'function updateDebtPayment(', 'function addDebtPayment()', 'function removeDebtPayment(index: number)']:
              if required in app:
                  raise SystemExit(f'neighbor helper unexpectedly survived broad patch: {required}')
          app = app.replace(handle_marker, neighbor_helpers + handle_marker, 1)
          app_path.write_text(app, encoding='utf-8')

          editor_path = Path('src/features/sections/OrderEditorSection.tsx')
          editor = editor_path.read_text(encoding='utf-8')
          editor = editor.replace('    editorPaymentSavingIndex,\n', '', 1)
          editor = editor.replace('disabled={editorPaymentSavingIndex !== null}', 'disabled={savingOrder}')
          editor = editor.replace('disabled={Boolean(payment.id) || editorPaymentSavingIndex === index}', 'disabled={Boolean(payment.id) || savingOrder}')
          editor = editor.replace('disabled={editorPaymentSavingIndex === index}', 'disabled={savingOrder}')
          editor = editor.replace('disabled={savingOrder || editorPaymentSavingIndex !== null}', 'disabled={savingOrder}')
          editor = editor.replace("{editorPaymentSavingIndex === index ? 'Провожу оплату…' : 'Провести оплату'}", "{savingOrder ? 'Провожу оплату…' : 'Провести оплату'}")
          if 'editorPaymentSavingIndex' in editor:
              raise SystemExit('editorPaymentSavingIndex remained in extracted editor')
          editor_path.write_text(editor, encoding='utf-8')

          # OrderRecord.payments is an inline server-read type; expose the id that the API already returns.
          types_path = Path('src/app/types.ts')
          types = types_path.read_text(encoding='utf-8')
          marker = "  payments: Array<{\n    paymentDate: string\n"
          replacement = "  payments: Array<{\n    id?: number\n    paymentDate: string\n"
          if types.count(marker) != 1:
              raise SystemExit(f'OrderRecord payment type marker count: {types.count(marker)}')
          types_path.write_text(types.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified Finance F5 safety
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/app/types.ts src/app/utils.ts src/features/sections/OrderEditorSection.tsx scripts/test-finance-f5-entry-semantics.mjs scripts/test-finance-f5-adjacent-regression.mjs scripts/release-check.mjs
          git commit -m "Harden editor payment isolation and explicit semantics [finance-f5-safe]"
          git push origin HEAD:finance-f5-entry-semantics
