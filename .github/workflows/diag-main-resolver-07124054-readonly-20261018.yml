name: Main resolver exact order SELECT-only diagnostic 20261018
on:
  push:
    branches: ['diag/main-resolver-07124054-readonly-20261018']
    paths: ['.github/workflows/diag-main-resolver-07124054-readonly-20261018.yml']
permissions:
  contents: read
jobs:
  select-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify single fixed PRODUCTION database identity and diagnostic branch (NEVER DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'diag/main-resolver-07124054-readonly-20261018'
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm ci
      - name: SELECT exact order, lines, SKU and reservation facts (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for sql in \
            "SELECT id,name,gender_scope,is_active FROM catalog_products WHERE id IN (1,83)" \
            "SELECT id,product_id,gender,color,material,length,size_label,stock_position_id,is_active FROM catalog_variants WHERE product_id IN (1,83) AND gender='МУЖ' ORDER BY id DESC LIMIT 30" \
            "SELECT id,order_id,product_id,variant_id,stock_writeoff_status,gender_snapshot,color_snapshot,material_snapshot,length_snapshot,size_snapshot,source_type,quantity FROM order_items WHERE id IN (4329,4333)" \
            "SELECT id,order_id,order_item_id,inventory_source,product_id,variant_id,quantity,status,unresolved_reason FROM inventory_reservations WHERE order_item_id IN (4329,4333)" \
            "SELECT product_id,gender_snapshot,stock_writeoff_status,COUNT(*) AS n FROM order_items WHERE product_id IN (1,83) AND gender_snapshot='МУЖ' GROUP BY product_id,gender_snapshot,stock_writeoff_status" \
            "SELECT product_id,material,length,id,is_active FROM catalog_stock_positions WHERE product_id IN(1,83) AND ((product_id=1 AND material='ЗАМША ВЕЛЮР' AND length='СТАНДАРТ') OR (product_id=83 AND material='СТАНДАРТ' AND length='СТАНДАРТ'))" \
            "SELECT id,inventory_source,variant_id,quantity,reserved_quantity FROM inventory_stock WHERE variant_id IN (351,1787) ORDER BY variant_id,inventory_source"
          do
            echo "::group::SELECT-ONLY DIAGNOSTIC"
            npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "$sql" --json | jq -c 'if type=="array" then .[0].results elif type=="object" then . else . end'
            echo "::endgroup::"
          done
