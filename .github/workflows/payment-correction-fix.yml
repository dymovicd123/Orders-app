name: TEMP payment correction type fix

on:
  push:
    branches:
      - order-edit-safe-payment-corrections

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-edit-safe-payment-corrections
          fetch-depth: 0
      - name: Apply type fix
        run: python scripts/_tmp-fix-payment-types.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/_tmp-fix-payment-types.py
          git rm -f .github/workflows/payment-correction-fix.yml
          git add -A
          git commit -m 'Fix payment correction request typing'
          git push origin HEAD:order-edit-safe-payment-corrections
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: node scripts/test-order-edit-payment-method-correction.mjs
      - name: Typecheck
        run: npm run typecheck
