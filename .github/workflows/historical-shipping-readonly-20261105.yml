name: 'Historical order shipment states - production READ ONLY'
on:
  push:
    branches:
      - audit/historical-shipping-readonly-20261105
    paths:
      - scripts/ops/audit-old-order-shipping-readonly-20261105.mjs
      - .github/workflows/historical-shipping-readonly-20261105.yml
permissions:
  contents: read
jobs:
  aggregate-only:
    if: github.ref == 'refs/heads/audit/historical-shipping-readonly-20261105' && startsWith(github.event.head_commit.message, 'audit(old-shipping):')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact production database and no mutation script
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node --check scripts/ops/audit-old-order-shipping-readonly-20261105.mjs
          echo "HISTORICAL_AUDIT_PRODUCTION_READONLY_TARGET_VERIFIED"
      - run: npm ci
      - name: Read production aggregates, never print customer or individual order records
        run: node scripts/ops/audit-old-order-shipping-readonly-20261105.mjs
