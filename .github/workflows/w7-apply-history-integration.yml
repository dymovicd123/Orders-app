name: W7 apply history integration

on:
  push:
    branches:
      - w7-sku-history-price-readiness-audit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[w7-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: w7-sku-history-price-readiness-audit

      - name: Apply guarded W7 delta
        run: python scripts/apply-w7-sku-history-price-readiness.py

      - name: Commit generated W7 files
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "W7: wire exact SKU history [w7-applied]"
          git push origin HEAD:w7-sku-history-price-readiness-audit
