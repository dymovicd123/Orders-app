name: Branch2 Resolver actionable-only contract
on:
  pull_request:
    branches:
      - branch2
    paths:
      - 'worker/index.ts'
      - 'scripts/branch2-resolver-actionable-preserved-gate.mjs'
      - 'scripts/test-branch2-resolver-only-when-actionable-20261022.mjs'
      - 'scripts/branch2-unified-kaspi-preserved-gate.mjs'
      - '.github/workflows/branch2-resolver-actionable-only-20261022.yml'
permissions:
  contents: read
jobs:
  real-sql-matrix-and-historical-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check branch2-only Worker binding
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -Fq 'orders_db_prod' wrangler.jsonc
          ! grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
      - name: Prove Resolver only opens for actionable work using disposable SQLite
        run: node --experimental-strip-types scripts/test-branch2-resolver-only-when-actionable-20261022.mjs
      - name: Validate current candidate and frozen historical release chain
        run: npm run release:check
