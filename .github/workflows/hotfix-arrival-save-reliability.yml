name: Hotfix arrival save reliability

on:
  push:
    branches:
      - safe/arrival-save-reliability-20260829
    paths:
      - .github/workflows/hotfix-arrival-save-reliability.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/arrival-save-reliability-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply arrival commit-boundary fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          text=p.read_text()
          old="      await Promise.all(refreshes)\n      const transferShortage ="
          new="      // Arrival/manual inventory write is already committed once the POST above returned 2xx.\n      // Follow-up reads are best-effort: a failed refresh must never turn a committed arrival\n      // into a red 'operation failed' state that invites the employee to submit it again.\n      await Promise.allSettled(refreshes)\n      const transferShortage ="
          if text.count(old) != 1:
              raise SystemExit(f'Expected one inventory refresh commit boundary, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))

          pkg=Path('package.json')
          text=pkg.read_text()
          old='node scripts/test-phase2-smart-daily-stock.mjs && node scripts/test-stocktake-functional-acceptance.mjs'
          new='node scripts/test-phase2-smart-daily-stock.mjs && node scripts/test-arrival-save-reliability.mjs && node scripts/test-stocktake-functional-acceptance.mjs'
          if old not in text: raise SystemExit('release:check anchor missing')
          pkg.write_text(text.replace(old,new,1))
          PY
          cat > scripts/test-arrival-save-reliability.mjs <<'EOF'
          import fs from 'node:fs'
          import path from 'node:path'
          const root=process.cwd()
          const app=fs.readFileSync(path.join(root,'src/App.tsx'),'utf8')
          const start=app.indexOf('async function saveInventoryMovement')
          if (start < 0) throw new Error('saveInventoryMovement missing')
          const end=app.indexOf('\n  async function ', start + 20)
          const body=app.slice(start, end > start ? end : app.length)
          const check=(value,message)=>{ if(!value) throw new Error(message) }
          check(body.includes("await Promise.allSettled(refreshes)"), 'Committed inventory movement can still fail on a read refresh')
          check(!body.includes("await Promise.all(refreshes)"), 'Old fail-closed post-write refresh remains')
          check(body.indexOf("if (!response.ok) throw new Error") < body.indexOf("Promise.allSettled(refreshes)"), 'Refresh boundary is not after successful mutation response')
          check(body.indexOf("setInventoryManualRequestId(makeCashRequestId('inventory-manual'))") > body.indexOf("Promise.allSettled(refreshes)"), 'Manual request id rotation disappeared')
          check(body.includes('resetInventoryArrivalForm'), 'Arrival reset path disappeared')
          console.log('ARRIVAL SAVE RELIABILITY TESTS PASSED — a committed arrival cannot be reported as failed only because follow-up reads fail')
          EOF
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified hotfix and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hotfix-arrival-save-reliability.yml .github/workflows/diagnose-arrival-observability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx package.json scripts/test-arrival-save-reliability.mjs .github/workflows
          git commit -m 'Fix arrival success boundary after committed write'
          git push origin HEAD:safe/arrival-save-reliability-20260829
