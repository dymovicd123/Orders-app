name: Apply Operational Autonomy R3 Temp

on:
  push:
    branches:
      - operational-autonomy-r3-return-exchange-capacity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operational-autonomy-r3-return-exchange-capacity
          fetch-depth: 0
      - name: Apply focused R3 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('worker/domains/returns-exchanges.ts')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
          """  const existingReturn = await db.prepare(\n    `SELECT id FROM returns\n     WHERE order_id = ? AND COALESCE(status, 'completed') <> 'cancelled'\n     ORDER BY id DESC LIMIT 1`\n  ).bind(orderId).first<{ id: number }>();\n  const operationReturnId = toInt(criticalOperation.row.target_id, 0);\n  if (existingReturn?.id && existingReturn.id !== operationReturnId) {\n    throw new Error('По этому заказу уже оформлен возврат. Сначала отмените его, если он был создан ошибочно.');\n  }\n""",
          """  const operationReturnId = toInt(criticalOperation.row.target_id, 0);\n""",
          'remove global return lock')

          replace_once(
          """    const maxQuantity = Math.max(0, toInt(orderItem.quantity, 0));\n""",
          """    const alreadyReturnedQuantity = await getActiveStandaloneReturnedQuantity(\n      db, orderId, selected.orderItemId, operationReturnId,\n    );\n    const maxQuantity = Math.max(0, toInt(orderItem.quantity, 0) - alreadyReturnedQuantity);\n""",
          'return per-item capacity')

          marker = """export async function hasActiveStandaloneReturn(db: D1Database, orderId: number) {\n"""
          if text.count(marker) != 1:
              raise SystemExit('helper insertion marker missing')
          helper = """export async function getActiveStandaloneReturnedQuantity(\n  db: D1Database,\n  orderId: number,\n  orderItemId: number,\n  excludeReturnId = 0,\n) {\n  if (!orderId || !orderItemId) return 0;\n  const row = await db.prepare(\n    `SELECT COALESCE(SUM(ri.quantity), 0) AS quantity\n     FROM return_items ri\n     JOIN returns r ON r.id = ri.return_id\n     WHERE r.order_id = ?\n       AND ri.order_item_id = ?\n       AND COALESCE(r.status, 'completed') <> 'cancelled'\n       AND ${noStandaloneReturnSql}\n       AND (? = 0 OR r.id <> ?)`\n  ).bind(orderId, orderItemId, excludeReturnId, excludeReturnId).first<{ quantity: number }>();\n  return Math.max(0, toInt(row?.quantity, 0));\n}\n\n\n"""
          text = text.replace(marker, helper + marker, 1)

          replace_once(
          """  if (!operationContext.baselineCaptured && await hasActiveStandaloneReturn(db, orderId)) {\n    throw new Error('По заказу уже оформлен обычный возврат. Сначала отмените возврат, затем оформляйте обмен.');\n  }\n\n""",
          """""",
          'remove return/exchange global lock')

          replace_once(
          """  const availableOldQuantity = operationContext.baselineCaptured\n    ? Math.max(0, toInt(operationContext.availableOldQuantity, 0))\n    : Math.max(0, toInt(oldItem.quantity, 0));\n""",
          """  const rawOldQuantity = operationContext.baselineCaptured\n    ? Math.max(0, toInt(operationContext.rawOldQuantity, toInt(oldItem.quantity, 0)))\n    : Math.max(0, toInt(oldItem.quantity, 0));\n  const activeStandaloneReturnedQuantity = operationContext.baselineCaptured\n    ? Math.max(0, toInt(operationContext.activeStandaloneReturnedQuantity, 0))\n    : await getActiveStandaloneReturnedQuantity(db, orderId, oldItemId);\n  const availableOldQuantity = operationContext.baselineCaptured\n    ? Math.max(0, toInt(operationContext.availableOldQuantity, 0))\n    : Math.max(0, rawOldQuantity - activeStandaloneReturnedQuantity);\n""",
          'exchange per-item capacity')

          replace_once(
          """      availableOldQuantity,\n      availableRefundAmount,\n""",
          """      rawOldQuantity,\n      activeStandaloneReturnedQuantity,\n      availableOldQuantity,\n      availableRefundAmount,\n""",
          'persist exchange quantity baseline')

          replace_once(
          """  const remainingOldQuantity = Math.max(0, Math.max(0, toInt(operationContext.availableOldQuantity, availableOldQuantity)) - oldQuantity);\n""",
          """  // order_items.quantity tracks exchange replacement only. Standalone returns stay in\n  // return_items, so subtracting them here would make the next operation count them twice.\n  const remainingOldQuantity = Math.max(0, rawOldQuantity - oldQuantity);\n""",
          'avoid double subtraction after return then exchange')

          old_cancel = """  const taskSnapshots = await db.prepare(\n    `SELECT workshop_task_id, previous_status, previous_quantity\n     FROM return_workshop_task_reversals\n     WHERE return_id = ?\n     ORDER BY workshop_task_id ASC`\n  ).bind(returnId).all<Record<string, unknown>>();\n\n  for (const snapshot of taskSnapshots.results || []) {\n    await db.prepare(\n      `UPDATE workshop_tasks\n       SET status = ?, quantity = ?, updated_at = ?\n       WHERE id = ? AND order_id = ?`\n    ).bind(\n      normalizeWorkshopTaskStatus(snapshot.previous_status),\n      Math.max(0, toInt(snapshot.previous_quantity, 0)),\n      timestamp,\n      toInt(snapshot.workshop_task_id, 0),\n      toInt(ret.order_id, 0),\n    ).run();\n  }\n"""
          new_cancel = """  const taskSnapshots = await db.prepare(\n    `SELECT rwt.workshop_task_id, rwt.previous_status, rwt.previous_quantity,\n            wt.status AS current_status, wt.quantity AS current_quantity, wt.order_item_id,\n            COALESCE((\n              SELECT SUM(ri.quantity)\n              FROM return_items ri\n              WHERE ri.return_id = ? AND ri.order_item_id = wt.order_item_id\n            ), 0) AS return_quantity\n     FROM return_workshop_task_reversals rwt\n     LEFT JOIN workshop_tasks wt ON wt.id = rwt.workshop_task_id\n     WHERE rwt.return_id = ?\n     ORDER BY rwt.workshop_task_id ASC`\n  ).bind(returnId, returnId).all<Record<string, unknown>>();\n\n  for (const snapshot of taskSnapshots.results || []) {\n    const returnedTaskQuantity = Math.max(0, toInt(snapshot.return_quantity, 0));\n    const currentTaskQuantity = Math.max(0, toInt(snapshot.current_quantity, 0));\n    const fallbackQuantity = Math.max(0, toInt(snapshot.previous_quantity, 0));\n    const nextQuantity = returnedTaskQuantity > 0 ? currentTaskQuantity + returnedTaskQuantity : fallbackQuantity;\n    const currentStatus = normalizeWorkshopTaskStatus(snapshot.current_status || snapshot.previous_status);\n    const nextStatus = returnedTaskQuantity > 0 && currentStatus === 'cancelled' && nextQuantity > 0\n      ? normalizeWorkshopTaskStatus(snapshot.previous_status)\n      : currentStatus;\n    await db.prepare(\n      `UPDATE workshop_tasks\n       SET status = ?, quantity = ?, updated_at = ?\n       WHERE id = ? AND order_id = ?`\n    ).bind(\n      nextStatus,\n      nextQuantity,\n      timestamp,\n      toInt(snapshot.workshop_task_id, 0),\n      toInt(ret.order_id, 0),\n    ).run();\n  }\n"""
          replace_once(old_cancel, new_cancel, 'multi-return workshop cancellation')

          path.write_text(text)

          test_path = Path('scripts/test-operational-autonomy-r3-return-exchange-capacity.mjs')
          test_path.write_text(r'''import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const source = fs.readFileSync('worker/domains/returns-exchanges.ts', 'utf8');

          assert.ok(!source.includes('По этому заказу уже оформлен возврат. Сначала отмените его'), 'global second-return lock must stay removed');
          assert.ok(!source.includes('По заказу уже оформлен обычный возврат. Сначала отмените возврат'), 'global return/exchange lock must stay removed');
          assert.ok(source.includes('getActiveStandaloneReturnedQuantity'), 'shared standalone-return quantity guard is required');
          assert.ok(source.includes("AND COALESCE(r.status, 'completed') <> 'cancelled'"), 'cancelled returns must not consume capacity');
          assert.ok(source.includes('AND ${noStandaloneReturnSql}'), 'exchange-linked refund rows must not be counted again as standalone returns');
          assert.ok(source.includes('selected.orderItemId, operationReturnId'), 'return retry must exclude its own return from consumed quantity');
          assert.ok(source.includes('toInt(orderItem.quantity, 0) - alreadyReturnedQuantity'), 'new return must use remaining item quantity');
          assert.ok(source.includes('rawOldQuantity - activeStandaloneReturnedQuantity'), 'exchange must respect prior standalone returns');
          assert.ok(source.includes('const remainingOldQuantity = Math.max(0, rawOldQuantity - oldQuantity);'), 'exchange must not double-subtract prior returns from order_items.quantity');
          assert.ok(source.includes('currentTaskQuantity + returnedTaskQuantity'), 'cancelling one workshop return must add back only that return instead of erasing later operations');

          console.log('Operational Autonomy R3 return/exchange capacity checks passed.');
          ''')

          package_path = Path('package.json')
          package_data = json.loads(package_path.read_text())
          test_cmd = 'node scripts/test-operational-autonomy-r3-return-exchange-capacity.mjs'
          release = package_data['scripts']['release:check']
          if test_cmd not in release:
              package_data['scripts']['release:check'] = release + ' && ' + test_cmd
          package_path.write_text(json.dumps(package_data, ensure_ascii=False, indent=2) + '\n')

          audit_path = Path('docs/continuation/OPERATIONAL_AUTONOMY_AUDIT_20260910.md')
          audit = audit_path.read_text()
          audit = audit.replace(
              '## Remaining business-autonomy gaps found in current main\n',
              '## Remaining business-autonomy gaps found in current main\n\n> R3 update: A1+A2 are implemented on the current R3 branch with per-order-item remaining quantity. Active standalone returns consume capacity; cancelled returns release it; exchange-linked financial return rows are not double-counted; exchanges consume the same remaining capacity without rewriting prior return history.\n',
              1,
          )
          audit_path.write_text(audit)
          PY

          node scripts/test-operational-autonomy-r3-return-exchange-capacity.mjs
          rm .github/workflows/apply-operational-autonomy-r3-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/returns-exchanges.ts scripts/test-operational-autonomy-r3-return-exchange-capacity.mjs package.json docs/continuation/OPERATIONAL_AUTONOMY_AUDIT_20260910.md .github/workflows/apply-operational-autonomy-r3-temp.yml
          git commit -m "Allow independent returns and exchanges by item capacity"
          git push origin HEAD:operational-autonomy-r3-return-exchange-capacity
