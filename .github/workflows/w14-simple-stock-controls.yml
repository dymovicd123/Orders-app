name: W14 Simple Stock Controls
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'src/features/inventory/stockOverviewSelectors.ts'
      - 'src/features/inventory/views/renderInventoryOverviewPanel.tsx'
      - 'src/features/sections/InventorySection.tsx'
      - 'src/styles/w14-simple-stock-controls.css'
      - 'scripts/test-w14-simple-stock-controls.mjs'
      - '.github/workflows/w14-simple-stock-controls.yml'
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/w14-simple-stock-controls.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Stock controls and source invariant tests
        run: |
          node --experimental-strip-types scripts/test-w14-simple-stock-controls.mjs
          node --experimental-strip-types scripts/test-w13-stock-catalog-browse.mjs
          node scripts/test-w12-stock-overview.mjs
      - name: Existing operations and SQLite correction checks
        run: |
          node --experimental-strip-types scripts/test-w11-manual-correction-runtime.mjs
          node scripts/test-step191d-transfer-runtime-safety.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
      - name: Full application and Worker build
        run: npm run build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/branch2'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify W14 scope and isolated branch2 database
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "branch2"
          baseline="5edaf2c09fd9bfc9afcf2d69022aeec4d5ffe7c2"
          git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"
          changes="$(git diff --name-only "$baseline" "$GITHUB_SHA")"
          test -n "$changes"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              src/features/inventory/stockOverviewSelectors.ts|\
              src/features/inventory/views/renderInventoryOverviewPanel.tsx|\
              src/features/sections/InventorySection.tsx|\
              src/styles/w14-simple-stock-controls.css|\
              scripts/test-w14-simple-stock-controls.mjs|\
              .github/workflows/w14-simple-stock-controls.yml) ;;
              *) echo "W14 release rejected unreviewed file: $file" >&2;exit 11 ;;
            esac
          done <<< "$changes"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Eq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc;then exit 12;fi
          if grep -Eq '^(worker/|migrations/|wrangler.jsonc|package.*json)' <<< "$changes";then exit 13;fi
      - run: npm ci
      - name: Safe stock controls, regression and full build
        run: |
          node --experimental-strip-types scripts/test-w14-simple-stock-controls.mjs
          node scripts/test-w12-stock-overview.mjs
          node --experimental-strip-types scripts/test-w11-manual-correction-runtime.mjs
          npm run build
      - name: Confirm new simple model search compiled
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const files=fs.readdirSync('dist/client/assets')
          if(!files.some(file=>file.endsWith('.js') && fs.readFileSync('dist/client/assets/'+file,'utf8').includes('stock-v14-master-controls')))throw Error('W14 stock controls are absent from compiled bundle')
          console.log('W14_CONTROLS_COMPILED')
          NODE
      - name: Deploy only branch2 Worker, without migrations
        run: npx wrangler deploy
      - name: Verify live entry and stock module
        run: |
          node --input-type=module <<'NODE'
          const host='https://orders-app-branch2.orders-clothes.workers.dev'
          let verified=false
          for(let attempt=0;attempt<7;attempt++){
            try {
              const index=await fetch(host+'/?w14='+Date.now(),{cache:'no-store'})
              if(!index.ok)throw Error('Index status '+index.status)
              const html=await index.text()
              const asset=html.match(/src=["'](\/assets\/index-[^"']+\.js)["']/)
              if(!asset)throw Error('Index asset missing')
              const entry=await (await fetch(host+asset[1],{cache:'no-store'})).text()
              const chunk=entry.match(/InventorySection-[A-Za-z0-9_-]+\.js/)
              if(!chunk)throw Error('Stock chunk not referenced')
              const bundle=await (await fetch(host+'/assets/'+chunk[0],{cache:'no-store'})).text()
              if(!bundle.includes('stock-v14-master-controls'))throw Error('Deployed stock module is stale')
              console.log('W14_BRANCH2_LIVE')
              verified=true;break
            } catch(err) {
              console.warn(String(err))
              if(attempt<6)await new Promise(resolve=>setTimeout(resolve,3500))
            }
          }
          if(!verified)throw Error('Updated stock UI could not be verified live')
          NODE
