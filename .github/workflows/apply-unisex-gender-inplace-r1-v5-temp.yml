name: Apply Unisex Gender Inplace R1 V5 Temp

on:
  push:
    branches:
      - catalog-unisex-gender-correction-r1
    paths:
      - .github/workflows/apply-unisex-gender-inplace-r1-v5-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-unisex-gender-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply narrow source patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import pathlib, textwrap
          text = pathlib.Path('.github/workflows/apply-unisex-gender-inplace-r1-v2-temp.yml').read_text()
          code = text.split("node --input-type=module <<'NODE'\n",1)[1].split('\n          NODE',1)[0]
          pathlib.Path('.tmp-apply-unisex.mjs').write_text(textwrap.dedent(code))
          PY
          node ./.tmp-apply-unisex.mjs
          rm .tmp-apply-unisex.mjs
      - name: Build exact Worker and frontend delta layers
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          import { execFileSync } from 'node:child_process'
          const replaceOnce=(text,before,after,label)=>{const n=text.split(before).length-1;if(n!==1)throw new Error(`${label} anchor ${n}`);return text.replace(before,after)}
          const sha256=value=>crypto.createHash('sha256').update(value).digest('hex')
          const gitBlob=value=>{const bytes=Buffer.from(value);return crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex')}
          const workerFile='worker/domains/catalog.ts'
          function declaration(source,name){const sf=ts.createSourceFile(workerFile,source,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);for(const s of sf.statements){if(ts.isFunctionDeclaration(s)&&s.name?.text===name)return s.getText(sf).replace(/^export\s+/,'')}throw new Error(`missing ${name}`)}
          const beforeWorker=execFileSync('git',['show',`origin/main:${workerFile}`],{encoding:'utf8'})
          const afterWorker=fs.readFileSync(workerFile,'utf8')
          fs.writeFileSync('scripts/catalog-unisex-gender-inplace-r1-worker-manifest.json',JSON.stringify({version:1,revision:'catalog-unisex-gender-inplace-r1',changes:{updateCatalogVariant:{before:sha256(declaration(beforeWorker,'updateCatalogVariant')),after:sha256(declaration(afterWorker,'updateCatalogVariant'))}}},null,2)+'\n')

          const uiFile='src/features/inventory/views/renderInventoryCatalogPanel.tsx'
          const beforeUi=execFileSync('git',['show',`origin/main:${uiFile}`],{encoding:'utf8'})
          const afterUi=fs.readFileSync(uiFile,'utf8')
          const frontendManifest={version:1,revision:'catalog-unisex-gender-inplace-r1',files:{[uiFile]:{beforeGitBlob:gitBlob(beforeUi),afterGitBlob:gitBlob(afterUi),beforeLines:beforeUi.split(/\r?\n/).length,afterLines:afterUi.split(/\r?\n/).length}}}
          fs.writeFileSync('scripts/catalog-unisex-gender-inplace-r1-frontend-manifest.json',JSON.stringify(frontendManifest,null,2)+'\n')

          const gatePath='scripts/test-step1906b-frontend-modularization.mjs'
          let gate=fs.readFileSync(gatePath,'utf8')
          gate=replaceOnce(gate,
            "const manifestPath = path.join(root, 'scripts/catalog-gender-scope-r1-frontend-manifest.json')\n",
            "const manifestPath = path.join(root, 'scripts/catalog-gender-scope-r1-frontend-manifest.json')\nconst unisexGenderInplaceManifestPath = path.join(root, 'scripts/catalog-unisex-gender-inplace-r1-frontend-manifest.json')\n",
            'frontend manifest path')
          gate=replaceOnce(gate,
            "if (JSON.stringify(Object.keys(manifest.files || {})) !== JSON.stringify(expectedFiles)) throw new Error('Catalog gender scope frontend allow-list widened unexpectedly')\nconst gitBlobSha",
            "if (JSON.stringify(Object.keys(manifest.files || {})) !== JSON.stringify(expectedFiles)) throw new Error('Catalog gender scope frontend allow-list widened unexpectedly')\nconst unisexGenderInplaceManifest = JSON.parse(fs.readFileSync(unisexGenderInplaceManifestPath, 'utf8'))\nif (unisexGenderInplaceManifest?.version !== 1 || unisexGenderInplaceManifest?.revision !== 'catalog-unisex-gender-inplace-r1') throw new Error('Catalog unisex gender in-place frontend manifest invalid')\nif (Object.keys(unisexGenderInplaceManifest.files || {}).join(',') !== 'src/features/inventory/views/renderInventoryCatalogPanel.tsx') throw new Error('Catalog unisex gender in-place frontend allow-list widened unexpectedly')\nconst gitBlobSha",
            'frontend manifest load')
          const oldChecks="    const delta = manifest.files[file]\n    if (gitBlobSha(actual) !== delta.afterGitBlob) throw new Error('Catalog gender frontend file changed beyond exact manifest: ' + file)\n    if (gitBlobSha(baseline) !== delta.beforeGitBlob) throw new Error('Catalog gender frontend baseline drifted: ' + file)\n    if (actual.split(/\\r?\\n/).length !== delta.afterLines || baseline.split(/\\r?\\n/).length !== delta.beforeLines) throw new Error('Catalog gender frontend line contract drifted: ' + file)\n"
          const newChecks="    const delta = manifest.files[file]\n    const latestDelta = unisexGenderInplaceManifest.files?.[file]\n    if (latestDelta) {\n      if (latestDelta.beforeGitBlob !== delta.afterGitBlob || latestDelta.beforeLines !== delta.afterLines) throw new Error('Catalog unisex gender in-place predecessor drifted: ' + file)\n      if (gitBlobSha(actual) !== latestDelta.afterGitBlob || actual.split(/\\r?\\n/).length !== latestDelta.afterLines) throw new Error('Catalog unisex gender in-place frontend file changed beyond exact manifest: ' + file)\n    } else if (gitBlobSha(actual) !== delta.afterGitBlob || actual.split(/\\r?\\n/).length !== delta.afterLines) {\n      throw new Error('Catalog gender frontend file changed beyond exact manifest: ' + file)\n    }\n    if (gitBlobSha(baseline) !== delta.beforeGitBlob) throw new Error('Catalog gender frontend baseline drifted: ' + file)\n    if (baseline.split(/\\r?\\n/).length !== delta.beforeLines) throw new Error('Catalog gender frontend baseline line contract drifted: ' + file)\n"
          gate=replaceOnce(gate,oldChecks,newChecks,'frontend current checks')
          fs.writeFileSync(gatePath,gate)
          NODE
      - name: Validate full release gate and build
        run: |
          node scripts/test-catalog-unisex-gender-inplace-r1.mjs
          npm run release:check
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/catalog.ts src/features/inventory/views/renderInventoryCatalogPanel.tsx scripts/test-catalog-unisex-gender-inplace-r1.mjs scripts/catalog-unisex-gender-inplace-r1-worker-manifest.json scripts/catalog-unisex-gender-inplace-r1-frontend-manifest.json scripts/test-step1906a-worker-modularization-w6-layer.mjs scripts/test-step1906b-frontend-modularization.mjs package.json
          git commit -m "Allow safe used unisex gender correction"
          git push origin HEAD:catalog-unisex-gender-correction-r1
