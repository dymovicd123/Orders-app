name: TEMP apply payment correction patch

on:
  push:
    branches:
      - order-edit-safe-payment-corrections

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: order-edit-safe-payment-corrections
          fetch-depth: 0
      - name: Apply targeted patch
        run: python scripts/_tmp-apply-payment-correction.py
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f _tmp-payment-correction-forensic.txt scripts/_tmp-apply-payment-correction.py
          git rm -f .github/workflows/payment-correction-forensic.yml
          git add -A
          git commit -m 'Fix safe correction of posted order payments'
          git push origin HEAD:order-edit-safe-payment-corrections
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: node scripts/test-order-edit-payment-method-correction.mjs
      - name: Typecheck
        run: npm run typecheck
