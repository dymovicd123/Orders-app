name: D1 read budget R5.5 workshop resolver benchmark

on:
  push:
    branches: [safe/d1-read-budget-r5-5-profile-20260903]
    paths:
      - scripts/.d1-read-budget-r5-5-workshop-resolver-trigger

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_DB_UUID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      PROD_DB_NAME: orders_db_prod
    steps:
      - uses: actions/checkout@v4
      - name: Compare current workshop resolver and pre-ranked candidate on Production — read only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const uuid = process.env.PROD_DB_UUID
          const expectedName = process.env.PROD_DB_NAME
          if (!accountId || !token || !uuid || !expectedName) throw new Error('Missing required environment')
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }

          async function dbInfo() {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${uuid}`, { headers })
            const payload = await response.json()
            if (!response.ok || !payload?.success) throw new Error(`D1 identity read failed: HTTP ${response.status}`)
            return payload.result
          }
          async function query(sql) {
            const normalized = String(sql).trim().replace(/^EXPLAIN\s+QUERY\s+PLAN\s+/i, '').trim()
            if (!/^(SELECT|WITH|PRAGMA\s+index_(list|info))\b/i.test(normalized)) throw new Error('Only diagnostic reads are permitted')
            if (/\b(INSERT|UPDATE|DELETE|REPLACE|CREATE|DROP|ALTER|VACUUM|REINDEX|ANALYZE)\b/i.test(normalized)) throw new Error('Mutation SQL rejected')
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${uuid}/query`, {
              method: 'POST', headers, body: JSON.stringify({ sql, params: [] }),
            })
            const payload = await response.json()
            if (!response.ok || !payload?.success) {
              const message = payload?.errors?.map(e => e?.message).filter(Boolean).join('; ') || `HTTP ${response.status}`
              throw new Error(message)
            }
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result
            const rowsWritten = Number(result?.meta?.rows_written ?? result?.meta?.rowsWritten ?? 0)
            if (rowsWritten !== 0) throw new Error(`Unexpected rows written: ${rowsWritten}`)
            return { rows: Array.isArray(result?.results) ? result.results : [], rowsRead: Number(result?.meta?.rows_read ?? result?.meta?.rowsRead ?? 0), duration: Number(result?.meta?.duration ?? 0) }
          }

          const info = await dbInfo()
          if (String(info?.name || '') !== expectedName || String(info?.uuid || info?.id || uuid) !== uuid) throw new Error('Production identity mismatch')
          console.log(`PRODUCTION_IDENTITY_OK name=${expectedName} uuid=${uuid}`)

          const indexList = await query(`PRAGMA index_list('catalog_variants')`)
          console.log('CATALOG_VARIANTS_INDEXES', JSON.stringify(indexList.rows))
          for (const row of indexList.rows) {
            const name = String(row.name || '')
            if (!name) continue
            const safeName = name.replace(/'/g, "''")
            const infoRows = await query(`PRAGMA index_info('${safeName}')`)
            console.log(`INDEX_INFO ${name}`, JSON.stringify(infoRows.rows))
          }

          const sample = await query(`
            SELECT DISTINCT wt.order_item_id AS id
            FROM workshop_tasks wt
            JOIN order_items oi ON oi.id = wt.order_item_id
            JOIN orders o ON o.id = wt.order_id
            WHERE wt.order_item_id IS NOT NULL
              AND COALESCE(oi.quantity, 0) > 0
              AND o.order_status NOT IN ('deleted', 'archived')
            ORDER BY wt.order_item_id DESC
            LIMIT 80
          `)
          const allIds = sample.rows.map(r => Number(r.id)).filter(Number.isFinite)
          if (!allIds.length) throw new Error('No representative linked workshop items found')
          console.log(`WORKSHOP_SAMPLE count=${allIds.length} rows_read=${sample.rowsRead}`)
          const idList = ids => ids.join(',')

          const projection = alias => `
             ${alias}.id,
             ${alias}.order_id,
             ${alias}.product_id,
             COALESCE(${alias}.variant_id, cv_fallback.id) AS resolved_variant_id,
             ${alias}.product_name_snapshot,
             COALESCE(NULLIF(${alias}.gender_snapshot, ''), NULLIF(cv_direct.gender, ''), NULLIF(cv_fallback.gender, '')) AS resolved_gender,
             COALESCE(NULLIF(${alias}.color_snapshot, ''), NULLIF(cv_direct.color, ''), NULLIF(cv_fallback.color, '')) AS resolved_color,
             COALESCE(NULLIF(${alias}.material_snapshot, ''), NULLIF(cv_direct.material, ''), NULLIF(cv_fallback.material, '')) AS resolved_material,
             COALESCE(NULLIF(${alias}.length_snapshot, ''), NULLIF(cv_direct.length, ''), NULLIF(cv_fallback.length, '')) AS resolved_length,
             COALESCE(NULLIF(${alias}.size_snapshot, ''), NULLIF(cv_direct.size_label, ''), NULLIF(cv_fallback.size_label, '')) AS resolved_size,
             CASE WHEN LOWER(COALESCE(NULLIF(${alias}.audience_type, ''), NULLIF(cv_direct.category, ''), NULLIF(cv_fallback.category, ''))) = 'child'
                    OR UPPER(COALESCE(NULLIF(${alias}.audience_type, ''), '')) LIKE '%ДЕТ%'
                  THEN 'ДЕТСКИЙ' ELSE 'ВЗРОСЛЫЙ' END AS resolved_audience_type,
             ${alias}.quantity,
             ${alias}.is_workshop,
             ${alias}.source_type,
             ${alias}.stock_writeoff_status`

          function baseline(ids) {
            return `SELECT ${projection('oi')}
              FROM order_items oi
              LEFT JOIN catalog_variants cv_direct ON cv_direct.id = oi.variant_id
              LEFT JOIN catalog_variants cv_fallback ON cv_fallback.id = (
                SELECT cv2.id
                FROM catalog_variants cv2
                WHERE oi.variant_id IS NULL
                  AND cv2.product_id = oi.product_id
                  AND (NULLIF(TRIM(COALESCE(oi.color_snapshot, '')), '') IS NULL OR UPPER(TRIM(COALESCE(cv2.color, ''))) = UPPER(TRIM(COALESCE(oi.color_snapshot, ''))))
                  AND (NULLIF(TRIM(COALESCE(oi.size_snapshot, '')), '') IS NULL OR UPPER(TRIM(COALESCE(cv2.size_label, ''))) = UPPER(TRIM(COALESCE(oi.size_snapshot, ''))))
                ORDER BY cv2.is_active DESC, cv2.sort_order ASC, cv2.id ASC
                LIMIT 1
              )
              WHERE oi.id IN (${idList(ids)}) AND COALESCE(oi.quantity, 0) > 0`
          }

          function ranked(ids) {
            return `WITH target_items AS MATERIALIZED (
                SELECT oi.* FROM order_items oi
                WHERE oi.id IN (${idList(ids)}) AND COALESCE(oi.quantity, 0) > 0
              ),
              fallback_candidates AS MATERIALIZED (
                SELECT ti.id AS item_id, cv2.id AS variant_id,
                       ROW_NUMBER() OVER (PARTITION BY ti.id ORDER BY cv2.is_active DESC, cv2.sort_order ASC, cv2.id ASC) AS rn
                FROM target_items ti
                JOIN catalog_variants cv2
                  ON ti.variant_id IS NULL
                 AND cv2.product_id = ti.product_id
                 AND (NULLIF(TRIM(COALESCE(ti.color_snapshot, '')), '') IS NULL OR UPPER(TRIM(COALESCE(cv2.color, ''))) = UPPER(TRIM(COALESCE(ti.color_snapshot, ''))))
                 AND (NULLIF(TRIM(COALESCE(ti.size_snapshot, '')), '') IS NULL OR UPPER(TRIM(COALESCE(cv2.size_label, ''))) = UPPER(TRIM(COALESCE(ti.size_snapshot, ''))))
              )
              SELECT ${projection('ti')}
              FROM target_items ti
              LEFT JOIN catalog_variants cv_direct ON cv_direct.id = ti.variant_id
              LEFT JOIN fallback_candidates fc ON fc.item_id = ti.id AND fc.rn = 1
              LEFT JOIN catalog_variants cv_fallback ON cv_fallback.id = fc.variant_id`
          }

          function canon(rows) {
            return rows.map(row => ({...row, id: Number(row.id), order_id: Number(row.order_id), product_id: row.product_id == null ? null : Number(row.product_id), resolved_variant_id: row.resolved_variant_id == null ? null : Number(row.resolved_variant_id), quantity: Number(row.quantity), is_workshop: Number(row.is_workshop)}))
              .sort((a,b) => a.id - b.id)
          }
          const same = (a,b) => JSON.stringify(canon(a)) === JSON.stringify(canon(b))
          const sizes = [...new Set([1, 10, 30, 60, allIds.length].filter(n => n <= allIds.length))]
          for (const size of sizes) {
            const ids = allIds.slice(0, size)
            const current = await query(baseline(ids))
            const next = await query(ranked(ids))
            if (!same(current.rows, next.rows)) {
              console.error('BASELINE_SAMPLE', JSON.stringify(canon(current.rows).slice(0,5)))
              console.error('CANDIDATE_SAMPLE', JSON.stringify(canon(next.rows).slice(0,5)))
              throw new Error(`Candidate changed workshop resolver truth at size=${size}`)
            }
            console.log(`SIZE=${size} EQUIVALENT rows=${current.rows.length}`)
            console.log(`SIZE=${size} BASELINE rows_read=${current.rowsRead} duration_ms=${current.duration}`)
            console.log(`SIZE=${size} RANKED rows_read=${next.rowsRead} duration_ms=${next.duration} ratio=${current.rowsRead ? (next.rowsRead/current.rowsRead).toFixed(4) : 'n/a'}`)
          }

          const planIds = allIds.slice(0, Math.min(30, allIds.length))
          for (const [label, sql] of [['BASELINE', baseline(planIds)], ['RANKED', ranked(planIds)]]) {
            const plan = await query(`EXPLAIN QUERY PLAN ${sql}`)
            console.log(`${label}_PLAN_BEGIN`)
            for (const row of plan.rows) console.log(String(row.detail || JSON.stringify(row)))
            console.log(`${label}_PLAN_END`)
          }
          NODE
