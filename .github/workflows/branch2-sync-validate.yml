name: Branch2 Sync Validate

on:
  push:
    branches: [safe/branch2-sync-r3-20260902]
    paths:
      - scripts/.branch2-sync-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/branch2-sync-r3-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Branch2 environment on exact current main source
        run: |
          python3 scripts/apply-branch2-sync-environment.py
          node scripts/register-branch2-environment-worker.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Database safety gate
        run: npm run verify:db-safety
      - name: Clean Branch2 production build
        run: |
          rm -rf dist
          npm run build
      - name: Branch2 Wrangler dry-run and binding guard
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run 2>&1 | tee /tmp/branch2-dry-run.txt
          grep -F 'orders_db_branch2' /tmp/branch2-dry-run.txt
          if grep -F 'orders_db_prod' /tmp/branch2-dry-run.txt; then
            echo 'Primary D1 binding leaked into Branch2 dry-run' >&2
            exit 1
          fi
      - name: Commit validated Branch2 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc index.html worker/domains/auth.ts package.json scripts/test-branch2-environment.mjs scripts/branch2-environment-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          if git diff --cached --quiet; then
            echo 'No Branch2 environment changes to commit'
          else
            git commit -m 'Sync Branch2 to current R3 main'
            git push origin HEAD:safe/branch2-sync-r3-20260902
          fi
