name: Audit production Kaspi sent-payment candidates (SELECT only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/audit-main-kaspi-sent-payments-20261018.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/audit-main-kaspi-sent-payments-20261018.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify isolated production D1 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
          ! grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - run: npm ci
      - name: Read-only Kaspi order counts, shipping and ledger differences
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          WITH kaspi AS (
            SELECT o.id,
              COALESCE(o.order_status,'active') AS status,
              COALESCE(o.shipping_status,'not_sent') AS shipping,
              MAX(0,COALESCE(o.total_amount,0)) AS total,
              MAX(0,COALESCE(o.received_amount,0)) AS recorded_received,
              MAX(0,COALESCE(o.debt_amount,0)) AS recorded_debt,
              COALESCE((SELECT SUM(p.amount) FROM payments p
                WHERE p.order_id=o.id AND COALESCE(p.amount,0)>0),0) AS actual_payments
            FROM orders o
            WHERE UPPER(TRIM(COALESCE(o.order_payment_method,'')))='КАСПИ МАГАЗИН'
          )
          SELECT shipping, status, COUNT(*) AS order_count,
            SUM(total) AS commercial_total,
            SUM(recorded_received) AS received_total,
            SUM(recorded_debt) AS recorded_debt_total,
            SUM(MAX(0,total-actual_payments)) AS calculated_outstanding,
            SUM(CASE WHEN total>actual_payments THEN 1 ELSE 0 END) AS outstanding_orders,
            SUM(CASE WHEN recorded_received<>actual_payments OR recorded_debt<>MAX(0,total-actual_payments) THEN 1 ELSE 0 END) AS inconsistent_ledger_orders
          FROM kaspi GROUP BY shipping,status ORDER BY shipping,status;
          SQL
          )
          # Never write financial or personal information. Query contains only SELECTs.
          [[ "$SQL" == *"SELECT shipping, status"* ]]
          if echo "$SQL" | grep -Eiq '\b(UPDATE|DELETE|INSERT|DROP|ALTER|CREATE|REPLACE|ATTACH|DETACH|VACUUM)\b'; then
            echo 'Unsafe SQL rejected' >&2; exit 47
          fi
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "$SQL" --json | jq -c '.[0].results'
          echo 'PRODUCTION KASPI SELECT-ONLY AUDIT COMPLETE (NO WRITES)'

      - name: Production read-only gender/SKU warehouse provenance audit
        if: github.event_name == 'pull_request'
        run: node scripts/ops/readonly-male-bayan-ainazik-provenance-20261019.mjs
      - name: Preserve variant, stock, attempt and ledger evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: male-bayan-ainazik-provenance-20261019
          path: male-sku-provenance-20261019.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Check female-equivalent stock for male SKU and exact order 1773 (SELECT only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          query() {
            npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "$1" --json | jq -c '.[0].results'
          }
          echo '=== RELATED_SKU_SAME_COLOR_SIZE_OTHER_GENDER ==='
          query "WITH males AS (
            SELECT v.* FROM catalog_variants v WHERE v.id IN (1828,1829)
          )
          SELECT a.id AS male_variant_id,b.id AS related_variant_id,
            b.is_active,b.gender,b.color,b.material,b.length,b.size_label,
            s.inventory_source AS source,s.quantity AS physical,s.reserved_quantity AS reserved,
            s.last_action,s.updated_at
          FROM males a JOIN catalog_variants b ON b.product_id=a.product_id
            AND COALESCE(b.color,'')=COALESCE(a.color,'')
            AND COALESCE(b.size_label,'')=COALESCE(a.size_label,'')
          LEFT JOIN inventory_stock s ON s.variant_id=b.id
          ORDER BY a.id,b.gender,b.material,b.length,b.id,s.inventory_source LIMIT 100"
          echo '=== ORDER_1773_FULL_ITEM_SNAPSHOTS ==='
          query "SELECT o.id,o.order_date,o.created_at,o.shipping_status,o.shipping_date,o.manager_id,
            oi.id AS item_id,oi.product_name_snapshot,oi.gender_snapshot,oi.color_snapshot,
            oi.material_snapshot,oi.length_snapshot,oi.size_snapshot,oi.quantity,oi.source_type,
            oi.variant_id,oi.stock_writeoff_status
            FROM orders o JOIN order_items oi ON oi.order_id=o.id WHERE o.id=1773 ORDER BY oi.id"
          echo '=== ORDER_1773_ACTIVITIES ==='
          query "SELECT id,event_type,entity_type,entity_id,created_at
            FROM activity_log WHERE order_id=1773 ORDER BY created_at,id LIMIT 100"
          echo '=== UNRESOLVED_MALE_AI_NAZIK_ORDERS_AND_PAYMENTS ==='
          query "SELECT o.id,o.order_date,o.shipping_status,o.order_payment_method,o.received_amount,
            o.debt_amount,oi.id AS item_id,oi.variant_id,oi.gender_snapshot,oi.size_snapshot,
            oi.source_type,oi.quantity,r.id AS reserve_id,r.status AS reserve_status,
            r.unresolved_reason,r.created_at AS reserved_at
            FROM orders o JOIN order_items oi ON oi.order_id=o.id
            LEFT JOIN inventory_reservations r ON r.order_item_id=oi.id
            WHERE UPPER(COALESCE(oi.product_name_snapshot,'')) LIKE '%НӘЗІК%'
            AND UPPER(COALESCE(oi.gender_snapshot,''))='МУЖ'
            AND oi.quantity>0 AND o.order_date>='2026-10-01'
            ORDER BY o.order_date,oi.id LIMIT 80"
          echo 'MALE_VARIANT_DIAGNOSTICS_READ_ONLY_COMPLETE'

      - name: Attribute-level SKU drift and shipped-at-zero patterns (SELECT only)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          query() {
            npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "$1" --json | jq -c '.[0].results'
          }
          echo '=== PRODUCT_351_AND_1787_PRIOR_MOVEMENTS ==='
          query "SELECT v.id AS variant_id,v.gender,v.color,v.material,v.length,v.size_label,
            m.inventory_source,m.id AS movement_id,m.movement_type,m.quantity_delta,m.quantity_after,
            m.reference_type,m.reference_id,m.created_at
            FROM catalog_variants v LEFT JOIN inventory_movements m ON m.variant_id=v.id
            WHERE v.id IN (351,1787,1828,1829,953)
            ORDER BY v.id,m.created_at,m.id LIMIT 250"
          echo '=== SNAPSHOT_GENDER_VARIANT_GENDER_MISMATCH_COUNT ==='
          query "SELECT COALESCE(oi.gender_snapshot,'(none)') AS order_gender,
            COALESCE(v.gender,'(none)') AS catalog_gender,p.name AS product,
            COUNT(*) AS order_items,SUM(CASE WHEN COALESCE(o.shipping_status,'')='sent' THEN 1 ELSE 0 END) AS shipped,
            MIN(o.order_date) AS earliest,MAX(o.order_date) AS latest
            FROM order_items oi JOIN catalog_variants v ON v.id=oi.variant_id
            JOIN catalog_products p ON p.id=v.product_id JOIN orders o ON o.id=oi.order_id
            WHERE oi.quantity>0 AND COALESCE(oi.gender_snapshot,'')<>''
            AND COALESCE(v.gender,'')<>'' AND UPPER(TRIM(oi.gender_snapshot))<>UPPER(TRIM(v.gender))
            GROUP BY oi.gender_snapshot,v.gender,p.name ORDER BY order_items DESC LIMIT 60"
          echo '=== ALL_UNEXPLAINED_OUTBOUND_BY_MONTH ==='
          query "SELECT SUBSTR(occurred_at,1,7) AS month,inventory_source,operation_type,
            COUNT(*) AS lines,COUNT(DISTINCT variant_id) AS affected_skus,
            SUM(unexplained_quantity) AS unexplained_units,
            SUM(confirmed_operation_quantity) AS confirmed_units
            FROM inventory_operation_evidence
            GROUP BY SUBSTR(occurred_at,1,7),inventory_source,operation_type
            ORDER BY month DESC,unexplained_units DESC LIMIT 90"
          echo '=== OCTOBER_ZERO_INITIAL_SKU_ORDERS_WITHOUT_INBOUND ==='
          query "WITH fresh AS (
            SELECT r.inventory_source AS source,r.variant_id,
              SUM(r.quantity) AS reserved_units,COUNT(DISTINCT r.order_id) AS orders
            FROM inventory_reservations r JOIN orders o ON o.id=r.order_id
            WHERE r.status='active' AND r.variant_id IS NOT NULL AND o.order_date>='2026-10-01'
            GROUP BY r.inventory_source,r.variant_id
          )
          SELECT COUNT(*) AS sku_sources_with_oct_active_res,
            SUM(CASE WHEN COALESCE(s.quantity,0)=0 THEN 1 ELSE 0 END) AS zero_physical,
            SUM(CASE WHEN COALESCE(s.quantity,0)=0 AND NOT EXISTS (
              SELECT 1 FROM inventory_movements m WHERE m.variant_id=fresh.variant_id
              AND m.inventory_source=fresh.source AND m.quantity_delta>0
            ) THEN 1 ELSE 0 END) AS zero_and_no_positive_movement
          FROM fresh LEFT JOIN inventory_stock s ON s.variant_id=fresh.variant_id AND s.inventory_source=fresh.source"
          echo 'STOCK_ATTRIBUTION_READONLY_COMPLETE'
