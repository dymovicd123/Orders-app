name: Client3 Main workflow structure acceptance — NO DEPLOY
on:
  push:
    branches: [client3/main-workflow-rebase-20261102]
    paths: ['.github/workflows/client3-main-workflow-acceptance-20261102.yml']
permissions:
  contents: read
jobs:
  verify-main-adaptation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Verify isolated Client3 Worker and D1 configuration
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          ! grep -Eq 'orders_db_prod|orders_db_branch2' wrangler.jsonc
      - run: npm ci
      - name: Main structural parity, exact brand boundary and correct logistics routing
        run: |
          node scripts/client3/test-main-foundation-parity-20261102.mjs
          node scripts/client3/test-watch-warehouse-order-parity-20261102.mjs
          node scripts/client3/test-main-workflow-parity-20261102.mjs
      - name: Client3 auth, order form, logistics SSR
        run: |
          node scripts/client3/test-watch-shell-20261102.mjs
          node scripts/client3/test-watch-form-20261102.mjs
          node scripts/client3/test-watch-logistics-20261102.mjs
      - name: Physical stock, dispatch, return and exchange isolated engine regression
        run: |
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-catalog-20261102.mjs
      - name: TypeScript and Vite production build
        run: npm run build
