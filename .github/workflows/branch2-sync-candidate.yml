name: Branch2 sync candidate validation

on:
  push:
    branches:
      - sync/branch2-20260916

permissions:
  contents: write

jobs:
  prepare-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/branch2-20260916
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply exact Branch2-only deltas
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json

          auth_path = Path('worker/domains/auth.ts')
          auth = auth_path.read_text()
          old = """  return password === getAdminModePassword(env);\n}"""
          new = """  const storedPasswordRequired = (await getAppSetting(db, 'require_stored_admin_password', '0')) === '1';\n  if (storedPasswordRequired) return false;\n  return password === getAdminModePassword(env);\n}"""
          if new not in auth:
              if auth.count(old) != 1:
                  raise SystemExit('Could not identify exact verifySimpleAdminPassword fallback in current main')
              auth = auth.replace(old, new, 1)
              auth_path.write_text(auth)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          release = package['scripts']['release:check']
          suffix = ' && node scripts/test-branch2-environment.mjs'
          if 'scripts/test-branch2-environment.mjs' not in release:
              package['scripts']['release:check'] = release + suffix
              package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          wrapper_path = Path('scripts/test-step1906a-worker-modularization.mjs')
          wrapper = wrapper_path.read_text()
          marker = "branch2-environment-r2-current-main"
          if marker not in wrapper:
              anchor = "fs.writeFileSync(legacyPath, patched)"
              if wrapper.count(anchor) != 1:
                  raise SystemExit('Could not identify 1906A final patch anchor')
              block = r'''// Branch2 environment is the final deployment-only declaration layer over current main.
const branch2Environment = JSON.parse(fs.readFileSync(path.join(root, 'scripts/branch2-environment-worker-manifest.json'), 'utf8'))
if (branch2Environment.version !== 1 || branch2Environment.revision !== 'branch2-environment-r2-current-main' || Object.keys(branch2Environment.changes || {}).join(',') !== 'verifySimpleAdminPassword') throw new Error('Branch2 environment Worker allow-list changed')
patched = 'const branch2EnvironmentChanges = ' + JSON.stringify(branch2Environment.changes) + '\n' + patched
const branch2HashAnchor = '        return sha(declarations.get(name)) === (resolverUxChanged ? resolverUxChanged.after : acceptedFinanceR3HistoricalCashHash)'
if (!patched.includes(branch2HashAnchor)) throw new Error('Branch2 environment predecessor anchor missing')
patched = patched.replace(branch2HashAnchor, [
  '        const acceptedPostResolverUxHash = resolverUxChanged ? resolverUxChanged.after : acceptedFinanceR3HistoricalCashHash',
  '        const branch2EnvironmentChanged = branch2EnvironmentChanges[name]',
  "        if (branch2EnvironmentChanged) check(branch2EnvironmentChanged.before === acceptedPostResolverUxHash, 'Branch2 environment predecessor drifted: ' + name)",
  '        return sha(declarations.get(name)) === (branch2EnvironmentChanged ? branch2EnvironmentChanged.after : acceptedPostResolverUxHash)',
].join('\n'))
'''
              wrapper = wrapper.replace(anchor, block + anchor, 1)
              wrapper_path.write_text(wrapper)
          PY

          node scripts/test-branch2-environment.mjs
          if grep -R --line-number --fixed-strings 'orders_db_prod' wrangler.jsonc index.html; then
            echo 'Primary binding leaked into Branch2 runtime environment files' >&2
            exit 1
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Full release gate
        run: npm run release:check

      - name: Database safety gate
        run: npm run verify:db-safety

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Wrangler dry run only
        run: npx wrangler deploy --dry-run --outdir /tmp/branch2-wrangler-dry-run

      - name: Commit validated Branch2-only deltas when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- worker/domains/auth.ts package.json scripts/test-step1906a-worker-modularization.mjs; then
            echo 'Candidate already contains exact Branch2 deltas.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/domains/auth.ts package.json scripts/test-step1906a-worker-modularization.mjs
          git commit -m 'Preserve Branch2 environment guards on current main'
          git push origin HEAD:sync/branch2-20260916
