name: Client3 zero-stock revision guarded hotfix
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-zero-stock-revision-release-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Guard Client3-only release target and exact reviewed commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(git rev-parse HEAD^)" = 586b1474755b0d2f9d3ed1bb632c8350c5ed8bc4
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/client3-zero-stock-revision-release-20261103.yml'
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -q 'LEFT JOIN inventory_stock s' worker/domains/client3-watch-revision-session.ts
      - run: npm ci
      - name: Reproduce zero-stock full and selective revisions and completion on SQLite
        run: node --experimental-strip-types scripts/client3/test-zero-stock-revision-20261103.mjs
      - name: Orders, stock, exchanges, finance regression
        run: node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
      - name: Arrival reload and 31-SKU batch regression
        run: node --experimental-strip-types scripts/client3/test-watch-arrival-draft-20261103.mjs
      - name: Team, accounts and shared cash regression
        run: node --experimental-strip-types scripts/client3/test-watch-shared-cash-team-20261103.mjs
      - name: TypeScript and production bundle
        run: npm run build
      - name: Verify real isolated D1 snapshot and FK before deploy
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM inventory_stocktake_sessions) sessions,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries" \
            | jq -ce '(if type=="array" then .[0].results[0] else .results[0] end)' > /tmp/client3-revision-before.json
          cat /tmp/client3-revision-before.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" \
            | jq -e '(if type=="array" then .[0].results else .results end) | length==0'
      - name: Deploy only Client3 Worker, no migrations or inventory changes
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Live API auth smoke and FK after deploy
        run: |
          set -euo pipefail
          base='https://orders-app-client3-old-client.orders-clothes.workers.dev'
          test "$(curl -sSL -o /tmp/worker-html -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/worker-html
          for path in '/api/client3/watches/stock/revision?brand=TAUWACH&source=office' \
            '/api/client3/watches/catalog?brand=TAUWACH'; do
            status="$(curl -sS -o /tmp/client3-get -w '%{http_code}' --max-time 30 "$base$path")"
            test "$status" = 401 -o "$status" = 403
          done
          status="$(curl -sS -o /tmp/client3-revision-post -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"brand":"TAUWACH","source":"office","full":true}' \
            "$base/api/client3/watches/stock/revision/start")"
          test "$status" = 401 -o "$status" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" \
            | jq -e '(if type=="array" then .[0].results else .results end) | length==0'
          echo CLIENT3_ZERO_STOCK_REVISION_RELEASE_VERIFIED
      - name: Record successful Client3-only publication
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 zero-stock full/selective revision HOTFIX DEPLOYED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. PR #782; fresh SQLite reproduces absent stock, opens full, counts 7, finishes and creates stock; selective 0 remains zero. Full watch engine/arrival drafts/team/cash regression, TypeScript/Vite, real Client3 D1 FK and auth smoke passed. No migrations or writes to real stock during release. Main/Branch2 untouched. Manual browser acceptance pending. Issuance clarification for future Oct 1/2 orders is NOT implemented by this hotfix."
      - name: Record failure without claiming a deploy
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 zero-stock revision hotfix release BLOCKED/FAILED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Review failed step before claiming deployment. Main/Branch2 not targeted."
