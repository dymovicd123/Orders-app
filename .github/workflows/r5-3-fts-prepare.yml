name: R5.3 FTS order search prepare

on:
  push:
    branches:
      - safe/d1-read-budget-r5-3-fts-20260903
    paths:
      - scripts/.r5-3-fts-prepare-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r5-3-fts-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch R5.3 FTS search and regression gates
        shell: python
        run: |
          from pathlib import Path

          orders_path = Path('worker/domains/orders-read.ts')
          text = orders_path.read_text(encoding='utf-8')
          old = """    } else {\n      aggregateNeedsManagerJoin = true;\n      aggregateNeedsCustomerJoin = true;\n      const searchOrderText = `COALESCE(o.external_id, '') || ' ' || COALESCE(o.order_date, '') || ' ' ||\n        COALESCE(m.name, o.manager_snapshot_name, '') || ' ' || COALESCE(c.phone_normalized, '') || ' ' ||\n        COALESCE(c.display_name, '') || ' ' || COALESCE(o.city, '') || ' ' || COALESCE(o.delivery_type, '') || ' ' || COALESCE(o.comment, '')`;\n      const searchItemText = `COALESCE(oi.product_name_snapshot, '') || ' ' || COALESCE(oi.gender_snapshot, '') || ' ' ||\n        COALESCE(oi.color_snapshot, '') || ' ' || COALESCE(oi.material_snapshot, '') || ' ' ||\n        COALESCE(oi.length_snapshot, '') || ' ' || COALESCE(oi.size_snapshot, '')`;\n      const searchPaymentText = `COALESCE(search_payment.method, '') || ' ' || COALESCE(search_payment.comment, '')`;\n      const qVariants = [q, q.toUpperCase(), q.toLowerCase()];\n      baseWhereParts.push(`(\n        INSTR(${searchOrderText}, ?) > 0 OR INSTR(${searchOrderText}, ?) > 0 OR INSTR(${searchOrderText}, ?) > 0\n        OR EXISTS (SELECT 1 FROM order_items oi WHERE oi.order_id = o.id AND (\n          INSTR(${searchItemText}, ?) > 0 OR INSTR(${searchItemText}, ?) > 0 OR INSTR(${searchItemText}, ?) > 0\n        ))\n        OR EXISTS (SELECT 1 FROM payments search_payment WHERE search_payment.order_id = o.id AND (\n          INSTR(${searchPaymentText}, ?) > 0 OR INSTR(${searchPaymentText}, ?) > 0 OR INSTR(${searchPaymentText}, ?) > 0\n        ))\n      )`);\n      baseBindings.push(...qVariants, ...qVariants, ...qVariants);\n    }\n"""
          new = """    } else if (Array.from(q).length >= 3) {\n      // D1 read-budget R5.3: arbitrary substring search is the remaining order-list scan hotspot.\n      // A case-sensitive trigram FTS index queried with the exact legacy raw/upper/lower variants\n      // preserves the old INSTR semantics while avoiding correlated scans of items/payments.\n      const qVariants = Array.from(new Set([q, q.toUpperCase(), q.toLowerCase()]));\n      const ftsQuery = qVariants.map((value) => `\\\"${value.replaceAll('\\\"', '\\\"\\\"')}\\\"`).join(' OR ');\n      baseWhereParts.push(`(\n        o.id IN (SELECT rowid FROM order_search_orders_fts WHERE order_search_orders_fts MATCH ?)\n        OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_items_fts WHERE order_search_items_fts MATCH ?)\n        OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_payments_fts WHERE order_search_payments_fts MATCH ?)\n      )`);\n      baseBindings.push(ftsQuery, ftsQuery, ftsQuery);\n    } else {\n      // FTS5 trigram cannot match fewer than three Unicode characters. Keep the exact legacy\n      // fallback for those intentionally broad short searches.\n      aggregateNeedsManagerJoin = true;\n      aggregateNeedsCustomerJoin = true;\n      const searchOrderText = `COALESCE(o.external_id, '') || ' ' || COALESCE(o.order_date, '') || ' ' ||\n        COALESCE(m.name, o.manager_snapshot_name, '') || ' ' || COALESCE(c.phone_normalized, '') || ' ' ||\n        COALESCE(c.display_name, '') || ' ' || COALESCE(o.city, '') || ' ' || COALESCE(o.delivery_type, '') || ' ' || COALESCE(o.comment, '')`;\n      const searchItemText = `COALESCE(oi.product_name_snapshot, '') || ' ' || COALESCE(oi.gender_snapshot, '') || ' ' ||\n        COALESCE(oi.color_snapshot, '') || ' ' || COALESCE(oi.material_snapshot, '') || ' ' ||\n        COALESCE(oi.length_snapshot, '') || ' ' || COALESCE(oi.size_snapshot, '')`;\n      const searchPaymentText = `COALESCE(search_payment.method, '') || ' ' || COALESCE(search_payment.comment, '')`;\n      const qVariants = [q, q.toUpperCase(), q.toLowerCase()];\n      baseWhereParts.push(`(\n        INSTR(${searchOrderText}, ?) > 0 OR INSTR(${searchOrderText}, ?) > 0 OR INSTR(${searchOrderText}, ?) > 0\n        OR EXISTS (SELECT 1 FROM order_items oi WHERE oi.order_id = o.id AND (\n          INSTR(${searchItemText}, ?) > 0 OR INSTR(${searchItemText}, ?) > 0 OR INSTR(${searchItemText}, ?) > 0\n        ))\n        OR EXISTS (SELECT 1 FROM payments search_payment WHERE search_payment.order_id = o.id AND (\n          INSTR(${searchPaymentText}, ?) > 0 OR INSTR(${searchPaymentText}, ?) > 0 OR INSTR(${searchPaymentText}, ?) > 0\n        ))\n      )`);\n      baseBindings.push(...qVariants, ...qVariants, ...qVariants);\n    }\n"""
          if old not in text:
              raise SystemExit('R5.3 generic search anchor not found')
          orders_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          migration = Path('migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql')
          migration.write_text("""-- D1 read-budget R5.3: trigram FTS candidate indexes for generic order substring search.\n-- Search tables are derived indexes only. Business tables remain the source of truth.\n-- case_sensitive=1 plus the runtime raw/UPPER/lower query variants preserves the legacy INSTR behavior.\n\nCREATE VIRTUAL TABLE IF NOT EXISTS order_search_orders_fts USING fts5(\n  order_id UNINDEXED,\n  search_text,\n  tokenize='trigram case_sensitive 1'\n);\n\nCREATE VIRTUAL TABLE IF NOT EXISTS order_search_items_fts USING fts5(\n  order_id UNINDEXED,\n  search_text,\n  tokenize='trigram case_sensitive 1'\n);\n\nCREATE VIRTUAL TABLE IF NOT EXISTS order_search_payments_fts USING fts5(\n  order_id UNINDEXED,\n  search_text,\n  tokenize='trigram case_sensitive 1'\n);\n\nDELETE FROM order_search_orders_fts;\nINSERT INTO order_search_orders_fts(rowid, order_id, search_text)\nSELECT o.id, o.id,\n       COALESCE(o.external_id, '') || ' ' || COALESCE(o.order_date, '') || ' ' ||\n       COALESCE(m.name, o.manager_snapshot_name, '') || ' ' || COALESCE(c.phone_normalized, '') || ' ' ||\n       COALESCE(c.display_name, '') || ' ' || COALESCE(o.city, '') || ' ' || COALESCE(o.delivery_type, '') || ' ' || COALESCE(o.comment, '')\nFROM orders o\nLEFT JOIN managers m ON m.id = o.manager_id\nLEFT JOIN customers c ON c.id = o.customer_id;\n\nDELETE FROM order_search_items_fts;\nINSERT INTO order_search_items_fts(rowid, order_id, search_text)\nSELECT oi.id, oi.order_id,\n       COALESCE(oi.product_name_snapshot, '') || ' ' || COALESCE(oi.gender_snapshot, '') || ' ' ||\n       COALESCE(oi.color_snapshot, '') || ' ' || COALESCE(oi.material_snapshot, '') || ' ' ||\n       COALESCE(oi.length_snapshot, '') || ' ' || COALESCE(oi.size_snapshot, '')\nFROM order_items oi;\n\nDELETE FROM order_search_payments_fts;\nINSERT INTO order_search_payments_fts(rowid, order_id, search_text)\nSELECT p.id, p.order_id, COALESCE(p.method, '') || ' ' || COALESCE(p.comment, '')\nFROM payments p;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_orders_ai\nAFTER INSERT ON orders\nBEGIN\n  INSERT INTO order_search_orders_fts(rowid, order_id, search_text)\n  VALUES (\n    NEW.id, NEW.id,\n    COALESCE(NEW.external_id, '') || ' ' || COALESCE(NEW.order_date, '') || ' ' ||\n    COALESCE((SELECT name FROM managers WHERE id = NEW.manager_id), NEW.manager_snapshot_name, '') || ' ' ||\n    COALESCE((SELECT phone_normalized FROM customers WHERE id = NEW.customer_id), '') || ' ' ||\n    COALESCE((SELECT display_name FROM customers WHERE id = NEW.customer_id), '') || ' ' ||\n    COALESCE(NEW.city, '') || ' ' || COALESCE(NEW.delivery_type, '') || ' ' || COALESCE(NEW.comment, '')\n  );\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_orders_ad\nAFTER DELETE ON orders\nBEGIN\n  DELETE FROM order_search_orders_fts WHERE rowid = OLD.id;\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_orders_au\nAFTER UPDATE OF external_id, order_date, manager_id, manager_snapshot_name, customer_id, city, delivery_type, comment ON orders\nBEGIN\n  DELETE FROM order_search_orders_fts WHERE rowid = OLD.id;\n  INSERT INTO order_search_orders_fts(rowid, order_id, search_text)\n  VALUES (\n    NEW.id, NEW.id,\n    COALESCE(NEW.external_id, '') || ' ' || COALESCE(NEW.order_date, '') || ' ' ||\n    COALESCE((SELECT name FROM managers WHERE id = NEW.manager_id), NEW.manager_snapshot_name, '') || ' ' ||\n    COALESCE((SELECT phone_normalized FROM customers WHERE id = NEW.customer_id), '') || ' ' ||\n    COALESCE((SELECT display_name FROM customers WHERE id = NEW.customer_id), '') || ' ' ||\n    COALESCE(NEW.city, '') || ' ' || COALESCE(NEW.delivery_type, '') || ' ' || COALESCE(NEW.comment, '')\n  );\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_items_ai\nAFTER INSERT ON order_items\nBEGIN\n  INSERT INTO order_search_items_fts(rowid, order_id, search_text)\n  VALUES (NEW.id, NEW.order_id, COALESCE(NEW.product_name_snapshot, '') || ' ' || COALESCE(NEW.gender_snapshot, '') || ' ' || COALESCE(NEW.color_snapshot, '') || ' ' || COALESCE(NEW.material_snapshot, '') || ' ' || COALESCE(NEW.length_snapshot, '') || ' ' || COALESCE(NEW.size_snapshot, ''));\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_items_ad\nAFTER DELETE ON order_items\nBEGIN\n  DELETE FROM order_search_items_fts WHERE rowid = OLD.id;\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_items_au\nAFTER UPDATE OF order_id, product_name_snapshot, gender_snapshot, color_snapshot, material_snapshot, length_snapshot, size_snapshot ON order_items\nBEGIN\n  DELETE FROM order_search_items_fts WHERE rowid = OLD.id;\n  INSERT INTO order_search_items_fts(rowid, order_id, search_text)\n  VALUES (NEW.id, NEW.order_id, COALESCE(NEW.product_name_snapshot, '') || ' ' || COALESCE(NEW.gender_snapshot, '') || ' ' || COALESCE(NEW.color_snapshot, '') || ' ' || COALESCE(NEW.material_snapshot, '') || ' ' || COALESCE(NEW.length_snapshot, '') || ' ' || COALESCE(NEW.size_snapshot, ''));\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_payments_ai\nAFTER INSERT ON payments\nBEGIN\n  INSERT INTO order_search_payments_fts(rowid, order_id, search_text)\n  VALUES (NEW.id, NEW.order_id, COALESCE(NEW.method, '') || ' ' || COALESCE(NEW.comment, ''));\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_payments_ad\nAFTER DELETE ON payments\nBEGIN\n  DELETE FROM order_search_payments_fts WHERE rowid = OLD.id;\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_payments_au\nAFTER UPDATE OF order_id, method, comment ON payments\nBEGIN\n  DELETE FROM order_search_payments_fts WHERE rowid = OLD.id;\n  INSERT INTO order_search_payments_fts(rowid, order_id, search_text)\n  VALUES (NEW.id, NEW.order_id, COALESCE(NEW.method, '') || ' ' || COALESCE(NEW.comment, ''));\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_managers_au\nAFTER UPDATE OF name ON managers\nBEGIN\n  DELETE FROM order_search_orders_fts WHERE rowid IN (SELECT id FROM orders WHERE manager_id = NEW.id);\n  INSERT INTO order_search_orders_fts(rowid, order_id, search_text)\n  SELECT o.id, o.id,\n         COALESCE(o.external_id, '') || ' ' || COALESCE(o.order_date, '') || ' ' ||\n         COALESCE(NEW.name, o.manager_snapshot_name, '') || ' ' || COALESCE(c.phone_normalized, '') || ' ' ||\n         COALESCE(c.display_name, '') || ' ' || COALESCE(o.city, '') || ' ' || COALESCE(o.delivery_type, '') || ' ' || COALESCE(o.comment, '')\n  FROM orders o\n  LEFT JOIN customers c ON c.id = o.customer_id\n  WHERE o.manager_id = NEW.id;\nEND;\n\nCREATE TRIGGER IF NOT EXISTS trg_order_search_customers_au\nAFTER UPDATE OF phone_normalized, display_name ON customers\nBEGIN\n  DELETE FROM order_search_orders_fts WHERE rowid IN (SELECT id FROM orders WHERE customer_id = NEW.id);\n  INSERT INTO order_search_orders_fts(rowid, order_id, search_text)\n  SELECT o.id, o.id,\n         COALESCE(o.external_id, '') || ' ' || COALESCE(o.order_date, '') || ' ' ||\n         COALESCE(m.name, o.manager_snapshot_name, '') || ' ' || COALESCE(NEW.phone_normalized, '') || ' ' ||\n         COALESCE(NEW.display_name, '') || ' ' || COALESCE(o.city, '') || ' ' || COALESCE(o.delivery_type, '') || ' ' || COALESCE(o.comment, '')\n  FROM orders o\n  LEFT JOIN managers m ON m.id = o.manager_id\n  WHERE o.customer_id = NEW.id;\nEND;\n\nPRAGMA optimize;\n""", encoding='utf-8')

          test_path = Path('scripts/test-d1-read-budget-r5-3.mjs')
          test_path.write_text("""import fs from 'node:fs'\n\nconst source = fs.readFileSync('worker/domains/orders-read.ts', 'utf8')\nconst migration = fs.readFileSync('migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql', 'utf8')\nconst check = (condition, message) => { if (!condition) throw new Error(message) }\n\ncheck(source.includes('} else if (Array.from(q).length >= 3) {'), 'FTS path must be limited to >=3 Unicode characters')\ncheck(source.includes('const qVariants = Array.from(new Set([q, q.toUpperCase(), q.toLowerCase()]))'), 'legacy raw/upper/lower search variants changed')\ncheck(source.includes('order_search_orders_fts MATCH ?'), 'order FTS candidate path missing')\ncheck(source.includes('order_search_items_fts MATCH ?'), 'item FTS candidate path missing')\ncheck(source.includes('order_search_payments_fts MATCH ?'), 'payment FTS candidate path missing')\ncheck(source.includes('FTS5 trigram cannot match fewer than three Unicode characters'), 'short-query legacy fallback missing')\ncheck(source.includes('INSTR(${searchOrderText}, ?) > 0'), 'short-query order fallback changed')\ncheck(source.includes("baseWhereParts.push('o.external_id >= ? AND o.external_id < ?')"), 'indexed ORD prefix fast path lost')\ncheck(!source.includes('genericSearchClause'), 'rejected full-history materialization path returned')\n\nfor (const table of ['order_search_orders_fts', 'order_search_items_fts', 'order_search_payments_fts']) {\n  check(migration.includes(`CREATE VIRTUAL TABLE IF NOT EXISTS ${table} USING fts5`), `${table} FTS definition missing`)\n}\ncheck((migration.match(/tokenize='trigram case_sensitive 1'/g) || []).length === 3, 'FTS must use exact case-sensitive trigram tokenizer on all search tables')\nfor (const trigger of [\n  'trg_order_search_orders_ai','trg_order_search_orders_ad','trg_order_search_orders_au',\n  'trg_order_search_items_ai','trg_order_search_items_ad','trg_order_search_items_au',\n  'trg_order_search_payments_ai','trg_order_search_payments_ad','trg_order_search_payments_au',\n  'trg_order_search_managers_au','trg_order_search_customers_au',\n]) check(migration.includes(`CREATE TRIGGER IF NOT EXISTS ${trigger}`), `FTS maintenance trigger missing: ${trigger}`)\ncheck(!/\\b(?:UPDATE|DELETE FROM)\\s+(?:orders|order_items|payments|managers|customers)\\b/i.test(migration), 'R5.3 migration must not mutate business rows')\ncheck(migration.includes('PRAGMA optimize;'), 'R5.3 migration must refresh query-planner statistics')\n\nconsole.log('D1 READ BUDGET R5.3 PASSED — generic >=3-char order search uses derived case-sensitive trigram FTS indexes; short search and ORD prefix semantics stay intact')\n""", encoding='utf-8')

          package = Path('package.json')
          package_text = package.read_text(encoding='utf-8')
          old_script = 'node scripts/test-d1-read-budget-r5-2.mjs && node scripts/test-manager-routine-access-r1.mjs'
          new_script = 'node scripts/test-d1-read-budget-r5-2.mjs && node scripts/test-d1-read-budget-r5-3.mjs && node scripts/test-manager-routine-access-r1.mjs'
          if old_script not in package_text:
              raise SystemExit('R5.3 package anchor not found')
          package.write_text(package_text.replace(old_script, new_script, 1), encoding='utf-8')

          r4 = Path('scripts/test-d1-read-budget-r4.mjs')
          r4_text = r4.read_text(encoding='utf-8')
          old_r4 = "check(orders.includes('aggregateNeedsManagerJoin = true;\\n      aggregateNeedsCustomerJoin = true;\\n      const searchOrderText'), 'Generic search dimension dependencies missing')"
          new_r4 = "check(orders.includes('order_search_orders_fts MATCH ?') && orders.includes('order_search_items_fts MATCH ?') && orders.includes('order_search_payments_fts MATCH ?'), 'R5.3 generic search FTS candidate path missing')"
          if old_r4 not in r4_text:
              raise SystemExit('R4 historical gate anchor not found')
          r4.write_text(r4_text.replace(old_r4, new_r4, 1), encoding='utf-8')

          cleanup = Path('scripts/test-step1906c-dead-code-cleanup.mjs')
          cleanup_text = cleanup.read_text(encoding='utf-8')
          old_migrations = "'0061_v72_warehouse_attention_truth_gates.sql', '0062_v72_d1_read_budget_r5_warehouse_indexes.sql', '0063_v72_d1_read_budget_r5_catalog_attention_index.sql']"
          new_migrations = "'0061_v72_warehouse_attention_truth_gates.sql', '0062_v72_d1_read_budget_r5_warehouse_indexes.sql', '0063_v72_d1_read_budget_r5_catalog_attention_index.sql', '0064_v72_d1_read_budget_r5_order_search_fts.sql']"
          if old_migrations not in cleanup_text:
              raise SystemExit('1906C additive migration anchor not found')
          cleanup.write_text(cleanup_text.replace(old_migrations, new_migrations, 1), encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Register exact R5.3 Worker declaration delta
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const workerPath = 'worker/domains/orders-read.ts'
          const sourceText = fs.readFileSync(workerPath, 'utf8')
          const source = ts.createSourceFile(workerPath, sourceText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
          const statement = source.statements.find((item) => ts.isFunctionDeclaration(item) && item.name?.text === 'listOrders')
          if (!statement) throw new Error('listOrders declaration not found for R5.3 manifest')
          const normalized = statement.getText(source).replace(/^export\s+/, '')
          const after = crypto.createHash('sha256').update(normalized).digest('hex')
          const r4 = JSON.parse(fs.readFileSync('scripts/d1-read-budget-r4-worker-manifest.json', 'utf8'))
          const before = r4?.changes?.listOrders?.after
          if (!before) throw new Error('R4 listOrders baseline missing')
          fs.writeFileSync('scripts/d1-read-budget-r5-3-worker-manifest.json', JSON.stringify({
            version: 1,
            revision: 'd1-read-budget-r5-3',
            changes: { listOrders: { before, after } },
          }, null, 2) + '\n')
          NODE
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/test-step1906a-worker-modularization.mjs')
          text = path.read_text(encoding='utf-8')
          anchor1 = "const d1ReadBudgetR4Path = path.join(root, 'scripts/d1-read-budget-r4-worker-manifest.json')\nconst operationalAutonomyR2WorkerPath"
          replace1 = "const d1ReadBudgetR4Path = path.join(root, 'scripts/d1-read-budget-r4-worker-manifest.json')\nconst d1ReadBudgetR53Path = path.join(root, 'scripts/d1-read-budget-r5-3-worker-manifest.json')\nconst operationalAutonomyR2WorkerPath"
          if anchor1 not in text: raise SystemExit('R5.3 preservation path anchor missing')
          text = text.replace(anchor1, replace1, 1)
          anchor2 = """  check(fs.existsSync(d1ReadBudgetR4Path), 'D1 read-budget R4 Worker manifest missing')\n  const d1ReadBudgetR4 = JSON.parse(fs.readFileSync(d1ReadBudgetR4Path, 'utf8'))\n  check(d1ReadBudgetR4?.version === 1 && d1ReadBudgetR4?.revision === 'd1-read-budget-r4', 'D1 read-budget R4 Worker manifest invalid')\n  const d1ReadBudgetR4Changes = d1ReadBudgetR4.changes || {}\n"""
          replace2 = anchor2 + """  check(fs.existsSync(d1ReadBudgetR53Path), 'D1 read-budget R5.3 Worker manifest missing')\n  const d1ReadBudgetR53 = JSON.parse(fs.readFileSync(d1ReadBudgetR53Path, 'utf8'))\n  check(d1ReadBudgetR53?.version === 1 && d1ReadBudgetR53?.revision === 'd1-read-budget-r5-3', 'D1 read-budget R5.3 Worker manifest invalid')\n  const d1ReadBudgetR53Changes = d1ReadBudgetR53.changes || {}\n"""
          if anchor2 not in text: raise SystemExit('R5.3 preservation load anchor missing')
          text = text.replace(anchor2, replace2, 1)
          anchor3 = """    const d1ReadBudgetR4Changed = d1ReadBudgetR4Changes[name]\n    if (d1ReadBudgetR4Changed) {\n      check(d1ReadBudgetR4Changed.before === acceptedPostOrderEditScopeHash, `D1 read-budget R4 baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === d1ReadBudgetR4Changed.after, `Worker declaration changed beyond exact D1 read-budget R4 allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostOrderEditScopeHash, `Worker declaration body changed beyond accepted cumulative deltas: ${name}`)\n    }\n"""
          replace3 = """    const d1ReadBudgetR4Changed = d1ReadBudgetR4Changes[name]\n    let acceptedPostD1ReadBudgetR4Hash = acceptedPostOrderEditScopeHash\n    if (d1ReadBudgetR4Changed) {\n      check(d1ReadBudgetR4Changed.before === acceptedPostOrderEditScopeHash, `D1 read-budget R4 baseline hash mismatch: ${name}`)\n      acceptedPostD1ReadBudgetR4Hash = d1ReadBudgetR4Changed.after\n    }\n    const d1ReadBudgetR53Changed = d1ReadBudgetR53Changes[name]\n    if (d1ReadBudgetR53Changed) {\n      check(d1ReadBudgetR53Changed.before === acceptedPostD1ReadBudgetR4Hash, `D1 read-budget R5.3 baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === d1ReadBudgetR53Changed.after, `Worker declaration changed beyond exact D1 read-budget R5.3 allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostD1ReadBudgetR4Hash, `Worker declaration body changed beyond accepted cumulative deltas: ${name}`)\n    }\n"""
          if anchor3 not in text: raise SystemExit('R5.3 preservation validation anchor missing')
          path.write_text(text.replace(anchor3, replace3, 1), encoding='utf-8')
          PY

      - name: Targeted R5.3 regression
        run: node scripts/test-d1-read-budget-r5-3.mjs

      - name: Validate FTS5 migration and trigger semantics on local D1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler-r5-3-fts
          cat > /tmp/r5-3-minimal.sql <<'SQL'
          CREATE TABLE managers (id INTEGER PRIMARY KEY, name TEXT);
          CREATE TABLE customers (id INTEGER PRIMARY KEY, phone_normalized TEXT, display_name TEXT);
          CREATE TABLE orders (
            id INTEGER PRIMARY KEY,
            external_id TEXT,
            order_date TEXT,
            manager_id INTEGER,
            manager_snapshot_name TEXT,
            customer_id INTEGER,
            city TEXT,
            delivery_type TEXT,
            comment TEXT
          );
          CREATE TABLE order_items (
            id INTEGER PRIMARY KEY,
            order_id INTEGER,
            product_name_snapshot TEXT,
            gender_snapshot TEXT,
            color_snapshot TEXT,
            material_snapshot TEXT,
            length_snapshot TEXT,
            size_snapshot TEXT
          );
          CREATE TABLE payments (id INTEGER PRIMARY KEY, order_id INTEGER, method TEXT, comment TEXT);
          SQL
          npx wrangler d1 execute orders_db_prod --local --persist-to .wrangler-r5-3-fts --file /tmp/r5-3-minimal.sql >/tmp/r5-3-schema.log
          npx wrangler d1 execute orders_db_prod --local --persist-to .wrangler-r5-3-fts --file migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql >/tmp/r5-3-migration.log
