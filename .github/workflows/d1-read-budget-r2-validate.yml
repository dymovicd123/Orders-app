name: D1 read-budget R2 validation

on:
  push:
    branches: [d1-read-budget-r2]
    paths:
      - scripts/.d1-read-budget-r2-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-read-budget-r2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture Worker baselines
        run: node scripts/register-d1-read-budget-r2.mjs before
      - name: Apply guarded R2 patch
        run: python3 scripts/apply-d1-read-budget-r2.py
      - name: Register exact Worker delta
        run: node scripts/register-d1-read-budget-r2.mjs after
      - name: Typecheck
        run: npm run typecheck
      - name: Full release gates
        run: npm run release:check
      - name: Commit validated R2
        run: |
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add package.json scripts/test-d1-read-budget-r2.mjs scripts/d1-read-budget-r2-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs worker/domains/order-reservations.ts worker/domains/warehouse-attention.ts worker/domains/orders-read.ts worker/domains/inventory-read.ts worker/domains/team.ts worker/domains/clients.ts src/App.tsx
          git diff --cached --check
          git commit -m "Reduce remaining D1 read amplification"
          git push origin HEAD:d1-read-budget-r2