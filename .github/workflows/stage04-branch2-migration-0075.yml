name: Stage04 Branch2 migration 0075

on:
  push:
    branches:
      - branch2
    paths:
      - '.github/workflows/stage04-branch2-migration-0075.yml'

permissions:
  contents: read

jobs:
  apply:
    name: Apply 0075 to Branch2 D1 only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact Branch2 commit
        uses: actions/checkout@v4

      - name: Hard-stop on environment or migration drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "branch2" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Production D1 binding detected. Refusing migration." >&2
            exit 20
          fi
          migration='migrations/0075_v72_zammler_workshop_due_time.sql'
          grep -Fq 'ALTER TABLE order_items ADD COLUMN workshop_due_time TEXT' "$migration"
          grep -Fq 'ALTER TABLE workshop_tasks ADD COLUMN due_time TEXT' "$migration"
          grep -Fq "('delivery_type', 'ZAMMLER'" "$migration"
          if grep -Eiq '\b(UPDATE[[:space:]]+orders|UPDATE[[:space:]]+order_items|DELETE[[:space:]]+FROM[[:space:]]+orders|DELETE[[:space:]]+FROM[[:space:]]+order_items)\b' "$migration"; then
            echo "0075 contains forbidden live-order rewrites." >&2
            exit 21
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply missing 0075 pieces to Branch2 D1
        shell: bash
        run: |
          set -euo pipefail
          oi="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS count FROM pragma_table_info('order_items') WHERE name = 'workshop_due_time'" --json | jq -r '.[0].results[0].count // 0')"
          wt="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS count FROM pragma_table_info('workshop_tasks') WHERE name = 'due_time'" --json | jq -r '.[0].results[0].count // 0')"
          [[ "$oi" == "0" || "$oi" == "1" ]]
          [[ "$wt" == "0" || "$wt" == "1" ]]
          if [[ "$oi" == "0" ]]; then
            npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "ALTER TABLE order_items ADD COLUMN workshop_due_time TEXT"
          fi
          if [[ "$wt" == "0" ]]; then
            npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "ALTER TABLE workshop_tasks ADD COLUMN due_time TEXT"
          fi
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "INSERT INTO reference_values (kind, value, is_active, sort_order, created_at, updated_at) VALUES ('delivery_type', 'ZAMMLER', 1, 5, datetime('now'), datetime('now')) ON CONFLICT(kind, value) DO UPDATE SET is_active = 1, sort_order = excluded.sort_order, updated_at = excluded.updated_at"

      - name: Verify 0075 result
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT
            (SELECT COUNT(*) FROM pragma_table_info('order_items') WHERE name = 'workshop_due_time') AS order_item_due_time,
            (SELECT COUNT(*) FROM pragma_table_info('workshop_tasks') WHERE name = 'due_time') AS workshop_due_time,
            (SELECT COUNT(*) FROM reference_values WHERE kind = 'delivery_type' AND value = 'ZAMMLER' AND is_active = 1) AS zammler_delivery,
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COUNT(*) FROM workshop_tasks) AS workshop_tasks_count" --json)"
          echo "$result"
          [[ "$(jq -r '.[0].results[0].order_item_due_time' <<<"$result")" == "1" ]]
          [[ "$(jq -r '.[0].results[0].workshop_due_time' <<<"$result")" == "1" ]]
          [[ "$(jq -r '.[0].results[0].zammler_delivery' <<<"$result")" == "1" ]]
          echo "Stage04 migration 0075 verified on Branch2 D1 only."
