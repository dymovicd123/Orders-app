name: SELECT-only production order 1658 pre-click validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-order1658-preclick-20261016.mjs'
      - '.github/workflows/readonly-order1658-preclick-20261016.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert production identity and SELECT-only script
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_BASE_REF" == "main" ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          node --check scripts/ops/readonly-order1658-preclick-20261016.mjs
          cat > "$RUNNER_TEMP/order1658-readonly.jsonc" <<'CFG'
          {
            "name":"order1658-readonly",
            "compatibility_date":"2026-07-06",
            "d1_databases":[{
              "binding":"DB",
              "database_name":"orders_db_prod",
              "database_id":"17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/order1658-readonly.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Read order 1658 stock, reservation, revisions and prior reviews only
        run: node scripts/ops/readonly-order1658-preclick-20261016.mjs
