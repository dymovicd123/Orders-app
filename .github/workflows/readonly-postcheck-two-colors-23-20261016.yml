name: 'Independent SELECT-only verify two new colors and 23 SKU'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-postcheck-two-colors-23-20261016.mjs'
      - '.github/workflows/readonly-postcheck-two-colors-23-20261016.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure pinned read-only production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_BASE_REF" == 'main' ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          node --check scripts/ops/readonly-postcheck-two-colors-23-20261016.mjs
          cat > "$RUNNER_TEMP/production-color23-independent.jsonc" <<'CFG'
          {
            "name": "orders-app-select-only-color23-check",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/production-color23-independent.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Independently verify both refs, all 23 variants, stock/reserves and order FTS
        run: node scripts/ops/readonly-postcheck-two-colors-23-20261016.mjs
