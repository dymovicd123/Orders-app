name: Branch2 D1 R4 sync validate

on:
  push:
    branches: [safe/branch2-d1-r4-sync-20260902]
    paths:
      - scripts/.branch2-d1-r4-sync-trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact R4 source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff 89c6b3246a32e77b91b560f020fe77a63eecf3e0 3214a73a1480b85b6857ee57042f83b8e63c7cc6 -- \
            src/App.tsx \
            worker/domains/orders-read.ts \
            scripts/test-d1-read-budget-r4.mjs \
            scripts/d1-read-budget-r4-worker-manifest.json > /tmp/d1-r4-source.patch
          git apply --check /tmp/d1-r4-source.patch
          git apply /tmp/d1-r4-source.patch
          python3 scripts/apply-branch2-d1-r4-sync.py
      - name: TypeScript
        run: npm run typecheck
      - name: Full Branch2 release gate
        run: npm run release:check
      - name: Database safety
        run: npm run verify:db-safety
      - name: Clean production build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated R4 sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "branch2-r4-validation"
          git config user.email "branch2-r4-validation@users.noreply.github.com"
          git add src/App.tsx worker/domains/orders-read.ts package.json \
            scripts/test-d1-read-budget-r4.mjs scripts/d1-read-budget-r4-worker-manifest.json \
            scripts/test-step1906a-worker-modularization.mjs
          git diff --cached --check
          git commit -m "Sync D1 read budget R4 to Branch2"
          git push origin HEAD:safe/branch2-d1-r4-sync-20260902
