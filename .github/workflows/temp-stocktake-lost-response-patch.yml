name: Temporary stocktake lost-response gate

on:
  push:
    branches:
      - branch2
    paths:
      - .github/workflows/temp-stocktake-lost-response-patch.yml
      - scripts/temp-stocktake-lost-response-patch.py
      - scripts/temp-stocktake-1906a-allowlist.py
      - scripts/temp-stocktake-1906b-allowlist.py
      - scripts/temp-generate-stocktake-lost-response-manifest.mjs
      - scripts/temp-generate-stocktake-lost-response-frontend-manifest.mjs

permissions:
  contents: read
  statuses: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mark gate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"stocktake-lost-response-gate\",\"description\":\"Applying patch and running full release gate\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply audited patch in runner only
        run: |
          python3 scripts/temp-stocktake-lost-response-patch.py
          python3 scripts/temp-stocktake-1906a-allowlist.py
          python3 scripts/temp-stocktake-1906b-allowlist.py

      - name: Install dependencies
        run: npm ci

      - name: Generate exact preservation hashes
        run: |
          node scripts/temp-generate-stocktake-lost-response-manifest.mjs
          node scripts/temp-generate-stocktake-lost-response-frontend-manifest.mjs

      - name: Full release gate
        run: npm run release:check

      - name: Verify patch diff
        run: git diff --check

      - name: Package verified files
        run: |
          mkdir -p artifact/src/app/controllers artifact/worker/domains artifact/scripts
          cp src/app/controllers/useApiClient.ts artifact/src/app/controllers/useApiClient.ts
          cp worker/domains/inventory-stocktake.ts artifact/worker/domains/inventory-stocktake.ts
          cp scripts/test-step192a1-warehouse-truth-freshness.mjs artifact/scripts/test-step192a1-warehouse-truth-freshness.mjs
          cp scripts/test-step1906a-worker-modularization.mjs artifact/scripts/test-step1906a-worker-modularization.mjs
          cp scripts/test-step1906b-frontend-modularization.mjs artifact/scripts/test-step1906b-frontend-modularization.mjs
          cp scripts/stocktake-lost-response-worker-manifest.json artifact/scripts/stocktake-lost-response-worker-manifest.json
          cp scripts/stocktake-lost-response-frontend-manifest.json artifact/scripts/stocktake-lost-response-frontend-manifest.json
          git diff -- src/app/controllers/useApiClient.ts worker/domains/inventory-stocktake.ts scripts/test-step192a1-warehouse-truth-freshness.mjs scripts/test-step1906a-worker-modularization.mjs scripts/test-step1906b-frontend-modularization.mjs scripts/stocktake-lost-response-worker-manifest.json scripts/stocktake-lost-response-frontend-manifest.json > artifact/stocktake-lost-response.diff

      - name: Upload verified patch
        uses: actions/upload-artifact@v4
        with:
          name: stocktake-lost-response-verified
          path: artifact
          if-no-files-found: error
          retention-days: 1

      - name: Mark gate success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"stocktake-lost-response-gate\",\"description\":\"Patch passed full release gate\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Mark gate failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"stocktake-lost-response-gate\",\"description\":\"Patch or release gate failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
