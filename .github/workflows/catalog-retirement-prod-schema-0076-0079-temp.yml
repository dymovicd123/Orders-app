name: Temporary Production Catalog retirement schema 0076-0079

on:
  push:
    branches:
      - release/catalog-retirement-main-20260930
    paths:
      - '.github/workflows/catalog-retirement-prod-schema-0076-0079-temp.yml'

permissions:
  contents: read

jobs:
  apply:
    name: Apply Production Catalog retirement schema only
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard-lock Production identity and exact migration scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "release/catalog-retirement-main-20260930" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
          ! grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          for migration in             migrations/0076_v72_catalog_safe_retirement.sql             migrations/0077_v72_catalog_safe_restore.sql             migrations/0078_v72_catalog_restore_resumability.sql             migrations/0079_v72_catalog_granular_retirement_history.sql; do
            [[ -f "$migration" ]]
          done
          # Explicitly refuse Stage03 schema in this rollout.
          [[ ! -f migrations/0073_v72_order_item_pricing_foundation.sql ]]
          [[ ! -f migrations/0074_v72_retained_order_pricing_mode.sql ]]
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Preflight schema and capture business fingerprint
        shell: bash
        run: |
          set -euo pipefail
          q() { npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "$1" --json; }
          schema="$(q "SELECT
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_operations') AS op_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_variants') AS variants_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_restores') AS restores_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_restore_variants') AS restore_variants_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_history_events') AS history_table,
            EXISTS(SELECT 1 FROM pragma_table_info('orders') WHERE name='pricing_mode') AS stage03_orders_pricing_mode,
            EXISTS(SELECT 1 FROM pragma_table_info('order_items') WHERE name='catalog_price_snapshot') AS stage03_item_snapshot;")"
          echo "$schema"
          for key in op_table variants_table restores_table restore_variants_table history_table stage03_orders_pricing_mode stage03_item_snapshot; do
            [[ "$(jq -r ".[0].results[0].$key" <<<"$schema")" == "0" ]]
          done

          integrity="$(q "SELECT
            (SELECT COUNT(*) FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
              WHERE v.is_active=1 AND p.is_active=1
                AND ((p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,'')))='МУЖ')
                  OR (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,'')))='ЖЕН'))) AS active_gender_mismatch,
            (SELECT COUNT(*) FROM catalog_variants v WHERE v.is_active=0 AND (
              EXISTS (SELECT 1 FROM inventory_stock s WHERE s.variant_id=v.id AND (COALESCE(s.quantity,0)<>0 OR COALESCE(s.reserved_quantity,0)<>0))
              OR EXISTS (SELECT 1 FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active' AND COALESCE(r.quantity,0)<>0)
            )) AS inactive_live_state;")"
          echo "$integrity"
          [[ "$(jq -r '.[0].results[0].active_gender_mismatch' <<<"$integrity")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].inactive_live_state' <<<"$integrity")" == "0" ]]

          fingerprint="$(q "SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COUNT(*) FROM inventory_reservations) AS reservations_count,
            (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_total,
            (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS stock_reserved_total,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_reservations WHERE status='active') AS active_reserved_total,
            (SELECT COUNT(*) FROM catalog_products WHERE is_active=1) AS active_products,
            (SELECT COUNT(*) FROM catalog_variants WHERE is_active=1) AS active_variants;")"
          echo "$fingerprint"
          jq -cS '.[0].results[0]' <<<"$fingerprint" > /tmp/catalog-schema-before.json
      - name: Apply 0076 safe retirement schema
        run: npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file migrations/0076_v72_catalog_safe_retirement.sql
      - name: Apply 0077 safe restore schema
        run: npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file migrations/0077_v72_catalog_safe_restore.sql
      - name: Apply 0078 restore resumability invariant
        run: npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file migrations/0078_v72_catalog_restore_resumability.sql
      - name: Apply 0079 granular retirement history schema
        run: npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file migrations/0079_v72_catalog_granular_retirement_history.sql
      - name: Verify exact schema and unchanged business fingerprint
        shell: bash
        run: |
          set -euo pipefail
          q() { npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "$1" --json; }
          schema="$(q "SELECT
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_operations') AS op_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_variants') AS variants_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_restores') AS restores_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_restore_variants') AS restore_variants_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_history_events') AS history_table,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='index' AND name='idx_catalog_retirement_restores_single_started') AS restore_single_started_index,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='index' AND name='idx_catalog_retirement_history_events_created') AS history_created_index,
            EXISTS(SELECT 1 FROM pragma_table_info('orders') WHERE name='pricing_mode') AS stage03_orders_pricing_mode,
            EXISTS(SELECT 1 FROM pragma_table_info('order_items') WHERE name='catalog_price_snapshot') AS stage03_item_snapshot;")"
          echo "$schema"
          for key in op_table variants_table restores_table restore_variants_table history_table restore_single_started_index history_created_index; do
            [[ "$(jq -r ".[0].results[0].$key" <<<"$schema")" == "1" ]]
          done
          [[ "$(jq -r '.[0].results[0].stage03_orders_pricing_mode' <<<"$schema")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].stage03_item_snapshot' <<<"$schema")" == "0" ]]

          after="$(q "SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COUNT(*) FROM inventory_reservations) AS reservations_count,
            (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_total,
            (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS stock_reserved_total,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_reservations WHERE status='active') AS active_reserved_total,
            (SELECT COUNT(*) FROM catalog_products WHERE is_active=1) AS active_products,
            (SELECT COUNT(*) FROM catalog_variants WHERE is_active=1) AS active_variants;")"
          echo "$after"
          before="$(cat /tmp/catalog-schema-before.json)"
          now="$(jq -cS '.[0].results[0]' <<<"$after")"
          [[ "$now" == "$before" ]] || {
            echo "Business fingerprint changed while applying retirement schema." >&2
            echo "Before: $before" >&2
            echo "After:  $now" >&2
            exit 30
          }
          echo "Production Catalog retirement schema 0076-0079 applied safely; Stage03 schema remains off."
