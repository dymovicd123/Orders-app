name: Branch2 warehouse reservation and pending-inbound forensic SELECT
on:
  push:
    branches: [audit/branch2-warehouse-barcode-readiness-20261030]
    paths:
      - '.github/workflows/warehouse-reservation-lifecycle-readonly-once-20261030.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Strict Branch2 D1 SELECT-only investigation, no customer fields
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/warehouse-reservation-lifecycle-chain-readonly-20261030.mjs
          node scripts/ops/warehouse-reservation-lifecycle-chain-readonly-20261030.mjs
