name: R5.6 declaration hash

on:
  push:
    branches: [safe/d1-read-budget-r5-6-release-20260904]
    paths: [scripts/.r5-6-hash-trigger]

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Compute exact declaration hashes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const sha = (v) => crypto.createHash('sha256').update(v).digest('hex')
          const normalize = (t) => t.replace(/^export\s+/, '')
          const names = (s) => {
            if ((ts.isFunctionDeclaration(s)||ts.isClassDeclaration(s)||ts.isInterfaceDeclaration(s)||ts.isTypeAliasDeclaration(s)||ts.isEnumDeclaration(s)) && s.name) return [s.name.text]
            if (ts.isVariableStatement(s)) return s.declarationList.declarations.flatMap(d => ts.isIdentifier(d.name) ? [d.name.text] : [])
            return []
          }
          const patches = new Map([
            ['worker/domains/references.ts', ["AND COALESCE(oi.stock_writeoff_status, '') IN ('writeoff_disabled', 'pending_manual_writeoff')", "AND oi.stock_writeoff_status IN ('writeoff_disabled', 'pending_manual_writeoff')"]],
            ['worker/domains/orders-read.ts', ['WHERE COALESCE(is_workshop, 0) = 1\n        GROUP BY order_id', 'WHERE is_workshop = 1\n        GROUP BY order_id']],
          ])
          for (const [file,[oldText,newText]] of patches) {
            const before = fs.readFileSync(file,'utf8')
            if (before.split(oldText).length !== 2) throw new Error(`${file}: patch anchor count != 1`)
            const after = before.replace(oldText,newText)
            for (const [label,text] of [['BEFORE',before],['AFTER',after]]) {
              const source = ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS)
              for (const st of source.statements) {
                const body = normalize(st.getText(source))
                if (body.includes(label === 'BEFORE' ? oldText : newText)) {
                  for (const name of names(st)) console.log(`R56_HASH file=${file} declaration=${name} state=${label} sha=${sha(body)}`)
                }
              }
            }
          }
          NODE
