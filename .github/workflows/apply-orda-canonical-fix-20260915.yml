name: Apply ORDA canonical resolver fix

on:
  push:
    branches:
      - fix/orda-canonical-merge-20260915
    paths:
      - .github/workflows/apply-orda-canonical-fix-20260915.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orda-canonical-merge-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source patch
        run: python scripts/apply-orda-canonical-resolver-20260915.py
      - name: Install dependencies
        run: npm ci
      - name: Build exact preservation manifest
        run: node scripts/write-orda-canonical-worker-manifest-20260915.mjs
      - name: Focused regression
        run: node scripts/test-arrival-canonical-product-alias-r1.mjs
      - name: Full release gate
        run: npm run release:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit validated source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name dymovicd123
          git config user.email dymovicd@gmail.com
          git add worker/domains/inventory-movement.ts scripts/test-arrival-canonical-product-alias-r1.mjs scripts/arrival-canonical-product-alias-r1-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs package.json
          git diff --cached --check
          git commit -m "Fix arrival canonical product alias resolution"
          git push origin HEAD:fix/orda-canonical-merge-20260915
