name: Main Resolver H2 same-attribute SKU identity guard
on:
  push:
    branches: [fix/main-resolver-h2-last-fixes-20261120]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolver-h2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: H2 saved active SKU and original historical line test
        run: node scripts/test-resolver-archived-same-sku-relink-20261120.mjs
      - name: Order editing and shipment regressions
        run: |
          set -euo pipefail
          node scripts/test-branch2-mixed-order-editor-snapshot-20261108.mjs
          node scripts/test-resolver-report-followup-20261118.mjs
          node scripts/test-legacy-mixed-prior-issued-shipping-20261118.mjs
          node scripts/test-resolver-return-identity-20261118.mjs
      - name: Production build
        run: npm run build
