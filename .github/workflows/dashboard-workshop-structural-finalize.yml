name: Dashboard workshop structural finalize

on:
  push:
    branches:
      - dashboard-workshop-attention-r1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-workshop-attention-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git fetch origin main
      - name: Register exact Worker deltas
        run: node scripts/tmp-dashboard-workshop-structural-finalize.mjs
      - name: Run focused and 1906A
        run: |
          node scripts/test-dashboard-workshop-attention-r1.mjs
          node scripts/test-step1906a-worker-modularization.mjs
      - name: Commit structural registration and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-workshop-structural-finalize.yml scripts/tmp-dashboard-workshop-structural-finalize.mjs
          git add scripts/dashboard-workshop-attention-r1-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          git commit -m "Register dashboard workshop structural delta"
          git push origin HEAD:dashboard-workshop-attention-r1
