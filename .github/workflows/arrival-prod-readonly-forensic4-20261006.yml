name: Arrival Production read-only forensic 4 2026-10-06

on:
  push:
    branches:
      - diag-arrival-prod-20261006
    paths:
      - '.github/workflows/arrival-prod-readonly-forensic4-20261006.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard-stop on Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "diag-arrival-prod-20261006" ]]
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Trace Blue Bomber origin
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT p.id, p.name, p.external_id, p.category, p.gender_scope, p.is_active, p.created_at, p.updated_at,
                   (SELECT COUNT(*) FROM catalog_stock_positions sp WHERE sp.product_id=p.id) AS execution_count,
                   (SELECT COUNT(*) FROM catalog_variants v WHERE v.product_id=p.id) AS variant_count,
                   (SELECT COUNT(*) FROM inventory_movements m WHERE m.product_id=p.id AND m.movement_type='arrival') AS arrival_count
            FROM catalog_products p
            WHERE p.name='СИНИЙ БОМБЕР';
          " --json
