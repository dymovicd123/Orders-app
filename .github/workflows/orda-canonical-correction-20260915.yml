name: ORDA canonical correction 20260915

on:
  push:
    branches:
      - ops/orda-canonical-correction-20260915
    paths:
      - .github/workflows/orda-canonical-correction-20260915.yml
      - scripts/orda-canonical-correction-20260915.py

permissions:
  contents: read

jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      MODE: apply
    steps:
      - uses: actions/checkout@v4
      - name: Harden one-shot correction checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/orda-canonical-correction-20260915.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('r.get("reserved_qty")', 'r.get("reserved_quantity")')
          old = '("inventory_stock", [("product_id", "43"), ("stock_position_id", "97"), ("product_name", "\'ОРДА ШАПАН\'"), ("updated_at", "CURRENT_TIMESTAMP")]),'
          new = '("inventory_stock", [("product_id", "43"), ("stock_position_id", "97"), ("product_name", "\'ОРДА ШАПАН\'"), ("product_name_snapshot", "\'ОРДА ШАПАН\'"), ("updated_at", "CURRENT_TIMESTAMP")]),'
          if old not in text:
              raise SystemExit('inventory_stock mapping anchor missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Guarded ORDA canonical correction
        run: python3 scripts/orda-canonical-correction-20260915.py
