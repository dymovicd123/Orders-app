name: Branch2 continuous stocktake SKU 0142 guarded publish (NO Main)
on:
  push:
    branches: [branch2]
    paths:
      - .github/workflows/branch2-stocktake-fast-sku-controlled-release-20261118.yml
permissions:
  contents: read
concurrency:
  group: branch2-controlled-worker-deployment
  cancel-in-progress: false
jobs:
  branch2-only:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Strict source, parent and Branch2-only target guard
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '06d174533557873a17186669797f1d61b0403673'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/branch2-stocktake-fast-sku-controlled-release-20261118.yml'
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          assert cfg['name']=='orders-app-branch2'
          assert cfg['main']=='worker/index.ts'
          assert cfg.get('env') is None
          assert cfg['d1_databases']==[{
            'binding':'DB','database_name':'orders_db_branch2_mirror_20261027',
            'database_id':'0904a573-21ff-44d8-93b0-c9200f771702'
          }]
          assert cfg.get('vars',{}).get('RETURN_V2_ENABLED')=='true'
          sql=Path('migrations/0142_barcode_stocktake_sku_scans.sql').read_text()
          assert 'inventory_stocktake_sku_scans' in sql and 'trg_stocktake_sku_scan_apply' in sql
          assert 'UPDATE inventory_stock\n' not in sql and 'DELETE FROM inventory_stock' not in sql
          cfg['keep_vars']=True
          cfg['send_metrics']=False
          Path('.branch2-stocktake-fast-sku-release.jsonc').write_text(json.dumps(cfg,indent=2)+'\n')
          print('STRICT_BRANCH2_D1_ONLY_AND_ADDITIVE_0142_PASS')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Security audits remain active
        run: |
          npm audit --omit=dev --audit-level=moderate
          node scripts/test-security-dependency-audit-20261117.mjs
          node scripts/security-dependency-audit-20261117.mjs
      - name: Validate fast continuous SKU count, editability, existing stocktake, Return V2 and build
        run: |
          set -euo pipefail
          node scripts/test-stocktake-fast-sku-20261118.mjs
          node scripts/test-stocktake-barcode-scan-20261117.mjs
          node scripts/test-arrival-stocktake-shared-sku-20261117.mjs
          node scripts/test-stocktake-mobile-camera-and-layout-20261117.mjs
          node scripts/test-stocktake-camera-print-step-20261117.mjs
          node scripts/test-stocktake-found-labels-20261117.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
          node scripts/test-warehouse-return-exchange-receiving-20261117.mjs
          node scripts/test-return-v2-immediate-intake-20261114.mjs
          node scripts/test-barcode-operation-unit-20261117.mjs
          node scripts/test-barcode-no-hardware-20261117.mjs
          node scripts/test-warehouse-receiving-barcode-finder-20261117.mjs
          npm run build
      - name: Branch2 Worker dry-run (no Cloudflare writes)
        run: |
          npx --no-install wrangler deploy --config .branch2-stocktake-fast-sku-release.jsonc --name orders-app-branch2 --keep-vars --strict --dry-run --outdir .branch2-fast-sku-preview
      - name: Verify live test Worker bindings and secret (read only)
        run: python3 scripts/branch2-dds-0139-release-guard-20261117.py worker-after
      - name: Confirm unit scan schema exists and SKU 0142 is unapplied (read only)
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_stocktake_unit_scan_apply') AS unit_guard,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='inventory_stocktake_unit_scans') AS unit_table,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='inventory_stocktake_sku_scans') AS sku_table,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_stocktake_sku_scan_apply') AS sku_guard
          " > /tmp/stocktake-sku-0142-before.json
          jq -e '.[0].results[0] | .unit_guard==1 and .unit_table==1 and .sku_table==0 and .sku_guard==0' /tmp/stocktake-sku-0142-before.json
      - name: Fingerprint original Branch2 stock, reserves, orders and stocktakes (read only)
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_units,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_units,
              (SELECT COUNT(*) FROM inventory_stocktake_sessions) AS stocktakes,
              (SELECT COUNT(*) FROM inventory_stocktake_items) AS stocktake_items,
              (SELECT COALESCE(SUM(counted_quantity),0) FROM inventory_stocktake_items) AS stocktake_counted,
              (SELECT COUNT(*) FROM inventory_stocktake_unit_scans) AS individual_scans,
              (SELECT COUNT(*) FROM inventory_units) AS physical_unit_rows,
              (SELECT COUNT(*) FROM inventory_unit_labels) AS label_rows,
              (SELECT COUNT(*) FROM orders) AS order_rows,
              (SELECT COUNT(*) FROM order_items) AS order_item_rows
          " | jq -S '.[0].results[0]' > /tmp/stocktake-sku-business-before.json
          test -s /tmp/stocktake-sku-business-before.json
      - name: Capture isolated D1 recovery bookmark, without restoring or writing
        run: |
          set -euo pipefail
          umask 077
          curl --fail-with-body -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/0904a573-21ff-44d8-93b0-c9200f771702/time_travel/bookmark" |
            jq -er 'if .success==true and (.result.bookmark|type=="string") and (.result.bookmark|length>=32) then .result.bookmark else error("Missing test D1 recovery bookmark") end' > /tmp/stocktake-sku-0142-bookmark
          test -s /tmp/stocktake-sku-0142-bookmark
          echo 'Branch2 test D1 Time Travel bookmark captured. No Main writes.' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply ONLY additive schema migration 0142 to test D1
        run: |
          set -euo pipefail
          test -s /tmp/stocktake-sku-0142-bookmark
          test "$(git rev-parse HEAD^)" = '06d174533557873a17186669797f1d61b0403673'
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --yes --file migrations/0142_barcode_stocktake_sku_scans.sql
      - name: Verify SKU ledger and its three triggers are empty and installed
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='inventory_stocktake_sku_scans') AS table_count,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN (
                'trg_stocktake_sku_scan_apply','trg_stocktake_sku_scan_no_update',
                'trg_stocktake_sku_scan_no_delete')) AS guard_count,
              (SELECT COUNT(*) FROM inventory_stocktake_sku_scans) AS stored_events
          " > /tmp/stocktake-sku-0142-after.json
          jq -e '.[0].results[0] | .table_count==1 and .guard_count==3 and .stored_events==0' /tmp/stocktake-sku-0142-after.json
      - name: Assert baseline business data unchanged by migration
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_units,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_units,
              (SELECT COUNT(*) FROM inventory_stocktake_sessions) AS stocktakes,
              (SELECT COUNT(*) FROM inventory_stocktake_items) AS stocktake_items,
              (SELECT COALESCE(SUM(counted_quantity),0) FROM inventory_stocktake_items) AS stocktake_counted,
              (SELECT COUNT(*) FROM inventory_stocktake_unit_scans) AS individual_scans,
              (SELECT COUNT(*) FROM inventory_units) AS physical_unit_rows,
              (SELECT COUNT(*) FROM inventory_unit_labels) AS label_rows,
              (SELECT COUNT(*) FROM orders) AS order_rows,
              (SELECT COUNT(*) FROM order_items) AS order_item_rows
          " | jq -S '.[0].results[0]' > /tmp/stocktake-sku-business-after.json
          diff -u /tmp/stocktake-sku-business-before.json /tmp/stocktake-sku-business-after.json
          echo 'STOCKTAKE_0142_BUSINESS_DATA_UNCHANGED_PASS'
      - name: Deploy ONLY test Worker with existing secrets preserved
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --config .branch2-stocktake-fast-sku-release.jsonc --name orders-app-branch2 --keep-vars --strict
      - name: Verify live test Worker D1 binding after publish (read only)
        run: python3 scripts/branch2-dds-0139-release-guard-20261117.py worker-after
      - name: Public Branch2 health, HTML and JS asset smoke
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.error
          base='https://orders-app-branch2.orders-clothes.workers.dev'
          def get(path):
              for attempt in range(10):
                  try:
                      req=urllib.request.Request(base+path,headers={'User-Agent':'Branch2FastStocktakeSKU/1.0'})
                      with urllib.request.urlopen(req,timeout=25) as res:
                          if res.status==200:return res.read()
                  except Exception as error:
                      print('BRANCH2_SMOKE_RETRY',path,attempt+1,type(error).__name__)
                  time.sleep(3)
              raise SystemExit('BRANCH2_SMOKE_FAILED '+path)
          health=json.loads(get('/api/health'))
          if health.get('ok') is not True:raise SystemExit('HEALTH_NOT_OK')
          page=get('/').decode('utf8','replace')
          if '<html' not in page.lower():raise SystemExit('ROOT_NOT_HTML')
          match=re.search(r'<script[^>]*src="(/assets/[^"]+)"',page)
          if not match:raise SystemExit('JS_NOT_FOUND')
          asset=get(match.group(1))
          if len(asset)<1000 or asset.lstrip().lower().startswith(b'<!doctype html'):raise SystemExit('JS_NOT_OK')
          print('BRANCH2_STOCKTAKE_FAST_SKU_RELEASE_VERIFIED_NO_MAIN_WRITES')
          PY
