name: Read-only Ethno Cardigan cost diagnosis 2026-10-22
on:
  push:
    branches:
      - audit/read-only-ethno-cost-20261022
    paths:
      - '.github/workflows/readonly-ethno-cost-20261022.yml'
      - 'scripts/ops/readonly-ethno-cost-20261022.mjs'
permissions:
  contents: read
jobs:
  production-select-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check fixed read-only diagnostic without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'audit/read-only-ethno-cost-20261022'
          node --check scripts/ops/readonly-ethno-cost-20261022.mjs
          grep -Fq "orders_db_prod" wrangler.jsonc
          grep -Fq "17e68a41-1d58-4a36-8a63-47c3e32443c4" wrangler.jsonc
      - run: npm ci
      - name: Read exact execution price rows and possible September snapshot (NO WRITE)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node scripts/ops/readonly-ethno-cost-20261022.mjs
