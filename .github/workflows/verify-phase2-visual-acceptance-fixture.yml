name: Verify Phase 2 visual acceptance fixture

on:
  push:
    branches:
      - tmp/phase2-acceptance-source
    paths:
      - .github/workflows/verify-phase2-visual-acceptance-fixture.yml
      - scripts/apply-phase2-visual-acceptance-fixture.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/phase2-acceptance-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply acceptance fixture
        run: python3 scripts/apply-phase2-visual-acceptance-fixture.py
      - name: Verify fixture scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "src/App.tsx"
          ! git diff -- src/App.tsx | grep -E "inventoryArrival|Приход" >/dev/null
      - name: Install dependencies
        run: npm ci
      - name: Full release gate
        run: npm run release:check
      - name: Commit tested temporary fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-phase2-visual-acceptance-fixture.py .github/workflows/verify-phase2-visual-acceptance-fixture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add temporary Phase 2 visual acceptance fixture"
          git push origin HEAD:tmp/phase2-acceptance-source
