name: Apply Catalog Gender Cleanup R1

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - scripts/apply-catalog-gender-cleanup-r1.mjs
      - .github/workflows/apply-catalog-gender-cleanup-r1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0

      - name: Harden patch semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/apply-catalog-gender-cleanup-r1.mjs')
          s = p.read_text()

          def swap(old: str, new: str, label: str):
              global s
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found')
              s = s.replace(old, new, 1)

          # Product gender is a default. A concrete human selection always wins.
          swap('-- Product-level gender is authoritative:', '-- Product-level gender is the default used by forms, not a hard constraint:', 'migration semantics')
          swap('-- Build a deterministic map for wrong/blank variants of fixed-scope products.', '-- Build a deterministic map only for blank variants of products with a known default.', 'cleanup semantics')
          swap("  AND UPPER(TRIM(COALESCE(v.gender,''))) <> CASE p.gender_scope WHEN 'female' THEN 'ЖЕН' ELSE 'МУЖ' END;", "  AND TRIM(COALESCE(v.gender,''))='';", 'blank-only repair')

          swap(
              "  const fixed = catalogGenderForProductScope(scope);\\n  if (fixed) return { scope, gender: fixed };\\n  const gender = normalizeCatalogCombinationGender(value);\\n  if (gender !== 'ЖЕН' && gender !== 'МУЖ') {",
              "  const explicitGender = normalizeCatalogCombinationGender(value);\\n  if (explicitGender === 'ЖЕН' || explicitGender === 'МУЖ') return { scope, gender: explicitGender };\\n  const fixed = catalogGenderForProductScope(scope);\\n  if (fixed) return { scope, gender: fixed };\\n  const gender = explicitGender;\\n  if (gender !== 'ЖЕН' && gender !== 'МУЖ') {",
              'backend override semantics',
          )

          # createCatalogCombinationV3 already receives the resolved concrete gender.
          # Do not add another product lookup to this hot helper.
          hot_patch = '''replaceOnce('worker/domains/catalog.ts',
            "  const gender = normalizeCatalogCombinationGender(input.gender);\\n  const color = normalizeCatalogCombinationColor(input.color);\\n  const sizeLabel = normalizeCatalogCombinationSize(input.sizeLabel);",
            "  const genderResolution = await resolveCatalogGenderForProduct(db, input.productId, input.gender);\\n  const gender = genderResolution.gender;\\n  const color = normalizeCatalogCombinationColor(input.color);\\n  const sizeLabel = normalizeCatalogCombinationSize(input.sizeLabel);",
          )
          '''
          if hot_patch not in s:
              raise SystemExit('hot combination patch: anchor not found')
          s = s.replace(hot_patch, '', 1)

          # Order resolver pays for a product-default read only when the operator left gender blank.
          swap(
              "  const productGenderScope = await getCatalogProductGenderScope(db, product.id);\\n  const gender = catalogGenderForProductScope(productGenderScope) || normalizeCatalogCombinationGender(item.gender);\\n  if (productGenderScope === 'unisex' && gender !== 'ЖЕН' && gender !== 'МУЖ') {\\n    return { productId: toInt(product.id, 0) || null, variantId: null, matchStatus: 'unresolved_attribute', inputKey };\\n  }\\n  const rawColor = upperText(item.color);",
              "  const enteredGender = normalizeCatalogCombinationGender(item.gender);\\n  let gender = enteredGender;\\n  if (!gender) {\\n    const productGenderScope = await getCatalogProductGenderScope(db, product.id);\\n    gender = catalogGenderForProductScope(productGenderScope);\\n    if (!gender) {\\n      return { productId: toInt(product.id, 0) || null, variantId: null, matchStatus: 'unresolved_attribute', inputKey };\\n    }\\n  }\\n  const rawColor = upperText(item.color);",
              'order resolver override',
          )

          # Frontend availability follows the current human choice, falling back to the default only if blank.
          swap(
              "    const catalogProduct = resolveClientCatalogProduct(productName)\\n    const productGenderScope = String(catalogProduct?.genderScope || 'unisex') as 'female' | 'male' | 'unisex'\\n    const scopedItemGender = productGenderScope === 'female' ? 'ЖЕН' : productGenderScope === 'male' ? 'МУЖ' : canonicalOrderGender(item.gender)\\n    const resolvedProductName = catalogProduct?.name || productName",
              "    const catalogProduct = resolveClientCatalogProduct(productName)\\n    const productGenderScope = String(catalogProduct?.genderScope || 'unisex') as 'female' | 'male' | 'unisex'\\n    const automaticGender = productGenderScope === 'female' ? 'ЖЕН' : productGenderScope === 'male' ? 'МУЖ' : ''\\n    const scopedItemGender = canonicalOrderGender(item.gender) || automaticGender\\n    const resolvedProductName = catalogProduct?.name || productName",
              'availability override',
          )

          # Narrow an otherwise non-unique order-form anchor.
          old = '''replaceOnce('src/app/controllers/useWorkspaceViewModel.tsx',
            "        gender: '',\\n        color: '',\\n        material: 'СТАНДАРТ',",
            "        gender: automaticGender,\\n        color: '',\\n        material: 'СТАНДАРТ',",
          )'''
          new = '''replaceOnce('src/app/controllers/useWorkspaceViewModel.tsx',
            "    if (!variants.length) {\\n      return {\\n        ...currentItem,\\n        productName: product.name,\\n        audienceType: getCatalogProductEffectiveCategory(product) === 'child' ? 'ДЕТСКИЙ' : 'ВЗРОСЛЫЙ',\\n        gender: '',\\n        color: '',\\n        material: 'СТАНДАРТ',",
            "    if (!variants.length) {\\n      return {\\n        ...currentItem,\\n        productName: product.name,\\n        audienceType: getCatalogProductEffectiveCategory(product) === 'child' ? 'ДЕТСКИЙ' : 'ВЗРОСЛЫЙ',\\n        gender: automaticGender,\\n        color: '',\\n        material: 'СТАНДАРТ',",
          )'''
          swap(old, new, 'workspace no-variant anchor')

          # Update Arrival anchor to the actual current controller shape.
          old = '''replaceOnce('src/app/controllers/useOperationalViewModel.ts',
            "    const variants = (catalogVariantsByProductId.get(Number(match.id)) || []).filter((variant) => variant.isActive)\\n    const first = variants[0]\\n    setInventoryArrivalPositions((current) => current.map((position) => position.id === id ? {\\n      ...position,\\n      productInput: match.name,\\n      productId: Number(match.id),\\n      category: first ? getCatalogVariantCategory(first) : getCatalogProductEffectiveCategory(match),\\n      gender: first?.gender || position.gender,",
            "    const variants = (catalogVariantsByProductId.get(Number(match.id)) || []).filter((variant) => variant.isActive)\\n    const first = variants[0]\\n    const productGenderScope = String(match.genderScope || 'unisex')\\n    const automaticGender = productGenderScope === 'female' ? 'ЖЕН' : productGenderScope === 'male' ? 'МУЖ' : ''\\n    setInventoryArrivalPositions((current) => current.map((position) => position.id === id ? {\\n      ...position,\\n      productInput: match.name,\\n      productId: Number(match.id),\\n      category: first ? getCatalogVariantCategory(first) : getCatalogProductEffectiveCategory(match),\\n      gender: automaticGender,",
          )'''
          new = '''replaceOnce('src/app/controllers/useOperationalViewModel.ts',
            "    const variants = catalogVariantsByProductId.get(Number(match.id)) || []\\n    const first = variants.find((variant) => variant.isActive) || null\\n    setInventoryArrivalPositions((current) => current.map((position) => position.id === id ? {\\n      ...position,\\n      productId: String(match.id),\\n      productName: match.name,\\n      category: first ? getCatalogVariantCategory(first) : (match.category === 'child' ? 'child' : 'adult'),\\n      gender: first?.gender || position.gender,",
            "    const variants = catalogVariantsByProductId.get(Number(match.id)) || []\\n    const first = variants.find((variant) => variant.isActive) || null\\n    const productGenderScope = String(match.genderScope || 'unisex')\\n    const automaticGender = productGenderScope === 'female' ? 'ЖЕН' : productGenderScope === 'male' ? 'МУЖ' : ''\\n    setInventoryArrivalPositions((current) => current.map((position) => position.id === id ? {\\n      ...position,\\n      productId: String(match.id),\\n      productName: match.name,\\n      category: first ? getCatalogVariantCategory(first) : (match.category === 'child' ? 'child' : 'adult'),\\n      gender: automaticGender,",
          )'''
          swap(old, new, 'arrival source anchor')

          # Review/lifecycle preserve a concrete recorded choice; product scope is fallback only.
          swap("  if (product?.id) facts.gender = catalogGenderForProductScope(productGenderScope) || facts.gender;", "  if (product?.id) facts.gender = facts.gender || catalogGenderForProductScope(productGenderScope);", 'review context gender')
          swap("  const gender = catalogGenderForProductScope(requestedGenderScope || 'unisex') || normalizeCatalogCombinationGender(input.gender ?? anchor.gender_snapshot);", "  const gender = normalizeCatalogCombinationGender(input.gender ?? anchor.gender_snapshot) || catalogGenderForProductScope(requestedGenderScope || 'unisex');", 'review resolution gender')
          swap("  if (product?.id) facts.gender = catalogGenderForProductScope(productGenderScope) || facts.gender;", "  if (product?.id) facts.gender = facts.gender || catalogGenderForProductScope(productGenderScope);", 'lifecycle context gender')
          swap("  const gender = catalogGenderForProductScope(requestedGenderScope || 'unisex') || normalizeCatalogCombinationGender(input.gender ?? event.gender_snapshot);", "  const gender = normalizeCatalogCombinationGender(input.gender ?? event.gender_snapshot) || catalogGenderForProductScope(requestedGenderScope || 'unisex');", 'lifecycle resolution gender')

          # Focused test semantics. UI editability is asserted after the generated-source post-process.
          swap(
              "check(migration.includes(\"CASE p.gender_scope WHEN 'female' THEN 'ЖЕН' ELSE 'МУЖ' END\"), '0068 must repair fixed-scope variants')",
              "check(migration.includes(\"TRIM(COALESCE(v.gender,''))=''\"), '0068 must repair blank-gender variants')\\ncheck(!migration.includes(\"AND UPPER(TRIM(COALESCE(v.gender,''))) <> CASE p.gender_scope\"), '0068 must preserve explicit opposite-gender variants')",
              'migration test semantics',
          )
          swap(
              "check(resolver.includes(\"productGenderScope === 'unisex' && gender !== 'ЖЕН' && gender !== 'МУЖ'\"), 'Order resolver must not guess unisex gender')",
              "check(resolver.includes('const enteredGender = normalizeCatalogCombinationGender(item.gender)'), 'Order resolver must respect an explicit human gender')\\ncheck(resolver.includes('if (!gender) {\\n    const productGenderScope = await getCatalogProductGenderScope'), 'Order resolver may read product scope only for omitted gender')",
              'resolver test semantics',
          )

          p.write_text(s)
          PY

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply exact patch
        run: node scripts/apply-catalog-gender-cleanup-r1.mjs

      - name: Keep generated catalog defaults editable
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('src/features/inventory/views/renderInventoryCatalogPanel.tsx')
          s = panel.read_text()
          old = "<select disabled={Boolean(fixedGenderForProduct(selectedProduct))} value={fixedGenderForProduct(selectedProduct) || (catalogVariantDraft.productId === String(selectedProduct.id) ? catalogVariantDraft.gender : '')}"
          new = "<select value={catalogVariantDraft.productId === String(selectedProduct.id) ? (catalogVariantDraft.gender || fixedGenderForProduct(selectedProduct)) : fixedGenderForProduct(selectedProduct)}"
          if old not in s:
              raise SystemExit('generated catalog gender select anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "{fixedGenderForProduct(selectedProduct) ? 'Пол задан на уровне товара и подставляется автоматически.' : 'Унисекс: выберите пол этой конкретной комбинации.'}",
              "{fixedGenderForProduct(selectedProduct) ? 'Подставлено по товару. Если каталог ошибся, пол этой комбинации можно изменить.' : 'Унисекс: выберите пол этой конкретной комбинации.'}",
              1,
          )
          s = s.replace('gender: fixedGenderForProduct(product) || variant.gender,', 'gender: variant.gender || fixedGenderForProduct(product),', 1)
          panel.write_text(s)

          test = Path('scripts/test-catalog-gender-scope-r1.mjs')
          t = test.read_text()
          old_test = "check(panel.includes('disabled={Boolean(fixedGenderForProduct(selectedProduct))}'), 'Fixed-scope variant editor must not ask repeatedly')"
          if old_test not in t:
              raise SystemExit('generated UI acceptance anchor not found')
          t = t.replace(
              old_test,
              "check(!panel.includes('disabled={Boolean(fixedGenderForProduct(selectedProduct))}'), 'Product default must not lock the concrete gender field')\ncheck(panel.includes('можно изменить'), 'Catalog UI must explain that automatic gender remains editable')",
              1,
          )
          test.write_text(t)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Focused acceptance
        run: node scripts/test-catalog-gender-scope-r1.mjs

      - name: Build
        run: npm run build

      - name: Remove temporary patch driver
        run: |
          rm scripts/apply-catalog-gender-cleanup-r1.mjs
          rm .github/workflows/apply-catalog-gender-cleanup-r1.yml

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement editable catalog gender defaults and cleanup"
          git push origin HEAD:catalog-gender-cleanup-r1
