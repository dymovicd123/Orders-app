name: Apply Catalog Gender Cleanup R1

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - scripts/apply-catalog-gender-cleanup-r1.mjs
      - .github/workflows/apply-catalog-gender-cleanup-r1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply exact patch
        run: node scripts/apply-catalog-gender-cleanup-r1.mjs

      - name: Install dependencies
        run: npm ci

      - name: Focused acceptance
        run: node scripts/test-catalog-gender-scope-r1.mjs

      - name: Build
        run: npm run build

      - name: Remove temporary patch driver
        run: |
          rm scripts/apply-catalog-gender-cleanup-r1.mjs
          rm .github/workflows/apply-catalog-gender-cleanup-r1.yml

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement catalog gender scope and cleanup"
          git push origin HEAD:catalog-gender-cleanup-r1
