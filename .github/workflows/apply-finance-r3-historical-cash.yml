name: Apply finance R3 historical cash

on:
  push:
    branches:
      - fix/finance-r3-periods-cash-20260916

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-r3-periods-cash-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply historical cash patch
        run: python scripts/patch-finance-r3-historical-cash.py
      - name: Install dependencies
        run: npm ci
      - name: Focused finance regression
        run: node scripts/test-finance-day-transparency.mjs
      - name: Full cumulative gate
        run: npm run release:check
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff check
        run: git diff --check
      - name: Commit validated historical cash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/renderers/FinanceDashboardRenderer.tsx worker/index.ts scripts/test-finance-day-transparency.mjs scripts/finance-day-transparency-manifest.json
          if git diff --cached --quiet; then
            echo "No historical cash changes to commit"
            exit 0
          fi
          git commit -m "Add safe historical cash entry"
          git push origin HEAD:fix/finance-r3-periods-cash-20260916
