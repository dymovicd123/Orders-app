name: Stage01 Production readiness read-only audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: production-readiness-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      PROD_DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      BRANCH2_DB_ID: 40065052-854e-44b8-bcd5-251bdd488301
      EXPECTED_MAIN_SHA: 412ba8b4f2a72873232103944e2a3a777a6dbcd9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Production D1 migration ledger
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local sql="$1"
            curl --fail-with-body -sS               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"               "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_DB_ID/query"
          }
          ledger="$(query "SELECT id,name,applied_at FROM d1_migrations ORDER BY id;")"
          jq -e '.success == true and .result[0].success == true' <<<"$ledger" >/dev/null
          echo "$ledger" | jq '.result[0].results'
          summary="$(query "SELECT COUNT(*) AS migration_rows, MAX(id) AS max_id, MAX(name) AS max_name FROM d1_migrations;")"
          echo "$summary" | jq '.result[0].results[0]'

      - name: Inspect Production schema markers
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local sql="$1"
            curl --fail-with-body -sS               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"               "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_DB_ID/query"
          }
          objects="$(query "WITH expected(name) AS (VALUES
            ('inventory_stocktake_sessions'),
            ('inventory_lifecycle_events'),
            ('inventory_handover_reviews'),
            ('financial_events'),
            ('critical_operations'),
            ('order_search_items_fts'),
            ('idx_catalog_products_gender_scope'),
            ('idx_return_items_physical_receipt'),
            ('idx_exchange_items_physical_receipt'),
            ('trg_order_search_catalog_products_au'),
            ('trg_order_search_catalog_variants_au')
          )
          SELECT e.name, CASE WHEN sm.name IS NULL THEN 0 ELSE 1 END AS present, COALESCE(sm.type,'') AS type
          FROM expected e LEFT JOIN sqlite_master sm ON sm.name=e.name ORDER BY e.name;")"
          echo "$objects" | jq '.result[0].results'

          columns="$(query "SELECT
            EXISTS(SELECT 1 FROM pragma_table_info('catalog_products') WHERE name='gender_scope') AS gender_scope,
            EXISTS(SELECT 1 FROM pragma_table_info('return_items') WHERE name='physical_tracking') AS return_physical_tracking,
            EXISTS(SELECT 1 FROM pragma_table_info('exchange_items') WHERE name='physical_tracking') AS exchange_physical_tracking,
            EXISTS(SELECT 1 FROM pragma_table_info('order_items') WHERE name='inventory_obligation_key') AS inventory_obligation_key;")"
          echo "$columns" | jq '.result[0].results[0]'

      - name: Capture Production row-count baseline
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local sql="$1"
            curl --fail-with-body -sS               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"               "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$PROD_DB_ID/query"
          }
          counts="$(query "SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COUNT(*) FROM payments) AS payments_count,
            (SELECT COUNT(*) FROM returns) AS returns_count,
            (SELECT COUNT(*) FROM exchanges) AS exchanges_count,
            (SELECT COUNT(*) FROM workshop_tasks) AS workshop_tasks_count,
            (SELECT COUNT(*) FROM inventory_stock) AS inventory_stock_count,
            (SELECT COUNT(*) FROM inventory_reservations) AS inventory_reservations_count,
            (SELECT COUNT(*) FROM inventory_lifecycle_events) AS lifecycle_count;")"
          echo "$counts" | jq '.result[0].results[0]'

      - name: Verify Production covers Branch2 required schema before R14
        shell: bash
        run: |
          set -euo pipefail
          query_db() {
            local db_id="$1"
            local sql="$2"
            curl --fail-with-body -sS               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"               "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db_id/query"
          }

          objects_sql="SELECT type,name,tbl_name
            FROM sqlite_master
            WHERE name NOT LIKE 'sqlite_%'
              AND name NOT LIKE 'd1_%'
              AND name NOT LIKE '_cf_%'
              AND name NOT IN (
                'trg_order_search_items_ai',
                'trg_order_search_items_ad',
                'trg_order_search_items_au',
                'trg_order_search_catalog_products_au',
                'trg_order_search_catalog_variants_au'
              )
            ORDER BY type,name;"
          query_db "$PROD_DB_ID" "$objects_sql" | jq -S '.result[0].results' > /tmp/prod-objects.json
          query_db "$BRANCH2_DB_ID" "$objects_sql" | jq -S '.result[0].results' > /tmp/branch2-objects.json
          jq -r '.[] | [.type,.name,.tbl_name] | @tsv' /tmp/prod-objects.json | sort > /tmp/prod-objects.tsv
          jq -r '.[] | [.type,.name,.tbl_name] | @tsv' /tmp/branch2-objects.json | sort > /tmp/branch2-objects.tsv
          comm -23 /tmp/branch2-objects.tsv /tmp/prod-objects.tsv > /tmp/missing-objects.tsv
          echo "Branch2-required objects missing in Production:"
          cat /tmp/missing-objects.tsv
          test ! -s /tmp/missing-objects.tsv

          columns_sql="SELECT m.name AS table_name,p.name AS column_name,UPPER(COALESCE(p.type,'')) AS column_type,
            p.[notnull] AS not_null,COALESCE(p.dflt_value,'') AS default_value,p.pk AS pk
            FROM sqlite_master m, pragma_table_info(m.name) p
            WHERE m.type='table'
              AND m.name NOT LIKE 'sqlite_%'
              AND m.name NOT LIKE 'd1_%'
              AND m.name NOT LIKE '_cf_%'
            ORDER BY m.name,p.name;"
          query_db "$PROD_DB_ID" "$columns_sql" | jq -S '.result[0].results' > /tmp/prod-columns.json
          query_db "$BRANCH2_DB_ID" "$columns_sql" | jq -S '.result[0].results' > /tmp/branch2-columns.json
          jq -r '.[] | [.table_name,.column_name,.column_type,(.not_null|tostring),.default_value,(.pk|tostring)] | @tsv' /tmp/prod-columns.json | sort > /tmp/prod-columns.tsv
          jq -r '.[] | [.table_name,.column_name,.column_type,(.not_null|tostring),.default_value,(.pk|tostring)] | @tsv' /tmp/branch2-columns.json | sort > /tmp/branch2-columns.tsv
          comm -23 /tmp/branch2-columns.tsv /tmp/prod-columns.tsv > /tmp/missing-columns.tsv
          echo "Branch2-required column definitions missing in Production:"
          cat /tmp/missing-columns.tsv
          test ! -s /tmp/missing-columns.tsv

          meta_sql="SELECT 'inventory_model_meta' AS source,key,value FROM inventory_model_meta WHERE key IN ('human_inventory_v2','safe_early_handover_v1_guard')
            UNION ALL SELECT 'catalog_identity_meta',key,value FROM catalog_identity_meta WHERE key IN ('catalog_identity_v3','catalog_cleanup_188j','client_cleanup_188k2')
            UNION ALL SELECT 'app_settings',key,value FROM app_settings WHERE key='financial_history_model'
            ORDER BY source,key;"
          query_db "$PROD_DB_ID" "$meta_sql" | jq -S '.result[0].results' > /tmp/prod-meta.json
          query_db "$BRANCH2_DB_ID" "$meta_sql" | jq -S '.result[0].results' > /tmp/branch2-meta.json
          echo "Production migration markers:"
          cat /tmp/prod-meta.json
          echo "Branch2 migration markers:"
          cat /tmp/branch2-meta.json
          cmp -s /tmp/prod-meta.json /tmp/branch2-meta.json

      - name: Resolve Production URL and run read-only smoke
        shell: bash
        run: |
          set -euo pipefail
          subdomain="$(curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')"
          test -n "$subdomain"
          base="https://orders-app.$subdomain.workers.dev"
          echo "Production endpoint: $base"
          endpoints=(
            "/api/admin-mode/status"
            "/api/auth/me"
            "/api/dashboard"
            "/api/reference-data"
            "/api/orders?limit=5"
            "/api/workshop/counts"
            "/api/inventory/attention?details=0&limit=5"
            "/api/catalog"
          )
          for path in "${endpoints[@]}"; do
            code="$(curl -sS -o /tmp/prod-smoke.json -w '%{http_code}' "$base$path")"
            echo "$code $path"
            if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
              cat /tmp/prod-smoke.json >&2 || true
              exit 3
            fi
            jq -e 'type=="object" or type=="array"' /tmp/prod-smoke.json >/dev/null
          done
