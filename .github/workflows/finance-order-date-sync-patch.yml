name: Finance order date sync patch

on:
  push:
    branches:
      - finance-order-date-sync

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ contains(github.event.head_commit.message, '[date-sync-patched]') == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply late-order payment date guard
        shell: bash
        run: |
          set -euo pipefail

          declaration_hash() {
            node --input-type=module - "$1" "$2" <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const [file, target] = process.argv.slice(2)
          const text = fs.readFileSync(file, 'utf8')
          const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
          for (const statement of source.statements) {
            if ((ts.isFunctionDeclaration(statement) || ts.isClassDeclaration(statement) || ts.isInterfaceDeclaration(statement) || ts.isTypeAliasDeclaration(statement) || ts.isEnumDeclaration(statement)) && statement.name?.text === target) {
              const normalized = statement.getText(source).replace(/^export\s+/, '')
              console.log(crypto.createHash('sha256').update(normalized).digest('hex'))
              process.exit(0)
            }
          }
          throw new Error(`Declaration not found: ${target}`)
          NODE
          }

          BEFORE_HASH="$(declaration_hash worker/domains/orders-write.ts createOrder)"
          export BEFORE_HASH

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(f'{label}: already patched')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: marker not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{label}: patched')

          replace_once(
              'src/App.tsx',
              """  function updateCreateDraft<K extends keyof EditorDraft>(key: K, value: EditorDraft[K]) {\n    setCreateDraft((current) => ({ ...current, [key]: value }))\n  }""",
              """  function updateCreateDraft<K extends keyof EditorDraft>(key: K, value: EditorDraft[K]) {\n    setCreateDraft((current) => {\n      if (key === 'orderDate') {\n        const orderDate = String(value || '').trim()\n        return {\n          ...current,\n          [key]: value,\n          payments: current.payments.map((payment) => (\n            payment.paymentKind === 'primary'\n              ? { ...payment, paymentDate: orderDate || payment.paymentDate }\n              : payment\n          )),\n        }\n      }\n      return { ...current, [key]: value }\n    })\n  }""",
              'frontend order-date sync',
          )

          p = Path('worker/domains/orders-write.ts')
          text = p.read_text(encoding='utf-8')
          replacements = [
              (
                  "const normalizedPayments = normalizeOrderPayments(rawPayments, orderDate);",
                  """const normalizedPayments = normalizeOrderPayments(rawPayments, orderDate).map(payment => (\n          payment.paymentKind === 'primary'\n            ? { ...payment, paymentDate: orderDate }\n            : payment\n        ));""",
              ),
              (
                  "const normalizedPayments = normalizeOrderPayments(payments, orderDate);",
                  """const normalizedPayments = normalizeOrderPayments(payments, orderDate).map(payment => (\n          payment.paymentKind === 'primary'\n            ? { ...payment, paymentDate: orderDate }\n            : payment\n        ));""",
              ),
          ]
          for old, new in replacements:
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'orders-write create normalizer marker not found: {old}')
                  text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          print('createOrder server guard: patched')

          p = Path('scripts/test-step192b2a4-order-create-save-integrity.mjs')
          text = p.read_text(encoding='utf-8')
          marker = """  check(!orders.includes(\"throw new Error('Добавьте хотя бы одну оплату.')\"), 'Unpaid orders are still blocked')\n\n  // Structured stock shortage"""
          inserted = """  check(!orders.includes(\"throw new Error('Добавьте хотя бы одну оплату.')\"), 'Unpaid orders are still blocked')\n\n  // Late-entered orders must not keep today's default payment date when the business order date is changed.\n  const createDraftUpdate = between(app, 'function updateCreateDraft<', 'function updateCreateItem(')\n  check(createDraftUpdate.includes(\"key === 'orderDate'\"), 'Create form does not react to order-date changes')\n  check(createDraftUpdate.includes(\"payment.paymentKind === 'primary'\"), 'Create form does not limit automatic date sync to primary payments')\n  check(createDraftUpdate.includes('paymentDate: orderDate || payment.paymentDate'), 'Primary create payments do not follow the selected order date')\n\n  // Structured stock shortage"""
          if inserted not in text:
              if marker not in text:
                  raise SystemExit('192B2A4 test insertion marker not found')
              text = text.replace(marker, inserted, 1)

          create_marker = """  const create = between(orders, 'export async function createOrder(', 'export async function updateOrderCritical(')\n"""
          create_insert = """  const create = between(orders, 'export async function createOrder(', 'export async function updateOrderCritical(')\n  check((create.match(/payment\\.paymentKind === 'primary'/g) || []).length >= 2, 'Create path does not enforce primary-payment order dates in both fresh and legacy-resume planning')\n  check((create.match(/paymentDate: orderDate/g) || []).length >= 2, 'Server can still persist an initial primary payment on the entry-day date')\n"""
          if create_insert not in text:
              if create_marker not in text:
                  raise SystemExit('create block test marker not found')
              text = text.replace(create_marker, create_insert, 1)

          edit_marker = """  const edit = between(orders, 'export async function updateOrderCritical(', 'export async function getOrder(')\n"""
          edit_insert = """  const edit = between(orders, 'export async function updateOrderCritical(', 'export async function getOrder(')\n  check(edit.includes('normalizeOrderPayments('), 'Existing-order editing lost ordinary payment-date preservation')\n  check(!edit.includes('paymentDate: nextOrderDate'), 'Existing-order editing must not rewrite historical primary payment dates to the order date')\n"""
          if edit_insert not in text:
              if edit_marker not in text:
                  raise SystemExit('edit block test marker not found')
              text = text.replace(edit_marker, edit_insert, 1)
          p.write_text(text, encoding='utf-8')
          print('192B2A4 regression guards: patched')

          p = Path('scripts/test-step1906a-worker-modularization.mjs')
          text = p.read_text(encoding='utf-8')
          changes = [
              (
                  "const stocktakeLostResponsePath = path.join(root, 'scripts/stocktake-lost-response-worker-manifest.json')\n",
                  "const stocktakeLostResponsePath = path.join(root, 'scripts/stocktake-lost-response-worker-manifest.json')\nconst financeOrderDateSyncPath = path.join(root, 'scripts/finance-order-date-sync-worker-manifest.json')\n",
              ),
              (
                  "  check(manifest?.version === 1 && manifest?.declarationCount === 577, '1906A declaration manifest invalid')\n",
                  "  check(manifest?.version === 1 && manifest?.declarationCount === 577, '1906A declaration manifest invalid')\n  check(fs.existsSync(financeOrderDateSyncPath), 'Finance order-date sync Worker manifest missing')\n",
              ),
              (
                  "  const stocktakeLostResponseChanges = stocktakeLostResponse?.version === 1 ? (stocktakeLostResponse.changes || {}) : {}\n",
                  "  const stocktakeLostResponseChanges = stocktakeLostResponse?.version === 1 ? (stocktakeLostResponse.changes || {}) : {}\n  const financeOrderDateSync = fs.existsSync(financeOrderDateSyncPath) ? JSON.parse(fs.readFileSync(financeOrderDateSyncPath, 'utf8')) : null\n  const financeOrderDateSyncChanges = financeOrderDateSync?.version === 1 ? (financeOrderDateSync.changes || {}) : {}\n",
              ),
          ]
          for old, new in changes:
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'1906A marker not found: {old[:80]}')
                  text = text.replace(old, new, 1)

          old_final = """    const stocktakeLostResponseChanged = stocktakeLostResponseChanges[name]\n    if (stocktakeLostResponseChanged) {\n      check(stocktakeLostResponseChanged.before === acceptedPostOrderCreateSaveHash, `Stocktake lost-response declaration baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === stocktakeLostResponseChanged.after, `Worker declaration changed beyond exact stocktake lost-response allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostOrderCreateSaveHash, `Worker declaration body changed beyond accepted cleanup/boundary/runtime/security/warehouse/catalog/attention/daily-warehouse/context/sql-alias/order-save/stocktake-replay deltas: ${name}`)\n    }\n"""
          new_final = """    const stocktakeLostResponseChanged = stocktakeLostResponseChanges[name]\n    let acceptedPostStocktakeLostResponseHash = acceptedPostOrderCreateSaveHash\n    if (stocktakeLostResponseChanged) {\n      check(stocktakeLostResponseChanged.before === acceptedPostOrderCreateSaveHash, `Stocktake lost-response declaration baseline hash mismatch: ${name}`)\n      acceptedPostStocktakeLostResponseHash = stocktakeLostResponseChanged.after\n    }\n    const financeOrderDateSyncChanged = financeOrderDateSyncChanges[name]\n    if (financeOrderDateSyncChanged) {\n      check(financeOrderDateSyncChanged.before === acceptedPostStocktakeLostResponseHash, `Finance order-date sync declaration baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === financeOrderDateSyncChanged.after, `Worker declaration changed beyond exact Finance order-date sync allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostStocktakeLostResponseHash, `Worker declaration body changed beyond accepted cleanup/boundary/runtime/security/warehouse/catalog/attention/daily-warehouse/context/sql-alias/order-save/stocktake-replay/finance-date-sync deltas: ${name}`)\n    }\n"""
          if new_final not in text:
              if old_final not in text:
                  raise SystemExit('1906A final hash-chain marker not found')
              text = text.replace(old_final, new_final, 1)
          p.write_text(text, encoding='utf-8')
          print('1906A exact delta chain: patched')
          PY

          AFTER_HASH="$(declaration_hash worker/domains/orders-write.ts createOrder)"
          export AFTER_HASH
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              'version': 1,
              'revision': 'finance-order-date-sync-r1',
              'reason': 'Late-entered new orders keep initial primary payment business dates aligned with the selected order date; existing-order payment history remains untouched.',
              'changes': {
                  'createOrder': {
                      'before': os.environ['BEFORE_HASH'],
                      'after': os.environ['AFTER_HASH'],
                  }
              },
          }
          Path('scripts/finance-order-date-sync-worker-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('createOrder manifest:', manifest['changes']['createOrder'])
          PY

      - name: Full release gate
        run: npm run release:check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx worker/domains/orders-write.ts scripts/test-step192b2a4-order-create-save-integrity.mjs scripts/test-step1906a-worker-modularization.mjs scripts/finance-order-date-sync-worker-manifest.json
          git commit -m "Fix late-order primary payment date sync [date-sync-patched]"
          git push origin HEAD:finance-order-date-sync
