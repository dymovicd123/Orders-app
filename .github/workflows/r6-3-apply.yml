name: R6.3 apply

on:
  push:
    branches:
      - d1-read-budget-r6-3-manager-summary-reuse

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-read-budget-r6-3-manager-summary-reuse
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse manager day facts for summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worker/domains/finance-reports.ts')
          text = path.read_text(encoding='utf-8')

          old_head = "  const [overviewRow, paymentMethods, managerRows, managerCashRows, productRows, cityRows, cityCashRows, dayRows, returnsRows,\n"
          new_head = "  const [overviewRow, paymentMethods, productRows, cityRows, cityCashRows, dayRows, returnsRows,\n"
          if text.count(old_head) != 1:
              raise SystemExit(f'R6.3 destructure anchor mismatch: {text.count(old_head)}')
          text = text.replace(old_head, new_head, 1)

          first_batch = text.index('  const [overviewRow, paymentMethods, productRows')
          manager_marker = "    () => financeWorkspaceOnly ? emptyRowsResult() : !needsReport('managers') ? emptyRowsResult() : db.prepare("
          product_marker = "    () => financeWorkspaceOnly ? emptyRowsResult() : !needsReport('products') ? emptyRowsResult() : db.prepare("
          manager_start = text.index(manager_marker, first_batch)
          product_start = text.index(product_marker, manager_start)
          manager_segment = text[manager_start:product_start]
          if manager_segment.count("!needsReport('managers')") != 2:
              raise SystemExit('R6.3 expected exactly two dedicated manager summary queries')
          text = text[:manager_start] + text[product_start:]

          old_map_start = text.index('  const managerMap = new Map<number, any>();')
          city_map_start = text.index('  const cityMap = new Map<string, any>();', old_map_start)
          text = text[:old_map_start] + text[city_map_start:]

          second_batch = text.index('  const [paymentByDayRows, paymentOperationRows')
          manager_order_start = text.index(manager_marker, second_batch)
          manager_payment_start = text.index(manager_marker, manager_order_start + len(manager_marker))
          manager_order_block = text[manager_order_start:manager_payment_start]
          old_count = "              COUNT(o.id) AS order_count,\n              COALESCE(SUM(o.total_amount), 0) AS total_sales,"
          new_count = "              COUNT(o.id) AS order_count,\n              COUNT(CASE WHEN o.total_amount <> 0 THEN 1 END) AS nonzero_order_count,\n              COALESCE(SUM(o.total_amount), 0) AS total_sales,"
          if manager_order_block.count(old_count) != 1:
              raise SystemExit(f'R6.3 manager order count anchor mismatch: {manager_order_block.count(old_count)}')
          manager_order_block = manager_order_block.replace(old_count, new_count, 1)
          text = text[:manager_order_start] + manager_order_block + text[manager_payment_start:]

          old_days = "  const managerDaysMap = new Map<string, any>();\n  for (const key of managerKeys) {"
          new_days = "  const managerDaysMap = new Map<string, any>();\n  const managerSummaryMap = new Map<number, any>();\n  for (const key of managerKeys) {"
          if text.count(old_days) != 1:
              raise SystemExit(f'R6.3 managerDays anchor mismatch: {text.count(old_days)}')
          text = text.replace(old_days, new_days, 1)

          bucket_anchor = "    bucket.orderCount += managerRow.order_count;\n"
          if text.count(bucket_anchor) != 1:
              raise SystemExit(f'R6.3 bucket anchor mismatch: {text.count(bucket_anchor)}')
          summary_block = '\n'.join([
              '    const nonzeroOrderCount = Number(row.nonzero_order_count || 0);',
              '    const summary = managerSummaryMap.get(managerId) || {',
              '      manager_id: managerId,',
              '      manager,',
              '      color_key: colorKey,',
              '      order_count: 0,',
              '      total_sales: 0,',
              '      total_received: 0,',
              '      total_returns: 0,',
              '      total_debt: 0,',
              '      nonzero_order_count: 0,',
              '    };',
              '    summary.manager = manager;',
              '    summary.color_key = colorKey;',
              '    summary.order_count += managerRow.order_count;',
              '    summary.total_sales += managerRow.total_sales;',
              '    summary.total_received += managerRow.total_received;',
              '    summary.total_returns += managerRow.total_returns;',
              '    summary.total_debt += managerRow.total_debt;',
              '    summary.nonzero_order_count += nonzeroOrderCount;',
              '    managerSummaryMap.set(managerId, summary);',
              '    bucket.orderCount += managerRow.order_count;',
              '',
          ])
          text = text.replace(bucket_anchor, summary_block, 1)

          sort_anchor = "  for (const bucket of managerDaysMap.values()) bucket.managers.sort((a: any, b: any) => b.total_received - a.total_received || a.manager.localeCompare(b.manager, 'ru') || a.managerId - b.managerId);\n"
          if text.count(sort_anchor) != 1:
              raise SystemExit(f'R6.3 manager sort anchor mismatch: {text.count(sort_anchor)}')
          normalized_lines = [
              sort_anchor.rstrip('\n'),
              '  const normalizedManagerRows = Array.from(managerSummaryMap.values()).map((summary: any) => ({',
              '    manager_id: summary.manager_id,',
              '    manager: summary.manager,',
              '    color_key: summary.color_key,',
              '    order_count: summary.order_count,',
              '    total_sales: summary.total_sales,',
              '    total_received: summary.total_received,',
              '    total_returns: summary.total_returns,',
              '    total_debt: summary.total_debt,',
              '    avg_check: summary.nonzero_order_count > 0 ? summary.total_sales / summary.nonzero_order_count : 0,',
              "  })).sort((a, b) => Number(b.total_received || 0) - Number(a.total_received || 0) || String(a.manager).localeCompare(String(b.manager), 'ru'));",
              '',
          ]
          text = text.replace(sort_anchor, '\n'.join(normalized_lines), 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused R6.3 and O1 parity
        run: |
          node scripts/test-d1-read-budget-r6-3.mjs
          node scripts/test-o1-report-scopes.mjs
      - name: Commit product patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r6-3-apply.yml
          git add worker/domains/finance-reports.ts
          git commit -m "R6.3: reuse manager day facts for summary"
          git push origin HEAD:d1-read-budget-r6-3-manager-summary-reuse
