name: R5.3 Production deploy retry

on:
  push:
    branches:
      - safe/d1-read-budget-r5-3-fts-20260903
    paths:
      - scripts/.r5-3-prod-deploy-retry-trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9d068f53a06eebc4c056ba050d582133
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_DB_UUID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      PROD_DB_NAME: orders_db_prod
      PROD_WORKER_URL: https://orders-app.orders-clothes.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r5-3-fts-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reconfirm validated R5.3 build
        run: |
          npm run typecheck
          node scripts/test-d1-read-budget-r5-3.mjs
          npm run build
          grep -F '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc >/dev/null
      - name: Read-only Production FTS preflight
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const dbUuid = process.env.PROD_DB_UUID
          const expectedName = process.env.PROD_DB_NAME
          const apiBase = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbUuid}`
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }
          const infoResponse = await fetch(apiBase, { headers })
          const info = await infoResponse.json()
          if (!infoResponse.ok || !info?.success) throw new Error(`Production D1 identity read failed: HTTP ${infoResponse.status}`)
          const actualName = String(info?.result?.name || '')
          const actualUuid = String(info?.result?.uuid || info?.result?.id || dbUuid)
          if (actualName !== expectedName || actualUuid !== dbUuid) throw new Error(`Production D1 identity mismatch: ${actualName} / ${actualUuid}`)
          async function query(sql, params = []) {
            const response = await fetch(`${apiBase}/query`, { method: 'POST', headers, body: JSON.stringify({ sql, params }) })
            const payload = await response.json()
            if (!response.ok || !payload?.success) throw new Error(payload?.errors?.map(e => e?.message).filter(Boolean).join('; ') || `HTTP ${response.status}`)
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result
            return Array.isArray(result?.results) ? result.results : []
          }
          const objectNames = [
            'order_search_orders_fts','order_search_items_fts','order_search_payments_fts',
            'trg_order_search_orders_ai','trg_order_search_orders_ad','trg_order_search_orders_au',
            'trg_order_search_items_ai','trg_order_search_items_ad','trg_order_search_items_au',
            'trg_order_search_payments_ai','trg_order_search_payments_ad','trg_order_search_payments_au',
            'trg_order_search_managers_au','trg_order_search_customers_au',
          ]
          const placeholders = objectNames.map(() => '?').join(',')
          const objects = await query(`SELECT name, type FROM sqlite_schema WHERE name IN (${placeholders}) ORDER BY name`, objectNames)
          if (objects.length !== objectNames.length) throw new Error(`R5.3 derived schema incomplete: expected ${objectNames.length}, found ${objects.length}`)
          const counts = (await query(`SELECT
            (SELECT COUNT(*) FROM orders) AS orders_source,
            (SELECT COUNT(*) FROM order_search_orders_fts) AS orders_fts,
            (SELECT COUNT(*) FROM order_items) AS items_source,
            (SELECT COUNT(*) FROM order_search_items_fts) AS items_fts,
            (SELECT COUNT(*) FROM payments) AS payments_source,
            (SELECT COUNT(*) FROM order_search_payments_fts) AS payments_fts`))[0] || {}
          if (Number(counts.orders_source) !== Number(counts.orders_fts)
            || Number(counts.items_source) !== Number(counts.items_fts)
            || Number(counts.payments_source) !== Number(counts.payments_fts)) {
            throw new Error(`R5.3 FTS/source count mismatch: ${JSON.stringify(counts)}`)
          }
          console.log(`Production D1 confirmed: ${expectedName} / ${dbUuid}`)
          console.log(`R5.3 derived schema complete; row counts synchronized: ${JSON.stringify(counts)}`)
          NODE
      - name: Deploy validated R5.3 runtime to Production
        run: npx wrangler deploy
      - name: Post-deploy public smoke
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /tmp/r5-3-home.html -w '%{http_code}' "$PROD_WORKER_URL/")"
            if [ "$code" = "200" ]; then
              grep -qi '<html' /tmp/r5-3-home.html
              echo "Production public smoke passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code; waiting before retry"
            sleep 5
          done
          echo 'Production public smoke failed' >&2
          exit 1
