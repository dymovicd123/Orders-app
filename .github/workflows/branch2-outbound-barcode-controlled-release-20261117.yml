name: Branch2 outbound barcode tracked transfer and writeoff schema/Worker release (NO Main)
on:
  push:
    branches: [branch2]
    paths:
      - .github/workflows/branch2-outbound-barcode-controlled-release-20261117.yml
permissions:
  contents: read
concurrency:
  group: branch2-controlled-worker-deployment
  cancel-in-progress: false
jobs:
  branch2-outbound-barcode:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact Branch2 parent, isolated Worker/D1 and only one workflow file
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '3b13b136009d75b9a419f28233774d4ad49e36fe'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/branch2-outbound-barcode-controlled-release-20261117.yml'
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          assert cfg['name']=='orders-app-branch2'
          assert cfg['main']=='worker/index.ts'
          assert cfg.get('env') is None
          assert cfg['d1_databases']==[{
            'binding':'DB','database_name':'orders_db_branch2_mirror_20261027',
            'database_id':'0904a573-21ff-44d8-93b0-c9200f771702',
          }]
          assert cfg.get('vars')=={'RETURN_V2_ENABLED':'true'}
          assert cfg.get('keep_vars') is True
          cfg.pop('build',None)
          cfg['send_metrics']=False
          Path('.branch2-stocktake-barcode-release.jsonc').write_text(json.dumps(cfg,indent=2)+'\n')
          print('STOCKTAKE_BARCODE_BRANCH2_EXACT_ENV_PASS')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Validate scanned outbound units and existing stocktake, labels and shipping invariants
        run: |
          set -euo pipefail
          node scripts/test-barcode-operation-unit-20261117.mjs
          node scripts/test-stocktake-barcode-scan-20261117.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
          node scripts/test-barcode-unit-label-preparation-20261116.mjs
          node scripts/test-barcode-sku-scanner-ui-20261116.mjs
          node scripts/test-warehouse-return-exchange-receiving-20261117.mjs
          npm run build
      - name: Dry-run Branch2 Worker with matching binding and preserved secrets
        run: |
          npx --no-install wrangler deploy --config .branch2-stocktake-barcode-release.jsonc --name orders-app-branch2 --keep-vars --strict --dry-run --outdir .branch2-stocktake-barcode-preview
      - name: Verify currently active Branch2 Worker bindings and 100 percent version (read only)
        run: python3 scripts/branch2-return-v2-active-guard-20261117.py before
      - name: Check Branch2 barcode foundation and ensure outbound migration has not yet run
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_barcode_prepared_unit_capacity') AS prep_guard,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='inventory_outbound_unit_scans') AS scan_table,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_outbound_unit_scan_apply') AS scan_guard,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='trg_stocktake_unit_scan_apply') AS stocktake_guard
          " > /tmp/stocktake-barcode-preflight.json
          jq -e '.[0].results[0] | .prep_guard==1 and .stocktake_guard==1 and .scan_table==0 and .scan_guard==0' /tmp/stocktake-barcode-preflight.json
      - name: Read-only baseline fingerprint of Branch2 business data
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_units,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_units,
              (SELECT COUNT(*) FROM inventory_stocktake_sessions) AS stocktakes,
              (SELECT COUNT(*) FROM inventory_stocktake_items) AS stocktake_items,
              (SELECT COUNT(*) FROM inventory_units) AS physical_unit_rows,
              (SELECT COUNT(*) FROM inventory_unit_labels) AS active_label_rows,
              (SELECT COUNT(*) FROM orders) AS order_rows,
              (SELECT COUNT(*) FROM order_items) AS order_item_rows
          " > /tmp/stocktake-barcode-fingerprint-before.json
          jq -S '.[0].results[0]' /tmp/stocktake-barcode-fingerprint-before.json > /tmp/stocktake-barcode-fingerprint-before-sorted.json
      - name: Capture test D1 Time Travel bookmark without modifying data
        run: |
          set -euo pipefail
          umask 077
          curl --fail-with-body -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/0904a573-21ff-44d8-93b0-c9200f771702/time_travel/bookmark" |
            jq -er 'if .success==true and (.result.bookmark|type=="string") and (.result.bookmark|length>=32) then .result.bookmark else error("No test D1 recovery bookmark") end' > /tmp/stocktake-barcode-bookmark
          test -s /tmp/stocktake-barcode-bookmark
          echo 'Branch2 D1 Time Travel bookmark captured; no automatic restore.' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply ONLY additive migration 0141 to Branch2 test D1
        run: |
          set -euo pipefail
          test -s /tmp/stocktake-barcode-bookmark
          test "$(git rev-parse HEAD^)" = '3b13b136009d75b9a419f28233774d4ad49e36fe'
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --yes --file migrations/0141_barcode_outbound_unit_operations.sql
      - name: Verify migration structure and that no physical scans preexist
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='inventory_outbound_unit_scans') AS scan_table,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN (
                'trg_outbound_unit_scan_guard','trg_outbound_unit_scan_apply',
                'trg_outbound_unit_scan_immutable_update','trg_outbound_unit_scan_immutable_delete')) AS scan_triggers,
              (SELECT COUNT(*) FROM inventory_stocktake_unit_scans) AS scan_count
          " > /tmp/stocktake-barcode-post-schema.json
          jq -e '.[0].results[0] | .scan_table==1 and .scan_triggers==4 and .scan_count==0' /tmp/stocktake-barcode-post-schema.json
      - name: Prove migration did not touch stock, reservations, orders or existing stocktakes
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute DB --config wrangler.jsonc --remote --json --command "
            SELECT
              (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_units,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_units,
              (SELECT COUNT(*) FROM inventory_stocktake_sessions) AS stocktakes,
              (SELECT COUNT(*) FROM inventory_stocktake_items) AS stocktake_items,
              (SELECT COUNT(*) FROM inventory_units) AS physical_unit_rows,
              (SELECT COUNT(*) FROM inventory_unit_labels) AS active_label_rows,
              (SELECT COUNT(*) FROM orders) AS order_rows,
              (SELECT COUNT(*) FROM order_items) AS order_item_rows
          " | jq -S '.[0].results[0]' > /tmp/stocktake-barcode-fingerprint-after-sorted.json
          diff -u /tmp/stocktake-barcode-fingerprint-before-sorted.json /tmp/stocktake-barcode-fingerprint-after-sorted.json
          echo 'BRANCH2_0141_BUSINESS_DATA_UNCHANGED_PASS'
      - name: Deploy only Branch2 Worker with additive scanner, no Main or production D1 writes
        run: |
          set -euo pipefail
          test -s /tmp/stocktake-barcode-bookmark
          npx --no-install wrangler deploy --config .branch2-stocktake-barcode-release.jsonc --name orders-app-branch2 --keep-vars --strict
      - name: Verify 100 percent active new Worker version and all previous bindings
        run: python3 scripts/branch2-return-v2-active-guard-20261117.py after
      - name: Public Branch2 health and JavaScript smoke; no authenticated scan writes
        run: |
          python3 - <<'PY'
          import json,re,urllib.error,urllib.request
          base='https://orders-app-branch2.orders-clothes.workers.dev'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'StocktakeBarcodeBranch2Release/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      return response.status,response.read()
              except urllib.error.HTTPError as e:
                  return e.code,e.read()
          health,body=get('/api/health')
          assert health==200 and json.loads(body).get('ok') is True
          status,page=get('/')
          assert status==200
          match=re.search(rb'<script[^>]*src="(/assets/[^"]+)"',page)
          assert match
          asset_status,asset=get(match.group(1).decode())
          assert asset_status==200 and len(asset)>1000
          unauthorized,_=get('/api/inventory/stocktakes/REV-TEST-NO-AUTH/scans')
          assert unauthorized in (401,403)
          print('BRANCH2_OUTBOUND_BARCODE_WORKER_AND_SCHEMA_RELEASE_VERIFIED')
          PY
