name: Main manager three workspaces and timesheet copy only
on:
  push:
    branches:
      - fix/main-manager-three-workspaces-20261022
    paths:
      - '.github/workflows/main-manager-three-workspaces-20261022.yml'
      - 'scripts/main-manager-three-workspaces-release-20261022.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/app/managerWorkspaceAccess.ts'
      - 'src/features/sections/TeamSection.tsx'
      - 'scripts/test-main-manager-three-workspaces-20261022.mjs'
      - 'scripts/main-resolver-selective-release-20261022.mjs'
      - 'scripts/main-manager-three-workspaces-release-20261022.mjs'
      - '.github/workflows/main-manager-three-workspaces-20261022.yml'
permissions:
  contents: read
jobs:
  main-manager-ui-and-frozen-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert Main configuration, no D1 actions
        shell: bash
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = "pull_request"; then test "$GITHUB_BASE_REF" = 'main'; else test "$GITHUB_REF_NAME" = 'fix/main-manager-three-workspaces-20261022'; fi
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
      - run: npm ci
      - name: Manager navigation, timesheet note, original production release and new bundle
        run: npm run release:check
