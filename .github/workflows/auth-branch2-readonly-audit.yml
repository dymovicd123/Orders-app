name: Auth Branch2 read-only audit

on:
  push:
    branches:
      - auth-branch2-r1-20261001
    paths:
      - '.github/workflows/auth-branch2-readonly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Audit Branch2 auth state without writes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact auth branch commit
        uses: actions/checkout@v4

      - name: Hard-stop on environment drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "auth-branch2-r1-20261001" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Production D1 binding detected. Refusing auth audit." >&2
            exit 20
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Read-only auth schema and integrity audit
        shell: bash
        run: |
          set -euo pipefail
          query() {
            npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "$1" --json
          }

          echo '--- auth table existence ---'
          query "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('app_users','app_sessions','managers') ORDER BY name"

          echo '--- app_users columns ---'
          query "SELECT name, type, [notnull] AS not_null, pk FROM pragma_table_info('app_users') ORDER BY cid"

          echo '--- app_sessions columns ---'
          query "SELECT name, type, [notnull] AS not_null, pk FROM pragma_table_info('app_sessions') ORDER BY cid"

          echo '--- auth aggregate state ---'
          query "SELECT
            COUNT(*) AS user_count,
            SUM(CASE WHEN is_active = 1 THEN 1 ELSE 0 END) AS active_users,
            SUM(CASE WHEN role = 'admin' THEN 1 ELSE 0 END) AS admins,
            SUM(CASE WHEN role = 'admin' AND is_active = 1 THEN 1 ELSE 0 END) AS active_admins,
            SUM(CASE WHEN role = 'manager' THEN 1 ELSE 0 END) AS manager_accounts,
            SUM(CASE WHEN manager_id IS NOT NULL THEN 1 ELSE 0 END) AS linked_accounts,
            SUM(CASE WHEN manager_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM managers m WHERE m.id = app_users.manager_id) THEN 1 ELSE 0 END) AS orphan_manager_links,
            SUM(CASE WHEN password_hash NOT LIKE 'pbkdf2$%$%$%' THEN 1 ELSE 0 END) AS unsupported_hashes,
            SUM(CASE WHEN instr(email, '@') <= 1 THEN 1 ELSE 0 END) AS invalid_email_shapes
            FROM app_users"

          echo '--- duplicate account identity checks ---'
          query "SELECT
            (SELECT COUNT(*) FROM (
              SELECT lower(email) AS k FROM app_users GROUP BY lower(email) HAVING COUNT(*) > 1
            )) AS duplicate_casefolded_emails,
            (SELECT COUNT(*) FROM (
              SELECT lower(substr(email, 1, instr(email, '@') - 1)) AS k
              FROM app_users
              WHERE instr(email, '@') > 1
              GROUP BY lower(substr(email, 1, instr(email, '@') - 1))
              HAVING COUNT(*) > 1
            )) AS duplicate_email_local_parts"

          echo '--- session aggregate state ---'
          query "SELECT
            COUNT(*) AS session_count,
            SUM(CASE WHEN expires_at > datetime('now') THEN 1 ELSE 0 END) AS nonexpired_sessions,
            SUM(CASE WHEN expires_at <= datetime('now') THEN 1 ELSE 0 END) AS expired_sessions,
            SUM(CASE WHEN NOT EXISTS (SELECT 1 FROM app_users u WHERE u.id = app_sessions.user_id) THEN 1 ELSE 0 END) AS orphan_sessions
            FROM app_sessions"

          echo '--- non-sensitive account topology ---'
          query "SELECT id, role, is_active, manager_id, must_change_password,
            CASE WHEN last_login_at IS NULL OR trim(last_login_at) = '' THEN 0 ELSE 1 END AS has_logged_in
            FROM app_users
            ORDER BY id"

          echo 'AUTH BRANCH2 READ-ONLY AUDIT COMPLETED — no INSERT/UPDATE/DELETE/DDL statements executed.'
