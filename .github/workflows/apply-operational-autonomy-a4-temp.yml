name: Apply Operational Autonomy A4 Temp

on:
  push:
    branches:
      - operational-autonomy-a4-handover-correction

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operational-autonomy-a4-handover-correction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and validate A4
        run: |
          python scripts/apply-operational-autonomy-a4-temp.py
          node scripts/test-operational-autonomy-a4-handover-correction.mjs
      - name: Commit clean A4 tree
        run: |
          rm .github/workflows/apply-operational-autonomy-a4-temp.yml
          rm scripts/apply-operational-autonomy-a4-temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add safe mistaken handover correction'
          git push origin HEAD:operational-autonomy-a4-handover-correction
