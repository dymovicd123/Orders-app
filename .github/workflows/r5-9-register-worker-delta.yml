name: R5.9 register Worker delta

on:
  push:
    branches:
      - safe/d1-read-budget-r5-9-orders-pagination-20260904

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Register exact R5.9 manifest in cumulative Worker gate
        run: |
          node scripts/tmp-r5-9-register-worker-delta.mjs
          node scripts/test-step1906a-worker-modularization.mjs
      - name: Commit gate registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-step1906a-worker-modularization.mjs
          git diff --cached --check
          git commit -m "R5.9: register listOrders Worker delta"
          git push origin HEAD:safe/d1-read-budget-r5-9-orders-pagination-20260904
