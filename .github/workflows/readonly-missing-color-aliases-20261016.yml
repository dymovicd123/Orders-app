name: 'Production read-only audit 23 SKU missing colors and color aliases'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-missing-color-aliases-20261016.mjs'
      - '.github/workflows/readonly-missing-color-aliases-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify read-only production pinned identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_BASE_REF" == 'main' ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          node --check scripts/ops/readonly-missing-color-aliases-20261016.mjs
          cat > "$RUNNER_TEMP/readonly-missing-colors.jsonc" <<'CFG'
          {
            "name": "orders-app-missing-colors-audit-only",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/readonly-missing-colors.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Inspect missing refs, normalized variants, possible SKU collisions and stock integrity
        run: node scripts/ops/readonly-missing-color-aliases-20261016.mjs
