name: Client3 shared cash + Main Team guarded release (third Worker only)
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-shared-cash-main-team-guarded-release-20261103.yml']
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Exact accepted source and isolated Client3 identity
        run: |
          set -eEuo pipefail
          trap 'echo "CLIENT3_WORKSPACES_RELEASE_GATE_FAILED line $LINENO"' ERR
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(git rev-parse HEAD^)" = 909f9e489f00ff6ea02173d7cc1482f50e6b3af0
          test "$(git diff --name-only 6dba6b786283f75171378cf504713cb2f58ce6ec HEAD)" = .github/workflows/client3-shared-cash-main-team-guarded-release-20261103.yml
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41611777824 --jq .conclusion)" = success
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41611777824 --jq .head_sha)" = 6dba6b786283f75171378cf504713cb2f58ce6ec
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci
      - name: Build accepted Client3
        run: npm run build
      - name: Pre-deploy business and inventory snapshot, FK check
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list orders_db_client3_old_client --remote --config wrangler.jsonc > /tmp/watch-migrations
          pending="$(grep -Eo '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/watch-migrations | sort -u || true)"
          if test -n "$pending"; then test "$pending" = 1003_shared_cash_main_team.sql; fi
          echo "Pending Client3 migration: ${pending:-none}"
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM order_items) order_items_count,
              (SELECT COUNT(*) FROM payments) payments_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM returns) returns_count,
              (SELECT COUNT(*) FROM exchanges) exchanges_count,
              (SELECT COUNT(*) FROM inventory_movements) stock_movements,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum,
              (SELECT COUNT(*) FROM watch_products) products,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM watch_city_values) cities,
              (SELECT COUNT(*) FROM watch_model_aliases) aliases"             | jq -ce '.[0].results[0] | select(.orders_count>=0)' > /tmp/watch-before
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
      - name: Apply ONLY isolated shared-cash migration
        run: |
          set -euo pipefail
          pending="$(grep -Eo '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/watch-migrations | sort -u || true)"
          if test -n "$pending"; then
            test "$pending" = 1003_shared_cash_main_team.sql
            printf 'y\n' | npx wrangler d1 migrations apply orders_db_client3_old_client --remote --config wrangler.jsonc
          fi
      - name: Verify exact unified starting balance and legacy journal preservation
        run: |
          set -euo pipefail
          query="SELECT
            COALESCE((SELECT SUM(c.opening_amount
              +(SELECT COALESCE(SUM(e.amount_delta),0) FROM watch_brand_cash_entries e
                WHERE e.brand_id=c.brand_id AND e.id>c.cash_entry_watermark)
              +(SELECT COALESCE(SUM(f.amount_delta),0) FROM financial_events f
                JOIN watch_order_details wd ON wd.order_id=f.order_id
                WHERE wd.brand_id=c.brand_id AND f.id>c.financial_event_watermark
                AND (c.auto_tracking_enabled=1 OR f.id<=COALESCE(c.paused_event_id,0))
                AND NOT EXISTS (SELECT 1 FROM watch_brand_cash_skipped_events sk
                  WHERE sk.brand_id=c.brand_id AND f.id BETWEEN sk.first_event_id AND sk.last_event_id)
                AND UPPER(TRIM(f.payment_method)) IN ('НАЛИЧНЫЕ','CASH','CASH KZT')))
              FROM watch_brand_cash_registers c),0) AS legacyBalance,
            COALESCE((SELECT opening_amount FROM watch_shared_cash_register WHERE id=1),0) AS sharedOpening,
            (SELECT COUNT(*) FROM watch_brand_cash_registers) AS legacyRegisters,
            (SELECT COUNT(*) FROM watch_shared_cash_register) AS sharedRegisters,
            (SELECT COUNT(*) FROM watch_brand_cash_entries) AS legacyEntries,
            (SELECT COUNT(*) FROM watch_brand_cash_cycles) AS legacyCycles,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_shared_cash_entries') AS sharedEntriesReady"
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json --command="$query" \
            | jq -e '.[0].results[0] | select(.legacyBalance == .sharedOpening and .sharedEntriesReady == 1 and ((.legacyRegisters == 0 and .sharedRegisters == 0) or (.legacyRegisters > 0 and .sharedRegisters == 1)))'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
          echo CLIENT3_SHARED_CASH_MIGRATION_BALANCE_VERIFIED
      - name: Deploy third Worker only
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Live unauthorized API smoke and unchanged business data
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          test "$(curl -sSL -o /tmp/client3-index -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-index
          for path in             '/api/client3/watches/analytics?brand=TAUWACH&from=2026-11-01&to=2026-11-03'             '/api/client3/watches/cash'             '/api/client3/watches/team'             '/api/client3/watches/plans?brand=TAUWACH&from=2026-11-01&to=2026-11-30'             '/api/client3/watches/leads?brand=TAUWACH&kind=leads&from=2026-11-01&to=2026-11-30'; do
            status=$(curl -sS -o /tmp/client3-unauth -w '%{http_code}' --max-time 30 "$base$path")
            test "$status" = 401 -o "$status" = 403
          done
          status=$(curl -sS -o /tmp/client3-cash-unauth -w '%{http_code}' --max-time 30             -X POST -H 'Content-Type: application/json' --data '{"action":"setup","openingAmount":100}'             "$base/api/client3/watches/cash")
          test "$status" = 401 -o "$status" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM order_items) order_items_count,
              (SELECT COUNT(*) FROM payments) payments_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM returns) returns_count,
              (SELECT COUNT(*) FROM exchanges) exchanges_count,
              (SELECT COUNT(*) FROM inventory_movements) stock_movements,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum,
              (SELECT COUNT(*) FROM watch_products) products,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM watch_city_values) cities,
              (SELECT COUNT(*) FROM watch_model_aliases) aliases"             | jq -ce '.[0].results[0]' > /tmp/watch-after
          diff -u /tmp/watch-before /tmp/watch-after
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
          echo CLIENT3_SHARED_CASH_AND_MAIN_TEAM_RELEASE_SUCCESS
      - name: Record verified Client3 shared cash and team release
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 single SHARED CASH for TAUWACH+WACHIZEN, Main-style Team page RELEASED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Source 6dba6b786283f75171378cf504713cb2f58ce6ec, real SQLite migration/brand cash and Main team+stock/orders full regression/TS https://github.com/dymovicd123/Orders-app/actions/runs/41611777824. Legacy two cash ledgers retained read-only, combined opening balance checked exactly, no double count; unified automatic cash from both brands with brand labels. Main team active/former, employee editor/color/roles incl Логист, brand grants, linked user access, Main timesheet, money plan/salary/activity. Only additive 1003 migration in third D1. Main and Branch2 untouched; no KPI and no invoice. Final desktop/mobile role walkthrough remains."
      - name: Log blocked release without claiming success
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 shared cash + Main Team release BLOCKED or FAILED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Check migration/worker/public smoke separately before claiming live."
