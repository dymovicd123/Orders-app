name: R5.2 Production preflight

on:
  push:
    branches: [safe/r5-2-warehouse-summary-20260902]
    paths:
      - scripts/.r5-2-prod-preflight-trigger

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm Production identity and current R5.2 index state — read only
        run: |
          npx wrangler d1 execute orders_db_prod --remote --command "SELECT 'orders_db_prod' AS logical_db, COUNT(*) AS order_count FROM orders" --json
          npx wrangler d1 execute orders_db_prod --remote --command "SELECT name, sql FROM sqlite_master WHERE type='index' AND name='idx_order_items_catalog_attention_order'" --json
      - name: List pending Production migrations — read only
        run: |
          set -o pipefail
          npx wrangler d1 migrations list orders_db_prod --remote 2>&1 | tee /tmp/pending.txt
          echo '--- parsed migration filenames ---'
          grep -oE '[0-9]{4}_[A-Za-z0-9_.-]+\.sql' /tmp/pending.txt | sort -u | tee /tmp/pending-files.txt || true
          COUNT=$(grep -c . /tmp/pending-files.txt || true)
          echo "R5_2_PENDING_COUNT=$COUNT"
          echo 'R5_2_PENDING_FILES_BEGIN'
          cat /tmp/pending-files.txt || true
          echo 'R5_2_PENDING_FILES_END'
