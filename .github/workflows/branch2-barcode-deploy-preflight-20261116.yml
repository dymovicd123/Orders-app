name: Branch2 barcode deployment preflight READ ONLY 2026-11-16

on:
  push:
    branches:
      - branch2
    paths:
      - .github/workflows/branch2-barcode-deploy-preflight-20261116.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Branch2-only target and code gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2_mirror_20261027"' wrangler.jsonc
          grep -Fq '"database_id": "0904a573-21ff-44d8-93b0-c9200f771702"' wrangler.jsonc
          ! grep -Eq '"name": "orders-app"|"database_name": "orders_db_prod"' wrangler.jsonc
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Inspect Cloudflare Branch2 Worker settings, D1 binding and flag (NO WRITES)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          acc=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          expected_db='0904a573-21ff-44d8-93b0-c9200f771702'
          url='https://api.cloudflare.com/client/v4/accounts/'+acc+'/workers/scripts/orders-app-branch2/settings'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=30) as resp: value=json.load(resp)
          if not value.get('success'): raise SystemExit('FAIL Branch2 settings API did not succeed')
          bindings=value.get('result',{}).get('bindings',[])
          databases=[x for x in bindings if x.get('name')=='DB']
          if len(databases)!=1 or databases[0].get('type')!='d1':
            raise SystemExit('FAIL exactly one Branch2 D1 binding was not found')
          remote_id=databases[0].get('database_id') or databases[0].get('id')
          if remote_id!=expected_db: raise SystemExit('FAIL Worker is not bound to approved Branch2 D1')
          flags=[x for x in bindings if x.get('name')=='RETURN_V2_ENABLED']
          flag=(flags[0].get('text') if len(flags)==1 and flags[0].get('type')=='plain_text' else 'ABSENT_OR_HIDDEN')
          print('BRANCH2_WORKER_D1_CHECK_PASS')
          print('RETURN_V2_ENABLED_CURRENT='+str(flag))
          print('OTHER_BINDING_NAMES='+','.join(sorted(x.get('name','') for x in bindings if x.get('name') not in ('DB','RETURN_V2_ENABLED'))))
          print('READ_ONLY_NO_DEPLOY_NO_D1_WRITES')
          PY
