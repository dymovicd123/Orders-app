name: W2 attention refresh R1

on:
  push:
    branches:
      - safe/w2-attention-refresh-r1-20260905

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply focused fix
        run: python scripts/apply-w2-attention-refresh-r1.py
      - name: Normalize focused test window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-w2-attention-refresh-r1.mjs')
          text = p.read_text(encoding='utf-8')
          old = "  const openPanel = between(app, 'const openInventoryPanel = (panel: InventoryPanel) => {', '  async function refreshInventoryModule')"
          new = "  const openPanelStart = app.indexOf('const openInventoryPanel = (panel: InventoryPanel) => {')\n  check(openPanelStart >= 0, 'openInventoryPanel missing')\n  const openPanel = app.slice(openPanelStart, openPanelStart + 1800)"
          if old not in text:
              raise SystemExit('focused test openPanel marker missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Diff safety
        run: |
          git diff --check
          git diff --stat
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused regression
        run: node scripts/test-w2-attention-refresh-r1.mjs
      - name: Cumulative release gate
        run: npm run release:check
      - name: Database safety
        run: npm run verify:db-safety
      - name: Production build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/w2-attention-refresh-r1.yml
          rm -f scripts/apply-w2-attention-refresh-r1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'W2.1: fix Warehouse Attention refresh race'
          git push origin HEAD:safe/w2-attention-refresh-r1-20260905
