name: W2 attention refresh R1

on:
  push:
    branches:
      - safe/w2-attention-refresh-r1-20260905

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply focused Warehouse Attention fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')

          app = replace_once(
              app,
              "    setInventoryPanel(nextPanel)\n    if (nextPanel === 'attention') void loadWarehouseAttention(true)\n",
              "    setInventoryPanel(nextPanel)\n",
              'remove duplicate attention open read',
          )

          loader_pattern = re.compile(
              r"  async function loadWarehouseAttention\(details = false, force = false\) \{\n.*?\n  \}\n\n  async function loadInventoryData\(",
              re.S,
          )
          loader_matches = list(loader_pattern.finditer(app))
          if len(loader_matches) != 1:
              raise SystemExit(f'warehouse attention loader: expected one function, got {len(loader_matches)}')
          new_loader = """  async function loadWarehouseAttention(details = false, force = false) {
    const shouldLoadDetails = details || (activeSector === 'inventory' && inventoryPanel === 'attention')
    if (!shouldLoadDetails && !force) {
      const cached = warehouseAttentionSummaryCache
      if (cached && Date.now() - cached.loadedAt < WAREHOUSE_ATTENTION_SUMMARY_TTL_MS) {
        setWarehouseAttention((current) => current?.items ? current : cached.data)
        return cached.data
      }
      if (warehouseAttentionSummaryInFlight) {
        return await warehouseAttentionSummaryInFlight
      }
    }
    const requestToken = ++warehouseAttentionRequestToken
    const request = (async () => {
      const response = await apiFetch(`/api/inventory/attention${shouldLoadDetails ? '?details=1&limit=30' : ''}`)
      if (!response.ok) return null
      return await readJsonResponse<WarehouseAttentionSummaryResponse>(response, 'Склад')
    })()
    if (!shouldLoadDetails) warehouseAttentionSummaryInFlight = request
    try {
      const data = await request
      if (!data || requestToken !== warehouseAttentionRequestToken) return data
      setWarehouseAttention(data)
      if (!shouldLoadDetails) warehouseAttentionSummaryCache = { data, loadedAt: Date.now() }
      return data
    } finally {
      if (!shouldLoadDetails && warehouseAttentionSummaryInFlight === request) warehouseAttentionSummaryInFlight = null
    }
  }

  async function loadInventoryData("""
          app = loader_pattern.sub(new_loader, app, count=1)

          old_reconcile = """      await Promise.all([
        loadWarehouseAttention(true),
        isAdmin ? loadInventoryLifecycle(true) : Promise.resolve(null),
        loadInventoryData('warehouse', true, '', false),
        loadInventoryData('boutique', true, '', false),
      ])
      setMessage(result?.message || 'Приёмка завершена.')
      return result"""
          new_reconcile = """      const [attentionData] = await Promise.all([
        loadWarehouseAttention(true),
        isAdmin ? loadInventoryLifecycle(true) : Promise.resolve(null),
        loadInventoryData('warehouse', true, '', false),
        loadInventoryData('boutique', true, '', false),
      ])
      setMessage(result?.message || 'Приёмка завершена.')
      return { ...result, warehouseAttention: attentionData }"""
          app = replace_once(app, old_reconcile, new_reconcile, 'reuse intake refresh result')
          app_path.write_text(app, encoding='utf-8')

          hook_path = Path('src/features/inventory/useInventoryAttentionActions.ts')
          hook = hook_path.read_text(encoding='utf-8')
          old_refresh = """    try {
      const data = await loadWarehouseAttention(true)
      setAttentionCategory((current) => attentionCategoryCount(data, current) > 0 ? current : firstAttentionCategory(data))
    } catch (error) {"""
          new_refresh = """    try {
      const data = await loadWarehouseAttention(true)
      if (!data?.items) throw new Error('Не удалось загрузить список вопросов склада. Нажмите «Обновить» и попробуйте ещё раз.')
      setAttentionCategory((current) => attentionCategoryCount(data, current) > 0 ? current : firstAttentionCategory(data))
    } catch (error) {"""
          hook = replace_once(hook, old_refresh, new_refresh, 'surface detail load failure')

          old_intake = """      else {
        const data = await loadWarehouseAttention(true)
        setAttentionCategory((current) => attentionCategoryCount(data, current) > 0 ? current : firstAttentionCategory(data))
      }"""
          new_intake = """      else {
        const data = result?.warehouseAttention || await loadWarehouseAttention(true)
        setAttentionCategory((current) => attentionCategoryCount(data, current) > 0 ? current : firstAttentionCategory(data))
      }"""
          hook = replace_once(hook, old_intake, new_intake, 'avoid duplicate intake attention read')
          hook_path.write_text(hook, encoding='utf-8')

          test_path = Path('scripts/test-w2-attention-refresh-r1.mjs')
          test_path.write_text(r'''import fs from 'node:fs'
import path from 'node:path'

const root = process.cwd()
const read = (rel) => fs.readFileSync(path.join(root, rel), 'utf8')
const check = (condition, message) => { if (!condition) throw new Error(message) }
const between = (source, startMarker, endMarker) => {
  const start = source.indexOf(startMarker)
  check(start >= 0, `Marker missing: ${startMarker}`)
  const end = source.indexOf(endMarker, start + startMarker.length)
  check(end > start, `End marker missing after: ${startMarker}`)
  return source.slice(start, end)
}

try {
  const pkg = JSON.parse(read('package.json'))
  const app = read('src/App.tsx')
  const actions = read('src/features/inventory/useInventoryAttentionActions.ts')
  const worker = read('worker/domains/warehouse-attention.ts')

  check(String(pkg.scripts?.['release:check'] || '').includes('node scripts/test-w2-attention-refresh-r1.mjs'), 'R1 regression is not chained into release:check')

  const openPanel = between(app, 'const openInventoryPanel = (panel: InventoryPanel) => {', '  async function refreshInventoryModule')
  check(!openPanel.includes("if (nextPanel === 'attention') void loadWarehouseAttention(true)"), 'Attention still starts a duplicate detail request from navigation')

  const loader = between(app, '  async function loadWarehouseAttention(details = false, force = false) {', '  async function loadInventoryData(')
  check(loader.includes("const shouldLoadDetails = details || (activeSector === 'inventory' && inventoryPanel === 'attention')"), 'Attention panel does not force detailed data shape')
  check(loader.includes('setWarehouseAttention((current) => current?.items ? current : cached.data)'), 'Cached summary can still erase already loaded detail items')
  const inflight = between(loader, '      if (warehouseAttentionSummaryInFlight) {', '    const requestToken = ++warehouseAttentionRequestToken')
  check(inflight.includes('return await warehouseAttentionSummaryInFlight'), 'Summary in-flight reuse missing')
  check(!inflight.includes('setWarehouseAttention'), 'Summary waiter can still overwrite a newer detailed response')
  check(loader.includes("shouldLoadDetails ? '?details=1&limit=30' : ''"), 'Detailed request is not tied to the effective Attention state')

  const refresh = between(actions, '  async function refreshWarehouseAttention() {', '  useEffect(() => {')
  check(refresh.includes('if (!data?.items) throw new Error'), 'Failed detail load is still silently rendered as an empty problem list')
  const effect = between(actions, "  useEffect(() => {\n    if (activeSector !== 'inventory' || inventoryPanel !== 'attention') return", '  async function openAttentionShortage')
  check(effect.includes('void refreshWarehouseAttention()'), 'Attention no longer loads details on panel entry')

  const intake = between(actions, '  async function openAttentionIntake(item: any) {', '  function openAttentionHandover')
  check(intake.includes('result?.warehouseAttention || await loadWarehouseAttention(true)'), 'Intake still unconditionally performs a second detailed Attention read')
  const reconcile = between(app, '  async function reconcileKnownInventoryLifecycle(eventId: number) {', '  async function loadInventoryLifecycleContext')
  check(reconcile.includes('const [attentionData] = await Promise.all(['), 'Intake reconciliation does not retain its already loaded Attention payload')
  check(reconcile.includes('return { ...result, warehouseAttention: attentionData }'), 'Intake reconciliation does not return reusable Attention data')

  check(worker.includes('if (!details) {') && worker.includes('response.items = {'), 'Warehouse Attention API summary/detail contract changed unexpectedly')
  console.log('W2 ATTENTION REFRESH R1 TESTS PASSED — detailed inbox wins summary races, entry has one owner, detail failures are visible, intake reuses its refresh')
} catch (error) {
  console.error(`W2 ATTENTION REFRESH R1 TESTS FAILED: ${error?.message || error}`)
  process.exit(1)
}
''', encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          marker = 'node scripts/test-w2-attention-refresh-r1.mjs'
          release = str(pkg['scripts']['release:check'])
          if marker not in release:
              pkg['scripts']['release:check'] = release + ' && ' + marker
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          doc_path = Path('docs/continuation/W2_ATTENTION_REFRESH_R1.md')
          doc_path.parent.mkdir(parents=True, exist_ok=True)
          doc_path.write_text('''# W2 Attention Refresh R1\n\nDate: 2026-09-05\n\n## Fixed\n- `Склад → Нужно уточнить` now owns one detailed refresh on panel entry instead of starting duplicate detail reads from navigation and the panel effect.\n- A reused in-flight summary can no longer overwrite a newer detailed response and make the problem rows disappear.\n- A cached summary no longer replaces already loaded detail rows.\n- While the Attention panel is active, generic Attention reads are upgraded to the detailed response shape.\n- If the detailed request fails, the panel shows a refresh error instead of silently showing counts without rows.\n- Known-item intake reuses the Attention payload already loaded by reconciliation instead of unconditionally issuing the same detailed read twice.\n\n## Invariants\n- No D1 migration.\n- No Worker mutation/business-rule change.\n- Arrival UI unchanged.\n- Branch2 unchanged.\n- No visual/UI acceptance in this hotfix; only source/regression/build/dry-run gates.\n\n## Continue from\nAfter Production deploy succeeds, discuss the next Warehouse actions with the user.\n''', encoding='utf-8')
          PY
          git diff --check
          git diff --stat

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused regression
        run: node scripts/test-w2-attention-refresh-r1.mjs
      - name: Cumulative release gate
        run: npm run release:check
      - name: Database safety
        run: npm run verify:db-safety
      - name: Production build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/w2-attention-refresh-r1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'W2.1: fix Warehouse Attention refresh race'
          git push origin HEAD:safe/w2-attention-refresh-r1-20260905
