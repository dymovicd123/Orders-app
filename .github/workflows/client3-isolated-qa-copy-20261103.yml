name: Client3 isolated QA COPY (production read-only)
on:
  push:
    branches: [client3/isolated-qa-copy-20261103]
    paths: ['.github/workflows/client3-isolated-qa-copy-20261103.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: client3-isolated-qa-copy-20261103
  cancel-in-progress: false
jobs:
  create-qa-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_DB: orders_db_client3_old_client
      SOURCE_DB_ID: 0717f239-6d81-4837-8586-777d94e22c53
      QA_WORKER: orders-app-client3-qa-20261103
    steps:
      - name: Checkout exact accepted Client3 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Reject any production binding or unexpected branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/isolated-qa-copy-20261103
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = "$SOURCE_DB"
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = "$SOURCE_DB_ID"
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = "1"
          test "$QA_WORKER" != "$(jq -r .name wrangler.jsonc)"
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/client3-isolated-qa-copy-20261103.yml
      - run: npm ci
      - name: Check Client3 build BEFORE creating any cloud resources
        run: npm run build
      - name: Read-only source D1 integrity and snapshot bookmark
        run: |
          set -euo pipefail
          umask 077
          npx wrangler d1 execute "$SOURCE_DB" --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" > /tmp/qa-source-fk.json
          jq -e '(if type=="array" then .[0].results else .results end)|length==0' /tmp/qa-source-fk.json >/dev/null
          npx wrangler d1 execute "$SOURCE_DB" --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM app_users WHERE role='admin' AND is_active=1) admins,
              (SELECT COUNT(*) FROM watch_brands) brands,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM inventory_stock) stock,
              (SELECT COUNT(*) FROM orders) orders_count" > /tmp/qa-source-summary.json
          jq -e '(if type=="array" then .[0].results[0] else .results[0] end)
            | select(.admins >= 1 and .brands >= 2 and .variants >= 1)' /tmp/qa-source-summary.json >/dev/null
          npx wrangler d1 time-travel info "$SOURCE_DB" --config wrangler.jsonc --json > /tmp/qa-source-bookmark.json
          jq -e '.bookmark|type=="string" and length>15' /tmp/qa-source-bookmark.json >/dev/null
          echo "Client3 source is healthy; recovery bookmark captured. No source writes."
      - name: Read-only selective export, omitting only FTS virtual/shadow tables
        run: |
          set -euo pipefail
          umask 077
          npx wrangler d1 execute "$SOURCE_DB" --remote --config wrangler.jsonc --json \
            --command="PRAGMA table_list" > /tmp/qa-tables.json
          npx wrangler d1 execute "$SOURCE_DB" --remote --config wrangler.jsonc --json \
            --command="SELECT name, sql FROM sqlite_master WHERE type='table'
              AND lower(sql) LIKE 'create virtual table%'" > /tmp/qa-virtual-ddl.json
          mapfile -t source_tables < <(jq -r '
            (if type=="array" then .[0].results else .results end)
            | .[] | select(.schema=="main" and .type=="table"
              and (.name | startswith("sqlite_") | not)
              and .name != "_cf_KV") | .name' /tmp/qa-tables.json)
          test "${#source_tables[@]}" -ge 20
          export_args=()
          for table in "${source_tables[@]}"; do
            export_args+=(--table "$table")
          done
          echo "Copying ${#source_tables[@]} ordinary D1 tables; virtual/shadow tables excluded for safe recreation."
          for kind in schema data; do
            more_opts=()
            if test "$kind" = schema; then more_opts+=(--no-data); else more_opts+=(--no-schema); fi
            if ! npx wrangler d1 export "$SOURCE_DB" --remote \
              --config wrangler.jsonc --skip-confirmation "${export_args[@]}" "${more_opts[@]}" \
              --output="/tmp/client3-qa-$kind.sql" > "/tmp/qa-export-$kind-log" 2>&1; then
              echo "::error::D1 $kind selective export failed. Production data was not modified."
              exit 1
            fi
            test -s "/tmp/client3-qa-$kind.sql"
          done
          npx wrangler d1 execute "$SOURCE_DB" --remote --config wrangler.jsonc --json \
            --command="SELECT name, sql FROM sqlite_master WHERE type='view'" > /tmp/qa-views.json
          python3 - <<'PY'
          from pathlib import Path
          for kind in ('schema','data'):
            p=Path('/tmp/client3-qa-'+kind+'.sql')
            data=p.read_text(encoding='utf-8')
            data=''.join(x for x in data.splitlines(keepends=True) if x.strip().upper() not in ('BEGIN TRANSACTION;','COMMIT;'))
            assert len(data)>100
            if kind=='schema': assert 'CREATE TABLE' in data.upper()
            p.write_text(data,encoding='utf-8')
          print('Schema and data SQL snapshots stored only in ephemeral runner.')
          PY
      - name: Create a uniquely named D1 database (never reuse the source)
        run: |
          set -euo pipefail
          umask 077
          export QA_DB="orders_db_client3_qa_${GITHUB_RUN_ID}"
          echo "QA_DB=$QA_DB" >> "$GITHUB_ENV"
          test "$QA_DB" != "$SOURCE_DB"
          status=$(curl -sS -o /tmp/qa-db-create.json -w '%{http_code}' \
            --retry 2 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"$QA_DB\"}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          test "$status" = 200 -o "$status" = 201
          QA_DB_ID=$(jq -er 'select(.success==true)|.result.uuid' /tmp/qa-db-create.json)
          test "$QA_DB_ID" != "$SOURCE_DB_ID"
          test "$QA_DB_ID" != ""
          export QA_DB_ID
          echo "QA_DB_ID=$QA_DB_ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src=json.loads(Path('wrangler.jsonc').read_text(encoding='utf-8'))
          assert src['name']=='orders-app-client3-old-client'
          assert src['d1_databases'][0]['database_id']=='0717f239-6d81-4837-8586-777d94e22c53'
          src['name']=os.environ['QA_WORKER']
          src['d1_databases'][0]['database_name']=os.environ['QA_DB']
          src['d1_databases'][0]['database_id']=os.environ['QA_DB_ID']
          src['vars']['CLIENT3_QA_COPY']='1'
          Path('wrangler.client3-qa.jsonc').write_text(json.dumps(src,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          test "$(jq -r .name wrangler.client3-qa.jsonc)" = "$QA_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" = "$QA_DB_ID"
          echo "A fresh isolated D1 was created; exact source D1 ID is not bound."
      - name: Import normal table schemas into fresh QA D1
        run: |
          set -euo pipefail
          if ! npx wrangler d1 execute "$QA_DB" --remote \
            --config wrangler.client3-qa.jsonc --yes \
            --file=/tmp/client3-qa-schema.sql > /tmp/qa-schema-import-log 2>&1; then
            echo "::error::Normal schema-only import failed; QA Worker not deployed."
            exit 1
          fi
      - name: Recreate virtual FTS definitions before importing base data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          raw=json.loads(Path('/tmp/qa-virtual-ddl.json').read_text(encoding='utf-8'))
          rows=raw[0]['results'] if isinstance(raw,list) else raw['results']
          schema=[]
          rebuild=[]
          for row in rows:
            name=row['name']
            ddl=row['sql']
            if not re.fullmatch(r'[A-Za-z0-9_]+',name):
              raise SystemExit('Unsafe virtual table name')
            if not re.search(r'(?i)^\s*CREATE\s+VIRTUAL\s+TABLE',ddl):
              raise SystemExit('Unexpected virtual table definition')
            schema.append(ddl.rstrip(';')+';')
            if re.search(r"""(?i)content\s*=\s*['"][^'"]+['"]""",ddl):
              rebuild.append("INSERT INTO "+name+"("+name+") VALUES('rebuild');")
          Path('/tmp/qa-virtual-tables.sql').write_text('\n'.join(schema)+'\n',encoding='utf-8')
          Path('/tmp/qa-virtual-rebuild.sql').write_text('\n'.join(rebuild)+'\n',encoding='utf-8')
          print('Virtual table definitions to restore:',len(schema),'external content indexes:',len(rebuild))
          PY
          if test -s /tmp/qa-virtual-tables.sql; then
            npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --yes \
              --file=/tmp/qa-virtual-tables.sql > /tmp/qa-fts-schema-log 2>&1
          fi
          echo "Virtual FTS schemas created in QA, regular tables imported next."
      - name: Import table contents into pre-created QA schema only
        run: |
          set -euo pipefail
          test "$QA_DB" != "$SOURCE_DB"
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" = "$QA_DB_ID"
          if ! npx wrangler d1 execute "$QA_DB" --remote \
            --config wrangler.client3-qa.jsonc --yes \
            --file=/tmp/client3-qa-data.sql > /tmp/qa-import-log 2>&1; then
            echo "::error::Isolated D1 import failed; no Worker deployed. Import log withheld because snapshot contains customer data."
            for phrase in 'no such table' 'foreign key' 'unique constraint' 'syntax error' 'already exists' 'virtual' 'transaction' 'too long' 'unable to' 'error 10000'; do
              if grep -Fqi "$phrase" /tmp/qa-import-log; then echo "Import diagnostic class: $phrase"; fi
            done
            exit 1
          fi
          rm -f /tmp/client3-qa-schema.sql /tmp/client3-qa-data.sql
      - name: Rebuild content-backed search indexes after base import
        run: |
          set -euo pipefail
          if test -s /tmp/qa-virtual-rebuild.sql; then
            npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --yes \
              --file=/tmp/qa-virtual-rebuild.sql > /tmp/qa-fts-rebuild-log 2>&1
          fi
          echo "Search indexes recreated after QA data import."
      - name: Recreate SQL views in QA after core data and virtual schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/qa-views.json').read_text(encoding='utf-8'))
          rows=v[0]['results'] if isinstance(v,list) else v['results']
          Path('/tmp/qa-views.sql').write_text('\n'.join(row['sql'].rstrip(';')+';' for row in rows if row.get('sql'))+'\n',encoding='utf-8')
          print('SQL view definitions:',len(rows))
          PY
          if test -s /tmp/qa-views.sql; then
            npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --yes \
              --file=/tmp/qa-views.sql > /tmp/qa-view-log 2>&1
          fi
      - name: Retain admin login and prevent other staff access to QA
        run: |
          set -euo pipefail
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" = "$QA_DB_ID"
          npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --json \
            --command="UPDATE app_users SET is_active=0 WHERE role<>'admin'" > /tmp/qa-disable-nonadmins.json
          npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM app_users WHERE role='admin' AND is_active=1) active_admins,
              (SELECT COUNT(*) FROM app_users WHERE role<>'admin' AND is_active=1) active_other_users,
              (SELECT COUNT(*) FROM watch_brands) brands,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM inventory_stock) stock,
              (SELECT COUNT(*) FROM orders) orders_count" > /tmp/qa-copy-summary.json
          jq -e '(if type=="array" then .[0].results[0] else .results[0] end)
            | select(.active_admins>=1 and .active_other_users==0 and .brands>=2 and .variants>=1)' \
            /tmp/qa-copy-summary.json >/dev/null
          npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --json \
            --command="PRAGMA foreign_key_check" > /tmp/qa-copy-fk.json
          jq -e '(if type=="array" then .[0].results else .results end)|length==0' /tmp/qa-copy-fk.json >/dev/null
          echo "Real administrator login hashes preserved in QA D1. Non-admin login access disabled there only."
      - name: Deploy only independent QA Worker
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.client3-qa.jsonc)" = "$QA_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" = "$QA_DB_ID"
          npx wrangler deploy --config wrangler.client3-qa.jsonc
      - name: Verify QA site, isolation and authentication boundaries
        run: |
          set -euo pipefail
          QA_URL="https://$QA_WORKER.orders-clothes.workers.dev"
          test "$(curl -sSL -o /tmp/qa-home -w '%{http_code}' --max-time 30 "$QA_URL/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/qa-home
          for path in '/api/client3/watches/logistics?status=all' \
            '/api/client3/watches/orders?brand=TAUWACH' \
            '/api/client3/watches/cash'; do
            status=$(curl -sS -o /tmp/qa-unauth -w '%{http_code}' --max-time 30 "$QA_URL$path")
            test "$status" = 401 -o "$status" = 403
          done
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" != "$SOURCE_DB_ID"
          echo "CLIENT3_QA_COPY_READY $QA_URL"
      - name: Publish link after proven success
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body \
            "Client3 independent QA COPY READY: https://orders-app-client3-qa-20261103.orders-clothes.workers.dev . Source: most recent deployed Client3 after PR #786. Isolated Worker=$QA_WORKER, separate D1=$QA_DB (ID $QA_DB_ID). Exported live Client3 snapshot in ephemeral runner, retained active admin login/password hashes, disabled all non-admin logins IN QA ONLY, copied catalog, orders, finance and stock for safe practical testing. Source D1 never written; Main and Branch2 untouched. QA unauthenticated smoke/FK pass. Action: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Never use QA for live customer operations."
      - name: Record failure without claiming test URL is ready
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body \
            "Client3 independent QA COPY attempt failed or blocked: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Only a new isolated D1 may have been created; source Client3 database and Main/Branch2 were not targeted for writes. Do not use QA URL until successful smoke."
