name: Prepare Workshop sent-order manager fix

on:
  push:
    branches: [safe/manager-workshop-sent-edit-r2-20260902]
    paths:
      - scripts/.manager-workshop-fix-prep-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize the already-applied minimal guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/features/sections/WorkshopSection.tsx')
          text = path.read_text()
          old = """                            {task.shippingStatus !== 'sent' ? (\n  <button\n                                className=\"secondary compact\"\n                                type=\"button\"\n                                onClick={() => void openWorkshopOrderEditor(task)}\n                              >\n                                Редактировать заказ\n                              </button>\n) : null}"""
          new = """                            {task.shippingStatus !== 'sent' ? (\n                              <button\n                                className=\"secondary compact\"\n                                type=\"button\"\n                                onClick={() => void openWorkshopOrderEditor(task)}\n                              >\n                                Редактировать заказ\n                              </button>\n                            ) : null}"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one already-guarded Workshop edit block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node scripts/test-manager-workshop-sent-order-actions-r2.mjs
          git diff --check
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add src/features/sections/WorkshopSection.tsx
          git commit -m "Normalize Workshop sent-order action guard"
          git push origin HEAD:safe/manager-workshop-sent-edit-r2-20260902
