name: Branch2 W8 Warehouse Operation Release
on:
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/w8-branch2-selective-release.yml'
permissions:
  contents: read
  statuses: write
jobs:
  release:
    name: W8 guarded branch2 only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Enforce exact file scope and test D1 database
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "branch2"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          baseline="7d06a0ba047e56ab740cc816ad9e219d0eae5e2c"
          git cat-file -e "$baseline^{commit}"
          changed="$(git diff --name-only "$baseline" "$GITHUB_SHA")"
          test -n "$changed"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              worker/index.ts|\
              worker/domains/warehouse-operation-feedback.ts|\
              src/App.tsx|\
              src/features/sections/InventorySection.tsx|\
              src/features/inventory/views/InventoryUnifiedQuantityWorkspace.tsx|\
              src/features/inventory/views/renderInventoryMovementPanel.tsx|\
              src/styles/193-unified-inventory-operations.css|\
              scripts/test-w8-warehouse-operation-integrity.mjs|\
              scripts/verify-w8-branch2-live.mjs|\
              .github/workflows/w8-warehouse-operations.yml|\
              .github/workflows/w8-branch2-selective-release.yml) ;;
              *) echo "Non-W8 file in release: $file" >&2;exit 11;;
            esac
          done <<< "$changed"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc;then
            echo "Production database binding forbidden" >&2;exit 12
          fi
          if grep -Eq '^(migrations/|wrangler.jsonc|package.json|package-lock.json)' <<< "$changed";then
            echo "Data schema or dependency changes forbidden" >&2;exit 13
          fi
      - run: npm ci
      - name: Source-specific regression and known failure contracts
        run: node --experimental-strip-types scripts/test-w8-warehouse-operation-integrity.mjs
      - name: Prior warehouse and revision guarantees
        run: |
          node --experimental-strip-types scripts/test-w6-unified-operations.mjs
          node scripts/test-step191d-transfer-runtime-safety.mjs
          node scripts/test-arrival-save-reliability.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
      - run: npm run build
      - name: Deploy test Worker without D1 migration
        run: npx wrangler deploy
      - name: Verify published warehouse UI
        run: node scripts/verify-w8-branch2-live.mjs
      - name: Mark release successful
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg u "$target" '{state:"success",context:"w8-branch2-selective-release",description:"W8 branch2 build, test and live asset verified",target_url:$u}')" >/dev/null
