name: W1 self apply

on:
  push:
    branches:
      - safe/w1-warehouse-reliability-20260905

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply W1 patch
        run: |
          python scripts/apply-w1-warehouse-reliability.py
          python scripts/fix-w1-generated-test.py
          python scripts/apply-w1-preservation.py
      - name: Install dependencies
        run: npm ci
      - name: Measure exact renderer hash
        run: node scripts/measure-w1-panel-hash.mjs
      - name: Validate W1
        run: |
          node scripts/test-w1-warehouse-reliability.mjs
          npm run release:check
          npm run verify:db-safety
          npm run typecheck
          npm run build
          npm run lint
          npx --no-install wrangler deploy --dry-run
      - name: Commit W1 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles/187-inventory-health.css src/features/inventory/views/renderInventoryCatalogPanel.tsx scripts/test-w1-warehouse-reliability.mjs scripts/test-step1906b-frontend-modularization.mjs scripts/w1-warehouse-reliability-frontend-manifest.json package.json
          git commit -m "W1: restore Warehouse manager flow and review reliability"
          git push origin HEAD:${GITHUB_REF_NAME}
