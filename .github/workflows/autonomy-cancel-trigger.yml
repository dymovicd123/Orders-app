name: Autonomy cancel trigger

on:
  push:
    branches:
      - autonomy-cancel-r1
    paths:
      - scripts/.autonomy-cancel-trigger

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract and apply guarded patch
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /python - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/autonomy-cancel-r1.yml > /tmp/autonomy_patch.py
          test -s /tmp/autonomy_patch.py
          python /tmp/autonomy_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full release gates
        run: npm run release:check
      - name: Commit tested patch on staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "orders-app-autonomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker/domains/lifecycle.ts worker/index.ts src/App.tsx src/features/sections/OrderReturnsSection.tsx src/features/sections/OrderExchangeSection.tsx scripts/test-return-exchange-cancel-autonomy.mjs package.json
          git diff --cached --check
          git commit -m "Make return and exchange cancellation autonomous"
          git push origin HEAD:autonomy-cancel-r1
