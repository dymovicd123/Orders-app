name: Branch2 read-only retired-item correction diagnosis 20261018
on:
  pull_request:
    branches: [branch2]
    paths: ['.github/workflows/branch2-retired-correction-diagnostic-20261018.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Hard pin separate test D1 database
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -Eiq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
      - run: npm ci
      - name: Read-only failed correction state; no customer identifiers or SQL updates
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --json --command "
            SELECT oi.id AS item_id, oi.order_id,
              o.order_status,o.shipping_status,
              o.total_amount,o.received_amount,o.debt_amount,
              oi.product_id,oi.variant_id,oi.source_type,oi.is_workshop,oi.quantity,
              oi.unit_price,oi.line_total,oi.stock_writeoff_status,
              cv.is_active AS retired_variant_active,sp.is_active AS retired_execution_active,
              (SELECT COUNT(*) FROM exchanges e WHERE e.order_id=o.id AND COALESCE(e.status,'completed')<>'cancelled') AS blocking_exchanges,
              (SELECT COUNT(*) FROM returns ret WHERE ret.order_id=o.id AND COALESCE(ret.status,'completed')<>'cancelled') AS blocking_returns,
              (SELECT COUNT(*) FROM inventory_reservations u WHERE u.order_id=o.id AND u.status='fulfilled') AS fulfilled_reservations,
              (SELECT GROUP_CONCAT(ir.status || ':' || ir.id) FROM inventory_reservations ir WHERE ir.order_item_id=oi.id) AS reservation_states,
              (SELECT GROUP_CONCAT(j.status || ':' || j.new_variant_id) FROM retired_order_item_corrections j WHERE j.order_item_id=oi.id) AS correction_state,
              (SELECT COUNT(*) FROM retired_order_item_issues d WHERE d.order_item_id=oi.id) AS issue_records
            FROM orders o JOIN order_items oi ON oi.order_id=o.id
            LEFT JOIN catalog_variants cv ON cv.id=oi.variant_id
            LEFT JOIN catalog_stock_positions sp ON sp.id=cv.stock_position_id
            WHERE o.external_id='ORD-20261018142249-5C6A8E03'
            ORDER BY oi.id;
          " | jq -c '.[0].results'
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --json --command "
            SELECT v.id AS candidate_variant_id, v.material,v.color,v.size_label,
              v.is_active,sp.is_active AS execution_active,
              s.inventory_source,s.quantity,s.reserved_quantity,
              (SELECT COUNT(*) FROM inventory_stock ss
               WHERE ss.inventory_source=s.inventory_source AND ss.variant_id=v.id) AS same_variant_stock_rows
            FROM catalog_variants v JOIN catalog_stock_positions sp ON sp.id=v.stock_position_id
            LEFT JOIN inventory_stock s ON s.variant_id=v.id
            WHERE v.product_id IN (
             SELECT DISTINCT oi.product_id FROM order_items oi JOIN orders o ON o.id=oi.order_id
             WHERE o.external_id='ORD-20261018142249-5C6A8E03'
             ) AND v.is_active=1 AND sp.is_active=1
            ORDER BY v.id LIMIT 60;
          " | jq -c '.[0].results'
