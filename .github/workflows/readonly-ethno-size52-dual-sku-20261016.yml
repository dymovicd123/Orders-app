name: 'READ ONLY complete size52 duplicate SKU history'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-ethno-size52-dual-sku-20261016.mjs'
      - '.github/workflows/readonly-ethno-size52-dual-sku-20261016.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate pinned read-only production
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$GITHUB_BASE_REF" == 'main' ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          node --check scripts/ops/readonly-ethno-size52-dual-sku-20261016.mjs
          cat > "$RUNNER_TEMP/read-only-size52.jsonc" <<'CFG'
          {
            "name": "orders-app-size52-forensic-select-only",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/read-only-size52.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Full pair 1280 and 1532 history, reversals and blockers
        run: node scripts/ops/readonly-ethno-size52-dual-sku-20261016.mjs
