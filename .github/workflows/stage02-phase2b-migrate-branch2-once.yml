name: Stage02 Phase2B one-off Branch2 D1 migration

on:
  push:
    branches:
      - ops-stage02-phase2b-migrate-branch2-20260919

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply Stage02 Phase2A evidence schema to Branch2 only
        run: npx wrangler d1 execute orders_db_branch2 --remote --file=migrations/0071_v72_inventory_operation_evidence.sql
