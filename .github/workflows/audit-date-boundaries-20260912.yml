name: Audit date boundaries 20260912

on:
  push:
    branches:
      - audit/date-boundaries-20260912
    paths:
      - .github/workflows/audit-date-boundaries-20260912.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/date-boundaries-20260912
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply date-boundary fix
        run: node scripts/apply-date-boundary-fix-r1.mjs

      - name: Preserve Worker declaration shape
        run: node scripts/repair-date-boundary-worker-shape-r1.mjs

      - name: Register exact Worker delta
        run: node scripts/register-date-boundary-worker-gate-r1.mjs

      - name: Focused business-date regression
        run: node scripts/test-business-date-boundaries-r1.mjs

      - name: Full cumulative release gate
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove temporary audit machinery
        shell: bash
        run: |
          rm -f scripts/apply-date-boundary-fix-r1.mjs
          rm -f scripts/repair-date-boundary-worker-shape-r1.mjs
          rm -f scripts/register-date-boundary-worker-gate-r1.mjs
          rm -f .github/workflows/audit-date-boundaries-20260912.yml

      - name: Verify final diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test ! -e scripts/apply-date-boundary-fix-r1.mjs
          test ! -e scripts/repair-date-boundary-worker-shape-r1.mjs
          test ! -e scripts/register-date-boundary-worker-gate-r1.mjs
          test ! -e .github/workflows/audit-date-boundaries-20260912.yml
          git diff --check

      - name: Commit validated business-date fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Use Kazakhstan business date across date-only workflows'
          git push origin HEAD:audit/date-boundaries-20260912
