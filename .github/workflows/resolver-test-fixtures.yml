name: Seed resolver manual test orders

on:
  push:
    branches:
      - branch2
    paths:
      - .github/workflows/resolver-test-fixtures.yml

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      DB_ID: 40065052-854e-44b8-bcd5-251bdd488301
    steps:
      - name: Seed ordered T01-T20 fixtures into Branch2 D1
        shell: bash
        run: |
          set -euo pipefail
          exec_sql() {
            local sql="$1"
            local response
            response="$(curl --fail-with-body -sS               -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$DB_ID/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')")"
            if [[ "$(jq -r '.success // false' <<<"$response")" != "true" ]]; then
              echo "$response" | jq .
              exit 1
            fi
          }
          query() {
            local sql="$1"
            curl --fail-with-body -sS               -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$DB_ID/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"               | jq -c '.result[]?.results // []'
          }

          # Idempotent cleanup for this exact manual T01-T20 set.
          exec_sql "DELETE FROM inventory_reservations WHERE order_id IN (SELECT id FROM orders WHERE external_id LIKE 'TEST-T__-%')"
          exec_sql "DELETE FROM workshop_tasks WHERE order_id IN (SELECT id FROM orders WHERE external_id LIKE 'TEST-T__-%')"
          exec_sql "DELETE FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE external_id LIKE 'TEST-T__-%')"
          exec_sql "DELETE FROM orders WHERE external_id LIKE 'TEST-T__-%'"

          # Controlled Branch2-only stock baselines used by exact-SKU/replay tests.
          exec_sql "UPDATE inventory_stock SET quantity=20, last_action='Тестовый остаток T01-T20', last_source_ref='resolver-manual-20260920', updated_at=datetime('now') WHERE inventory_source='warehouse' AND variant_id=626"
          exec_sql "UPDATE inventory_stock SET quantity=0, last_action='Тестовый нулевой остаток T02', last_source_ref='resolver-manual-20260920', updated_at=datetime('now') WHERE inventory_source='warehouse' AND variant_id=629"
          exec_sql "INSERT INTO inventory_stock (inventory_source,product_id,variant_id,product_name_snapshot,gender_snapshot,color_snapshot,material_snapshot,length_snapshot,size_snapshot,quantity,reserved_quantity,last_action,last_source_ref,created_at,updated_at) SELECT 'warehouse',v.product_id,v.id,p.name,v.gender,v.color,v.material,v.length,v.size_label,5,0,'Тестовый остаток T14','resolver-manual-20260920',datetime('now'),datetime('now') FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id WHERE v.id=44 AND NOT EXISTS (SELECT 1 FROM inventory_stock s WHERE s.inventory_source='warehouse' AND s.variant_id=44)"
          exec_sql "INSERT INTO inventory_stock (inventory_source,product_id,variant_id,product_name_snapshot,gender_snapshot,color_snapshot,material_snapshot,length_snapshot,size_snapshot,quantity,reserved_quantity,last_action,last_source_ref,created_at,updated_at) SELECT 'warehouse',v.product_id,v.id,p.name,v.gender,v.color,v.material,v.length,v.size_label,5,0,'Тестовый остаток T14','resolver-manual-20260920',datetime('now'),datetime('now') FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id WHERE v.id=45 AND NOT EXISTS (SELECT 1 FROM inventory_stock s WHERE s.inventory_source='warehouse' AND s.variant_id=45)"
          exec_sql "UPDATE inventory_stock SET quantity=5,last_action='Тестовый остаток T14',last_source_ref='resolver-manual-20260920',updated_at=datetime('now') WHERE inventory_source='warehouse' AND variant_id IN (44,45)"

          # Insert in reverse order: UI sorts same-day orders by id DESC, so T01 will appear first.
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T20-ОДИН-ВОПРОС','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T20 — Ровно один неизвестный параметр. Ожидание: показать только товар и один вопрос про размер.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T19-CANONICAL-ПРОТИВ-SNAPSHOT','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T19 — Canonical variant против старого snapshot. Ожидание: variantId и серверная истина сильнее старых полей.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T18-ЦЕХ-БЕЗ-СКЛАДА','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T18 — Товар Цеха. Ожидание: уточнение товара допустимо, но складской остаток и обычный SKU не должны требоваться.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T17-ДВОЙНАЯ-ОТПРАВКА','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T17 — Double submit или replay отправки. Ожидание: одно физическое списание и один победивший send.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T16-MANAGER-ADMIN-RESUME','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T16 — Manager → Admin → обратно. Ожидание: вернуться к тому же заказу и тому же уточнению.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T15-НЕСКОЛЬКО-НЕИЗВЕСТНЫХ','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T15 — Несколько разных неизвестностей в одном заказе. Ожидание: пройти их последовательно без потери прогресса.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T14-ДВА-ПОХОЖИХ-SKU','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T14 — Два очень похожих, но разных SKU. Ожидание: не склеить варианты и сохранить разные variantId.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T13-НЕОДНОЗНАЧНЫЕ-ЦВЕТ-РАЗМЕР','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T13 — Цвет и размер не указаны при нескольких допустимых SKU. Ожидание: не угадывать, а спросить.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T12-ТОЧНЫЙ-SKU-ПУСТЫЕ-ПОЛЯ','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T12 — variantId точный, но snapshot цвета и размера пуст. Ожидание: canonical SKU должен победить без ложнего вопроса.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T11-ФИКС-ПОЛ-БЕЗ-ПОЛЯ','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T11 — Точный SKU товара с фиксированным полом, snapshot пола пуст. Ожидание: не спрашивать пол.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T10-UNISEX-БЕЗ-ПОЛА','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T10 — Unisex товар без пола. Ожидание: спросить только пол, не угадывать.',datetime('now'),datetime('now'))"
