          # Human-inventory reservations: exact rows active; unresolved rows unresolved; Workshop excluded.
          exec_sql "INSERT INTO inventory_reservations (order_id,order_item_id,inventory_source,product_id,variant_id,quantity,status,reference_type,reference_id,unresolved_reason,created_at,updated_at) SELECT o.id,oi.id,'warehouse',oi.product_id,oi.variant_id,oi.quantity,CASE WHEN oi.product_id IS NOT NULL AND oi.variant_id IS NOT NULL THEN 'active' ELSE 'unresolved' END,'order',o.external_id,CASE WHEN oi.product_id IS NULL THEN 'product' WHEN oi.variant_id IS NULL THEN 'variant' ELSE NULL END,datetime('now'),datetime('now') FROM orders o JOIN order_items oi ON oi.order_id=o.id WHERE o.external_id LIKE 'TEST-T__-%' AND oi.is_workshop=0"

          # Recompute visible reserved counters for the exact test variants.
          exec_sql "UPDATE inventory_stock SET reserved_quantity=COALESCE((SELECT SUM(r.quantity) FROM inventory_reservations r WHERE r.status='active' AND r.inventory_source=inventory_stock.inventory_source AND r.variant_id=inventory_stock.variant_id),0),updated_at=datetime('now') WHERE inventory_source='warehouse' AND variant_id IN (44,45,626,629)"

