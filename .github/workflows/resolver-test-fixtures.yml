          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T06-СОСТАВНОЕ-НАЗВАНИЕ','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T06 — Составное название с лишней частью. Ожидание: выделить базовый товар и отдельно классифицировать остаток названия.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T05-ОПЕЧАТКА-ТОВАРА','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T05 — Опечатка в известном товаре. Ожидание: предложить существующий товар, но не выбирать его молча.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T04-НОВЫЙ-ТОВАР','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T04 — Действительно новый товар. Ожидание: не угадывать существующий товар и не создавать без явного решения.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T03-НОВАЯ-КОМБИНАЦИЯ','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T03 — Все значения известны, но такой комбинации SKU нет. Ожидание: безопасно создать комбинацию с Physical 0 без лишнего вопроса.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T02-ТОЧНЫЙ-SKU-ОСТАТОК-0','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T02 — Точный известный SKU, Physical 0. Ожидание: каталог не спрашивает ничего, при отправке появляется stock possession flow.',datetime('now'),datetime('now'))"
          exec_sql "INSERT INTO orders (external_id,order_date,manager_id,city,delivery_type,source_type,workshop_status,order_status,total_amount,received_amount,debt_amount,return_amount,comment,created_at,updated_at) VALUES ('TEST-T01-ТОЧНЫЙ-SKU-ОСТАТОК-ЕСТЬ','2026-09-20',8,'ТЕСТ','ТЕСТ','warehouse','in_workshop','active',0,0,0,0,'T01 — Точный известный SKU, Physical есть. Ожидание: отправка без catalog resolver и без stock resolver.',datetime('now'),datetime('now'))"

