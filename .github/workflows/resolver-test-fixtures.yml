name: Resolver test fixture helper

on:
  push:
    branches:
      - branch2
    paths:
      - .github/workflows/resolver-test-fixtures.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      DB_ID: 40065052-854e-44b8-bcd5-251bdd488301
    steps:
      - name: Inspect Branch2 catalog for manual resolver fixtures
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local sql="$1"
            curl --fail-with-body -sS               -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$DB_ID/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')"               | jq -c '.result[]?.results // []'
          }
          echo '=== MANAGERS ==='
          query "SELECT id,name,is_active FROM managers ORDER BY is_active DESC,id LIMIT 20"
          echo '=== ACTIVE VARIANTS WITH STOCK ==='
          query "SELECT s.inventory_source,s.quantity,s.reserved_quantity,v.id AS variant_id,v.product_id,p.name AS product_name,COALESCE(v.category,p.category,'adult') AS category,v.gender,v.color,v.material,v.length,v.size_label,COALESCE(p.gender_scope,'unisex') AS gender_scope FROM inventory_stock s JOIN catalog_variants v ON v.id=s.variant_id JOIN catalog_products p ON p.id=v.product_id WHERE p.is_active=1 AND v.is_active=1 ORDER BY (s.quantity-COALESCE(s.reserved_quantity,0)) DESC,s.quantity DESC,s.id LIMIT 30"
          echo '=== ZERO STOCK VARIANTS ==='
          query "SELECT s.inventory_source,s.quantity,s.reserved_quantity,v.id AS variant_id,v.product_id,p.name AS product_name,COALESCE(v.category,p.category,'adult') AS category,v.gender,v.color,v.material,v.length,v.size_label,COALESCE(p.gender_scope,'unisex') AS gender_scope FROM inventory_stock s JOIN catalog_variants v ON v.id=s.variant_id JOIN catalog_products p ON p.id=v.product_id WHERE p.is_active=1 AND v.is_active=1 AND COALESCE(s.quantity,0)=0 ORDER BY s.id LIMIT 20"
          echo '=== PRODUCTS WITH MULTIPLE VARIANTS ==='
          query "SELECT p.id,p.name,COALESCE(p.gender_scope,'unisex') AS gender_scope,COUNT(v.id) AS variants,COUNT(DISTINCT COALESCE(v.gender,'')) AS genders,COUNT(DISTINCT COALESCE(v.color,'')) AS colors,COUNT(DISTINCT COALESCE(v.size_label,'')) AS sizes FROM catalog_products p JOIN catalog_variants v ON v.product_id=p.id AND v.is_active=1 WHERE p.is_active=1 GROUP BY p.id,p.name,p.gender_scope HAVING COUNT(v.id)>=2 ORDER BY variants DESC,p.id LIMIT 30"
          echo '=== REFERENCES ==='
          query "SELECT kind,value FROM reference_values WHERE is_active=1 AND kind IN ('material','length','color','size','child_age') ORDER BY kind,sort_order,value LIMIT 200"
          echo '=== EXISTING RES T02-T14 ITEMS ==='
          query "SELECT o.id AS order_id,o.external_id,o.comment,oi.id AS item_id,oi.product_id,oi.variant_id,oi.product_name_snapshot,oi.audience_type,oi.gender_snapshot,oi.color_snapshot,oi.material_snapshot,oi.length_snapshot,oi.size_snapshot,oi.quantity,oi.is_workshop,oi.source_type,oi.stock_writeoff_status FROM orders o JOIN order_items oi ON oi.order_id=o.id WHERE o.id BETWEEN 29 AND 43 ORDER BY o.id,oi.id"
          echo '=== EXISTING RES T02-T14 WORKSHOP TASKS ==='
          query "SELECT wt.* FROM workshop_tasks wt WHERE wt.order_id BETWEEN 29 AND 43 ORDER BY wt.order_id,wt.id"
          echo '=== RECENT TEST-LIKE ORDERS ==='
          query "SELECT id,external_id,order_date,comment,created_at FROM orders WHERE comment LIKE '%RESOLVER%' OR external_id LIKE 'RESOLVER-%' ORDER BY id DESC LIMIT 50"
