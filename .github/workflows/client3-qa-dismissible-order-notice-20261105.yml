name: Client3 QA ONLY — dismissible order save notification
on:
  push:
    branches: [client3/qa-dismissible-order-notice-20261105]
    paths: ['.github/workflows/client3-qa-dismissible-order-notice-20261105.yml']
permissions:
  contents: read
concurrency:
  group: client3-qa-source-first-order
  cancel-in-progress: false
jobs:
  verify-and-deploy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      LIVE_WORKER: orders-app-client3-old-client
      LIVE_DB_ID: 0717f239-6d81-4837-8586-777d94e22c53
      QA_WORKER: orders-app-client3-qa-20261103
      QA_DB: orders_db_client3_qa_41698114208
      QA_DB_ID: fbe857ed-1dd5-41ee-8cb6-37f1c0cff7f8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Strict branch, diff and QA D1 isolation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/qa-dismissible-order-notice-20261105
          test "$(git rev-parse HEAD^)" = da52beb3c2f3107c5b7a9fc91b050c45ba93bcc3
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$QA_DB_ID" != "$LIVE_DB_ID"
          test "$QA_WORKER" != "$LIVE_WORKER"
          test "$(jq -r .name wrangler.jsonc)" = "$LIVE_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = "$LIVE_DB_ID"
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          python3 - <<'PY'
          import subprocess
          allowed={
            'src/WatchClient3App.tsx',
            'src/features/client3/Client3MainChrome.tsx',
            'src/styles/client3-order-toast.css',
            'scripts/client3/test-watch-order-transient-notice-20261105.mjs',
            '.github/workflows/client3-qa-dismissible-order-notice-20261105.yml',
          }
          got=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert got==allowed, 'QA order release missing/unexpected paths: '+repr(got.symmetric_difference(allowed))
          assert not any(x.startswith('migrations/') or x in ('wrangler.jsonc','package.json','package-lock.json') for x in got)
          print('CLIENT3_QA_SOURCE_FIRST_ISOLATION_PASS')
          PY
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          config=json.loads(Path('wrangler.jsonc').read_text())
          assert config['name']==os.environ['LIVE_WORKER']
          assert config['d1_databases'][0]['database_id']==os.environ['LIVE_DB_ID']
          config['name']=os.environ['QA_WORKER']
          config['d1_databases'][0]['database_name']=os.environ['QA_DB']
          config['d1_databases'][0]['database_id']=os.environ['QA_DB_ID']
          config['vars']['CLIENT3_QA_COPY']='1'
          Path('wrangler.client3-qa.jsonc').write_text(json.dumps(config,ensure_ascii=False,indent=2))
          PY
          test "$(jq -r .name wrangler.client3-qa.jsonc)" = "$QA_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" = "$QA_DB_ID"
          ! grep -Eq 'orders_db_prod|orders_db_branch2' wrangler.client3-qa.jsonc
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Build and test availability, manual SKU, order lifecycle, catalog
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --experimental-strip-types scripts/client3/test-watch-order-transient-notice-20261105.mjs
          node --experimental-strip-types scripts/client3/test-watch-shell-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-source-first-order-20261105.mjs
          node --experimental-strip-types scripts/client3/test-watch-form-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-order-commit-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-catalog-v6-release-20261104.mjs
          node --experimental-strip-types scripts/client3/test-watch-order-editor-delete-release-20261105.mjs
          node --experimental-strip-types scripts/client3/test-watch-logistics-20261102.mjs
          echo CLIENT3_QA_SOURCE_FIRST_REGRESSION_PASS
      - name: Read-only QA schema and existing stock lifecycle guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" = "$QA_DB_ID"
          npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_variant_attributes_v6') v6,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='inventory_stock') stock,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='inventory_reservations') reservations,
            (SELECT COUNT(*) FROM watch_brands) brands,
            (SELECT COUNT(*) FROM app_users WHERE role='admin' AND is_active=1) admins,
            (SELECT COUNT(*) FROM orders) orders_count" |
            jq -e '.[0].results[0] | select(.v6==1 and .stock==1 and .reservations==1 and .brands>=2 and .admins>=1)'
          npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results | length==0'
          echo CLIENT3_QA_SOURCE_FIRST_D1_PREFLIGHT_PASS
      - name: Deploy only isolated QA Worker and existing QA D1; never production
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.client3-qa.jsonc)" = "$QA_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.client3-qa.jsonc)" = "$QA_DB_ID"
          npx wrangler deploy --config wrangler.client3-qa.jsonc
          echo CLIENT3_QA_SOURCE_FIRST_DEPLOY_PASS
      - name: Verify QA homepage, JS identity, anonymous protection, D1 FK
        shell: bash
        run: |
          set -euo pipefail
          base=https://orders-app-client3-qa-20261103.orders-clothes.workers.dev
          asset="$(grep -Eo 'src="/assets/[^"]+\.js"' dist/client/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$asset"
          test -s "dist/client$asset"
          matched=0
          for attempt in $(seq 1 12); do
            home_code="$(curl -sSL --max-time 20 -o /tmp/qa-home -w '%{http_code}' "$base/?source_first=$GITHUB_SHA" || true)"
            js_code="$(curl -sSL --max-time 25 -o /tmp/qa-asset -w '%{http_code}' "$base$asset" || true)"
            if test "$home_code" = 200 && grep -Eq 'id="root"|type="module"' /tmp/qa-home &&
              test "$js_code" = 200 && cmp -s "dist/client$asset" /tmp/qa-asset; then
              matched=1
              echo "CLIENT3_QA_SOURCE_FIRST_ASSET_IDENTITY_PASS attempt=$attempt asset=$asset"
              break
            fi
            sleep 3
          done
          test "$matched" = 1
          for path in '/api/client3/watches/models?brand=TAUWACH' '/api/client3/watches/orders?brand=TAUWACH' '/api/client3/watches/analytics?brand=TAUWACH&from=2026-11-01&to=2026-11-05'; do
            code="$(curl -sS --max-time 20 -o /tmp/qa-anon -w '%{http_code}' "$base$path")"
            echo "CLIENT3_QA_ANONYMOUS_HTTP $code $path"
            test "$code" = 401 -o "$code" = 403
          done
          npx wrangler d1 execute "$QA_DB" --remote --config wrangler.client3-qa.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results | length==0'
          echo CLIENT3_QA_SOURCE_FIRST_RELEASE_VERIFIED
