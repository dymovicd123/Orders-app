name: Client3 ORIGINAL — QA order editor and safe delete chain release
on:
  push:
    branches: [release/client3-orders-editor-delete-20261105]
    paths:
      - '.github/workflows/client3-orders-editor-delete-release-20261105.yml'
permissions:
  contents: read
concurrency:
  group: client3-original-orders-editor-delete-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      ORIGINAL_WORKER: orders-app-client3-old-client
      ORIGINAL_DB: orders_db_client3_old_client
      ORIGINAL_DB_ID: 0717f239-6d81-4837-8586-777d94e22c53
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Verify exact original Client3 source, no Main or Branch2 changes
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release/client3-orders-editor-delete-20261105
          test "$(git rev-parse HEAD^)" = 2dace77e4518e4b9791aaa3198294ab7e63b1261
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(jq -r .name wrangler.jsonc)" = "$ORIGINAL_WORKER"
          test "$(jq -r .main wrangler.jsonc)" = worker/index.ts
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = "$ORIGINAL_DB"
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = "$ORIGINAL_DB_ID"
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          python3 - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/client3-orders-editor-delete-release-20261105.yml',
            'worker/domains/client3-watch-admin-order.ts',
            'worker/domains/client3-watch-admin-payment-method.ts',
            'worker/domains/client3-watch-orders-read.ts',
            'worker/domains/client3-watches.ts',
            'src/features/client3/WatchOrdersPanel.tsx',
            'src/features/client3/WatchOrderCorrections.tsx',
            'src/features/client3/WatchAdminOrderActions.tsx',
            'src/features/client3/WatchAdminDeleteChainPanel.tsx',
            'src/features/client3/watchMainOrderProjection.ts',
            'src/styles/client3-main-orders-copied.css',
            'src/styles/client3-qa-main-parity-20261104.css',
            'src/styles/client3-watch-edit-buttons-20261104.css',
            'src/styles/client3-watch-admin-delete-chain.css',
            'src/WatchClient3App.tsx',
            'scripts/client3/test-watch-orders-read-20261102.mjs',
            'scripts/client3/test-watch-order-editor-delete-release-20261105.mjs',
          }
          got=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          assert got==allowed, 'Unexpected or missing release files: '+repr(got.symmetric_difference(allowed))
          assert not any(x.startswith('migrations/') or x in ('wrangler.jsonc','package.json','package-lock.json') for x in got)
          print('CLIENT3_SCOPED_ORDER_EDITOR_DELETE_SOURCE_GUARD_PASS')
          PY
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: TypeScript, Vite build, order editor, safe deletion, original catalog regression
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --experimental-strip-types scripts/client3/test-watch-order-editor-delete-release-20261105.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-catalog-v6-release-20261104.mjs
          node --experimental-strip-types scripts/client3/test-watch-provision-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-logistics-20261102.mjs
          echo CLIENT3_EDITOR_DELETE_REGRESSION_SUITE_PASS
      - name: Read-only original D1 guard — saga, payments, v6, FK and business snapshots
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$ORIGINAL_DB" --remote --config wrangler.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='admin_order_delete_sagas') sagas,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='admin_order_delete_saga_steps') steps,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='critical_operations') critical,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='watch_variant_attributes_v6') generations,
            (SELECT COUNT(*) FROM pragma_table_info('payments') WHERE name='payment_kind') kind,
            (SELECT COUNT(*) FROM pragma_table_info('orders') WHERE name='manager_snapshot_name') manager_snapshot" |
            jq -e '.[0].results[0]|select(.sagas==1 and .steps==1 and .critical==1 and .generations==1 and .kind==1 and .manager_snapshot==1)'
          npx wrangler d1 execute "$ORIGINAL_DB" --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results|length==0'
          npx wrangler d1 execute "$ORIGINAL_DB" --remote --config wrangler.jsonc --json --command="SELECT
            (SELECT COUNT(*) FROM orders) orders_count,
            (SELECT COUNT(*) FROM order_items) items_count,
            (SELECT COUNT(*) FROM payments) payments_count,
            (SELECT COUNT(*) FROM inventory_movements) movements_count,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) stock_count" |
            jq -c '.[0].results[0]' | tee /tmp/client3-before.json
          echo CLIENT3_ORIGINAL_READONLY_SCHEMA_PREFLIGHT_PASS
      - name: Deploy ONLY original Client3 Worker (zero migrations, no direct D1 writes)
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = "$ORIGINAL_WORKER"
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = "$ORIGINAL_DB_ID"
          npx wrangler deploy --config wrangler.jsonc
          echo CLIENT3_ORIGINAL_ORDER_EDITOR_DELETE_WORKER_DEPLOYED
      - name: Verify exact published JS, guarded API and production D1 integrity
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          asset="$(grep -Eo 'src="/assets/[^"]+\.js"' dist/client/index.html | head -n1 | cut -d'"' -f2)"
          test -n "$asset"
          test -s "dist/client$asset"
          verified=0
          for i in $(seq 1 12); do
            home="$(curl -sSL --max-time 20 -o /tmp/c3-home -w '%{http_code}' "$base/?release=$GITHUB_SHA" || true)"
            file="$(curl -sSL --max-time 25 -o /tmp/c3-js -w '%{http_code}' "$base$asset" || true)"
            if test "$home" = 200 && grep -Eq 'id="root"|type="module"' /tmp/c3-home &&
              test "$file" = 200 && cmp -s "dist/client$asset" /tmp/c3-js; then
              verified=1
              echo "CLIENT3_LIVE_JS_IDENTICAL attempt=$i asset=$asset"
              break
            fi
            echo "Client3 live asset awaiting identity: home=$home js=$file attempt=$i"
            sleep 3
          done
          test "$verified" = 1
          for path in '/api/client3/watches/orders?brand=TAUWACH' '/api/client3/watches/orders/1/delete-chain?brand=TAUWACH' '/api/client3/watches/orders/1/delete?brand=TAUWACH'; do
            status="$(curl -sS --max-time 20 -o /tmp/c3-anonymous -w '%{http_code}' "$base$path")"
            echo "CLIENT3_ANONYMOUS_HTTP $status $path"
            test "$status" = 401 -o "$status" = 403
          done
          npx wrangler d1 execute "$ORIGINAL_DB" --remote --config wrangler.jsonc --json --command="PRAGMA foreign_key_check" |
            jq -e '.[0].results|length==0'
          echo CLIENT3_ORIGINAL_EDITOR_DELETE_RELEASE_VERIFIED
