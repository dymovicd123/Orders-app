name: Dashboard workshop attention focused test

on:
  push:
    branches:
      - dashboard-workshop-attention-r1

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-workshop-attention-r1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-dashboard-workshop-attention-r1.mjs
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-workshop-attention-test.yml
          git commit -m "Remove dashboard attention test runner"
          git push origin HEAD:dashboard-workshop-attention-r1
