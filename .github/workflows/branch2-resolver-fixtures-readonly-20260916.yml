name: Branch2 resolver fixtures read-only audit

on:
  push:
    branches:
      - audit/branch2-resolver-fixtures-readonly-20260916
    paths:
      - .github/workflows/branch2-resolver-fixtures-readonly-20260916.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify Branch2-only binding
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "orders-app-branch2"' wrangler.jsonc
          grep -q '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -q '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -q 'orders_db_prod' wrangler.jsonc
      - name: Read exact resolver fixture candidates only
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          SELECT p.id AS product_id,p.name,p.gender_scope,v.id AS variant_id,v.stock_position_id,v.category,v.gender,v.material,v.length,v.color,v.size_label,
                 (SELECT COUNT(*) FROM catalog_variants s WHERE s.product_id=v.product_id AND s.stock_position_id=v.stock_position_id AND s.is_active=1 AND COALESCE(s.category,'adult')=COALESCE(v.category,'adult') AND TRIM(COALESCE(s.color,''))<>'' AND UPPER(TRIM(s.color))<>'БЕЗ ЦВЕТА') AS concrete_color_siblings
          FROM catalog_products p JOIN catalog_variants v ON v.product_id=p.id
          WHERE p.is_active=1 AND v.is_active=1
            AND UPPER(TRIM(COALESCE(v.color,'')))='БЕЗ ЦВЕТА'
            AND TRIM(COALESCE(v.size_label,''))=''
          ORDER BY concrete_color_siblings DESC,p.name,v.id;
          SELECT p.id AS product_id,p.name,p.gender_scope,v.id AS variant_id,v.stock_position_id,v.category,v.gender,v.material,v.length,v.color,v.size_label
          FROM catalog_products p JOIN catalog_variants v ON v.product_id=p.id
          WHERE p.is_active=1 AND v.is_active=1 AND p.gender_scope='unisex'
          ORDER BY p.name,v.id LIMIT 30;
          SQL
          )
          npx wrangler d1 execute orders_db_branch2 --remote --json --command="$SQL" | tee /tmp/catalog-audit.json
          node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/catalog-audit.json','utf8'));
          if(!Array.isArray(x)||x.some(r=>!r.success||Number(r?.meta?.rows_written||0)!==0)) throw new Error('Audit was not read-only or failed');
          console.log('READ_ONLY_FIXTURE_CANDIDATE_AUDIT_OK');
          NODE
