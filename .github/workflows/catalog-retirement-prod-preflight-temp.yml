name: Temporary Production Catalog retirement detailed preflight

on:
  push:
    branches:
      - release/catalog-retirement-main-20260930
    paths:
      - '.github/workflows/catalog-retirement-prod-preflight-temp.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Production Catalog retirement preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard-lock Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "release/catalog-retirement-main-20260930" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then exit 20; fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Detailed SELECT-only audit
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT
            v.id AS bad_variant_id,
            p.id AS product_id,
            p.name AS product_name,
            p.gender_scope,
            v.stock_position_id,
            v.category,
            v.gender,
            v.color,
            v.size_label,
            COALESCE((SELECT SUM(s.quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS physical,
            COALESCE((SELECT SUM(s.reserved_quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS stock_reserved,
            COALESCE((SELECT SUM(r.quantity) FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active'),0) AS active_reserved,
            (SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id=oi.order_id
               WHERE oi.variant_id=v.id AND COALESCE(o.order_status,'active')='active'
                 AND COALESCE(o.shipping_status,'not_sent')<>'sent' AND COALESCE(oi.quantity,0)>0) AS open_order_items,
            (SELECT GROUP_CONCAT(v2.id)
               FROM catalog_variants v2
              WHERE v2.is_active=1
                AND v2.product_id=v.product_id
                AND v2.stock_position_id IS v.stock_position_id
                AND COALESCE(v2.category,'adult')=COALESCE(v.category,'adult')
                AND UPPER(TRIM(COALESCE(v2.gender,'')))=
                    CASE p.gender_scope WHEN 'male' THEN 'МУЖ' WHEN 'female' THEN 'ЖЕН' ELSE UPPER(TRIM(COALESCE(v.gender,''))) END
                AND UPPER(TRIM(COALESCE(v2.color,'')))=UPPER(TRIM(COALESCE(v.color,'')))
                AND UPPER(TRIM(COALESCE(v2.size_label,'')))=UPPER(TRIM(COALESCE(v.size_label,'')))
            ) AS active_expected_gender_counterparts
          FROM catalog_variants v
          JOIN catalog_products p ON p.id=v.product_id
          WHERE v.is_active=1 AND p.is_active=1
            AND (
              (p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,'')))='МУЖ')
              OR (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,'')))='ЖЕН')
            )
          ORDER BY p.id,v.stock_position_id,v.color,v.size_label,v.id;

          SELECT
            v.id AS inactive_variant_id,
            p.id AS product_id,
            p.name AS product_name,
            v.stock_position_id,
            v.category,
            v.gender,
            v.color,
            v.size_label,
            COALESCE((SELECT SUM(s.quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS physical,
            COALESCE((SELECT SUM(s.reserved_quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS stock_reserved,
            COALESCE((SELECT SUM(r.quantity) FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active'),0) AS active_reserved,
            (SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id=oi.order_id
               WHERE oi.variant_id=v.id AND COALESCE(o.order_status,'active')='active'
                 AND COALESCE(o.shipping_status,'not_sent')<>'sent' AND COALESCE(oi.quantity,0)>0) AS open_order_items,
            (SELECT GROUP_CONCAT(v2.id)
               FROM catalog_variants v2
              WHERE v2.is_active=1
                AND v2.product_id=v.product_id
                AND v2.stock_position_id IS v.stock_position_id
                AND COALESCE(v2.category,'adult')=COALESCE(v.category,'adult')
                AND UPPER(TRIM(COALESCE(v2.gender,'')))=UPPER(TRIM(COALESCE(v.gender,'')))
                AND UPPER(TRIM(COALESCE(v2.color,'')))=UPPER(TRIM(COALESCE(v.color,'')))
                AND UPPER(TRIM(COALESCE(v2.size_label,'')))=UPPER(TRIM(COALESCE(v.size_label,'')))
            ) AS active_exact_counterparts,
            (SELECT GROUP_CONCAT(s.id || ':' || s.inventory_source || ':q=' || COALESCE(s.quantity,0) || ':r=' || COALESCE(s.reserved_quantity,0))
               FROM inventory_stock s WHERE s.variant_id=v.id) AS stock_rows,
            (SELECT GROUP_CONCAT(r.id || ':order=' || COALESCE(r.order_id,0) || ':q=' || COALESCE(r.quantity,0))
               FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active') AS reservation_rows
          FROM catalog_variants v
          JOIN catalog_products p ON p.id=v.product_id
          WHERE v.is_active=0
            AND (
              EXISTS (SELECT 1 FROM inventory_stock s WHERE s.variant_id=v.id
                       AND (COALESCE(s.quantity,0)<>0 OR COALESCE(s.reserved_quantity,0)<>0))
              OR EXISTS (SELECT 1 FROM inventory_reservations r WHERE r.variant_id=v.id
                         AND r.status='active' AND COALESCE(r.quantity,0)<>0)
            )
          ORDER BY p.id,v.id;

          SELECT id,name,gender_scope,is_active
          FROM catalog_products
          WHERE id IN (3,4,22,24,10,41)
          ORDER BY id;

          SELECT name
          FROM sqlite_master
          WHERE type='table' AND name IN (
            'catalog_retirement_operations','catalog_retirement_variants',
            'catalog_retirement_restores','catalog_retirement_restore_variants',
            'catalog_retirement_history_events'
          )
          ORDER BY name;
          " --json
