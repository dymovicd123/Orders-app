name: Branch2 KPI read-only discrepancy diagnostic
on:
  push:
    branches: [branch2]
    paths: ['.github/workflows/branch2-kpi-diagnostic-20261027.yml']
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Strict isolated read-only warehouse database
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "branch2"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
      - run: npm ci
      - name: Inspect sent order number 10 with technical fields only
        run: |
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT id, order_date, shipping_date, shipping_status, order_status, manager_id, external_id FROM orders WHERE id = 10 OR external_id LIKE '%5C6A8E03' LIMIT 3" --json
      - name: Inspect item variant binding and stored characteristics
        run: |
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT oi.id, oi.order_id, oi.product_id, oi.variant_id, oi.product_name_snapshot, oi.audience_type, oi.gender_snapshot, oi.color_snapshot, oi.material_snapshot, oi.length_snapshot, oi.size_snapshot, oi.quantity FROM order_items oi WHERE oi.order_id IN (SELECT id FROM orders WHERE id = 10 OR external_id LIKE '%5C6A8E03') LIMIT 15" --json
      - name: Inspect October KPI bindings and filters
        run: |
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT k.id, k.month, k.title, k.product_id, cp.name AS catalog_model, k.filters_json, k.target_quantity, kp.manager_id, kp.quota FROM product_kpis k JOIN catalog_products cp ON cp.id = k.product_id JOIN product_kpi_participants kp ON kp.kpi_id = k.id WHERE k.month = '2026-10' LIMIT 30" --json
      - name: Regression - verified October shipped unit matches adult KPI (read-only)
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
            SELECT COUNT(*) AS qualifying_units
            FROM orders o JOIN order_items oi ON oi.order_id=o.id
            WHERE o.external_id='ORD-20261018142249-5C6A8E03'
              AND o.shipping_status='sent'
              AND DATE(COALESCE(NULLIF(o.shipping_date,''),o.order_date)) BETWEEN '2026-10-01' AND '2026-10-31'
              AND o.manager_id=10 AND oi.product_id=75
              AND (CASE WHEN UPPER(TRIM(COALESCE(oi.audience_type,''))) IN ('','ADULT','ВЗРОСЛЫЙ','ВЗРОСЛАЯ') THEN 'ВЗРОСЛЫЙ' ELSE UPPER(TRIM(oi.audience_type)) END)='ВЗРОСЛЫЙ'
              AND UPPER(TRIM(COALESCE(oi.gender_snapshot,'')))='ЖЕН'
              AND UPPER(TRIM(COALESCE(oi.material_snapshot,'')))='ШЕРСТЬ'
              AND UPPER(TRIM(COALESCE(oi.length_snapshot,'')))='СТАНДАРТ'
          " --json | jq -e '.[0].results[0].qualifying_units==1'
          echo 'OCTOBER_SENT_ETHNO_CARDIGAN_KPI_MATCH_PASS'
