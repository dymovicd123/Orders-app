name: "Branch2 Stage3 remote Cloudflare D1 SELECT-only probe (NO DEPLOY)"
on:
  push:
    branches:
      - test/branch2-stage3-remote-d1-readonly-20261101
    paths:
      - .github/workflows/branch2-stage3-remote-d1-readonly-20261101.yml
permissions:
  contents: read
jobs:
  inspect-branch2-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify strict Branch2 isolation and remote D1 credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/test/branch2-stage3-remote-d1-readonly-20261101"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'BRANCH2_REMOTE_D1_TOKEN_NOT_CONFIGURED'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'BRANCH2_REMOTE_D1_ACCOUNT_NOT_CONFIGURED'; exit 1; }
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2_mirror_20261027"' wrangler.jsonc
          grep -Fq '"database_id": "0904a573-21ff-44d8-93b0-c9200f771702"' wrangler.jsonc
          echo 'BRANCH2_REMOTE_D1_TARGET_GUARD_PASS'
      - name: Query actual remote Branch2 D1 schema and aggregate invariants (SELECT ONLY)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const TARGET='0904a573-21ff-44d8-93b0-c9200f771702'
          const cfg=JSON.parse(readFileSync('wrangler.jsonc','utf8').replace(/\/\*[\s\S]*?\*\//g,''))
          assert.equal(cfg.name,'orders-app-branch2')
          assert.equal(cfg.d1_databases?.length,1,'Only one explicit D1 binding allowed')
          assert.equal(cfg.d1_databases[0].database_id,TARGET)
          assert.equal(cfg.d1_databases[0].database_name,'orders_db_branch2_mirror_20261027')
          const token=process.env.CLOUDFLARE_API_TOKEN
          const account=process.env.CLOUDFLARE_ACCOUNT_ID
          assert(token && account,'Cloudflare credential was not available to the isolated job')
          assert(/^[0-9a-f]{32}$/i.test(account),'Expected Cloudflare account ID')
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+TARGET
          async function call(path,method,sql){
            assert(method==='GET'&&path==='' || method==='POST'&&path==='/query'&&typeof sql==='string'&&/^SELECT\s/i.test(sql)&&!sql.includes(';'),'Only metadata GET and single SELECT allowed')
            const res=await fetch(base+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(sql?{body:JSON.stringify({sql})}:{}),signal:AbortSignal.timeout(22000)})
            const json=await res.json()
            if(!res.ok||json.success===false)throw new Error('BRANCH2_REMOTE_D1_HTTP_ERROR '+res.status+' '+(json.errors||[]).map(x=>x.code).join(','))
            return json.result
          }
          const info=await call('','GET')
          assert.equal(info?.name,'orders_db_branch2_mirror_20261027','Unexpected remote database: abort')
          console.log('REMOTE_BRANCH2_D1_AUTH_OK',JSON.stringify({name:info.name,version:info.version}))
          async function rows(sql) {
            const result=await call('/query','POST',sql)
            return (Array.isArray(result)?result:[result]).flatMap(x=>x?.results||[])
          }
          const required=['orders','order_items','inventory_stock','inventory_reservations','returns','return_items','exchanges','exchange_items','inventory_lifecycle_events','critical_operations','inventory_stock_checks']
          const schema=await rows("SELECT name FROM sqlite_schema WHERE type='table' AND name IN ("+required.map(x=>"'"+x+"'").join(',')+") ORDER BY name")
          const found=schema.map(x=>x.name)
          assert.deepEqual(found,[...required].sort(),'Missing required live Stage3 D1 tables')
          console.log('REMOTE_BRANCH2_D1_SCHEMA_PASS',JSON.stringify({requiredTables:found.length}))
          for(const [table,requiredCols] of [
            ['order_items',['id','order_id','product_id','variant_id','quantity']],
            ['inventory_lifecycle_events',['order_id','order_item_id','variant_id','status','operation_type']],
            ['inventory_reservations',['order_item_id','variant_id','status']],
            ['critical_operations',['request_id','status','step']],
          ]){
            const col=await rows("SELECT name FROM pragma_table_info('"+table+"')")
            const names=new Set(col.map(x=>x.name))
            for(const c of requiredCols)assert(names.has(c),'Missing '+table+'.'+c)
          }
          console.log('REMOTE_BRANCH2_D1_STAGE3_COLUMNS_PASS')
          const aggregateQueries=[
            ['orders',"SELECT COUNT(*) AS n FROM orders"],
            ['order_items',"SELECT COUNT(*) AS n FROM order_items"],
            ['returns',"SELECT COUNT(*) AS n FROM returns"],
            ['exchanges',"SELECT COUNT(*) AS n FROM exchanges"],
            ['pending_lifecycle',"SELECT COUNT(*) AS n FROM inventory_lifecycle_events WHERE status='pending'"],
            ['unidentified_items',"SELECT COUNT(*) AS n FROM order_items WHERE variant_id IS NULL OR product_id IS NULL"],
            ['started_operations',"SELECT COUNT(*) AS n FROM critical_operations WHERE status='started'"],
          ]
          const counts={}
          for(const [label,sql] of aggregateQueries){
            const result=await rows(sql)
            const n=Number(result?.[0]?.n)
            assert(Number.isSafeInteger(n)&&n>=0,'Invalid aggregate '+label)
            counts[label]=n
          }
          console.log('REMOTE_BRANCH2_D1_AGGREGATE_COUNTS',JSON.stringify(counts))
          console.log('REMOTE_BRANCH2_D1_READONLY_PASS: actual Cloudflare remote D1, zero DML, zero writes, zero MAIN access')
          NODE
