name: PR794 One-time Main Worker code release

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/release-main-pr794-20261108.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-main-pr794-20261108.yml

permissions:
  contents: read

concurrency:
  group: orders-app-production-pr794-release
  cancel-in-progress: false

jobs:
  production-code-only:
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.number == 795
       && github.event.pull_request.head.ref == 'release/main-pr794-production-20261108'
       && github.event.pull_request.head.repo.full_name == github.repository
       && github.event.pull_request.base.sha == '4c750922353826ec6995c5de5e603e80221bb9c0')
      || (github.ref == 'refs/heads/main'
       && github.event_name == 'push'
       && github.event.head_commit.message == 'release(main): deploy PR794 validated Worker to production')
    name: Production Worker release, no database migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      CONFIG: wrangler.jsonc
      DATABASE: orders_db_prod
      HOST: https://orders-app.orders-clothes.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact validated release SHA and production-only configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            test "$GITHUB_HEAD_REF" = 'release/main-pr794-production-20261108'
            test "$GITHUB_BASE_REF" = main
            jq -e '.pull_request.number == 795
              and .pull_request.head.repo.full_name == .repository.full_name
              and .pull_request.base.sha == "4c750922353826ec6995c5de5e603e80221bb9c0"' "$GITHUB_EVENT_PATH"
            git merge-base --is-ancestor 4c750922353826ec6995c5de5e603e80221bb9c0 HEAD
            test "$(git diff --name-only 4c750922353826ec6995c5de5e603e80221bb9c0 HEAD)" = '.github/workflows/release-main-pr794-20261108.yml'
          else
            test "$GITHUB_REF" = 'refs/heads/main'
            git merge-base --is-ancestor f315cbb8fd4161a61a80dee1c205426d93673883 HEAD
            test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/release-main-pr794-20261108.yml'
          fi
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import assert from 'node:assert/strict'
          const config=readFileSync('wrangler.jsonc','utf8')
          assert.match(config,/"name"\s*:\s*"orders-app"/)
          assert.match(config,/"main"\s*:\s*"worker\/index\.ts"/)
          assert.match(config,/"database_name"\s*:\s*"orders_db_prod"/)
          assert.match(config,/"database_id"\s*:\s*"17e68a41-1d58-4a36-8a63-47c3e32443c4"/)
          assert.doesNotMatch(config,/orders_db_branch2_mirror_20261027/)
          console.log('MAIN_PR794_EXACT_RELEASE_CONFIG_VERIFIED')
          NODE
      - run: npm ci
      - name: Business release checks on Main commit
        run: npm run release:check
      - name: Build Main frontend and worker assets
        run: npm run build
      - name: Read production D1 baseline without writing
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE" --remote --config "$CONFIG" --command="
            SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items WHERE quantity > 0) AS active_lines,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_cached,
              (SELECT COUNT(*) FROM inventory_reservations) AS reservation_rows,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table') AS schema_tables
          " --json | jq -cSe '.[0].results[0]' > "$RUNNER_TEMP/main-before.json"
      - name: Dry-run production Worker code (no migrations)
        run: npx wrangler deploy --dry-run --outdir .pr794-production-dry-run --config "$CONFIG"
      - name: Deploy only orders-app Worker code and assets to Main
        run: npx wrangler deploy --config "$CONFIG"
      - name: Check production API and compare D1 baseline
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$DATABASE" --remote --config "$CONFIG" --command="
            SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items WHERE quantity > 0) AS active_lines,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved_cached,
              (SELECT COUNT(*) FROM inventory_reservations) AS reservation_rows,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table') AS schema_tables
          " --json | jq -cSe '.[0].results[0]' > "$RUNNER_TEMP/main-after.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import assert from 'node:assert/strict'
          const before=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/main-before.json','utf8'))
          const after=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/main-after.json','utf8'))
          assert.equal(after.schema_tables,before.schema_tables,'Production schema changed unexpectedly')
          console.log('MAIN_D1_SCHEMA_UNCHANGED')
          for(const key of ['orders_count','active_lines','physical','reserved_cached','reservation_rows']){
            if(before[key]!==after[key]) console.log('LIVE_DATA_CHANGED_DURING_DEPLOY',key,before[key],after[key],
              '(may reflect ordinary concurrent orders; this job performs no D1 writes)')
          }
          NODE
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$HOST/api/auth/status")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$HOST/api/orders/source-picker")" = 401
          echo 'MAIN_PR794_WORKER_DEPLOY_VERIFIED'
