name: Production dispatch audit 85953D6C (read only)

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/release-main-pr794-20261108.yml

permissions:
  contents: read

jobs:
  audit-dispatch-readonly:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.number == 796
      && github.event.pull_request.head.ref == 'audit/main-dispatch-85953d6c-20261108'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assert matching PR; read-only configuration
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.pull_request.number == 796
            and .pull_request.head.repo.full_name == .repository.full_name
            and .pull_request.head.ref == "audit/main-dispatch-85953d6c-20261108"' "$GITHUB_EVENT_PATH"
          grep -q '"name": "orders-app"' wrangler.jsonc
          grep -q '"database_name": "orders_db_prod"' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'PRODUCTION_READONLY_FORENSIC_GUARD_PASS'
      - run: npm ci
      - name: Read-only evidence for single affected order (no client data)
        shell: bash
        run: |
          set -euo pipefail
          db=orders_db_prod
          config=wrangler.jsonc
          echo 'CASE_START_85953D6C'
          echo 'ORDER'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="
            SELECT id, external_id, created_at, updated_at, shipping_status, shipping_date, order_status, workshop_status
            FROM orders WHERE external_id='ORD-20261107074906-85953D6C'
          "
          echo 'ORDER_ITEMS'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="
            SELECT id,order_id,product_name_snapshot,color_snapshot,size_snapshot,material_snapshot,length_snapshot,quantity,variant_id,source_type,is_workshop,stock_writeoff_status
            FROM order_items WHERE order_id=(SELECT id FROM orders WHERE external_id='ORD-20261107074906-85953D6C') ORDER BY id
          "
          echo 'DISPATCHES'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="
            SELECT id,order_id,dispatch_date,created_at,status,request_id
            FROM order_dispatches WHERE order_id=(SELECT id FROM orders WHERE external_id='ORD-20261107074906-85953D6C') ORDER BY id
          "
          echo 'DISPATCH_ITEMS'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="
            SELECT di.id,di.dispatch_id,di.order_item_id,di.quantity,di.cancelled_quantity,di.variant_id,di.source_type,di.reservation_id,di.movement_id
            FROM order_dispatch_items di JOIN order_dispatches d ON d.id=di.dispatch_id
            WHERE d.order_id=(SELECT id FROM orders WHERE external_id='ORD-20261107074906-85953D6C') ORDER BY di.id
          "
          echo 'RESERVATIONS'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="
            SELECT id,order_item_id,variant_id,inventory_source,quantity,status,created_at,updated_at
            FROM inventory_reservations WHERE order_id=(SELECT id FROM orders WHERE external_id='ORD-20261107074906-85953D6C') ORDER BY id
          "
          echo 'STOCK'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="
            SELECT inventory_source,variant_id,quantity,reserved_quantity
            FROM inventory_stock WHERE variant_id IN
              (SELECT DISTINCT variant_id FROM order_items WHERE order_id=(SELECT id FROM orders WHERE external_id='ORD-20261107074906-85953D6C') AND variant_id IS NOT NULL)
          "
          echo 'ACTIVITY'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="
            SELECT id,event_type,entity_type,entity_id,created_at FROM activity_log
            WHERE order_id=(SELECT id FROM orders WHERE external_id='ORD-20261107074906-85953D6C')
            ORDER BY id DESC LIMIT 24
          "
          echo 'MOVEMENT_SCHEMA'
          npx wrangler d1 execute "$db" --remote --config "$config" --json --command="PRAGMA table_info(inventory_movements)"
          echo 'CASE_END_85953D6C'
