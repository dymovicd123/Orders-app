name: Read-only admin password diagnostic

on:
  push:
    branches:
      - diag-admin-password-readonly-20261001
    paths:
      - '.github/workflows/diag-admin-password-readonly.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Production identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders_db_branch2' wrangler.jsonc; then
            echo "Branch2 binding detected; aborting." >&2
            exit 20
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Inspect admin password metadata only
        shell: bash
        run: |
          set -euo pipefail
          echo "=== admin password setting metadata (NO SECRET VALUE) ==="
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "SELECT
            CASE WHEN EXISTS(SELECT 1 FROM app_settings WHERE key='admin_mode_password_hash' AND trim(value) <> '') THEN 1 ELSE 0 END AS has_stored_hash,
            COALESCE((SELECT updated_at FROM app_settings WHERE key='admin_mode_password_hash' LIMIT 1), '') AS hash_updated_at,
            COALESCE((SELECT length(trim(value)) FROM app_settings WHERE key='admin_mode_password_hash' LIMIT 1), 0) AS hash_length,
            COALESCE((SELECT substr(trim(value), 1, instr(trim(value), '$') - 1) FROM app_settings WHERE key='admin_mode_password_hash' LIMIT 1), '') AS algorithm,
            COALESCE((SELECT CAST(substr(
              substr(trim(value), instr(trim(value), '$') + 1),
              1,
              instr(substr(trim(value), instr(trim(value), '$') + 1), '$') - 1
            ) AS INTEGER) FROM app_settings WHERE key='admin_mode_password_hash' LIMIT 1), 0) AS iterations,
            COALESCE((SELECT length(trim(value)) - length(replace(trim(value), '$', '')) FROM app_settings WHERE key='admin_mode_password_hash' LIMIT 1), 0) AS dollar_count,
            COALESCE((SELECT value FROM app_settings WHERE key='require_stored_admin_password' LIMIT 1), '') AS require_stored_password" --json

          echo "=== password-change audit metadata ==="
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "SELECT
            COUNT(*) AS change_event_count,
            COALESCE(MAX(created_at), '') AS last_change_event_at
          FROM activity_log
          WHERE event_type='admin_password_changed'" --json

          echo "READ-ONLY DIAGNOSTIC COMPLETE"
