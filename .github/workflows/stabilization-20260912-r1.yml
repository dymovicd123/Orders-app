name: September 12 stabilization apply

on:
  push:
    branches:
      - stabilization-20260912-r1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stabilization-20260912-r1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply-stabilization-20260912-r1.py

      - name: Install dependencies
        run: npm ci

      - name: Focused stabilization regression
        run: node scripts/test-stabilization-20260912-r1.mjs

      - name: Adjacent return and Workshop regressions
        run: |
          node scripts/test-return-exchange-physical-receipt-r1.mjs
          node scripts/test-phase1c-workshop-return-safety.mjs
          node scripts/test-dashboard-workshop-attention-r1.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-stabilization-20260912-r1.py
          rm .github/workflows/stabilization-20260912-r1.yml

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit stabilization changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize Workshop returns and physical receipt recovery"
          git push origin HEAD:stabilization-20260912-r1
