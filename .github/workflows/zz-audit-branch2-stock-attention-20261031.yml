name: "One-shot actual Branch2 warehouse Problems and Handover coverage SELECT 20261031"
on:
  push:
    branches:
      - audit/branch2-activation-readonly-20261031
    paths:
      - .github/workflows/zz-audit-branch2-stock-attention-20261031.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check real warehouse attention functions through SELECT-only D1 adapter
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/warehouse-attention-coverage-readonly-20261031.mjs
          node --experimental-strip-types scripts/ops/warehouse-attention-coverage-readonly-20261031.mjs

# Include classification of nine unresolved reservation records.
