name: Finance copy Production

on:
  push:
    branches:
      - finance-copy-prod

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply requested copy changes
        run: node scripts/tmp-finance-copy-prod.mjs
      - name: Full Production release gate
        run: npm run release:check
      - name: Verify copy-only product delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "src/features/renderers/FinanceDashboardRenderer.tsx"
      - name: Commit verified product delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/renderers/FinanceDashboardRenderer.tsx
          git commit -m 'Finance: clarify Summary table guidance'
          git push origin HEAD:finance-copy-prod
