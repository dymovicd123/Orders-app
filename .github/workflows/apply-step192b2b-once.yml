name: Apply Step 192B2B once

on:
  push:
    branches:
      - branch2
    paths:
      - scripts/prepare-step192b2b.mjs
      - .github/workflows/apply-step192b2b-once.yml

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Prepare Step 192B2B source
        run: node scripts/prepare-step192b2b.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full release gate
        run: npm run release:check

      - name: Commit verified Step 192B2B and remove one-time bootstrap
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dymovicd123"
          git config user.email "278886646+dymovicd123@users.noreply.github.com"
          git rm scripts/prepare-step192b2b.mjs .github/workflows/apply-step192b2b-once.yml
          git add src/features/inventory/views/renderInventoryMovementPanel.tsx \
                  src/features/inventory/movementPickerB2B.ts \
                  src/styles/192b2b-movement-picker.css \
                  scripts/test-step192b2b-movement-picker.mjs \
                  scripts/release-check.mjs
          git diff --cached --check
          git commit -m "Step 192B2B movement picker UX"
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:branch2

      - name: Mark final deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            -d "$(jq -nc '{state:"pending",context:"cloudflare-deploy/branch2",description:"Waiting for Cloudflare Workers Build"}')" >/dev/null

      - name: Wait for final Cloudflare build
        env:
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CF_ACCOUNT_ID:-}" && -n "${CF_API_TOKEN:-}" ]]
          AUTH=(-H "Authorization: Bearer $CF_API_TOKEN")
          workers_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          worker_tag="$(jq -r '.result[] | select(.id == "orders-app-branch2") | .tag // empty' <<<"$workers_json" | head -n1)"
          [[ -n "$worker_tag" ]]

          build_uuid=""
          outcome=""
          status=""
          for attempt in $(seq 1 72); do
            builds_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/builds/workers/$worker_tag/builds")"
            match="$(jq -c --arg sha "$FINAL_SHA" '[.result[]? | select(.build_trigger_metadata.commit_hash == $sha and .build_trigger_metadata.branch == "branch2")] | sort_by(.created_on) | last // empty' <<<"$builds_json")"
            if [[ -n "$match" ]]; then
              build_uuid="$(jq -r '.build_uuid // empty' <<<"$match")"
              status="$(jq -r '.status // empty' <<<"$match")"
              outcome="$(jq -r '.build_outcome // empty' <<<"$match")"
              echo "Cloudflare build $build_uuid: status=$status outcome=${outcome:-pending}"
              [[ "$status" == "stopped" ]] && break
            else
              echo "Waiting for Cloudflare build of $FINAL_SHA ($attempt/72)..."
            fi
            sleep 10
          done

          if [[ -z "$build_uuid" || "$status" != "stopped" || "$outcome" != "success" ]]; then
            echo "Cloudflare build failed or timed out: uuid=$build_uuid status=$status outcome=$outcome" >&2
            if [[ -n "$build_uuid" ]]; then
              echo "----- Cloudflare build log -----"
              cursor=""
              for page in $(seq 1 20); do
                url="$CF_API/accounts/$CF_ACCOUNT_ID/builds/builds/$build_uuid/logs"
                [[ -n "$cursor" ]] && url="$url?cursor=$(printf '%s' "$cursor" | jq -sRr @uri)"
                logs_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$url")"
                jq -r '.result.lines[]? | if type == "array" then (map(tostring) | join(" ")) else tostring end' <<<"$logs_json"
                truncated="$(jq -r '.result.truncated // false' <<<"$logs_json")"
                cursor="$(jq -r '.result.cursor // empty' <<<"$logs_json")"
                [[ "$truncated" == "true" && -n "$cursor" ]] || break
              done
            fi
            exit 7
          fi

      - name: Mark final deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            -d "$(jq -nc '{state:"success",context:"cloudflare-deploy/branch2",description:"Cloudflare deploy succeeded"}')" >/dev/null

      - name: Mark final deploy failure
        if: failure() && steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            -d "$(jq -nc '{state:"failure",context:"cloudflare-deploy/branch2",description:"Cloudflare deploy failed; inspect apply workflow"}')" >/dev/null
