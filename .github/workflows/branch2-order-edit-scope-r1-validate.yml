name: Branch2 Order Edit Scope R1 Validate

on:
  push:
    branches: [safe/branch2-order-edit-scope-r1-20260902]
    paths:
      - scripts/.branch2-order-edit-scope-r1-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/branch2-order-edit-scope-r1-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact Branch2 order edit patch
        run: |
          python3 scripts/apply-branch2-order-edit-scope-r1.py
          node scripts/register-branch2-order-edit-scope-r1.mjs
      - run: node scripts/test-order-edit-autonomy.mjs
      - run: node scripts/test-operational-autonomy-r2.mjs
      - run: node scripts/test-branch2-environment.mjs
      - run: npm run typecheck
      - run: npm run release:check
      - run: npm run verify:db-safety
      - run: |
          rm -rf dist
          npm run build
      - name: Branch2 dry-run binding guard
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run 2>&1 | tee /tmp/branch2-dry-run.txt
          grep -F 'orders_db_branch2' /tmp/branch2-dry-run.txt
          if grep -F 'orders_db_prod' /tmp/branch2-dry-run.txt; then exit 1; fi
      - name: Commit validated Branch2 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/orders-write.ts src/App.tsx src/features/sections/OrdersTableSection.tsx src/features/sections/OrderDetailsSection.tsx src/features/sections/OrderEditorSection.tsx scripts/test-order-edit-autonomy.mjs scripts/test-operational-autonomy-r2.mjs scripts/order-edit-scope-r1-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          git commit -m 'Restore routine closed order editing on Branch2'
          git push origin HEAD:safe/branch2-order-edit-scope-r1-20260902
