name: Read-only production references audit 2026-10-16
on:
  pull_request:
    paths:
      - '.github/workflows/oneoff-reference-audit-20261016.yml'
      - 'scripts/ops/readonly-reference-audit-20261016.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-reference-audit-20261016.yml'
      - 'scripts/ops/readonly-reference-audit-20261016.mjs'
permissions:
  contents: read
concurrency:
  group: oneoff-reference-audit-20261016
  cancel-in-progress: false
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate audit script without a database connection
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ops/readonly-reference-audit-20261016.mjs
          ! grep -Eiq '\\b(UPDATE|DELETE|INSERT|REPLACE|DROP|ALTER)\\b.*\\b(inventory_stock|reference_values|orders|payments|catalog_variants)\\b' scripts/ops/readonly-reference-audit-20261016.mjs
  prod-read:
    needs: static-check
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard stop on production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "main" ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Snapshot current production references and SKU collisions, SELECT-only
        run: node scripts/ops/readonly-reference-audit-20261016.mjs
