name: Catalog semantic data correction Branch2 preflight

on:
  push:
    branches:
      - 'fix/catalog-semantic-data-correction-branch2-20260927'
    paths:
      - 'scripts/run-catalog-semantic-data-correction.mjs'
      - '.github/workflows/catalog-semantic-data-correction-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only correction preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CORRECTION_DB: 'orders_db_branch2'
      CORRECTION_KEY: 'semantic-sku-20260927-r1'
      CORRECTION_PAIRS: '[{"source":480,"keeper":1084},{"source":1277,"keeper":1438},{"source":1278,"keeper":1436},{"source":1279,"keeper":1441}]'
      CORRECTION_DRY_RUN: '1'
      CORRECTION_BASE_SHA: 'e30366aa92cd15ec7fd98c43641e604be5d1c71e'
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hard-stop on environment or scope drift
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == 'fix/catalog-semantic-data-correction-branch2-20260927' ]]
          git merge-base --is-ancestor "$CORRECTION_BASE_SHA" HEAD
          unexpected="$(git diff --name-only "$CORRECTION_BASE_SHA"..HEAD | grep -Ev '^(scripts/run-catalog-semantic-data-correction\.mjs|\.github/workflows/catalog-semantic-data-correction-preflight\.yml)$' || true)"
          [[ -z "$unexpected" ]] || { echo "Unexpected correction-branch files:" >&2; echo "$unexpected" >&2; exit 20; }
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Cross-environment D1 binding detected." >&2
            exit 21
          fi


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax check correction runner
        run: node --check scripts/run-catalog-semantic-data-correction.mjs

      - name: Run fresh read-only correction preflight
        run: node scripts/run-catalog-semantic-data-correction.mjs
