name: 'Production read-only full catalog characteristics audit'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-full-characteristics-audit-20261016.mjs'
      - '.github/workflows/readonly-full-catalog-characteristics.yml'
permissions:
  contents: read
jobs:
  inspect-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify read-only identity and script syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ops/readonly-full-characteristics-audit-20261016.mjs
          [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$GITHUB_BASE_REF" == 'main' ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          cat > "$RUNNER_TEMP/readonly-production-catalog-audit.jsonc" <<'CFG'
          {
            "name": "orders-app-catalog-readonly",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/readonly-production-catalog-audit.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Enumerate every catalog/reference mismatch and active inventory invariant, SELECT only
        run: node scripts/ops/readonly-full-characteristics-audit-20261016.mjs
