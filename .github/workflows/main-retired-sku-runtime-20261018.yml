name: Main retired SKU resolver exact runtime candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/main-retired-sku-runtime-20261018.yml'
      - 'worker/index.ts'
      - 'worker/domains/retired-item-handover.ts'
      - 'worker/domains/retired-item-correction.ts'
      - 'worker/domains/catalog-review.ts'
      - 'worker/domains/order-reservations.ts'
      - 'src/App.tsx'
      - 'src/features/orders/OrderCatalogResolutionModal.tsx'
      - 'scripts/test-retired-order-item-handover-20261018.mjs'
      - 'scripts/test-retired-manager-one-line-correction-20261018.mjs'
  push:
    branches: [main]
    paths: ['.github/workflows/main-retired-sku-runtime-20261018.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Hard-pin production identity and exclude workshop Stage04
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -q 'orders_db_branch2' wrangler.jsonc
          ! grep -q "from './domains/workshop-settlements.ts'" worker/index.ts
          ! grep -q "from './domains/workshop-settlement-prices.ts'" worker/index.ts
          grep -q 'reconcileKaspiPaymentAfterShipping' worker/index.ts
          grep -q 'correct-retired-item' worker/index.ts
          grep -q 'confirm-retired-delivery' worker/index.ts
          grep -q 'authUser.displayName' worker/index.ts
      - name: Check exact real SQL handler: handover, one-line correction, no duplicate reserve
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/test-retired-order-item-handover-20261018.mjs
          node --experimental-strip-types scripts/test-retired-manager-one-line-correction-20261018.mjs
      - name: Verify production 0113/0114 installed before promotion (read only)
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
           SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='retired_order_item_issues') AS journal13,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='retired_order_item_corrections') AS journal14
          " --json | jq -cSe '.[0].results[0]' | jq -e '.journal13==1 and .journal14==1'
      - name: Full TS and production build
        run: npm run build
