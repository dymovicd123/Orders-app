name: Verify Phase 2 UX copy hierarchy

on:
  push:
    branches:
      - safe/phase2-ux-copy-hierarchy-final-20260826
    paths:
      - .github/workflows/verify-phase2-ux-copy-hierarchy.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/phase2-ux-copy-hierarchy-final-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply UX hierarchy patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          overview_path = Path('src/features/inventory/views/renderInventoryOverviewPanel.tsx')
          overview = overview_path.read_text(encoding='utf-8')
          overview = replace_once(overview, '>Поддержание точности</span>', '>Быстрая сверка остатков</span>', 'kicker')
          overview = replace_once(overview, 'Небольшая пачка позиций, которые стоит проверить по пути. Это не обязательная очередь.', 'Можно проверить несколько товаров, когда удобно.', 'intro copy')
          overview = replace_once(overview, '<button className="ghost compact" type="button" disabled={cycleCountBusy || cycleCountLoading}', '<button className="secondary compact inventory-routine-cycle-refresh" type="button" disabled={cycleCountBusy || cycleCountLoading}', 'refresh button class')
          overview = replace_once(overview, ": 'Показать другую пачку'}</button>", ": 'Показать другие товары'}</button>", 'refresh button label')
          overview = replace_once(overview, "          const attrs = [row.material !== 'СТАНДАРТ' ? row.material : '', row.length !== 'СТАНДАРТ' ? row.length : '', row.gender, row.color, row.size].filter(Boolean).join(' · ')\n          return", "          const attrs = [row.material !== 'СТАНДАРТ' ? row.material : '', row.length !== 'СТАНДАРТ' ? row.length : '', row.gender, row.color, row.size].filter(Boolean).join(' · ')\n          const reasonNeedsAttention = Number(row.free || 0) < 0 || Number(row.lastDifference || 0) !== 0\n          return", 'reason emphasis helper')
          overview = replace_once(overview, '<small>{(row.reasons || [])[0] || \'Полезно подтвердить физический остаток\'}</small>', '<small className={reasonNeedsAttention ? \'is-warning\' : undefined}>{(row.reasons || [])[0] || \'Полезно подтвердить физический остаток\'}</small>', 'reason emphasis')
          overview = replace_once(overview, '<div className="inventory-cycle-count-system"><span>По системе на месте: <strong>{row.physical}</strong></span>{Number(row.reserved || 0) ? <span>В заказах: <strong>{row.reserved}</strong></span> : null}</div>', '<div className="inventory-cycle-count-system"><span>По системе: <strong>{row.physical}</strong> на месте</span>{Number(row.reserved || 0) ? <span><strong>{row.reserved}</strong> в заказах</span> : null}</div>', 'system quantity wording')
          overview = replace_once(overview, '>Подтвердить {row.physical}</button><details className="inventory-routine-cycle-other"><summary className="inventory-routine-cycle-other-button">Указать другое количество</summary>', '>Да, на месте {row.physical}</button><details className="inventory-routine-cycle-other"><summary className="inventory-routine-cycle-other-button">Нет, другое количество</summary>', 'choice wording')
          overview_path.write_text(overview, encoding='utf-8')

          css_path = Path('src/styles/188i-cycle-counts.css')
          css = css_path.read_text(encoding='utf-8')
          css = replace_once(css, '.inventory-cycle-count-name small{font-size:10px;line-height:1.35;color:color-mix(in srgb,var(--warning,#b45309) 78%,var(--text,#0f172a))}', '.inventory-cycle-count-name small{font-size:10px;line-height:1.35;color:var(--muted-text,#64748b)}\n.inventory-cycle-count-name small.is-warning{color:color-mix(in srgb,var(--warning,#b45309) 78%,var(--text,#0f172a))}', 'reason color')
          css = replace_once(css, '.inventory-cycle-count-row.is-routine{grid-template-columns:minmax(220px,1fr) auto minmax(190px,auto)}', '.inventory-cycle-count-row.is-routine{grid-template-columns:minmax(220px,1fr) auto minmax(230px,auto)}\n.inventory-cycle-count-row.is-routine .inventory-cycle-count-system{min-width:165px;gap:5px 12px;font-size:11px}\n.inventory-cycle-count-row.is-routine .inventory-cycle-count-system strong{font-size:12px}', 'routine quantity hierarchy')
          css += '\n/* Phase 2 UX — clearer routine stock language and hierarchy. */\n.inventory-routine-cycle-refresh{min-height:34px;padding-inline:12px;font-weight:700;white-space:nowrap}\n@media(max-width:560px){.inventory-routine-cycle-refresh{width:100%}}\n'
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('scripts/test-phase2-smart-daily-stock.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(test, "  check(overview.includes('Подтвердить {row.physical}'), 'One-tap confirm action is missing')", "  check(overview.includes('Да, на месте {row.physical}'), 'One-tap confirm action is not phrased as a clear yes/no choice')", 'confirm test')
          test = replace_once(test, "  check(overview.includes('Указать другое количество'), 'Mismatch action is missing')", "  check(overview.includes('Нет, другое количество'), 'Mismatch action is not phrased as a clear yes/no choice')", 'mismatch test')
          test = replace_once(test, "  check(overview.includes('Показать другую пачку'), 'Batch refresh action is ambiguous')", "  check(overview.includes('Показать другие товары'), 'Routine refresh action does not say what will change')", 'refresh test')
          test = replace_once(test, "  check(!overview.includes('Совпадает:'), 'Old status-like confirm wording is still present')", "  check(!overview.includes('Совпадает:') && !overview.includes('Показать другую пачку') && !overview.includes('Подтвердить {row.physical}'), 'Old ambiguous routine wording is still present')\n  check(overview.includes('Быстрая сверка остатков') && overview.includes('Можно проверить несколько товаров, когда удобно.'), 'Routine helper copy is still internal/canonical instead of employee-facing')\n  check(overview.includes('reasonNeedsAttention') && overview.includes(\"className={reasonNeedsAttention ? 'is-warning' : undefined}\"), 'Routine reasons are not visually separated into neutral vs attention states')\n  check(css.includes('.inventory-cycle-count-name small.is-warning') && css.includes('.inventory-routine-cycle-refresh'), 'Routine hierarchy styles are missing')", 'ambiguity and hierarchy tests')
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          scripts/test-phase2-smart-daily-stock.mjs
          src/features/inventory/views/renderInventoryOverviewPanel.tsx
          src/styles/188i-cycle-counts.css
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! git diff --name-only | grep -Eq 'arrival|Arrival|migration|wrangler|worker/'
      - name: Install dependencies
        run: npm ci
      - name: Full release gate
        run: npm run release:check
      - name: Commit tested UX patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-phase2-ux-copy-hierarchy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-phase2-smart-daily-stock.mjs src/features/inventory/views/renderInventoryOverviewPanel.tsx src/styles/188i-cycle-counts.css .github/workflows/verify-phase2-ux-copy-hierarchy.yml
          git commit -m "Refine routine stock check wording"
          git push origin HEAD:safe/phase2-ux-copy-hierarchy-final-20260826
