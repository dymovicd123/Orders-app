name: R5.3 Production FTS apply benchmark deploy

on:
  push:
    branches:
      - safe/d1-read-budget-r5-3-fts-20260903
    paths:
      - scripts/.r5-3-prod-apply-trigger

permissions:
  contents: read

jobs:
  apply-benchmark-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 9d068f53a06eebc4c056ba050d582133
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PROD_DB_UUID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      PROD_DB_NAME: orders_db_prod
      PROD_WORKER_URL: https://orders-app.orders-clothes.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r5-3-fts-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reconfirm release build before Production mutation
        run: |
          npm run typecheck
          node scripts/test-d1-read-budget-r5-3.mjs
          npm run build
          grep -F '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc >/dev/null

      - name: Prepare reviewed FTS DDL statements
        shell: python
        run: |
          import json, re, sqlite3
          from pathlib import Path
          sql = Path('migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql').read_text(encoding='utf-8')
          statements = []
          buffer = ''
          for line in sql.splitlines(True):
              buffer += line
              if sqlite3.complete_statement(buffer):
                  statement = buffer.strip()
                  buffer = ''
                  if not statement:
                      continue
                  cleaned = re.sub(r'^(?:\s*--[^\n]*(?:\n|$))+', '', statement).lstrip()
                  upper = cleaned.upper()
                  kind = 'virtual' if upper.startswith('CREATE VIRTUAL TABLE') else 'trigger' if upper.startswith('CREATE TRIGGER') else 'pragma' if upper.startswith('PRAGMA ') else 'population'
                  statements.append({'kind': kind, 'sql': statement})
          if buffer.strip():
              raise SystemExit('Incomplete SQL statement at end of 0064')
          if sum(s['kind'] == 'virtual' for s in statements) != 3:
              raise SystemExit('Expected exactly three FTS virtual-table statements')
          if sum(s['kind'] == 'trigger' for s in statements) != 11:
              raise SystemExit('Expected exactly eleven FTS maintenance triggers')
          Path('/tmp/r5-3-statements.json').write_text(json.dumps(statements), encoding='utf-8')
          print('Reviewed 0064 statements:', {k: sum(s['kind'] == k for s in statements) for k in ['virtual','trigger','population','pragma']})

      - name: Apply derived FTS schema and benchmark on exact Production D1
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const dbUuid = process.env.PROD_DB_UUID
          const expectedName = process.env.PROD_DB_NAME
          if (!accountId || !token || !dbUuid || !expectedName) throw new Error('Missing Production D1 configuration')
          const apiBase = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbUuid}`
          const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }

          const infoResponse = await fetch(apiBase, { headers })
          const info = await infoResponse.json()
          if (!infoResponse.ok || !info?.success) throw new Error(`Production D1 identity read failed: HTTP ${infoResponse.status}`)
          const actualName = String(info?.result?.name || '')
          const actualUuid = String(info?.result?.uuid || info?.result?.id || dbUuid)
          if (actualName !== expectedName || actualUuid !== dbUuid) throw new Error(`Production D1 identity mismatch: ${actualName} / ${actualUuid}`)
          console.log(`Target confirmed: ${expectedName} / ${dbUuid}`)

          async function query(sql, params = []) {
            const response = await fetch(`${apiBase}/query`, {
              method: 'POST', headers, body: JSON.stringify({ sql, params }),
            })
            const payload = await response.json()
            if (!response.ok || !payload?.success) {
              const msg = payload?.errors?.map(e => e?.message).filter(Boolean).join('; ') || `HTTP ${response.status}`
              throw new Error(msg)
            }
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result
            return {
              rows: Array.isArray(result?.results) ? result.results : [],
              rowsRead: Number(result?.meta?.rows_read ?? result?.meta?.rowsRead ?? 0),
              rowsWritten: Number(result?.meta?.rows_written ?? result?.meta?.rowsWritten ?? 0),
              changes: Number(result?.meta?.changes ?? 0),
            }
          }

          const tableNames = ['order_search_orders_fts','order_search_items_fts','order_search_payments_fts']
          const triggerNames = [
            'trg_order_search_orders_ai','trg_order_search_orders_ad','trg_order_search_orders_au',
            'trg_order_search_items_ai','trg_order_search_items_ad','trg_order_search_items_au',
            'trg_order_search_payments_ai','trg_order_search_payments_ad','trg_order_search_payments_au',
            'trg_order_search_managers_au','trg_order_search_customers_au',
          ]
          const objectNames = [...tableNames, ...triggerNames]
          const placeholders = objectNames.map(() => '?').join(',')
          const existing = await query(`SELECT name, type FROM sqlite_schema WHERE name IN (${placeholders}) ORDER BY name`, objectNames)
          if (existing.rows.length) throw new Error(`R5.3 Production preflight expected no search objects but found ${existing.rows.length}`)
          await query('SELECT manager_snapshot_name FROM orders LIMIT 1')
          console.log('Production preflight: search objects absent; historical manager snapshot column confirmed.')

          const statements = JSON.parse(fs.readFileSync('/tmp/r5-3-statements.json', 'utf8'))
          const virtualStatements = statements.filter(s => s.kind === 'virtual')
          const triggerStatements = statements.filter(s => s.kind === 'trigger')
          const pragmaStatements = statements.filter(s => s.kind === 'pragma')
          let mutationStarted = false
          let benchmarkPassed = false

          async function rollbackFreshObjects(reason) {
            console.log(`Rolling back newly-created R5.3 derived objects before runtime deploy: ${reason}`)
            for (const name of triggerNames.slice().reverse()) {
              try { await query(`DROP TRIGGER IF EXISTS ${name}`) } catch (error) { console.error(`Rollback trigger ${name} failed:`, error.message) }
            }
            for (const name of tableNames.slice().reverse()) {
              try { await query(`DROP TABLE IF EXISTS ${name}`) } catch (error) { console.error(`Rollback table ${name} failed:`, error.message) }
            }
          }

          try {
            mutationStarted = true
            for (let i = 0; i < virtualStatements.length; i++) {
              await query(virtualStatements[i].sql)
              console.log(`Created derived FTS table ${i + 1}/${virtualStatements.length}`)
            }
            for (let i = 0; i < triggerStatements.length; i++) {
              await query(triggerStatements[i].sql)
              console.log(`Created maintenance trigger ${i + 1}/${triggerStatements.length}`)
            }

            // Populate only after triggers exist. NOT EXISTS keeps the rebuild correct if a live write
            // interleaves between the DELETE and INSERT statements.
            const populations = [
              [`DELETE FROM order_search_orders_fts`, []],
              [`INSERT INTO order_search_orders_fts(rowid, order_id, search_text)
                SELECT o.id, o.id,
                       COALESCE(o.external_id, '') || ' ' || COALESCE(o.order_date, '') || ' ' ||
                       COALESCE(m.name, '') || ' ' || COALESCE(c.phone_normalized, '') || ' ' ||
                       COALESCE(c.display_name, '') || ' ' || COALESCE(o.city, '') || ' ' || COALESCE(o.delivery_type, '') || ' ' || COALESCE(o.comment, '')
                FROM orders o
                LEFT JOIN managers m ON m.id = o.manager_id
                LEFT JOIN customers c ON c.id = o.customer_id
                WHERE NOT EXISTS (SELECT 1 FROM order_search_orders_fts f WHERE f.rowid = o.id)`, []],
              [`DELETE FROM order_search_items_fts`, []],
              [`INSERT INTO order_search_items_fts(rowid, order_id, search_text)
                SELECT oi.id, oi.order_id,
                       COALESCE(oi.product_name_snapshot, '') || ' ' || COALESCE(oi.gender_snapshot, '') || ' ' ||
                       COALESCE(oi.color_snapshot, '') || ' ' || COALESCE(oi.material_snapshot, '') || ' ' ||
                       COALESCE(oi.length_snapshot, '') || ' ' || COALESCE(oi.size_snapshot, '')
                FROM order_items oi
                WHERE NOT EXISTS (SELECT 1 FROM order_search_items_fts f WHERE f.rowid = oi.id)`, []],
              [`DELETE FROM order_search_payments_fts`, []],
              [`INSERT INTO order_search_payments_fts(rowid, order_id, search_text)
                SELECT p.id, p.order_id, COALESCE(p.method, '') || ' ' || COALESCE(p.comment, '')
                FROM payments p
                WHERE NOT EXISTS (SELECT 1 FROM order_search_payments_fts f WHERE f.rowid = p.id)`, []],
            ]
            for (const [sql, params] of populations) await query(sql, params)

            const countCheck = await query(`SELECT
              (SELECT COUNT(*) FROM orders) AS orders_source,
              (SELECT COUNT(*) FROM order_search_orders_fts) AS orders_fts,
              (SELECT COUNT(*) FROM order_items) AS items_source,
              (SELECT COUNT(*) FROM order_search_items_fts) AS items_fts,
              (SELECT COUNT(*) FROM payments) AS payments_source,
              (SELECT COUNT(*) FROM order_search_payments_fts) AS payments_fts`)
            const counts = countCheck.rows[0] || {}
            if (Number(counts.orders_source) !== Number(counts.orders_fts)
              || Number(counts.items_source) !== Number(counts.items_fts)
              || Number(counts.payments_source) !== Number(counts.payments_fts)) {
              throw new Error(`FTS/source row count mismatch: ${JSON.stringify(counts)}`)
            }
            console.log('FTS/source row counts match:', JSON.stringify(counts))

            const sample = await query(`SELECT oi.product_name_snapshot AS term
              FROM order_items oi JOIN orders o ON o.id = oi.order_id
              WHERE o.order_status NOT IN ('deleted','archived')
                AND oi.quantity > 0
                AND LENGTH(TRIM(COALESCE(oi.product_name_snapshot,''))) >= 3
              ORDER BY oi.id DESC LIMIT 1`)
            const term = String(sample.rows?.[0]?.term || '').trim()
            if (Array.from(term).length < 3) throw new Error('Could not resolve representative >=3-character search term')
            console.log(`Representative Production search term selected (length=${Array.from(term).length}; value intentionally not logged).`)

            const rawVariants = [term, term.toUpperCase(), term.toLowerCase()]
            const uniqueVariants = [...new Set(rawVariants)]
            const ftsQuery = uniqueVariants.map(v => `"${v.replaceAll('"', '""')}"`).join(' OR ')
            const legacyParams = [...rawVariants, ...rawVariants, ...rawVariants]
            const ftsParams = [ftsQuery, ftsQuery, ftsQuery, ...rawVariants]
            const searchOrderText = `COALESCE(o.external_id, '') || ' ' || COALESCE(o.order_date, '') || ' ' ||
              COALESCE(m.name, o.manager_snapshot_name, '') || ' ' || COALESCE(c.phone_normalized, '') || ' ' ||
              COALESCE(c.display_name, '') || ' ' || COALESCE(o.city, '') || ' ' || COALESCE(o.delivery_type, '') || ' ' || COALESCE(o.comment, '')`
            const searchItemText = `COALESCE(oi.product_name_snapshot, '') || ' ' || COALESCE(oi.gender_snapshot, '') || ' ' ||
              COALESCE(oi.color_snapshot, '') || ' ' || COALESCE(oi.material_snapshot, '') || ' ' ||
              COALESCE(oi.length_snapshot, '') || ' ' || COALESCE(oi.size_snapshot, '')`
            const searchPaymentText = `COALESCE(search_payment.method, '') || ' ' || COALESCE(search_payment.comment, '')`
            const legacyClause = `(
              INSTR(${searchOrderText}, ?) > 0 OR INSTR(${searchOrderText}, ?) > 0 OR INSTR(${searchOrderText}, ?) > 0
              OR EXISTS (SELECT 1 FROM order_items oi WHERE oi.order_id = o.id AND (
                INSTR(${searchItemText}, ?) > 0 OR INSTR(${searchItemText}, ?) > 0 OR INSTR(${searchItemText}, ?) > 0
              ))
              OR EXISTS (SELECT 1 FROM payments search_payment WHERE search_payment.order_id = o.id AND (
                INSTR(${searchPaymentText}, ?) > 0 OR INSTR(${searchPaymentText}, ?) > 0 OR INSTR(${searchPaymentText}, ?) > 0
              ))
            )`
            const ftsClause = `(
              o.id IN (SELECT rowid FROM order_search_orders_fts WHERE order_search_orders_fts MATCH ?)
              OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_items_fts WHERE order_search_items_fts MATCH ?)
              OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_payments_fts WHERE order_search_payments_fts MATCH ?)
              OR ((o.manager_id IS NULL OR NOT EXISTS (SELECT 1 FROM managers search_manager WHERE search_manager.id = o.manager_id)) AND (
                INSTR(COALESCE(o.manager_snapshot_name, ''), ?) > 0
                OR INSTR(COALESCE(o.manager_snapshot_name, ''), ?) > 0
                OR INSTR(COALESCE(o.manager_snapshot_name, ''), ?) > 0
              ))
            )`
            const activeClause = `o.order_status NOT IN ('deleted','archived')`
            const now = new Date()
            const year = now.getUTCFullYear()
            const month = String(now.getUTCMonth() + 1).padStart(2, '0')
            const lastDay = new Date(Date.UTC(year, now.getUTCMonth() + 1, 0)).getUTCDate()
            const dateFrom = `${year}-${month}-01`
            const dateTo = `${year}-${month}-${String(lastDay).padStart(2, '0')}`
            const workshopAggregate = `LEFT JOIN (
              SELECT order_id, COALESCE(SUM(quantity), 0) AS workshop_units
              FROM order_items WHERE COALESCE(is_workshop,0)=1 GROUP BY order_id
            ) workshop_items ON workshop_items.order_id = o.id`
            const same = (a,b) => JSON.stringify(a) === JSON.stringify(b)
            const ids = result => result.rows.map(r => Number(r.id))

            async function runBenchmark() {
              const legacyBroad = await query(`SELECT o.id FROM orders o LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id WHERE ${activeClause} AND ${legacyClause} ORDER BY o.id`, legacyParams)
              const ftsBroad = await query(`SELECT o.id FROM orders o WHERE ${activeClause} AND ${ftsClause} ORDER BY o.id`, ftsParams)
              const legacyList = await query(`SELECT o.id FROM orders o LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id WHERE ${activeClause} AND ${legacyClause} AND o.order_date >= ? AND o.order_date <= ? ORDER BY o.order_date DESC,o.id DESC LIMIT 100`, [...legacyParams,dateFrom,dateTo])
              const ftsList = await query(`SELECT o.id FROM orders o LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id WHERE ${activeClause} AND ${ftsClause} AND o.order_date >= ? AND o.order_date <= ? ORDER BY o.order_date DESC,o.id DESC LIMIT 100`, [...ftsParams,dateFrom,dateTo])
              const legacyOrderStats = await query(`SELECT COUNT(o.id) AS order_count, COALESCE(SUM(o.total_amount),0) AS total_amount, COALESCE(SUM(o.debt_amount),0) AS debt_amount, COALESCE(SUM(COALESCE(workshop_items.workshop_units,0)),0) AS workshop_units FROM orders o LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id ${workshopAggregate} WHERE ${activeClause} AND ${legacyClause} AND o.order_date >= ? AND o.order_date <= ?`, [...legacyParams,dateFrom,dateTo])
              const ftsOrderStats = await query(`SELECT COUNT(o.id) AS order_count, COALESCE(SUM(o.total_amount),0) AS total_amount, COALESCE(SUM(o.debt_amount),0) AS debt_amount, COALESCE(SUM(COALESCE(workshop_items.workshop_units,0)),0) AS workshop_units FROM orders o ${workshopAggregate} WHERE ${activeClause} AND ${ftsClause} AND o.order_date >= ? AND o.order_date <= ?`, [...ftsParams,dateFrom,dateTo])
              const legacyPaymentStats = await query(`SELECT COUNT(p.id) AS payment_count, COALESCE(SUM(p.amount),0) AS payment_amount FROM payments p JOIN orders o ON o.id=p.order_id LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id WHERE ${activeClause} AND ${legacyClause} AND p.payment_date >= ? AND p.payment_date <= ?`, [...legacyParams,dateFrom,dateTo])
              const ftsPaymentStats = await query(`SELECT COUNT(p.id) AS payment_count, COALESCE(SUM(p.amount),0) AS payment_amount FROM payments p JOIN orders o ON o.id=p.order_id WHERE ${activeClause} AND ${ftsClause} AND p.payment_date >= ? AND p.payment_date <= ?`, [...ftsParams,dateFrom,dateTo])
              const legacyReturnStats = await query(`SELECT COUNT(r.id) AS return_count, COALESCE(SUM(r.amount),0) AS return_amount FROM returns r JOIN orders o ON o.id=r.order_id LEFT JOIN managers m ON m.id=o.manager_id LEFT JOIN customers c ON c.id=o.customer_id WHERE ${activeClause} AND ${legacyClause} AND COALESCE(r.status,'completed') <> 'cancelled' AND r.return_date >= ? AND r.return_date <= ?`, [...legacyParams,dateFrom,dateTo])
              const ftsReturnStats = await query(`SELECT COUNT(r.id) AS return_count, COALESCE(SUM(r.amount),0) AS return_amount FROM returns r JOIN orders o ON o.id=r.order_id WHERE ${activeClause} AND ${ftsClause} AND COALESCE(r.status,'completed') <> 'cancelled' AND r.return_date >= ? AND r.return_date <= ?`, [...ftsParams,dateFrom,dateTo])
              const semantic = same(ids(legacyBroad),ids(ftsBroad)) && same(ids(legacyList),ids(ftsList)) && same(legacyOrderStats.rows,ftsOrderStats.rows) && same(legacyPaymentStats.rows,ftsPaymentStats.rows) && same(legacyReturnStats.rows,ftsReturnStats.rows)
              const oldNarrow = legacyList.rowsRead + legacyOrderStats.rowsRead + legacyPaymentStats.rowsRead + legacyReturnStats.rowsRead
              const newNarrow = ftsList.rowsRead + ftsOrderStats.rowsRead + ftsPaymentStats.rowsRead + ftsReturnStats.rowsRead
              return { semantic, legacyBroad, ftsBroad, oldNarrow, newNarrow, matchCount: legacyBroad.rows.length, visibleCount: legacyList.rows.length }
            }

            let bench = await runBenchmark()
            if (!bench.semantic) {
              console.warn('First semantic comparison changed during live traffic; retrying once with fresh snapshots.')
              bench = await runBenchmark()
            }
            console.log(`Benchmark period: ${dateFrom}..${dateTo}; broad matches=${bench.matchCount}; visible=${bench.visibleCount}`)
            console.log(`Broad rows read: legacy=${bench.legacyBroad.rowsRead}; FTS=${bench.ftsBroad.rowsRead}`)
            console.log(`Narrow list+aggregates rows read: legacy=${bench.oldNarrow}; FTS=${bench.newNarrow}`)
            if (!bench.semantic) throw new Error('R5.3 semantic equivalence failed on Production benchmark')
            if (bench.legacyBroad.rowsRead > 0 && bench.ftsBroad.rowsRead > bench.legacyBroad.rowsRead * 0.8) {
              throw new Error(`R5.3 broad search did not save at least 20% rows read (${bench.legacyBroad.rowsRead} -> ${bench.ftsBroad.rowsRead})`)
            }
            if (bench.newNarrow > bench.oldNarrow * 1.25 + 100) {
              throw new Error(`R5.3 narrow search materially regressed rows read (${bench.oldNarrow} -> ${bench.newNarrow})`)
            }
            for (const statement of pragmaStatements) await query(statement.sql)
            benchmarkPassed = true
            console.log('R5.3_PRODUCTION_BENCHMARK=PASS')
            console.log('R5.3_DERIVED_SCHEMA_READY=PASS')
          } catch (error) {
            if (mutationStarted && !benchmarkPassed) await rollbackFreshObjects(error.message)
            throw error
          }
          NODE

      - name: Deploy validated R5.3 runtime to Production
        run: npx wrangler deploy

      - name: Post-deploy public availability smoke
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/r5-3-root.html -w '%{http_code}' "$PROD_WORKER_URL/")"
          test "$code" = "200"
          echo "Production root HTTP $code"
