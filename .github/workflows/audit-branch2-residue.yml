name: Audit Branch2 test residue against Production

on:
  push:
    branches: [branch2]
    paths: [.github/workflows/audit-branch2-residue.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      PROD_DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
      B2_DB_ID: 40065052-854e-44b8-bcd5-251bdd488301
    steps:
      - name: Compare recent catalog artifacts
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local db="$1"; shift
            local sql="$1"
            curl --fail-with-body -sS -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$db/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" | jq -c '.result[]?.results // []'
          }
          echo '=== B2 ALL TEST-LIKE ORDERS ==='
          q "$B2_DB_ID" "SELECT id,external_id,order_date,manager_id,shipping_status,order_status,comment,created_at,updated_at FROM orders WHERE external_id LIKE 'TEST-%' OR external_id LIKE 'RES-%' OR external_id LIKE 'AUTO-RES-%' OR UPPER(COALESCE(comment,'')) LIKE '%TEST%' OR UPPER(COALESCE(comment,'')) LIKE '%ТЕСТ%' ORDER BY id"
          echo '=== B2 REFERENCES TO VARIANTS 626-635 ==='
          q "$B2_DB_ID" "SELECT 'order_items' AS src,COUNT(*) AS cnt FROM order_items WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_stock',COUNT(*) FROM inventory_stock WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_movements',COUNT(*) FROM inventory_movements WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_reservations',COUNT(*) FROM inventory_reservations WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_lifecycle_events',COUNT(*) FROM inventory_lifecycle_events WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_operation_evidence',COUNT(*) FROM inventory_operation_evidence WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_stock_checks',COUNT(*) FROM inventory_stock_checks WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_stocktake_items',COUNT(*) FROM inventory_stocktake_items WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'inventory_transfer_items',COUNT(*) FROM inventory_transfer_items WHERE variant_id BETWEEN 626 AND 635 UNION ALL SELECT 'workshop_tasks',COUNT(*) FROM workshop_tasks WHERE variant_id BETWEEN 626 AND 635"
          echo '=== B2 ORDER ITEMS VARIANTS 626-635 ==='
          q "$B2_DB_ID" "SELECT o.id AS order_id,o.external_id,o.comment,oi.id AS item_id,oi.variant_id,oi.product_id,oi.product_name_snapshot,oi.created_at FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE oi.variant_id BETWEEN 626 AND 635 ORDER BY o.id,oi.id"
          echo '=== B2 MOVEMENTS VARIANTS 626-635 ==='
          q "$B2_DB_ID" "SELECT id,inventory_source,movement_type,product_id,variant_id,quantity_delta,quantity_after,reference_type,reference_id,comment,created_at FROM inventory_movements WHERE variant_id BETWEEN 626 AND 635 ORDER BY id"
          for DB in PROD B2; do
            if [[ "$DB" == "PROD" ]]; then ID="$PROD_DB_ID"; else ID="$B2_DB_ID"; fi
            echo "=== $DB VARIANTS >= 626 ==="
            q "$ID" "SELECT v.id,v.product_id,p.name AS product_name,v.category,v.gender,v.color,v.material,v.length,v.size_label,v.stock_position_id,v.created_at,v.updated_at FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id WHERE v.id>=626 ORDER BY v.id"
            echo "=== $DB POSITIONS >= 100 ==="
            q "$ID" "SELECT sp.id,sp.product_id,p.name AS product_name,sp.material,sp.length,sp.created_at,sp.updated_at FROM catalog_stock_positions sp JOIN catalog_products p ON p.id=sp.product_id WHERE sp.id>=100 ORDER BY sp.id"
            echo "=== $DB REFERENCES RECENT/TESTISH ==="
            q "$ID" "SELECT id,kind,value,is_active,created_at,updated_at FROM reference_values WHERE id>=48800 OR UPPER(value) LIKE '%TEST%' OR UPPER(value) LIKE '%ТЕСТ%' OR UPPER(value) LIKE '%МУСОР%' OR UPPER(value) LIKE '%ДУБАЙ%' ORDER BY id"
            echo "=== $DB PRODUCT ALIASES ==="
            q "$ID" "SELECT id,alias_key,raw_value,product_id,created_at,updated_at FROM catalog_product_aliases ORDER BY id"
            echo "=== $DB VALUE ALIASES ==="
            q "$ID" "SELECT id,kind,alias_key,raw_value,canonical_value,created_at,updated_at FROM catalog_value_aliases ORDER BY id"
            echo "=== $DB INPUT ALIASES ==="
            q "$ID" "SELECT id,input_key,variant_id,created_at,updated_at FROM catalog_input_aliases ORDER BY id"
          done
