name: R5.8 Finance exact-order fix

on:
  push:
    branches:
      - safe/d1-read-budget-r5-8-finance-20260904

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply exact-order fix
        run: |
          set -euo pipefail
          python3 scripts/apply-r5-8-order-fix.py
          npm run test:d1-read-budget-r5-8
          npm run typecheck
          npm run build
          npm run verify:db-safety
      - name: Commit fix and clean helpers
        run: |
          set -euo pipefail
          rm .github/workflows/r5-8-finance-order-fix.yml
          rm scripts/apply-r5-8-order-fix.py
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add worker/domains/finance-reports.ts scripts/test-d1-read-budget-r5-8.mjs .github/workflows/r5-8-finance-order-fix.yml scripts/apply-r5-8-order-fix.py
          git commit -m "R5.8: preserve Finance payment day order"
          git push origin HEAD:safe/d1-read-budget-r5-8-finance-20260904
