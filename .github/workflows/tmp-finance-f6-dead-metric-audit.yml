name: Temporary Finance F6 dead metric cleanup

on:
  push:
    branches:
      - finance-f6-release-audit

permissions:
  contents: write

jobs:
  audit-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f6-dead-metrics-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Remove mixed-cohort dead metrics
        run: python3 scripts/tmp-finance-f6-dead-metric-fix.py
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified dead metric cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            worker/domains/finance-reports.ts \
            src/app/types.ts \
            scripts/finance-f6-dead-metrics-worker-manifest.json \
            scripts/test-finance-f6-release-audit.mjs \
            scripts/test-step1906a-worker-modularization.mjs \
            scripts/release-check.mjs
          git commit -m "Remove mixed-cohort Finance rates [finance-f6-dead-metrics-verified]"
          git push origin HEAD:finance-f6-release-audit
