name: Branch2 historical return compatibility facts (read-only)
on:
  push:
    branches: [branch2]
permissions:
  contents: read
jobs:
  diagnose:
    if: >-
      startsWith(github.event.head_commit.message, 'Branch2: readonly historical return facts 20261115')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect only selected QA order IDs in test D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          dbid='0904a573-21ff-44d8-93b0-c9200f771702'
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+dbid
          head={'Content-Type':'application/json','Authorization':'Bearer '+token}
          with urllib.request.urlopen(urllib.request.Request(base,headers=head),timeout=25) as r:
              info=json.load(r)
          if not info.get('success') or info['result']['name']!='orders_db_branch2_mirror_20261027':
              raise SystemExit('STOP: wrong test D1')
          queries=[
          ("orders","SELECT id,external_id,pricing_mode,total_amount,received_amount,return_amount,debt_amount FROM orders WHERE id BETWEEN 2196 AND 2206 AND id IN (2196,2197,2198,2199,2205) ORDER BY id"),
          ("returns","SELECT r.id,r.order_id,r.amount,r.status,r.created_at,\n (SELECT COUNT(*) FROM return_items ri WHERE ri.return_id=r.id) AS line_count,\n (SELECT COUNT(*) FROM return_v2_unified_postings up WHERE up.return_id=r.id) AS new_v2,\n (SELECT COUNT(*) FROM return_v2_postings vp WHERE vp.return_id=r.id) AS old_v2,\n (SELECT COUNT(*) FROM exchanges e WHERE e.refund_return_id=r.id AND e.status<>'cancelled') AS exchange_links\n FROM returns r WHERE r.order_id IN (2196,2197,2198,2199,2205) ORDER BY r.order_id,r.id"),
          ("return_items","SELECT r.order_id,r.id AS return_id,r.status AS return_status,ri.order_item_id,ri.quantity,ri.amount,\n ri.contract_quantity_applied,ri.physical_tracking,ri.restocked,ri.physical_received_at,ri.inventory_source,\n oi.quantity AS current_qty,oi.unit_price,oi.line_total,oi.stock_writeoff_status,oi.is_workshop\n FROM returns r JOIN return_items ri ON ri.return_id=r.id\n LEFT JOIN order_items oi ON oi.id=ri.order_item_id\n WHERE r.order_id IN (2196,2197,2198,2199,2205) ORDER BY r.order_id,r.id,ri.order_item_id"),
          ("exchanges","SELECT e.id,e.order_id,e.status,e.financial_action,e.financial_amount,e.payment_id,e.refund_return_id,\n e.old_order_item_id,e.old_quantity,e.new_order_item_id,\n (SELECT quantity FROM order_items oi WHERE oi.id=e.old_order_item_id) AS old_qty,\n (SELECT quantity FROM order_items oi WHERE oi.id=e.new_order_item_id) AS new_qty\n FROM exchanges e WHERE e.order_id IN (2196,2197,2198,2199,2205) ORDER BY e.order_id,e.id"),
          ("items","SELECT oi.order_id,oi.id,oi.quantity,oi.unit_price,oi.line_total,oi.stock_writeoff_status,oi.is_workshop,\n oi.source_type,\n (SELECT COUNT(*) FROM inventory_reservations r WHERE r.order_item_id=oi.id AND r.status='active') AS active_res,\n (SELECT COUNT(*) FROM inventory_reservations r WHERE r.order_item_id=oi.id AND r.status='fulfilled') AS fulfilled_res,\n (SELECT COUNT(*) FROM order_dispatch_items di WHERE di.order_item_id=oi.id AND di.quantity>di.cancelled_quantity) AS dispatched\n FROM order_items oi WHERE oi.order_id IN (2196,2197,2198,2199,2205) ORDER BY oi.order_id,oi.id"),
          ("cash","SELECT o.id AS order_id,\n (SELECT COALESCE(SUM(p.amount),0) FROM payments p WHERE p.order_id=o.id AND p.amount>0) paid,\n (SELECT COALESCE(SUM(r.amount),0) FROM returns r WHERE r.order_id=o.id AND COALESCE(r.status,'completed')<>'cancelled') refunded,\n (SELECT COALESCE(SUM(oi.line_total),0) FROM order_items oi WHERE oi.order_id=o.id AND oi.quantity>0) line_sum\n FROM orders o WHERE o.id IN (2196,2197,2198,2199,2205)")
          ]
          queries.append(("exchange_items", """
          SELECT ei.exchange_id,ei.id,ei.role,ei.order_item_id,ei.quantity,
            oi.quantity AS current_qty,oi.unit_price,oi.line_total,oi.stock_writeoff_status
          FROM exchange_items ei LEFT JOIN order_items oi ON oi.id=ei.order_item_id
          WHERE ei.exchange_id IN (95,96,97)
          ORDER BY ei.exchange_id,ei.role,ei.id
          """))
          queries.append(("dispatch_history", """
          SELECT d.order_id,di.order_item_id,di.id AS dispatch_item,di.quantity,
            di.cancelled_quantity,di.source_type,di.movement_id,
            dc.id AS correction_id,dc.quantity AS correction_qty,dc.stock_restored,
            (SELECT COUNT(*) FROM inventory_movements m WHERE m.id=di.movement_id
              AND m.movement_type='sale' AND m.reference_type='order_dispatch') AS valid_movement
          FROM order_dispatch_items di
          JOIN order_dispatches d ON d.id=di.dispatch_id
          LEFT JOIN order_dispatch_corrections dc ON dc.dispatch_item_id=di.id
          WHERE d.order_id IN (2196,2197,2198,2199,2205)
          ORDER BY d.order_id,di.order_item_id,di.id
          """))
          queries.append(("reservations", """
          SELECT r.order_id,r.order_item_id,r.id,r.quantity,r.status,r.inventory_source,
            r.variant_id,r.fulfilled_at,r.released_at
          FROM inventory_reservations r
          WHERE r.order_id IN (2196,2197,2198,2199,2205)
          ORDER BY r.order_id,r.order_item_id,r.id
          """))
          for name,sql in queries:
              if not sql.lstrip().upper().startswith('SELECT '):
                  raise SystemExit('STOP nonread query')
              req=urllib.request.Request(base+'/query',method='POST',headers=head,
                  data=json.dumps({'sql':sql,'params':[]}).encode())
              with urllib.request.urlopen(req,timeout=35) as r:res=json.load(r)
              if not res.get('success'):raise SystemExit('SELECT failed: '+str(res.get('errors')))
              data=res['result'][0]
              if (data.get('meta') or {}).get('changes',0)!=0:raise SystemExit('Unexpected mutation')
              print('FACT_'+name.upper()+': '+json.dumps(data.get('results',[]),ensure_ascii=False,separators=(',',':')))
          print('TEST_ONLY_READONLY_COMPLETE')
          PY
