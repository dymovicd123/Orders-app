name: W3.1B Stock micro-check

on:
  push:
    branches:
      - safe/w3-1b-stock-micro-check-20260905

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: "${{ github.event.head_commit.message == 'chore: run W3.1B patch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: safe/w3-1b-stock-micro-check-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture pre-W3.1B overview hash
        run: |
          node --input-type=module <<'NODE' > /tmp/w3-1b-before-hash
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const normalize = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')
          const text = fs.readFileSync('src/features/inventory/views/renderInventoryOverviewPanel.tsx', 'utf8')
          const source = ts.createSourceFile('renderInventoryOverviewPanel.tsx', text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let fn = null
          const visit = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryOverviewPanel') fn = node; ts.forEachChild(node, visit) }
          source.forEachChild(visit)
          if (!fn?.body) throw new Error('renderInventoryOverviewPanel missing')
          const ret = [...fn.body.statements].find((statement) => ts.isReturnStatement(statement))
          if (!ret?.expression) throw new Error('overview return missing')
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          const rendered = expression.getText(source).replace('{renderRoutineCycleCountCue(ctx)}', '')
          console.log(sha(normalize(rendered)))
          NODE

      - name: Apply W3.1B patch
        run: python3 scripts/apply-w3-1b-stock-micro-check.py

      - name: Generate exact W3.1B frontend preservation manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const normalize = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')
          const text = fs.readFileSync('src/features/inventory/views/renderInventoryOverviewPanel.tsx', 'utf8')
          const source = ts.createSourceFile('renderInventoryOverviewPanel.tsx', text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let fn = null
          const visit = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryOverviewPanel') fn = node; ts.forEachChild(node, visit) }
          source.forEachChild(visit)
          if (!fn?.body) throw new Error('renderInventoryOverviewPanel missing')
          const ret = [...fn.body.statements].find((statement) => ts.isReturnStatement(statement))
          if (!ret?.expression) throw new Error('overview return missing')
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          const rendered = expression.getText(source).replace('{renderRoutineCycleCountCue(ctx)}', '')
          const before = fs.readFileSync('/tmp/w3-1b-before-hash', 'utf8').trim()
          const after = sha(normalize(rendered))
          const manifest = { version: 1, revision: 'w3-1b-stock-micro-check', frontend: { panelReturnChanges: { renderInventoryOverviewPanel: { before, after } } } }
          fs.writeFileSync('scripts/w3-1b-stock-micro-check-frontend-manifest.json', JSON.stringify(manifest, null, 2) + '\n')
          console.log(`W3.1B overview preservation: ${before} -> ${after}`)
          NODE

      - name: Diff safety
        run: git diff --check

      - name: Focused W3.1B regression
        run: node scripts/test-w3-1b-stock-micro-check.mjs

      - name: Full cumulative release check
        run: npm run release:check

      - name: Database safety verification
        run: npm run verify:db-safety

      - name: Build
        run: npm run build

      - name: Cloudflare dry run only
        run: npx wrangler deploy --dry-run

      - name: Confirm no migration change
        run: |
          if git diff --name-only | grep -E '(^|/)(migrations?|schema)(/|\.|$)' ; then
            echo 'Unexpected migration/schema change in W3.1B'
            exit 1
          fi

      - name: Commit validated W3.1B
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/inventory/views/renderInventoryOverviewPanel.tsx src/features/inventory/useInventoryAttentionActions.ts scripts/test-step1906b-frontend-modularization.mjs scripts/w3-1b-stock-micro-check-frontend-manifest.json scripts/test-w3-1b-stock-micro-check.mjs package.json docs/continuation/W3_1B_STOCK_MICRO_CHECK_20260905.md
          git diff --cached --check
          git commit -m 'W3.1B: add voluntary stock micro-check'
          git push origin HEAD:safe/w3-1b-stock-micro-check-20260905
