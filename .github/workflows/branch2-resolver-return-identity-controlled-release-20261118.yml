name: Branch2 Resolver Return V2 identity and Exchange Workshop guarded Worker publish (NO Main)
on:
  push:
    branches: [branch2]
    paths:
      - .github/workflows/branch2-resolver-return-identity-controlled-release-20261118.yml
permissions:
  contents: read
concurrency:
  group: branch2-controlled-worker-deployment
  cancel-in-progress: false
jobs:
  branch2-only:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact source and test-only Cloudflare target
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'f1b4a0caf6824b3a58f9c58d668870cd42e26b1f'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/branch2-resolver-return-identity-controlled-release-20261118.yml'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          assert cfg['name']=='orders-app-branch2'
          assert cfg['vars']['RETURN_V2_ENABLED']=='true'
          assert cfg['main']=='worker/index.ts'
          assert cfg.get('env') is None
          assert cfg['d1_databases']==[{
            'binding':'DB','database_name':'orders_db_branch2_mirror_20261027',
            'database_id':'0904a573-21ff-44d8-93b0-c9200f771702'
          }]
          cfg['keep_vars']=True
          cfg['send_metrics']=False
          Path('.branch2-resolver-return-identity-release.jsonc').write_text(json.dumps(cfg,indent=2)+'\n')
          print('EXACT_BRANCH2_SOURCE_AND_TARGET_PASS')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Validate full dependency audit and scoped dev-only exception
        run: |
          npm audit --omit=dev --audit-level=moderate
          node scripts/test-security-dependency-audit-20261117.mjs
          node scripts/security-dependency-audit-20261117.mjs
      - name: Verify safe shipping preflight, mixed sent orders, Resolver and Return V2
        run: |
          node scripts/test-resolver-return-identity-20261118.mjs
          node scripts/test-resolver-exchange-pending-workshop-20261118.mjs
          node scripts/test-return-v2-unified-posting-prototype-20261114.mjs
          node scripts/test-return-v2-unified-line-evidence-20261114.mjs
          node scripts/test-kerbez-length-confirmation-20261118.mjs
          node scripts/test-catalog-resolver-optional-dimensions-20261118.mjs
          node scripts/test-catalog-resolver-r13-known-facts.mjs
          node scripts/test-order-send-resolver-prepare-20261118.mjs
          node scripts/test-stage5b-dispatch-atomic-d1-20261101.mjs
          node scripts/test-main-confirmed-shipping-state-20261108.mjs
          node scripts/test-stage5-client-quantity-replay-20261102.mjs
          node scripts/test-old-order-post-stocktake-handover-r1.mjs
          node scripts/test-handover-cas-after-revision-r2.mjs
          node scripts/test-catalog-resolver-r10-acceptance-matrix.mjs
          node scripts/test-return-v2-immediate-intake-20261114.mjs
      - name: Validate previous warehouse barcode and stocktake safety
        run: |
          node scripts/test-stocktake-mobile-camera-and-layout-20261117.mjs
          node scripts/test-stocktake-camera-print-step-20261117.mjs
          node scripts/test-stocktake-found-labels-20261117.mjs
          node scripts/test-w5-6-stocktake-outcome.mjs
          node scripts/test-arrival-stocktake-shared-sku-20261117.mjs
          node scripts/test-stocktake-barcode-scan-20261117.mjs
          node scripts/test-warehouse-receiving-barcode-finder-20261117.mjs
          node scripts/test-barcode-correction-lookup-20261117.mjs
          node scripts/test-sku-scan-unified-outbound-20261117.mjs
          node scripts/test-w6-unified-operations.mjs
          node scripts/test-inventory-writeoff-review.mjs
          node scripts/test-transfer-canonical-barcode-identity-20261030.mjs
          node scripts/test-arrival-completion-history-reprint-20261117.mjs
          node scripts/test-post-arrival-sku-print-20261117.mjs
          node scripts/test-barcode-print-v2-20261117.mjs
          node scripts/test-barcode-print-workspace-20261117.mjs
          node scripts/test-barcode-sku-workflow-ux-20261116.mjs
          node scripts/test-barcode-no-hardware-20261117.mjs
          node scripts/test-barcode-sku-scanner-ui-20261116.mjs
          node scripts/test-post-arrival-unit-labels-20261117.mjs
          node scripts/test-arrival-save-reliability.mjs
          node scripts/test-arrival-materialization-reliability.mjs
          node scripts/test-arrival-canonical-barcode-sku-20261030.mjs
          node scripts/test-warehouse-return-exchange-receiving-20261117.mjs
          node scripts/test-barcode-unit-label-preparation-20261116.mjs
          node scripts/test-barcode-operation-unit-20261117.mjs
          node scripts/test-return-exchange-physical-receipt-r1.mjs
          node scripts/test-return-v2-immediate-intake-20261114.mjs
          node scripts/test-stage02-post-review-resolver-return-ux.mjs
          node scripts/test-work733-smart-exchange-inbox-20261101.mjs
          node scripts/test-return-unissued-physical-safety-r2.mjs
          node scripts/test-exchange-set-v2-ui.mjs
          npm run build
      - name: Dry-run Branch2 only (no Cloudflare changes)
        run: |
          npx --no-install wrangler deploy --config .branch2-resolver-return-identity-release.jsonc --name orders-app-branch2 --keep-vars --strict --dry-run --outdir .branch2-resolver-return-identity-preview
      - name: Verify active test D1, Worker bindings and DDS migration (READ ONLY)
        run: python3 scripts/branch2-dds-0139-release-guard-20261117.py worker-after
      - name: Deploy Branch2 Worker UX only without D1 migrations
        run: |
          npx --no-install wrangler deploy --config .branch2-resolver-return-identity-release.jsonc --name orders-app-branch2 --keep-vars --strict
      - name: Verify test Worker binding after deployment (READ ONLY)
        run: python3 scripts/branch2-dds-0139-release-guard-20261117.py worker-after
      - name: Public Branch2 health and bundle smoke
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.error
          base='https://orders-app-branch2.orders-clothes.workers.dev'
          def get(path):
              for attempt in range(1,11):
                  req=urllib.request.Request(base+path,headers={
                      'User-Agent':'OrdersBranch2ReturnIdentityRelease/1.0',
                      'Accept':'application/json,text/html,*/*'})
                  try:
                      with urllib.request.urlopen(req,timeout=25) as response:
                          if response.status==200:return response.read()
                  except urllib.error.HTTPError as error:
                      print('HTTP_ERROR',path,error.code,'attempt',attempt)
                  except Exception as error:
                      print('HTTP_EXCEPTION',path,type(error).__name__,'attempt',attempt)
                  time.sleep(3)
              raise SystemExit('BRANCH2_SMOKE_FAILED '+path)
          health=json.loads(get('/api/health'))
          if health.get('ok') is not True:raise SystemExit('HEALTH_NOT_OK')
          page=get('/').decode('utf8','replace')
          if '<html' not in page.lower():raise SystemExit('ROOT_HTML_NOT_OK')
          match=re.search(r'<script[^>]*src="(/assets/[^"]+)"',page)
          if not match:raise SystemExit('ENTRY_ASSET_NOT_FOUND')
          asset_path=match.group(1)
          for attempt in range(1,11):
              asset=get(asset_path)
              if len(asset)>1000 and not asset.lstrip().lower().startswith(b'<!doctype html'):
                  print('JS_ENTRY_VERIFIED',asset_path,'bytes',len(asset))
                  break
              print('JS_NOT_PROPAGATED',asset_path,'attempt',attempt,'bytes',len(asset))
              time.sleep(3)
          else:raise SystemExit('ASSET_NOT_OK')
          print('BRANCH2_RETURN_IDENTITY_VERIFIED_NO_MAIN_WRITES')
          PY
