name: R5.4 SQL hotfix deploy

on:
  push:
    branches:
      - safe/r5-4-sql-hotfix-deploy-20260903
    paths:
      - scripts/.r5-4-sql-hotfix-deploy-trigger

permissions:
  contents: read

jobs:
  deploy-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET: https://orders-app.orders-clothes.workers.dev
      BRANCH2_TARGET: https://orders-app-branch2.orders-clothes.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Final permanent gates before deploy
        run: |
          node scripts/test-runtime-sql-syntax-r1.mjs
          npm run typecheck
          npm run release:check
          npm run build
      - name: Deploy corrected Production runtime only
        run: npx wrangler deploy
      - name: Install browser for read-only acceptance
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Broad post-deploy read-only acceptance with Worker tail
        shell: bash
        run: |
          set -euo pipefail
          : > tail.log
          timeout 90s npx wrangler tail orders-app --format json >tail.log 2>&1 &
          TAIL_PID=$!
          sleep 6

          check_get() {
            local url="$1"
            local code
            code="$(curl -sS -o /tmp/body -w '%{http_code}' "$url")"
            echo "HTTP $code $url"
            if [[ "$code" != "200" ]]; then
              head -c 1500 /tmp/body || true
              echo
              return 1
            fi
          }

          check_get "$TARGET/api/health"
          check_get "$TARGET/api/admin-mode/status"
          check_get "$TARGET/api/orders?limit=100&offset=0&q=&status=all&shippingStatus=all&archiveMode=active&manager=&managerId=0&dateFrom=2026-09-01&dateTo=2026-09-03"
          check_get "$TARGET/api/orders?limit=100&archiveMode=active"
          check_get "$TARGET/api/inventory/attention"
          check_get "$TARGET/api/workshop/counts"
          check_get "$TARGET/api/workshop?view=active&period=month&urgentOnly=0&sort=oldest&limit=300&includeCounts=0"
          check_get "$TARGET/api/inventory?source=warehouse&limit=100&includeMovements=0"
          check_get "$TARGET/api/clients?limit=50"
          check_get "$TARGET/api/team"
          check_get "$TARGET/api/reference-data"

          # Branch2 is deliberately read-only here: verify the isolated Worker still answers, do not deploy or mutate it.
          check_get "$BRANCH2_TARGET/api/health"
          check_get "$BRANCH2_TARGET/api/orders?limit=10&archiveMode=active"

          node <<'NODE'
          const { chromium } = require('playwright')
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const failures = []
            const pages = ['orders','workshop','inventory','finance','reports']
            for (const section of pages) {
              const context = await browser.newContext({ viewport: { width: 1600, height: 1000 } })
              const page = await context.newPage()
              const apiFailures = []
              const pageErrors = []
              const consoleErrors = []
              const mutations = []
              await page.route('**/api/**', async route => {
                const method = route.request().method().toUpperCase()
                if (!['GET','HEAD'].includes(method)) {
                  mutations.push(`${method} ${route.request().url()}`)
                  return route.abort('aborted')
                }
                return route.continue()
              })
              page.on('response', r => {
                if (r.url().includes('/api/') && r.status() >= 400) apiFailures.push(`${r.status()} ${r.url()}`)
              })
              page.on('pageerror', e => pageErrors.push(String(e)))
              page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()) })
              await page.goto(`${process.env.TARGET}/#${section}`, { waitUntil:'domcontentloaded', timeout:90000 })
              await page.waitForTimeout(5000)
              const body = (await page.locator('body').innerText()).slice(0, 3000)
              console.log(`UI_${section.toUpperCase()} body=${body.replace(/\s+/g,' ').slice(0,600)}`)
              console.log(`UI_${section.toUpperCase()} apiFailures=${JSON.stringify(apiFailures)} pageErrors=${JSON.stringify(pageErrors)} consoleErrors=${JSON.stringify(consoleErrors)} mutations=${JSON.stringify(mutations)}`)
              if (apiFailures.length || pageErrors.length || consoleErrors.some(x => /Failed to load resource|TypeError|ReferenceError|ApiResponseError|1101/i.test(x)) || mutations.length) {
                failures.push({ section, apiFailures, pageErrors, consoleErrors, mutations })
              }
              if (section === 'orders' && /Не удалось загрузить список заказов|Нет связи/.test(body)) failures.push({ section, reason:'Orders UI still reports load failure' })
              await context.close()
            }
            await browser.close()
            if (failures.length) throw new Error(`POSTDEPLOY_UI_FAILURES ${JSON.stringify(failures)}`)
            console.log('POSTDEPLOY_UI_READONLY_ACCEPTANCE_PASSED')
          })().catch(e => { console.error(e); process.exit(1) })
          NODE

          sleep 8
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo '--- exception scan ---'
          if grep -E '"outcome"[[:space:]]*:[[:space:]]*"exception"|D1_ERROR:.*syntax error|error code: 1101' tail.log; then
            echo 'Worker exception detected during postdeploy smoke' >&2
            exit 7
          fi
          echo 'R5_4_SQL_HOTFIX_POSTDEPLOY_ACCEPTANCE_PASSED'
