name: One-time feature branch ZXing package lock regeneration
on:
  push:
    branches: [feature/branch2-stocktake-print-mobile-camera-20261117]
    paths:
      - .github/workflows/feature-branch-zxing-lock-20261117.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.ref == 'refs/heads/feature/branch2-stocktake-print-mobile-camera-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/branch2-stocktake-print-mobile-camera-20261117
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve audited pinned ZXing package metadata only
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dymovicd123/Orders-app"
          node -e "const p=require('./package.json'); if(p.dependencies['@zxing/browser']!=='0.2.1') process.exit(1)"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/@zxing/browser']?.version!=='0.2.1')process.exit(1)"
          git diff --exit-code -- package.json
          git diff --check
      - name: Commit lockfile only to isolated feature branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/branch2-stocktake-print-mobile-camera-20261117"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          test "$(git diff --cached --name-only)" = "package-lock.json"
          git commit -m "Lock pinned ZXing browser and transitive packages for mobile scanning"
          git push origin HEAD:refs/heads/feature/branch2-stocktake-print-mobile-camera-20261117
