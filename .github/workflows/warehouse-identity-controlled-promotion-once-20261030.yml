name: Branch2 warehouse exact SKU controlled version activation
on:
  push:
    branches: [audit/branch2-warehouse-barcode-readiness-20261030]
    paths:
      - '.github/workflows/warehouse-identity-controlled-promotion-once-20261030.yml'
permissions:
  contents: read
concurrency:
  group: branch2-warehouse-barcode-identity-20261030
  cancel-in-progress: false
jobs:
  activate-branch2-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact pinned Wrangler
        run: npm ci
      - name: Verify tested version, record D1 bookmark, publish Branch2 only and smoke/rollback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/warehouse-identity-controlled-promotion-20261030.mjs
          node scripts/ops/warehouse-identity-controlled-promotion-20261030.mjs
      - name: Save D1 bookmark for manual rollback reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch2-warehouse-identity-rollback-bookmark
          path: release-proof/branch2-warehouse-identity-rollback-bookmark.json
          retention-days: 7
          if-no-files-found: ignore
