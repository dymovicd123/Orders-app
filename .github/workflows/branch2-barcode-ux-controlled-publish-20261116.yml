name: Branch2 barcode UX controlled publish 2026-11-16 (NO Main)
on:
  push:
    branches: [branch2]
    paths:
      - .github/workflows/branch2-barcode-ux-controlled-publish-20261116.yml
permissions:
  contents: read
concurrency:
  group: branch2-controlled-worker-deployment
  cancel-in-progress: false
jobs:
  branch2-only:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Guard one-shot release and exact Branch2 database
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '8520890f090650815a65b59601553b4584a0e716'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          assert cfg['name']=='orders-app-branch2'
          assert cfg['main']=='worker/index.ts'
          assert cfg.get('env') is None
          assert cfg['d1_databases']==[{
            'binding':'DB','database_name':'orders_db_branch2_mirror_20261027',
            'database_id':'0904a573-21ff-44d8-93b0-c9200f771702'
          }]
          cfg['keep_vars']=True
          cfg['send_metrics']=False
          Path('.branch2-barcode-ux-release.jsonc').write_text(json.dumps(cfg,indent=2)+'\n')
          print('ONLY_BRANCH2_D1_WORKER_CONFIG_PASS')
          PY
      - name: Preflight live Branch2 bindings (READ ONLY)
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          req=urllib.request.Request(
            'https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/orders-app-branch2/settings',
            headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
          if not data.get('success'):raise SystemExit('Cloudflare settings unreadable')
          bindings=data['result'].get('bindings',[])
          db=[b for b in bindings if b.get('name')=='DB']
          if len(db)!=1 or db[0].get('type')!='d1' or (db[0].get('database_id') or db[0].get('id'))!='0904a573-21ff-44d8-93b0-c9200f771702':
            raise SystemExit('ABORT wrong D1 binding')
          old={b.get('name'):b.get('type') for b in bindings if b.get('name')!='DB'}
          if 'ADMIN_MODE_SESSION_SECRET' not in old:raise SystemExit('ABORT admin session secret missing')
          Path('.branch2-barcode-ux-bindings-before.json').write_text(json.dumps(old))
          print('BRANCH2_BINDINGS_PREFLIGHT_PASS')
          PY
      - run: npm ci --no-audit --no-fund
      - name: End-to-end code gates before release
        run: |
          set -euo pipefail
          node scripts/test-barcode-sku-foundation.mjs
          node scripts/test-barcode-sku-http-domain-20261116.mjs
          node scripts/test-barcode-sku-scanner-ui-20261116.mjs
          node scripts/test-barcode-sku-workflow-ux-20261116.mjs
          node scripts/test-barcode-unit-foundation-20261116.mjs
          node scripts/test-barcode-unit-catalog-integrity-20261116.mjs
          npm run build
      - name: Wrangler dry run (NO upload)
        run: |
          npx --no-install wrangler deploy --config .branch2-barcode-ux-release.jsonc --name orders-app-branch2 --keep-vars --strict --dry-run --outdir .branch2-barcode-ux-preview
      - name: Deploy ONLY Branch2 Worker, NO D1 migration
        run: |
          npx --no-install wrangler deploy --config .branch2-barcode-ux-release.jsonc --name orders-app-branch2 --keep-vars --strict
      - name: Assert D1 and existing secret bindings preserved (READ ONLY)
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          req=urllib.request.Request(
            'https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/orders-app-branch2/settings',
            headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: data=json.load(response)
          if not data.get('success'):raise SystemExit('ABORT Cloudflare settings unreadable')
          bindings=data['result'].get('bindings',[])
          db=[b for b in bindings if b.get('name')=='DB']
          if len(db)!=1 or db[0].get('type')!='d1' or (db[0].get('database_id') or db[0].get('id'))!='0904a573-21ff-44d8-93b0-c9200f771702':
            raise SystemExit('ABORT Branch2 D1 changed')
          before=json.loads(Path('.branch2-barcode-ux-bindings-before.json').read_text())
          now={b.get('name'):b.get('type') for b in bindings if b.get('name')!='DB'}
          for name,kind in before.items():
            if now.get(name)!=kind:raise SystemExit('ABORT binding changed: '+name)
          print('BRANCH2_BINDINGS_PRESERVED_PASS')
          PY
      - name: Public health smoke (READ ONLY)
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://orders-app-branch2.orders-clothes.workers.dev'
          for path in ('/api/health','/'):
            passed=False
            for attempt in range(5):
              try:
                with urllib.request.urlopen(base+path,timeout=20) as r:
                  if r.status!=200:continue
                  body=r.read(500)
                  if path=='/api/health' and not json.loads(body).get('ok'):continue
                  passed=True
                  break
              except Exception:
                time.sleep(2)
            if not passed:raise SystemExit('BRANCH2_SMOKE_FAILED '+path)
            print('BRANCH2_200_PASS '+path)
          PY
