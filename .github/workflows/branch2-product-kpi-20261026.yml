name: Branch2 product KPI and Leads release
on:
  push:
    branches: [branch2]
    paths: ['.github/workflows/branch2-product-kpi-20261026.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: branch2-product-kpi-20261026
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/branch2'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Guard test-only release scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "branch2"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -Eiq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
          base="7cb5acaabf719e2855754c2dbaf0aae097b9d124"
          git merge-base --is-ancestor "$base" "$GITHUB_SHA"
          git diff --name-only "$base" "$GITHUB_SHA" | while IFS= read -r f; do
            case "$f" in
              migrations/0116_monthly_product_kpi.sql|worker/domains/product-kpi.ts|worker/index.ts|src/App.tsx|\
              src/app/managerWorkspaceAccess.ts|src/features/sections/PlanSection.tsx|\
              src/features/sections/ProductKpiSection.tsx|src/styles/product-kpi.css|\
              scripts/test-product-kpi-20261026.mjs|.github/workflows/branch2-product-kpi-20261026.yml) ;;
              *) echo "Unexpected change: $f";exit 1;;
            esac
          done
      - run: npm ci
      - name: KPI and roles regression
        run: node scripts/test-product-kpi-20261026.mjs
      - name: Typecheck and complete app build
        run: npm run build
  deploy:
    if: github.ref == 'refs/heads/branch2'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Verify isolated test database and deploy target
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "branch2"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -Eiq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
      - run: npm ci
      - name: Capture business data invariants
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT
          (SELECT COUNT(*) FROM orders) AS orders_count,
          (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS order_sum,
          (SELECT COUNT(*) FROM order_items) AS items_count,
          (SELECT COUNT(*) FROM payments) AS payments_count,
          (SELECT COUNT(*) FROM inventory_movements) AS stock_moves,
          (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS stock_total,
          (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserve_total" --json | jq -cSe '.[0].results[0]' > /tmp/kpi_before.json
      - name: Capture D1 Time Travel bookmark before migration
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/40065052-854e-44b8-bcd5-251bdd488301/time_travel/bookmark" \
            | jq -er 'if .success==true and (.result.bookmark|type=="string") and (.result.bookmark|length>=32) then .result.bookmark else error("No D1 bookmark") end' > /tmp/kpi_bookmark
          test -s /tmp/kpi_bookmark
      - name: Create isolated KPI tables
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --file migrations/0116_monthly_product_kpi.sql
      - name: Verify schema and no business-data changes
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT
          (SELECT COUNT(*) FROM orders) AS orders_count,
          (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS order_sum,
          (SELECT COUNT(*) FROM order_items) AS items_count,
          (SELECT COUNT(*) FROM payments) AS payments_count,
          (SELECT COUNT(*) FROM inventory_movements) AS stock_moves,
          (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS stock_total,
          (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserve_total" --json | jq -cSe '.[0].results[0]' > /tmp/kpi_after.json
          cmp /tmp/kpi_before.json /tmp/kpi_after.json
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type='table' AND name IN ('product_kpis','product_kpi_participants','product_kpi_audit')" --json | jq -e '.[0].results[0].count==3'
      - run: npm run build
      - name: Deploy branch2 only
        run: npx wrangler deploy
      - name: Verify test origin
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const host='https://orders-app-branch2.orders-clothes.workers.dev'
          for(let attempt=0;attempt<6;attempt++){
            try{
              const r=await fetch(host+'/?kpi='+Date.now(),{cache:'no-store'})
              if(!r.ok)throw Error('HTTP '+r.status)
              if(!(await r.text()).includes('/assets/'))throw Error('assets missing')
              console.log('BRANCH2_PRODUCT_KPI_DEPLOY_OK');process.exit(0)
            }catch(e){if(attempt===5)throw e;await new Promise(resolve=>setTimeout(resolve,2500))}
          }
          NODE
