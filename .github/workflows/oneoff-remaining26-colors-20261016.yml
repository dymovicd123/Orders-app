name: 'One-off guarded remaining 26 catalog color renames'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/oneoff-remaining26-colors-20261016.mjs'
      - '.github/workflows/oneoff-remaining26-colors-20261016.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-remaining26-colors-20261016.yml'
permissions:
  contents: read
concurrency:
  group: oneoff-remaining26-catalog-colors-20261016
  cancel-in-progress: false
jobs:
  inspect-or-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify pinned production D1 and event
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ops/oneoff-remaining26-colors-20261016.mjs
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/main' ]]
            echo 'APPLY_REMAINING26_COLORS=yes' >> "$GITHUB_ENV"
          else
            echo 'APPLY_REMAINING26_COLORS=no' >> "$GITHUB_ENV"
          fi
          cat > "$RUNNER_TEMP/production-remaining26-color.jsonc" <<'CFG'
          {
            "name": "orders-app-colors-only-d1",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_CANARY_CONFIG=$RUNNER_TEMP/production-remaining26-color.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Check live SKU, inventory, reservations, FTS and guarded SQL
        run: node scripts/ops/oneoff-remaining26-colors-20261016.mjs
