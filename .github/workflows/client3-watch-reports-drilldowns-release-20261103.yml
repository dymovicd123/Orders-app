name: Client3 Main reports drilldowns guarded release (third Worker only)
on:
  push:
    branches: [client3/main-reports-drilldown-logistics-print-20261103]
    paths: ['.github/workflows/client3-watch-reports-drilldowns-release-20261103.yml']
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Exact accepted source and isolated Client3 identity
        run: |
          set -eEuo pipefail
          trap 'echo "CLIENT3_WORKSPACES_RELEASE_GATE_FAILED line $LINENO"' ERR
          test "$GITHUB_REF" = refs/heads/client3/main-reports-drilldown-logistics-print-20261103
          test "$(git rev-parse HEAD^)" = c0e7dd8f1845bfaa3fa9266f2aa6668315bc96ad
          test "$(git diff --name-only c0e7dd8f1845bfaa3fa9266f2aa6668315bc96ad HEAD)" = .github/workflows/client3-watch-reports-drilldowns-release-20261103.yml
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41604548953 --jq .conclusion)" = success
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41604548953 --jq .head_sha)" = c0e7dd8f1845bfaa3fa9266f2aa6668315bc96ad
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci
      - name: Build accepted Client3
        run: npm run build
      - name: Pre-deploy business and inventory snapshot, FK check
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list orders_db_client3_old_client --remote --config wrangler.jsonc > /tmp/watch-migrations
          pending="$(grep -Eo '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/watch-migrations | sort -u || true)"
          test -z "$pending"
          echo "Pending Client3 migration: ${pending:-none}"
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM order_items) order_items_count,
              (SELECT COUNT(*) FROM payments) payments_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM returns) returns_count,
              (SELECT COUNT(*) FROM exchanges) exchanges_count,
              (SELECT COUNT(*) FROM inventory_movements) stock_movements,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum,
              (SELECT COUNT(*) FROM watch_products) products,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM watch_city_values) cities,
              (SELECT COUNT(*) FROM watch_model_aliases) aliases"             | jq -ce '.[0].results[0] | select(.orders_count>=0)' > /tmp/watch-before
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
      - name: Confirm no D1 schema mutation
        run: |
          set -euo pipefail
          pending="$(grep -Eo '[0-9]{4}_[A-Za-z0-9_-]+\.sql' /tmp/watch-migrations | sort -u || true)"
          test -z "$pending"
          echo "No migrations, stock or business updates for report-only release."
      - name: Deploy third Worker only
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Live brand-guarded anonymous read smoke and unchanged business data
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          test "$(curl -sSL -o /tmp/client3-index -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-index
          for path in             '/api/client3/watches/analytics?brand=TAUWACH&from=2026-11-01&to=2026-11-03'             '/api/client3/watches/analytics/city-orders?brand=TAUWACH&city=АЛМАТЫ&startDate=2026-11-01&endDate=2026-11-03'             '/api/client3/watches/analytics/day?brand=TAUWACH&date=2026-11-03'             '/api/client3/watches/stock/history?brand=TAUWACH'; do
            status=$(curl -sS -o /tmp/client3-unauth -w '%{http_code}' --max-time 30 "$base$path")
            test "$status" = 401 -o "$status" = 403
          done
          status=$(curl -sS -o /tmp/client3-cash-unauth -w '%{http_code}' --max-time 30             -X POST -H 'Content-Type: application/json' --data '{"brand":"TAUWACH","action":"setup","openingAmount":100}'             "$base/api/client3/watches/cash")
          test "$status" = 401 -o "$status" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM order_items) order_items_count,
              (SELECT COUNT(*) FROM payments) payments_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM returns) returns_count,
              (SELECT COUNT(*) FROM exchanges) exchanges_count,
              (SELECT COUNT(*) FROM inventory_movements) stock_movements,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum,
              (SELECT COUNT(*) FROM watch_products) products,
              (SELECT COUNT(*) FROM watch_variants) variants,
              (SELECT COUNT(*) FROM watch_city_values) cities,
              (SELECT COUNT(*) FROM watch_model_aliases) aliases"             | jq -ce '.[0].results[0]' > /tmp/watch-after
          diff -u /tmp/watch-before /tmp/watch-after
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json             --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
          echo CLIENT3_MAIN_REPORT_DRILLDOWNS_RELEASE_SUCCESS
      - name: Record published Main report drilldowns
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 report drilldowns RELEASED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Accepted source c0e7dd8f1845bfaa3fa9266f2aa6668315bc96ad, full focused SQLite + build https://github.com/dymovicd123/Orders-app/actions/runs/41604548953. Main CityOrdersExplorer embedded unchanged, brand-checked city→real orders with direct order focus, daily manager/model/city pivots, true city receipts by event date and financial method reconciliation. No invoice copied; client postponed it. NO D1 migration/write; order/money/physical/reservation snapshots unchanged. Main/Branch2 untouched. Browser role acceptance remains deferred."
      - name: Log any publish blocker
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 Main report drilldown deploy BLOCKED/FAILED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Do not claim new report drilldowns are live until a subsequent successful release."
