name: Branch2 barcode physical-unit foundation CI
on:
  push:
    branches: [feature/barcode-units-foundation-branch2-20261116]
  pull_request:
    branches: [branch2]
    paths:
      - migrations/0136_barcode_physical_units_foundation.sql
      - shared/barcode-unit.ts
      - scripts/test-barcode-unit-foundation-20261116.mjs
      - .github/workflows/ci-barcode-unit-foundation-20261116.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit token and additive SQLite schema
        run: node scripts/test-barcode-unit-foundation-20261116.mjs
      - name: Existing SKU barcode read-only checks
        run: |
          node scripts/test-barcode-sku-foundation.mjs
          node scripts/test-barcode-sku-http-domain-20261116.mjs
          node scripts/test-barcode-sku-scanner-ui-20261116.mjs
      - name: Build
        run: npm run build
