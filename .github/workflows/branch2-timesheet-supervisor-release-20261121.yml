name: Branch2 reviewed timesheet supervisor release 20261121
# One-shot Worker+assets publication; no migrations or Main deployment.
on:
  pull_request:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-timesheet-supervisor-release-20261121.yml'
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-timesheet-supervisor-release-20261121.yml'
permissions:
  contents: read
concurrency:
  group: branch2-timesheet-supervisor-reviewed-release
  cancel-in-progress: false
jobs:
  preview:
    name: Verify isolated target and dry-run, no publish
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Branch2 target and build without deployment
        run: node scripts/branch2-manual-release.mjs --ci-preview
  release:
    name: Publish ONLY Branch2 tested timesheet with supervisor access
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/branch2' &&
      startsWith(github.event.head_commit.message, 'release(branch2): timesheet supervisor 20261121')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify reviewed code and exact isolated release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git branch --show-current)" = 'branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '2ce309201f2d0b797a326885a34693e10ce4d8b6'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/branch2-timesheet-supervisor-release-20261121.yml'
          test "$(git hash-object src/features/team/TeamTimesheetWorkspace.tsx)" = '0b84ba08c4cdcbfd89be730c2cbc927b50201204'
          test "$(git hash-object src/features/team/teamTimesheetWorkspace.css)" = '9240a6b2f2fc5f284170907739657d09af6c1427'
          test "$(git hash-object src/features/sections/TeamSection.tsx)" = 'aaac19cb31b3bf5037b55933365fbccf6fd96b7c'
          test "$(git hash-object worker/domains/team-schedule-access.ts)" = 'df3eb91b1ec8c7a4d0bf3944e1db653b4041abce'
          test "$(git hash-object worker/index.ts)" = '2dd947eb042204aa7a9e3216dda394a41a6a512e'
          test "$(git hash-object scripts/test-team-schedule-supervisor-20261121.mjs)" = '0e6c3522b6d5ec341f889fb796e7cfa045019d83'
          test "$(git hash-object scripts/test-team-timesheet-bulk-safe-20261110.mjs)" = '8013f14af4bec910b4bcec3e1ba28963c409ce0e'
          test "$(git hash-object scripts/test-return-attributes-20261029.mjs)" = '8d30746a43041c2aaab586b4d6955765c0c60edc'
          test "$(git hash-object .github/workflows/quality-check.yml)" = '26cda716bf0097b4ab7e4f50d589764f09604bca'
          test "$(git hash-object scripts/branch2-manual-release.mjs)" = '1e7f67dd0fb2e339ad1b7a85e803158b6e4e4ace'
          test "$(git hash-object wrangler.jsonc)" = '437f6fd1aa8ce59ea403e845380df2aef2786070'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/branch2-manual-release.mjs --check
      - name: Verify fast timesheet, roles and historical behavior
        run: |
          npm ci
          node scripts/test-team-schedule-supervisor-20261121.mjs
          node scripts/test-team-attendance-v1-20261110.mjs
          node scripts/test-team-timesheet-bulk-safe-20261110.mjs
          node scripts/test-team-timesheet-mobile-ux-20261110.mjs
          node scripts/test-return-attributes-20261029.mjs
      - name: Full release checks, isolated D1 SELECT-only, Worker-only publish, HTTP smoke
        run: node scripts/branch2-manual-release.mjs --publish --sha "$GITHUB_SHA" --confirm BRANCH2-ONLY
