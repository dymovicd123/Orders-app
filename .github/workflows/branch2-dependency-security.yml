name: Branch2 Dependency Security
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/branch2-dependency-security.yml'
permissions:
  contents: read
jobs:
  check:
    name: Clean dependency audit and actual application build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Check high severity vulnerabilities including developer dependencies
        run: npm audit --audit-level=high
      - name: Build all application and Worker code
        run: npm run build
