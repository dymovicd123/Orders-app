name: Guarded approved Main split KPI and settlements direct Worker release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-approved-split-kpi-direct-20261103.yml'
permissions:
  contents: read
concurrency:
  group: main-approved-split-kpi-direct-worker-only
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(main-split-kpi-direct):')
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Exact approved Main SHA, isolated production target and single-file release trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^)" = 983dbe6af3f2d8e253370b7a2ae6ce2aa090c6a1
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/main-approved-split-kpi-direct-20261103.yml'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const cfg=readFileSync('wrangler.jsonc','utf8')
          for(const expected of [
            '"name": "orders-app"',
            '"database_name": "orders_db_prod"',
            '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"',
          ]) assert(cfg.includes(expected),'Production target mismatch: '+expected)
          for(const forbidden of [
            'orders_db_branch2','orders-app-branch2',
            '0904a573-21ff-44d8-93b0-c9200f771702',
            '40065052-854e-44b8-bcd5-251bdd488301',
          ]) assert(!cfg.includes(forbidden),'Branch2 target must never deploy to main')
          const worker=readFileSync('worker/domains/returns-exchanges.ts','utf8')
          assert(worker.includes('The refund limit must be enforced atomically with Return creation.'))
          assert(worker.includes('splitRefundReversalStatements'))
          assert(worker.includes('exchangeSetPaymentIds'))
          const kpi=readFileSync('worker/domains/product-kpi.ts','utf8')
          assert(kpi.includes("countingRule:'ordered_net_current_v2'"))
          console.log('APPROVED_MAIN_WORKER_ONLY_RELEASE_SCOPE_AND_REFUND_GUARDS_PASS')
          NODE
      - run: npm ci
      - name: Main production release and money KPI acceptance (disposable only)
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/test-main-split-settlements-20261103.mjs
          node --experimental-strip-types scripts/test-main-kpi-unshipped-net-20261103.mjs
          node --experimental-strip-types scripts/test-finance-exchange-payment-lineage-20261021.mjs
          npm run release:check
          npm run build
          npx wrangler deploy --dry-run --outdir .approved-main-split-kpi-dry-run --config wrangler.jsonc
      - name: Read-only Production D1 schema preflight (NO D1 WRITES)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command="
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='financial_events') AS events,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='critical_operations') AS operations,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='critical_operation_entities') AS entity_map,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='product_kpis') AS kpis,
              (SELECT COUNT(*) FROM pragma_table_info('critical_operations') WHERE name='target_id') AS target_id,
              (SELECT COUNT(*) FROM pragma_table_info('critical_operation_entities') WHERE name='entity_key') AS entity_key,
              (SELECT COUNT(*) FROM pragma_table_info('financial_events') WHERE name='payment_method') AS event_method
          " --json | jq -e '.[0].results[0] | .events==1 and .operations==1 and .entity_map==1 and .kpis==1 and .target_id==1 and .entity_key==1 and .event_method==1'
      - name: Publish only production orders-app Worker and assets (NO D1 WRITES)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Confirm production HTTP auth boundaries and exact release
        shell: bash
        run: |
          set -euo pipefail
          host='https://orders-app.orders-clothes.workers.dev'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$host/api/auth/status")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$host/api/orders")" = 401
          echo 'MAIN_APPROVED_SPLIT_KPI_WORKER_ONLY_DIRECT_DEPLOY_PASS'
