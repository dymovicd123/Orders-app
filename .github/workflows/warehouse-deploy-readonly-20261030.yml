name: P0 Branch2 warehouse pre-barcode deployment readback
on:
  push:
    branches: [audit/branch2-warehouse-barcode-readiness-20261030]
    paths:
      - '.github/workflows/warehouse-deploy-readonly-20261030.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: GET-only Branch2 production version readback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/barcode-readiness-branch2-build-get-20261030.mjs
          node scripts/ops/barcode-readiness-branch2-build-get-20261030.mjs
