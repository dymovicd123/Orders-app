name: Main W19 Stock and Operations Only
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/features/sections/InventorySection.tsx'
      - 'src/features/inventory/views/InventoryUnifiedQuantityWorkspace.tsx'
      - 'src/features/inventory/views/renderInventoryOverviewPanel.tsx'
      - 'src/features/inventory/views/StockBrowseDetail.tsx'
      - 'src/features/inventory/stockBrowseLayout.ts'
      - 'src/features/inventory/stockOverviewSelectors.ts'
      - 'src/features/inventory/loadOperationStockSources.ts'
      - 'src/styles/w13-stock-catalog-browse.css'
      - 'src/styles/w14-simple-stock-controls.css'
      - 'src/styles/w19-stock-source-only.css'
      - 'scripts/test-w*-*.mjs'
      - '.github/workflows/main-w19-stock-operations-only.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-w19-stock-operations-only.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Catalog stock, safe movement, scope and full build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Protect orders, problem list and history
        run: node scripts/test-w19-main-selective-scope.mjs
      - name: Stock catalog, location totals and single clear
        run: |
          node --experimental-strip-types scripts/test-w13-stock-catalog-browse.mjs
          node --experimental-strip-types scripts/test-w14-simple-stock-controls.mjs
      - name: Optional movement notes and operations reliability
        run: |
          node --experimental-strip-types scripts/test-w17-optional-stock-notes-clear.mjs
          node --experimental-strip-types scripts/test-w8-warehouse-operation-integrity.mjs
          node --experimental-strip-types scripts/test-w11-manual-correction-runtime.mjs
          node scripts/test-step191d-transfer-runtime-safety.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
      - name: Complete app and Worker build
        run: npm run build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact release scope and production-only D1
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import {execFileSync} from 'node:child_process'
          if(process.env.GITHUB_REF_NAME!=='main')throw Error('Only main may deploy')
          const base='c34998de90a1112db7cb58cfb4babc41365db000'
          execFileSync('git',['merge-base','--is-ancestor',base,process.env.GITHUB_SHA])
          const changed=execFileSync('git',['diff','--name-only',base,process.env.GITHUB_SHA],{encoding:'utf8'}).trim().split('\n')
          const allowed=new Set([
            'src/App.tsx',
            'src/features/sections/InventorySection.tsx',
            'src/features/inventory/views/InventoryUnifiedQuantityWorkspace.tsx',
            'src/features/inventory/views/renderInventoryOverviewPanel.tsx',
            'src/features/inventory/views/StockBrowseDetail.tsx',
            'src/features/inventory/stockBrowseLayout.ts',
            'src/features/inventory/stockOverviewSelectors.ts',
            'src/features/inventory/loadOperationStockSources.ts',
            'src/styles/w13-stock-catalog-browse.css',
            'src/styles/w14-simple-stock-controls.css',
            'src/styles/w19-stock-source-only.css',
            'scripts/test-w13-stock-catalog-browse.mjs',
            'scripts/test-w14-simple-stock-controls.mjs',
            'scripts/test-w17-optional-stock-notes-clear.mjs',
            'scripts/test-w8-warehouse-operation-integrity.mjs',
            'scripts/test-w19-main-selective-scope.mjs',
            '.github/workflows/main-w19-stock-operations-only.yml',
          ])
          if(!changed.length || changed.some(p=>!allowed.has(p)))throw Error('Unreviewed main files: '+changed.join(','))
          const wrangler=fs.readFileSync('wrangler.jsonc','utf8')
          if(!wrangler.includes('"name": "orders-app"')
             ||!wrangler.includes('"database_name": "orders_db_prod"')
             ||!wrangler.includes('17e68a41-1d58-4a36-8a63-47c3e32443c4')
             ||wrangler.includes('orders_db_branch2'))throw Error('Not production D1 config')
          console.log('MAIN_W19_STOCK_OPERATIONS_ONLY_SCOPE_VERIFIED')
          NODE
      - run: npm ci
      - name: Recheck protected code, real SQL and build
        run: |
          node scripts/test-w19-main-selective-scope.mjs
          node --experimental-strip-types scripts/test-w13-stock-catalog-browse.mjs
          node --experimental-strip-types scripts/test-w14-simple-stock-controls.mjs
          node --experimental-strip-types scripts/test-w17-optional-stock-notes-clear.mjs
          node --experimental-strip-types scripts/test-w11-manual-correction-runtime.mjs
          npm run build
      - name: Confirm new overview and operation bits are compiled
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const js=fs.readdirSync('dist/client/assets').filter(x=>x.endsWith('.js'))
            .map(x=>fs.readFileSync('dist/client/assets/'+x,'utf8'))
          if(!js.some(s=>s.includes('stock-v14-master-controls')&&s.includes('Остатки какой точки?')))
            throw Error('New stock view not bundled')
          if(!js.some(s=>s.includes('Комментарий (необязательно)')))
            throw Error('Optional operation comments not bundled')
          console.log('MAIN_W19_COMPILED')
          NODE
      - name: Deploy main only without migrations
        run: npx wrangler deploy
      - name: Verify current main UI is live
        run: |
          node --input-type=module <<'NODE'
          const host='https://orders-app.orders-clothes.workers.dev'
          let ok=false
          for(let i=0;i<8;i++) {
            try {
              const index=await fetch(host+'/?w19='+Date.now(),{cache:'no-store'})
              if(!index.ok)throw Error('HTTP '+index.status)
              const html=await index.text()
              const entryPath=html.match(/src=["'](\/assets\/index-[^"']+\.js)["']/)
              if(!entryPath)throw Error('Index entry not found')
              const entry=await (await fetch(host+entryPath[1],{cache:'no-store'})).text()
              const chunk=entry.match(/InventorySection-[A-Za-z0-9_-]+\.js/)
              if(!chunk)throw Error('Warehouse module missing')
              const code=await (await fetch(host+'/assets/'+chunk[0],{cache:'no-store'})).text()
              if(!code.includes('stock-v14-master-controls')||!code.includes('Комментарий (необязательно)'))
                throw Error('Stale warehouse module')
              console.log('MAIN_W19_STOCK_AND_OPERATIONS_LIVE')
              ok=true; break
            } catch(error){console.warn(String(error));if(i<7)await new Promise(resolve=>setTimeout(resolve,3500))}
          }
          if(!ok)throw Error('Could not confirm production warehouse bundle')
          NODE
