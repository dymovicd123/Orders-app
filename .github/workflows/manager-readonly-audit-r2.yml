name: Manager read-only audit R2

on:
  push:
    branches: [safe/manager-readonly-audit-r2-20260902]
    paths:
      - scripts/.manager-readonly-audit-r2-trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current Production Workshop population — GET only
        env:
          APP_URL: https://orders-app.orders-clothes.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.APP_URL;
          const url = `${base}/api/workshop?view=active&period=month&urgentOnly=0&sort=oldest&limit=300&includeCounts=0`;
          const response = await fetch(url);
          const data = await response.json();
          if (!response.ok) throw new Error(`Workshop GET failed: ${response.status}`);
          const tasks = Array.isArray(data?.tasks) ? data.tasks : [];
          const norm = value => String(value ?? '').trim().toLowerCase();
          const sent = tasks.filter(t => norm(t.shippingStatus ?? t.shipping_status) === 'sent');
          const unsent = tasks.filter(t => norm(t.shippingStatus ?? t.shipping_status) !== 'sent');
          const exchange = tasks.filter(t => Number(t.exchangeId ?? t.exchange_id ?? 0) > 0);
          const sentExchange = sent.filter(t => Number(t.exchangeId ?? t.exchange_id ?? 0) > 0);
          const sentNoExchange = sent.filter(t => Number(t.exchangeId ?? t.exchange_id ?? 0) <= 0);
          const summary = {
            http: response.status,
            total: tasks.length,
            sent: sent.length,
            unsent: unsent.length,
            exchange: exchange.length,
            sentExchange: sentExchange.length,
            sentNoExchange: sentNoExchange.length,
            first12: tasks.slice(0, 12).map(t => ({
              taskId: Number(t.id || 0),
              orderId: Number(t.orderId ?? t.order_id ?? 0),
              externalOrderId: String(t.externalOrderId ?? t.external_order_id ?? ''),
              shippingStatus: String(t.shippingStatus ?? t.shipping_status ?? ''),
              exchangeId: Number(t.exchangeId ?? t.exchange_id ?? 0) || null,
              status: String(t.status || ''),
              orderDate: String(t.orderDate ?? t.order_date ?? ''),
              exchangeDate: String(t.exchangeDate ?? t.exchange_date ?? '')
            })),
            sentNoExchangeSample: sentNoExchange.slice(0, 12).map(t => ({
              taskId: Number(t.id || 0),
              orderId: Number(t.orderId ?? t.order_id ?? 0),
              externalOrderId: String(t.externalOrderId ?? t.external_order_id ?? ''),
              orderDate: String(t.orderDate ?? t.order_date ?? '')
            })),
            unsentSample: unsent.slice(0, 8).map(t => ({
              taskId: Number(t.id || 0),
              orderId: Number(t.orderId ?? t.order_id ?? 0),
              externalOrderId: String(t.externalOrderId ?? t.external_order_id ?? ''),
              shippingStatus: String(t.shippingStatus ?? t.shipping_status ?? ''),
              exchangeId: Number(t.exchangeId ?? t.exchange_id ?? 0) || null
            }))
          };
          console.log('CURRENT_WORKSHOP_STATE=' + JSON.stringify(summary, null, 2));
          NODE
