name: Client3 order/account clean slate READ ONLY preflight
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-order-account-reset-preflight-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Only third D1, never modify business data
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          ! grep -Eq 'orders_db_prod|orders_db_branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci --ignore-scripts
      - name: D1 Time Travel restore bookmark
        run: |
          npx wrangler d1 time-travel info orders_db_client3_old_client --json --config wrangler.jsonc
      - name: Tables and referential relationships (NO DATA)
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name" \
            | jq -cr '(if type=="array" then .[0].results else .results end) | map(.name)' | tee /tmp/client3-table-names.json 
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT m.name AS child,f.\"table\" AS parent,f.\"from\" AS child_column,f.\"to\" AS parent_column,f.on_delete
              FROM sqlite_master m JOIN pragma_foreign_key_list(m.name) f
              WHERE m.type='table' AND m.name NOT LIKE 'sqlite_%'
                AND (f.\"table\"='orders' OR f.\"table\"='order_items' OR f.\"table\"='app_users'
                  OR f.\"table\"='returns' OR f.\"table\"='exchanges'
                  OR f.\"table\" LIKE 'watch_%' OR f.\"table\"='inventory_reservations')
              ORDER BY parent,child" \
            | jq -cr '(if type=="array" then .[0].results else .results end)' | tee /tmp/client3-relations.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT name,tbl_name,substr(sql,1,500) AS definition FROM sqlite_master
              WHERE type='trigger' AND (tbl_name IN ('orders','order_items','app_users','financial_events','inventory_reservations','inventory_stock'))
              ORDER BY tbl_name,name" \
            | jq -cr '(if type=="array" then .[0].results else .results end)' | tee /tmp/client3-triggers.json
      - name: Aggregate data counts only, no personal details
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders,
              (SELECT COUNT(*) FROM order_items) order_items,
              (SELECT COUNT(*) FROM watch_order_details) watch_details,
              (SELECT COUNT(*) FROM returns) returns_count,
              (SELECT COUNT(*) FROM exchanges) exchanges,
              (SELECT COUNT(*) FROM payments) payments,
              (SELECT COUNT(*) FROM financial_events) finance_events,
              (SELECT COUNT(*) FROM inventory_reservations) reservations,
              (SELECT COUNT(*) FROM inventory_movements) movements,
              (SELECT COUNT(*) FROM app_users WHERE role='manager') manager_accounts,
              (SELECT COUNT(*) FROM app_users WHERE role='admin') admin_accounts,
              (SELECT COUNT(*) FROM managers) staff,
              (SELECT COUNT(*) FROM watch_variants) watch_variants,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_inventory,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved_inventory" \
            | jq -cr '(if type=="array" then .[0].results else .results end)[0]' | tee /tmp/client3-data-counts.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" |
            jq -e '(if type=="array" then .[0].results else .results end) | length==0'
          echo CLIENT3_ORDER_ACCOUNT_PRECHECK_READ_ONLY_DONE
      - name: Post schema-only reset readiness summary to issue
        if: success()
        run: |
          set -euo pipefail
          {
            echo 'Client3 read-only cleanup preflight PASS: no data changed.'
            echo 'Tables:'
            cat /tmp/client3-table-names.json
            echo 'Foreign keys for order/account graph:'
            cat /tmp/client3-relations.json
            echo 'Relevant triggers:'
            cat /tmp/client3-triggers.json
            echo 'Counts only:'
            cat /tmp/client3-data-counts.json
            echo "Run: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID"
          } | head -c 5500 >/tmp/client3-clean-summary.txt
          gh issue comment 774 --repo dymovicd123/Orders-app --body-file /tmp/client3-clean-summary.txt
      - name: Record preflight failure
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 read-only cleanup preflight FAILED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. No data changed."
