name: P0 Branch2 pinned hotfix preview read-only smoke
on:
  push:
    branches: [ops/p0-branch2-controlled-activation-20261030]
    paths:
      - '.github/workflows/p0-branch2-hotfix-preview-smoke-once-20261030.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: GET-only pinned hotfix preview UI, chunks and anonymous order auth
        run: |
          node --check scripts/ops/p0-branch2-hotfix-preview-smoke-20261030.mjs
          node scripts/ops/p0-branch2-hotfix-preview-smoke-20261030.mjs
