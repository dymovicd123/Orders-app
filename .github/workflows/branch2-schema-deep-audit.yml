name: Branch2 schema deep audit

on:
  push:
    branches:
      - audit/branch2-schema-deep-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/branch2-schema-deep-20260916

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Resolve exact D1 identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          npx wrangler d1 list --json > audit/d1-list.json
          node <<'NODE' | tee audit/d1-identities.txt
          const fs = require('fs')
          const raw = JSON.parse(fs.readFileSync('audit/d1-list.json','utf8'))
          const rows = Array.isArray(raw) ? raw : (raw.result || [])
          const expected = {
            orders_db_branch2: '40065052-854e-44b8-bcd5-251bdd488301',
            orders_db_prod: '17e68a41-1d58-4a36-8a63-47c3e32443c4',
          }
          for (const [name, id] of Object.entries(expected)) {
            const hit = rows.find(r => r.name === name)
            if (!hit) throw new Error(`Missing D1 ${name}`)
            const actual = hit.uuid || hit.id || hit.database_id || ''
            if (actual !== id) throw new Error(`${name} identity drifted: ${actual}`)
            console.log(`${name}: ${actual}`)
          }
          NODE

      - name: Capture full schema and migration journals read-only
        shell: bash
        run: |
          set -euo pipefail
          for db in orders_db_branch2 orders_db_prod; do
            npx wrangler d1 execute "$db" --remote --json --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE sql IS NOT NULL ORDER BY type,name;" > "audit/${db}-sqlite-master.json"
            npx wrangler d1 execute "$db" --remote --json --command "SELECT id,name,applied_at FROM d1_migrations ORDER BY id;" > "audit/${db}-migrations.json" || true
            for table in catalog_products catalog_variants catalog_input_aliases catalog_value_aliases inventory_stock inventory_reservations inventory_movements inventory_lifecycle_events inventory_transfer_items inventory_stock_checks inventory_stocktake_items orders order_items workshop_tasks returns return_items exchanges exchange_items payments cash_register_entries critical_operation_requests; do
              npx wrangler d1 execute "$db" --remote --json --command "PRAGMA table_info(${table});" > "audit/${db}-${table}-columns.json" || true
            done
          done

      - name: Record Branch2 D1 recovery bookmark
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info orders_db_branch2 | tee audit/orders_db_branch2-time-travel-before-sync.txt

      - name: Compare live Branch2 and Production schemas
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > audit/schema-name-diff.txt
          const fs = require('fs')
          function rows(path) {
            const raw = JSON.parse(fs.readFileSync(path,'utf8'))
            const outer = Array.isArray(raw) ? raw : [raw]
            const result = []
            for (const chunk of outer) for (const row of (chunk.results || chunk.result || [])) result.push(row)
            return result
          }
          const b = rows('audit/orders_db_branch2-sqlite-master.json')
          const p = rows('audit/orders_db_prod-sqlite-master.json')
          const key = r => `${r.type}:${r.name}`
          const bm = new Map(b.map(r => [key(r), r]))
          const pm = new Map(p.map(r => [key(r), r]))
          console.log('ONLY_IN_PROD')
          for (const k of [...pm.keys()].filter(k => !bm.has(k)).sort()) console.log(k)
          console.log('\nONLY_IN_BRANCH2')
          for (const k of [...bm.keys()].filter(k => !pm.has(k)).sort()) console.log(k)
          console.log('\nSQL_DIFFERENCES_COMMON_OBJECTS')
          const norm = s => String(s || '').replace(/\s+/g,' ').trim().toLowerCase()
          for (const k of [...pm.keys()].filter(k => bm.has(k)).sort()) {
            if (norm(pm.get(k).sql) !== norm(bm.get(k).sql)) console.log(k)
          }
          NODE
          cat audit/schema-name-diff.txt

      - name: Run 0068 SELECT-only Branch2 preflight
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --file=scripts/branch2-0068-preflight.sql | tee audit/branch2-0068-preflight.txt
          if grep -E 'rows_written[^0-9]*[1-9]' audit/branch2-0068-preflight.txt; then
            echo 'Unexpected D1 write reported during SELECT-only preflight' >&2
            exit 4
          fi

      - name: Capture focused missing-effect checks
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --command "SELECT name,type FROM sqlite_master WHERE name IN ('idx_catalog_variants_product_active_desc_sort','idx_payments_payment_date_order_amount','idx_orders_current_debt_partial','idx_order_items_pending_writeoff_status_order','idx_order_items_workshop_order_quantity','idx_o1_exchanges_payment_finance','idx_o1_stock_checks_normalized_time','idx_o1_stock_checks_exact_stocktake','idx_catalog_products_gender_scope','idx_return_items_physical_receipt','idx_exchange_items_physical_receipt','catalog_gender_scope_repairs','catalog_gender_variant_repairs','catalog_gender_stock_baseline') ORDER BY name;" | tee audit/branch2-focused-0065-0069.txt

      - name: Upload read-only audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch2-schema-deep-audit
          path: audit/
          retention-days: 14
