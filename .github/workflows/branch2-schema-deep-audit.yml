name: Branch2 schema deep audit

on:
  push:
    branches:
      - audit/branch2-schema-deep-20260916

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Resolve exact D1 identities
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > d1-list.json
          node <<'NODE'
          const fs = require('fs')
          const raw = JSON.parse(fs.readFileSync('d1-list.json','utf8'))
          const rows = Array.isArray(raw) ? raw : (raw.result || [])
          for (const name of ['orders_db_branch2','orders_db_prod']) {
            const hit = rows.find(r => r.name === name)
            if (!hit) throw new Error(`Missing D1 ${name}`)
            console.log(`${name}: ${hit.uuid || hit.id || hit.database_id || ''}`)
          }
          NODE

      - name: Capture full schema and migration journals read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for db in orders_db_branch2 orders_db_prod; do
            npx wrangler d1 execute "$db" --remote --json --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE sql IS NOT NULL ORDER BY type,name;" > "audit/${db}-sqlite-master.json"
            npx wrangler d1 execute "$db" --remote --json --command "SELECT id,name,applied_at FROM d1_migrations ORDER BY id;" > "audit/${db}-migrations.json" || true
            for table in catalog_products catalog_variants catalog_input_aliases catalog_value_aliases inventory_stock inventory_reservations inventory_movements inventory_lifecycle_events inventory_transfer_items inventory_stock_checks inventory_stocktake_items orders order_items workshop_tasks returns return_items exchanges exchange_items payments cash_register_entries critical_operation_requests; do
              safe="${table//[^a-zA-Z0-9_]/_}"
              npx wrangler d1 execute "$db" --remote --json --command "PRAGMA table_info(${table});" > "audit/${db}-${safe}-columns.json" || true
            done
          done

      - name: Export Branch2 backup read-only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 export orders_db_branch2 --remote --output audit/orders_db_branch2-before-sync.sql
          sha256sum audit/orders_db_branch2-before-sync.sql | tee audit/orders_db_branch2-before-sync.sha256

      - name: Compare schema names
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' > audit/schema-name-diff.txt
          const fs = require('fs')
          function rows(path) {
            const raw = JSON.parse(fs.readFileSync(path,'utf8'))
            const outer = Array.isArray(raw) ? raw : [raw]
            const result = []
            for (const chunk of outer) for (const row of (chunk.results || chunk.result || [])) result.push(row)
            return result
          }
          const b = rows('audit/orders_db_branch2-sqlite-master.json')
          const p = rows('audit/orders_db_prod-sqlite-master.json')
          const key = r => `${r.type}:${r.name}`
          const bm = new Map(b.map(r => [key(r), r]))
          const pm = new Map(p.map(r => [key(r), r]))
          console.log('ONLY_IN_PROD')
          for (const k of [...pm.keys()].filter(k => !bm.has(k)).sort()) console.log(k)
          console.log('\nONLY_IN_BRANCH2')
          for (const k of [...bm.keys()].filter(k => !pm.has(k)).sort()) console.log(k)
          console.log('\nSQL_DIFFERENCES_COMMON_OBJECTS')
          const norm = s => String(s || '').replace(/\s+/g,' ').trim().toLowerCase()
          for (const k of [...pm.keys()].filter(k => bm.has(k)).sort()) {
            if (norm(pm.get(k).sql) !== norm(bm.get(k).sql)) console.log(k)
          }
          NODE
          cat audit/schema-name-diff.txt

      - name: Build disposable local Branch2 clone and test migrations 0065-0069
        shell: bash
        run: |
          set -euo pipefail
          sqlite3 audit/branch2-clone.sqlite < audit/orders_db_branch2-before-sync.sql
          cp audit/branch2-clone.sqlite audit/branch2-before-0065.sqlite
          : > audit/local-migration-results.txt
          for f in migrations/0065_v72_d1_read_budget_r5_workshop_variant_order_index.sql migrations/0066_v72_d1_read_budget_r5_finance_summary_indexes.sql migrations/0067_v72_o1_read_budget_indexes.sql migrations/0068_v72_catalog_product_gender_scope.sql migrations/0069_v72_return_exchange_physical_receipt.sql; do
            echo "=== $f ===" | tee -a audit/local-migration-results.txt
            cp audit/branch2-clone.sqlite audit/before-one.sqlite
            if sqlite3 audit/branch2-clone.sqlite < "$f" >> audit/local-migration-results.txt 2>&1; then
              echo PASS | tee -a audit/local-migration-results.txt
            else
              echo FAIL_ROLLED_BACK_TO_PREVIOUS_FILE_STATE | tee -a audit/local-migration-results.txt
              mv audit/before-one.sqlite audit/branch2-clone.sqlite
            fi
          done
          sqlite3 audit/branch2-clone.sqlite ".schema" > audit/local-after-0065-0069.schema.txt
          sqlite3 -header -csv audit/branch2-clone.sqlite "SELECT gender_scope, COUNT(*) AS products FROM catalog_products GROUP BY gender_scope ORDER BY gender_scope;" > audit/local-after-0068-product-scopes.csv || true
          sqlite3 -header -csv audit/branch2-clone.sqlite "SELECT COUNT(*) AS active_blank_gender_variants FROM catalog_variants WHERE is_active=1 AND TRIM(COALESCE(gender,''))='';" > audit/local-after-0068-blank-variants.csv || true
          cat audit/local-migration-results.txt

      - name: Upload read-only audit and backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: branch2-schema-deep-audit
          path: audit/
          retention-days: 14
