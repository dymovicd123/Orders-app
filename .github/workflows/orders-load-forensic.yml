name: Orders load forensic

on:
  push:
    branches:
      - safe/orders-load-forensic-20260903

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reproduce live Orders load — read only
        env:
          TARGET: https://orders-app.orders-clothes.workers.dev
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const context = await browser.newContext({ viewport: { width: 1600, height: 1000 } })
            const page = await context.newPage()
            const seen = []
            const pageErrors = []
            const consoleErrors = []

            await page.route('**/api/**', async route => {
              const method = route.request().method().toUpperCase()
              if (!['GET','HEAD'].includes(method)) {
                console.log('BLOCKED_MUTATION', method, route.request().url())
                return route.abort('aborted')
              }
              return route.continue()
            })

            page.on('pageerror', e => pageErrors.push(String(e)))
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()) })
            page.on('response', async r => {
              const u = r.url()
              if (!u.includes('/api/')) return
              const entry = { status:r.status(), method:r.request().method(), url:u }
              if (u.includes('/api/orders') || r.status() >= 400) {
                try { entry.body = (await r.text()).slice(0, 5000) } catch {}
              }
              seen.push(entry)
              console.log('API', JSON.stringify(entry))
            })

            const started = Date.now()
            await page.goto(`${process.env.TARGET}/#orders`, { waitUntil:'domcontentloaded', timeout:90000 })
            await page.waitForTimeout(15000)
            console.log('PAGE_LOAD_MS', Date.now()-started)
            console.log('URL', page.url())
            console.log('BODY_TEXT', (await page.locator('body').innerText()).slice(0,12000))
            console.log('PAGE_ERRORS', JSON.stringify(pageErrors))
            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors))

            const status = await page.evaluate(async () => {
              const urls = [
                '/api/health',
                '/api/admin-mode/status',
                '/api/orders?limit=100&archiveMode=active'
              ]
              const out = []
              for (const url of urls) {
                const t = performance.now()
                try {
                  const r = await fetch(url, { credentials:'include' })
                  out.push({ url, status:r.status, ms:Math.round(performance.now()-t), body:(await r.text()).slice(0,5000) })
                } catch (e) {
                  out.push({ url, error:String(e), ms:Math.round(performance.now()-t) })
                }
              }
              return out
            })
            console.log('DIRECT_FETCH', JSON.stringify(status))
            console.log('SEEN_COUNT', seen.length)
            await browser.close()
          })().catch(e => { console.error(e); process.exit(1) })
          NODE
