name: Branch2 Manager Three Workspaces
on:
  push:
    branches:
      - fix/branch2-manager-three-workspaces-20261022
    paths:
      - '.github/workflows/branch2-manager-three-workspaces-20261022.yml'
      - 'src/App.tsx'
      - 'src/app/managerWorkspaceAccess.ts'
      - 'scripts/branch2-manager-three-workspaces-preserved-gate-20261022.mjs'
  pull_request:
    branches:
      - branch2
    paths:
      - 'src/App.tsx'
      - 'src/app/managerWorkspaceAccess.ts'
      - 'scripts/test-manager-three-workspaces-20261022.mjs'
      - 'scripts/branch2-manager-three-workspaces-preserved-gate-20261022.mjs'
      - 'scripts/branch2-unified-kaspi-preserved-gate.mjs'
      - '.github/workflows/branch2-manager-three-workspaces-20261022.yml'
permissions:
  contents: read
jobs:
  manager-three-workspaces:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify Branch2 binding and no Production D1
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -Fq 'orders_db_prod' wrangler.jsonc
          ! grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
      - run: npm ci
      - name: Three-role-navigation, frozen full historic release and current build
        run: npm run release:check
