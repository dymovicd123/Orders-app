name: Client3 workspace sidebar and order screen acceptance (NO DEPLOY)
on:
  push:
    branches: [client3/workspace-redesign-20261102]
    paths:
      - '.github/workflows/client3-workspace-acceptance-20261102.yml'
permissions:
  contents: read
jobs:
  workspace-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Ensure exact isolated tenant source and D1 config
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = 'orders-app-client3-old-client'
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = '0717f239-6d81-4837-8586-777d94e22c53'
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = '1'
      - run: npm ci
      - name: Main-style distinct workspace shell, grouped navigation and mobile layout
        run: node scripts/client3/test-watch-workspace-layout-20261102.mjs
      - name: Catalog and warehouse underlying business rules
        run: node --experimental-strip-types scripts/client3/test-watch-catalog-20261102.mjs
      - name: Auth gating and Client3 API isolation (SSR)
        run: node scripts/client3/test-watch-shell-20261102.mjs
      - name: Real full-schema order and exchange regression
        run: |
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
      - name: Full TypeScript, Vite and styles build
        run: npm run build
