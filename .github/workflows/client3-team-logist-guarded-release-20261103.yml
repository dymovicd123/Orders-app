name: Client3 Team roster and two-brand Logist isolated release
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-team-logist-guarded-release-20261103.yml']

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Check accepted Client3-only code and D1 identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(git rev-parse HEAD^)" = b94c755175c6b7e6bbf88265ed0e00538faf327d
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/client3-team-logist-guarded-release-20261103.yml'
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41623897335 --jq .conclusion)" = success
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41623897335 --jq .head_sha)" = 811aa214e379648af57377636df5c7e05e349db9
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -q 'const roles=\[' worker/domains/client3-watch-team-main.ts
          grep -q 'Логист' worker/domains/client3-watch-team-main.ts
          grep -q 'attendance_days' scripts/client3/test-watch-shared-cash-team-20261103.mjs
      - run: npm ci
      - name: Test team, user accounts, two-brand logistics, cash and privacy
        run: node --experimental-strip-types scripts/client3/test-watch-shared-cash-team-20261103.mjs
      - name: Full watch order/stock/financial regressions
        run: node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
      - name: TypeScript and Client3 production bundle
        run: npm run build
      - name: Check real Client3 staff schema and take safe read-only data snapshot
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA table_info(managers)" > /tmp/client3-staff-schema.json
          jq -e '
            (if type=="array" then .[0].results elif type=="object" then .results else [] end) as $columns
            | ($columns // [] | map(.name)) as $existing
            | ["id","name","is_active","role","phone","comment","birth_date","color_key","hired_at","dismissed_at","created_at"] as $needed
            | ($needed - $existing) as $missing
            | if ($missing|length)==0 then "CLIENT3_STAFF_SCHEMA_OK"
              else error("Missing Client3 managers columns: "+($missing|join(", "))) end
          ' /tmp/client3-staff-schema.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT COUNT(*) AS n FROM (
              SELECT m.id FROM managers m
              LEFT JOIN (SELECT manager_id, MIN(order_date) AS first_order_at,
                COUNT(*) AS reference_count FROM orders WHERE manager_id IS NOT NULL GROUP BY manager_id) orders
              ON orders.manager_id=m.id
            )" | jq -ce '(if type=="array" then .[0].results[0] else .results[0] end) | select(.n>=0)' > /tmp/client3-roster.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM managers) managers_count,
              (SELECT COUNT(*) FROM app_users) users_count,
              (SELECT COUNT(*) FROM watch_manager_brands) brands_count,
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM watch_products) watch_products_count,
              (SELECT COUNT(*) FROM watch_variants) watch_variants_count,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_quantity,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved_quantity,
              (SELECT COUNT(*) FROM financial_events) financial_events_count,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries_count" \
              | jq -ce '(if type=="array" then .[0].results[0] else .results[0] end) | select(.managers_count>=0)' > /tmp/client3-team-before.json
          jq -e --slurpfile roster /tmp/client3-roster.json '.managers_count == $roster[0].n' /tmp/client3-team-before.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '(if type=="array" then .[0].results else .results end) | length==0'
      - name: Deploy ONLY existing Client3 watches Worker (no migrations)
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Smoke protected Team and both brands, verify DB unchanged
        run: |
          set -euo pipefail
          base='https://orders-app-client3-old-client.orders-clothes.workers.dev'
          test "$(curl -sSL -o /tmp/client3-html -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-html
          for path in \
            '/api/client3/watches/team' \
            '/api/client3/watches/brands' \
            '/api/client3/watches/logistics?status=all' \
            '/api/auth/users'; do
            code="$(curl -sS -o /tmp/client3-protected -w '%{http_code}' --max-time 30 "$base$path")"
            test "$code" = 401 -o "$code" = 403
          done
          code="$(curl -sS -o /tmp/client3-protected-post -w '%{http_code}' --max-time 30 -X POST \
            -H 'Content-Type: application/json' \
            --data '{"login":"unauthorized","password":"NoAccess123!","role":"manager","managerId":1}' \
            "$base/api/auth/users")"
          test "$code" = 401 -o "$code" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM managers) managers_count,
              (SELECT COUNT(*) FROM app_users) users_count,
              (SELECT COUNT(*) FROM watch_manager_brands) brands_count,
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM watch_products) watch_products_count,
              (SELECT COUNT(*) FROM watch_variants) watch_variants_count,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_quantity,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserved_quantity,
              (SELECT COUNT(*) FROM financial_events) financial_events_count,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries_count" \
              | jq -ce '(if type=="array" then .[0].results[0] else .results[0] end)' > /tmp/client3-team-after.json
          diff -u /tmp/client3-team-before.json /tmp/client3-team-after.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '(if type=="array" then .[0].results else .results end) | length==0'
          echo CLIENT3_TEAM_LOGIST_SAFE_RELEASE_SUCCESS
      - name: Post verified Client3-only release status
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 Team manager accounts and cross-brand Logist DEPLOYED AND VERIFIED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. PR #779 merged. Full SQLite team/accounts, brands/access, cash/order/stock regressions, TypeScript build, real D1 roster schema and counts, unauthorized auth API, pre/post financial/stock/team DB comparison, FK all passed. Only Client3 Worker deployed without migrations. Manual admin browser acceptance remains."
      - name: Record failures without false success
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 Team Logist release FAILED or BLOCKED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Check step before claiming production changes. Main/Branch2 not targeted."
