name: Client3 Main handover + localized revision guarded release
on:
  push:
    branches: [client3/shared-cash-main-team-20261103]
    paths: ['.github/workflows/client3-revision-labels-handover-release-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Guard source, prior successful QA and isolated Client3 Worker/D1
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-cash-main-team-20261103
          test "$(git rev-parse HEAD^)" = d8b151446548d405b0229eb2d3e40af386a5d47e
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/client3-revision-labels-handover-release-20261103.yml'
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41636153363 --jq .conclusion)" = success
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41636153363 --jq .head_sha)" = 2fd3b3d9d6287bd2d387b187a722e20f61322390
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          grep -q 'watchReferenceLabel' src/features/client3/WatchPersistentRevision.tsx
          grep -q 'reconcileIssuedBeforeCheckpoint' worker/domains/client3-watch-handover.ts
      - run: npm ci
      - name: Actual Main issuance checkpoint integration on Oct 1/2 after stocktake
        run: node --experimental-strip-types scripts/client3/test-watch-handover-after-revision-20261103.mjs
      - name: Full client3 watch order/stock/finance/return/resolver regression
        run: node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
      - name: Full/selective zero-stock revision and reloadable arrivals
        run: |
          node --experimental-strip-types scripts/client3/test-zero-stock-revision-20261103.mjs
          node --experimental-strip-types scripts/client3/test-watch-arrival-draft-20261103.mjs
      - name: Manager accounts and unified cash
        run: node --experimental-strip-types scripts/client3/test-watch-shared-cash-team-20261103.mjs
      - name: TypeScript + production UI and Worker bundle
        run: npm run build
      - name: Verify real Client3-only D1 schema needed by Main handover
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT name FROM sqlite_master WHERE type='table'
              AND name IN ('orders','order_items','inventory_reservations','inventory_stock',
                'inventory_stock_checks','inventory_stocktake_sessions','inventory_handover_reviews',
                'order_dispatches','order_dispatch_items','watch_order_details','watch_order_item_details',
                'watch_variants','watch_products','workshop_tasks','catalog_variants','catalog_products','customers')
              ORDER BY name" > /tmp/client3-main-handover-tables.json
          jq -e '
            (if type=="array" then .[0].results else .results end | map(.name)) as $existing
            | ["orders","order_items","inventory_reservations","inventory_stock",
               "inventory_stock_checks","inventory_stocktake_sessions","inventory_handover_reviews",
               "order_dispatches","order_dispatch_items","watch_order_details","watch_order_item_details",
               "watch_variants","watch_products","workshop_tasks","catalog_variants","catalog_products","customers"] as $required
            | ($required - $existing) | length==0' /tmp/client3-main-handover-tables.json
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA table_info(inventory_handover_reviews)" \
            | jq -e '(if type=="array" then .[0].results else .results end)
              | map(.name) as $keys
              | (["order_item_id","reservation_id","checkpoint_id","checkpoint_at","decision"]-$keys) | length==0'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" \
            | jq -e '(if type=="array" then .[0].results else .results end) | length==0'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM inventory_reservations) reservations,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical,
              (SELECT COUNT(*) FROM inventory_stocktake_sessions WHERE status='active') active_checks,
              (SELECT COUNT(*) FROM watch_variants) watch_variants,
              (SELECT COUNT(*) FROM watch_shared_cash_entries) cash_entries" \
            | jq -ce '(if type=="array" then .[0].results[0] else .results[0] end)' > /tmp/client3-before.json
          cat /tmp/client3-before.json
      - name: Deploy ONLY existing Client3 Worker (NO MIGRATIONS OR DATA WRITES)
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Live auth boundaries, no business writes and FK integrity
        run: |
          set -euo pipefail
          base='https://orders-app-client3-old-client.orders-clothes.workers.dev'
          test "$(curl -sSL -o /tmp/html -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/html
          for endpoint in \
            '/api/client3/watches/orders/1/stock-handover?brand=TAUWACH' \
            '/api/client3/watches/orders?brand=TAUWACH'; do
            code="$(curl -sS -o /tmp/watch-read -w '%{http_code}' --max-time 30 "$base$endpoint")"
            test "$code" = 401 -o "$code" = 403
          done
          code="$(curl -sS -o /tmp/watch-post -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"brand":"TAUWACH","action":"issued_before_checkpoint","orderItemId":1,"checkpointId":1,"checkpointAt":"2026-11-03T01:00:00Z"}' \
            "$base/api/client3/watches/orders/1/stock-handover")"
          test "$code" = 401 -o "$code" = 403
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" \
            | jq -e '(if type=="array" then .[0].results else .results end) | length==0'
          echo CLIENT3_HANDOVER_AND_TRANSLATIONS_RELEASE_SUCCESS
      - name: Record successful isolated production release
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 Russian watch labels + Main Oct1/Oct2 post-stocktake issuance clarification DEPLOYED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. PR #783; integration tests for both decisions, stale checkpoint, brand isolation, no double stock, full SQLite/TS/Vite, real D1 schema/FK and unauthenticated API protection passed. Worker-only deployment, no migrations or data modifications by deploy. Main/Branch2 not targeted. Authenticated UI acceptance pending."
      - name: Record blocked run without claiming deploy
        if: failure()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 handover/labels deployment BLOCKED or FAILED: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Check failing step before asserting production ready. Main/Branch2 not targeted."
