name: Temporary Branch2 retired-demand audit

on:
  push:
    branches:
      - w-catalog-retired-recovery-branch2-20260930
    paths:
      - '.github/workflows/catalog-retired-recovery-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Branch2 identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read-only retired demand and return audit
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "
          SELECT
            COUNT(*) AS open_catalog_retired_items,
            COUNT(DISTINCT oi.order_id) AS affected_orders
          FROM order_items oi
          JOIN orders o ON o.id=oi.order_id
          WHERE COALESCE(oi.stock_writeoff_status,'')='catalog_retired'
            AND COALESCE(o.order_status,'active')='active'
            AND COALESCE(o.archived_at,'')=''
            AND COALESCE(o.shipping_status,'not_sent')<>'sent'
            AND COALESCE(oi.quantity,0)>0;

          SELECT
            COUNT(*) AS pending_inbound_with_inactive_link,
            COUNT(DISTINCT e.order_id) AS affected_return_orders
          FROM inventory_lifecycle_events e
          LEFT JOIN order_items oi ON oi.id=e.order_item_id AND oi.order_id=e.order_id
          LEFT JOIN catalog_variants v ON v.id=COALESCE(oi.variant_id,e.variant_id)
          WHERE e.status='pending'
            AND e.direction='in'
            AND COALESCE(oi.variant_id,e.variant_id) IS NOT NULL
            AND COALESCE(v.is_active,0)=0;

          SELECT
            COUNT(*) AS pending_inbound_with_retirement_record
          FROM inventory_lifecycle_events e
          LEFT JOIN order_items oi ON oi.id=e.order_item_id AND oi.order_id=e.order_id
          WHERE e.status='pending' AND e.direction='in'
            AND EXISTS (
              SELECT 1
              FROM catalog_retirement_variants rv
              JOIN catalog_retirement_operations op ON op.id=rv.retirement_id AND op.status='completed'
              WHERE rv.variant_id=COALESCE(oi.variant_id,e.variant_id)
            );
          " --json
