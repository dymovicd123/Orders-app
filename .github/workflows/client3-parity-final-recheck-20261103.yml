name: Client3 complete batch final recheck (no deployment)
on:
  push:
    branches: [client3/main-parity-hardening-20261103]
    paths: ['.github/workflows/client3-parity-final-recheck-20261103.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci
      - name: Verify updated Main parity and schema-based tests
        run: |
          set -uo pipefail
          failed=0
          for f in \
            scripts/client3/test-watch-main-step1-20261102.mjs \
            scripts/client3/test-watch-orders-read-20261102.mjs \
            scripts/client3/test-watch-provision-20261102.mjs \
            scripts/client3/test-watch-shared-references-20261102.mjs \
            scripts/client3/test-watch-shell-20261102.mjs \
            scripts/client3/test-watch-warehouse-order-parity-20261102.mjs \
            scripts/client3/test-watch-workspace-layout-20261102.mjs; do
            echo "::group::$f"
            node --experimental-strip-types "$f" || { echo "::error::FAILED $f"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci
      - name: Test per-item engraving, dispatch, returns, finance and team
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-logistics-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-shared-cash-team-20261103.mjs
          node --experimental-strip-types scripts/client3/test-watch-handover-after-revision-20261103.mjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci
      - run: npm run build
