name: 'Independent production read-only verification of 1533 to 1281 merge'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-ethno-1533-to-1281-postmerge-20261016.mjs'
      - '.github/workflows/readonly-ethno-1533-to-1281-postmerge-20261016.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin production D1 and enforce read-only PR event
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$GITHUB_BASE_REF" == 'main' ]]
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]
          node --check scripts/ops/readonly-ethno-1533-to-1281-postmerge-20261016.mjs
          cat > "$RUNNER_TEMP/readonly-ethno-1533-1281-prod.jsonc" <<'CFG'
          {
            "name": "orders-app-ethno-1533-to-1281-readonly",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/readonly-ethno-1533-1281-prod.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Verify exact merge receipt, atomic validations, stock, revisions and untouched size52
        run: node scripts/ops/readonly-ethno-1533-to-1281-postmerge-20261016.mjs
