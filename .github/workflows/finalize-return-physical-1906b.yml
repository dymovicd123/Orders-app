name: Finalize return physical 1906B

on:
  push:
    branches:
      - returns-physical-intake-r1
    paths:
      - .github/workflows/finalize-return-physical-1906b.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: returns-physical-intake-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate exact manifest and 1906B layer
        run: node .github/scripts/finalize-return-physical-1906b.mjs
      - name: Validate focused, 1906A and 1906B
        run: |
          node scripts/test-return-exchange-physical-receipt-r1.mjs
          node scripts/test-step1906a-worker-modularization.mjs
          node scripts/test-step1906b-frontend-modularization.mjs
      - name: Commit permanent frontend registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/finalize-return-physical-1906b.mjs .github/workflows/finalize-return-physical-1906b.yml
          git add scripts/returns-physical-intake-r1-frontend-manifest.json scripts/test-step1906b-frontend-modularization.mjs
          git commit -m "Register physical intake frontend structural delta"
          git push origin HEAD:returns-physical-intake-r1
