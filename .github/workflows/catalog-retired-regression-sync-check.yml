name: Catalog retired regression sync check

on:
  push:
    branches:
      - w-catalog-retired-regression-sync-branch2-20260930

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run full release check
        run: npm run release:check
      - name: Build application
        run: npm run build
