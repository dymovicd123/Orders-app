name: Branch2 post-arrival unit labels regression
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'src/features/inventory/inventoryMovementActions.ts'
      - 'src/features/inventory/views/renderInventoryMovementPanel.tsx'
      - 'src/features/sections/InventorySection.tsx'
      - 'src/styles/193-unified-inventory-operations.css'
      - 'scripts/test-post-arrival-unit-labels-20261117.mjs'
      - '.github/workflows/ci-branch2-post-arrival-unit-labels-20261117.yml'
permissions:
  contents: read
jobs:
  post-arrival-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Post-commit arrival barcode readiness and existing arrival reliability
        run: |
          node scripts/test-post-arrival-unit-labels-20261117.mjs
          node scripts/test-arrival-save-reliability.mjs
          node scripts/test-arrival-materialization-reliability.mjs
          node scripts/test-arrival-canonical-barcode-sku-20261030.mjs
          node scripts/test-barcode-unit-label-preparation-20261116.mjs
          node scripts/test-warehouse-return-exchange-receiving-20261117.mjs
      - name: TypeScript and production build
        run: npm run build
