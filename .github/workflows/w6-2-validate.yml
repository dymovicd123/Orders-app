name: W6.2 Catalog validation

on:
  push:
    branches:
      - w6-2-catalog-master-detail

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact W6.2 preservation delta
        run: |
          node scripts/apply-w6-2-preservation-delta.mjs
          if ! git diff --quiet -- scripts/test-step1906b-frontend-modularization.mjs scripts/w6-2-catalog-master-detail-frontend-manifest.json src/features/inventory/views/renderInventoryCatalogPanel.tsx scripts/test-w6-2-catalog-master-detail.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/test-step1906b-frontend-modularization.mjs scripts/w6-2-catalog-master-detail-frontend-manifest.json src/features/inventory/views/renderInventoryCatalogPanel.tsx scripts/test-w6-2-catalog-master-detail.mjs
            git commit -m "W6.2: accept exact Catalog renderer preservation delta"
            git push origin HEAD:w6-2-catalog-master-detail
          fi
      - name: Report Catalog renderer hashes
        run: node scripts/print-w6-panel-hashes.mjs
      - name: Focused W6.2 regression
        run: node scripts/test-w6-2-catalog-master-detail.mjs
      - name: Cumulative release gate
        run: npm run release:check
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
