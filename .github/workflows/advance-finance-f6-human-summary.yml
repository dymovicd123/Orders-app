name: Advance finance F6 human summary guard

on:
  push:
    branches:
      - fix/finance-human-summary-r2-20260916

permissions:
  contents: write

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-human-summary-r2-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Advance F6 reconciliation invariant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-finance-f6-release-audit.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  check(financeUi.includes('consistency.difference') && financeUi.includes('Финансовая сверка') && financeUi.includes('Поступило за период') && financeUi.includes('Внутренняя сверка: без расхождений'), 'Finance UI no longer surfaces concise arithmetic reconciliation')"
          new = "  check(financeUi.includes('consistency.difference') && financeUi.includes('Данные согласованы') && financeUi.includes('Есть расхождение в финансовой сверке') && financeUi.includes('finance-reconciliation-diagnostics'), 'Finance UI no longer surfaces arithmetic reconciliation with human status and mismatch diagnostics')"
          if text.count(old) != 1:
              raise SystemExit('F6 reconciliation invariant anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused F6 check
        run: node scripts/test-finance-f6-release-audit.mjs
      - name: Commit guard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/advance-finance-f6-human-summary.yml
          git add scripts/test-finance-f6-release-audit.mjs
          git commit -m "Update F6 finance summary invariant"
          git push origin HEAD:fix/finance-human-summary-r2-20260916
