name: P0 Branch2 no-auto-deploy verification one-shot
on:
  push:
    branches: [safe/p0-d1-readonly-inspection-20261030]
    paths:
      - '.github/workflows/p0-branch2-postmerge-readback-once-20261030.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read exact Branch2 build and active deployment metadata (GET only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/p0-branch2-upload-only-deployment-readback-20261030.mjs
          node scripts/p0-branch2-upload-only-deployment-readback-20261030.mjs
