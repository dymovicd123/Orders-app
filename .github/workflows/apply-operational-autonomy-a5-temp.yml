name: Apply Operational Autonomy A5 Temp

on:
  push:
    branches:
      - operational-autonomy-a5-exchange-finance-correction

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operational-autonomy-a5-exchange-finance-correction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix A5 patch anchors
        run: python scripts/fix-operational-autonomy-a5-patcher.py
      - name: Apply A5 product patch
        run: python scripts/apply-operational-autonomy-a5.py
      - name: Focused A5 regression
        run: node scripts/test-operational-autonomy-a5-exchange-financial-correction.mjs
      - name: TypeScript
        run: npx tsc -b
      - name: Commit clean A5 product delta
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/apply-operational-autonomy-a5-temp.yml scripts/apply-operational-autonomy-a5.py scripts/fix-operational-autonomy-a5-patcher.py
          git add worker/domains/returns-exchanges.ts worker/index.ts src/App.tsx src/features/sections/OrderExchangeSection.tsx scripts/test-operational-autonomy-a5-exchange-financial-correction.mjs package.json docs/continuation/OPERATIONAL_AUTONOMY_AUDIT_20260910.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add exchange financial correction'
          git push origin HEAD:operational-autonomy-a5-exchange-finance-correction
