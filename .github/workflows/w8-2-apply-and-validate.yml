name: W8.2 apply and validate

on:
  push:
    branches:
      - w8-2-stock-workspace-finish

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[w8.2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-w8-2-stock-workspace.py
      - run: npm ci
      - name: Cumulative regression
        run: npm run release:check
      - name: TypeScript + production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated W8.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "W8.2: finish stock workspace [w8.2-applied]"
          git push origin HEAD:w8-2-stock-workspace-finish
