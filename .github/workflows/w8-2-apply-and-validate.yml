name: W8.2 apply and validate

on:
  push:
    branches:
      - w8-2-stock-workspace-finish

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[w8.2-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-w8-2-stock-workspace.py
      - name: Finalize generated W8.2 source and adjacent regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def git_blob_sha(text: str) -> str:
              body = text.encode('utf-8')
              return hashlib.sha1(f'blob {len(body)}\0'.encode('utf-8') + body).hexdigest()

          overview_path = Path('src/features/inventory/views/renderInventoryOverviewPanel.tsx')
          overview = overview_path.read_text(encoding='utf-8')
          obsolete = '    quickStocktakeOpen,\n'
          if overview.count(obsolete) != 1:
              raise SystemExit(f'Expected one obsolete quickStocktakeOpen binding, found {overview.count(obsolete)}')
          overview = overview.replace(obsolete, '', 1)
          overview_path.write_text(overview, encoding='utf-8')

          manifest_path = Path('scripts/w8-2-stock-workspace-frontend-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['files']['src/features/inventory/views/renderInventoryOverviewPanel.tsx']['afterGitBlob'] = git_blob_sha(overview)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = Path('scripts/test-step192b2a-daily-warehouse.mjs')
          text = path.read_text(encoding='utf-8')
          old = "check(overview.includes('Сверить количество') && overview.includes('На месте сейчас') && overview.includes('Сохранить факт'), 'Universal exact-SKU count UI missing from stock detail')"
          new = "check(overview.includes('Сверить количество') && overview.includes('warehouse-w3-micro-check-start') && overview.includes('Да, на месте ${simpleStockDetail.physical}') && overview.includes('Нет, другое количество'), 'Universal exact-SKU count UI missing from stock detail')"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy 192B2A count assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - name: Cumulative regression
        run: npm run release:check
      - name: TypeScript + production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated W8.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "W8.2: finish stock workspace [w8.2-applied]"
          git push origin HEAD:w8-2-stock-workspace-finish
