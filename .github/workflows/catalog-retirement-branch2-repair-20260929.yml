name: Branch2 repair incomplete catalog retirement 20260929

on:
  push:
    branches:
      - branch2
    paths:
      - '.github/workflows/catalog-retirement-branch2-repair-20260929.yml'

permissions:
  contents: read

jobs:
  repair:
    name: Repair execution 111 on Branch2 D1 only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact Branch2 commit
        uses: actions/checkout@v4

      - name: Hard-stop on Branch2 database identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "branch2" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Production identity detected. Refusing recovery." >&2
            exit 20
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Verify exact incomplete retirement and safety preconditions
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT
            (SELECT COUNT(*) FROM catalog_stock_positions sp JOIN catalog_products p ON p.id=sp.product_id
              WHERE sp.id=111 AND sp.product_id=10 AND p.name='АЙНҰРЫМ-АЙ КӨЙЛЕК'
                AND sp.material='АТЛАС' AND sp.length='ДЛИННЫЙ' AND sp.is_active=0 AND p.is_active=1) AS target_ok,
            (SELECT COUNT(*) FROM catalog_variants WHERE stock_position_id=111 AND is_active=1) AS active_variants,
            (SELECT COALESCE(SUM(s.quantity),0) FROM inventory_stock s
              WHERE s.variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111 AND is_active=1)) AS physical_total,
            (SELECT COALESCE(SUM(s.reserved_quantity),0) FROM inventory_stock s
              WHERE s.variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111 AND is_active=1)) AS stock_reserved_total,
            (SELECT COALESCE(SUM(r.quantity),0) FROM inventory_reservations r
              WHERE r.variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111 AND is_active=1) AND r.status='active') AS active_reservation_total,
            (SELECT COUNT(*) FROM inventory_stocktake_items i
              JOIN inventory_stocktake_sessions st ON st.id=i.session_id
              WHERE i.variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111 AND is_active=1) AND st.status='active') AS active_stocktake,
            (SELECT COUNT(*) FROM inventory_lifecycle_events e
              WHERE e.variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111 AND is_active=1) AND e.status='pending') AS pending_lifecycle,
            (SELECT COUNT(*) FROM catalog_retirement_operations
              WHERE id=1 AND entity_type='execution' AND entity_id=111 AND product_id=10 AND status='completed' AND variant_count=0) AS broken_operation
          " --json)"
          echo "$result"
          [[ "$(jq -r '.[0].results[0].target_ok // 0' <<<"$result")" == "1" ]]
          [[ "$(jq -r '.[0].results[0].active_variants // 0' <<<"$result")" == "2" ]]
          [[ "$(jq -r '.[0].results[0].physical_total // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].stock_reserved_total // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].active_reservation_total // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].active_stocktake // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].pending_lifecycle // 0' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].broken_operation // 0' <<<"$result")" == "1" ]]

      - name: Complete only the already-requested execution retirement
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "INSERT OR IGNORE INTO catalog_retirement_variants (
            retirement_id, variant_id, stock_position_id, product_id, category, gender, color, material, length, size_label,
            warehouse_quantity, warehouse_reserved_quantity, boutique_quantity, boutique_reserved_quantity,
            active_reservation_quantity, captured_at
          )
          SELECT 1, v.id, v.stock_position_id, v.product_id, v.category, v.gender, v.color, v.material, v.length, v.size_label,
            COALESCE((SELECT s.quantity FROM inventory_stock s WHERE s.inventory_source='warehouse' AND s.variant_id=v.id LIMIT 1),0),
            COALESCE((SELECT s.reserved_quantity FROM inventory_stock s WHERE s.inventory_source='warehouse' AND s.variant_id=v.id LIMIT 1),0),
            COALESCE((SELECT s.quantity FROM inventory_stock s WHERE s.inventory_source='boutique' AND s.variant_id=v.id LIMIT 1),0),
            COALESCE((SELECT s.reserved_quantity FROM inventory_stock s WHERE s.inventory_source='boutique' AND s.variant_id=v.id LIMIT 1),0),
            COALESCE((SELECT SUM(r.quantity) FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active'),0),
            CURRENT_TIMESTAMP
          FROM catalog_variants v
          WHERE v.stock_position_id=111 AND v.is_active=1;

          UPDATE inventory_stock
          SET quantity=0, reserved_quantity=0,
              last_action='Удалено из рабочего каталога',
              last_source_ref='catalog_retirement:repair-20260929-op1',
              updated_at=CURRENT_TIMESTAMP
          WHERE variant_id IN (SELECT variant_id FROM catalog_retirement_variants WHERE retirement_id=1);

          UPDATE catalog_variants
          SET is_active=0, updated_at=CURRENT_TIMESTAMP
          WHERE stock_position_id=111 AND is_active=1;

          UPDATE catalog_retirement_operations
          SET variant_count=(SELECT COUNT(*) FROM catalog_retirement_variants WHERE retirement_id=1),
              physical_quantity=COALESCE((SELECT SUM(warehouse_quantity+boutique_quantity) FROM catalog_retirement_variants WHERE retirement_id=1),0),
              stock_reserved_quantity=COALESCE((SELECT SUM(warehouse_reserved_quantity+boutique_reserved_quantity) FROM catalog_retirement_variants WHERE retirement_id=1),0),
              active_reservation_quantity=COALESCE((SELECT SUM(active_reservation_quantity) FROM catalog_retirement_variants WHERE retirement_id=1),0)
          WHERE id=1;" --json

      - name: Verify repaired state
        shell: bash
        run: |
          set -euo pipefail
          result="$(npx wrangler d1 execute orders_db_branch2 --remote --config wrangler.jsonc --command "SELECT
            (SELECT COUNT(*) FROM catalog_variants WHERE stock_position_id=111 AND is_active=1) AS active_variants,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock WHERE variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111)) AS physical_total,
            (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock WHERE variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111)) AS stock_reserved_total,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_reservations WHERE variant_id IN (SELECT id FROM catalog_variants WHERE stock_position_id=111) AND status='active') AS active_reservation_total,
            (SELECT variant_count FROM catalog_retirement_operations WHERE id=1) AS audited_variants,
            (SELECT is_active FROM catalog_stock_positions WHERE id=111) AS execution_active,
            (SELECT is_active FROM catalog_products WHERE id=10) AS product_active
          " --json)"
          echo "$result"
          [[ "$(jq -r '.[0].results[0].active_variants // -1' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].physical_total // -1' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].stock_reserved_total // -1' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].active_reservation_total // -1' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].audited_variants // 0' <<<"$result")" == "2" ]]
          [[ "$(jq -r '.[0].results[0].execution_active // -1' <<<"$result")" == "0" ]]
          [[ "$(jq -r '.[0].results[0].product_active // -1' <<<"$result")" == "1" ]]
          echo "Branch2 execution 111 retirement repaired; product and other executions remain active."
