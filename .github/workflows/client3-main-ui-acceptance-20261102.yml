name: Client3 Main UI component reuse acceptance (NO DEPLOY)
on:
  push:
    branches: [client3/main-ui-port-20261102]
    paths: ['.github/workflows/client3-main-ui-acceptance-20261102.yml']
permissions:
  contents: read
jobs:
  main-component-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Check exact isolated third Worker
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
      - run: npm ci
      - name: Verify Main's actual view components are reused instead of rebuilding them
        run: |
          grep -Fq "StocktakeProductChoice,StocktakeSizeCountCell" src/features/client3/WatchWarehouseMain.tsx
          grep -Fq 'LinkedTableScroll' src/features/client3/WatchOrdersPanel.tsx
          grep -Fq 'order-step-card' src/features/client3/WatchOrderForm.tsx
      - name: Main frontend widget and watch sandbox assertions
        run: |
          node scripts/client3/test-watch-shell-20261102.mjs
          node scripts/client3/test-watch-workspace-layout-20261102.mjs
      - name: Real warehouse, order, returns and exchange regression
        run: |
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
      - name: TypeScript and Vite build
        run: npm run build
