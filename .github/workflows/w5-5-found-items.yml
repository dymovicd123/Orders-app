name: W5.5 found items

on:
  push:
    branches:
      - safe/w5-5-found-items-20260905

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/w5-5-found-items-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture baselines
        run: node scripts/w5-5-manifest-helper.mjs before
      - name: Fix temporary patcher
        run: python3 scripts/w5-5-patcher-fix.py
      - name: Apply W5.5
        run: python3 scripts/w5-5-patcher.py
      - name: Build preservation manifests
        run: node scripts/w5-5-manifest-helper.mjs after
      - name: Extend preservation gates
        run: python3 scripts/w5-5-gate-patcher.py
      - name: Focused regression
        run: |
          git diff --check
          node scripts/test-w5-5-found-items.mjs
      - name: Cumulative release gate
        run: npm run release:check
      - name: Database safety
        run: npm run verify:db-safety
      - name: TypeScript and build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Ensure no migration or schema change
        run: |
          if git diff --name-only | grep -E '(^|/)(migrations?|schema)(/|\.|$)' ; then
            echo 'Unexpected migration/schema change in W5.5'
            exit 1
          fi
      - name: Commit validated candidate
        run: |
          rm .github/workflows/w5-5-found-items.yml
          rm scripts/w5-5-patcher.py scripts/w5-5-patcher-fix.py scripts/w5-5-manifest-helper.mjs scripts/w5-5-gate-patcher.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'W5.5: keep found physical items visible until resolved'
          git push origin HEAD:safe/w5-5-found-items-20260905
