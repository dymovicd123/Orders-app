name: Phase 1B Workshop return disposition patch
# Retry after aligning the cumulative declaration chain with Finance F2/F9.

on:
  push:
    branches:
      - branch2
    paths:
      - .github/workflows/phase1b-workshop-return-disposition.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Extend Phase 1B structural manifest workflow' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch2
        uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact source patch
        run: python3 scripts/apply-phase1b-workshop-disposition.py

      - name: Fix Phase 1B regression parser boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-step192a1-warehouse-truth-freshness.mjs')
          text = p.read_text(encoding='utf-8')
          old_return = "const createReturnFlow = functionBody(exchanges, 'createReturn')"
          new_return = "const createReturnFlow = functionSection(exchanges, 'createReturn', 'hasActiveStandaloneReturn')"
          if text.count(old_return) != 1:
              raise SystemExit(f'createReturn parser anchor mismatch: {text.count(old_return)}')
          text = text.replace(old_return, new_return, 1)
          old_exchange_decl = "  const createExchangeFlow = functionBody(exchanges, 'createExchange')\n"
          if text.count(old_exchange_decl) != 1:
              raise SystemExit(f'createExchange declaration anchor mismatch: {text.count(old_exchange_decl)}')
          text = text.replace(old_exchange_decl, '', 1)
          old_exchange_check = "check(createExchangeFlow.includes(\"oldItemIsWorkshop && oldReturnSource === 'boutique'\")"
          new_exchange_check = "check(exchanges.includes(\"oldItemIsWorkshop && oldReturnSource === 'boutique'\")"
          if text.count(old_exchange_check) != 1:
              raise SystemExit(f'createExchange check anchor mismatch: {text.count(old_exchange_check)}')
          p.write_text(text.replace(old_exchange_check, new_exchange_check, 1), encoding='utf-8')
          PY

      - name: Extend structural manifest chain
        run: python3 scripts/apply-phase1b-manifest-chain.py

      - name: Create Phase 1B Worker manifest
        run: node scripts/refresh-phase1b-worker-manifest.mjs

      - name: Inspect patch
        run: |
          git diff --check
          git diff --stat
          git diff -- worker/domains/returns-exchanges.ts src/App.tsx src/app/types.ts src/app/utils.ts src/features/sections/OrderReturnsSection.tsx src/features/sections/OrderExchangeSection.tsx scripts/test-step192a1-warehouse-truth-freshness.mjs scripts/test-step1906a-worker-modularization.mjs scripts/release-check.mjs scripts/phase1b-workshop-return-disposition-worker-manifest.json

      - name: Full release gate
        shell: bash
        run: |
          set -o pipefail
          npm run release:check 2>&1 | tee phase1b-release-check.log

      - name: Upload release diagnostics
        if: always() && hashFiles('phase1b-release-check.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-release-diagnostics
          path: phase1b-release-check.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit verified source and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase1b-workshop-return-disposition.yml \
            scripts/apply-phase1b-workshop-disposition.py \
            scripts/apply-phase1b-manifest-chain.py \
            scripts/refresh-phase1b-worker-manifest.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No verified source changes to commit'; exit 1; }
          git commit -m "Fix Workshop return disposition semantics"
          git push origin HEAD:branch2
