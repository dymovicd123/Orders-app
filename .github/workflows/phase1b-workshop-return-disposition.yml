name: Phase 1B Workshop return disposition patch

on:
  push:
    branches:
      - branch2
    paths:
      - .github/workflows/phase1b-workshop-return-disposition.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add one-shot Phase 1B patch workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch2
        uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact Phase 1B source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Backend: preserve explicit per-line restock intent instead of forcing every selected line to restock.
          replace_once(
              'worker/domains/returns-exchanges.ts',
              """  const selectedItemMap = new Map<number, { orderItemId: number; quantity: number; amount: number; restock: boolean }>();
  for (const rawItem of rawItems) {
    const orderItemId = toInt(rawItem?.orderItemId, 0);
    const quantity = Math.max(0, toInt(rawItem?.quantity, 0));
    if (!orderItemId || quantity <= 0) continue;
    const current = selectedItemMap.get(orderItemId);
    selectedItemMap.set(orderItemId, {
      orderItemId,
      quantity: (current?.quantity || 0) + quantity,
      amount: (current?.amount || 0) + Math.max(0, toInt(rawItem?.amount, 0)),
      restock: true,
    });
  }
""",
              """  const selectedItemMap = new Map<number, { orderItemId: number; quantity: number; amount: number; restock: boolean | null }>();
  for (const rawItem of rawItems) {
    const orderItemId = toInt(rawItem?.orderItemId, 0);
    const quantity = Math.max(0, toInt(rawItem?.quantity, 0));
    if (!orderItemId || quantity <= 0) continue;
    const explicitRestock = typeof rawItem?.restock === 'boolean' ? rawItem.restock : null;
    const current = selectedItemMap.get(orderItemId);
    if (current?.restock !== null && explicitRestock !== null && current.restock !== explicitRestock) {
      throw new Error(`Для позиции #${orderItemId} переданы противоречивые решения по возврату в остаток.`);
    }
    selectedItemMap.set(orderItemId, {
      orderItemId,
      quantity: (current?.quantity || 0) + quantity,
      amount: (current?.amount || 0) + Math.max(0, toInt(rawItem?.amount, 0)),
      restock: explicitRestock ?? current?.restock ?? null,
    });
  }
""",
              'return selected-item disposition transport',
          )

          replace_once(
              'worker/domains/returns-exchanges.ts',
              """    selected: { orderItemId: number; quantity: number; amount: number; restock: boolean };
""",
              """    selected: { orderItemId: number; quantity: number; amount: number; restock: boolean | null };
""",
              'return validated item type',
          )

          replace_once(
              'worker/domains/returns-exchanges.ts',
              """    const isWorkshop = Boolean(toInt(orderItem.is_workshop, 0));
    const wantsRestock = restockSource !== 'none' && selected.restock;
    if (humanInventoryModelEnabled && wantsRestock && !isWorkshop && !orderItemWasPhysicallyIssued(orderItem)) {
""",
              """    const isWorkshop = Boolean(toInt(orderItem.is_workshop, 0));
    // Workshop production normally goes straight to the client. A returned Workshop item
    // therefore enters inventory only after an explicit per-line decision. Legacy clients
    // that omit the flag keep the old default for ordinary Warehouse/Boutique lines, but
    // omission is deliberately no-stock for Workshop lines.
    const itemRestockRequested = isWorkshop ? selected.restock === true : selected.restock !== false;
    if (isWorkshop && itemRestockRequested && restockSource === 'boutique') {
      throw new Error(`Товар из Цеха «${cleanText(orderItem.product_name_snapshot)}» нельзя возвращать в остаток Бутика. Выберите «Не возвращать в остатки» или «Склад».`);
    }
    const wantsRestock = restockSource !== 'none' && itemRestockRequested;
    if (humanInventoryModelEnabled && wantsRestock && !isWorkshop && !orderItemWasPhysicallyIssued(orderItem)) {
""",
              'return Workshop explicit disposition guard',
          )

          replace_once(
              'worker/domains/returns-exchanges.ts',
              """      details: restockSource === 'none' ? (comment || 'Без возврата в остатки') : `Возврат в ${restockSource === 'warehouse' ? 'склад' : 'бутик'}${comment ? `: ${comment}` : ''}`,
""",
              """      details: validatedSelectedItems.some((item) => item.wantsRestock)
        ? `Возврат в ${restockSource === 'warehouse' ? 'склад' : 'бутик'}${comment ? `: ${comment}` : ''}`
        : (comment || 'Без возврата в остатки'),
""",
              'return activity reflects actual stock disposition',
          )

          replace_once(
              'worker/domains/returns-exchanges.ts',
              """  const oldReturnSource = normalizeExchangeReturnSource(input.oldReturnSource);
  const rawExchangeDate = cleanText(input.exchangeDate);
""",
              """  const oldReturnSource = normalizeExchangeReturnSource(input.oldReturnSource);
  if (oldItemIsWorkshop && oldReturnSource === 'boutique') {
    throw new Error(`Старую вещь из Цеха «${cleanText(oldItem.product_name_snapshot)}» нельзя принимать в остаток Бутика. Для цеховой вещи доступны только «Не возвращать в остатки» или явный приём на Склад.`);
  }
  const rawExchangeDate = cleanText(input.exchangeDate);
""",
              'exchange Workshop Boutique guard',
          )

          # Frontend transport: send the already-modelled per-line restock decision.
          replace_once(
              'src/App.tsx',
              """          .map((item) => ({
            orderItemId: item.orderItemId,
            quantity: item.quantity,
          })),
""",
              """          .map((item) => ({
            orderItemId: item.orderItemId,
            quantity: item.quantity,
            restock: item.restock,
          })),
""",
              'return payload per-line restock flag',
          )

          replace_once(
              'src/app/types.ts',
              """export type ReturnItemDraft = {
  orderItemId: number
  productName: string
  quantity: number
  maxQuantity: number
  restock: boolean
}
""",
              """export type ReturnItemDraft = {
  orderItemId: number
  productName: string
  quantity: number
  maxQuantity: number
  sourceType: 'warehouse' | 'boutique' | 'workshop'
  restock: boolean
}
""",
              'return item draft source type',
          )

          replace_once(
              'src/app/utils.ts',
              """      quantity: 0,
      maxQuantity: Math.max(1, Number(item.quantity || 1)),
      restock: item.sourceType !== 'workshop',
""",
              """      quantity: 0,
      maxQuantity: Math.max(1, Number(item.quantity || 1)),
      sourceType: item.sourceType === 'workshop' ? 'workshop' : item.sourceType === 'boutique' ? 'boutique' : 'warehouse',
      restock: item.sourceType !== 'workshop',
""",
              'return draft keeps line source',
          )

          # Return UX: keep the global destination, but make stock intake an explicit per-line choice.
          replace_once(
              'src/features/sections/OrderReturnsSection.tsx',
              """                              onChange={(event) => setReturnDraft((current) => ({ ...current, restockSource: event.target.value as ReturnDraft['restockSource'] }))}
""",
              """                              onChange={(event) => {
                                const restockSource = event.target.value as ReturnDraft['restockSource']
                                setReturnDraft((current) => ({
                                  ...current,
                                  restockSource,
                                  items: restockSource === 'boutique'
                                    ? current.items.map((item) => item.sourceType === 'workshop' ? { ...item, restock: false } : item)
                                    : current.items,
                                }))
                              }}
""",
              'return destination safely clears Workshop Boutique intake',
          )

          replace_once(
              'src/features/sections/OrderReturnsSection.tsx',
              """                          <span className=\"muted-small\">Выберите количество. Куда возвращать товар, задаётся общим списком выше: не возвращать / склад / бутик. Цеховая или нераспознанная вещь при выборе Склад/Бутик не меняет остаток сразу — она появится у администратора в «Ожидают движения».</span>
""",
              """                          <span className=\"muted-small\">Выберите количество. Для обычной складской/бутиковой позиции возврат в выбранное место включён по умолчанию. Товар из Цеха по умолчанию не попадает в остатки: если клиентскую вещь действительно решили оставить на Складе, включите это прямо у нужной строки. Цех → Бутик не используется.</span>
""",
              'return human disposition note',
          )

          replace_once(
              'src/features/sections/OrderReturnsSection.tsx',
              """                                  <td>{item.productName}</td>
""",
              """                                  <td>
                                    <div>{item.productName}</div>
                                    <label className=\"muted-small\">
                                      <input
                                        type=\"checkbox\"
                                        checked={returnDraft.restockSource !== 'none' && Boolean(item.restock)}
                                        disabled={returnDraft.restockSource === 'none' || (item.sourceType === 'workshop' && returnDraft.restockSource === 'boutique')}
                                        onChange={(event) => setReturnDraft((current) => ({
                                          ...current,
                                          items: current.items.map((entry, itemIndex) => itemIndex === index
                                            ? { ...entry, restock: event.target.checked }
                                            : entry),
                                        }))}
                                      />
                                      <span>
                                        {returnDraft.restockSource === 'none'
                                          ? 'Без возврата в остатки'
                                          : item.sourceType === 'workshop' && returnDraft.restockSource === 'boutique'
                                            ? 'Цех → Бутик нельзя'
                                            : item.restock
                                              ? item.sourceType === 'workshop' ? 'Принять на Склад' : 'Вернуть в остаток'
                                              : 'Не возвращать в остаток'}
                                      </span>
                                    </label>
                                  </td>
""",
              'return per-line disposition control',
          )

          # Exchange UX: old Workshop item has only no-stock or explicit Warehouse disposition.
          replace_once(
              'src/features/sections/OrderExchangeSection.tsx',
              """  const effectiveOldItemId = draftOldItemIsValid
    ? Number(exchangeDraft.oldItemId || 0)
    : Number(exchangeableOldItems[0]?.id || 0)

  const replacementSourceForItem = (item: any) => item?.sourceType === 'workshop'
""",
              """  const effectiveOldItemId = draftOldItemIsValid
    ? Number(exchangeDraft.oldItemId || 0)
    : Number(exchangeableOldItems[0]?.id || 0)
  const effectiveOldItem = exchangeableOldItems.find((item: any) => Number(item.id || 0) === effectiveOldItemId) || null
  const effectiveOldItemIsWorkshop = effectiveOldItem?.sourceType === 'workshop'

  const replacementSourceForItem = (item: any) => item?.sourceType === 'workshop'
""",
              'exchange effective old Workshop item',
          )

          replace_once(
              'src/features/sections/OrderExchangeSection.tsx',
              """                                  oldItemId,
                                  oldQuantity: 1,
                                  newSourceWasManuallyChanged: false,
""",
              """                                  oldItemId,
                                  oldQuantity: 1,
                                  oldReturnSource: selectedItem?.sourceType === 'workshop' && current.oldReturnSource === 'boutique' ? 'none' : current.oldReturnSource,
                                  newSourceWasManuallyChanged: false,
""",
              'exchange reset invalid Workshop Boutique destination',
          )

          replace_once(
              'src/features/sections/OrderExchangeSection.tsx',
              """                              <option value=\"warehouse\">Склад</option>
                              <option value=\"boutique\">Бутик</option>
                              <option value=\"none\">Не возвращать в остатки</option>
                            </select>
""",
              """                              <option value=\"warehouse\">Склад</option>
                              {!effectiveOldItemIsWorkshop ? <option value=\"boutique\">Бутик</option> : null}
                              <option value=\"none\">Не возвращать в остатки</option>
                            </select>
                            {effectiveOldItemIsWorkshop ? <small className=\"field-hint\">Вещь из Цеха не попадает в остатки автоматически. Выберите Склад только если возвращённую клиентом вещь действительно решили оставить на Складе.</small> : null}
""",
              'exchange Workshop destination choices',
          )

          # Regression test: encode explicit disposition instead of the old implicit auto-intake assumption.
          test_path = Path('scripts/test-step192a1-warehouse-truth-freshness.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              """  const worker = read('worker/index.ts')
""",
              """  const worker = read('worker/index.ts')
  const app = read('src/App.tsx')
  const returnUtils = read('src/app/utils.ts')
  const returnView = read('src/features/sections/OrderReturnsSection.tsx')
  const exchangeView = read('src/features/sections/OrderExchangeSection.tsx')
""",
              1,
          )
          anchor = """  check((exchanges.match(/applyCanonicalInventoryLifecycleEvent\\(/g) || []).length >= 2, 'Canonical atomic lifecycle movement is no longer used by return/exchange intake')
"""
          insert = anchor + """
  const createReturnFlow = functionBody(exchanges, 'createReturn')
  check(createReturnFlow.includes("const explicitRestock = typeof rawItem?.restock === 'boolean' ? rawItem.restock : null"), 'Return transport no longer preserves explicit per-line restock intent')
  check(createReturnFlow.includes("const itemRestockRequested = isWorkshop ? selected.restock === true : selected.restock !== false"), 'Workshop return is no longer no-stock unless explicitly opted into inventory')
  check(createReturnFlow.includes("isWorkshop && itemRestockRequested && restockSource === 'boutique'"), 'Workshop return can again be sent to Boutique inventory')
  check(createReturnFlow.includes('if (wantsRestock) {'), 'No-stock return can no longer bypass inventory lifecycle resolution')
  check(!createReturnFlow.includes('restock: true,'), 'Return backend again forces every selected line into stock')
  const createExchangeFlow = functionBody(exchanges, 'createExchange')
  check(createExchangeFlow.includes("oldItemIsWorkshop && oldReturnSource === 'boutique'"), 'Workshop exchange return can again be sent to Boutique inventory')
  check(app.includes('restock: item.restock'), 'Return frontend no longer transmits the per-line stock disposition')
  check(returnUtils.includes("restock: item.sourceType !== 'workshop'"), 'Workshop return draft no longer defaults to no-stock')
  check(returnView.includes('Принять на Склад'), 'Return UI lost the explicit Workshop-to-Warehouse decision')
  check(returnView.includes('Цех → Бутик нельзя'), 'Return UI no longer explains the Workshop Boutique restriction')
  check(exchangeView.includes('effectiveOldItemIsWorkshop'), 'Exchange UI no longer distinguishes Workshop old items')
  check(exchangeView.includes('Вещь из Цеха не попадает в остатки автоматически'), 'Exchange UI lost explicit Workshop disposition guidance')
"""
          if test.count(anchor) != 1:
              raise SystemExit('Step192A1 explicit-disposition test anchor mismatch')
          test = test.replace(anchor, insert, 1)
          old_console = "STEP 192A1 WAREHOUSE TRUTH / FRESHNESS TESTS PASSED — exact-known workshop return/exchange auto-intake stays freshness-gated and idempotent; Workshop task completion remains production-only; adjacent reservation/shipping/handover/catalog-review boundaries are guarded"
          new_console = "STEP 192A1 WAREHOUSE TRUTH / FRESHNESS TESTS PASSED — Workshop return/exchange intake requires explicit Warehouse disposition, Boutique is blocked, no-stock avoids lifecycle work, and explicit intake remains freshness-gated/idempotent"
          if old_console not in test:
              raise SystemExit('Step192A1 console baseline mismatch')
          test_path.write_text(test.replace(old_console, new_console, 1), encoding='utf-8')
          PY

      - name: Refresh structural allow-list hashes for changed Worker declarations
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'

          const file = 'worker/domains/returns-exchanges.ts'
          const sourceText = fs.readFileSync(file, 'utf8')
          const source = ts.createSourceFile(file, sourceText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const wanted = new Set(['createReturn', 'createExchange'])
          const hashes = {}
          for (const statement of source.statements) {
            if (ts.isFunctionDeclaration(statement) && statement.name && wanted.has(statement.name.text)) {
              hashes[statement.name.text] = sha(statement.getText(source).replace(/^export\s+/, ''))
            }
          }
          for (const name of wanted) {
            if (!hashes[name]) throw new Error(`Declaration not found for manifest refresh: ${name}`)
          }
          const manifestPath = 'scripts/step192a1-warehouse-truth-freshness-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          for (const name of wanted) manifest.changes[name].after = hashes[name]
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)
          console.log('Updated Phase 1B declaration hashes:', hashes)
          NODE

      - name: Show focused diff
        run: git diff --check && git diff --stat && git diff -- worker/domains/returns-exchanges.ts src/App.tsx src/app/types.ts src/app/utils.ts src/features/sections/OrderReturnsSection.tsx src/features/sections/OrderExchangeSection.tsx scripts/test-step192a1-warehouse-truth-freshness.mjs scripts/step192a1-warehouse-truth-freshness-manifest.json

      - name: Full release gate
        run: npm run release:check

      - name: Commit verified Phase 1B source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/returns-exchanges.ts src/App.tsx src/app/types.ts src/app/utils.ts \
            src/features/sections/OrderReturnsSection.tsx src/features/sections/OrderExchangeSection.tsx \
            scripts/test-step192a1-warehouse-truth-freshness.mjs scripts/step192a1-warehouse-truth-freshness-manifest.json
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m "Fix Workshop return disposition semantics"
          git push origin HEAD:branch2
