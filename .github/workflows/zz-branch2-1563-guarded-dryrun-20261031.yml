name: "One-shot Branch2 return 1563 exact Main-safe reconciliation DRY RUN 20261031"
on:
  push:
    branches: [ops/branch2-return-1563-exact-reconciliation-20261031]
    paths: [.github/workflows/zz-branch2-1563-guarded-dryrun-20261031.yml]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact Main-proven guard SQL and read-only Branch2 preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/ops/repair-1563-branch2-20261031.mjs
          node --check scripts/ops/repair-1563-branch2-sql-20261031.mjs
          node scripts/ops/repair-1563-branch2-20261031.mjs --check
