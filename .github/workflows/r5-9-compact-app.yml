name: R5.9 compact App controller

on:
  push:
    branches:
      - safe/d1-read-budget-r5-9-orders-pagination-20260904

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Compact only the R5.9 App additions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/App.tsx')
          text=p.read_text(encoding='utf-8')
          pattern=r"  async function loadDashboard\(\n\s+forceReferences = false,\n\s+overrideFilters: typeof filters = filters,\n\s+overrideOffset = orderPageOffset,\n\s+pageReadOptions: \{ afterOrderDate\?: string; afterOrderId\?: number; reusePeriodStats\?: boolean \} \| null = null,\n\s+\) \{"
          replacement="  async function loadDashboard(forceReferences = false, overrideFilters: typeof filters = filters, overrideOffset = orderPageOffset, pageReadOptions: { afterOrderDate?: string; afterOrderId?: number; reusePeriodStats?: boolean } | null = null) {"
          text,n=re.subn(pattern,replacement,text,count=1)
          if n != 1: raise SystemExit(f'loadDashboard signature: expected 1 anchor, found {n}')
          pattern=r"    await loadDashboard\(false, filters, nextOffset, \{\n\s+afterOrderDate: lastOrder\?\.order_date \|\| '',\n\s+afterOrderId: Number\(lastOrder\?\.id \|\| 0\),\n\s+reusePeriodStats: true,\n\s+\}\)"
          replacement="    await loadDashboard(false, filters, nextOffset, { afterOrderDate: lastOrder?.order_date || '', afterOrderId: Number(lastOrder?.id || 0), reusePeriodStats: true })"
          text,n=re.subn(pattern,replacement,text,count=1)
          if n != 1: raise SystemExit(f'page navigation call: expected 1 anchor, found {n}')
          p.write_text(text, encoding='utf-8')
          lines=len(text.splitlines())+1
          print(f'R5.9 App lines after compact: {lines}')
          if lines > 7000: raise SystemExit(f'App line budget still exceeded: {lines}')
          PY
      - name: Focused gates
        run: |
          npm run test:d1-read-budget-r5-9
          node scripts/test-step1906b-frontend-modularization.mjs
          npm run typecheck
          npm run build
      - name: Commit compact App
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "R5.9: keep App within controller budget"
          git push origin HEAD:safe/d1-read-budget-r5-9-orders-pagination-20260904
