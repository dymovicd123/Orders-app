name: Cloudflare deploy monitor

on:
  push:
    branches:
      - branch2
      - main

permissions:
  contents: write
  statuses: write

jobs:
  monitor:
    name: Cloudflare deploy / ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Resolve target Worker
        id: target
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main) WORKER_NAME="orders-app" ;;
            branch2) WORKER_NAME="orders-app-branch2" ;;
            *) echo "Unsupported branch: $GITHUB_REF_NAME" >&2; exit 2 ;;
          esac
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: Mark deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg c "cloudflare-deploy/$GITHUB_REF_NAME" --arg u "$RUN_URL" '{state:"pending",context:$c,description:"Waiting for Cloudflare Workers Build",target_url:$u}')" >/dev/null

      - name: Wait for matching Cloudflare build
        id: wait
        shell: bash
        env:
          WORKER_NAME: ${{ steps.target.outputs.worker_name }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_API_TOKEN:-}" ]]; then
            echo "Cloudflare monitoring secrets are missing." >&2
            exit 3
          fi
          AUTH=(-H "Authorization: Bearer $CF_API_TOKEN")
          workers_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          worker_tag="$(jq -r --arg name "$WORKER_NAME" '.result[] | select(.id == $name) | .tag // empty' <<<"$workers_json" | head -n1)"
          if [[ -z "$worker_tag" ]]; then
            echo "Could not resolve immutable tag for Worker $WORKER_NAME." >&2
            jq -r '.errors[]?.message' <<<"$workers_json" >&2 || true
            exit 4
          fi
          echo "Resolved $WORKER_NAME tag: $worker_tag"
          build_uuid=""
          outcome=""
          status=""
          for attempt in $(seq 1 48); do
            builds_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/builds/workers/$worker_tag/builds")"
            match="$(jq -c --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '[.result[]? | select(.build_trigger_metadata.commit_hash == $sha and .build_trigger_metadata.branch == $branch)] | sort_by(.created_on) | last // empty' <<<"$builds_json")"
            if [[ -n "$match" ]]; then
              build_uuid="$(jq -r '.build_uuid // empty' <<<"$match")"
              status="$(jq -r '.status // empty' <<<"$match")"
              outcome="$(jq -r '.build_outcome // empty' <<<"$match")"
              echo "Cloudflare build $build_uuid: status=$status outcome=${outcome:-pending}"
              [[ "$status" == "stopped" ]] && break
            else
              echo "Waiting for Cloudflare build for $GITHUB_SHA (attempt $attempt/48)..."
            fi
            sleep 10
          done
          [[ -n "$build_uuid" ]] || { echo "Cloudflare build for commit $GITHUB_SHA did not appear within 8 minutes." >&2; exit 5; }
          [[ "$status" == "stopped" ]] || { echo "Cloudflare build $build_uuid did not finish within 8 minutes." >&2; exit 6; }
          echo "build_uuid=$build_uuid" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          if [[ "$outcome" != "success" ]]; then
            echo "Cloudflare build failed with outcome: ${outcome:-unknown}" >&2
            echo "----- Cloudflare build log -----"
            cursor=""
            for page in $(seq 1 20); do
              url="$CF_API/accounts/$CF_ACCOUNT_ID/builds/builds/$build_uuid/logs"
              [[ -z "$cursor" ]] || url="$url?cursor=$(printf '%s' "$cursor" | jq -sRr @uri)"
              logs_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$url")"
              jq -r '.result.lines[]? | if type == "array" then (map(tostring) | join(" ")) else tostring end' <<<"$logs_json"
              truncated="$(jq -r '.result.truncated // false' <<<"$logs_json")"
              cursor="$(jq -r '.result.cursor // empty' <<<"$logs_json")"
              [[ "$truncated" == "true" && -n "$cursor" ]] || break
            done
            echo "----- end Cloudflare build log -----"
            exit 7
          fi

      - name: Mark deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$(jq -nc --arg c "cloudflare-deploy/$GITHUB_REF_NAME" --arg d "Cloudflare deploy succeeded" --arg u "$RUN_URL" '{state:"success",context:$c,description:$d,target_url:$u}')" >/dev/null

      - name: Mark deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$(jq -nc --arg c "cloudflare-deploy/$GITHUB_REF_NAME" --arg d "Cloudflare deploy failed; inspect workflow log" --arg u "$RUN_URL" '{state:"failure",context:$c,description:$d,target_url:$u}')" >/dev/null

  phase2_promote:
    name: Verified Phase 2 production promotion
    if: github.ref_name == 'main' && github.event.head_commit.message == 'Arm verified Phase 2 production promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact pre-Phase2 main baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=975ccecd965a15cba4325a53d7dddc41a92eae54
          files=(package.json scripts/test-step1906a-worker-modularization.mjs scripts/test-step1906b-frontend-modularization.mjs src/features/inventory/views/renderInventoryOverviewPanel.tsx src/features/sections/InventorySection.tsx src/styles/188i-cycle-counts.css worker/index.ts)
          for file in "${files[@]}"; do
            current="$(git rev-parse "HEAD:$file")"
            baseline="$(git rev-parse "$BASE:$file")"
            [[ "$current" == "$baseline" ]] || { echo "Baseline mismatch: $file current=$current baseline=$baseline" >&2; exit 10; }
          done
          ! git cat-file -e HEAD:scripts/test-phase2-smart-daily-stock.mjs 2>/dev/null || { echo 'Phase 2 test unexpectedly exists on main' >&2; exit 11; }
          ! git cat-file -e HEAD:src/features/inventory/routineCycleCount.ts 2>/dev/null || { echo 'routineCycleCount.ts unexpectedly exists on main' >&2; exit 12; }
      - name: Apply exact clean tested Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=e84e26827814e6fd02f255e785a29180ba1f9f9f
          files=(package.json scripts/test-phase2-smart-daily-stock.mjs scripts/test-step1906a-worker-modularization.mjs scripts/test-step1906b-frontend-modularization.mjs src/features/inventory/routineCycleCount.ts src/features/inventory/views/renderInventoryOverviewPanel.tsx src/features/sections/InventorySection.tsx src/styles/188i-cycle-counts.css worker/index.ts)
          git checkout "$SOURCE" -- "${files[@]}"
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$'package.json\nscripts/test-phase2-smart-daily-stock.mjs\nscripts/test-step1906a-worker-modularization.mjs\nscripts/test-step1906b-frontend-modularization.mjs\nsrc/features/inventory/routineCycleCount.ts\nsrc/features/inventory/views/renderInventoryOverviewPanel.tsx\nsrc/features/sections/InventorySection.tsx\nsrc/styles/188i-cycle-counts.css\nworker/index.ts'
          test "$changed" = "$expected"
          ! grep -R "phase2accept" package.json scripts/test-phase2-smart-daily-stock.mjs src/features/inventory src/features/sections/InventorySection.tsx src/styles/188i-cycle-counts.css worker/index.ts
          ! grep -R "ТЕСТ ·" src/features/inventory src/features/sections/InventorySection.tsx
          ! git diff -- "${files[@]}" | grep -E "inventoryArrival|Приход" >/dev/null
      - name: Install dependencies
        run: npm ci
      - name: Full main release gate
        run: npm run release:check
      - name: Restore monitor, commit and push tested source
        shell: bash
        run: |
          set -euo pipefail
          git checkout 190fe60c3f75e8c9c956fa68d95de95697a46040 -- .github/workflows/cloudflare-deploy-monitor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote Phase 2 smart daily stock truth"
          git push origin HEAD:main
