name: Cloudflare upload monitor and approved Main version promotion
# Push monitor observes Cloudflare uploads only. Separate dispatch promotion is explicit, pinned and guarded.

on:
  push:
    branches:
      - branch2
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect only, or promote a previously uploaded version'
        type: choice
        options: [inspect, promote]
        default: inspect
        required: true
      source_sha:
        description: 'Full 40-character Git SHA for promotion (blank for inspect)'
        type: string
        required: false
      version_id:
        description: 'Exact uploaded Worker Version ID (blank for inspect)'
        type: string
        required: false
      expected_deployment_id:
        description: 'Currently active Main Deployment ID (blank for inspect)'
        type: string
        required: false
      expected_active_version_id:
        description: 'Currently active Main Version ID (blank for inspect)'
        type: string
        required: false
      confirmation:
        description: 'For promotion enter PUBLISH-MAIN-100'
        type: string
        required: false

permissions:
  contents: read
  statuses: write

jobs:
  monitor:
    if: github.event_name == 'push'
    name: Cloudflare upload / ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify environment isolation
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main)
              grep -Fq '"name": "orders-app"' wrangler.jsonc
              grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
              grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
              if grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then
                echo "Branch2 D1 binding leaked into main. Refusing deploy." >&2
                exit 10
              fi
              ;;
            branch2)
              grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
              grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
              grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
              if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
                echo "Production D1 binding leaked into branch2. Refusing deploy." >&2
                exit 11
              fi
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME" >&2
              exit 2
              ;;
          esac

      - name: Resolve target Worker
        id: target
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main) WORKER_NAME="orders-app" ;;
            branch2) WORKER_NAME="orders-app-branch2" ;;
            *) echo "Unsupported branch: $GITHUB_REF_NAME" >&2; exit 2 ;;
          esac
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: Mark deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg c "cloudflare-upload/$GITHUB_REF_NAME" --arg u "$RUN_URL" '{state:"pending",context:$c,description:"Waiting for Cloudflare version upload",target_url:$u}')" >/dev/null

      - name: Wait for matching Cloudflare build
        id: wait
        shell: bash
        env:
          WORKER_NAME: ${{ steps.target.outputs.worker_name }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_API_TOKEN:-}" ]]; then
            echo "Cloudflare monitoring secrets are missing." >&2
            exit 3
          fi

          AUTH=(-H "Authorization: Bearer $CF_API_TOKEN")

          workers_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          worker_tag="$(jq -r --arg name "$WORKER_NAME" '.result[] | select(.id == $name) | .tag // empty' <<<"$workers_json" | head -n1)"
          if [[ -z "$worker_tag" ]]; then
            echo "Could not resolve immutable tag for Worker $WORKER_NAME." >&2
            jq -r '.errors[]?.message' <<<"$workers_json" >&2 || true
            exit 4
          fi
          echo "Resolved $WORKER_NAME tag: $worker_tag"

          build_uuid=""
          outcome=""
          status=""
          for attempt in $(seq 1 48); do
            builds_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/builds/workers/$worker_tag/builds")"
            match="$(jq -c --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '
              [.result[]? | select(.build_trigger_metadata.commit_hash == $sha and .build_trigger_metadata.branch == $branch)]
              | sort_by(.created_on) | last // empty
            ' <<<"$builds_json")"

            if [[ -n "$match" ]]; then
              build_uuid="$(jq -r '.build_uuid // empty' <<<"$match")"
              status="$(jq -r '.status // empty' <<<"$match")"
              outcome="$(jq -r '.build_outcome // empty' <<<"$match")"
              echo "Cloudflare build $build_uuid: status=$status outcome=${outcome:-pending}"
              if [[ "$status" == "stopped" ]]; then
                break
              fi
            else
              echo "Waiting for Cloudflare build for $GITHUB_SHA (attempt $attempt/48)..."
            fi
            sleep 10
          done

          if [[ -z "$build_uuid" ]]; then
            echo "Cloudflare build for commit $GITHUB_SHA did not appear within 8 minutes." >&2
            exit 5
          fi
          if [[ "$status" != "stopped" ]]; then
            echo "Cloudflare build $build_uuid did not finish within 8 minutes." >&2
            exit 6
          fi

          echo "build_uuid=$build_uuid" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          if [[ "$outcome" != "success" ]]; then
            echo "Cloudflare build failed with outcome: ${outcome:-unknown}" >&2
            echo "----- Cloudflare build log -----"
            cursor=""
            for page in $(seq 1 20); do
              url="$CF_API/accounts/$CF_ACCOUNT_ID/builds/builds/$build_uuid/logs"
              if [[ -n "$cursor" ]]; then
                url="$url?cursor=$(printf '%s' "$cursor" | jq -sRr @uri)"
              fi
              logs_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$url")"
              page_log="$(jq -r '.result.lines[]? | if type == "array" then (map(tostring) | join(" ")) else tostring end' <<<"$logs_json")"
              printf '%s\n' "$page_log"
              truncated="$(jq -r '.result.truncated // false' <<<"$logs_json")"
              cursor="$(jq -r '.result.cursor // empty' <<<"$logs_json")"
              [[ "$truncated" == "true" && -n "$cursor" ]] || break
            done
            echo "----- end Cloudflare build log -----"

            exit 7
          fi

      - name: Mark deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg c "cloudflare-upload/$GITHUB_REF_NAME" --arg d "Cloudflare upload finished (NOT serving traffic)" --arg u "$RUN_URL" '{state:"success",context:$c,description:$d,target_url:$u}')" >/dev/null

      - name: Mark deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg c "cloudflare-upload/$GITHUB_REF_NAME" --arg d "Cloudflare upload failed; inspect workflow log" --arg u "$RUN_URL" '{state:"failure",context:$c,description:$d,target_url:$u}')" >/dev/null

  manual-main-inspect:
    name: Main version/deployment inspection (GET-only)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      RELEASE_MODE: inspect
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Inspect existing Main deployment and latest uploaded builds (read-only)
        run: node scripts/main-version-promotion.mjs

  manual-main-promote:
    name: Promote reviewed Main Worker Version ID to 100% (approval required)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: orders-app-main-manual-promotion
      cancel-in-progress: false
    environment: main-production
    permissions:
      contents: read
    env:
      RELEASE_MODE: promote
      RELEASE_SHA: ${{ inputs.source_sha }}
      TARGET_VERSION_ID: ${{ inputs.version_id }}
      EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
      CONFIRM_RELEASE: ${{ inputs.confirmation }}
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify exact main checkout and run full non-mutating release check
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/main-version-promotion.mjs --self-test
      - name: Promote already uploaded exact-SHA version (one guarded Cloudflare POST)
        run: node scripts/main-version-promotion.mjs
