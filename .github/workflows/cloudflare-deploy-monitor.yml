name: Cloudflare Branch2 deploy monitor - archived pending manual promotion

# Cloudflare Branch2 native trigger now uploads versions instead of publishing.
# The old monitor tried to publish via direct-deploy fallback on a stale public
# UI, undoing the upload-only guard. Disable ALL its jobs until a separate,
# read-only upload observer and explicit manual promotion pipeline are approved.
# This file has no push/PR trigger and cannot deploy through workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Historical deployment monitor disabled
        run: echo 'The Branch2 fallback deploy is permanently disabled in this workflow.'
