name: Cloudflare deploy monitor

# Branch2 deploy monitoring keeps the guarded fallback for native Cloudflare infrastructure failures.

on:
  push:
    branches:
      - branch2
      - main

permissions:
  contents: read
  statuses: write

jobs:
  monitor:
    name: Cloudflare deploy / ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify environment isolation
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main)
              grep -Fq '"name": "orders-app"' wrangler.jsonc
              grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
              grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
              if grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then
                echo "Branch2 D1 binding leaked into main. Refusing deploy." >&2
                exit 10
              fi
              ;;
            branch2)
              grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
              grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
              grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
              if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
                echo "Production D1 binding leaked into branch2. Refusing deploy." >&2
                exit 11
              fi
              ;;
            *)
              echo "Unsupported branch: $GITHUB_REF_NAME" >&2
              exit 2
              ;;
          esac

      - name: Resolve target Worker
        id: target
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main) WORKER_NAME="orders-app" ;;
            branch2) WORKER_NAME="orders-app-branch2" ;;
            *) echo "Unsupported branch: $GITHUB_REF_NAME" >&2; exit 2 ;;
          esac
          echo "worker_name=$WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: Mark deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg c "cloudflare-deploy/$GITHUB_REF_NAME" --arg u "$RUN_URL" '{state:"pending",context:$c,description:"Waiting for Cloudflare Workers Build",target_url:$u}')" >/dev/null

      - name: Wait for matching Cloudflare build
        id: wait
        shell: bash
        env:
          WORKER_NAME: ${{ steps.target.outputs.worker_name }}
        run: |
          set -euo pipefail
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_API_TOKEN:-}" ]]; then
            echo "Cloudflare monitoring secrets are missing." >&2
            exit 3
          fi

          AUTH=(-H "Authorization: Bearer $CF_API_TOKEN")

          workers_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          worker_tag="$(jq -r --arg name "$WORKER_NAME" '.result[] | select(.id == $name) | .tag // empty' <<<"$workers_json" | head -n1)"
          if [[ -z "$worker_tag" ]]; then
            echo "Could not resolve immutable tag for Worker $WORKER_NAME." >&2
            jq -r '.errors[]?.message' <<<"$workers_json" >&2 || true
            exit 4
          fi
          echo "Resolved $WORKER_NAME tag: $worker_tag"

          build_uuid=""
          outcome=""
          status=""
          for attempt in $(seq 1 48); do
            builds_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/builds/workers/$worker_tag/builds")"
            match="$(jq -c --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '
              [.result[]? | select(.build_trigger_metadata.commit_hash == $sha and .build_trigger_metadata.branch == $branch)]
              | sort_by(.created_on) | last // empty
            ' <<<"$builds_json")"

            if [[ -n "$match" ]]; then
              build_uuid="$(jq -r '.build_uuid // empty' <<<"$match")"
              status="$(jq -r '.status // empty' <<<"$match")"
              outcome="$(jq -r '.build_outcome // empty' <<<"$match")"
              echo "Cloudflare build $build_uuid: status=$status outcome=${outcome:-pending}"
              if [[ "$status" == "stopped" ]]; then
                break
              fi
            else
              echo "Waiting for Cloudflare build for $GITHUB_SHA (attempt $attempt/48)..."
              if [[ "$GITHUB_REF_NAME" == "branch2" && "$attempt" -ge 12 ]]; then
                echo "fallback_required=true" >> "$GITHUB_OUTPUT"
                echo "No matching native Cloudflare build appeared for Branch2 after 2 minutes; switching to the guarded direct Branch2 deploy fallback."
                exit 0
              fi
            fi
            sleep 10
          done

          if [[ -z "$build_uuid" ]]; then
            echo "Cloudflare build for commit $GITHUB_SHA did not appear within 8 minutes." >&2
            exit 5
          fi
          if [[ "$status" != "stopped" ]]; then
            echo "Cloudflare build $build_uuid did not finish within 8 minutes." >&2
            exit 6
          fi

          echo "build_uuid=$build_uuid" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

          if [[ "$outcome" == "skipped" && "$GITHUB_REF_NAME" == "branch2" ]]; then
            echo "fallback_required=true" >> "$GITHUB_OUTPUT"
            echo "Native Cloudflare build was skipped for Branch2; switching to the guarded direct Branch2 deploy fallback."
            exit 0
          fi
          echo "fallback_required=false" >> "$GITHUB_OUTPUT"

          if [[ "$outcome" != "success" ]]; then
            echo "Cloudflare build failed with outcome: ${outcome:-unknown}" >&2
            echo "----- Cloudflare build log -----"
            cursor=""
            stale_build_token=false
            for page in $(seq 1 20); do
              url="$CF_API/accounts/$CF_ACCOUNT_ID/builds/builds/$build_uuid/logs"
              if [[ -n "$cursor" ]]; then
                url="$url?cursor=$(printf '%s' "$cursor" | jq -sRr @uri)"
              fi
              logs_json="$(curl --fail-with-body -sS "${AUTH[@]}" "$url")"
              page_log="$(jq -r '.result.lines[]? | if type == "array" then (map(tostring) | join(" ")) else tostring end' <<<"$logs_json")"
              printf '%s\n' "$page_log"
              if grep -Fq 'build token selected for this build has been deleted or rolled' <<<"$page_log"; then
                stale_build_token=true
              fi
              truncated="$(jq -r '.result.truncated // false' <<<"$logs_json")"
              cursor="$(jq -r '.result.cursor // empty' <<<"$logs_json")"
              [[ "$truncated" == "true" && -n "$cursor" ]] || break
            done
            echo "----- end Cloudflare build log -----"

            if [[ "$GITHUB_REF_NAME" == "branch2" && "$stale_build_token" == "true" ]]; then
              echo "fallback_required=true" >> "$GITHUB_OUTPUT"
              echo "Cloudflare native build token is unavailable for Branch2; switching to the guarded direct Branch2 deploy fallback."
              exit 0
            fi

            exit 7
          fi

          # A successful Cloudflare build is not evidence that the publicly served
          # lazy-loaded frontend chunks were updated. This gate specifically
          # protects the distinct Branch2 Worker, never the Production Worker.
          if [[ "$GITHUB_REF_NAME" == "branch2" ]]; then
            for check_attempt in $(seq 1 10); do
              if node scripts/verify-branch2-live-ui.mjs; then
                echo "Branch2 published frontend verified."
                exit 0
              fi
              echo "Branch2 public UI is still stale (check $check_attempt/10)."
              sleep 6
            done
            echo "fallback_required=true" >> "$GITHUB_OUTPUT"
            echo "Native build succeeded but is serving stale assets. Use the existing guarded Branch2-only direct deploy."
            exit 0
          fi

      - name: Setup Node 24 for Branch2 direct deploy fallback
        if: steps.wait.outputs.fallback_required == 'true' && github.ref_name == 'branch2'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies for Branch2 direct deploy fallback
        if: steps.wait.outputs.fallback_required == 'true' && github.ref_name == 'branch2'
        run: npm ci

      - name: Verify and deploy exact Branch2 commit after native skip
        if: steps.wait.outputs.fallback_required == 'true' && github.ref_name == 'branch2'
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "branch2" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Fq 'orders_db_prod' wrangler.jsonc || grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Production D1 identity detected in Branch2 fallback. Refusing deploy." >&2
            exit 31
          fi
          npm run release:check
          npm run deploy

      - name: Verify exact public Branch2 frontend after repair
        if: success() && github.ref_name == 'branch2'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node scripts/verify-branch2-live-ui.mjs; then
              echo "Branch2 public site serves the expected Catalog Integrity interface."
              exit 0
            fi
            echo "Waiting for public frontend asset propagation ($attempt/12)..."
            sleep 5
          done
          echo "Branch2 frontend still stale even after deployment; do not declare deploy successful." >&2
          exit 32

      - name: Mark deploy success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg c "cloudflare-deploy/$GITHUB_REF_NAME" --arg d "Cloudflare deploy succeeded" --arg u "$RUN_URL" '{state:"success",context:$c,description:$d,target_url:$u}')" >/dev/null

      - name: Mark deploy failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(jq -nc --arg c "cloudflare-deploy/$GITHUB_REF_NAME" --arg d "Cloudflare deploy failed; inspect workflow log" --arg u "$RUN_URL" '{state:"failure",context:$c,description:$d,target_url:$u}')" >/dev/null
