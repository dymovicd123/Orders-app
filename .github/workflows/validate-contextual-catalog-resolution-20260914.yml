name: Validate contextual catalog resolution 20260914

on:
  push:
    branches:
      - fix/contextual-catalog-resolution-20260914
    paths:
      - .github/workflows/validate-contextual-catalog-resolution-20260914.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Focused contextual regression
        run: node scripts/test-contextual-catalog-resolution-r1.mjs
      - name: Worker preservation gate
        run: node scripts/test-step1906a-worker-modularization.mjs
      - name: Frontend preservation gate
        run: node scripts/test-step1906b-frontend-modularization.mjs
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff guard
        run: git diff --check
# rerun full gate after multiline resolver lazy check
