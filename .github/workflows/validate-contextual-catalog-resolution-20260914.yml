name: Validate contextual catalog resolution 20260914

on:
  push:
    branches:
      - fix/contextual-catalog-resolution-20260914
    paths:
      - .github/workflows/validate-contextual-catalog-resolution-20260914.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Worker preservation gate
        run: node scripts/test-step1906a-worker-modularization.mjs
      - name: Frontend preservation gate
        run: node scripts/test-step1906b-frontend-modularization.mjs
