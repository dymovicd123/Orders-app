name: "Main reviewed warehouse and resolver release (one shot)"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/main-resolver-selective-20261022.yml']
permissions:
  contents: read
concurrency:
  group: main-reviewed-stage12-once
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(main-stages12):')
    name: "Guarded Main Worker deploy — NO D1 writes"
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout exact reviewed Main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact Main source and bind production Worker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD^)" = '0a51ed73636ca626e2b81e4c425ed9758244f05f'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {readFileSync,writeFileSync} from 'node:fs'
          const raw=readFileSync('wrangler.jsonc','utf8')
          for(const v of [
            '"name": "orders-app"',
            '"database_name": "orders_db_prod"',
            '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"',
          ]) assert(raw.includes(v),'Unexpected Main binding '+v)
          for(const v of ['orders-app-branch2','orders_db_branch2_mirror_20261027'])
            assert(!raw.includes(v),'Test Worker/DB target forbidden')
          assert(raw.includes('"assets": {'),'Missing assets declaration')
          writeFileSync('.main-stage12-release.jsonc',raw.replace('"assets": {','"assets": {\n    "directory": "./dist/client",'))
          console.log('MAIN_REVIEWED_STAGE12_TARGET_PASS')
          NODE
      - name: Build only, reviewed Quality CI already succeeded
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx wrangler deploy --dry-run --config .main-stage12-release.jsonc --outdir .main-stage12-dry-run
      - name: Read-only production baseline fingerprint
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config .main-stage12-release.jsonc --command="
            SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items) AS items_count,
              (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS received,
              (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS debt,
              (SELECT COUNT(*) FROM returns) AS returns_count,
              (SELECT COUNT(*) FROM exchanges) AS exchanges_count,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved,
              (SELECT COUNT(*) FROM inventory_reservations) AS reservations,
              (SELECT COUNT(*) FROM inventory_movements) AS movements
          " --json | jq -cSe '.[0].results[0]' > "$RUNNER_TEMP/main-before.json"
      - name: Save Time Travel pre-release bookmark
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/17e68a41-1d58-4a36-8a63-47c3e32443c4/time_travel/bookmark" \
            | jq -e -r 'if .success==true and (.result.bookmark|type=="string") and (.result.bookmark|length>=32) then .result.bookmark else error("No recovery bookmark") end' > "$RUNNER_TEMP/main-bookmark"
          test -s "$RUNNER_TEMP/main-bookmark"
          echo "Production D1 Time Travel bookmark captured; no database migration or write."
      - name: Deploy production Worker only, without migration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config .main-stage12-release.jsonc
      - name: Confirm remote Main remains accessible, data unchanged
        shell: bash
        run: |
          set -euo pipefail
          root='https://orders-app.orders-clothes.workers.dev'
          code="$(curl --fail-with-body -sS --max-time 25 -o /dev/null -w '%{http_code}' "$root/api/auth/status")"
          test "$code" = 200
          code="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$root/api/orders")"
          test "$code" = 401
          npx wrangler d1 execute orders_db_prod --remote --config .main-stage12-release.jsonc --command="
            SELECT
              (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM order_items) AS items_count,
              (SELECT COALESCE(SUM(total_amount),0) FROM orders) AS orders_total,
              (SELECT COALESCE(SUM(received_amount),0) FROM orders) AS received,
              (SELECT COALESCE(SUM(debt_amount),0) FROM orders) AS debt,
              (SELECT COUNT(*) FROM returns) AS returns_count,
              (SELECT COUNT(*) FROM exchanges) AS exchanges_count,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS reserved,
              (SELECT COUNT(*) FROM inventory_reservations) AS reservations,
              (SELECT COUNT(*) FROM inventory_movements) AS movements
          " --json | jq -cSe '.[0].results[0]' > "$RUNNER_TEMP/main-after.json"
          cmp "$RUNNER_TEMP/main-before.json" "$RUNNER_TEMP/main-after.json"
          echo 'MAIN_STAGE12_WORKER_DEPLOY_PASS: HTTP 200/401; no schema, stock, reservation, money or order data changed'
