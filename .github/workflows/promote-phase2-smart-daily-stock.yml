name: Promote Phase 2 smart daily stock

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-phase2-smart-daily-stock.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact pre-Phase2 main baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=975ccecd965a15cba4325a53d7dddc41a92eae54
          files=(package.json scripts/test-step1906a-worker-modularization.mjs scripts/test-step1906b-frontend-modularization.mjs src/features/inventory/views/renderInventoryOverviewPanel.tsx src/features/sections/InventorySection.tsx src/styles/188i-cycle-counts.css worker/index.ts)
          for file in "${files[@]}"; do
            current="$(git rev-parse "HEAD:$file")"
            baseline="$(git rev-parse "$BASE:$file")"
            [[ "$current" == "$baseline" ]] || { echo "Baseline mismatch: $file current=$current baseline=$baseline" >&2; exit 10; }
          done
          ! git cat-file -e HEAD:scripts/test-phase2-smart-daily-stock.mjs 2>/dev/null || { echo 'Phase 2 test unexpectedly exists on main' >&2; exit 11; }
          ! git cat-file -e HEAD:src/features/inventory/routineCycleCount.ts 2>/dev/null || { echo 'routineCycleCount.ts unexpectedly exists on main' >&2; exit 12; }
      - name: Apply exact clean tested Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=e84e26827814e6fd02f255e785a29180ba1f9f9f
          files=(package.json scripts/test-phase2-smart-daily-stock.mjs scripts/test-step1906a-worker-modularization.mjs scripts/test-step1906b-frontend-modularization.mjs src/features/inventory/routineCycleCount.ts src/features/inventory/views/renderInventoryOverviewPanel.tsx src/features/sections/InventorySection.tsx src/styles/188i-cycle-counts.css worker/index.ts)
          git checkout "$SOURCE" -- "${files[@]}"
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$'package.json\nscripts/test-phase2-smart-daily-stock.mjs\nscripts/test-step1906a-worker-modularization.mjs\nscripts/test-step1906b-frontend-modularization.mjs\nsrc/features/inventory/routineCycleCount.ts\nsrc/features/inventory/views/renderInventoryOverviewPanel.tsx\nsrc/features/sections/InventorySection.tsx\nsrc/styles/188i-cycle-counts.css\nworker/index.ts'
          test "$changed" = "$expected"
          ! grep -R "phase2accept" package.json scripts/test-phase2-smart-daily-stock.mjs src/features/inventory src/features/sections/InventorySection.tsx src/styles/188i-cycle-counts.css worker/index.ts
          ! grep -R "ТЕСТ ·" src/features/inventory src/features/sections/InventorySection.tsx
          ! git diff -- "${files[@]}" | grep -E "inventoryArrival|Приход" >/dev/null
      - name: Install dependencies
        run: npm ci
      - name: Full main release gate
        run: npm run release:check
      - name: Commit tested promotion and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/promote-phase2-smart-daily-stock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Promote Phase 2 smart daily stock truth"
          git push origin HEAD:main
