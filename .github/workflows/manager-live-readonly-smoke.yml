name: Manager live read-only smoke

on:
  push:
    branches: [safe/manager-routine-access-r1-20260902]
    paths:
      - scripts/.manager-live-readonly-smoke-trigger

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install browser harness only
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Live manager smoke without mutations
        env:
          APP_URL: https://orders-app.orders-clothes.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const pageErrors = [];
          const consoleErrors = [];
          const mutations = [];
          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()) });
          page.on('request', req => { if (['POST','PATCH','PUT','DELETE'].includes(req.method())) mutations.push(`${req.method()} ${req.url()}`) });
          const base = process.env.APP_URL;
          await page.goto(`${base}/#orders`, { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForTimeout(2500);
          const status = await page.evaluate(async () => (await fetch('/api/admin-mode/status', { credentials: 'include' })).json());
          const ordersApi = await page.evaluate(async () => {
            const r = await fetch('/api/orders?limit=100&archiveMode=active', { credentials: 'include' });
            return { status: r.status, data: await r.json() };
          });
          const rows = page.locator('tr[data-order-id]');
          const rowCount = await rows.count();
          const editButtons = page.getByRole('button', { name: 'Редактировать', exact: true });
          const editCount = await editButtons.count();
          const sendButtons = page.getByRole('button', { name: 'Отправить клиенту', exact: true });
          const sendCount = await sendButtons.count();
          const handoverButtons = page.getByRole('button', { name: /Уточнить выдачу|Выдать готовые товары/ });
          const handoverCount = await handoverButtons.count();
          const returnCount = await page.getByRole('button', { name: 'Возврат', exact: true }).count();
          const exchangeCount = await page.getByRole('button', { name: 'Обмен', exact: true }).count();
          let editorVisible = false;
          let saveVisible = false;
          let saveEnabled = false;
          if (editCount > 0) {
            await editButtons.first().click();
            await page.waitForTimeout(1500);
            editorVisible = await page.getByText(/Редактирование заказа/i).first().isVisible().catch(() => false);
            const save = page.getByRole('button', { name: /Сохранить изменения/i }).first();
            saveVisible = await save.isVisible().catch(() => false);
            saveEnabled = saveVisible ? await save.isEnabled().catch(() => false) : false;
          }
          await page.goto(`${base}/#workshop`, { waitUntil: 'networkidle', timeout: 60000 });
          await page.waitForTimeout(2000);
          const workshopEditCount = await page.getByRole('button', { name: 'Редактировать заказ', exact: true }).count();
          const workshopDoneCount = await page.getByRole('button', { name: /Готово|Отметить готовым/ }).count();
          const result = {
            role: status?.isAdmin ? 'admin' : 'manager',
            ordersHttp: ordersApi.status,
            apiOrders: Array.isArray(ordersApi.data?.orders) ? ordersApi.data.orders.length : null,
            rowCount, editCount, sendCount, handoverCount, returnCount, exchangeCount,
            editorVisible, saveVisible, saveEnabled,
            workshopEditCount, workshopDoneCount,
            pageErrors, consoleErrors, mutations
          };
          console.log('MANAGER_LIVE_SMOKE=' + JSON.stringify(result, null, 2));
          if (status?.isAdmin) throw new Error('Smoke accidentally ran as admin');
          if (ordersApi.status !== 200) throw new Error(`Orders API failed: ${ordersApi.status}`);
          if (rowCount === 0) throw new Error('No live order rows available for manager verification');
          if (editCount === 0) throw new Error('No manager edit action visible');
          if (!editorVisible || !saveVisible || !saveEnabled) throw new Error('Manager editor is not fully usable');
          if (sendCount === 0 && handoverCount === 0) throw new Error('No final-send or handover action visible on live unshipped orders');
          if (returnCount === 0 || exchangeCount === 0) throw new Error('Routine return/exchange actions not visible');
          if (workshopEditCount === 0) throw new Error('Workshop order edit action not visible to manager');
          if (pageErrors.length || consoleErrors.length) throw new Error('Runtime errors occurred during manager smoke');
          if (mutations.length) throw new Error('Read-only smoke unexpectedly emitted mutation request(s)');
          await browser.close();
          NODE
