name: W5.6 stocktake outcome

on:
  push:
    branches:
      - safe/w5-6-stocktake-outcome-20260906

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/w5-6-stocktake-outcome-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply W5.6
        run: python3 scripts/w5-6-stocktake-outcome-patcher.py
      - name: Build exact frontend manifest
        run: node scripts/w5-6-stocktake-outcome-manifest-helper.mjs
      - name: Focused regression
        run: |
          git diff --check
          node scripts/test-w5-6-stocktake-outcome.mjs
      - name: Keep Worker truth unchanged
        run: git diff --exit-code origin/main -- worker/
      - name: Cumulative release gate
        run: npm run release:check
      - name: Database safety
        run: npm run verify:db-safety
      - name: TypeScript and build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Ensure no migration or schema change
        run: |
          if git diff --name-only origin/main | grep -E '(^|/)(migrations?|schema)(/|\.|$)' ; then
            echo 'Unexpected migration/schema change in W5.6'
            exit 1
          fi
      - name: Commit validated candidate
        run: |
          rm .github/workflows/w5-6-stocktake-outcome.yml
          rm scripts/w5-6-stocktake-outcome-patcher.py scripts/w5-6-stocktake-outcome-manifest-helper.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'W5.6: explain stocktake outcome and consequences'
          git push origin HEAD:safe/w5-6-stocktake-outcome-20260906
