name: Cloudflare Branch2 - Deploy Return V2 Worker (Flag OFF)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_BRANCH2_FLAG_OFF to deploy the test Worker only"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-branch2-return-v2-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require explicit Branch2-only approval
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "DEPLOY_BRANCH2_FLAG_OFF" ]; then
            echo "::error::To deploy only the test Worker, type DEPLOY_BRANCH2_FLAG_OFF."
            exit 2
          fi

      - name: Checkout isolated operations guard from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout test source (never Main Worker source)
        uses: actions/checkout@v4
        with:
          ref: branch2
          path: stage
          persist-credentials: false

      - name: Verify production separation and migrated Branch2 schema (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 .github/scripts/branch2_v2_stage_guard.py --stage stage --expected-index 9
          echo 'Confirmed 9/9 tables, 10/10 columns, exact immutable SQL and distinct Main/Branch2 D1 IDs.'

      - name: Generate temporary Branch2 config with Return V2 explicitly OFF
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path('stage/wrangler.jsonc')
          config = json.loads(src.read_text(encoding='utf-8'))
          assert config['name'] == 'orders-app-branch2'
          db = config['d1_databases']
          assert len(db) == 1 and db[0]['binding'] == 'DB'
          assert db[0]['database_name'] == 'orders_db_branch2_mirror_20261027'
          assert db[0]['database_id'] == '0904a573-21ff-44d8-93b0-c9200f771702'
          assert config.get('vars', {}).get('RETURN_V2_ENABLED') not in (True, 'true')
          assert 'env' not in config, 'Unexpected Wrangler environment; abort deployment.'
          config['vars'] = {**config.get('vars', {}), 'RETURN_V2_ENABLED': 'false'}
          dst = Path('stage/wrangler.v2-off.jsonc')
          dst.write_text(json.dumps(config, indent=2)+'\n', encoding='utf-8')
          print('Generated temporary Worker target:', config['name'])
          print('D1 binding:', db[0]['database_name'])
          print('RETURN_V2_ENABLED explicitly set to false for this deploy.')
          PY

      - name: Install pinned dependencies for Branch2 only
        working-directory: stage
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build test Worker
        working-directory: stage
        run: npm run build

      - name: Wrangler dry-run test Worker compilation (NO upload)
        working-directory: stage
        run: |
          npx --no-install wrangler deploy --config wrangler.v2-off.jsonc \
            --name orders-app-branch2 --dry-run

      - name: Deploy only Branch2 Worker with Return V2 OFF
        working-directory: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy --config wrangler.v2-off.jsonc \
            --name orders-app-branch2
          echo 'Deployed ONLY orders-app-branch2 with D1 test and Return V2 disabled.'

      - name: Verify remote Branch2 Worker binding and feature flag (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          account = os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token = os.environ['CLOUDFLARE_API_TOKEN'].strip()
          url = ('https://api.cloudflare.com/client/v4/accounts/'+account+
                 '/workers/scripts/orders-app-branch2/settings')
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer '+token, 'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)
          if not result.get('success'):
              raise SystemExit('STOP: Cloudflare rejected Worker settings read.')
          bindings = result.get('result', {}).get('bindings', [])
          flags = [x for x in bindings if x.get('name') == 'RETURN_V2_ENABLED']
          dbs = [x for x in bindings if x.get('name') == 'DB']
          if len(flags) != 1 or flags[0].get('type') != 'plain_text' or flags[0].get('text') != 'false':
              raise SystemExit('STOP: deployed Branch2 Return V2 feature is not proven OFF.')
          if len(dbs) != 1 or dbs[0].get('type') != 'd1' or (
              dbs[0].get('id') != '0904a573-21ff-44d8-93b0-c9200f771702'):
              raise SystemExit('STOP: deployed Branch2 D1 binding is not the expected test database.')
          print('PASS: deployed test Worker has RETURN_V2_ENABLED=false and only Branch2 D1 binding.')
          PY

      - name: Smoke public Branch2 authentication status (READ ONLY)
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = 'https://orders-app-branch2.orders-clothes.workers.dev/api/auth/status'
          req = urllib.request.Request(url, headers={'Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=25) as response:
              body = json.load(response)
              if response.status != 200:
                  raise SystemExit('Branch2 status HTTP response was not 200.')
          if not isinstance(body,dict):
              raise SystemExit('Branch2 status response not valid JSON object.')
          print('PASS: Branch2 public auth-status endpoint responds after deployment.')
          print('No Return V2 writes or private user data were requested.')
          PY

      - name: Summary
        if: success()
        run: |
          echo '## Branch2 Worker deployed with Return V2 disabled' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only orders-app-branch2 / D1 0904a573-21ff-44d8-93b0-c9200f771702.' >> "$GITHUB_STEP_SUMMARY"
          echo 'V2 migrated schema checked, temporary flag set to false, remote binding verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Main Worker and Main D1 were not modified by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Next step: separate Branch2-only feature flag + browser user acceptance.' >> "$GITHUB_STEP_SUMMARY"
