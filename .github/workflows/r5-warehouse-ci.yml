name: R5 warehouse CI

on:
  push:
    branches: [safe/d1-read-budget-r5-warehouse-20260902]
    paths:
      - scripts/.r5-warehouse-ci-trigger

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extend historical migration gates for R5.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Step 190.6C freezes historical migration preservation. R5.1 is a new, additive,
          # index-only migration and must be accepted without weakening the preservation check.
          path = Path('scripts/test-step1906c-dead-code-cleanup.mjs')
          text = path.read_text()
          old = "const acceptedAdditiveMigrations = ['0061_v72_warehouse_attention_truth_gates.sql']"
          new = "const acceptedAdditiveMigrations = ['0061_v72_warehouse_attention_truth_gates.sql', '0062_v72_d1_read_budget_r5_warehouse_indexes.sql']"
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('1906C additive migration allow-list anchor not found')

          # 192B2A and 192B2A1 themselves intentionally added no schema migration. Preserve those
          # historical invariants while allowing a later additive migration to exist.
          for filename, label in [
              ('scripts/test-step192b2a-daily-warehouse.mjs', '192B2A'),
              ('scripts/test-step192b2a1-attention-visibility.mjs', '192B2A1'),
          ]:
              path = Path(filename)
              text = path.read_text()
              old = f"  const migrations = fs.readdirSync(path.join(root, 'migrations')).filter((name) => name.endsWith('.sql')).sort()\n  check(migrations.at(-1) === '0061_v72_warehouse_attention_truth_gates.sql', '{label} must not add a" + (" schema" if label == '192B2A' else "") + " migration')"
              new = f"  const migrations = fs.readdirSync(path.join(root, 'migrations')).filter((name) => name.endsWith('.sql')).sort()\n  check(migrations.includes('0061_v72_warehouse_attention_truth_gates.sql'), '{label} historical migration ceiling is missing')\n  const migrationsThrough{label.replace('192','Step').replace('B','B').replace('A','A')} = migrations.filter((name) => name.localeCompare('0061_v72_warehouse_attention_truth_gates.sql') <= 0)\n  check(migrationsThrough{label.replace('192','Step').replace('B','B').replace('A','A')}.at(-1) === '0061_v72_warehouse_attention_truth_gates.sql', '{label} must not add a" + (" schema" if label == '192B2A' else "") + " migration')"
              if old in text:
                  path.write_text(text.replace(old, new, 1))
              elif "historical migration ceiling is missing" not in text:
                  raise SystemExit(f'{label} migration ceiling anchor not found')
          PY
      - run: npm ci
      - name: R5 targeted regression
        run: node scripts/test-d1-read-budget-r5.mjs
      - name: Database safety
        run: npm run verify:db-safety
      - name: Typecheck
        run: npm run typecheck
      - name: Full release regression
        run: npm run release:check
      - name: Build
        run: npm run build
      - name: Commit preservation-gate updates
        shell: bash
        run: |
          if git diff --quiet -- scripts/test-step1906c-dead-code-cleanup.mjs scripts/test-step192b2a-daily-warehouse.mjs scripts/test-step192b2a1-attention-visibility.mjs; then
            exit 0
          fi
          git config user.name "orders-r5-ci"
          git config user.email "orders-r5-ci@users.noreply.github.com"
          git add scripts/test-step1906c-dead-code-cleanup.mjs scripts/test-step192b2a-daily-warehouse.mjs scripts/test-step192b2a1-attention-visibility.mjs
          git commit -m "Accept additive R5.1 warehouse index migration"
          git push origin HEAD:safe/d1-read-budget-r5-warehouse-20260902
