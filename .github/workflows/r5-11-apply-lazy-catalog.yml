name: R5.11 apply lazy catalog

on:
  push:
    branches:
      - safe/d1-read-budget-r5-11-lazy-catalog-20260905
    paths:
      - .github/workflows/r5-11-apply-lazy-catalog.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run R5.11 lazy catalog patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact R5.11 patch
        run: python scripts/r5-11-apply-lazy-catalog.py
      - name: Remove one-shot patch helpers
        run: git rm .github/workflows/r5-11-apply-lazy-catalog.yml scripts/r5-11-apply-lazy-catalog.py
      - name: Commit clean release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx package.json scripts/test-d1-read-budget-r5-11.mjs
          git commit -m "R5.11: load full catalog only in product-aware panels"
          git push origin HEAD:safe/d1-read-budget-r5-11-lazy-catalog-20260905
