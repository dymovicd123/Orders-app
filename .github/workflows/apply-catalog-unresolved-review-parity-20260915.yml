name: Apply catalog unresolved review parity fix

on:
  push:
    branches:
      - fix/catalog-unresolved-review-parity-20260915
    paths:
      - .github/workflows/apply-catalog-unresolved-review-parity-20260915.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-unresolved-review-parity-20260915
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Apply guarded patch
        run: python scripts/patch-catalog-unresolved-review-parity-20260915.py
      - name: Accept exact declaration delta
        run: node scripts/update-catalog-review-parity-manifest.mjs
      - name: Focused regression
        run: node scripts/test-contextual-catalog-resolution-r1.mjs
      - name: Full release gate
        run: npm run release:check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/catalog-review.ts scripts/test-contextual-catalog-resolution-r1.mjs scripts/step1906a-worker-declaration-manifest.json
          git diff --cached --check
          git commit -m "fix: reconcile catalog_unresolved rows with existing ids"
          git push origin HEAD:fix/catalog-unresolved-review-parity-20260915
