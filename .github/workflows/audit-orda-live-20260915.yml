name: Audit ORDA live read-only

on:
  push:
    branches:
      - audit/orda-live-20260915
    paths:
      - .github/workflows/audit-orda-live-20260915.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
    steps:
      - name: Read-only Production reference map
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$DB_ID/query"
          query() {
            local label="$1"
            local sql="$2"
            echo
            echo "===== $label ====="
            body="$(jq -nc --arg sql "$sql" '{sql:$sql}')"
            response="$(curl -sS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$API" --data "$body")"
            jq '{success,errors,result:[.result[]? | {success,meta,results}]}' <<<"$response"
          }

          query "TABLES WITH PRODUCT OR VARIANT COLUMNS" "SELECT name, sql FROM sqlite_master WHERE type='table' AND (LOWER(COALESCE(sql,'')) LIKE '%product_id%' OR LOWER(COALESCE(sql,'')) LIKE '%variant_id%') ORDER BY name"
          query "ORDER ITEMS PRODUCT74" "SELECT COUNT(*) AS rows FROM order_items WHERE product_id=74"
          query "RESERVATIONS PRODUCT74" "SELECT COUNT(*) AS rows FROM inventory_reservations WHERE product_id=74"
          query "STOCK PRODUCT74" "SELECT COUNT(*) AS rows FROM inventory_stock WHERE product_id=74"
          query "MOVEMENTS PRODUCT74" "SELECT COUNT(*) AS rows FROM inventory_movements WHERE product_id=74"
          query "WORKSHOP PRODUCT74" "SELECT COUNT(*) AS rows FROM workshop_tasks WHERE product_id=74"
          query "VARIANTS PRODUCT74" "SELECT COUNT(*) AS rows FROM catalog_variants WHERE product_id=74"
          query "EXECUTIONS PRODUCT74" "SELECT COUNT(*) AS rows FROM catalog_stock_positions WHERE product_id=74"
          query "ORDER ITEMS VARIANTS" "SELECT COUNT(*) AS rows FROM order_items WHERE variant_id BETWEEN 1259 AND 1270"
          query "RESERVATIONS VARIANTS" "SELECT COUNT(*) AS rows FROM inventory_reservations WHERE variant_id BETWEEN 1259 AND 1270"
          query "STOCK VARIANTS" "SELECT COUNT(*) AS rows FROM inventory_stock WHERE variant_id BETWEEN 1259 AND 1270"
          query "MOVEMENTS VARIANTS" "SELECT COUNT(*) AS rows FROM inventory_movements WHERE variant_id BETWEEN 1259 AND 1270"
          query "WORKSHOP VARIANTS" "SELECT COUNT(*) AS rows FROM workshop_tasks WHERE variant_id BETWEEN 1259 AND 1270"
          query "INPUT ALIASES VARIANTS" "SELECT COUNT(*) AS rows FROM catalog_input_aliases WHERE variant_id BETWEEN 1259 AND 1270"
          query "LIFECYCLE VARIANTS" "SELECT COUNT(*) AS rows FROM inventory_lifecycle_events WHERE variant_id BETWEEN 1259 AND 1270"
          echo
          echo "READ_ONLY_REFERENCE_MAP_COMPLETE=1"
