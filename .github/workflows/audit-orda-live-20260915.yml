name: Audit ORDA live read-only

on:
  push:
    branches:
      - audit/orda-live-20260915
    paths:
      - .github/workflows/audit-orda-live-20260915.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_ID: 17e68a41-1d58-4a36-8a63-47c3e32443c4
    steps:
      - name: Read-only Production reference map
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/$DB_ID/query"
          query() {
            local label="$1" sql="$2"
            echo "===== $label ====="
            body="$(jq -nc --arg sql "$sql" '{sql:$sql}')"
            response="$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" "$API" --data "$body")"
            jq '{success,errors,result:[.result[]? | {success,meta,results}]}' <<<"$response"
          }

          query "TRANSFER ITEMS ORDA VARIANTS" "SELECT COUNT(*) AS rows FROM inventory_transfer_items WHERE variant_id BETWEEN 1259 AND 1270"
          query "TRANSFER ITEMS ORDA DETAIL" "SELECT * FROM inventory_transfer_items WHERE variant_id BETWEEN 1259 AND 1270 ORDER BY id"
          query "STOCK CHECKS ORDA VARIANTS" "SELECT COUNT(*) AS rows FROM inventory_stock_checks WHERE variant_id BETWEEN 1259 AND 1270"
          query "STOCKTAKE ITEMS ORDA VARIANTS" "SELECT COUNT(*) AS rows FROM inventory_stocktake_items WHERE variant_id BETWEEN 1259 AND 1270"
          query "IDENTITY LINKS ORDA PRODUCT" "SELECT COUNT(*) AS rows FROM catalog_identity_order_item_links WHERE product_id=74"
          query "IDENTITY LINKS ORDA VARIANTS" "SELECT COUNT(*) AS rows FROM catalog_identity_order_item_links WHERE variant_id BETWEEN 1259 AND 1270"
          query "MANUAL RETIREMENTS ORDA" "SELECT COUNT(*) AS rows FROM catalog_manual_retirements WHERE product_id=74 OR variant_id BETWEEN 1259 AND 1270"
          query "MERGE REPAIRS ORDA" "SELECT COUNT(*) AS rows FROM catalog_product_merge_repairs WHERE old_product_id=74 OR keeper_product_id=74"
          query "PRODUCT ALIASES TARGET74" "SELECT COUNT(*) AS rows FROM catalog_product_aliases WHERE product_id=74"
          query "INPUT ALIASES PRODUCT74" "SELECT COUNT(*) AS rows FROM catalog_input_aliases WHERE product_id=74 OR variant_id BETWEEN 1259 AND 1270"
          query "STOCKTAKE ACTIVE COLLISION" "SELECT COUNT(*) AS rows FROM inventory_stocktake_items i JOIN inventory_stocktake_sessions s ON s.id=i.session_id WHERE i.variant_id BETWEEN 1259 AND 1270 AND s.status='active'"
          query "TRANSFER DOCS ORDA" "SELECT d.id,d.status,i.id AS item_id,i.variant_id FROM inventory_transfer_items i JOIN inventory_transfer_documents d ON d.id=i.transfer_id WHERE i.variant_id BETWEEN 1259 AND 1270 ORDER BY d.id,i.id"
          echo "READ_ONLY_REFERENCE_MAP_COMPLETE=1"
