name: Validate Workshop sent-order manager fix

on:
  push:
    branches: [safe/manager-workshop-sent-edit-r2-20260902]
    paths:
      - scripts/.manager-workshop-fix-validate-trigger

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused manager regressions
        run: |
          node scripts/test-manager-workshop-sent-order-actions-r2.mjs
          node scripts/test-manager-routine-access-r1.mjs
          node scripts/test-operational-autonomy-r2.mjs
          node scripts/test-order-edit-autonomy.mjs
          node scripts/test-return-exchange-cancel-autonomy.mjs
      - name: Database safety
        run: npm run verify:db-safety
      - name: Typecheck
        run: npm run typecheck
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Production build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
