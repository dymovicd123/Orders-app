name: R5.10 Workshop enrichment build
# retry: declaration-neutral implementation

on:
  push:
    branches:
      - safe/r5-10-workshop-enrichment-20260905
    paths:
      - .github/workflows/r5-10-workshop-enrichment-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply measured Workshop read optimization
        run: python scripts/apply-r5-10-workshop-enrichment.py
      - name: Focused R5.10 regression
        run: node scripts/test-d1-read-budget-r5-10.mjs
      - name: Full release validation
        run: |
          npm run release:check
          npm run verify:db-safety
          npm run typecheck
          npm run build
          npm run lint
          npx --no-install wrangler deploy --dry-run
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add worker/domains/workshop.ts scripts/test-d1-read-budget-r5-10.mjs package.json
          git diff --cached --check
          git commit -m "Optimize Workshop variant enrichment reads"
          git push origin HEAD:safe/r5-10-workshop-enrichment-20260905
