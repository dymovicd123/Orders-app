name: Verify order edit payment method fix

on:
  push:
    branches:
      - safe/order-edit-payment-method-fix-20260901
    paths:
      - .github/workflows/verify-order-edit-payment-method-fix.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/order-edit-payment-method-fix-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply payment-method correction source
        run: python3 .github/scripts/apply-order-edit-payment-method-fix.py
      - name: Extend money-history mutation guard
        run: python3 .github/scripts/patch-payment-method-money-history-test.py
      - name: Update Finance F5 method-only guard
        run: python3 .github/scripts/patch-payment-method-finance-f5-test.py
      - name: Record exact Worker declaration delta
        run: node .github/scripts/record-order-edit-payment-method-manifest.mjs
      - name: Verify Arrival remains untouched
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only HEAD | grep -Ei 'arrival|115B'; then
            echo 'Arrival-related file unexpectedly changed' >&2
            git diff --name-only HEAD
            exit 2
          fi
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-order-edit-payment-method-fix.yml
          rm -f .github/scripts/apply-order-edit-payment-method-fix.py
          rm -f .github/scripts/record-order-edit-payment-method-manifest.mjs
          rm -f .github/scripts/patch-payment-method-money-history-test.py
          rm -f .github/scripts/patch-payment-method-finance-f5-test.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allow safe payment method correction in order edit'
          git push origin HEAD:safe/order-edit-payment-method-fix-20260901
