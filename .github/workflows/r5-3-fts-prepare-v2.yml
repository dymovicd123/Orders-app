name: R5.3 FTS order search prepare v2

on:
  push:
    branches:
      - safe/d1-read-budget-r5-3-fts-20260903
    paths:
      - scripts/.r5-3-fts-prepare-v2-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r5-3-fts-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Replay R5.3 source patch from reviewed v1 workflow
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/r5-3-fts-prepare.yml').read_text(encoding='utf-8').splitlines()

          def extract_run(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(workflow) if line.strip() == marker)
              run_index = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'run: |')
              run_indent = len(workflow[run_index]) - len(workflow[run_index].lstrip())
              content_indent = run_indent + 2
              out = []
              for line in workflow[run_index + 1:]:
                  if line.strip():
                      indent = len(line) - len(line.lstrip())
                      if indent <= run_indent:
                          break
                  out.append(line[content_indent:] if len(line) >= content_indent else '')
              return '\n'.join(out) + '\n'

          patch = extract_run('Patch R5.3 FTS search and regression gates')
          exec(compile(patch, '<r5-3-patch>', 'exec'), {'__name__': '__main__'})
          Path('/tmp/r5-3-register.sh').write_text(extract_run('Register exact R5.3 Worker declaration delta'), encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Register exact R5.3 Worker declaration delta
        shell: bash
        run: bash /tmp/r5-3-register.sh

      - name: Targeted R5.3 regression
        run: node scripts/test-d1-read-budget-r5-3.mjs

      - name: Validate FTS5 migration and trigger semantics on local D1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler-r5-3-fts
          cat > /tmp/r5-3-minimal.sql <<'SQL'
          CREATE TABLE managers (id INTEGER PRIMARY KEY, name TEXT);
          CREATE TABLE customers (id INTEGER PRIMARY KEY, phone_normalized TEXT, display_name TEXT);
          CREATE TABLE orders (
            id INTEGER PRIMARY KEY,
            external_id TEXT,
            order_date TEXT,
            manager_id INTEGER,
            manager_snapshot_name TEXT,
            customer_id INTEGER,
            city TEXT,
            delivery_type TEXT,
            comment TEXT
          );
          CREATE TABLE order_items (
            id INTEGER PRIMARY KEY,
            order_id INTEGER,
            product_name_snapshot TEXT,
            gender_snapshot TEXT,
            color_snapshot TEXT,
            material_snapshot TEXT,
            length_snapshot TEXT,
            size_snapshot TEXT
          );
          CREATE TABLE payments (id INTEGER PRIMARY KEY, order_id INTEGER, method TEXT, comment TEXT);
          SQL
          npx wrangler d1 execute orders_db_prod --local --persist-to .wrangler-r5-3-fts --file /tmp/r5-3-minimal.sql --json >/tmp/r5-3-schema.json
          npx wrangler d1 execute orders_db_prod --local --persist-to .wrangler-r5-3-fts --file migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql --json >/tmp/r5-3-migration.json
          cat > /tmp/r5-3-smoke.sql <<'SQL'
          INSERT INTO managers(id,name) VALUES (1,'Алина');
          INSERT INTO customers(id,phone_normalized,display_name) VALUES (1,'77001234567','Иван');
          INSERT INTO orders(id,external_id,order_date,manager_id,manager_snapshot_name,customer_id,city,delivery_type,comment)
            VALUES (1,'ORD-TEST-001','2026-09-03',1,'Алина',1,'Алматы','pickup','тестовый "поиск"');
          INSERT INTO order_items(id,order_id,product_name_snapshot,gender_snapshot,color_snapshot,material_snapshot,length_snapshot,size_snapshot)
            VALUES (1,1,'ШАПАН','МУЖ','ЧЕРНЫЙ','ЛЕН','','52');
          INSERT INTO payments(id,order_id,method,comment) VALUES (1,1,'KASPI','оплачено');
          SELECT 'item_initial' AS probe, COUNT(*) AS count FROM order_search_items_fts WHERE order_search_items_fts MATCH '"ШАП"';
          SELECT 'item_case_variants' AS probe, COUNT(*) AS count FROM order_search_items_fts WHERE order_search_items_fts MATCH '"шап" OR "ШАП"';
          SELECT 'manager_initial' AS probe, COUNT(*) AS count FROM order_search_orders_fts WHERE order_search_orders_fts MATCH '"Али"';
          SELECT 'customer_initial' AS probe, COUNT(*) AS count FROM order_search_orders_fts WHERE order_search_orders_fts MATCH '"Ива"';
          SELECT 'payment_initial' AS probe, COUNT(*) AS count FROM order_search_payments_fts WHERE order_search_payments_fts MATCH '"KAS"';
          UPDATE order_items SET product_name_snapshot='КАМЗОЛ' WHERE id=1;
          SELECT 'item_old_after_update' AS probe, COUNT(*) AS count FROM order_search_items_fts WHERE order_search_items_fts MATCH '"ШАП"';
          SELECT 'item_new_after_update' AS probe, COUNT(*) AS count FROM order_search_items_fts WHERE order_search_items_fts MATCH '"КАМ"';
          UPDATE managers SET name='Бекзат' WHERE id=1;
          SELECT 'manager_old_after_update' AS probe, COUNT(*) AS count FROM order_search_orders_fts WHERE order_search_orders_fts MATCH '"Али"';
          SELECT 'manager_new_after_update' AS probe, COUNT(*) AS count FROM order_search_orders_fts WHERE order_search_orders_fts MATCH '"Бек"';
          UPDATE customers SET display_name='Петр' WHERE id=1;
          SELECT 'customer_old_after_update' AS probe, COUNT(*) AS count FROM order_search_orders_fts WHERE order_search_orders_fts MATCH '"Ива"';
          SELECT 'customer_new_after_update' AS probe, COUNT(*) AS count FROM order_search_orders_fts WHERE order_search_orders_fts MATCH '"Пет"';
          UPDATE payments SET method='CASH' WHERE id=1;
          SELECT 'payment_old_after_update' AS probe, COUNT(*) AS count FROM order_search_payments_fts WHERE order_search_payments_fts MATCH '"KAS"';
          SELECT 'payment_new_after_update' AS probe, COUNT(*) AS count FROM order_search_payments_fts WHERE order_search_payments_fts MATCH '"CAS"';
          DELETE FROM order_items WHERE id=1;
          SELECT 'item_after_delete' AS probe, COUNT(*) AS count FROM order_search_items_fts WHERE order_search_items_fts MATCH '"КАМ"';
          DELETE FROM payments WHERE id=1;
          SELECT 'payment_after_delete' AS probe, COUNT(*) AS count FROM order_search_payments_fts WHERE order_search_payments_fts MATCH '"CAS"';
          DELETE FROM orders WHERE id=1;
          SELECT 'order_after_delete' AS probe, COUNT(*) AS count FROM order_search_orders_fts WHERE order_search_orders_fts MATCH '"Бек"';
          SQL
          npx wrangler d1 execute orders_db_prod --local --persist-to .wrangler-r5-3-fts --file /tmp/r5-3-smoke.sql --json > /tmp/r5-3-smoke.json
          python <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/r5-3-smoke.json').read_text(encoding='utf-8'))
          probes = {}
          for result in data:
              for row in result.get('results') or []:
                  if 'probe' in row:
                      probes[str(row['probe'])] = int(row.get('count', -1))
          expected = {
            'item_initial': 1,
            'item_case_variants': 1,
            'manager_initial': 1,
            'customer_initial': 1,
            'payment_initial': 1,
            'item_old_after_update': 0,
            'item_new_after_update': 1,
            'manager_old_after_update': 0,
            'manager_new_after_update': 1,
            'customer_old_after_update': 0,
            'customer_new_after_update': 1,
            'payment_old_after_update': 0,
            'payment_new_after_update': 1,
            'item_after_delete': 0,
            'payment_after_delete': 0,
            'order_after_delete': 0,
          }
          if probes != expected:
              raise SystemExit(f'Local D1 FTS smoke mismatch: {probes!r}')
          print('R5.3 LOCAL D1 FTS SMOKE PASSED')
          PY

      - name: Database safety
        run: npm run verify:db-safety
      - name: Typecheck
        run: npm run typecheck
      - name: Full release check
        run: npm run release:check
      - name: Production build
        run: npm run build

      - name: Commit prepared R5.3 FTS
        run: |
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add worker/domains/orders-read.ts migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql package.json scripts/test-d1-read-budget-r5-3.mjs scripts/test-d1-read-budget-r4.mjs scripts/test-step1906a-worker-modularization.mjs scripts/d1-read-budget-r5-3-worker-manifest.json scripts/test-step1906c-dead-code-cleanup.mjs
          git commit -m "Add trigram FTS order search index"
          git push origin HEAD:safe/d1-read-budget-r5-3-fts-20260903
