name: R6.2 structural

on:
  push:
    branches:
      - d1-read-budget-r6-2-finance-payment-join

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d1-read-budget-r6-2-finance-payment-join
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute exact listFinanceReports hashes and patch 190.6A wrapper
        shell: bash
        run: |
          git show origin/main:worker/domains/finance-reports.ts > /tmp/r6-before.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'

          const hashDecl = (file) => {
            const text = fs.readFileSync(file, 'utf8')
            const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            const statement = source.statements.find((s) => ts.isFunctionDeclaration(s) && s.name?.text === 'listFinanceReports')
            if (!statement) throw new Error('listFinanceReports declaration not found: ' + file)
            const normalized = statement.getText(source).replace(/^export\s+/, '')
            return crypto.createHash('sha256').update(normalized).digest('hex')
          }

          const before = hashDecl('/tmp/r6-before.ts')
          const after = hashDecl('worker/domains/finance-reports.ts')
          if (before === after) throw new Error('R6.2 listFinanceReports hash did not change')
          const manifest = {
            version: 1,
            revision: 'd1-read-budget-r6-2-finance-payment-customer-join-r1',
            changes: { listFinanceReports: { before, after } },
          }
          fs.writeFileSync('scripts/d1-read-budget-r6-2-worker-manifest.json', JSON.stringify(manifest, null, 2) + '\n')

          const path = 'scripts/test-step1906a-worker-modularization.mjs'
          let text = fs.readFileSync(path, 'utf8')
          const pathAnchor = "const operationalAutonomyA5ManifestPath = path.join(root, 'scripts/operational-autonomy-a5-worker-manifest.json')\n"
          if (!text.includes(pathAnchor)) throw new Error('R6.2 1906A manifest path anchor missing')
          text = text.replace(pathAnchor, pathAnchor + "const d1ReadBudgetR62ManifestPath = path.join(root, 'scripts/d1-read-budget-r6-2-worker-manifest.json')\n")

          const loadAnchor = "if (!operationalAutonomyA5Manifest.router?.block) throw new Error('Operational Autonomy A5 Worker route block missing')\n"
          if (!text.includes(loadAnchor)) throw new Error('R6.2 1906A load anchor missing')
          const loadBlock = [
            loadAnchor.trimEnd(),
            "const d1ReadBudgetR62Manifest = JSON.parse(fs.readFileSync(d1ReadBudgetR62ManifestPath, 'utf8'))",
            "if (d1ReadBudgetR62Manifest?.version !== 1 || d1ReadBudgetR62Manifest?.revision !== 'd1-read-budget-r6-2-finance-payment-customer-join-r1') throw new Error('D1 read budget R6.2 Worker manifest invalid')",
            "if (Object.keys(d1ReadBudgetR62Manifest.changes || {}).join(',') !== 'listFinanceReports') throw new Error('D1 read budget R6.2 Worker allow-list widened unexpectedly')",
            '',
          ].join('\n')
          text = text.replace(loadAnchor, loadBlock)

          const finalCheck = "      sha(declarations.get(name)) === acceptedPostCatalogUnisexMergeHash,"
          if (!text.includes(finalCheck)) throw new Error('R6.2 1906A final declaration hash anchor missing')
          const exactChangesLiteral = JSON.stringify(manifest.changes)
          const replacement = [
            "      (() => {",
            `        const r62Changed = ${exactChangesLiteral}[name]`,
            "        if (!r62Changed) return sha(declarations.get(name)) === acceptedPostCatalogUnisexMergeHash",
            "        check(r62Changed.before === acceptedPostCatalogUnisexMergeHash, 'D1 read budget R6.2 baseline hash mismatch: ' + name)",
            "        return sha(declarations.get(name)) === r62Changed.after",
            "      })(),",
          ].join('\n')
          text = text.replace(finalCheck, replacement)
          fs.writeFileSync(path, text)
          console.log({ before, after })
          NODE
      - name: Run structural and focused tests
        run: |
          node scripts/test-d1-read-budget-r6-2.mjs
          node scripts/test-step1906a-worker-modularization.mjs
      - name: Commit exact structural allowance and remove temp workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r6-2-structural.yml
          git add scripts/d1-read-budget-r6-2-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          git commit -m "R6.2: register exact Finance read structural delta"
          git push origin HEAD:d1-read-budget-r6-2-finance-payment-join
