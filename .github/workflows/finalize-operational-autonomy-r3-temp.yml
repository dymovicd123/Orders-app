name: Finalize Operational Autonomy R3 Temp

on:
  push:
    branches:
      - operational-autonomy-r3-return-exchange-capacity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: operational-autonomy-r3-return-exchange-capacity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Finalize implementation and structural manifest
        shell: bash
        run: |
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path

          p = Path('worker/domains/returns-exchanges.ts')
          s = p.read_text()

          old = """    const alreadyReturnedQuantity = await getActiveStandaloneReturnedQuantity(\n      db, orderId, selected.orderItemId, operationReturnId,\n    );\n"""
          new = """    const alreadyReturnedRow = await db.prepare(\n      `SELECT COALESCE(SUM(ri.quantity), 0) AS quantity\n       FROM return_items ri\n       JOIN returns r ON r.id = ri.return_id\n       WHERE r.order_id = ?\n         AND ri.order_item_id = ?\n         AND COALESCE(r.status, 'completed') <> 'cancelled'\n         AND ${noStandaloneReturnSql}\n         AND (? = 0 OR r.id <> ?)`\n    ).bind(orderId, selected.orderItemId, operationReturnId, operationReturnId).first<{ quantity: number }>();\n    const alreadyReturnedQuantity = Math.max(0, toInt(alreadyReturnedRow?.quantity, 0));\n"""
          if s.count(old) != 1:
              raise SystemExit(f'createReturn quantity helper call match count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = """  const activeStandaloneReturnedQuantity = operationContext.baselineCaptured\n    ? Math.max(0, toInt(operationContext.activeStandaloneReturnedQuantity, 0))\n    : await getActiveStandaloneReturnedQuantity(db, orderId, oldItemId);\n"""
          new = """  let activeStandaloneReturnedQuantity = operationContext.baselineCaptured\n    ? Math.max(0, toInt(operationContext.activeStandaloneReturnedQuantity, 0))\n    : 0;\n  if (!operationContext.baselineCaptured) {\n    const activeStandaloneReturnedRow = await db.prepare(\n      `SELECT COALESCE(SUM(ri.quantity), 0) AS quantity\n       FROM return_items ri\n       JOIN returns r ON r.id = ri.return_id\n       WHERE r.order_id = ?\n         AND ri.order_item_id = ?\n         AND COALESCE(r.status, 'completed') <> 'cancelled'\n         AND ${noStandaloneReturnSql}`\n    ).bind(orderId, oldItemId).first<{ quantity: number }>();\n    activeStandaloneReturnedQuantity = Math.max(0, toInt(activeStandaloneReturnedRow?.quantity, 0));\n  }\n"""
          if s.count(old) != 1:
              raise SystemExit(f'createExchange quantity helper call match count={s.count(old)}')
          s = s.replace(old, new, 1)

          start = s.find('export async function getActiveStandaloneReturnedQuantity(')
          end = s.find('export async function ensureExchangeWorkshopReplacementTask(', start)
          if start < 0 or end < 0:
              raise SystemExit('new quantity helper region not found')
          old_helper = """export async function hasActiveStandaloneReturn(db: D1Database, orderId: number) {\n  const row = await db.prepare(\n    `SELECT COUNT(*) AS count\n     FROM returns r\n     WHERE r.order_id = ?\n       AND COALESCE(r.status, 'completed') <> 'cancelled'\n       AND ${noStandaloneReturnSql}`\n  ).bind(orderId).first<{ count: number }>();\n  return toInt(row?.count, 0) > 0;\n}\n\n\n"""
          s = s[:start] + old_helper + s[end:]
          if 'getActiveStandaloneReturnedQuantity' in s:
              raise SystemExit('quantity helper name still present after structural cleanup')
          p.write_text(s)

          step1901 = Path('scripts/test-step1901-critical-operations.mjs')
          t = step1901.read_text()
          old = "check(createExchange.includes('operationContext.activeStandaloneReturnedQuantity') && createExchange.includes('getActiveStandaloneReturnedQuantity(db, orderId, oldItemId)') && createExchange.includes('rawOldQuantity - activeStandaloneReturnedQuantity'),'exchange retry item-capacity baseline not protected')"
          new = "check(createExchange.includes('operationContext.activeStandaloneReturnedQuantity') && createExchange.includes('ri.order_item_id = ?') && createExchange.includes('.bind(orderId, oldItemId)') && createExchange.includes('rawOldQuantity - activeStandaloneReturnedQuantity'),'exchange retry item-capacity baseline not protected')"
          if t.count(old) != 1:
              raise SystemExit('Step 190.1 R3 assertion anchor missing')
          step1901.write_text(t.replace(old, new, 1))

          focused = Path('scripts/test-operational-autonomy-r3-return-exchange-capacity.mjs')
          t = focused.read_text()
          t = t.replace("assert.ok(source.includes('getActiveStandaloneReturnedQuantity'), 'shared standalone-return quantity guard is required');\n", "assert.ok(source.includes('ri.order_item_id = ?'), 'return/exchange capacity must be scoped to the concrete order item');\n")
          t = t.replace("assert.ok(source.includes('selected.orderItemId, operationReturnId'), 'return retry must exclude its own return from consumed quantity');\n", "assert.ok(source.includes('selected.orderItemId, operationReturnId, operationReturnId'), 'return retry must exclude its own return from consumed quantity');\n")
          if 'getActiveStandaloneReturnedQuantity' in t:
              raise SystemExit('focused test still expects removed helper')
          focused.write_text(t)
          PY

          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const crypto = require('crypto');
          const ts = require('typescript');
          const normalize = (text) => text.replace(/^export\s+/, '');
          const sha = (text) => crypto.createHash('sha256').update(normalize(text)).digest('hex');
          const declarations = (text, fileName) => {
            const source = ts.createSourceFile(fileName, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
            const map = new Map();
            for (const statement of source.statements) {
              let name = null;
              if ((ts.isFunctionDeclaration(statement) || ts.isClassDeclaration(statement) || ts.isInterfaceDeclaration(statement) || ts.isTypeAliasDeclaration(statement) || ts.isEnumDeclaration(statement)) && statement.name) name = statement.name.text;
              if (name) map.set(name, statement.getText(source));
            }
            return map;
          };
          const baseText = cp.execFileSync('git', ['show', 'origin/main:worker/domains/returns-exchanges.ts'], { encoding: 'utf8' });
          const headText = fs.readFileSync('worker/domains/returns-exchanges.ts', 'utf8');
          const base = declarations(baseText, 'base-returns-exchanges.ts');
          const head = declarations(headText, 'head-returns-exchanges.ts');
          for (const name of ['hasActiveStandaloneReturn']) {
            if (!base.has(name) || !head.has(name) || sha(base.get(name)) !== sha(head.get(name))) throw new Error(`${name} must remain structurally unchanged`);
          }
          if (head.has('getActiveStandaloneReturnedQuantity')) throw new Error('unexpected new top-level helper remains');
          const names = ['cancelReturn', 'createExchange', 'createReturn'];
          const changes = {};
          for (const name of names) {
            if (!base.has(name) || !head.has(name)) throw new Error(`missing declaration ${name}`);
            const before = sha(base.get(name));
            const after = sha(head.get(name));
            if (before === after) throw new Error(`${name} did not change; manifest scope is too wide`);
            changes[name] = { before, after };
          }
          fs.writeFileSync('scripts/operational-autonomy-r3-worker-manifest.json', JSON.stringify({
            version: 1,
            revision: 'operational-autonomy-r3-return-exchange-capacity-r1',
            changes,
          }, null, 2) + '\n');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/test-step1906a-worker-modularization.mjs')
          s = p.read_text()
          anchor = "const catalogUnisexMergeManifestPath = path.join(root, 'scripts/catalog-unisex-merge-r1-worker-manifest.json')\n"
          insert = anchor + "const operationalAutonomyR3ManifestPath = path.join(root, 'scripts/operational-autonomy-r3-worker-manifest.json')\n"
          if s.count(anchor) != 1 or 'operationalAutonomyR3ManifestPath' in s:
              raise SystemExit('1906A R3 path anchor invalid')
          s = s.replace(anchor, insert, 1)

          anchor = "if (Object.keys(catalogUnisexMergeManifest.changes || {}).sort().join(',') !== 'findCatalogCombinationV3,updateCatalogVariant') throw new Error('Catalog unisex merge R1 Worker allow-list widened unexpectedly')\n"
          insert = anchor + "const operationalAutonomyR3Manifest = JSON.parse(fs.readFileSync(operationalAutonomyR3ManifestPath, 'utf8'))\nif (operationalAutonomyR3Manifest?.version !== 1 || operationalAutonomyR3Manifest?.revision !== 'operational-autonomy-r3-return-exchange-capacity-r1') throw new Error('Operational Autonomy R3 Worker manifest invalid')\nif (Object.keys(operationalAutonomyR3Manifest.changes || {}).sort().join(',') !== 'cancelReturn,createExchange,createReturn') throw new Error('Operational Autonomy R3 Worker allow-list widened unexpectedly')\n"
          if s.count(anchor) != 1:
              raise SystemExit('1906A R3 validation anchor invalid')
          s = s.replace(anchor, insert, 1)

          old = "JSON.stringify({ findCatalogCombinationV3: catalogUnisexMergeManifest.changes.findCatalogCombinationV3 })"
          new = "JSON.stringify({ findCatalogCombinationV3: catalogUnisexMergeManifest.changes.findCatalogCombinationV3, ...operationalAutonomyR3Manifest.changes })"
          if s.count(old) != 1:
              raise SystemExit(f'1906A injected allow-list anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          node scripts/test-operational-autonomy-r3-return-exchange-capacity.mjs
          node scripts/test-step1901-critical-operations.mjs
          node scripts/test-step1906a-worker-modularization.mjs

          rm .github/workflows/finalize-operational-autonomy-r3-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/returns-exchanges.ts scripts/test-step1901-critical-operations.mjs scripts/test-operational-autonomy-r3-return-exchange-capacity.mjs scripts/operational-autonomy-r3-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs .github/workflows/finalize-operational-autonomy-r3-temp.yml
          git commit -m "Finalize R3 return exchange capacity regression layer"
          git push origin HEAD:operational-autonomy-r3-return-exchange-capacity
