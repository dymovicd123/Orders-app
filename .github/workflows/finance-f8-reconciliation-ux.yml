name: Finance F8 reconciliation UX

on:
  push:
    branches:
      - finance-f8-reconciliation-ux

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply F8 UX patch
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tmp-finance-f8-helper-fix.mjs
          node scripts/tmp-finance-f8-patch.mjs
          node scripts/tmp-finance-f8-f6-gate-fix.mjs
          git checkout -- scripts/tmp-finance-f8-patch.mjs
      - name: Full release gate
        run: npm run release:check
      - name: Ensure Finance-only UI delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^migrations/|arrival|Arrival|приход|Приход'; then
            echo 'Unexpected migration/Arrival delta'
            exit 1
          fi
          allowed='^(src/features/renderers/FinanceDashboardRenderer.tsx|src/styles/140-finance-truth.css|scripts/test-finance-f3-summary-ux.mjs|scripts/test-finance-f6-release-audit.mjs)$'
          extra="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$extra" ]; then
            echo "Unexpected F8 files:"
            echo "$extra"
            exit 1
          fi
      - name: Commit verified product delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No product delta to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/renderers/FinanceDashboardRenderer.tsx src/styles/140-finance-truth.css scripts/test-finance-f3-summary-ux.mjs scripts/test-finance-f6-release-audit.mjs
          git commit -m 'Finance F8: unify reconciliation and neutral date explanations'
          git push origin HEAD:finance-f8-reconciliation-ux
