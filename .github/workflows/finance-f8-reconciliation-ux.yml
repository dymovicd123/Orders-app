name: Finance F8 reconciliation UX

on:
  push:
    branches:
      - finance-f8-reconciliation-ux

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply F8 UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer_path = Path('src/features/renderers/FinanceDashboardRenderer.tsx')
          renderer = renderer_path.read_text()
          if 'finance-reconciliation-v2' not in renderer:
              start_marker = '          <section className={`finance-reconciliation ${consistency.ok ? \'is-ok\' : \'is-error\'}`}>'
              end_marker = '          {paymentTraceRows.length ? ('
              start = renderer.find(start_marker)
              end = renderer.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('F8: reconciliation/cross-date block markers not found')
              replacement = '''          <section className={`finance-reconciliation finance-reconciliation-v2 ${consistency.ok ? 'is-ok' : 'is-error'}`}>
            <div className="finance-reconciliation-head">
              <div>
                <strong>Финансовая сверка</strong>
                <span>Суммы сверяются независимо по денежному журналу, видам операций и способам оплаты. Даты заказов и денежных операций проверяются здесь же.</span>
              </div>
              <div className="finance-reconciliation-badges">
                <span className={`status-pill ${consistency.ok ? 'status-online' : 'status-offline'}`}>{consistency.ok ? 'Суммы сошлись' : `Расхождение ${formatMoney(consistency.difference)}`}</span>
                {crossDatePaymentOperations.length ? <span className="soft-badge finance-info-badge">По датам: {crossDatePaymentOperations.length} операций · {formatMoney(crossDatePaymentOperations.reduce((sum, row) => sum + Number(row.amount || 0), 0))}</span> : <span className="soft-badge">Междатных операций нет</span>}
                {paymentTraceReview.length ? <span className="soft-badge warning-soft">Нужно проверить: {paymentTraceReview.length}</span> : visiblePaymentTraceInfo.length ? <span className="soft-badge finance-info-badge">Пояснений: {visiblePaymentTraceInfo.length}</span> : <span className="soft-badge">По датам без замечаний</span>}
              </div>
            </div>
            <div className="finance-reconciliation-values">
              <span>Денежный журнал: <strong>{formatMoney(consistency.ledgerTotal)}</strong></span>
              <span>По видам операций: <strong>{formatMoney(consistency.kindsTotal)}</strong></span>
              <span>По способам оплаты: <strong>{formatMoney(consistency.methodsTotal)}</strong></span>
            </div>

            {crossDatePaymentOperations.length ? (
              <div className="finance-reconciliation-cross-date">
                <div className="mini-panel-head">
                  <div>
                    <h3>Операции по заказам другой даты</h3>
                    <p className="mini-panel-note">Это не расхождение само по себе: деньги входят в выбранный период по дате операции, а продажа — по дате заказа. Закрытие долга здесь является обычной операцией; необычные случаи отдельно объясняются в проверке дат.</p>
                  </div>
                  <span className="soft-badge finance-info-badge">{crossDatePaymentOperations.length} операций · {formatMoney(crossDatePaymentOperations.reduce((sum, row) => sum + Number(row.amount || 0), 0))}</span>
                </div>
                <div className="table-shell">
                  <table className="data-table finance-anomaly-table finance-cross-date-table">
                    <thead><tr><th>Дата оплаты</th><th>Дата заказа</th><th>Заказ</th><th>Вид</th><th className="num">Сумма</th><th>Действие</th></tr></thead>
                    <tbody>{crossDatePaymentOperations.map((row) => (
                      <tr key={`finance-cross-date-${row.id}`}>
                        <td><strong>{formatDateShort(row.paymentDate)}</strong></td>
                        <td>{formatDateShort(row.orderDate)}</td>
                        <td>{row.externalId}</td>
                        <td>{row.operationLabel}</td>
                        <td className="num"><strong>{formatMoney(row.amount)}</strong></td>
                        <td><div className="finance-row-actions"><button className="secondary compact finance-order-link" type="button" onClick={() => void openOrderFromFinance(row)}>К заказу</button><button className="secondary compact finance-money-link" type="button" onClick={() => openMoneyHistoryForOrder(row)}>Денежная история</button></div></td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              </div>
            ) : null}
          </section>

'''
              renderer = renderer[:start] + replacement + renderer[end:]

              old_review = '''            <section className="mini-panel finance-anomaly-panel">
              <div className="mini-panel-head">
                <div>
                  <h3>Проверка дат и ввода</h3>
                  <p className="mini-panel-note">Здесь только операции выбранного периода. Красным смыслом отмечается то, что требует проверки; обычные пояснения не считаются ошибками.</p>'''
              new_review = '''            <section className={`mini-panel finance-review-panel ${paymentTraceReview.length ? 'has-review' : 'is-info'}`}>
              <div className="mini-panel-head">
                <div>
                  <h3>Проверка дат и ввода</h3>
                  <p className="mini-panel-note">Здесь только операции выбранного периода. Предупреждение появляется только там, где действительно нужна проверка; обычные пояснения показываются нейтрально.</p>'''
              if old_review not in renderer:
                  raise SystemExit('F8: date review block marker not found')
              renderer = renderer.replace(old_review, new_review, 1)
              renderer_path.write_text(renderer)

          css_path = Path('src/styles/140-finance-truth.css')
          css = css_path.read_text()
          marker = '/* Finance F8: unified reconciliation + neutral cross-date semantics. */'
          if marker not in css:
              css += '''\n\n/* Finance F8: unified reconciliation + neutral cross-date semantics. */
.finance-reconciliation.finance-reconciliation-v2 {
  display: grid;
  align-items: stretch;
  gap: 12px;
  border-color: #cbd5e1;
  background: #f8fafc;
}

.finance-reconciliation.finance-reconciliation-v2.is-ok {
  border-color: #cbd5e1;
  background: #f8fafc;
}

.finance-reconciliation-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.finance-reconciliation-head > div:first-child {
  display: grid;
  gap: 4px;
}

.finance-reconciliation-head > div:first-child > span {
  color: #475569;
  font-size: 12px;
}

.finance-reconciliation-badges {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.finance-info-badge {
  background: #eaf2ff;
  color: #2456a6;
}

.finance-reconciliation-values {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  padding-top: 10px;
  border-top: 1px solid #e2e8f0;
  color: #475569;
  font-size: 12px;
}

.finance-reconciliation-values strong {
  color: #0f172a;
}

.finance-reconciliation-cross-date {
  display: grid;
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid #dbeafe;
}

.finance-reconciliation-cross-date .table-shell {
  overflow-x: auto;
  overscroll-behavior-x: contain;
}

.finance-review-panel.is-info {
  border-color: #bfdbfe;
  background: linear-gradient(180deg, #f5f9ff 0%, #fff 100%);
}

.finance-review-panel.has-review {
  border-color: #fbbf24;
  background: linear-gradient(180deg, #fffbeb 0%, #fff 100%);
}

.finance-operation-type.type-debt_close {
  background: #e2e8f0;
  color: #334155;
}

@media (max-width: 820px) {
  .finance-reconciliation-head {
    flex-direction: column;
  }

  .finance-reconciliation-badges {
    justify-content: flex-start;
  }
}
'''
              css_path.write_text(css)

          test_path = Path('scripts/test-finance-f3-summary-ux.mjs')
          test = test_path.read_text()
          old = "  check(renderer.includes('crossDatePaymentOperations') && renderer.includes('Почему поступления и продажи периода могут отличаться'), 'Cross-date period bridge is not visible')"
          new = "  check(renderer.includes('crossDatePaymentOperations') && renderer.includes('Операции по заказам другой даты'), 'Cross-date period bridge is not visible inside reconciliation')"
          if old in test:
              test = test.replace(old, new)
          if "Unified reconciliation must not claim everything is fine" not in test:
              insert_after = "  check(renderer.includes('Проверка дат и ввода'), 'Honest date/input review heading missing')\n"
              addition = "  check(renderer.includes('finance-reconciliation-v2') && renderer.includes('Финансовая сверка') && renderer.includes('Суммы сошлись'), 'Unified reconciliation header/status missing')\n  check(!renderer.includes('Почему поступления и продажи периода могут отличаться'), 'Old warning-like cross-date panel returned')\n  check(renderer.includes(\"finance-review-panel ${paymentTraceReview.length ? 'has-review' : 'is-info'}\"), 'Date/input explanations are not visually separated from real review warnings')\n  const financeCss = read('src/styles/140-finance-truth.css')\n  check(financeCss.includes('.finance-reconciliation.finance-reconciliation-v2.is-ok') && financeCss.includes('background: #f8fafc'), 'Successful reconciliation still uses a global all-clear green surface')\n  check(financeCss.includes('.finance-review-panel.is-info') && financeCss.includes('.finance-review-panel.has-review'), 'Neutral explanation and warning review styles are not separated')\n  check(financeCss.includes('.finance-operation-type.type-debt_close') && financeCss.includes('background: #e2e8f0') && financeCss.includes('color: #334155'), 'Debt closure still uses warning-like coloring')\n"
              if insert_after not in test:
                  raise SystemExit('F8: F3 test insertion marker not found')
              test = test.replace(insert_after, insert_after + addition)
          test_path.write_text(test)
          PY
      - name: Full release gate
        run: npm run release:check
      - name: Ensure Finance-only UI delta
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^migrations/|arrival|Arrival|приход|Приход'; then
            echo 'Unexpected migration/Arrival delta'
            exit 1
          fi
          allowed='^(src/features/renderers/FinanceDashboardRenderer.tsx|src/styles/140-finance-truth.css|scripts/test-finance-f3-summary-ux.mjs)$'
          extra="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$extra" ]; then
            echo "Unexpected F8 files:"
            echo "$extra"
            exit 1
          fi
      - name: Commit verified product delta
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No product delta to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/renderers/FinanceDashboardRenderer.tsx src/styles/140-finance-truth.css scripts/test-finance-f3-summary-ux.mjs
          git commit -m 'Finance F8: unify reconciliation and neutral date explanations'
          git push origin HEAD:finance-f8-reconciliation-ux
