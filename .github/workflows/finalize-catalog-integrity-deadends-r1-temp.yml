name: Finalize Catalog Integrity Deadends R1 Temp

on:
  push:
    branches:
      - catalog-integrity-deadends-r1
    paths:
      - .github/workflows/finalize-catalog-integrity-deadends-r1-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-integrity-deadends-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Generate exact Worker declaration delta
        run: |
          git fetch origin main
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          import { execFileSync } from 'node:child_process'
          const targets = [
            ['listInventory','worker/domains/inventory-read.ts'],
            ['resolveInventoryCreatableItemsBulk','worker/domains/inventory-movement.ts'],
          ]
          const sha = value => crypto.createHash('sha256').update(value).digest('hex')
          function declarationText(source, fileName, wanted) {
            const sf = ts.createSourceFile(fileName, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            for (const statement of sf.statements) {
              let names = []
              if ((ts.isFunctionDeclaration(statement) || ts.isClassDeclaration(statement) || ts.isInterfaceDeclaration(statement) || ts.isTypeAliasDeclaration(statement) || ts.isEnumDeclaration(statement)) && statement.name) names = [statement.name.text]
              else if (ts.isVariableStatement(statement)) names = statement.declarationList.declarations.flatMap(d => ts.isIdentifier(d.name) ? [d.name.text] : [])
              if (names.includes(wanted)) return statement.getText(sf).replace(/^export\s+/, '')
            }
            throw new Error(`Declaration ${wanted} not found in ${fileName}`)
          }
          const changes = {}
          for (const [name,file] of targets) {
            const beforeSource = execFileSync('git',['show',`origin/main:${file}`],{encoding:'utf8'})
            const afterSource = fs.readFileSync(file,'utf8')
            changes[name] = { before: sha(declarationText(beforeSource,file,name)), after: sha(declarationText(afterSource,file,name)) }
          }
          fs.writeFileSync('scripts/catalog-integrity-deadends-r1-worker-manifest.json', JSON.stringify({version:1,revision:'catalog-integrity-deadends-r1',changes},null,2)+'\n')
          console.log(JSON.stringify(changes,null,2))
          NODE
      - name: Full release gate and build
        run: |
          node scripts/test-catalog-integrity-deadends-r1.mjs
          npm run release:check
          npm run build
      - name: Commit exact gate manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-integrity-deadends-r1-worker-manifest.json
          git commit -m "Guard catalog integrity fix with exact Worker delta"
          git push origin HEAD:catalog-integrity-deadends-r1
