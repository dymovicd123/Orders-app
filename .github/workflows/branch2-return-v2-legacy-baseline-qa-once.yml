name: Branch2 Return V2 historical V1 baseline acceptance - read only once
on:
  push:
    branches: [branch2]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      startsWith(github.event.head_commit.message, 'Branch2: read-only 9 QA returns after legacy baseline 20261115')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare runtime for authoritative read-only Return V2 preview
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout branch2 application source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate exact server-side Return V2 preview against QA test DB (SELECT only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import {handleOrderReturnV2Route} from './worker/routes/order-return-v2.ts';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const dbId='0904a573-21ff-44d8-93b0-c9200f771702';
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+dbId;
          const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
          const meta=await (await fetch(base,{headers})).json();
          if(!meta.success||meta.result?.name!=='orders_db_branch2_mirror_20261027')
            throw new Error('STOP: wrong D1; no queries sent');
          const read=async(sql,params=[])=>{
            if(!/^\s*SELECT\b/i.test(sql))throw new Error('Non-SELECT rejected');
            const res=await fetch(base+'/query',{method:'POST',headers,
              body:JSON.stringify({sql,params})});
            if(!res.ok)throw new Error('D1 query HTTP '+res.status);
            const body=await res.json();
            if(!body.success)throw new Error('D1 SELECT failed '+JSON.stringify(body.errors));
            const page=body.result?.[0];
            if(!page||Number(page.meta?.changes||0)!==0)throw new Error('SELECT mutation guard');
            return page.results||[];
          };
          const stmt=(sql,params=[])=>({
            bind(...values){return stmt(sql,values)},
            async all(){return {results:await read(sql,params)}},
            async first(){return (await read(sql,params))[0]||null},
          });
          const db={prepare(sql){return stmt(sql)}};
          const ids=[2196,2197,2198,2199,2200,2201,2204,2205,2206];
          for(const id of ids){
            const pathname='/api/orders/'+id+'/returns/v2/preview';
            const response=await handleOrderReturnV2Route(db,new Request('https://test.invalid'+pathname),
              pathname,true,'admin');
            if(!response)throw new Error('Missing HTTP preview handler '+id);
            const body=await response.json();
            console.log('QA_BASELINE_HTTP_PREVIEW: '+JSON.stringify({
              id,http:response.status,eligible:body.eligible,
              code:body.code||null,reason:body.reason||body.message||null,
              blocked:body.evidence?.summary?.requiresReviewQuantity??null,
              remaining:body.evidence?.summary?.selectedQuantity??null,
              lines:body.evidence?.lines?.map(x=>({id:x.orderItemId,
                available:x.availableQuantity,action:x.proposedAction,
                reason:x.reasonCode})),
              finance:body.finance||null,
              oldAdjustment:body.previousReturnAdjustment||null,
            }));
          }
          console.log('QA_NINE_ORDERS_READ_ONLY_COMPLETED');
          JS
