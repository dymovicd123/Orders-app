name: Editor Production Postdeploy Smoke

on:
  push:
    branches: [safe/editor-production-postdeploy-smoke-20260902]
    paths:
      - scripts/.editor-production-postdeploy-smoke-trigger

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live Production editor opens and edits locally without mutation
        env:
          TARGET_URL: https://orders-app.orders-clothes.workers.dev/#orders
        run: |
          node <<'NODE'
          const { chromium } = require('playwright')
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } })
            const consoleErrors = []
            const pageErrors = []
            const failedRequests = []
            const mutatingRequests = []
            let trackMutations = false
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()) })
            page.on('pageerror', error => pageErrors.push(String(error?.stack || error)))
            page.on('requestfailed', request => failedRequests.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'failed'}`))
            page.on('request', request => {
              if (trackMutations && ['POST', 'PATCH', 'PUT', 'DELETE'].includes(request.method())) {
                mutatingRequests.push(`${request.method()} ${request.url()}`)
              }
            })

            await page.goto(process.env.TARGET_URL, { waitUntil: 'networkidle', timeout: 90000 })
            await page.waitForTimeout(1200)
            const editButtons = page.getByRole('button', { name: 'Редактировать', exact: true })
            const count = await editButtons.count()
            console.log('EDIT_BUTTON_COUNT', count)
            if (!count) throw new Error('No edit button on live Production')
            let chosen = null
            for (let i = 0; i < count; i++) {
              const candidate = editButtons.nth(i)
              if (await candidate.isVisible()) { chosen = candidate; break }
            }
            if (!chosen) throw new Error('No visible edit button on live Production')
            trackMutations = true
            await chosen.click()
            await page.waitForTimeout(1800)

            const shell = await page.locator('.erp-shell').count()
            const editorVisible = await page.locator('#editor').isVisible().catch(() => false)
            const editorText = (await page.locator('#editor').innerText().catch(() => '')).replace(/\s+/g, ' ')
            const saveButton = page.getByRole('button', { name: 'Сохранить изменения', exact: true })
            const saveVisible = await saveButton.isVisible().catch(() => false)
            const saveEnabled = await saveButton.isEnabled().catch(() => false)

            const commentLabel = page.locator('#editor label.wide-field').filter({ hasText: /^Комментарий$/ }).first()
            const commentInput = commentLabel.locator('input')
            if (!(await commentInput.count())) throw new Error('Order comment input missing')
            const originalComment = await commentInput.inputValue()
            const probeComment = originalComment === '__EDITOR_SMOKE_LOCAL_ONLY__' ? '__EDITOR_SMOKE_LOCAL_ONLY_2__' : '__EDITOR_SMOKE_LOCAL_ONLY__'
            await commentInput.fill(probeComment)
            const changedComment = await commentInput.inputValue()
            await commentInput.fill(originalComment)
            const restoredComment = await commentInput.inputValue()
            await page.waitForTimeout(250)

            console.log('AFTER_URL', page.url())
            console.log('SHELL_COUNT', shell)
            console.log('EDITOR_VISIBLE', editorVisible)
            console.log('SAVE_VISIBLE', saveVisible)
            console.log('SAVE_ENABLED', saveEnabled)
            console.log('LOCAL_FIELD_CHANGED', changedComment === probeComment)
            console.log('LOCAL_FIELD_RESTORED', restoredComment === originalComment)
            console.log('PAGE_ERRORS', JSON.stringify(pageErrors, null, 2))
            console.log('CONSOLE_ERRORS', JSON.stringify(consoleErrors, null, 2))
            console.log('FAILED_REQUESTS', JSON.stringify(failedRequests, null, 2))
            console.log('MUTATING_REQUESTS_AFTER_EDIT_CLICK', JSON.stringify(mutatingRequests, null, 2))

            if (!page.url().endsWith('/#editor')) throw new Error(`Unexpected editor URL: ${page.url()}`)
            if (!shell) throw new Error('ERP shell disappeared after editor click')
            if (!editorVisible) throw new Error('Editor is not visible after click')
            if (!editorText.toLowerCase().includes('редактирование заказа')) throw new Error('Editor heading missing')
            if (!saveVisible || !saveEnabled) throw new Error('Save action is unavailable in ordinary editor')
            if (changedComment !== probeComment || restoredComment !== originalComment) throw new Error('Editor form does not accept/revert local field changes')
            if (mutatingRequests.length) throw new Error(`Smoke unexpectedly mutated Production: ${mutatingRequests.join(' | ')}`)
            if (pageErrors.length) throw new Error(`Runtime page errors: ${pageErrors.join(' | ')}`)
            if (consoleErrors.some(line => /TypeError|ReferenceError|Failed to fetch dynamically imported module|ChunkLoadError/i.test(line))) throw new Error(`Runtime console errors: ${consoleErrors.join(' | ')}`)
            await browser.close()
          })().catch(error => { console.error(error); process.exit(1) })
          NODE
