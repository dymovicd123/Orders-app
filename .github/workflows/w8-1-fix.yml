name: W8.1 targeted fix

on:
  push:
    branches:
      - w8-1-stock-overview-completion

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[w8-1-fix-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: w8-1-stock-overview-completion
          fetch-depth: 1
      - name: Apply targeted W8.1 fix
        run: python scripts/fix-w8-1-stock-overview.py
      - name: Commit fix
        run: |
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "W8.1: show color stock context [w8-1-fix-applied]"
          git push origin HEAD:w8-1-stock-overview-completion
