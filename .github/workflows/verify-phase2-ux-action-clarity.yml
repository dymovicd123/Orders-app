name: Verify Phase 2 UX action clarity

on:
  push:
    branches:
      - safe/phase2-ux-action-clarity-20260826
    paths:
      - .github/workflows/verify-phase2-ux-action-clarity.yml
      - scripts/apply-phase2-ux-action-clarity.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/phase2-ux-action-clarity-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply UX patch
        run: python3 scripts/apply-phase2-ux-action-clarity.py
      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected=$'scripts/test-phase2-smart-daily-stock.mjs\nsrc/features/inventory/views/renderInventoryOverviewPanel.tsx\nsrc/styles/188i-cycle-counts.css'
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          ! git diff | grep -E "inventoryArrival|Приход" >/dev/null
          grep -q "Подтвердить {row.physical}" src/features/inventory/views/renderInventoryOverviewPanel.tsx
          grep -q "Указать другое количество" src/features/inventory/views/renderInventoryOverviewPanel.tsx
          grep -q "Показать другую пачку" src/features/inventory/views/renderInventoryOverviewPanel.tsx
          ! grep -q "Совпадает:" src/features/inventory/views/renderInventoryOverviewPanel.tsx
      - name: Install dependencies
        run: npm ci
      - name: Full release gate
        run: npm run release:check
      - name: Commit tested UX patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-phase2-ux-action-clarity.py .github/workflows/verify-phase2-ux-action-clarity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify routine stock count actions"
          git push origin HEAD:safe/phase2-ux-action-clarity-20260826
