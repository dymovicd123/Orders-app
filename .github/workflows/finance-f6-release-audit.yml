name: Finance F6 aggregate release audit

on:
  push:
    branches:
      - finance-f6-release-audit

permissions:
  contents: write

jobs:
  audit-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f6-verified]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Finance F6 correctness patch and wire permanent gate
        run: python3 scripts/tmp-finance-f6-wire.py
      - name: Normalize immutable-event audit matcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-finance-f6-release-audit.mjs')
          text = path.read_text(encoding='utf-8')
          start_marker = "  for (const marker of [\"eventType: 'exchange_extra'\""
          end_marker = "  check(report.includes(\"completedReturns = returns.filter\")"
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end <= start:
              raise SystemExit(f'immutable-event block markers missing: start={start}, end={end}')
          new = '''  check(returnsExchanges.includes("eventType: 'exchange_extra'"), 'Immutable exchange-extra evidence missing')
          check(returnsExchanges.includes("eventType: 'exchange_refund'"), 'Immutable exchange-refund evidence missing')
          check(`${returnsExchanges}\\n${money}`.includes("'refund_reversal'"), 'Immutable refund-reversal evidence missing')
          check(`${money}\\n${orderWrite}`.includes("'payment_reversal'"), 'Immutable payment-reversal evidence missing')
          '''
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified Finance F6 correctness patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            worker/domains/money.ts \
            worker/domains/orders-write.ts \
            scripts/finance-f6-delete-money-history-worker-manifest.json \
            scripts/test-step1906a-worker-modularization.mjs \
            scripts/test-finance-f6-release-audit.mjs \
            scripts/release-check.mjs
          git commit -m "Harden order deletion money history [finance-f6-verified]"
          git push origin HEAD:finance-f6-release-audit
