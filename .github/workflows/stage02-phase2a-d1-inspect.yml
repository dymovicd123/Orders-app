name: Stage02 Phase2A Branch2 D1 inspect

on:
  push:
    branches:
      - w-d1-inspect-stage02-phase2a-branch2-20260919

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: List Branch2 D1 migrations
        run: npx wrangler d1 migrations list orders_db_branch2 --remote --config wrangler.jsonc
