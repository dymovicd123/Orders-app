name: Return V2 Main - encrypted pre-migration backup and schema-only installation
on:
  push:
    branches: [release/return-v2-main-staging-20261116]
permissions:
  contents: read
concurrency:
  group: production-return-v2-schema-first
  cancel-in-progress: false
jobs:
  migrate:
    if: "${{ github.ref == 'refs/heads/release/return-v2-main-staging-20261116' && startsWith(github.event.head_commit.message, 'schema(main): return-v2 encrypted-backup install 0124-0135') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify immutable migration source and production identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/return-v2-main-staging-20261116'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|0904a573-21ff-44d8-93b0-c9200f771702|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          test "$(sha256sum .github/ops/return-v2-main-backup-public.pem | awk '{print $1}')" = '14d28e8bba4bd196b534cbb7f41f4e6801f7c77873a1139399e7be2eeb9fd7ec'
          test "$(git hash-object 'migrations/0124_return_v2_prepared_journal.sql')" = '7e1c0e671c06665c46e28f27810c4aee73a9e948'
          test "$(git hash-object 'migrations/0125_return_v2_contract_quantity_marker.sql')" = '4f42fac3c7b13ff3a0e9d48cba530ff87535ca1a'
          test "$(git hash-object 'migrations/0126_return_v2_posting_prototype.sql')" = '3395090a24f7a82f6d149a6f43ede4e8d7b8d5f6'
          test "$(git hash-object 'migrations/0127_return_v2_cancellation_prototype.sql')" = '8257c815c90e1611b91e31ca8f387fcf5d45220f'
          test "$(git hash-object 'migrations/0128_return_v2_unified_posting_prototype.sql')" = 'dd2cc5e2cb6a4c9d202d5528b8982ad52a12b7c8'
          test "$(git hash-object 'migrations/0129_return_v2_unified_receipt_intent.sql')" = 'e8cacf2eedb89344582e214a90175c13b96f0e42'
          test "$(git hash-object 'migrations/0130_return_v2_unified_cancel_prototype.sql')" = '6d8c8282efe6a3205dd3041083e42bf4006b94af'
          test "$(git hash-object 'migrations/0131_return_v2_metadata_edits.sql')" = 'ff804aabdcf3087cfff06045e38f7130a9f032e4'
          test "$(git hash-object 'migrations/0132_return_v2_resumed_dispatch_prototype.sql')" = '9f7c75d56df907f448c6c1a64d5e0ae8482cc5f0'
          test "$(git hash-object 'migrations/0133_return_v2_workshop_obligation.sql')" = '72a2c5a5347941c966501d8759868aec0e0e1011'
          test "$(git hash-object 'migrations/0134_return_v2_unreserved_obligation.sql')" = 'd07ed30fa06b271d6c8d5359c3f20463841df063'
          test "$(git hash-object 'migrations/0135_return_v2_legacy_contract_baseline.sql')" = '32b60118de9a38fc0ea1e019e0e788f04d8a5d4e'
          echo MAIN_RETURN_V2_PINNED_SCHEMA_AND_IDENTITY_PASS
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify backup encryption script and FTS5-capable Wrangler CLI
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/return-v2-main-encrypt-backup.mjs
          npx --yes --package wrangler@4.162.0 wrangler --version | grep -F '4.162.0'
          npx --yes --package wrangler@4.162.0 wrangler d1 export --help | grep -F -- '--compatibility'
      - name: Verify migration chain in disposable SQLite
        run: node scripts/return-v2-main-readiness.mjs
      - name: Require production has zero Return V2 objects (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/return-v2-main-readiness.mjs --remote > "$RUNNER_TEMP/v2-prod-schema-before.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          jq -e '.target=="orders-app" and .database=="orders_db_prod" and .schema.ready==false and .schema.foundTables==0 and .schema.foundColumns==0 and .migrations.count==12' "$RUNNER_TEMP/v2-prod-schema-before.json" > /dev/null
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE name LIKE 'return_v2_%' AND type IN ('table','index','trigger')" --json | jq -e '.[0].results[0].n==0' > /dev/null
          echo MAIN_RETURN_V2_REMOTE_EMPTY_AND_EXACT_DB_PASS
      - name: Capture Cloudflare D1 recovery bookmark BEFORE any schema write
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/17e68a41-1d58-4a36-8a63-47c3e32443c4/time_travel/bookmark" | jq -er 'if .success==true and (.result.bookmark|type=="string") and (.result.bookmark|length>=32) then .result.bookmark else error("D1 recovery bookmark missing") end' > "$RUNNER_TEMP/main-v2-recovery-bookmark.txt"
          test -s "$RUNNER_TEMP/main-v2-recovery-bookmark.txt"
          echo "Cloudflare D1 recovery bookmark captured before Return V2 migrations." >> "$GITHUB_STEP_SUMMARY"
      - name: Full production D1 SQL export to ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          npx --yes --package wrangler@4.162.0 wrangler d1 export orders_db_prod --config wrangler.jsonc --remote --skip-confirmation --compatibility sqlite3_cli_only --output="$RUNNER_TEMP/main-before-return-v2.sql"
          test "$(stat -c%s "$RUNNER_TEMP/main-before-return-v2.sql")" -gt 1000
          grep -Eiq '(CREATE TABLE|CREATE TABLE IF NOT EXISTS).*orders' "$RUNNER_TEMP/main-before-return-v2.sql"
          grep -Eiq '(CREATE TABLE|CREATE TABLE IF NOT EXISTS).*inventory_stock' "$RUNNER_TEMP/main-before-return-v2.sql"
          echo MAIN_D1_FULL_EXPORT_NONEMPTY_AND_HAS_CORE_TABLES
      - name: Encrypt and authenticate backup; destroy plaintext copy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/main-before-return-v2.sql"' EXIT
          node .github/scripts/return-v2-main-encrypt-backup.mjs "$RUNNER_TEMP/main-before-return-v2.sql" "$RUNNER_TEMP/return-v2-main-encrypted-backup"
          test -s "$RUNNER_TEMP/return-v2-main-encrypted-backup/database.sql.aesgcm"
      - name: Retain ONLY encrypted backup artifact (public repository)
        uses: actions/upload-artifact@v4
        with:
          name: main-d1-return-v2-before-schema-encrypted
          path: ${{ runner.temp }}/return-v2-main-encrypted-backup/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Recheck production empty schema AFTER backup
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/return-v2-main-readiness.mjs --remote > "$RUNNER_TEMP/v2-before-migrate.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          jq -e '.schema.foundTables==0 and .schema.foundColumns==0' "$RUNNER_TEMP/v2-before-migrate.json" > /dev/null
          test -s "$RUNNER_TEMP/main-v2-recovery-bookmark.txt"
          echo MAIN_SCHEMA_FIRST_GO: encrypted backup uploaded, D1 bookmark retained
      - name: Add ONLY approved Return V2 schema, 12 ordered migrations
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/main-v2-recovery-bookmark.txt"
          echo "Applying migrations/0124_return_v2_prepared_journal.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0124_return_v2_prepared_journal.sql'
          echo "Applying migrations/0125_return_v2_contract_quantity_marker.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0125_return_v2_contract_quantity_marker.sql'
          echo "Applying migrations/0126_return_v2_posting_prototype.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0126_return_v2_posting_prototype.sql'
          echo "Applying migrations/0127_return_v2_cancellation_prototype.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0127_return_v2_cancellation_prototype.sql'
          echo "Applying migrations/0128_return_v2_unified_posting_prototype.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0128_return_v2_unified_posting_prototype.sql'
          echo "Applying migrations/0129_return_v2_unified_receipt_intent.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0129_return_v2_unified_receipt_intent.sql'
          echo "Applying migrations/0130_return_v2_unified_cancel_prototype.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0130_return_v2_unified_cancel_prototype.sql'
          echo "Applying migrations/0131_return_v2_metadata_edits.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0131_return_v2_metadata_edits.sql'
          echo "Applying migrations/0132_return_v2_resumed_dispatch_prototype.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0132_return_v2_resumed_dispatch_prototype.sql'
          echo "Applying migrations/0133_return_v2_workshop_obligation.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0133_return_v2_workshop_obligation.sql'
          echo "Applying migrations/0134_return_v2_unreserved_obligation.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0134_return_v2_unreserved_obligation.sql'
          echo "Applying migrations/0135_return_v2_legacy_contract_baseline.sql"
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --file 'migrations/0135_return_v2_legacy_contract_baseline.sql'
          echo MAIN_RETURN_V2_SCHEMA_FILES_APPLIED
      - name: Verify complete production Return V2 schema READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          node scripts/return-v2-main-readiness.mjs --remote
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "PRAGMA quick_check" --json | jq -e '.[0].results[0].quick_check=="ok"' > /dev/null
          echo MAIN_RETURN_V2_PRODUCTION_D1_SCHEMA_READY
          echo "Return V2 schema ready; Main Worker code and feature flag have NOT been deployed." >> "$GITHUB_STEP_SUMMARY"
