name: Temporary Catalog retirement main candidate validation r2

on:
  push:
    branches:
      - release/catalog-retirement-main-20260930
    paths:
      - '.github/workflows/catalog-retirement-main-candidate-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate fresh main candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: High-risk development dependency audit
        run: npm audit --audit-level=high
      - name: Cumulative release gate
        run: npm run release:check
      - name: Build
        run: npm run build

  prod-audit:
    name: Read-only Production retirement audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard-stop on Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "release/catalog-retirement-main-20260930" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then exit 20; fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Read-only schema and data audit
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
          SELECT
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_operations') AS has_retirement_operations,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_variants') AS has_retirement_variants,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_restores') AS has_retirement_restores,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='catalog_retirement_history_events') AS has_granular_history;

          SELECT COUNT(*) AS active_fixed_gender_mismatches
          FROM catalog_variants v
          JOIN catalog_products p ON p.id=v.product_id
          WHERE v.is_active=1
            AND p.is_active=1
            AND (
              (p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,'')))='МУЖ')
              OR (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,'')))='ЖЕН')
            );

          SELECT COUNT(*) AS inactive_variants_with_live_stock_or_reservation
          FROM catalog_variants v
          WHERE v.is_active=0
            AND (
              EXISTS (
                SELECT 1 FROM inventory_stock s
                WHERE s.variant_id=v.id
                  AND (COALESCE(s.quantity,0)<>0 OR COALESCE(s.reserved_quantity,0)<>0)
              )
              OR EXISTS (
                SELECT 1 FROM inventory_reservations r
                WHERE r.variant_id=v.id AND r.status='active' AND COALESCE(r.quantity,0)<>0
              )
            );

          SELECT
            v.id AS variant_id, p.id AS product_id, p.name AS product_name, p.gender_scope,
            v.stock_position_id, v.gender, v.color, v.size_label,
            COALESCE((SELECT SUM(s.quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS physical,
            COALESCE((SELECT SUM(s.reserved_quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS stock_reserved,
            COALESCE((SELECT SUM(r.quantity) FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active'),0) AS active_reserved,
            (SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id=oi.order_id
              WHERE oi.variant_id=v.id AND COALESCE(o.order_status,'active')='active'
                AND COALESCE(o.archived_at,'')='' AND COALESCE(o.shipping_status,'not_sent')<>'sent'
                AND COALESCE(oi.quantity,0)>0) AS open_order_items,
            (SELECT COUNT(*) FROM workshop_tasks wt WHERE wt.variant_id=v.id AND wt.status='active') AS active_workshop,
            (SELECT COUNT(*) FROM inventory_lifecycle_events e WHERE e.variant_id=v.id AND e.status='pending') AS pending_lifecycle
          FROM catalog_variants v
          JOIN catalog_products p ON p.id=v.product_id
          WHERE v.is_active=1 AND p.is_active=1
            AND (
              (p.gender_scope='female' AND UPPER(TRIM(COALESCE(v.gender,'')))='МУЖ')
              OR (p.gender_scope='male' AND UPPER(TRIM(COALESCE(v.gender,'')))='ЖЕН')
            )
          ORDER BY p.name, v.id;

          SELECT
            v.id AS variant_id, p.id AS product_id, p.name AS product_name,
            v.stock_position_id, v.gender, v.color, v.size_label,
            COALESCE((SELECT SUM(s.quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS physical,
            COALESCE((SELECT SUM(s.reserved_quantity) FROM inventory_stock s WHERE s.variant_id=v.id),0) AS stock_reserved,
            COALESCE((SELECT SUM(r.quantity) FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active'),0) AS active_reserved,
            (SELECT COUNT(*) FROM order_items oi JOIN orders o ON o.id=oi.order_id
              WHERE oi.variant_id=v.id AND COALESCE(o.order_status,'active')='active'
                AND COALESCE(o.archived_at,'')='' AND COALESCE(o.shipping_status,'not_sent')<>'sent'
                AND COALESCE(oi.quantity,0)>0) AS open_order_items,
            (SELECT COUNT(*) FROM workshop_tasks wt WHERE wt.variant_id=v.id AND wt.status='active') AS active_workshop,
            (SELECT COUNT(*) FROM inventory_lifecycle_events e WHERE e.variant_id=v.id AND e.status='pending') AS pending_lifecycle
          FROM catalog_variants v
          JOIN catalog_products p ON p.id=v.product_id
          WHERE v.is_active=0
            AND (
              EXISTS (SELECT 1 FROM inventory_stock s WHERE s.variant_id=v.id AND (COALESCE(s.quantity,0)<>0 OR COALESCE(s.reserved_quantity,0)<>0))
              OR EXISTS (SELECT 1 FROM inventory_reservations r WHERE r.variant_id=v.id AND r.status='active' AND COALESCE(r.quantity,0)<>0)
            )
          ORDER BY p.name, v.id;

          SELECT
            (SELECT COUNT(*) FROM orders) AS orders_count,
            (SELECT COUNT(*) FROM order_items) AS order_items_count,
            (SELECT COUNT(*) FROM inventory_stock) AS stock_rows,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) AS physical_total,
            (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) AS stock_reserved_total,
            (SELECT COUNT(*) FROM inventory_reservations WHERE status='active') AS active_reservations,
            (SELECT COALESCE(SUM(quantity),0) FROM inventory_reservations WHERE status='active') AS active_reserved_total,
            (SELECT COUNT(*) FROM catalog_products WHERE is_active=1) AS active_products,
            (SELECT COUNT(*) FROM catalog_variants WHERE is_active=1) AS active_variants;
          " --json
