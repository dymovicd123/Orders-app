name: W3.2 Natural recovery R2

on:
  push:
    branches:
      - safe/w3-2-natural-recovery-20260905

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: "${{ github.event.head_commit.message == 'chore: run W3.2 validation r2' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: safe/w3-2-natural-recovery-20260905
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture accepted frontend and Worker baselines
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const normalizeFrontend = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')
          const attentionText = fs.readFileSync('src/features/inventory/views/renderInventoryAttentionPanel.tsx', 'utf8')
          const attentionSource = ts.createSourceFile('renderInventoryAttentionPanel.tsx', attentionText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let attentionFn = null
          const visitAttention = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryAttentionPanel') attentionFn = node; ts.forEachChild(node, visitAttention) }
          attentionSource.forEachChild(visitAttention)
          const ret = [...attentionFn.body.statements].find((statement) => ts.isReturnStatement(statement))
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          const attentionBefore = sha(normalizeFrontend(expression.getText(attentionSource)))
          const w2 = JSON.parse(fs.readFileSync('scripts/w2-human-warehouse-frontend-manifest.json', 'utf8'))
          if (attentionBefore !== w2.frontend.attentionReturnChange.after) throw new Error(`W3.2 Attention baseline mismatch: ${attentionBefore}`)
          fs.writeFileSync('/tmp/w3-2-attention-before', attentionBefore)

          const wanted = new Set([
            'inventoryLifecycleDeferredInboundDisposition',
            'canAutoApplyFreshWorkshopInbound',
            'quickInventoryStocktakeBatch',
            'completeInventoryStocktakeSession',
          ])
          const workerBefore = {}
          for (const relative of ['worker/domains/lifecycle.ts', 'worker/domains/inventory-stocktake.ts']) {
            const text = fs.readFileSync(relative, 'utf8')
            const source = ts.createSourceFile(relative, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            for (const statement of source.statements) {
              const name = ts.isFunctionDeclaration(statement) && statement.name ? statement.name.text : ''
              if (!wanted.has(name)) continue
              workerBefore[name] = sha(statement.getText(source).replace(/^export\s+/, ''))
            }
          }
          if (Object.keys(workerBefore).length !== wanted.size) throw new Error(`Worker baseline declarations missing: ${JSON.stringify(workerBefore)}`)
          fs.writeFileSync('/tmp/w3-2-worker-before.json', JSON.stringify(workerBefore, null, 2))
          NODE

      - name: Apply W3.2 patch
        run: |
          python3 scripts/apply-w3-2-natural-recovery.py
          python3 scripts/apply-w3-2-worker-preservation.py

      - name: Generate exact W3.2 preservation manifests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const normalizeFrontend = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')

          const attentionText = fs.readFileSync('src/features/inventory/views/renderInventoryAttentionPanel.tsx', 'utf8')
          const attentionSource = ts.createSourceFile('renderInventoryAttentionPanel.tsx', attentionText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let attentionFn = null
          const visitAttention = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryAttentionPanel') attentionFn = node; ts.forEachChild(node, visitAttention) }
          attentionSource.forEachChild(visitAttention)
          const ret = [...attentionFn.body.statements].find((statement) => ts.isReturnStatement(statement))
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          const attentionBefore = fs.readFileSync('/tmp/w3-2-attention-before', 'utf8').trim()
          const attentionAfter = sha(normalizeFrontend(expression.getText(attentionSource)))
          fs.writeFileSync('scripts/w3-2-natural-recovery-frontend-manifest.json', JSON.stringify({
            version: 1,
            revision: 'w3-2-natural-recovery',
            frontend: { attentionReturnChange: { before: attentionBefore, after: attentionAfter } },
          }, null, 2) + '\n')

          const before = JSON.parse(fs.readFileSync('/tmp/w3-2-worker-before.json', 'utf8'))
          const wanted = new Set(Object.keys(before))
          const after = {}
          for (const relative of ['worker/domains/lifecycle.ts', 'worker/domains/inventory-stocktake.ts']) {
            const text = fs.readFileSync(relative, 'utf8')
            const source = ts.createSourceFile(relative, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            for (const statement of source.statements) {
              const name = ts.isFunctionDeclaration(statement) && statement.name ? statement.name.text : ''
              if (!wanted.has(name)) continue
              after[name] = sha(statement.getText(source).replace(/^export\s+/, ''))
            }
          }
          const changes = Object.fromEntries([...wanted].map((name) => [name, { before: before[name], after: after[name] }]))
          fs.writeFileSync('scripts/w3-2-natural-recovery-worker-manifest.json', JSON.stringify({
            version: 1,
            revision: 'w3-2-natural-recovery',
            changes,
          }, null, 2) + '\n')
          console.log('W3.2 preservation manifests generated', changes)
          NODE

      - name: Diff safety
        run: git diff --check

      - name: Focused W3.2 regression
        run: node scripts/test-w3-2-natural-recovery.mjs

      - name: Full cumulative release check
        run: npm run release:check

      - name: Database safety verification
        run: npm run verify:db-safety

      - name: Build
        run: npm run build

      - name: Cloudflare dry run only
        run: npx wrangler deploy --dry-run

      - name: Confirm no migration change
        run: |
          if git diff --name-only | grep -E '(^|/)(migrations?|schema)(/|\.|$)' ; then
            echo 'Unexpected migration/schema change in W3.2'
            exit 1
          fi

      - name: Commit validated W3.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/inventory/useInventoryAttentionActions.ts \
            src/features/inventory/views/renderInventoryAttentionPanel.tsx \
            src/features/sections/InventorySection.tsx \
            src/styles/188b-human-inventory-ui.css \
            worker/domains/lifecycle.ts \
            worker/domains/inventory-stocktake.ts \
            scripts/test-w2-human-warehouse.mjs \
            scripts/test-w2-attention-refresh-r1.mjs \
            scripts/test-step1906a-worker-modularization.mjs \
            scripts/test-step1906b-frontend-modularization.mjs \
            scripts/test-w3-2-natural-recovery.mjs \
            scripts/w3-2-natural-recovery-frontend-manifest.json \
            scripts/w3-2-natural-recovery-worker-manifest.json \
            package.json \
            docs/continuation/W3_2_NATURAL_RECOVERY_20260905.md
          git diff --cached --check
          git commit -m 'W3.2: make Warehouse recovery natural and secondary'
          git push origin HEAD:safe/w3-2-natural-recovery-20260905
