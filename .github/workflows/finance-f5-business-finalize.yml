name: Finance F5 business semantics finalize

on:
  push:
    branches:
      - finance-f5-entry-semantics

permissions:
  contents: write

jobs:
  finalize-check-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f5-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture pre-F5 Worker declaration hashes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'

          const targets = {
            moneyHistoryOperationLabel: 'worker/domains/cash.ts',
            listFinancialHistory: 'worker/domains/cash.ts',
            createManualOrderPaymentCritical: 'worker/domains/money.ts',
            listFinanceReports: 'worker/domains/finance-reports.ts',
          }
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const result = {}
          for (const [name, file] of Object.entries(targets)) {
            const text = fs.readFileSync(file, 'utf8')
            const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            const statement = source.statements.find((node) => (
              (ts.isFunctionDeclaration(node) || ts.isClassDeclaration(node) || ts.isInterfaceDeclaration(node) || ts.isTypeAliasDeclaration(node) || ts.isEnumDeclaration(node))
              && node.name?.text === name
            ))
            if (!statement) throw new Error(`F5 declaration not found before patch: ${name}`)
            result[name] = sha(statement.getText(source).replace(/^export\s+/, ''))
          }
          fs.writeFileSync('/tmp/finance-f5-before.json', JSON.stringify(result, null, 2))
          NODE
      - name: Apply final Finance F5 business semantics
        run: python3 scripts/tmp-finance-f5-business-finalize.py
      - name: Register exact F5 Worker declaration delta
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'

          const before = JSON.parse(fs.readFileSync('/tmp/finance-f5-before.json', 'utf8'))
          const targets = {
            moneyHistoryOperationLabel: 'worker/domains/cash.ts',
            listFinancialHistory: 'worker/domains/cash.ts',
            createManualOrderPaymentCritical: 'worker/domains/money.ts',
            listFinanceReports: 'worker/domains/finance-reports.ts',
          }
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const changes = {}
          for (const [name, file] of Object.entries(targets)) {
            const text = fs.readFileSync(file, 'utf8')
            const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
            const statement = source.statements.find((node) => (
              (ts.isFunctionDeclaration(node) || ts.isClassDeclaration(node) || ts.isInterfaceDeclaration(node) || ts.isTypeAliasDeclaration(node) || ts.isEnumDeclaration(node))
              && node.name?.text === name
            ))
            if (!statement) throw new Error(`F5 declaration not found after patch: ${name}`)
            const after = sha(statement.getText(source).replace(/^export\s+/, ''))
            if (after === before[name]) throw new Error(`Expected Finance F5 Worker declaration did not change: ${name}`)
            changes[name] = { before: before[name], after }
          }
          fs.writeFileSync('scripts/finance-f5-business-semantics-worker-manifest.json', JSON.stringify({
            version: 1,
            revision: 'finance-f5-business-semantics-r1',
            reason: 'Ordinary orders expose only primary payment and debt close; manual primary is anchored to order date; ordinary extra is blocked while exchange extra remains isolated; legacy ordinary extra is presented under debt-close semantics.',
            changes,
          }, null, 2) + '\n')
          NODE

          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-step1906a-worker-modularization.mjs')
          text = path.read_text(encoding='utf-8')

          old = "const financeF4MoneyJournalPath = path.join(root, 'scripts/finance-f4-money-journal-worker-manifest.json')\n"
          new = old + "const financeF5BusinessSemanticsPath = path.join(root, 'scripts/finance-f5-business-semantics-worker-manifest.json')\n"
          if text.count(old) != 1:
              raise SystemExit('F5 manifest path insertion marker mismatch')
          text = text.replace(old, new, 1)

          old = "  check(fs.existsSync(financeF4MoneyJournalPath), 'Finance F4 money journal Worker manifest missing')\n"
          new = old + "  check(fs.existsSync(financeF5BusinessSemanticsPath), 'Finance F5 business semantics Worker manifest missing')\n"
          if text.count(old) != 1:
              raise SystemExit('F5 manifest existence marker mismatch')
          text = text.replace(old, new, 1)

          old = "  const financeF4MoneyJournal = fs.existsSync(financeF4MoneyJournalPath) ? JSON.parse(fs.readFileSync(financeF4MoneyJournalPath, 'utf8')) : null\n  const financeF4MoneyJournalChanges = financeF4MoneyJournal?.version === 1 ? (financeF4MoneyJournal.changes || {}) : {}\n"
          new = old + "  const financeF5BusinessSemantics = fs.existsSync(financeF5BusinessSemanticsPath) ? JSON.parse(fs.readFileSync(financeF5BusinessSemanticsPath, 'utf8')) : null\n  const financeF5BusinessSemanticsChanges = financeF5BusinessSemantics?.version === 1 ? (financeF5BusinessSemantics.changes || {}) : {}\n"
          if text.count(old) != 1:
              raise SystemExit('F5 manifest load marker mismatch')
          text = text.replace(old, new, 1)

          old = """    const financeF4MoneyJournalChanged = financeF4MoneyJournalChanges[name]
    if (financeF4MoneyJournalChanged) {
      check(financeF4MoneyJournalChanged.before === acceptedPostFinanceF2TraceHash, `Finance F4 money journal declaration baseline hash mismatch: ${name}`)
      check(sha(declarations.get(name)) === financeF4MoneyJournalChanged.after, `Worker declaration changed beyond exact Finance F4 money journal allow-list: ${name}`)
    } else {
      check(sha(declarations.get(name)) === acceptedPostFinanceF2TraceHash, `Worker declaration body changed beyond accepted cleanup/boundary/runtime/security/warehouse/catalog/attention/daily-warehouse/context/sql-alias/order-save/stocktake-replay/finance-date-sync/finance-f2-trace/finance-f4-journal deltas: ${name}`)
    }
"""
          new = """    const financeF4MoneyJournalChanged = financeF4MoneyJournalChanges[name]
    let acceptedPostFinanceF4MoneyJournalHash = acceptedPostFinanceF2TraceHash
    if (financeF4MoneyJournalChanged) {
      check(financeF4MoneyJournalChanged.before === acceptedPostFinanceF2TraceHash, `Finance F4 money journal declaration baseline hash mismatch: ${name}`)
      acceptedPostFinanceF4MoneyJournalHash = financeF4MoneyJournalChanged.after
    }
    const financeF5BusinessSemanticsChanged = financeF5BusinessSemanticsChanges[name]
    if (financeF5BusinessSemanticsChanged) {
      check(financeF5BusinessSemanticsChanged.before === acceptedPostFinanceF4MoneyJournalHash, `Finance F5 business semantics declaration baseline hash mismatch: ${name}`)
      check(sha(declarations.get(name)) === financeF5BusinessSemanticsChanged.after, `Worker declaration changed beyond exact Finance F5 business semantics allow-list: ${name}`)
    } else {
      check(sha(declarations.get(name)) === acceptedPostFinanceF4MoneyJournalHash, `Worker declaration body changed beyond accepted cleanup/boundary/runtime/security/warehouse/catalog/attention/daily-warehouse/context/sql-alias/order-save/stocktake-replay/finance-date-sync/finance-f2-trace/finance-f4-journal/finance-f5-business deltas: ${name}`)
    }
"""
          if text.count(old) != 1:
              raise SystemExit('F5 declaration chain marker mismatch')
          text = text.replace(old, new, 1)

          old = "  const orderCreateSaveIntegrityNote = orderCreateSaveIntegrity ? `, ${Object.keys(orderCreateSaveIntegrityChanges).length} changed + ${Object.keys(orderCreateSaveIntegrityAdded).length} added 192B2A4 order-save declarations` : ''\n"
          new = old + "  const financeF5BusinessSemanticsNote = financeF5BusinessSemantics ? `, ${Object.keys(financeF5BusinessSemanticsChanges).length} exact Finance F5 business-semantics deltas` : ''\n"
          if text.count(old) != 1:
              raise SystemExit('F5 status note marker mismatch')
          text = text.replace(old, new, 1)

          old = "${orderCreateSaveIntegrityNote}, 0 import cycles`)"
          new = "${orderCreateSaveIntegrityNote}${financeF5BusinessSemanticsNote}, 0 import cycles`)"
          if text.count(old) != 1:
              raise SystemExit('F5 status output marker mismatch')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified Finance F5 final semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/sections/OrderEditorSection.tsx src/features/renderers/FinanceDashboardRenderer.tsx src/features/renderers/FinanceReportContentRenderer.tsx worker/domains/money.ts worker/domains/finance-reports.ts worker/domains/cash.ts scripts/test-finance-f5-entry-semantics.mjs scripts/test-finance-f5-adjacent-regression.mjs scripts/test-step1906a-worker-modularization.mjs scripts/finance-f5-business-semantics-worker-manifest.json
          git commit -m "Align debt payments and remove ordinary extras [finance-f5-final]"
          git push origin HEAD:finance-f5-entry-semantics
