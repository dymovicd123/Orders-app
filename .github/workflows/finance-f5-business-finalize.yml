name: Finance F5 business semantics finalize

on:
  push:
    branches:
      - finance-f5-entry-semantics

permissions:
  contents: write

jobs:
  finalize-check-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f5-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final Finance F5 business semantics
        run: python3 scripts/tmp-finance-f5-business-finalize.py
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified Finance F5 final semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/sections/OrderEditorSection.tsx src/features/renderers/FinanceDashboardRenderer.tsx src/features/renderers/FinanceReportContentRenderer.tsx worker/domains/money.ts worker/domains/finance-reports.ts worker/domains/cash.ts scripts/test-finance-f5-entry-semantics.mjs scripts/test-finance-f5-adjacent-regression.mjs
          git commit -m "Align debt payments and remove ordinary extras [finance-f5-final]"
          git push origin HEAD:finance-f5-entry-semantics
