name: Finance F5 business semantics finalize

on:
  push:
    branches:
      - finance-f5-entry-semantics

permissions:
  contents: write

jobs:
  finalize-check-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f5-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture pre-F5 Worker declaration hashes
        run: node scripts/tmp-finance-f5-register-worker-deltas.mjs before
      - name: Apply final Finance F5 business semantics
        run: python3 scripts/tmp-finance-f5-business-finalize.py
      - name: Preserve payment-kind union typing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = "          const nextKind = value === 'debt_close' ? 'debt_close' : 'primary'\n"
          new = "          const nextKind: EditorPayment['paymentKind'] = value === 'debt_close' ? 'debt_close' : 'primary'\n"
          if text.count(old) != 1:
              raise SystemExit(f'Finance F5 nextKind marker mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Register exact F5 Worker declaration deltas
        run: node scripts/tmp-finance-f5-register-worker-deltas.mjs after
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified Finance F5 final semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/sections/OrderEditorSection.tsx src/features/renderers/FinanceDashboardRenderer.tsx src/features/renderers/FinanceReportContentRenderer.tsx worker/domains/money.ts worker/domains/finance-reports.ts worker/domains/cash.ts scripts/test-finance-f5-entry-semantics.mjs scripts/test-finance-f5-adjacent-regression.mjs scripts/test-step1906a-worker-modularization.mjs scripts/finance-f5-business-semantics-worker-manifest.json
          git commit -m "Align debt payments and remove ordinary extras [finance-f5-final]"
          git push origin HEAD:finance-f5-entry-semantics
