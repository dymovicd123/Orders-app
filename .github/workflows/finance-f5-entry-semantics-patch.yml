name: Finance F5 entry semantics patch

on:
  push:
    branches:
      - finance-f5-entry-semantics

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[finance-f5-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Finance F5 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tmp-finance-f5-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-finance-f5-entry-semantics.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  check(!app.includes('createEmptyEditorPayment(current.orderDate)'), 'New later editor payment still silently inherits the original order date')\n"
          new = "  const editorAddStart = app.indexOf(\"function addEditorPayment(paymentKind: 'debt_close' | 'extra')\")\n  const editorAddEnd = app.indexOf('function removeEditorPayment', editorAddStart)\n  const editorAddBlock = editorAddStart >= 0 && editorAddEnd > editorAddStart ? app.slice(editorAddStart, editorAddEnd) : ''\n  check(editorAddBlock && !editorAddBlock.includes('createEmptyEditorPayment(current.orderDate)'), 'New later editor payment still silently inherits the original order date')\n"
          if old not in text:
              raise SystemExit('F5 test scope marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Full release gate
        run: npm run release:check
      - name: Commit verified Finance F5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/features/sections/OrderEditorSection.tsx scripts/test-finance-f5-entry-semantics.mjs scripts/release-check.mjs
          git commit -m "Make editor payment semantics explicit [finance-f5-patched]"
          git push origin HEAD:finance-f5-entry-semantics
