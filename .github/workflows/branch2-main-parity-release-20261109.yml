name: Branch2 guarded reviewed test-worker release
# ONE-SHOT reviewed Branch2 mobile timesheet polish; no D1 writes, no Main or Client3.
on:
  pull_request:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-main-parity-release-20261109.yml'
      - 'scripts/branch2-manual-release.mjs'
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-main-parity-release-20261109.yml'
permissions:
  contents: read
concurrency:
  group: branch2-reviewed-release-20261110
  cancel-in-progress: false
jobs:
  preview:
    name: Verify Branch2 exact config, build and Cloudflare DRY-RUN (NO DEPLOY)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify target is isolated Branch2, not Production
        run: node scripts/branch2-manual-release.mjs --check
      - name: Build current Worker+assets and package only
        run: node scripts/branch2-manual-release.mjs --ci-preview

  release:
    name: Publish reviewed Branch2 compact planner and mobile attendance
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/branch2' &&
      startsWith(github.event.head_commit.message, 'release(branch2): timesheet mobile close polish')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify immutable source parity parent, narrow release diff and exact test-only bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git branch --show-current)" = 'branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '258948842733087c9044cc9fd22639c5c8762cbd'
          actual="$(git diff --name-only HEAD^ HEAD)"
          expected="$(printf '%s\n' '.github/workflows/branch2-main-parity-release-20261109.yml')"
          test "$actual" = "$expected"
          # The reviewed PR #901 is immutable in parent 2589488; only this release guard changes now.
          test "$(git hash-object migrations/0122_team_actual_attendance.sql)" = '124cb2f0aa21a4e77f03a16dfbbd1e1d2150d7d4'
          test "$(git hash-object worker/domains/team-attendance.ts)" = 'b11cc66a12dc3fab23a729a80f2667b45f81b24f'
          test "$(git hash-object worker/index.ts)" = 'fe56e19ac7b222a7617e46e9683237a2902dd64e'
          test "$(git hash-object src/App.tsx)" = '8ab6951451508b8c73efbe67fa0e106c728e8d9f'
          test "$(git hash-object src/features/sections/TeamSection.tsx)" = 'e41435983d4421e904d6a8313940322106708986'
          test "$(git hash-object scripts/test-team-attendance-manager-ux-20261110.mjs)" = 'f0dc68dd9388ee4cb870d95445153d873c1a8209'
          test "$(git hash-object worker/domains/team.ts)" = 'cbc2301e26df9c1c7714d24cb5799e50b7e35aaf'
          test "$(git hash-object src/features/team/TeamTimesheetWorkspace.tsx)" = '4fbcbf072914bdd0d099a361affa47dcb8968407'
          test "$(git hash-object scripts/test-team-attendance-v1-20261110.mjs)" = 'cd362ed19ed409b8fd40efb90e02c4cbe286e9be'
          test "$(git hash-object src/features/team/TeamAttendanceReport.tsx)" = 'd35562e500f7353624388c5c8f16a17328cea321'
          test "$(git hash-object src/features/team/teamTimesheetReport.ts)" = 'c1aeed25ea9abc6a61a6b8b88c786a5d8ce3639a'
          test "$(git hash-object src/features/team/teamTimesheetWorkspace.css)" = '2fd74578be14964b7072c9d6ed7e84b013b688dd'
          test "$(git hash-object scripts/test-team-timesheet-report-v2-20261110.mjs)" = 'c7406fe1b89e26406bcee04ce58dc22aeac7c8e2'
          test "$(git hash-object scripts/test-team-timesheet-bulk-safe-20261110.mjs)" = 'f6b90846b09db76674752c15abab543937c5f3b1'
          test "$(git hash-object .github/workflows/quality-check.yml)" = '3d61721000e812bb63211ccee8b327f0af862f54'
          test "$(git hash-object scripts/test-team-timesheet-mobile-ux-20261110.mjs)" = 'fdb86039940dfadc173464528b365595ebdca838'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/branch2-manual-release.mjs --check
      - name: Verify existing Branch2 attendance schema SELECT-only (no migrations)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/branch2-manual-release.mjs --check
          npm ci
          node scripts/test-team-attendance-v1-20261110.mjs
          node scripts/test-team-attendance-manager-ux-20261110.mjs
          node scripts/test-team-timesheet-report-v2-20261110.mjs
          node scripts/test-team-timesheet-bulk-safe-20261110.mjs
          node scripts/test-team-timesheet-mobile-ux-20261110.mjs
          schema="$(npx --no-install wrangler d1 execute orders_db_branch2_mirror_20261027 --remote --config wrangler.jsonc --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('team_attendance_marks','team_attendance_changes')) AS tables, (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name LIKE 'team_attendance_audit_%') AS triggers" --json)"
          printf '%s' "$schema" | jq -e 'if type == "array" then .[0].results[0] else .results[0] end | .tables == 2 and .triggers == 3'
          echo 'BRANCH2_TIMESHEET_MOBILE_SCHEMA_READ_ONLY_PASS'
      - name: Recheck business regression, Worker build, remote D1 SELECT-only, deploy ONLY Branch2 and smoke
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-team-timesheet-report-v2-20261110.mjs
          node scripts/test-team-timesheet-bulk-safe-20261110.mjs
          node scripts/test-team-timesheet-mobile-ux-20261110.mjs
          node scripts/test-team-attendance-manager-ux-20261110.mjs
          node scripts/branch2-manual-release.mjs --publish --sha "$GITHUB_SHA" --confirm BRANCH2-ONLY
