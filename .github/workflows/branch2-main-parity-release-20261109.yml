name: Branch2 guarded reviewed test-worker release
# ONE-SHOT reviewed DDS release: only new isolated Branch2 DDS schema; never Main or Production D1.
on:
  pull_request:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-main-parity-release-20261109.yml'
      - 'scripts/branch2-manual-release.mjs'
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/branch2-main-parity-release-20261109.yml'
permissions:
  contents: read
concurrency:
  group: branch2-reviewed-release-20261110
  cancel-in-progress: false
jobs:
  preview:
    name: Verify Branch2 exact config, build and Cloudflare DRY-RUN (NO DEPLOY)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify target is isolated Branch2, not Production
        run: node scripts/branch2-manual-release.mjs --check
      - name: Build current Worker+assets and package only
        run: node scripts/branch2-manual-release.mjs --ci-preview

  release:
    name: Publish reviewed Branch2 DDS code after isolated D1 schema preparation
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/branch2' &&
      startsWith(github.event.head_commit.message, 'release(branch2): simple dds')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify immutable source parity parent, narrow release diff and exact test-only bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git branch --show-current)" = 'branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '6b254f44e2825f8f0ea1a4e31919b19675d2ac86'
          actual="$(git diff --name-only HEAD^ HEAD)"
          expected="$(printf '%s\n' '.github/workflows/branch2-main-parity-release-20261109.yml' '.github/workflows/quality-check.yml' 'migrations/0120_shared_dds_ledger.sql' 'scripts/test-finance-day-transparency.mjs' 'scripts/test-simple-dds-ledger-20261110.mjs' 'shared/dds-categories.ts' 'src/App.tsx' 'src/features/finance/DdsWorkspace.tsx' 'src/features/finance/dds.css' 'src/features/renderers/FinanceDashboardRenderer.tsx' 'src/features/sections/FinanceSection.tsx' 'worker/domains/dds.ts' 'worker/index.ts')"
          test "$actual" = "$expected"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/branch2-manual-release.mjs --check
      - name: Prepare ONLY the new isolated DDS schema in Branch2 mirror D1
        shell: bash
        run: |
          set -euo pipefail
          node scripts/branch2-manual-release.mjs --check
          test "$GITHUB_REF" = 'refs/heads/branch2'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm ci
          node scripts/test-simple-dds-ledger-20261110.mjs
          # This migration creates only dds_entries, its own indexes and a balance guard.
          # No alterations to any existing order, cash, finance, user or inventory tables.
          npx --no-install wrangler d1 execute orders_db_branch2_mirror_20261027 --remote --config wrangler.jsonc --file migrations/0120_shared_dds_ledger.sql
          checked="$(npx --no-install wrangler d1 execute orders_db_branch2_mirror_20261027 --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM sqlite_master WHERE name IN ('dds_entries','dds_prevent_overdraft')" --json)"
          printf '%s' "$checked" | jq -e 'if type == "array" then .[0].results[0].n == 2 else .results[0].n == 2 end'
      - name: Recheck business regression, Worker build, remote D1 SELECT-only, deploy ONLY Branch2 and smoke
        shell: bash
        run: |
          set -euo pipefail
          node scripts/branch2-manual-release.mjs --publish --sha "$GITHUB_SHA" --confirm BRANCH2-ONLY
