name: Apply false-shipment order delete recovery
on:
  push:
    branches:
      - safe/order-delete-not-issued-20260901
    paths:
      - .github/workflows/apply-order-delete-not-issued.yml
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Scope prepared route patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply-order-delete-not-issued.py')
          text=p.read_text()
          old="""text = once(\n    text,\n    \"        const input = await readJson<{ requestId?: string; comment?: string }>(request);\\n\",\n    \"        const input = await readJson<{ requestId?: string; comment?: string; physicalOutcome?: 'not_issued' }>(request);\\n\",\n    'delete route input',\n)\n"""
          new="""route_start = text.index(\"      const orderDeleteMatch =\")\nroute_end = text.index(\"      const orderMatch =\", route_start)\nroute = text[route_start:route_end]\nroute = once(\n    route,\n    \"        const input = await readJson<{ requestId?: string; comment?: string }>(request);\\n\",\n    \"        const input = await readJson<{ requestId?: string; comment?: string; physicalOutcome?: 'not_issued' }>(request);\\n\",\n    'delete route input',\n)\ntext = text[:route_start] + route + text[route_end:]\n"""
          if text.count(old)!=1:
              raise SystemExit(f'apply-script route anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Apply prepared patch
        run: python3 .github/scripts/apply-order-delete-not-issued.py
      - name: Strengthen physical-truth barriers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/domains/order-delete.ts')
          text=p.read_text()
          old="""      const newerPhysicalTruth = await db.prepare(\n        `SELECT id\n         FROM inventory_stock_checks\n         WHERE inventory_source = ? AND variant_id = ?\n           AND datetime(checked_at) > datetime(?)\n         ORDER BY datetime(checked_at) DESC, id DESC\n         LIMIT 1`\n      ).bind(source, variantId, fulfilledAt).first<{ id: number }>()\n      if (newerPhysicalTruth?.id) {\n        falseShipmentFreshnessProtectedQuantity += quantity\n        continue\n      }\n"""
          new="""      const activeStocktake = await db.prepare(\n        `SELECT id FROM inventory_stocktake_sessions\n         WHERE inventory_source = ? AND status = 'active'\n         LIMIT 1`\n      ).bind(source).first<{ id: string }>()\n      if (activeStocktake?.id) {\n        throw new CriticalOperationConflictError('Сейчас идёт ревизия этого склада. Ложную выдачу нельзя отменять параллельно с физическим пересчётом. Завершите или отмените ревизию и повторите удаление.')\n      }\n      const newerPhysicalTruth = await db.prepare(\n        `SELECT 1 AS found\n         WHERE EXISTS (\n           SELECT 1 FROM inventory_stock_checks\n           WHERE inventory_source = ? AND variant_id = ?\n             AND datetime(checked_at) > datetime(?)\n         ) OR EXISTS (\n           SELECT 1 FROM inventory_stocktake_sessions\n           WHERE inventory_source = ? AND status = 'completed'\n             AND completed_at IS NOT NULL\n             AND id NOT LIKE 'REV-%-P-%'\n             AND datetime(completed_at) > datetime(?)\n         )\n         LIMIT 1`\n      ).bind(source, variantId, fulfilledAt, source, fulfilledAt).first<{ found: number }>()\n      if (newerPhysicalTruth?.found) {\n        falseShipmentFreshnessProtectedQuantity += quantity\n        continue\n      }\n"""
          if text.count(old)!=1:
              raise SystemExit(f'freshness anchor count={text.count(old)}')
          p.write_text(text.replace(old,new,1))

          p=Path('scripts/test-order-delete-mobility.mjs')
          test=p.read_text()
          anchor="""  check(deletion.includes('datetime(checked_at) > datetime(?)'), 'newer physical check freshness barrier missing')\n"""
          replacement=anchor+"""  check(deletion.includes('inventory_stocktake_sessions'), 'stocktake freshness barrier missing')\n  check(deletion.includes(\"status = 'active'\"), 'active stocktake chronology guard missing')\n  check(deletion.includes(\"id NOT LIKE 'REV-%-P-%'\"), 'completed full stocktake barrier missing')\n"""
          if test.count(anchor)!=1:
              raise SystemExit(f'test freshness anchor count={test.count(anchor)}')
          p.write_text(test.replace(anchor,replacement,1))
          PY
      - run: npm ci
      - name: Refresh exact declaration allow-list
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const file = 'worker/domains/order-delete.ts'
          const text = fs.readFileSync(file, 'utf8')
          const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
          const statement = source.statements.find((node) => ts.isFunctionDeclaration(node) && node.name?.text === 'deleteOrderSafely')
          if (!statement) throw new Error('deleteOrderSafely declaration not found')
          const declaration = statement.getText(source).replace(/^export\s+/, '')
          const hash = crypto.createHash('sha256').update(declaration).digest('hex')
          const manifestPath = 'scripts/order-delete-mobility-worker-manifest.json'
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
          if (manifest?.version !== 1 || manifest?.revision !== 'order-delete-mobility-r1') throw new Error('unexpected order-delete manifest baseline')
          manifest.added = { ...(manifest.added || {}), deleteOrderSafely: hash }
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`)
          console.log(`Accepted deleteOrderSafely SHA-256: ${hash}`)
          NODE
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Verify scoped source diff
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main -- scripts/order-delete-mobility-worker-manifest.json scripts/test-order-delete-mobility.mjs src/App.tsx worker/domains/order-delete.ts worker/index.ts)"
          printf '%s\n' "$changed"
          test "$changed" = $'scripts/order-delete-mobility-worker-manifest.json\nscripts/test-order-delete-mobility.mjs\nsrc/App.tsx\nworker/domains/order-delete.ts\nworker/index.ts'
          if git diff --name-only origin/main -- src | grep -Ei 'arrival|приход'; then
            echo 'Arrival changed unexpectedly' >&2
            exit 1
          fi
      - name: Commit gated source
        run: |
          set -euo pipefail
          git config user.name 'dymovicd123'
          git config user.email 'dymovicd@gmail.com'
          git add scripts/order-delete-mobility-worker-manifest.json scripts/test-order-delete-mobility.mjs src/App.tsx worker/domains/order-delete.ts worker/index.ts
          git commit -m 'Allow safe deletion of false shipped orders'
          git push origin HEAD:safe/order-delete-not-issued-20260901
