name: Finalize contextual catalog resolution 20260914

on:
  push:
    branches:
      - fix/contextual-catalog-resolution-20260914
    paths:
      - .github/workflows/finalize-contextual-catalog-resolution-20260914.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Generate exact preservation layer
        run: node scripts/finalize-contextual-catalog-resolution.cjs
      - name: Focused contextual regression
        run: node scripts/test-contextual-catalog-resolution-r1.mjs
      - name: Worker preservation gate
        run: node scripts/test-step1906a-worker-modularization.mjs
      - name: Frontend preservation gate
        run: node scripts/test-step1906b-frontend-modularization.mjs
      - name: Commit exact preservation layer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/contextual-catalog-resolution-r1-worker-manifest.json scripts/contextual-catalog-resolution-r1-frontend-manifest.json scripts/test-step1906a-worker-modularization.mjs scripts/test-step1906b-frontend-modularization.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Preserve contextual catalog resolution exactly"
          git push origin HEAD:fix/contextual-catalog-resolution-20260914
