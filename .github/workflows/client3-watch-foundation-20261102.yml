name: Client3 Watch foundation isolated acceptance (NO DEPLOY)
on:
  push:
    branches: [client3/watch-redesign-20261102]
  pull_request:
    branches: [client3/isolated-stabilization-20261020, client3/watch-ci-accept-20261102]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Prove only Client3 worker and DB identity in repository config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'JS'
          const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))
          if(c.name!=='orders-app-client3-old-client'||c.d1_databases?.length!==1||
             c.d1_databases[0].database_name!=='orders_db_client3_old_client'||
             c.d1_databases[0].database_id!=='0717f239-6d81-4837-8586-777d94e22c53'||
             c.vars?.CLIENT3_INSTALLATION!=='1'||c.vars?.CLIENT3_WATCHES!=='1')process.exit(11)
          console.log('CLIENT3_THIRD_ONLY_ENV_IDENTITY_PASS')
          JS
      - run: npm ci
      - name: Watch SKU, authorized brands, deadline, clean migration on disposable SQLite
        run: node --experimental-strip-types scripts/client3/test-watch-foundation-20261102.mjs
      - name: Brand-scoped HTTP handlers and reliable engraving ready on SQLite
        run: node --experimental-strip-types scripts/client3/test-watch-api-20261102.mjs
      - name: Render real watch order form with two colors, engravings and Kazpost data
        run: node scripts/client3/test-watch-form-20261102.mjs
      - name: Logistics queue UI and strict engraving-only interaction
        run: node scripts/client3/test-watch-logistics-20261102.mjs
      - name: Client3-only shell and auth-safe brand interfaces
        run: node scripts/client3/test-watch-shell-20261102.mjs
      - name: Brand-owned watch order attachment on disposable SQLite
        run: node --experimental-strip-types scripts/client3/test-watch-order-commit-20261102.mjs
      - name: Register watch catalogue drafts with strict brand identity on disposable SQLite
        run: node --experimental-strip-types scripts/client3/test-watch-catalog-20261102.mjs
      - name: Read brand-scoped watch orders and financial summaries on disposable SQLite
        run: node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
      - name: Exact brand-owned canonical SKU provisioning without physical arrivals
        run: node --experimental-strip-types scripts/client3/test-watch-provision-20261102.mjs
      - name: Reject unmapped watch arrivals and unsafe inventory sources
        run: node --experimental-strip-types scripts/client3/test-watch-arrival-guards-20261102.mjs
      - name: Positive watch arrival adapter and retry contract (simulated Main movement boundary)
        run: node --experimental-strip-types scripts/client3/test-watch-arrival-adapter-20261102.mjs
      - name: Stage5 + watch additive migration chain preserves legacy Client3 data
        run: node --experimental-strip-types scripts/client3/test-watch-migration-chain-20261102.mjs
      - name: Watch SKU writeoff rejects reserved watches and idempotent duplication
        run: node --experimental-strip-types scripts/client3/test-watch-writeoff-20261102.mjs
      - name: Real Main warehouse handlers on fully migrated disposable D1 (watch stock E2E)
        run: node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
      - name: Real watch create + reserve + payment on fully migrated disposable D1
        run: node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
      - name: Real Main one-unit same-brand watches exchange with exact SKU and engraving
        run: node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
      - name: Full Main foundation build on isolated tenant code
        run: npm run build
      - name: Dependencies audit
        run: npm audit --omit=dev --audit-level=high
      - name: Explicit non-deployment conclusion
        run: echo 'CLIENT3_WATCH_SOURCE_TESTS_PASSED — no Cloudflare auth used, no remote D1, no Worker deployed'
