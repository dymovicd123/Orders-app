name: Validate catalog resolution R2

on:
  push:
    branches:
      - fix/catalog-resolution-r2-20260914
    paths:
      - src/features/orders/OrderCatalogResolutionModal.tsx
      - src/features/orders/OrderCatalogResolutionModal.css
      - worker/domains/catalog.ts
      - scripts/test-contextual-catalog-resolution-r1.mjs
      - scripts/inspect-catalog-resolution-r2-hash.mjs
      - .github/workflows/validate-catalog-resolution-r2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Inspect exact R2 worker hash
        run: node scripts/inspect-catalog-resolution-r2-hash.mjs
      - name: R2 focused regression
        run: node scripts/test-contextual-catalog-resolution-r1.mjs
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff guard
        run: git diff --check
# preservation-rerun
