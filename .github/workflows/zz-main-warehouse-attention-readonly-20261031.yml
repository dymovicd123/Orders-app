name: "Main real warehouse problems and handover coverage SELECT-only 20261031"
on:
  push:
    branches: [audit/main-warehouse-actionability-readonly-20261031]
    paths: [.github/workflows/zz-main-warehouse-attention-readonly-20261031.yml]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute current Main warehouse attention with SELECT-only D1 adapter
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/audit/main-warehouse-actionability-readonly-20261031"
          node --check scripts/ops/main-warehouse-attention-readonly-20261031.mjs
          node --experimental-strip-types scripts/ops/main-warehouse-attention-readonly-20261031.mjs

# Recheck after Main wrangler JSONC parser adjustment.
