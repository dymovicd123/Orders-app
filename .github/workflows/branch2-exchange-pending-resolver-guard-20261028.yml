name: Branch2 delayed exchange resolver protection
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'worker/domains/lifecycle.ts'
      - 'worker/domains/returns-exchanges.ts'
      - 'scripts/test-branch2-exchange-pending-resolver-guard-20261028.mjs'
      - '.github/workflows/branch2-exchange-pending-resolver-guard-20261028.yml'
  push:
    branches: [branch2]
    paths:
      - 'worker/domains/lifecycle.ts'
      - 'worker/domains/returns-exchanges.ts'
      - 'scripts/test-branch2-exchange-pending-resolver-guard-20261028.mjs'
      - '.github/workflows/branch2-exchange-pending-resolver-guard-20261028.yml'
permissions:
  contents: read
concurrency:
  group: branch2-exchange-pending-resolver-guard
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Verify resolver cannot ship an unshipped exchange
        run: node scripts/test-branch2-exchange-pending-resolver-guard-20261028.mjs
      - name: Existing exchange shipment and stock integrity regressions
        run: |
          node scripts/test-branch2-exchange-delayed-dispatch-20261028.mjs
          node scripts/test-branch2-partial-return-atomic-and-exchange-ui-20261028.mjs
          node scripts/test-return-active-reserve-p0-20261021.mjs
      - run: npm run build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/branch2'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Ensure test Worker and copy D1 only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = branch2
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2_mirror_20261027"' wrangler.jsonc
          grep -Fq '"database_id": "0904a573-21ff-44d8-93b0-c9200f771702"' wrangler.jsonc
          ! grep -Eiq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
      - run: npm ci
      - run: node scripts/test-branch2-exchange-pending-resolver-guard-20261028.mjs
      - run: npm run build
      - run: npx wrangler deploy
      - name: Verify Branch2 origin
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://orders-app-branch2.orders-clothes.workers.dev/?resolver_guard='+Date.now(),{cache:'no-store'})
          if(!response.ok || !(await response.text()).includes('/assets/'))throw Error('Branch2 origin unavailable')
          console.log('BRANCH2_EXCHANGE_PENDING_RESOLVER_GUARD_DEPLOY_PASS')
          NODE
