name: W2 apply and verify

on:
  push:
    branches:
      - safe/w2-runner-20260905

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Rebuild and apply W2 patch
        shell: bash
        run: |
          set -euo pipefail
          for f in .w2tmp/part00 .w2tmp/part01 .w2tmp/part02 .w2tmp/part03; do test -f "$f"; done
          cat .w2tmp/part* | base64 --decode | gzip --decompress > /tmp/w2-human-warehouse.patch
          bytes="$(wc -c < /tmp/w2-human-warehouse.patch)"
          sha="$(sha256sum /tmp/w2-human-warehouse.patch | awk '{print $1}')"
          echo "Patch bytes: $bytes"
          echo "Patch sha256: $sha"
          test "$bytes" -eq 74505
          test "$sha" = "dd59aba82b7bfa9dfd9846cac816f34d28be031dd8929cd580d82f32ea1642e0"
          git apply --check /tmp/w2-human-warehouse.patch
          git apply /tmp/w2-human-warehouse.patch
          git diff --check
          git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: W1 adjacent warehouse regression
        run: node scripts/test-w1-warehouse-reliability.mjs

      - name: W2 human warehouse regression
        run: node scripts/test-w2-human-warehouse.mjs

      - name: Cumulative release gate
        run: npm run release:check

      - name: Database safety
        run: npm run verify:db-safety

      - name: Production build
        run: npm run build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Commit validated W2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .w2tmp
          rm -f .github/workflows/w2-current-snapshot.yml
          rm -f .github/workflows/w2-apply-verify.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          test -n "$(git status --porcelain)"
          git commit -m "Complete W2 human warehouse step"
          git push origin HEAD:safe/w2-runner-20260905
