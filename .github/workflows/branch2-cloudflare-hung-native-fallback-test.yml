name: Branch2 implicit deploy disabled safety check
on:
  pull_request:
    branches: [branch2]
    paths:
      - '.github/workflows/cloudflare-deploy-monitor.yml'
      - '.github/workflows/branch2-cloudflare-hung-native-fallback-test.yml'
      - 'scripts/test-branch2-no-implicit-deploy-20261030.mjs'

permissions:
  contents: read

jobs:
  no-hidden-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-branch2-no-implicit-deploy-20261030.mjs
