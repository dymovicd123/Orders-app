name: Branch2 hanging Cloudflare native fallback safety
on:
  push:
    branches:
      - fix/branch2-cloudflare-hanging-build-fallback-20261021
  pull_request:
    branches: [branch2]
    paths:
      - '.github/workflows/cloudflare-deploy-monitor.yml'
      - 'scripts/test-branch2-cloudflare-hung-native-fallback-20261021.mjs'
      - '.github/workflows/branch2-cloudflare-hung-native-fallback-test.yml'
jobs:
  immutable-main-and-branch2-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-branch2-cloudflare-hung-native-fallback-20261021.mjs
