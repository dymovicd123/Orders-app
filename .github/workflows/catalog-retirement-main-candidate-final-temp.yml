name: Temporary Catalog retirement main candidate validation final r3

on:
  push:
    branches:
      - release/catalog-retirement-main-20260930
    paths:
      - '.github/workflows/catalog-retirement-main-candidate-final-temp.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate reconciled main candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: High-risk development dependency audit
        run: npm audit --audit-level=high
      - name: Cumulative release gate
        run: npm run release:check
      - name: Build
        run: npm run build
