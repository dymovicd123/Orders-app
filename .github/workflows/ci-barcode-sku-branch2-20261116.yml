name: Barcode SKU foundation Branch2 CI

on:
  push:
    branches:
      - feature/barcode-sku-branch2-20261116
  pull_request:
    branches:
      - branch2
    paths:
      - shared/barcode-*.ts
      - worker/domains/barcode-sku.ts
      - src/features/inventory/views/SkuBarcodeButton.tsx
      - src/features/inventory/views/skuBarcodeLabel.css
      - scripts/test-barcode-sku-*.mjs
      - worker/index.ts
      - src/features/inventory/views/catalogPolishExecutionGroups.tsx
      - .github/workflows/ci-barcode-sku-branch2-20261116.yml

permissions:
  contents: read

jobs:
  barcode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Barcode checksum and Code128 tests
        run: node scripts/test-barcode-sku-foundation.mjs
      - name: Read-only SKU lookup against isolated SQLite
        run: node scripts/test-barcode-sku-http-domain-20261116.mjs
      - name: TypeScript and bundle build
        run: npm run build
