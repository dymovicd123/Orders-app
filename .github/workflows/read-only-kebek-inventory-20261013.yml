name: Read-only Kebek inventory identity investigation
on:
  push:
    branches: [branch2]
    paths: ['.github/workflows/read-only-kebek-inventory-20261013.yml']
permissions:
  contents: read
jobs:
  verify:
    name: Read-only SKU/history comparison in both isolated D1 databases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce branch2 workflow and two fixed database identities
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'branch2'
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
          node - <<'NODE'
          const fs=require('node:fs')
          const text=fs.readFileSync('wrangler.jsonc','utf8')
          const prod=text.replace('orders-app-branch2','orders-app')
            .replace('orders_db_branch2','orders_db_prod')
            .replace('40065052-854e-44b8-bcd5-251bdd488301','17e68a41-1d58-4a36-8a63-47c3e32443c4')
          if(!prod.includes('17e68a41-1d58-4a36-8a63-47c3e32443c4'))throw Error('prod identity mismatch')
          fs.writeFileSync('wrangler.diagnostic-prod.jsonc',prod)
          NODE
      - run: npm ci
      - name: Execute three hard-coded SELECT-only diagnostics per database (never write)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/kebek-history.sql <<'SQL'
          SELECT m.id AS movement_id,m.created_at,m.movement_type,
            m.variant_id AS movement_variant_id,m.quantity_delta,m.quantity_after,
            m.size_snapshot AS history_size,m.color_snapshot AS history_color,
            m.material_snapshot AS history_material,m.length_snapshot AS history_length,
            v.is_active AS variant_active,v.size_label AS current_variant_size,
            v.color AS current_variant_color,v.material AS current_variant_material,
            v.length AS current_variant_length,v.stock_position_id AS current_stock_position,
            s.id AS current_stock_id,s.quantity AS current_stock_quantity,
            s.reserved_quantity AS current_stock_reserved
          FROM inventory_movements m
          LEFT JOIN catalog_variants v ON v.id=m.variant_id
          LEFT JOIN inventory_stock s ON s.variant_id=m.variant_id AND s.inventory_source=m.inventory_source
          WHERE m.inventory_source='warehouse'
            AND m.created_at >= '2026-10-13'
            AND UPPER(m.product_name_snapshot) LIKE '%КЕБЕК%'
            AND UPPER(m.color_snapshot) LIKE '%ШОКОЛАД%'
          ORDER BY m.id DESC LIMIT 30
          SQL
          cat > /tmp/kebek-stock.sql <<'SQL'
          SELECT s.id AS stock_id,s.variant_id,s.quantity,s.reserved_quantity,
            s.product_name_snapshot AS stock_product,s.color_snapshot AS stock_color,
            s.size_snapshot AS stock_size,s.material_snapshot AS stock_material,
            s.length_snapshot AS stock_length,s.gender_snapshot AS stock_gender,
            v.id AS variant_exists,v.is_active AS variant_active,
            v.size_label AS catalog_size,v.color AS catalog_color,
            v.material AS catalog_material,v.length AS catalog_length,
            v.stock_position_id,p.name AS linked_product
          FROM inventory_stock s
          LEFT JOIN catalog_variants v ON v.id=s.variant_id
          LEFT JOIN catalog_products p ON p.id=v.product_id
          WHERE s.inventory_source='warehouse' AND (
            (UPPER(s.product_name_snapshot) LIKE '%КЕБЕК%' AND UPPER(s.color_snapshot) LIKE '%ШОКОЛАД%')
            OR (UPPER(p.name) LIKE '%КЕБЕК%' AND UPPER(v.color) LIKE '%ШОКОЛАД%'))
          ORDER BY s.variant_id,s.id LIMIT 100
          SQL
          cat > /tmp/kebek-catalog.sql <<'SQL'
          SELECT v.id AS catalog_variant_id,v.is_active AS variant_active,
            v.size_label,v.color,v.material,v.length,v.gender,v.category,
            v.stock_position_id,
            (SELECT COALESCE(SUM(s.quantity),0) FROM inventory_stock s
              WHERE s.inventory_source='warehouse' AND s.variant_id=v.id) AS linked_warehouse_quantity,
            (SELECT COUNT(*) FROM inventory_stock s WHERE s.inventory_source='warehouse' AND s.variant_id=v.id) AS linked_stock_rows
          FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id
          WHERE UPPER(p.name) LIKE '%КЕБЕК%' AND UPPER(v.color) LIKE '%ШОКОЛАД%'
          ORDER BY v.id LIMIT 100
          SQL
          # The SQL files are fixed read-only SELECT text. Fail before touching any database on accidental modifications.
          for f in /tmp/kebek-history.sql /tmp/kebek-stock.sql /tmp/kebek-catalog.sql; do
            if grep -Eiq '\b(UPDATE|DELETE|INSERT|DROP|ALTER|CREATE|REPLACE|ATTACH|DETACH|PRAGMA|VACUUM)\b' "$f"; then
              echo "Unsafe SQL diagnostic rejected" >&2; exit 47
            fi
          done
          for env in branch2 prod; do
            if [[ "$env" == branch2 ]]; then
              db='orders_db_branch2'; config='wrangler.jsonc'
            else
              db='orders_db_prod'; config='wrangler.diagnostic-prod.jsonc'
            fi
            echo "====== $env: history movement ↔ current linked stock ======"
            npx wrangler d1 execute "$db" --remote --config "$config" --command "$(cat /tmp/kebek-history.sql)" --json |
              jq -c '.[0].results'
            echo "====== $env: current warehouse stock rows ↔ catalog variants ======"
            npx wrangler d1 execute "$db" --remote --config "$config" --command "$(cat /tmp/kebek-stock.sql)" --json |
              jq -c '.[0].results'
            echo "====== $env: active/archived catalog variants with current stock ======"
            npx wrangler d1 execute "$db" --remote --config "$config" --command "$(cat /tmp/kebek-catalog.sql)" --json |
              jq -c '.[0].results'
          done
          echo 'READ-ONLY KEBEK INVENTORY DIAGNOSIS COMPLETED — no data modification'
      - name: Run only immutable inventory SELECTs (never modify D1)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bayan-catalog.sql <<'SQL'
          SELECT v.id AS variant_id,v.product_id,p.name AS product,v.is_active AS active,v.category,v.gender,v.color,v.size_label,v.material,v.length,v.stock_position_id,s.id AS stock_id,s.inventory_source AS source,s.quantity AS physical,s.reserved_quantity AS reserved,s.last_action,s.last_source_ref,s.updated_at FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id LEFT JOIN inventory_stock s ON s.variant_id=v.id WHERE (p.name LIKE '%БАЯН%' OR p.name LIKE '%Баян%') ORDER BY v.id,s.inventory_source LIMIT 220;
          SQL
          cat > /tmp/bayan-orphan.sql <<'SQL'
          SELECT s.id AS stock_id,s.variant_id,s.inventory_source,s.product_name_snapshot,s.color_snapshot,s.size_snapshot,s.material_snapshot,s.length_snapshot,s.gender_snapshot,s.quantity,s.reserved_quantity,s.last_action,s.last_source_ref,s.updated_at,v.id AS linked_variant,v.is_active AS variant_active FROM inventory_stock s LEFT JOIN catalog_variants v ON v.id=s.variant_id WHERE s.product_name_snapshot LIKE '%БАЯН%' OR s.product_name_snapshot LIKE '%Баян%' ORDER BY s.id LIMIT 220;
          SQL
          cat > /tmp/bayan-movements.sql <<'SQL'
          SELECT m.id,m.created_at,m.inventory_source,m.movement_type,m.variant_id,m.quantity_delta,m.quantity_after,m.reference_type,m.reference_id,m.color_snapshot,m.size_snapshot,m.material_snapshot,m.length_snapshot,m.gender_snapshot,m.comment,r.reversed_at FROM inventory_movements m LEFT JOIN inventory_movement_reversals r ON r.original_movement_id=m.id WHERE (m.product_name_snapshot LIKE '%БАЯН%' OR m.product_name_snapshot LIKE '%Баян%') AND m.created_at >= '2026-10-13' ORDER BY m.id DESC LIMIT 250;
          SQL
          cat > /tmp/bayan-target-history.sql <<'SQL'
          SELECT m.id,m.created_at,m.inventory_source,m.movement_type,m.variant_id,m.quantity_delta,m.quantity_after,m.reference_type,m.reference_id,m.color_snapshot,m.size_snapshot,m.material_snapshot,m.length_snapshot,m.comment FROM inventory_movements m WHERE (m.product_name_snapshot LIKE '%БАЯН%' OR m.product_name_snapshot LIKE '%Баян%') AND ((m.color_snapshot LIKE '%БЕЖ%' AND m.size_snapshot='48') OR (m.color_snapshot LIKE '%ОРАНЖ%' AND m.size_snapshot='56')) ORDER BY m.id DESC LIMIT 150;
          SQL
          cat > /tmp/bayan-checks.sql <<'SQL'
          SELECT c.id,c.checked_at,c.inventory_source,c.variant_id,c.expected_quantity,c.counted_quantity,c.difference_quantity,c.reserved_quantity,c.check_type,c.reference_type,c.reference_id FROM inventory_stock_checks c WHERE c.checked_at >= '2026-10-13' AND c.variant_id IN (SELECT v.id FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id WHERE p.name LIKE '%БАЯН%' OR p.name LIKE '%Баян%') ORDER BY c.id DESC LIMIT 180;
          SQL
          cat > /tmp/bayan-reservations.sql <<'SQL'
          SELECT r.inventory_source,r.variant_id,r.status,COUNT(*) AS reservations,SUM(r.quantity) AS total_quantity,MIN(r.created_at) AS first_created,MAX(r.created_at) AS last_created FROM inventory_reservations r WHERE r.variant_id IN (SELECT v.id FROM catalog_variants v JOIN catalog_products p ON p.id=v.product_id WHERE p.name LIKE '%БАЯН%' OR p.name LIKE '%Баян%') GROUP BY r.inventory_source,r.variant_id,r.status ORDER BY r.variant_id,r.inventory_source,r.status LIMIT 220;
          SQL
          cat > /tmp/bayan-order.sql <<'SQL'
          SELECT o.external_id,o.order_date,o.created_at,o.shipping_status,o.order_status,oi.id AS item_id,oi.variant_id,oi.quantity,oi.product_name_snapshot,oi.color_snapshot,oi.material_snapshot,oi.size_snapshot,oi.stock_writeoff_status,r.status AS reservation_status,r.quantity AS reservation_quantity,r.inventory_source AS reservation_source FROM orders o JOIN order_items oi ON oi.order_id=o.id LEFT JOIN inventory_reservations r ON r.order_item_id=oi.id WHERE o.external_id='ORD-20261013131915-4181A125' LIMIT 30;
          SQL
          for f in /tmp/bayan-*.sql; do
            grep -Eq '^SELECT ' "$f"
            if grep -Eiq '\b(UPDATE|DELETE|INSERT|DROP|ALTER|CREATE|REPLACE|ATTACH|DETACH|PRAGMA|VACUUM)\b' "$f"; then
              echo "Unsafe SQL diagnostic rejected" >&2; exit 47
            fi
          done
          echo '======== CATALOG (catalog: production READ ONLY) ========'
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.diagnostic-prod.jsonc --command "$(cat /tmp/bayan-catalog.sql)" --json | jq -c '.[0].results'
          echo '======== ORPHAN (orphan: production READ ONLY) ========'
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.diagnostic-prod.jsonc --command "$(cat /tmp/bayan-orphan.sql)" --json | jq -c '.[0].results'
          echo '======== MOVEMENTS (movements: production READ ONLY) ========'
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.diagnostic-prod.jsonc --command "$(cat /tmp/bayan-movements.sql)" --json | jq -c '.[0].results'
          echo '======== TARGET-HISTORY (target-history: production READ ONLY) ========'
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.diagnostic-prod.jsonc --command "$(cat /tmp/bayan-target-history.sql)" --json | jq -c '.[0].results'
          echo '======== CHECKS (checks: production READ ONLY) ========'
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.diagnostic-prod.jsonc --command "$(cat /tmp/bayan-checks.sql)" --json | jq -c '.[0].results'
          echo '======== RESERVATIONS (reservations: production READ ONLY) ========'
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.diagnostic-prod.jsonc --command "$(cat /tmp/bayan-reservations.sql)" --json | jq -c '.[0].results'
          echo '======== ORDER (order: production READ ONLY) ========'
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.diagnostic-prod.jsonc --command "$(cat /tmp/bayan-order.sql)" --json | jq -c '.[0].results'
          echo 'READ-ONLY BAYAN MAIN INVENTORY DIAGNOSTICS COMPLETE — no D1 writes'
