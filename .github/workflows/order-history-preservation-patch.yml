name: Order history preservation patch

on:
  push:
    branches:
      - catalog-gender-cleanup-r1
    paths:
      - scripts/apply-order-history-preservation-r1.mjs
      - .github/workflows/order-history-preservation-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-gender-cleanup-r1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        run: node scripts/apply-order-history-preservation-r1.mjs
      - name: Run focused history gate
        run: node scripts/test-catalog-order-history-preservation-r1.mjs
      - name: Commit generated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/orders-read.ts worker/domains/orders-write.ts scripts/test-catalog-order-history-preservation-r1.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m "Preserve historical order item snapshots across catalog cleanup"
          git push origin HEAD:catalog-gender-cleanup-r1
