name: Cleanup pre-August maintenance

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-preaug-maintenance.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Remove transient maintenance route and temporary gate exception
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker=Path('worker/index.ts')
          text=worker.read_text()
          begin="      // PREAUG_MAINTENANCE_BEGIN\n"
          end="      // PREAUG_MAINTENANCE_END\n"
          if text.count(begin) != 1 or text.count(end) != 1:
              raise SystemExit('maintenance markers missing or duplicated')
          i=text.index(begin)
          j=text.index(end, i)+len(end)
          text=text[:i]+text[j:]
          worker.write_text(text)

          gate=Path('scripts/test-step1906a-worker-modularization.mjs')
          g=gate.read_text()
          transient="    .replace(/\\n[ \\t]*\\/\\/ PREAUG_MAINTENANCE_BEGIN[\\s\\S]*?\\n[ \\t]*\\/\\/ PREAUG_MAINTENANCE_END\\n/, '')\n"
          if g.count(transient) != 1:
              raise SystemExit(f'transient router normalization count={g.count(transient)}')
          gate.write_text(g.replace(transient,'',1))
          PY
          rm -f .deploy-preaug-20260831-r3.trigger
          rm -f .deploy-preaug-api-20260831.trigger
          rm -f .github/workflows/backfill-preaug-shipping-20260831.yml
      - name: Full release gate after cleanup
        run: npm run release:check
      - name: Commit clean production source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-preaug-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove pre-August maintenance route after backfill'
          git push origin HEAD:main
