name: Advance finance frontend allow-list

on:
  push:
    branches:
      - fix/finance-business-date-r1-20260916

permissions:
  contents: write

jobs:
  advance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-business-date-r1-20260916
      - name: Advance exact allow-list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-step1906b-frontend-modularization.mjs')
          text = path.read_text(encoding='utf-8')
          old = "const financeDayAddedFiles = ['shared/finance-day-contracts.ts','src/features/finance/financeDayRead.ts','src/features/finance/FinanceDayPanel.tsx','src/features/finance/FinanceDayView.tsx','src/features/finance/finance-day.css']"
          new = "const financeDayAddedFiles = ['shared/finance-day-contracts.ts','src/features/finance/FinanceDayView.tsx','src/features/finance/finance-day.css']"
          if text.count(old) != 1:
              raise SystemExit('finance day frontend allow-list anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/advance-finance-frontend-allowlist.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-step1906b-frontend-modularization.mjs
          git commit -m "Retire special-day frontend modules from allow-list"
          git push origin HEAD:fix/finance-business-date-r1-20260916
