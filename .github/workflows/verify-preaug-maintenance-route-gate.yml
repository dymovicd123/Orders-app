name: Verify pre-August maintenance route gate

on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-preaug-maintenance-route-gate.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Mark transient route and exclude it from canonical router hash
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker=Path('worker/index.ts')
          text=worker.read_text()
          start="      if (url.pathname === '/__maintenance/preaug-20260831-1fe7c9c45d0b4a2d' && request.method === 'GET') {"
          next_route="      if (url.pathname === '/api/admin-mode/status' && request.method === 'GET') {"
          if text.count(start) != 1 or text.count(next_route) != 1:
              raise SystemExit('maintenance route anchors changed')
          text=text.replace(start, "      // PREAUG_MAINTENANCE_BEGIN\n"+start, 1)
          idx=text.index(next_route)
          prefix=text[:idx]
          suffix=text[idx:]
          if not prefix.endswith('\n\n'):
              raise SystemExit('unexpected route spacing')
          prefix=prefix[:-2] + "\n      // PREAUG_MAINTENANCE_END\n\n"
          worker.write_text(prefix+suffix)

          gate=Path('scripts/test-step1906a-worker-modularization.mjs')
          g=gate.read_text()
          anchor="  const normalizedRouter = currentRouter\n    .replace("
          replacement="  const normalizedRouter = currentRouter\n    .replace(/\\n[ \\t]*\\/\\/ PREAUG_MAINTENANCE_BEGIN[\\s\\S]*?\\n[ \\t]*\\/\\/ PREAUG_MAINTENANCE_END\\n/, '\\n')\n    .replace("
          if g.count(anchor) != 1:
              raise SystemExit('router normalization anchor changed')
          gate.write_text(g.replace(anchor,replacement,1))
          PY
      - name: Full release gate
        run: npm run release:check
      - name: Commit tested transient-route gate support
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-preaug-maintenance-route-gate.yml .deploy-preaug-20260831.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate transient pre-August maintenance route'
          git push origin HEAD:main
