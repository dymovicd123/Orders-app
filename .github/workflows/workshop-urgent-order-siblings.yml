name: Workshop urgent order siblings

on:
  push:
    branches:
      - dashboard-workshop-attention-r1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-workshop-attention-r1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Include whole urgent order
        run: python scripts/tmp-workshop-urgent-order-siblings.py
      - name: Typecheck
        run: npm run typecheck
      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/workshop-urgent-order-siblings.yml scripts/tmp-workshop-urgent-order-siblings.py
          git add worker/domains/workshop.ts
          git commit -m "Workshop: keep urgent order items together"
          git push origin HEAD:dashboard-workshop-attention-r1
