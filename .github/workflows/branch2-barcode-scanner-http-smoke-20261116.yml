name: Branch2 Barcode scanner post-deploy complete HTTP smoke (READ ONLY)
on:
  push:
    branches: [branch2]
    paths:
      - .github/workflows/branch2-barcode-scanner-http-smoke-20261116.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Branch2 endpoints with complete JSON payloads (NO WRITES)
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          origin='https://orders-app-branch2.orders-clothes.workers.dev'
          for path in ['/api/health','/api/auth/status','/']:
            ok=False
            for attempt in range(1,6):
              request=urllib.request.Request(origin+path,
                headers={'Accept':'application/json,text/html','User-Agent':'OrdersBarcodeSmoke/1.0'})
              try:
                with urllib.request.urlopen(request,timeout=20) as response:
                  status=response.status
                  content=response.read(200000)
                  if status!=200:raise ValueError('Unexpected '+str(status))
                  if path!='/':
                    result=json.loads(content)
                    if result.get('ok') is not True:raise ValueError('Response missing ok=true')
                  elif b'<html' not in content.lower():raise ValueError('No HTML in root response')
                  print('BRANCH2_BARCODE_HTTP_PASS',path,status,'bytes',len(content))
                  ok=True
                  break
              except urllib.error.HTTPError as error:
                print('RETRY_HTTP',path,attempt,error.code,error.headers.get('cf-ray'))
              except Exception as error:
                print('RETRY_HTTP',path,attempt,type(error).__name__,str(error)[:130])
              time.sleep(2)
            if not ok:raise SystemExit('BRANCH2_BARCODE_POST_DEPLOY_SMOKE_FAILED: '+path)
          print('BRANCH2_BARCODE_SCANNER_PUBLIC_READINESS_CONFIRMED')
          PY
