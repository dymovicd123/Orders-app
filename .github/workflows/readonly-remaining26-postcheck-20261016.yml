name: 'Independent postcheck of 26 canonical colors (SELECT-only)'
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ops/readonly-remaining26-postcheck-20261016.mjs'
      - '.github/workflows/readonly-remaining26-postcheck-20261016.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin production D1 for independent SELECT-only verification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
          node --check scripts/ops/readonly-remaining26-postcheck-20261016.mjs
          cat > "$RUNNER_TEMP/production-color-independent.jsonc" <<'CFG'
          {
            "name": "orders-app-select-only-independent-verification",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_READONLY_CONFIG=$RUNNER_TEMP/production-color-independent.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Independently verify production SKU names, physical stock, reservations and FTS
        run: node scripts/ops/readonly-remaining26-postcheck-20261016.mjs
