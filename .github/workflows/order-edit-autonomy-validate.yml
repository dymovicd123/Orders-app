name: Order edit autonomy validate

on:
  push:
    branches: [autonomy-order-edit-r1]
    paths: [scripts/.order-edit-autonomy-trigger]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded patch
        run: python scripts/apply-order-edit-autonomy-r1.py
      - name: Install dependencies
        run: npm ci
      - name: Register exact structural delta
        run: node scripts/register-order-edit-autonomy-r1.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full release gates
        run: npm run release:check
      - name: Commit validated result
        run: |
          git config user.name orders-app-autonomy-bot
          git config user.email actions@users.noreply.github.com
          git add worker/domains/orders-write.ts worker/index.ts src/App.tsx src/features/sections/OrdersTableSection.tsx src/features/sections/OrderDetailsSection.tsx src/features/sections/OrderEditorSection.tsx scripts/test-order-edit-autonomy.mjs scripts/test-step1906a-worker-modularization.mjs scripts/order-edit-autonomy-worker-manifest.json package.json
          git diff --cached --check
          git commit -m "Make active order editing autonomous"
          git push origin HEAD:autonomy-order-edit-r1
