name: Apply Branch2 schema sync 0065-0069

on:
  push:
    branches:
      - ops/branch2-schema-sync-20260916
    paths:
      - .github/workflows/apply-branch2-schema-sync-20260916.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/branch2-schema-sync-20260916
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply isolated Branch2 schema sync with strict guards
        shell: bash
        run: bash scripts/apply-branch2-schema-sync-20260916.sh
      - name: Upload schema-sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch2-schema-sync-evidence
          path: evidence/
          retention-days: 30
