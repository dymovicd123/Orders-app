name: Branch2 resolver live E2E

on:
  push:
    branches:
      - w-branch2-resolver-e2e-20260919

permissions:
  contents: read

jobs:
  resolver-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Resolve deployed branch2 Worker URL
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          json="$(curl --fail-with-body -sS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$json")"
          if [[ -z "$subdomain" ]]; then
            echo "Could not resolve Cloudflare workers.dev subdomain" >&2
            echo "$json" >&2
            exit 2
          fi
          base_url="https://orders-app-branch2.$subdomain.workers.dev"
          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
          curl --fail-with-body -sS "$base_url/api/health" | jq .

      - name: Run live resolver matrix against branch2
        env:
          RUN_TAG: ${{ github.run_id }}
        run: node scripts/branch2-resolver-live-e2e.mjs

      - name: Remove temporary learned aliases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_branch2 --remote --command             "DELETE FROM catalog_product_aliases WHERE raw_value LIKE 'АВТОТЕСТ%'; DELETE FROM catalog_value_aliases WHERE raw_value LIKE 'АВТОТЕСТ%';"             >/tmp/resolver-cleanup.log 2>&1 || {
              cat /tmp/resolver-cleanup.log
              exit 1
            }
          cat /tmp/resolver-cleanup.log
