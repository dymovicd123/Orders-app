name: Client3 lifecycle rebuild QA (isolated, no deploy)
on:
  push:
    branches: [client3/lifecycle-main-rebuild-20261104]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    name: Watch ledger, shipping, return, logistics, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exact per-item read, partial dispatch and physical intake
        run: node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
      - name: Logistics component regressions
        run: node --experimental-strip-types scripts/client3/test-watch-logistics-20261102.mjs
      - name: Partial return value and exchange history interface
        run: node --experimental-strip-types scripts/client3/test-watch-return-money-ui-20261104.mjs
      - name: Main order engine and full returns
        run: node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
      - name: Main exchange and return lineage
        run: node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
      - name: Main-style watch catalog, workspace and warehouse checks
        run: |
          set -euo pipefail
          for file in \
            scripts/client3/test-watch-main-step1-20261102.mjs \
            scripts/client3/test-watch-form-20261102.mjs \
            scripts/client3/test-watch-warehouse-order-parity-20261102.mjs \
            scripts/client3/test-watch-full-stock-engine-20261102.mjs \
            scripts/client3/test-watch-shared-cash-team-20261103.mjs \
            scripts/client3/test-watch-workspace-layout-20261102.mjs \
            scripts/client3/test-main-workflow-parity-20261102.mjs; do
            node --experimental-strip-types "$file"
          done
      - name: TypeScript and production bundle compile
        run: npm run build
