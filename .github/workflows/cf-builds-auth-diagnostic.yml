name: Cloudflare Builds auth diagnostic

on:
  push:
    branches: [safe/cf-builds-auth-diagnostic-20260902]
    paths:
      - scripts/.cf-builds-auth-diagnostic-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Verify user token and read Workers/Builds APIs
        shell: bash
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $CF_API_TOKEN")

          echo '--- token verify ---'
          curl -sS "${AUTH[@]}" "$CF_API/user/tokens/verify" | jq '{success, errors, messages, result: {id: .result.id, status: .result.status}}'

          echo '--- worker scripts ---'
          workers_json="$(curl -sS "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/scripts")"
          jq '{success, errors, messages, worker_count: (.result | length)}' <<<"$workers_json"
          worker_tag="$(jq -r '.result[] | select(.id == "orders-app") | .tag // empty' <<<"$workers_json" | head -n1)"
          echo "orders-app tag resolved: ${worker_tag:+yes}"
          test -n "$worker_tag"

          echo '--- builds list ---'
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w '%{http_code}' "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/builds/workers/$worker_tag/builds")"
          echo "HTTP $code"
          jq '{success, errors, messages, result_type: (.result | type)}' "$tmp" || cat "$tmp"

          echo '--- build tokens list ---'
          tmp2="$(mktemp)"
          code2="$(curl -sS -o "$tmp2" -w '%{http_code}' "${AUTH[@]}" "$CF_API/accounts/$CF_ACCOUNT_ID/builds/tokens")"
          echo "HTTP $code2"
          jq '{success, errors, messages, result_type: (.result | type)}' "$tmp2" || cat "$tmp2"

          if [[ "$code" != "200" || "$code2" != "200" ]]; then
            exit 9
          fi
