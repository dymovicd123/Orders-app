name: Branch2 manager R1 sync validate

on:
  push:
    branches: [safe/branch2-manager-r1-sync-20260902]
    paths:
      - scripts/.branch2-manager-r1-sync-trigger

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact proven Primary manager delta
        shell: bash
        run: |
          set -euo pipefail
          git diff 3214a73a1480b85b6857ee57042f83b8e63c7cc6 945078533981856e99fea2ac5f107fd8de3fec1b -- \
            src/features/sections/OrdersTableSection.tsx \
            src/features/sections/WorkshopSection.tsx > /tmp/manager-r1.patch
          git apply --check /tmp/manager-r1.patch
          git apply /tmp/manager-r1.patch
          git show 945078533981856e99fea2ac5f107fd8de3fec1b:scripts/test-manager-routine-access-r1.mjs > scripts/test-manager-routine-access-r1.mjs
          python3 scripts/apply-branch2-manager-r1-sync.py
      - name: TypeScript
        run: npm run typecheck
      - name: Focused manager regression
        run: |
          node scripts/test-manager-routine-access-r1.mjs
          node scripts/test-order-edit-autonomy.mjs
          node scripts/test-shipping-shortage-nonblocking.mjs
          node scripts/test-return-exchange-cancel-autonomy.mjs
          node scripts/test-branch2-environment.mjs
      - name: Full Branch2 release gate
        run: npm run release:check
      - name: Database safety
        run: npm run verify:db-safety
      - name: Clean production build
        run: npm run build
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
      - name: Commit validated sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "branch2-manager-r1-validation"
          git config user.email "branch2-manager-r1-validation@users.noreply.github.com"
          git add src/features/sections/OrdersTableSection.tsx src/features/sections/WorkshopSection.tsx \
                  scripts/test-manager-routine-access-r1.mjs package.json
          git diff --cached --check
          git commit -m "Sync manager routine access R1 to Branch2"
          git push origin HEAD:safe/branch2-manager-r1-sync-20260902
