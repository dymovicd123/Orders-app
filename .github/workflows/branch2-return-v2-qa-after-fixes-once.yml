name: Branch2 Return V2 all QA final acceptance - read only once
on:
  push:
    branches: [branch2]
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      startsWith(github.event.head_commit.message, 'Branch2: verify QA Return V2 after corrections 20261115')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare runtime for authoritative read-only Return V2 preview
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout branch2 application source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect only blocked QA exchange and historical return provenance (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          root='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/0904a573-21ff-44d8-93b0-c9200f771702'
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(root,headers=headers),timeout=25) as response:
            meta=json.load(response)
          if not meta.get('success') or meta['result']['name']!='orders_db_branch2_mirror_20261027':
            raise SystemExit('STOP: unexpected target database')
          sqls={
           'QA_EXCHANGES':"""SELECT e.order_id,e.id,e.status,e.financial_action,e.financial_amount,
              e.payment_id,e.refund_return_id,e.old_order_item_id,e.new_order_item_id,
              (SELECT quantity FROM order_items WHERE id=e.old_order_item_id) AS old_qty,
              (SELECT quantity FROM order_items WHERE id=e.new_order_item_id) AS new_qty
              FROM exchanges e WHERE e.order_id IN (2196,2198,2199) ORDER BY e.order_id,e.id""",
           'QA_EXCHANGE_ITEMS':"""SELECT e.order_id,e.id AS exchange_id,e.status,e.financial_action,
              ei.id AS exchange_item_id,ei.role,ei.order_item_id,ei.quantity AS exchange_quantity,
              oi.order_id AS actual_order_id,oi.quantity AS current_qty,oi.stock_writeoff_status AS current_status,
              oi.unit_price AS current_price
              FROM exchanges e LEFT JOIN exchange_items ei ON ei.exchange_id=e.id
              LEFT JOIN order_items oi ON oi.id=ei.order_item_id
              WHERE e.order_id IN (2196,2198,2199)
              ORDER BY e.order_id,e.id,ei.id""",
           'QA_OLD_RETURNS':"""SELECT r.order_id,r.id AS return_id,r.status,r.amount AS payout,
              ri.order_item_id,ri.quantity AS return_qty,ri.amount AS item_value,
              ri.contract_quantity_applied
              FROM returns r LEFT JOIN return_items ri ON ri.return_id=r.id
              WHERE r.order_id IN (2196,2197,2198,2205)
              ORDER BY r.order_id,r.id,ri.id""",
           'QA_REMAINING':"""SELECT oi.order_id,oi.id AS item_id,oi.quantity,oi.unit_price,oi.line_total,
              oi.stock_writeoff_status,oi.is_workshop,
              (SELECT COALESCE(SUM(di.quantity-di.cancelled_quantity),0)
               FROM order_dispatch_items di WHERE di.order_item_id=oi.id) AS sent,
              (SELECT COALESCE(SUM(r.quantity),0) FROM inventory_reservations r
               WHERE r.order_item_id=oi.id AND r.status='active') AS reserved
              FROM order_items oi WHERE oi.order_id IN (2196,2197,2198,2199,2205)
                AND oi.quantity>0 ORDER BY oi.order_id,oi.id"""
          }
          for label,sql in sqls.items():
            if not sql.lstrip().upper().startswith('SELECT '):raise SystemExit('Only SELECT permitted')
            req=urllib.request.Request(root+'/query',method='POST',headers=headers,
              data=json.dumps({'sql':sql,'params':[]}).encode())
            with urllib.request.urlopen(req,timeout=30) as response:obj=json.load(response)
            if not obj.get('success'):raise SystemExit('STOP: D1 SELECT error')
            for entry in obj.get('result',[]):
              if int(entry.get('meta',{}).get('changes',0))!=0:raise SystemExit('Unexpected write')
              print(label+': '+json.dumps(entry.get('results',[]),ensure_ascii=False))
          print('PASS: historical QA only; no database writes')
          PY
      - name: Evaluate exact server-side Return V2 preview against QA test DB (SELECT only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import {previewUnifiedReturnV2LineEvidence} from './worker/domains/return-v2-unified-line-evidence.ts';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/0904a573-21ff-44d8-93b0-c9200f771702/query';
          const read = async (sql,params) => {
            if(!/^\s*SELECT\b/i.test(sql)) throw new Error('Non-SELECT database statement was refused');
            const response=await fetch(root,{method:'POST',headers:{
               'Authorization':'Bearer '+token,'Content-Type':'application/json'},
               body:JSON.stringify({sql,params})});
            if(!response.ok)throw new Error('D1 query HTTP '+response.status);
            const value=await response.json();
            if(!value.success)throw new Error('D1 select rejected '+JSON.stringify(value.errors));
            const result=value.result?.[0];
            if(!result||Number(result.meta?.changes||0)!==0)throw new Error('Read only query guard');
            return result.results||[];
          };
          const db={prepare(sql){return {bind(...params){return {
             async all(){return {results:await read(sql,params)}},
             async first(){return (await read(sql,params))[0]||null}
          }}}}};
          const ids=["ORD-20261109083715-71D0FB15","ORD-20261109073428-5F24AC73","ORD-20261107192851-E3F3FF04","ORD-20261107151945-00760518","ORD-20261102045021-50FD5C6B","ORD-20261101173639-FC9DFEDA","ORD-20261101172404-A94AC782","ORD-20261101075119-1D6E28C0","ORD-20261101072630-77D9A0DD"];
          const orders=await read('SELECT id,external_id,pricing_mode,total_amount FROM orders WHERE external_id IN ('+
             ids.map(()=>'?').join(',')+') ORDER BY id',ids);
          if(orders.length!==ids.length)throw new Error('Missing expected QA orders');
          for(const o of orders){
             const p=await previewUnifiedReturnV2LineEvidence(db,o.id);
             const history=(await read(`SELECT
              (SELECT COUNT(*) FROM returns r WHERE r.order_id=? AND COALESCE(r.status,'completed')<>'cancelled') AS returns,
              (SELECT COUNT(*) FROM exchanges e WHERE e.order_id=? AND COALESCE(e.status,'completed')<>'cancelled') AS exchanges`,[o.id,o.id]))[0];
             console.log('QA_RETURN_OVERVIEW: '+JSON.stringify({
               id:o.id,external:o.external_id,pricing:o.pricing_mode,
               total:o.total_amount,returns:history.returns,exchanges:history.exchanges,
               remaining:p.summary.selectedQuantity,blocked:p.summary.requiresReviewQuantity,
               reasons:p.lines.filter(x=>x.requiresReview).map(x=>x.reasonCode),
               allowed:p.lines.filter(x=>!x.requiresReview).map(x=>x.proposedAction)
             }));
          }
          JS
