name: Client3 Stage4 final return and exchange acceptance (NO DEPLOY)
on:
  push:
    branches: [client3/step4-finalization-20261103]
    paths: ['.github/workflows/client3-stage4-final-acceptance-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - name: Verify strictly isolated third system
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/step4-finalization-20261103
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2' wrangler.jsonc
      - run: npm ci
      - name: Verify stage 4 UI permits multi-position returns and exchanges
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'
          import assert from 'node:assert/strict'
          const orders=readFileSync('src/features/client3/WatchOrdersPanel.tsx','utf8')
          const exchange=readFileSync('src/features/client3/WatchExchangeForm.tsx','utf8')
          const returns=readFileSync('src/features/client3/WatchReturnForm.tsx','utf8')
          assert(!orders.includes('order.lineCount===1'),'Old single-line action restriction still present')
          assert(orders.includes('parsedRows<ItemLine>(order.itemLines).some(line=>line.returnableQuantity>0)'))
          assert(orders.includes('parsedRows<ItemLine>(order.itemLines).some(line=>line.shipped>0'))
          assert(exchange.includes('/exchange-set'))
          assert(exchange.includes('+ Добавить часы'))
          assert(exchange.includes('+ Ещё один способ оплаты'))
          assert(returns.includes('refundParts:parts'))
          assert(returns.includes('+ Ещё один способ'))
          console.log('CLIENT3_STAGE4_UI_ACTIONS_PASS')
          NODE
      - name: Real Main SQL/Worker adapters, exact stock and money lifecycle
        run: |
          set -euo pipefail
          node scripts/client3/test-watch-main-free-text-ux-20261103.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          npm run build
      - name: Record acceptance result on Client3 issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ job.status }}
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Stage4 final isolated acceptance: $GATE_RESULT. Source $GITHUB_SHA; run https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. No deployment or remote D1 writes in this acceptance."
