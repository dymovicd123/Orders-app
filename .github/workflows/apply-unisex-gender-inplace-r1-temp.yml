name: Apply Unisex Gender Inplace R1 Temp

on:
  push:
    branches:
      - catalog-unisex-gender-correction-r1
    paths:
      - .github/workflows/apply-unisex-gender-inplace-r1-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-unisex-gender-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply narrow correction path
        run: |
          git fetch origin main
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          import { execFileSync } from 'node:child_process'

          const replaceOnce = (text, before, after, label) => {
            const count = text.split(before).length - 1
            if (count !== 1) throw new Error(`${label} anchor count ${count}`)
            return text.replace(before, after)
          }

          const catalogPath = 'worker/domains/catalog.ts'
          let catalog = fs.readFileSync(catalogPath, 'utf8')
          const oldBlock = `    const deactivating = toInt(existing.is_active, 1) === 1 && isActive === 0;\n    if (deactivating && identityChanged) {\n      throw new Error('Нельзя одновременно исправлять идентичность и выводить позицию из каталога. Сохраните только одно действие.');\n    }\n    if (identityChanged && await catalogVariantHasOperationalUsage(db, id)) {\n      throw new Error('Эта комбинация уже использовалась в заказах или движениях склада. Нельзя переписать её историю. Создайте правильную комбинацию отдельно; старую затем можно отключить.');\n    }\n    if (deactivating) await assertCatalogVariantMayDeactivate(db, id);\n    const duplicate = await findCatalogCombinationV3(db, execution.id, category, gender, color, sizeLabel, id);\n    if (duplicate?.id && isActive) throw new Error('Такая комбинация уже существует. Не создавайте второй дубль.');\n`
          const newBlock = `    const deactivating = toInt(existing.is_active, 1) === 1 && isActive === 0;\n    if (deactivating && identityChanged) {\n      throw new Error('Нельзя одновременно исправлять идентичность и выводить позицию из каталога. Сохраните только одно действие.');\n    }\n    const duplicate = await findCatalogCombinationV3(db, execution.id, category, gender, color, sizeLabel, id);\n    const existingGender = normalizeCatalogCombinationGender(existing.gender);\n    const genderOnlyIdentityChange = identityChanged\n      && productId === toInt(existing.product_id, 0)\n      && execution.id === toInt(existing.stock_position_id, 0)\n      && category === normalizeAudienceCategory(existing.category, existing.size_label)\n      && color === normalizeCatalogCombinationColor(existing.color)\n      && sizeLabel === normalizeCatalogCombinationSize(existing.size_label)\n      && existingGender !== gender;\n    const usedIdentity = identityChanged ? await catalogVariantHasOperationalUsage(db, id) : false;\n    if (identityChanged && usedIdentity) {\n      const productScope = genderOnlyIdentityChange && existingGender === '' && (gender === 'ЖЕН' || gender === 'МУЖ')\n        ? await getCatalogProductGenderScope(db, productId)\n        : null;\n      const safeLegacyUnisexGenderCorrection = productScope === 'unisex'\n        && isActive === 1\n        && !deactivating\n        && !duplicate?.id;\n      if (safeLegacyUnisexGenderCorrection) {\n        await db.batch([\n          db.prepare(\n            'UPDATE catalog_variants SET gender = ?, updated_at = ? WHERE id = ?'\n          ).bind(gender, timestamp, id),\n          db.prepare(\n            'UPDATE inventory_stock SET gender_snapshot = ?, updated_at = ? WHERE variant_id = ?'\n          ).bind(gender, timestamp, id),\n          db.prepare(\n            \`INSERT OR REPLACE INTO catalog_gender_variant_repairs\n             (old_variant_id, keeper_variant_id, product_id, target_gender, repair_mode, repaired_at)\n             VALUES (?, ?, ?, ?, 'in_place', ?)\`\n          ).bind(id, id, productId, gender, timestamp),\n        ]);\n        return { ok: true, correctedGender: true, merged: false };\n      }\n      if (productScope === 'unisex' && duplicate?.id) {\n        throw new Error('Для выбранного пола уже существует такая же комбинация. Её нужно безопасно объединить с текущей позицией; обычное редактирование не должно терять остаток или историю.');\n      }\n      throw new Error('Эта комбинация уже использовалась в заказах или движениях склада. Нельзя переписать её историю. Создайте правильную комбинацию отдельно; старую затем можно отключить.');\n    }\n    if (deactivating) await assertCatalogVariantMayDeactivate(db, id);\n    if (duplicate?.id && isActive) throw new Error('Такая комбинация уже существует. Не создавайте второй дубль.');\n`
          catalog = replaceOnce(catalog, oldBlock, newBlock, 'updateCatalogVariant operational guard')
          fs.writeFileSync(catalogPath, catalog)

          const uiPath = 'src/features/inventory/views/renderInventoryCatalogPanel.tsx'
          let ui = fs.readFileSync(uiPath, 'utf8')
          const oldCopy = "<p>{catalogVariantDraft.id ? 'Исправление допустимо только пока эта точная позиция ещё нигде не использовалась. Если история уже существует, сервер не позволит её переписать — создайте правильный вариант отдельно.' : 'Техническое значение «СТАНДАРТ» допустимо в данных; в обычном просмотре оно показывается как «Основное исполнение».'}</p>"
          const newCopy = "<p>{catalogVariantDraft.id ? 'Старой унисекс-позиции без пола можно выбрать ЖЕН или МУЖ даже при наличии истории: если такой же конкретной комбинации ещё нет, система сохранит тот же SKU и текущий остаток. Остальные изменения использованной комбинации защищены от переписывания истории.' : 'Техническое значение «СТАНДАРТ» допустимо в данных; в обычном просмотре оно показывается как «Основное исполнение».'}</p>"
          ui = replaceOnce(ui, oldCopy, newCopy, 'catalog editor copy')
          fs.writeFileSync(uiPath, ui)

          const testPath = 'scripts/test-catalog-unisex-gender-inplace-r1.mjs'
          fs.writeFileSync(testPath, `import fs from 'node:fs'\nlet failed=false\nconst check=(condition,message)=>{if(!condition){failed=true;console.error('FAIL:',message)}else console.log('OK:',message)}\nconst worker=fs.readFileSync('worker/domains/catalog.ts','utf8')\nconst ui=fs.readFileSync('src/features/inventory/views/renderInventoryCatalogPanel.tsx','utf8')\ncheck(worker.includes("const safeLegacyUnisexGenderCorrection = productScope === 'unisex'"),'correction is limited to unisex products')\ncheck(worker.includes("existingGender === '' && (gender === 'ЖЕН' || gender === 'МУЖ')"),'only blank to concrete gender is eligible')\ncheck(worker.includes("&& !duplicate?.id"),'in-place path never collides with an existing concrete sibling')\ncheck(worker.includes('await db.batch(['),'variant, stock snapshot and audit update atomically')\ncheck(worker.includes('UPDATE inventory_stock SET gender_snapshot = ?, updated_at = ? WHERE variant_id = ?'),'current stock snapshot follows corrected gender')\ncheck(worker.includes("VALUES (?, ?, ?, ?, 'in_place', ?)"),'gender repair is audited')\ncheck(worker.includes('return { ok: true, correctedGender: true, merged: false }'),'successful correction is explicit')\ncheck(!worker.includes('UPDATE order_items SET gender_snapshot'),'historical order gender snapshots are not rewritten')\ncheck(ui.includes('Старой унисекс-позиции без пола можно выбрать ЖЕН или МУЖ даже при наличии истории'),'catalog UI explains supported correction')\nif(failed) process.exit(1)\nconsole.log('Catalog unisex gender in-place R1: OK')\n`)

          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath,'utf8'))
          if (!String(pkg.scripts['release:check']).includes('test-catalog-unisex-gender-inplace-r1.mjs')) {
            pkg.scripts['release:check'] += ' && node scripts/test-catalog-unisex-gender-inplace-r1.mjs'
          }
          fs.writeFileSync(packagePath, JSON.stringify(pkg,null,2)+'\n')

          const sha = value => crypto.createHash('sha256').update(value).digest('hex')
          function decl(source,file,name){
            const sf=ts.createSourceFile(file,source,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS)
            for(const statement of sf.statements){
              let names=[]
              if((ts.isFunctionDeclaration(statement)||ts.isClassDeclaration(statement)||ts.isInterfaceDeclaration(statement)||ts.isTypeAliasDeclaration(statement)||ts.isEnumDeclaration(statement))&&statement.name) names=[statement.name.text]
              else if(ts.isVariableStatement(statement)) names=statement.declarationList.declarations.flatMap(d=>ts.isIdentifier(d.name)?[d.name.text]:[])
              if(names.includes(name)) return statement.getText(sf).replace(/^export\\s+/,'')
            }
            throw new Error(`Declaration ${name} missing`)
          }
          const beforeCatalog=execFileSync('git',['show','origin/main:worker/domains/catalog.ts'],{encoding:'utf8'})
          const manifest={version:1,revision:'catalog-unisex-gender-inplace-r1',changes:{updateCatalogVariant:{before:sha(decl(beforeCatalog,catalogPath,'updateCatalogVariant')),after:sha(decl(catalog,catalogPath,'updateCatalogVariant'))}}}
          fs.writeFileSync('scripts/catalog-unisex-gender-inplace-r1-worker-manifest.json',JSON.stringify(manifest,null,2)+'\n')

          const wrapperPath='scripts/test-step1906a-worker-modularization.mjs'
          let wrapper=fs.readFileSync(wrapperPath,'utf8')
          wrapper=replaceOnce(wrapper,
            "const catalogIntegrityDeadendsManifestPath = path.join(root, 'scripts/catalog-integrity-deadends-r1-worker-manifest.json')\n",
            "const catalogIntegrityDeadendsManifestPath = path.join(root, 'scripts/catalog-integrity-deadends-r1-worker-manifest.json')\nconst unisexGenderInplaceManifestPath = path.join(root, 'scripts/catalog-unisex-gender-inplace-r1-worker-manifest.json')\n",
            'wrapper manifest path')
          wrapper=replaceOnce(wrapper,
            "if (Object.keys(catalogIntegrityDeadendsManifest.changes || {}).sort().join(',') !== 'listInventory,resolveInventoryCreatableItemsBulk') throw new Error('Catalog integrity dead-ends R1 Worker allow-list widened unexpectedly')\n",
            "if (Object.keys(catalogIntegrityDeadendsManifest.changes || {}).sort().join(',') !== 'listInventory,resolveInventoryCreatableItemsBulk') throw new Error('Catalog integrity dead-ends R1 Worker allow-list widened unexpectedly')\nconst unisexGenderInplaceManifest = JSON.parse(fs.readFileSync(unisexGenderInplaceManifestPath, 'utf8'))\nif (unisexGenderInplaceManifest?.version !== 1 || unisexGenderInplaceManifest?.revision !== 'catalog-unisex-gender-inplace-r1') throw new Error('Catalog unisex gender in-place R1 Worker manifest invalid')\nif (Object.keys(unisexGenderInplaceManifest.changes || {}).join(',') !== 'updateCatalogVariant') throw new Error('Catalog unisex gender in-place R1 Worker allow-list widened unexpectedly')\n",
            'wrapper manifest load')
          wrapper=replaceOnce(wrapper,
            "    check(\\n      sha(declarations.get(name)) === acceptedPostCatalogIntegrityDeadendsHash,\\n      catalogIntegrityDeadendsChanged\\n        ? \\`Worker declaration changed beyond exact catalog integrity dead-ends R1 allow-list: \\${name}\\`\\n        : (orderHistoryPreservationChanged\\n",
            "    const unisexGenderInplaceChanged = unisexGenderInplaceChanges[name]\\n    let acceptedPostUnisexGenderInplaceHash = acceptedPostCatalogIntegrityDeadendsHash\\n    if (unisexGenderInplaceChanged) {\\n      check(unisexGenderInplaceChanged.before === acceptedPostCatalogIntegrityDeadendsHash, \\`Catalog unisex gender in-place R1 baseline hash mismatch: \\${name}\\`)\\n      acceptedPostUnisexGenderInplaceHash = unisexGenderInplaceChanged.after\\n    }\\n    check(\\n      sha(declarations.get(name)) === acceptedPostUnisexGenderInplaceHash,\\n      unisexGenderInplaceChanged\\n        ? \\`Worker declaration changed beyond exact catalog unisex gender in-place R1 allow-list: \\${name}\\`\\n        : (catalogIntegrityDeadendsChanged\\n          ? \\`Worker declaration changed beyond exact catalog integrity dead-ends R1 allow-list: \\${name}\\`\\n          : (orderHistoryPreservationChanged\\n",
            'wrapper accepted hash')
          wrapper=replaceOnce(wrapper,
            "                : \\`Worker declaration body changed beyond accepted cumulative deltas: \\${name}\\`)))),\\n    )\\n`",
            "                : \\`Worker declaration body changed beyond accepted cumulative deltas: \\${name}\\`))))),\\n    )\\n`",
            'wrapper diagnostic close')
          wrapper=replaceOnce(wrapper,
            "const catalogIntegrityDeadendsChanges = ${JSON.stringify(catalogIntegrityDeadendsManifest.changes)}\\n`)",
            "const catalogIntegrityDeadendsChanges = ${JSON.stringify(catalogIntegrityDeadendsManifest.changes)}\\nconst unisexGenderInplaceChanges = ${JSON.stringify(unisexGenderInplaceManifest.changes)}\\n`)",
            'wrapper runtime changes')
          fs.writeFileSync(wrapperPath,wrapper)
          NODE
      - name: Validate
        run: |
          node scripts/test-catalog-unisex-gender-inplace-r1.mjs
          npm run release:check
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/catalog.ts src/features/inventory/views/renderInventoryCatalogPanel.tsx scripts/test-catalog-unisex-gender-inplace-r1.mjs scripts/catalog-unisex-gender-inplace-r1-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs package.json
          git commit -m "Allow safe used unisex gender correction"
          git push origin HEAD:catalog-unisex-gender-correction-r1
