name: One-off production duplicate orders lineage READ ONLY
on:
  push:
    branches:
      - audit/readonly-duplicate-orders-20261022
    paths:
      - '.github/workflows/readonly-duplicate-orders-20261022.yml'
      - 'scripts/ops/readonly-duplicate-orders-20261022.mjs'
permissions:
  contents: read
jobs:
  scoped-select-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Strict repository, exact production DB, and read-only check
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dymovicd123/Orders-app"
          test "$GITHUB_REF_NAME" = "audit/readonly-duplicate-orders-20261022"
          node --check scripts/ops/readonly-duplicate-orders-20261022.mjs
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
      - run: npm ci
      - name: SELECT-only exact customer/date order lineage (no writes)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node scripts/ops/readonly-duplicate-orders-20261022.mjs
