name: Read-only admin password diagnostic

on:
  push:
    branches:
      - diag-admin-password-20261001

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Production identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          if grep -Fq 'orders_db_branch2' wrangler.jsonc || grep -Fq '40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc; then
            echo "Branch2 identity detected; refusing diagnostic." >&2
            exit 20
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Inspect admin password state read-only
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ADMIN PASSWORD STATE (NO HASH VALUE EXPOSED) ==="
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT
              MAX(CASE WHEN key = 'admin_mode_password_hash' THEN 1 ELSE 0 END) AS hash_present,
              MAX(CASE WHEN key = 'admin_mode_password_hash' THEN length(value) ELSE 0 END) AS hash_length,
              MAX(CASE WHEN key = 'admin_mode_password_hash' AND substr(value,1,7) = 'pbkdf2$' THEN 1 ELSE 0 END) AS pbkdf2_prefix_ok,
              MAX(CASE WHEN key = 'admin_mode_password_hash' THEN length(value) - length(replace(value,'$','')) ELSE 0 END) AS dollar_count,
              MAX(CASE WHEN key = 'admin_mode_password_hash' THEN CAST(substr(value,8,instr(substr(value,8),'$') - 1) AS INTEGER) ELSE 0 END) AS iterations,
              MAX(CASE WHEN key = 'admin_mode_password_hash' THEN updated_at ELSE NULL END) AS password_updated_at,
              MAX(CASE WHEN key = 'require_stored_admin_password' THEN value ELSE NULL END) AS require_stored_admin_password
            FROM app_settings
            WHERE key IN ('admin_mode_password_hash','require_stored_admin_password');
          " --json

          echo "=== PASSWORD CHANGE AUDIT ==="
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT id, event_type, title, created_at
            FROM activity_log
            WHERE event_type = 'admin_password_changed'
            ORDER BY id DESC
            LIMIT 5;
          " --json
