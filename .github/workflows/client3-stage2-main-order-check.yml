name: Client3 Stage2 Main order creation acceptance
# Revalidate complete Main register after correcting filters parameter order.
on:
  push:
    branches: [client3/step2-main-order-create-table-20261102]
    paths: ['.github/workflows/client3-stage2-main-order-check.yml']
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Third tenant boundary
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/step2-main-order-create-table-20261102
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          ! grep -Eq 'orders_db_prod|orders_db_branch2' wrangler.jsonc
      - run: npm ci
      - name: Main order financial, reservation and multi-line tests
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-main-step1-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-orders-read-20261102.mjs
          node scripts/client3/test-main-workflow-parity-20261102.mjs
          npm run build
