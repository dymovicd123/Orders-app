name: "READ ONLY: old Main order 1616 unresolved reserve 2026-11-16"
on:
  push:
    branches: [audit/barcode-readiness-main-20261116]
    paths: ['.github/workflows/main-order-1616-readonly-audit-20261116.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/audit/barcode-readiness-main-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify production target and read-only command
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          node --check scripts/audit-order-1616-readonly-20261116.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read order 1616 lineage (SELECT only)
        run: node scripts/audit-order-1616-readonly-20261116.mjs
