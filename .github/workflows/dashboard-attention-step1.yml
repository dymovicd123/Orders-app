name: Dashboard attention step 1

on:
  push:
    branches:
      - dashboard-workshop-attention-r1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-workshop-attention-r1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove dashboard stock reads only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worker/domains/inventory-read.ts')
          text = path.read_text(encoding='utf-8')

          start = text.index('  const stockResult = await db.prepare(')
          end = text.index('  const workshopColumns = await readTableColumnSet', start)
          text = text[:start] + text[end:]

          source_start = text.index('  const sourceSummary = lowStock.reduce<Record<string, number>>')
          source_end = text.index('\n\n  return {', source_start)
          text = text[:source_start] + text[source_end:]

          replacements = {
            'normalizeExchangeReturnSource, normalizeOrderItemSourceType, normalizeReturnRestockSource': 'normalizeExchangeReturnSource, normalizeReturnRestockSource',
            '      criticalStockCount: lowStock.filter(row => row.quantity <= lowStockLimit).length,': '      criticalStockCount: 0,',
            '      negativeStockCount: lowStock.filter(row => row.quantity < 0).length,': '      negativeStockCount: 0,',
            '      zeroStockCount: lowStock.filter(row => row.quantity === 0).length,': '      zeroStockCount: 0,',
            '      popularLowStockCount: lowStock.filter(row => row.demandQuantity > 0).length,': '      popularLowStockCount: 0,',
            '      warehouseWarnings: sourceSummary.warehouse || 0,': '      warehouseWarnings: 0,',
            '      boutiqueWarnings: sourceSummary.boutique || 0,': '      boutiqueWarnings: 0,',
            '    lowStock,': '    lowStock: [],',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'anchor mismatch: {old} -> {text.count(old)}')
              text = text.replace(old, new, 1)

          dashboard_start = text.index('export async function getDashboardInsights')
          dashboard = text[dashboard_start:]
          forbidden = ['FROM inventory_stock', 'FROM order_items oi', 'demandByVariant', 'const lowStock =']
          for token in forbidden:
              if token in dashboard:
                  raise SystemExit(f'dashboard stock read still present: {token}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Typecheck worker/frontend
        run: npm run typecheck
      - name: Commit product change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dashboard-attention-step1.yml
          git add worker/domains/inventory-read.ts
          git commit -m "Dashboard: stop reading unused critical stock"
          git push origin HEAD:dashboard-workshop-attention-r1
