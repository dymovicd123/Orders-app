name: Apply Unisex Gender Inplace R1 V4 Temp

on:
  push:
    branches:
      - catalog-unisex-gender-correction-r1
    paths:
      - .github/workflows/apply-unisex-gender-inplace-r1-v4-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: catalog-unisex-gender-correction-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply previously verified patch recipe from repository root
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import pathlib, textwrap
          text = pathlib.Path('.github/workflows/apply-unisex-gender-inplace-r1-v2-temp.yml').read_text()
          marker = "node --input-type=module <<'NODE'\n"
          code = text.split(marker, 1)[1].split('\n          NODE', 1)[0]
          pathlib.Path('.tmp-apply-unisex.mjs').write_text(textwrap.dedent(code))
          PY
          node ./.tmp-apply-unisex.mjs
          rm .tmp-apply-unisex.mjs
      - name: Regenerate exact manifest with canonical normalization
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          import { execFileSync } from 'node:child_process'
          const file='worker/domains/catalog.ts'
          const sha=value=>crypto.createHash('sha256').update(value).digest('hex')
          function declaration(source,name){
            const sf=ts.createSourceFile(file,source,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS)
            for(const statement of sf.statements){
              if(ts.isFunctionDeclaration(statement)&&statement.name?.text===name) return statement.getText(sf).replace(/^export\s+/,'')
            }
            throw new Error(`missing ${name}`)
          }
          const before=execFileSync('git',['show','origin/main:worker/domains/catalog.ts'],{encoding:'utf8'})
          const after=fs.readFileSync(file,'utf8')
          const manifest={version:1,revision:'catalog-unisex-gender-inplace-r1',changes:{updateCatalogVariant:{before:sha(declaration(before,'updateCatalogVariant')),after:sha(declaration(after,'updateCatalogVariant'))}}}
          fs.writeFileSync('scripts/catalog-unisex-gender-inplace-r1-worker-manifest.json',JSON.stringify(manifest,null,2)+'\n')
          console.log(JSON.stringify(manifest,null,2))
          NODE
      - name: Validate full release gate and build
        run: |
          node scripts/test-catalog-unisex-gender-inplace-r1.mjs
          npm run release:check
          npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/catalog.ts src/features/inventory/views/renderInventoryCatalogPanel.tsx scripts/test-catalog-unisex-gender-inplace-r1.mjs scripts/catalog-unisex-gender-inplace-r1-worker-manifest.json scripts/test-step1906a-worker-modularization-w6-layer.mjs package.json
          git commit -m "Allow safe used unisex gender correction"
          git push origin HEAD:catalog-unisex-gender-correction-r1
