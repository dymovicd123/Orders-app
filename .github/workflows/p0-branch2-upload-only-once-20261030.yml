name: P0 Branch2 upload-only transition one-shot

# Exact isolated work-branch event. No default-branch push/deploy.
on:
  push:
    branches:
      - safe/p0-d1-readonly-inspection-20261030
    paths:
      - '.github/workflows/p0-branch2-upload-only-once-20261030.yml'

permissions:
  contents: read

jobs:
  protect:
    if: github.ref == 'refs/heads/safe/p0-d1-readonly-inspection-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact read/patch script syntax
        run: node --check scripts/p0-branch2-native-upload-only-once-20261030.mjs
      - name: Switch only Branch2 build trigger to upload-only; verify no other settings changed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/p0-branch2-native-upload-only-once-20261030.mjs
