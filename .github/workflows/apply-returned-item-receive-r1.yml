name: Apply returned item receive R1

on:
  push:
    branches:
      - returns-physical-intake-r1
    paths:
      - .github/workflows/apply-returned-item-receive-r1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: returns-physical-intake-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply exact receive patch
        run: python .github/scripts/patch-returned-item-receive-r1.py
      - name: Focused regression
        run: node scripts/test-return-exchange-physical-receipt-r1.mjs
      - name: Worker typecheck
        run: npx tsc -p tsconfig.worker.json --noEmit
      - name: Commit receive operation and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/patch-returned-item-receive-r1.py .github/workflows/apply-returned-item-receive-r1.yml
          git add worker/domains/returns-exchanges.ts worker/index.ts
          git commit -m "Add safe returned item receive action"
          git push origin HEAD:returns-physical-intake-r1
