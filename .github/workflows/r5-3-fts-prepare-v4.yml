name: R5.3 FTS order search prepare v4

on:
  push:
    branches:
      - safe/d1-read-budget-r5-3-fts-20260903
    paths:
      - scripts/.r5-3-fts-prepare-v4-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r5-3-fts-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate corrected R5.3 implementation
        shell: python
        run: |
          from pathlib import Path

          def extract_run(path, step_name):
              workflow = Path(path).read_text(encoding='utf-8').splitlines()
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(workflow) if line.strip() == marker)
              run_index = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'run: |')
              run_indent = len(workflow[run_index]) - len(workflow[run_index].lstrip())
              content_indent = run_indent + 2
              out = []
              for line in workflow[run_index + 1:]:
                  if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                      break
                  out.append(line[content_indent:] if len(line) >= content_indent else '')
              return '\n'.join(out) + '\n'

          replay = extract_run('.github/workflows/r5-3-fts-prepare-v3.yml', 'Replay reviewed R5.3 patch sources')
          exec(compile(replay, '<r5-3-replay>', 'exec'), {'__name__': '__main__'})

          compat = extract_run('.github/workflows/r5-3-fts-prepare-v3.yml', 'Preserve historical manager-snapshot semantics without schema coupling')
          needle = "sql = sql.replace('AFTER UPDATE OF external_id, order_date, manager_id, manager_snapshot_name, customer_id, city, delivery_type, comment ON orders', 'AFTER UPDATE OF external_id, order_date, manager_id, customer_id, city, delivery_type, comment ON orders')"
          replacement = "sql = sql.replace(\"COALESCE(NEW.name, o.manager_snapshot_name, '')\", \"COALESCE(NEW.name, '')\")\n" + needle
          if needle not in compat:
              raise SystemExit('R5.3 v3 compatibility anchor missing')
          compat = compat.replace(needle, replacement, 1)
          exec(compile(compat, '<r5-3-compat>', 'exec'), {'__name__': '__main__'})

          Path('/tmp/r5-3-register.sh').write_text(
              extract_run('.github/workflows/r5-3-fts-prepare.yml', 'Register exact R5.3 Worker declaration delta'),
              encoding='utf-8',
          )
          Path('/tmp/r5-3-local-smoke.sh').write_text(
              extract_run('.github/workflows/r5-3-fts-prepare-v2.yml', 'Validate FTS5 migration and trigger semantics on local D1'),
              encoding='utf-8',
          )

      - name: Install dependencies
        run: npm ci
      - name: Register exact R5.3 Worker declaration delta
        shell: bash
        run: bash /tmp/r5-3-register.sh
      - name: Targeted R5.3 regression
        run: node scripts/test-d1-read-budget-r5-3.mjs
      - name: Validate FTS5 migration and triggers on local D1
        shell: bash
        run: bash /tmp/r5-3-local-smoke.sh
      - name: Database safety
        run: npm run verify:db-safety
      - name: Typecheck
        run: npm run typecheck
      - name: Full release check
        run: npm run release:check
      - name: Production build
        run: npm run build

      - name: Commit prepared R5.3 FTS
        run: |
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add worker/domains/orders-read.ts migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql package.json scripts/test-d1-read-budget-r5-3.mjs scripts/test-d1-read-budget-r4.mjs scripts/test-step1906a-worker-modularization.mjs scripts/d1-read-budget-r5-3-worker-manifest.json scripts/test-step1906c-dead-code-cleanup.mjs
          git commit -m "Add trigram FTS order search index"
          git push origin HEAD:safe/d1-read-budget-r5-3-fts-20260903
