name: Client3 report drilldowns final post-deploy verification (NO DEPLOY)
on:
  push:
    branches: [client3/main-reports-drilldown-logistics-print-20261103]
    paths: ['.github/workflows/client3-report-final-postdeploy-verification-20261103.yml']
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate accepted code and exact third Worker identity
        run: |
          set -euo pipefail
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          ! grep -Eq 'orders_db_prod|orders_db_branch2' wrangler.jsonc
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41604548953 --jq .conclusion)" = success
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41604548953 --jq .head_sha)" = c0e7dd8f1845bfaa3fa9266f2aa6668315bc96ad
          test "$(gh api repos/dymovicd123/Orders-app/actions/runs/41605012550 --jq .conclusion)" = success
      - name: Live safely encoded routes and authorization (read-only)
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          test "$(curl -sSL -o /tmp/client3-index -w '%{http_code}' --max-time 30 "$base/")" = 200
          grep -Eq 'id="root"|type="module"' /tmp/client3-index
          for path in \
            '/api/client3/watches/analytics?brand=TAUWACH&from=2026-11-01&to=2026-11-03' \
            '/api/client3/watches/analytics/day?brand=TAUWACH&date=2026-11-03' \
            '/api/client3/watches/cash?brand=TAUWACH'; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base$path")
            test "$status" = 401 -o "$status" = 403
          done
          status=$(curl -sS -o /dev/null -w '%{http_code}' --globoff --max-time 30 -G \
            --data-urlencode brand=TAUWACH \
            --data-urlencode city=АЛМАТЫ \
            --data-urlencode startDate=2026-11-01 \
            --data-urlencode endDate=2026-11-03 \
            "$base/api/client3/watches/analytics/city-orders")
          test "$status" = 401 -o "$status" = 403
          echo CLIENT3_REPORT_DRILLDOWN_HTTP_GUARD_PASS
      - name: Remote isolated Client3 FK and business counts (read-only)
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum" \
            | jq -e '.[0].results[0] | select(.orders_count>=0 and .money_events>=0 and .physical_sum>=0)'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
          echo CLIENT3_REPORT_DRILLDOWN_POSTDEPLOY_VERIFIED
      - name: Record verified release and deferred invoice in project plan
        if: success()
        run: |
          gh issue comment 774 --repo dymovicd123/Orders-app --body "Client3 report drilldowns LIVE and post-deploy VERIFIED. Successful build+real SQLite acceptance https://github.com/dymovicd123/Orders-app/actions/runs/41604548953. Deployment of accepted source and static assets completed at https://github.com/dymovicd123/Orders-app/actions/runs/41604726054 (post-deploy smoke mistakenly used an unencoded Cyrillic city URL; not an app failure). Correctly encoded HTTP and D1 FK/stock health checks PASS: https://github.com/dymovicd123/Orders-app/actions/runs/$GITHUB_RUN_ID. Main CityOrdersExplorer reused, city→order and day→manager/model/city, financial reconciliation, no migration or business/stock writes. Main/Branch2 untouched. Logistics invoice intentionally deferred per owner; next focus cash parity and brand plans/KPI. Real role browser QA still deferred."
