name: W12.1 Branch2 Operation Colors Release
on:
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/w12-01-operation-colors-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    name: W12.1 exact branch2 palette only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prove exact change scope and safe test database
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "branch2"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          baseline="fcfde70470aa045ffcaadc3c0407a35f3ec582f0"
          git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"
          changes="$(git diff --name-only "$baseline" "$GITHUB_SHA")"
          test -n "$changes"
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              src/styles/193-unified-inventory-operations.css|\
              .github/workflows/w12-01-operation-colors-deploy.yml) ;;
              *) echo "Not W12.1-only: $file" >&2; exit 11 ;;
            esac
          done <<< "$changes"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          if grep -Eq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc; then
            echo "Production database binding forbidden" >&2; exit 12
          fi
          if grep -Eq '^(migrations/|worker/|wrangler.jsonc|package.*json)' <<< "$changes"; then
            echo "Worker, database and dependency changes forbidden" >&2; exit 13
          fi
      - run: npm ci
      - name: Verify dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high
      - name: Verify existing stock operations
        run: |
          node --experimental-strip-types scripts/test-w6-unified-operations.mjs
          node --experimental-strip-types scripts/test-w8-warehouse-operation-integrity.mjs
          node scripts/test-stocktake-functional-acceptance.mjs
          node scripts/test-step191d-transfer-runtime-safety.mjs
      - name: Complete build
        run: npm run build
      - name: Verify candidate CSS before publishing
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const assets=fs.readdirSync('dist/client/assets')
          if(!assets.some(name=>/\.(?:js|css)$/.test(name) && fs.readFileSync('dist/client/assets/'+name,'utf8').includes('--w12-accent'))) {
            throw Error('Operation-color styles absent from compiled assets')
          }
          console.log('W12_COLORS_PRESENT_IN_BUILD')
          NODE
      - name: Publish only branch2 (no migrations)
        run: npx wrangler deploy
      - name: Confirm public test worker responds
        run: |
          node --input-type=module <<'NODE'
          const base='https://orders-app-branch2.orders-clothes.workers.dev'
          let healthy=false
          for(let attempt=0;attempt<7;attempt++){
            try{
              const response=await fetch(base+'/?w12='+Date.now(),{cache:'no-store'})
              if(!response.ok)throw Error('HTTP '+response.status)
              const html=await response.text()
              if(!html.includes('/assets/'))throw Error('Index missing asset manifest')
              healthy=true
              console.log('W12_BRANCH2_HTTP_HEALTHY')
              break
            }catch(err){
              if(attempt===6)throw err
              await new Promise(r=>setTimeout(r,4000))
            }
          }
          if(!healthy)throw Error('Branch2 not accessible')
          NODE
