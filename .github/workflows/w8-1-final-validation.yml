name: W8.1 final validation

on:
  push:
    branches:
      - w8-1-stock-overview-completion

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cumulative regression
        run: npm run release:check
      - name: TypeScript + production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
