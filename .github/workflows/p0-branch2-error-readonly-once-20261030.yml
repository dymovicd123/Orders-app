name: P0 Branch2 native build error GET only
on:
  push:
    branches: [safe/p0-d1-readonly-inspection-20261030]
    paths:
      - '.github/workflows/p0-branch2-error-readonly-once-20261030.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch read-only failed build log for exact Branch2 SHA
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check scripts/p0-branch2-failed-native-build-log-readonly-20261030.mjs
          node scripts/p0-branch2-failed-native-build-log-readonly-20261030.mjs
