name: Client3 report release post-deploy read-only diagnostics
on:
  push:
    branches: [client3/main-reports-drilldown-logistics-print-20261103]
    paths: ['.github/workflows/client3-report-readonly-postdeploy-diagnostics-20261103.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Public route and auth status diagnostic (no writes)
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          code=$(curl -sSL -o /tmp/client3-index -w '%{http_code}' --max-time 30 "$base/")
          echo "CLIENT3_HOME_HTTP=$code"
          echo "CLIENT3_HOME_BYTES=$(wc -c < /tmp/client3-index)"
          echo "CLIENT3_HOME_HAS_ROOT=$(grep -Ec 'id="root"|type="module"' /tmp/client3-index || true)"
          for path in \
            '/api/client3/watches/analytics?brand=TAUWACH&from=2026-11-01&to=2026-11-03' \
            '/api/client3/watches/analytics/day?brand=TAUWACH&date=2026-11-03' \
            '/api/client3/watches/stock/history?brand=TAUWACH' \
            '/api/client3/watches/cash?brand=TAUWACH'; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base$path")
            echo "CLIENT3_UNAUTH_HTTP=$code path=${path%%\?*}"
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' --globoff --max-time 30 \
            -G --data-urlencode brand=TAUWACH --data-urlencode city=АЛМАТЫ \
            --data-urlencode startDate=2026-11-01 --data-urlencode endDate=2026-11-03 \
            "$base/api/client3/watches/analytics/city-orders")
          echo "CLIENT3_UNAUTH_CITY_HTTP=$code"
      - name: Remote Client3 read-only FK and data health
        run: |
          set -euo pipefail
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          ! grep -Eq 'orders_db_prod|orders_db_branch2' wrangler.jsonc
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT
              (SELECT COUNT(*) FROM orders) orders_count,
              (SELECT COUNT(*) FROM order_items) order_items_count,
              (SELECT COUNT(*) FROM financial_events) money_events,
              (SELECT COUNT(*) FROM inventory_stock) stock_rows,
              (SELECT COALESCE(SUM(quantity),0) FROM inventory_stock) physical_sum,
              (SELECT COALESCE(SUM(reserved_quantity),0) FROM inventory_stock) reserve_sum,
              (SELECT COUNT(*) FROM watch_brand_cash_registers) cash_registers,
              (SELECT COUNT(*) FROM watch_brand_cash_entries) cash_entries" \
             | jq -e '.[0].results[0] | select(.orders_count>=0 and .money_events>=0 and .physical_sum>=0)'
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="PRAGMA foreign_key_check" | jq -e '.[0].results | length==0'
          echo CLIENT3_POSTDEPLOY_D1_READ_ONLY_HEALTH_PASS
