name: "Approved one-shot Branch2 publish — 31 Oct (NO MAIN)"
# Explicit owner-approved single release from the merged, reviewed branch2 HEAD.
# This is deliberately NOT a persistent push-to-deploy pipeline.
# Once verified, delete this workflow from branch2.
on:
  push:
    branches: [branch2]
    paths:
      - '.github/workflows/zz-branch2-approved-one-shot-release-20261031.yml'

permissions:
  contents: read

concurrency:
  group: branch2-owner-approved-single-release-20261031
  cancel-in-progress: false

jobs:
  publish-branch2-once:
    if: ${{ github.ref == 'refs/heads/branch2' && contains(github.event.head_commit.message, '[approved-branch2-deploy-20261031]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SOURCE: e3990b14f992ac1eb55335f28f285069ea9a820d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Fail-closed check for one exact owner-approved Branch2 release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/branch2'
          git merge-base --is-ancestor "$EXPECTED_SOURCE" HEAD
          changed="$(git diff --name-only "$EXPECTED_SOURCE" HEAD)"
          test "$changed" = '.github/workflows/zz-branch2-approved-one-shot-release-20261031.yml'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f wrangler.jsonc
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"binding": "DB"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2_mirror_20261027"' wrangler.jsonc
          grep -Fq '"database_id": "0904a573-21ff-44d8-93b0-c9200f771702"' wrangler.jsonc
          if grep -Eq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4|orders-app\.orders-clothes\.workers\.dev' wrangler.jsonc; then
            echo 'Production identity detected, refusing Branch2 deployment' >&2
            exit 1
          fi
          echo 'Owner-approved Branch2-only Worker + isolated D1 config validated.'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Current regression and production build
        run: npm run check:focused
      - name: Publish directly to active Branch2 Worker (NO D1 migrations)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Verify Branch2 public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail --silent --show-error \
            'https://orders-app-branch2.orders-clothes.workers.dev/api/health' \
            | tee "$RUNNER_TEMP/branch2-health-after-deploy.json"
          node -e "const f=require('fs');const d=JSON.parse(f.readFileSync(process.env.RUNNER_TEMP+'/branch2-health-after-deploy.json'));if(!d.ok||d.service!=='orders-app')process.exit(1)"
          echo 'Published Branch2 health smoke PASS. Main untouched.'
