name: "READ ONLY: Main order picker impact by period 2026-11-16"
on:
  push:
    branches:
      - audit/barcode-readiness-main-20261116
    paths:
      - '.github/workflows/main-picker-impact-readonly-audit-20261116.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/audit/barcode-readiness-main-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify production identity and readonly script
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
          node --check scripts/audit-picker-impact-main-readonly-20261116.mjs
      - name: Install pinned Wrangler without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare actual production order and stock histories (SELECT only)
        run: node scripts/audit-picker-impact-main-readonly-20261116.mjs
