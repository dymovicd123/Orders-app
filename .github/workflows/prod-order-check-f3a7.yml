name: Production order check F3A7

on:
  push:
    branches: [prod-order-check-f3a7]
    paths: [scripts/.prod-order-check-f3a7-trigger]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      ORDER_EXTERNAL_ID: ORD-20260829144801-F3A7DDC3
    steps:
      - name: Resolve Production Worker URL
        id: target
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          [[ -n "$subdomain" ]] || { echo 'Could not resolve workers.dev subdomain.' >&2; exit 2; }
          echo "base=https://orders-app.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Probe Production business API
        shell: bash
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          set -u
          probe() {
            label="$1"; shift
            body="/tmp/${label}.body"
            code="$(curl -sS -o "$body" -w '%{http_code}' "$@")"
            echo "=== $label HTTP $code ==="
            cat "$body"
            echo
          }
          probe health "$BASE/api/health"
          probe activity --get "$BASE/api/activity" --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "limit=100"
          probe returns --get "$BASE/api/returns" --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "limit=100"
          probe exchanges --get "$BASE/api/exchanges" --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "limit=100"
          probe orders --get "$BASE/api/orders" --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "archiveMode=all" --data-urlencode "limit=20"

          order_id=""
          if jq -e . /tmp/returns.body >/dev/null 2>&1; then order_id="$(jq -r '.returns[0].orderId // empty' /tmp/returns.body)"; fi
          if [[ -z "$order_id" ]] && jq -e . /tmp/exchanges.body >/dev/null 2>&1; then order_id="$(jq -r '.exchanges[0].orderId // empty' /tmp/exchanges.body)"; fi
          if [[ -z "$order_id" ]] && jq -e . /tmp/activity.body >/dev/null 2>&1; then order_id="$(jq -r '.activities[0].orderId // empty' /tmp/activity.body)"; fi
          echo "=== RESOLVED ORDER ID: ${order_id:-missing} ==="
          if [[ -n "$order_id" ]]; then probe exact-order "$BASE/api/orders/$order_id"; fi
