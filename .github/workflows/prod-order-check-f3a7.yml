name: Production order check F3A7

on:
  push:
    branches: [prod-order-check-f3a7]
    paths: [scripts/.prod-order-check-f3a7-trigger]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      ORDER_EXTERNAL_ID: ORD-20260829144801-F3A7DDC3
    steps:
      - name: Resolve Production Worker URL
        id: target
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          if [[ -z "$subdomain" ]]; then
            echo 'Could not resolve workers.dev subdomain.' >&2
            jq -r '.errors[]?.message' <<<"$subdomain_json" >&2 || true
            exit 2
          fi
          base="https://orders-app.${subdomain}.workers.dev"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Resolved Production Worker."
      - name: Read Production through business API
        shell: bash
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          echo '=== HEALTH ==='
          curl --fail-with-body -sS "$BASE/api/health" | jq .
          echo '=== ORDERS SEARCH ==='
          curl --fail-with-body -sS --get "$BASE/api/orders" \
            --data-urlencode "q=$ORDER_EXTERNAL_ID" \
            --data-urlencode "archiveMode=all" \
            --data-urlencode "limit=20" | tee /tmp/orders.json | jq .
          echo '=== ACTIVITY ==='
          curl --fail-with-body -sS --get "$BASE/api/activity" \
            --data-urlencode "q=$ORDER_EXTERNAL_ID" \
            --data-urlencode "limit=100" | tee /tmp/activity.json | jq .
          echo '=== RETURNS ==='
          curl --fail-with-body -sS --get "$BASE/api/returns" \
            --data-urlencode "q=$ORDER_EXTERNAL_ID" \
            --data-urlencode "limit=100" | tee /tmp/returns.json | jq .
          echo '=== EXCHANGES ==='
          curl --fail-with-body -sS --get "$BASE/api/exchanges" \
            --data-urlencode "q=$ORDER_EXTERNAL_ID" \
            --data-urlencode "limit=100" | tee /tmp/exchanges.json | jq .
