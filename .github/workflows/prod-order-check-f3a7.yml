name: Production order check F3A7

on:
  push:
    branches: [prod-order-check-f3a7]
    paths: [scripts/.prod-order-check-f3a7-trigger]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      ORDER_EXTERNAL_ID: ORD-20260829144801-F3A7DDC3
      EXPECTED_RETURN_ID: '33'
    steps:
      - name: Resolve Production Worker URL
        id: target
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          [[ -n "$subdomain" ]] || { echo 'Could not resolve workers.dev subdomain.' >&2; exit 2; }
          echo "base=https://orders-app.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Read target via non-search histories
        shell: bash
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          echo '=== LIGHTWEIGHT DB READ ==='
          curl --fail-with-body -sS "$BASE/api/reference-data" | jq '{ok, managerCount: (.managers|length), paymentMethodCount: (.paymentMethods|length)}'

          echo '=== CANCELLED RETURNS ==='
          returns="$(curl --fail-with-body -sS --get "$BASE/api/returns" --data-urlencode 'status=cancelled' --data-urlencode 'limit=100')"
          jq '{ok,count,summary,returns:[.returns[] | {id,orderId,externalId,status,amount,cancelledAt,cancellationComment}]}' <<<"$returns"
          order_id="$(jq -r --argjson rid "$EXPECTED_RETURN_ID" '.returns[] | select(.id == $rid) | .orderId' <<<"$returns" | head -n1)"
          external_id="$(jq -r --argjson rid "$EXPECTED_RETURN_ID" '.returns[] | select(.id == $rid) | .externalId' <<<"$returns" | head -n1)"
          echo "Resolved return #$EXPECTED_RETURN_ID -> orderId=${order_id:-missing} externalId=${external_id:-missing}"
          [[ -n "$order_id" ]] || { echo 'Return #33 not found in first 100 cancelled returns.' >&2; exit 3; }
          [[ "$external_id" == "$ORDER_EXTERNAL_ID" ]] || { echo "Return #33 belongs to unexpected order: $external_id" >&2; exit 4; }

          echo '=== EXACT ORDER ==='
          curl --fail-with-body -sS "$BASE/api/orders/$order_id" | tee /tmp/order.json | jq .

          echo '=== EXACT DELETE REPLAY PROBE NOT EXECUTED ==='
          echo 'Read-only verification complete; no write request was sent.'
