name: Production order check F3A7

on:
  push:
    branches: [prod-order-check-f3a7]
    paths: [scripts/.prod-order-check-f3a7-trigger]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      ORDER_EXTERNAL_ID: ORD-20260829144801-F3A7DDC3
    steps:
      - name: Resolve Production Worker URL
        id: target
        shell: bash
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          [[ -n "$subdomain" ]] || { echo 'Could not resolve workers.dev subdomain.' >&2; exit 2; }
          echo "base=https://orders-app.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Read Production through business API
        shell: bash
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          echo '=== HEALTH ==='
          curl --fail-with-body -sS "$BASE/api/health" | jq .

          echo '=== ACTIVITY ==='
          activity="$(curl --fail-with-body -sS --get "$BASE/api/activity" --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "limit=100")"
          jq . <<<"$activity"
          order_id="$(jq -r '.activities[0].orderId // empty' <<<"$activity")"

          echo '=== RETURNS ==='
          returns="$(curl --fail-with-body -sS --get "$BASE/api/returns" --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "limit=100")"
          jq . <<<"$returns"
          if [[ -z "$order_id" ]]; then order_id="$(jq -r '.returns[0].orderId // empty' <<<"$returns")"; fi

          echo '=== EXCHANGES ==='
          exchanges="$(curl --fail-with-body -sS --get "$BASE/api/exchanges" --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "limit=100")"
          jq . <<<"$exchanges"
          if [[ -z "$order_id" ]]; then order_id="$(jq -r '.exchanges[0].orderId // empty' <<<"$exchanges")"; fi

          echo "=== EXACT ORDER id=${order_id:-missing} ==="
          if [[ -z "$order_id" ]]; then
            echo 'Could not resolve numeric order id from Production histories.' >&2
            exit 3
          fi
          curl --fail-with-body -sS "$BASE/api/orders/$order_id" | jq .

          echo '=== BROKEN SEARCH PROBE (non-fatal) ==='
          set +e
          curl -sS -o /tmp/search-body -w 'HTTP %{http_code}\n' --get "$BASE/api/orders" \
            --data-urlencode "q=$ORDER_EXTERNAL_ID" --data-urlencode "archiveMode=all" --data-urlencode "limit=20"
          cat /tmp/search-body
          echo
          set -e
