name: Production order check F3A7

on:
  push:
    branches: [prod-order-check-f3a7]
    paths: [scripts/.prod-order-check-f3a7-trigger]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Probe lightweight Production routes
        shell: bash
        run: |
          set -u
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          BASE="https://orders-app.${subdomain}.workers.dev"
          probe() {
            label="$1"; shift
            code="$(curl -sS -o "/tmp/$label" -w '%{http_code}' "$@")"
            echo "=== $label HTTP $code ==="
            cat "/tmp/$label"
            echo
          }
          probe admin-status "$BASE/api/admin-mode/status"
          probe orders-default --get "$BASE/api/orders" --data-urlencode 'limit=20'
          probe returns-cancelled --get "$BASE/api/returns" --data-urlencode 'status=cancelled' --data-urlencode 'limit=100'
          probe returns-default --get "$BASE/api/returns" --data-urlencode 'limit=20'
          probe exchanges-default --get "$BASE/api/exchanges" --data-urlencode 'limit=20'
          probe reference-data "$BASE/api/reference-data"
