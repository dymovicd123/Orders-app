name: Production order check F3A7

on:
  push:
    branches: [prod-order-check-f3a7]
    paths: [scripts/.prod-order-check-f3a7-trigger]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - name: Probe minimal Production D1 reads
        shell: bash
        run: |
          set -u
          subdomain_json="$(curl --fail-with-body -sS -H "Authorization: Bearer $CF_API_TOKEN" "$CF_API/accounts/$CF_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<<"$subdomain_json")"
          BASE="https://orders-app.${subdomain}.workers.dev"
          probe() {
            label="$1"; shift
            code="$(curl -sS -o "/tmp/$label" -w '%{http_code}' "$@")"
            echo "=== $label HTTP $code ==="
            cat "/tmp/$label"
            echo
          }
          probe managers --get "$BASE/api/reference-values" --data-urlencode 'kind=managers'
          probe city-counts --get "$BASE/api/reference-values/counts" --data-urlencode 'kinds=cities'
          probe inventory-settings "$BASE/api/inventory/settings"
          probe inventory-list --get "$BASE/api/inventory" --data-urlencode 'source=warehouse'
          probe workshop-counts "$BASE/api/workshop/counts"
