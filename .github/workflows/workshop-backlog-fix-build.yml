name: Workshop backlog visibility fix build

on:
  push:
    branches:
      - fix/workshop-backlog-visibility-20260905
    paths:
      - .github/workflows/workshop-backlog-fix-build.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply narrow Workshop visibility patch
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {found}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact('src/App.tsx', """    period: 'month' as WorkshopPeriodPreset,\n    dateFrom: getPeriodRange('month').dateFrom,\n    dateTo: getPeriodRange('month').dateTo,\n""", """    period: 'all' as WorkshopPeriodPreset,\n    dateFrom: '',\n    dateTo: '',\n""")

          replace_exact('src/App.tsx', """  function applyWorkshopPeriodPreset(preset: WorkshopPeriodPreset) {\n    const range = getPeriodRange(preset === 'custom' ? 'custom' : preset)\n    const nextFilters = {\n      ...workshopFilters,\n      period: preset,\n      dateFrom: preset === 'custom' ? workshopFilters.dateFrom : range.dateFrom,\n      dateTo: preset === 'custom' ? workshopFilters.dateTo : range.dateTo,\n    }\n    setWorkshopFilters(nextFilters)\n  }\n""", """  function applyWorkshopPeriodPreset(preset: WorkshopPeriodPreset) {\n    const range = preset === 'all' ? { dateFrom: '', dateTo: '' } : getPeriodRange(preset)\n    setWorkshopFilters((current) => ({\n      ...current, period: preset,\n      dateFrom: preset === 'custom' ? current.dateFrom : range.dateFrom,\n      dateTo: preset === 'custom' ? current.dateTo : range.dateTo,\n    }))\n  }\n""")

          replace_exact('src/app/types.ts', "export type WorkshopPeriodPreset = 'today' | 'yesterday' | 'month' | 'custom'", "export type WorkshopPeriodPreset = 'all' | 'today' | 'yesterday' | 'month' | 'custom'")

          section = Path('src/features/sections/WorkshopSection.tsx')
          text = section.read_text(encoding='utf-8')
          old = """                        const fallback = getPeriodRange('month')\n                        const next = {\n                          ...workshopFilters,\n                          view: entry.value,\n                          period: (!workshopFilters.dateFrom || !workshopFilters.dateTo) ? 'month' as WorkshopPeriodPreset : workshopFilters.period,\n                          dateFrom: workshopFilters.dateFrom || fallback.dateFrom,\n                          dateTo: workshopFilters.dateTo || fallback.dateTo,\n                          urgentOnly: entry.value === 'urgent',\n                        }\n                        setWorkshopFilters(next)\n"""
          new = """                        const fallback = getPeriodRange('month')\n                        const needsInvoiceRange = entry.value === 'invoice' && (workshopFilters.period === 'all' || !workshopFilters.dateFrom || !workshopFilters.dateTo)\n                        const next = {\n                          ...workshopFilters,\n                          view: entry.value,\n                          period: needsInvoiceRange ? 'month' as WorkshopPeriodPreset : workshopFilters.period,\n                          dateFrom: needsInvoiceRange ? fallback.dateFrom : workshopFilters.dateFrom,\n                          dateTo: needsInvoiceRange ? fallback.dateTo : workshopFilters.dateTo,\n                          urgentOnly: entry.value === 'urgent',\n                        }\n                        if (entry.value === 'done') setWorkshopSortDirection('newest')\n                        if (entry.value === 'active' || entry.value === 'urgent') setWorkshopSortDirection('oldest')\n                        setWorkshopFilters(next)\n"""
          if text.count(old) != 1:
              raise SystemExit(f'WorkshopSection tab transition: expected 1 match, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_periods = """                  {[\n                    { value: 'today' as const, label: 'Сегодня' },\n                    { value: 'yesterday' as const, label: 'Вчера' },\n                    { value: 'month' as const, label: 'Месяц' },\n                    { value: 'custom' as const, label: 'Период' },\n                  ].map((entry) => (\n"""
          new_periods = """                  {[\n                    { value: 'all' as const, label: 'Все' },\n                    { value: 'today' as const, label: 'Сегодня' },\n                    { value: 'yesterday' as const, label: 'Вчера' },\n                    { value: 'month' as const, label: 'Месяц' },\n                    { value: 'custom' as const, label: 'Период' },\n                  ].map((entry) => (\n"""
          if text.count(old_periods) != 1:
              raise SystemExit(f'WorkshopSection period buttons: expected 1 match, found {text.count(old_periods)}')
          text = text.replace(old_periods, new_periods, 1)
          old_meta = 'Цех разделён на активные, срочные и готовые позиции. Накладную можно собрать по выбранному периоду или только по срочным позициям.'
          new_meta = 'Активные и готовые позиции по умолчанию не ограничены текущим месяцем, поэтому старые незавершённые заказы не исчезают из очереди. Накладная по-прежнему открывается за выбранный период.'
          if text.count(old_meta) != 1:
              raise SystemExit('WorkshopSection meta text mismatch')
          section.write_text(text.replace(old_meta, new_meta, 1), encoding='utf-8')

          test = r'''import fs from 'node:fs'

          const app = fs.readFileSync('src/App.tsx', 'utf8')
          const types = fs.readFileSync('src/app/types.ts', 'utf8')
          const workshop = fs.readFileSync('worker/domains/workshop.ts', 'utf8')
          const workshopUi = fs.readFileSync('src/features/sections/WorkshopSection.tsx', 'utf8')
          const ordersWrite = fs.readFileSync('worker/domains/orders-write.ts', 'utf8')
          const fail = (message) => { throw new Error(message) }
          const check = (condition, message) => { if (!condition) fail(message) }

          try {
            check(types.includes("WorkshopPeriodPreset = 'all' | 'today' | 'yesterday' | 'month' | 'custom'"), 'Workshop all-period type is missing')
            check(app.includes("period: 'all' as WorkshopPeriodPreset,\n    dateFrom: '',\n    dateTo: ''"), 'Workshop must start as an all-date operational queue')
            check(app.includes("const range = preset === 'all' ? { dateFrom: '', dateTo: '' } : getPeriodRange(preset)"), 'All-period preset must clear date bounds without growing the App controller')
            check(workshopUi.includes("{ value: 'all' as const, label: 'Все' }"), 'Workshop UI must expose all dates')
            check(workshopUi.includes("const needsInvoiceRange = entry.value === 'invoice' && (workshopFilters.period === 'all' || !workshopFilters.dateFrom || !workshopFilters.dateTo)"), 'Only Invoice may force a bounded month from the all-date queue')
            check(workshopUi.includes("if (entry.value === 'done') setWorkshopSortDirection('newest')"), 'Done queue must show newest completions first so accidental ready clicks remain recoverable')
            check(workshopUi.includes("if (entry.value === 'active' || entry.value === 'urgent') setWorkshopSortDirection('oldest')"), 'Active backlog must keep oldest work first')
            check(workshop.includes("return {\n    dateFrom: cleanText(url.searchParams.get('dateFrom')),\n    dateTo: cleanText(url.searchParams.get('dateTo')),\n  };"), 'Worker fallback must preserve blank all-date bounds without a Worker declaration change')
            check(ordersWrite.includes("item.isWorkshop ? 'warehouse' : item.inventorySource"), 'Workshop storage fallback convention unexpectedly changed')
            const repairStart = workshop.indexOf('if (itemNeedsRepair) {')
            const repairEnd = workshop.indexOf('if (statements.length) await db.batch(statements);', repairStart)
            check(repairStart >= 0 && repairEnd > repairStart, 'Workshop linked-item repair block missing')
            const repair = workshop.slice(repairStart, repairEnd)
            check(repair.includes('SET is_workshop = 1'), 'Workshop status action must repair the canonical workshop flag')
            check(repair.includes("THEN 'workshop'"), 'Workshop status action must repair workshop stock semantics')
            check(!repair.includes('source_type ='), 'Ready/restore action must never rewrite source_type')
            console.log('WORKSHOP BACKLOG VISIBILITY R1 PASSED — old active/done work remains discoverable, Done opens newest first, Invoice stays bounded, and ready/restore cannot rewrite source_type')
          } catch (error) {
            console.error(`WORKSHOP BACKLOG VISIBILITY R1 FAILED: ${error?.message || error}`)
            process.exit(1)
          }
          '''
          Path('scripts/test-workshop-backlog-visibility-r1.mjs').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n', encoding='utf-8')

          package = Path('package.json')
          package_text = package.read_text(encoding='utf-8')
          needle = 'node scripts/test-runtime-sql-syntax-r1.mjs"'
          replacement = 'node scripts/test-runtime-sql-syntax-r1.mjs && node scripts/test-workshop-backlog-visibility-r1.mjs"'
          if package_text.count(needle) != 1:
              raise SystemExit(f'package release gate: expected 1 terminal marker, found {package_text.count(needle)}')
          package.write_text(package_text.replace(needle, replacement, 1), encoding='utf-8')
      - name: Focused regression
        run: node scripts/test-workshop-backlog-visibility-r1.mjs
      - name: Full static release validation
        run: |
          npm run release:check
          npm run verify:db-safety
          npm run typecheck
          npm run build
          npm run lint
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add src/App.tsx src/app/types.ts src/features/sections/WorkshopSection.tsx scripts/test-workshop-backlog-visibility-r1.mjs package.json
          git diff --cached --check
          git commit -m "Fix Workshop backlog visibility and restore flow"
          git push origin HEAD:fix/workshop-backlog-visibility-20260905
