name: Catalog fixed gender scope full release check

on:
  push:
    branches:
      - w-catalog-fixed-gender-scope-release-sync-branch2-20260930

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run exact deploy preflight
        run: npm run release:check
      - name: Build application
        run: npm run build
