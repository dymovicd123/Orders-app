name: D1 capacity autonomy validate

on:
  push:
    branches: [d1-capacity-autonomy-r1]
    paths: [scripts/.d1-capacity-autonomy-trigger]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve structural baseline
        run: cp worker/core/http.ts /tmp/d1-http-before.ts
      - name: Apply guarded patch
        run: python scripts/apply-d1-capacity-autonomy-r1.py
      - name: Install
        run: npm ci
      - name: Register exact structural delta
        run: node scripts/register-d1-capacity-autonomy-r1.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full release gates
        run: npm run release:check
      - name: Commit validated result
        run: |
          git config user.name orders-app-autonomy-bot
          git config user.email actions@users.noreply.github.com
          git add worker/core/http.ts package.json scripts/test-d1-capacity-autonomy.mjs scripts/d1-capacity-autonomy-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs
          git diff --cached --check
          git commit -m "Recognize D1 daily capacity limits autonomously"
          git push origin HEAD:d1-capacity-autonomy-r1
