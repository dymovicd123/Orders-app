name: R5.4 SQL hotfix build

on:
  push:
    branches:
      - safe/r5-4-sql-hotfix-20260903
    paths:
      - scripts/.r5-4-sql-hotfix-trigger

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/r5-4-sql-hotfix-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply minimal SQL hotfix and add permanent syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          # 1. Exact runtime defect: remove the single invalid comma between the final CTE and SELECT.
          path = Path('worker/domains/order-reservations.ts')
          text = path.read_text()
          bad = "           FROM lineage l\n         ),\n         SELECT\n"
          good = "           FROM lineage l\n         )\n         SELECT\n"
          count = text.count(bad)
          if count != 1:
              raise SystemExit(f'Expected exactly one known broken compact CTE boundary, found {count}')
          path.write_text(text.replace(bad, good))

          # 2. Permanent repository-wide SQL syntax gate.
          test = r'''import fs from 'node:fs'
          import path from 'node:path'
          import ts from 'typescript'
          import { DatabaseSync } from 'node:sqlite'

          const ROOTS = ['worker', 'src']
          const EXTENSIONS = new Set(['.ts', '.tsx', '.js', '.mjs'])
          const files = []
          for (const root of ROOTS) {
            if (!fs.existsSync(root)) continue
            const walk = dir => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name)
                if (entry.isDirectory()) walk(full)
                else if (EXTENSIONS.has(path.extname(entry.name))) files.push(full)
              }
            }
            walk(root)
          }

          const syntaxMarkers = [
            /\)\s*,\s*(?:SELECT|UPDATE|INSERT|DELETE)\b/i,
            /,\s*(?:FROM|WHERE|GROUP\s+BY|ORDER\s+BY|LIMIT|RETURNING)\b/i,
          ]
          const suspicious = []
          const staticSyntax = []
          let prepareCount = 0
          let dynamicCount = 0
          let staticCount = 0
          const sqlite = new DatabaseSync(':memory:')
          const syntaxFailure = message => /syntax error|incomplete input|unrecognized token|unterminated/i.test(String(message))

          for (const file of files) {
            const sourceText = fs.readFileSync(file, 'utf8')
            const sf = ts.createSourceFile(file, sourceText, ts.ScriptTarget.Latest, true,
              file.endsWith('.tsx') ? ts.ScriptKind.TSX : file.endsWith('.js') || file.endsWith('.mjs') ? ts.ScriptKind.JS : ts.ScriptKind.TS)
            const visit = node => {
              if (ts.isCallExpression(node)
                  && ts.isPropertyAccessExpression(node.expression)
                  && node.expression.name.text === 'prepare'
                  && node.arguments.length) {
                prepareCount++
                const arg = node.arguments[0]
                let sql = null
                let dynamic = false
                if (ts.isNoSubstitutionTemplateLiteral(arg) || ts.isStringLiteral(arg)) {
                  sql = arg.text
                  staticCount++
                } else if (ts.isTemplateExpression(arg)) {
                  dynamic = true
                  dynamicCount++
                  sql = arg.head.text
                  for (const span of arg.templateSpans) sql += '__EXPR__' + span.literal.text
                }
                if (sql !== null) {
                  for (const marker of syntaxMarkers) {
                    if (marker.test(sql)) suspicious.push(`${file}:${sf.getLineAndCharacterOfPosition(node.getStart()).line + 1}: ${marker}`)
                  }
                  if (!dynamic) {
                    try { sqlite.prepare(sql) }
                    catch (error) {
                      if (syntaxFailure(error?.message || error)) staticSyntax.push(`${file}:${sf.getLineAndCharacterOfPosition(node.getStart()).line + 1}: ${error.message}`)
                    }
                  }
                }
              }
              ts.forEachChild(node, visit)
            }
            visit(sf)
          }

          // Compile the exact two dynamic handover templates that caused the incident, after substituting only their predicates.
          const handoverFile = 'worker/domains/order-reservations.ts'
          const handover = fs.readFileSync(handoverFile, 'utf8')
          const compactCandidates = [...handover.matchAll(/const compact = await db\.prepare\(\s*`([\s\S]*?)`\s*\)/g)]
          const detailedCandidates = [...handover.matchAll(/const result = await db\.prepare\(\s*`([\s\S]*?)`\s*\)/g)]
          const dynamicCases = [
            {
              name: 'compact handover flags',
              match: compactCandidates.find(row => row[1].includes('${reservationScope}')),
              replacements: [['${reservationScope}', "r.status = 'active' AND r.variant_id IS NOT NULL"]],
            },
            {
              name: 'detailed handover',
              match: detailedCandidates.find(row => row[1].includes('${orderScope}')),
              replacements: [['${orderScope}', 'oi.order_id IN (?)']],
            },
          ]
          for (const testCase of dynamicCases) {
            if (!testCase.match) throw new Error(`Could not locate runtime SQL template: ${testCase.name}`)
            let sql = testCase.match[1]
            for (const [from, to] of testCase.replacements) sql = sql.split(from).join(to)
            if (/\$\{/.test(sql)) throw new Error(`Unsubstituted SQL interpolation remains in ${testCase.name}`)
            try { sqlite.prepare(sql) }
            catch (error) {
              if (syntaxFailure(error?.message || error)) throw new Error(`${testCase.name} SQL syntax failed: ${error.message}`)
            }
          }

          if (suspicious.length || staticSyntax.length) {
            console.error('Suspicious SQL shapes:', suspicious)
            console.error('Static SQL syntax errors:', staticSyntax)
            process.exit(1)
          }
          console.log(`RUNTIME_SQL_SYNTAX_R1 PASSED: prepare=${prepareCount}, static=${staticCount}, dynamic=${dynamicCount}, files=${files.length}`)
          '''
          lines = test.splitlines()
          cleaned = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('scripts/test-runtime-sql-syntax-r1.mjs').write_text(cleaned)

          package = json.loads(Path('package.json').read_text())
          cmd = package['scripts']['release:check']
          gate = 'node scripts/test-runtime-sql-syntax-r1.mjs'
          if gate not in cmd:
              package['scripts']['release:check'] = cmd + ' && ' + gate
          Path('package.json').write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          # 3. Preserve historical hash lineage instead of weakening Step 190.6A.
          test1906 = Path('scripts/test-step1906a-worker-modularization.mjs')
          t = test1906.read_text()
          anchor = "const d1ReadBudgetR54Path = path.join(root, 'scripts/d1-read-budget-r5-4-worker-manifest.json')\n"
          insert = anchor + "const runtimeSqlSyntaxR1Path = path.join(root, 'scripts/runtime-sql-syntax-r1-worker-manifest.json')\n"
          if 'runtimeSqlSyntaxR1Path' not in t:
              if anchor not in t: raise SystemExit('1906A path anchor not found')
              t = t.replace(anchor, insert, 1)
          load_anchor = "  const d1ReadBudgetR54Changes = d1ReadBudgetR54.changes || {}\n"
          load_insert = load_anchor + "  check(fs.existsSync(runtimeSqlSyntaxR1Path), 'Runtime SQL syntax R1 Worker manifest missing')\n  const runtimeSqlSyntaxR1 = JSON.parse(fs.readFileSync(runtimeSqlSyntaxR1Path, 'utf8'))\n  check(runtimeSqlSyntaxR1?.version === 1 && runtimeSqlSyntaxR1?.revision === 'runtime-sql-syntax-r1', 'Runtime SQL syntax R1 Worker manifest invalid')\n  const runtimeSqlSyntaxR1Changes = runtimeSqlSyntaxR1.changes || {}\n"
          if 'const runtimeSqlSyntaxR1Changes' not in t:
              if load_anchor not in t: raise SystemExit('1906A load anchor not found')
              t = t.replace(load_anchor, load_insert, 1)
          old = """    const d1ReadBudgetR54Changed = d1ReadBudgetR54Changes[name]\n    if (d1ReadBudgetR54Changed) {\n      check(d1ReadBudgetR54Changed.before === acceptedPostD1ReadBudgetR3Hash, `D1 read-budget R5.4 changed 192B1-added declaration baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === d1ReadBudgetR54Changed.after, `192B1-added declaration changed beyond exact D1 read-budget R5.4 allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostD1ReadBudgetR3Hash, `192B1 added Worker declaration changed beyond accepted deltas: ${name}`)\n    }\n"""
          new = """    const d1ReadBudgetR54Changed = d1ReadBudgetR54Changes[name]\n    let acceptedPostD1ReadBudgetR54Hash = acceptedPostD1ReadBudgetR3Hash\n    if (d1ReadBudgetR54Changed) {\n      check(d1ReadBudgetR54Changed.before === acceptedPostD1ReadBudgetR3Hash, `D1 read-budget R5.4 changed 192B1-added declaration baseline hash mismatch: ${name}`)\n      acceptedPostD1ReadBudgetR54Hash = d1ReadBudgetR54Changed.after\n    }\n    const runtimeSqlSyntaxR1Changed = runtimeSqlSyntaxR1Changes[name]\n    if (runtimeSqlSyntaxR1Changed) {\n      check(runtimeSqlSyntaxR1Changed.before === acceptedPostD1ReadBudgetR54Hash, `Runtime SQL syntax R1 baseline hash mismatch: ${name}`)\n      check(sha(declarations.get(name)) === runtimeSqlSyntaxR1Changed.after, `192B1-added declaration changed beyond exact Runtime SQL syntax R1 allow-list: ${name}`)\n    } else {\n      check(sha(declarations.get(name)) === acceptedPostD1ReadBudgetR54Hash, `192B1 added Worker declaration changed beyond accepted deltas: ${name}`)\n    }\n"""
          if 'runtimeSqlSyntaxR1Changed' not in t:
              if old not in t: raise SystemExit('1906A R5.4 hash block not found')
              t = t.replace(old, new, 1)
          test1906.write_text(t)
          PY

          # Compute the exact post-hotfix declaration hash in the same normalized form as Step 190.6A.
          node <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const file = 'worker/domains/order-reservations.ts'
          const text = fs.readFileSync(file, 'utf8')
          const sf = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS)
          let declaration = null
          for (const statement of sf.statements) {
            if (ts.isFunctionDeclaration(statement) && statement.name?.text === 'fetchOrderStockHandoverRows') {
              declaration = statement.getFullText(sf).trim().replace(/^export\s+/, '')
              break
            }
          }
          if (!declaration) throw new Error('fetchOrderStockHandoverRows declaration not found')
          const after = crypto.createHash('sha256').update(declaration).digest('hex')
          const manifest = {
            version: 1,
            revision: 'runtime-sql-syntax-r1',
            changes: {
              fetchOrderStockHandoverRows: {
                before: '774f13063870ab3b413c0d543655ad2d66137d997fe77ef2314e4df6a88e3ba8',
                after,
                file,
              },
            },
          }
          fs.writeFileSync('scripts/runtime-sql-syntax-r1-worker-manifest.json', JSON.stringify(manifest, null, 2) + '\n')
          console.log('HOTFIX_DECLARATION_HASH', after)
          NODE

          node scripts/test-runtime-sql-syntax-r1.mjs
          npm run typecheck
          npm run release:check
          npm run build
          git diff --check

          git config user.name 'dymovicd123'
          git config user.email 'dymovicd@gmail.com'
          git add worker/domains/order-reservations.ts scripts/test-runtime-sql-syntax-r1.mjs scripts/runtime-sql-syntax-r1-worker-manifest.json scripts/test-step1906a-worker-modularization.mjs package.json
          git commit -m 'Fix R5.4 compact handover SQL syntax and add runtime SQL gate'
          git push origin HEAD:safe/r5-4-sql-hotfix-20260903
          echo "HOTFIX_COMMIT=$(git rev-parse HEAD)"
