name: 'One-off guarded 4 Ethno historical keeper color renames'
# Archived 2026-10-30: completed historical Production one-off; intentionally disabled.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: oneoff-ethno-four-keeper-colors-20261016
  cancel-in-progress: false
jobs:
  guarded-rename:
    if: false # archived historical Production operation; never execute
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pin production D1 and guard main-only writer
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/ops/oneoff-ethno-four-keeper-colors-20261016.mjs
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            [[ "$GITHUB_REF" == 'refs/heads/main' ]]
            echo 'APPLY_ETHNO_FOUR_COLOR=yes' >> "$GITHUB_ENV"
          else
            [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]
            echo 'APPLY_ETHNO_FOUR_COLOR=no' >> "$GITHUB_ENV"
          fi
          cat > "$RUNNER_TEMP/prod-ethno-four-only.jsonc" <<'CFG'
          {
            "name": "orders-app-ethno-four-historical-keepers",
            "compatibility_date": "2026-07-06",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "orders_db_prod",
              "database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"
            }]
          }
          CFG
          echo "PROD_CANARY_CONFIG=$RUNNER_TEMP/prod-ethno-four-only.jsonc" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Live SELECT preflight, local SQL negative tests or guarded main production write
        run: node scripts/ops/oneoff-ethno-four-keeper-colors-20261016.mjs
