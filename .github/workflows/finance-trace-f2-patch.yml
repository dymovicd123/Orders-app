name: Finance F2 trace patch

on:
  push:
    branches:
      - finance-trace-f2

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[finance-trace-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Finance F2 backend trace patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('worker/domains/finance-reports.ts')
          text = path.read_text(encoding='utf-8')

          marker = "import { listCallCentreRecords, listLeadRecords, listPlans, listTeamEmployees } from './team.ts'\n\n"
          helper = r'''import { listCallCentreRecords, listLeadRecords, listPlans, listTeamEmployees } from './team.ts'

function financeTimestampDate(value: unknown) {
  const text = cleanText(value);
  return text.length >= 10 ? text.slice(0, 10) : '';
}

function classifyFinancePaymentTrace(input: {
  operationType: string;
  orderDate: string;
  orderCreatedAt: string;
  paymentDate: string;
  paymentCreatedAt: string;
  dateRelation: string;
  dateOffsetDays: number;
  recordedOffsetDays: number;
  orderRecordedOffsetDays: number;
  financialEventId: number;
  financialEventReason: string;
  financialEventIsBackfill: boolean;
}) {
  const orderRecordedDate = financeTimestampDate(input.orderCreatedAt);
  const paymentRecordedDate = financeTimestampDate(input.paymentCreatedAt);
  const historicalSuffix = input.financialEventIsBackfill
    ? ' Денежная история этой строки восстановлена из исторического baseline; исходную последовательность старых правок доказать нельзя.'
    : '';

  if (!input.financialEventId) {
    return {
      traceCode: 'lineage_missing',
      traceSeverity: 'review',
      traceTitle: 'Нет связанной денежной истории',
      traceExplanation: 'Оплата есть в текущем заказе, но для неё не найдено соответствующее положительное событие в денежной истории. Строку нужно проверить.',
    };
  }

  if (input.operationType === 'debt_close') {
    return {
      traceCode: 'debt_close', traceSeverity: 'ok', traceTitle: 'Закрытие долга',
      traceExplanation: `Долг по заказу закрыт ${input.paymentDate}. Дата позже заказа для такой операции нормальна.${historicalSuffix}`,
    };
  }
  if (input.operationType === 'exchange_extra') {
    return {
      traceCode: 'exchange_extra', traceSeverity: 'ok', traceTitle: 'Доплата по обмену',
      traceExplanation: `Доплата относится к обмену и учитывается по дате операции ${input.paymentDate}.${historicalSuffix}`,
    };
  }
  if (input.operationType === 'order_extra') {
    return {
      traceCode: 'order_extra', traceSeverity: 'ok', traceTitle: 'Доплата по заказу',
      traceExplanation: `Отдельная доплата по заказу учитывается по дате операции ${input.paymentDate}.${historicalSuffix}`,
    };
  }

  if (input.dateRelation === 'before_order') {
    return {
      traceCode: 'primary_before_order', traceSeverity: 'review', traceTitle: 'Оплата раньше даты заказа',
      traceExplanation: `Первичная оплата датирована ${input.paymentDate}, а заказ — ${input.orderDate}. Разница ${Math.abs(input.dateOffsetDays)} дн. Проверьте выбранные даты.${historicalSuffix}`,
    };
  }

  const orderWasBackdated = Boolean(orderRecordedDate && input.orderDate && orderRecordedDate > input.orderDate);
  const recordedTogether = Boolean(orderRecordedDate && paymentRecordedDate && orderRecordedDate === paymentRecordedDate);
  if (!input.financialEventIsBackfill && orderWasBackdated && recordedTogether) {
    return {
      traceCode: 'backdated_order_entry', traceSeverity: 'info', traceTitle: 'Заказ внесён задним числом',
      traceExplanation: `Заказ имеет дату ${input.orderDate}, но был записан ${orderRecordedDate}. Оплата ${input.paymentDate} записана вместе с заказом; поэтому она может попадать в деньги другого дня.`,
    };
  }

  if (input.financialEventIsBackfill && (
    input.dateRelation !== 'same_day'
    || input.recordedOffsetDays !== 0
    || input.orderRecordedOffsetDays !== 0
  )) {
    return {
      traceCode: 'legacy_baseline_ambiguous', traceSeverity: 'review', traceTitle: 'Историческая запись с разными датами',
      traceExplanation: `Сохранившаяся историческая строка имеет дату заказа ${input.orderDate}, дату оплаты ${input.paymentDate} и была перенесена в надёжную денежную историю как baseline. Исходную причину различия дат автоматически доказать нельзя.`,
    };
  }

  if (input.dateRelation === 'after_order' && paymentRecordedDate && paymentRecordedDate < input.paymentDate) {
    return {
      traceCode: 'primary_future_dated_at_entry', traceSeverity: 'review', traceTitle: 'Первичная оплата датирована будущим днём',
      traceExplanation: `Оплата была записана ${paymentRecordedDate}, но её бизнес-дата — ${input.paymentDate}. Проверьте, была ли эта дата выбрана намеренно.`,
    };
  }

  if (input.recordedOffsetDays > 0) {
    return {
      traceCode: 'primary_recorded_later', traceSeverity: 'review', traceTitle: 'Первичная оплата внесена позже своей даты',
      traceExplanation: `Оплата датирована ${input.paymentDate}, но запись создана ${paymentRecordedDate || input.paymentCreatedAt}. Разница ${input.recordedOffsetDays} дн.`,
    };
  }

  if (input.dateRelation === 'after_order') {
    return {
      traceCode: 'primary_after_order', traceSeverity: 'review', traceTitle: 'Первичная оплата позже даты заказа',
      traceExplanation: `Первичная оплата датирована ${input.paymentDate}, заказ — ${input.orderDate}. Разница ${input.dateOffsetDays} дн. Проверьте, это намеренная дата оплаты или должна быть отдельная доплата/закрытие долга.`,
    };
  }

  if (orderWasBackdated) {
    return {
      traceCode: 'backdated_order_entry', traceSeverity: 'info', traceTitle: 'Заказ внесён задним числом',
      traceExplanation: `Бизнес-дата заказа ${input.orderDate}, дата записи ${orderRecordedDate}. Оплата совпадает с датой заказа, но сам заказ был внесён позже.`,
    };
  }

  return {
    traceCode: 'primary_same_day', traceSeverity: 'ok', traceTitle: 'Обычная первичная оплата',
    traceExplanation: `Дата первичной оплаты совпадает с датой заказа (${input.orderDate}).${historicalSuffix}`,
  };
}

'''
          if marker not in text:
            raise SystemExit('helper insertion marker not found')
          text = text.replace(marker, helper, 1)

          old_select = r'''              o.external_id,
              o.order_date,
              p.payment_date,
              p.method,
              p.amount,
              p.payment_kind,
              COALESCE(p.comment, '') AS comment,
              COALESCE(p.created_at, '') AS created_at,
              o.manager_id,'''
          new_select = r'''              o.external_id,
              o.order_date,
              COALESCE(o.created_at, '') AS order_created_at,
              p.payment_date,
              p.method,
              p.amount,
              p.payment_kind,
              COALESCE(p.comment, '') AS comment,
              COALESCE(p.created_at, '') AS created_at,
              COALESCE(fe.id, 0) AS financial_event_id,
              COALESCE(fe.event_at, '') AS financial_event_at,
              COALESCE(fe.reason, '') AS financial_event_reason,
              COALESCE(fe.is_backfill, 0) AS financial_event_is_backfill,
              COALESCE(fe.source_type, '') AS financial_event_source_type,
              COALESCE(fe.source_ref, '') AS financial_event_source_ref,
              o.manager_id,'''
          if old_select not in text:
            raise SystemExit('payment select marker not found')
          text = text.replace(old_select, new_select, 1)

          old_offsets = r'''              CAST(julianday(p.payment_date) - julianday(o.order_date) AS INTEGER) AS date_offset_days
       FROM payments p
       JOIN orders o ON o.id = p.order_id
       LEFT JOIN managers m ON m.id = o.manager_id'''
          new_offsets = r'''              CAST(julianday(p.payment_date) - julianday(o.order_date) AS INTEGER) AS date_offset_days,
              CAST(julianday(substr(COALESCE(p.created_at, ''), 1, 10)) - julianday(p.payment_date) AS INTEGER) AS recorded_offset_days,
              CAST(julianday(substr(COALESCE(o.created_at, ''), 1, 10)) - julianday(o.order_date) AS INTEGER) AS order_recorded_offset_days
       FROM payments p
       JOIN orders o ON o.id = p.order_id
       LEFT JOIN financial_events fe ON fe.id = (
         SELECT fe2.id
         FROM financial_events fe2
         WHERE fe2.order_id = p.order_id
           AND fe2.amount_delta > 0
           AND fe2.event_date = p.payment_date
           AND COALESCE(fe2.event_at, '') = COALESCE(p.created_at, '')
           AND ABS(fe2.amount_delta) = ABS(p.amount)
           AND COALESCE(fe2.payment_method, '') = COALESCE(p.method, '')
           AND fe2.event_type IN ('order_payment', 'order_extra', 'debt_close', 'exchange_extra')
         ORDER BY fe2.is_backfill ASC, fe2.id DESC
         LIMIT 1
       )
       LEFT JOIN managers m ON m.id = o.manager_id'''
          if old_offsets not in text:
            raise SystemExit('payment offsets marker not found')
          text = text.replace(old_offsets, new_offsets, 1)

          old_mapping = r'''    return {
      id: Number(row.id || 0),
      orderId: Number(row.order_id || 0),
      externalId: cleanText(row.external_id),
      orderDate: cleanText(row.order_date),
      paymentDate: cleanText(row.payment_date),
      method: canonicalPaymentMethodName(row.method),
      amount: Number(row.amount || 0),
      paymentKind: cleanText(row.payment_kind),
      operationType,
      operationLabel,
      comment: cleanText(row.comment),
      createdAt: cleanText(row.created_at),
      managerId: row.manager_id == null ? null : Number(row.manager_id),
      manager: cleanText(row.manager) || 'Не указан',
      managerColor: normalizeManagerColor(row.manager_color, toInt(row.manager_id, 1) - 1),
      customer: cleanText(row.customer) || '—',
      city: cleanText(row.city),
      dateRelation: cleanText(row.date_relation) || 'same_day',
      dateOffsetDays: Number(row.date_offset_days || 0),
    };
  });'''
          new_mapping = r'''    const orderDate = cleanText(row.order_date);
    const paymentDate = cleanText(row.payment_date);
    const orderCreatedAt = cleanText(row.order_created_at);
    const createdAt = cleanText(row.created_at);
    const dateRelation = cleanText(row.date_relation) || 'same_day';
    const dateOffsetDays = Number(row.date_offset_days || 0);
    const recordedOffsetDays = Number(row.recorded_offset_days || 0);
    const orderRecordedOffsetDays = Number(row.order_recorded_offset_days || 0);
    const financialEventId = Number(row.financial_event_id || 0);
    const financialEventIsBackfill = toInt(row.financial_event_is_backfill, 0) === 1;
    const trace = classifyFinancePaymentTrace({
      operationType,
      orderDate,
      orderCreatedAt,
      paymentDate,
      paymentCreatedAt: createdAt,
      dateRelation,
      dateOffsetDays,
      recordedOffsetDays,
      orderRecordedOffsetDays,
      financialEventId,
      financialEventReason: cleanText(row.financial_event_reason),
      financialEventIsBackfill,
    });
    const orderDatePeriodRelation = orderDate < startDate ? 'before_period' : orderDate > endDate ? 'after_period' : 'in_period';
    return {
      id: Number(row.id || 0),
      orderId: Number(row.order_id || 0),
      externalId: cleanText(row.external_id),
      orderDate,
      orderCreatedAt,
      orderRecordedOffsetDays,
      orderDatePeriodRelation,
      paymentDate,
      method: canonicalPaymentMethodName(row.method),
      amount: Number(row.amount || 0),
      paymentKind: cleanText(row.payment_kind),
      operationType,
      operationLabel,
      comment: cleanText(row.comment),
      createdAt,
      recordedOffsetDays,
      financialEventId: financialEventId || null,
      financialEventAt: cleanText(row.financial_event_at) || null,
      financialEventReason: cleanText(row.financial_event_reason) || null,
      financialEventIsBackfill,
      financialEventSourceType: cleanText(row.financial_event_source_type) || null,
      financialEventSourceRef: cleanText(row.financial_event_source_ref) || null,
      managerId: row.manager_id == null ? null : Number(row.manager_id),
      manager: cleanText(row.manager) || 'Не указан',
      managerColor: normalizeManagerColor(row.manager_color, toInt(row.manager_id, 1) - 1),
      customer: cleanText(row.customer) || '—',
      city: cleanText(row.city),
      dateRelation,
      dateOffsetDays,
      ...trace,
    };
  });'''
          if old_mapping not in text:
            raise SystemExit('payment mapping marker not found')
          text = text.replace(old_mapping, new_mapping, 1)

          old_anomaly = "  const paymentDateAnomalies = paymentOperations.filter((row: any) => row.dateRelation === 'before_order');\n"
          new_anomaly = r'''  const paymentDateAnomalies = paymentOperations.filter((row: any) => row.dateRelation === 'before_order');
  const paymentTraceReview = paymentOperations.filter((row: any) => row.traceSeverity === 'review');
  const paymentTraceInfo = paymentOperations.filter((row: any) => row.traceSeverity === 'info');
  const crossPeriodOrderPayments = paymentOperations.filter((row: any) => (
    row.operationType === 'order_payment' && row.orderDatePeriodRelation !== 'in_period'
  ));
  const orderPaymentsForOrdersInPeriodTotal = paymentOperations
    .filter((row: any) => row.operationType === 'order_payment' && row.orderDatePeriodRelation === 'in_period')
    .reduce((sum: number, row: any) => sum + row.amount, 0);
  const orderPaymentsForOrdersOutsidePeriodTotal = crossPeriodOrderPayments
    .reduce((sum: number, row: any) => sum + row.amount, 0);
'''
          if old_anomaly not in text:
            raise SystemExit('anomaly marker not found')
          text = text.replace(old_anomaly, new_anomaly, 1)

          old_overview = r'''      paymentDateAnomalyCount: paymentDateAnomalies.length,
      paymentDateAnomalyTotal: paymentDateAnomalies.reduce((sum: number, row: any) => sum + row.amount, 0),
      currentDebt: Number((currentDebtRow as any)?.total_debt || 0),'''
          new_overview = r'''      paymentDateAnomalyCount: paymentDateAnomalies.length,
      paymentDateAnomalyTotal: paymentDateAnomalies.reduce((sum: number, row: any) => sum + row.amount, 0),
      paymentTraceReviewCount: paymentTraceReview.length,
      paymentTraceReviewTotal: paymentTraceReview.reduce((sum: number, row: any) => sum + row.amount, 0),
      paymentTraceInfoCount: paymentTraceInfo.length,
      crossPeriodOrderPaymentCount: crossPeriodOrderPayments.length,
      crossPeriodOrderPaymentTotal: orderPaymentsForOrdersOutsidePeriodTotal,
      currentDebt: Number((currentDebtRow as any)?.total_debt || 0),'''
          if old_overview not in text:
            raise SystemExit('overview marker not found')
          text = text.replace(old_overview, new_overview, 1)

          old_reports = r'''      paymentOperations,
      paymentDateAnomalies,
      consistency: {'''
          new_reports = r'''      paymentOperations,
      paymentDateAnomalies,
      paymentTraceReview,
      paymentTraceInfo,
      crossPeriodOrderPayments,
      paymentPeriodBridge: {
        orderPaymentsForOrdersInPeriodTotal,
        orderPaymentsForOrdersOutsidePeriodTotal,
        orderPaymentsForOrdersOutsidePeriodCount: crossPeriodOrderPayments.length,
        orderExtraPaymentsTotal,
        debtPaymentsTotal,
        exchangeExtraPaymentsTotal,
        grossReceived: totalPayments,
      },
      consistency: {'''
          if old_reports not in text:
            raise SystemExit('reports marker not found')
          text = text.replace(old_reports, new_reports, 1)

          path.write_text(text, encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Full release gate
        run: npm run release:check
      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/domains/finance-reports.ts migrations/0062_v72_finance_traceability.sql
          git commit -m "Add finance payment trace contract [finance-trace-patched]"
          git push
