name: Inspect Branch2 QA orders

on:
  push:
    branches: [branch2]
    paths: [.github/workflows/inspect-branch2-qa-orders.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
      B2_DB_ID: 40065052-854e-44b8-bcd5-251bdd488301
    steps:
      - name: Inspect only
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local sql="$1"
            curl --fail-with-body -sS -X POST               -H "Authorization: Bearer $CF_API_TOKEN"               -H "Content-Type: application/json"               "$CF_API/accounts/$CF_ACCOUNT_ID/d1/database/$B2_DB_ID/query"               --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" | jq -c '.result[]?.results // []'
          }
          echo '=== QA S01 ORDERS ==='
          q "SELECT o.id,o.external_id,o.order_date,o.manager_id,m.name AS manager_name,o.city,o.delivery_type,o.source_type,o.workshop_status,o.order_status,o.total_amount,o.received_amount,o.debt_amount,o.shipping_status,o.shipping_date,o.comment,o.created_at,o.updated_at FROM orders o LEFT JOIN managers m ON m.id=o.manager_id WHERE o.external_id LIKE 'QA-S01-%' ORDER BY o.id"
          echo '=== QA S01 ITEMS ==='
          q "SELECT o.external_id,oi.id,oi.product_id,oi.variant_id,oi.product_name_snapshot,oi.gender_snapshot,oi.color_snapshot,oi.material_snapshot,oi.length_snapshot,oi.size_snapshot,oi.quantity,oi.is_workshop,oi.stock_writeoff_status,oi.created_at FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE o.external_id LIKE 'QA-S01-%' ORDER BY o.id,oi.id"
          echo '=== QA S01 WORKSHOP ==='
          q "SELECT o.external_id,w.id,w.status,w.quantity,w.comment,w.created_at,w.updated_at FROM workshop_tasks w JOIN orders o ON o.id=w.order_id WHERE o.external_id LIKE 'QA-S01-%' ORDER BY o.id,w.id"
          echo '=== QA S01 ACTIVITIES ==='
          q "SELECT id,event_type,entity_type,entity_id,order_id,external_order_id,title,details,created_at FROM activity_log WHERE external_order_id LIKE 'QA-S01-%' ORDER BY id"
