name: Branch2 mirror offline-only dry run
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'scripts/branch2-mirror-local-readonly-dryrun-20261027.mjs'
      - '.github/workflows/branch2-mirror-local-readonly-dryrun-20261027.yml'
  push:
    branches: [branch2]
    paths:
      - 'scripts/branch2-mirror-local-readonly-dryrun-20261027.mjs'
      - '.github/workflows/branch2-mirror-local-readonly-dryrun-20261027.yml'
permissions:
  contents: read
concurrency:
  group: branch2-local-data-dryrun
  cancel-in-progress: false
jobs:
  static-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --check scripts/branch2-mirror-local-readonly-dryrun-20261027.mjs
      - name: Verify strictly staging-config and no shell D1 writes
        run: |
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_id": "40065052-854e-44b8-bcd5-251bdd488301"' wrangler.jsonc
          ! grep -Fq '17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
  local-copy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/branch2'
    needs: static-guard
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Read production only and verify disposable local SQLite mirror
        run: node scripts/branch2-mirror-local-readonly-dryrun-20261027.mjs
