name: Client3 QA single manager brand
on:
  push:
    branches: [client3/qa-manager-brand-return-design-20261106]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types scripts/client3/test-watch-manager-single-brand-20261106.mjs
      - run: node --experimental-strip-types scripts/client3/test-watch-editor-issued-correction-20261106.mjs
      - run: node --experimental-strip-types scripts/client3/test-watch-editor-brand-sku-20261106.mjs
      - run: node --experimental-strip-types scripts/client3/test-watch-order-editor-delete-release-20261105.mjs
      - run: node --experimental-strip-types scripts/client3/test-watch-order-commit-20261102.mjs
      - run: node --experimental-strip-types scripts/client3/test-watch-return-money-ui-20261104.mjs
