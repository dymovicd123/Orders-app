name: Quality check

on:
  # Full CI is no longer tied to every intermediate work-branch push.
  # Normal development is verified when it becomes a PR; ci-* remains
  # an explicit escape hatch for a full pre-PR run.
  push:
    branches:
      - 'ci-*'
  pull_request:
    branches:
      - branch2
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Draft PRs do not consume a full runner. The same complete gate starts
    # automatically when the PR becomes ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: release-check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit high-risk development dependencies
        run: npm audit --audit-level=high

      - name: Reproduce old-order Exchange product pick and shortage confirmation
        run: node scripts/test-legacy-exchange-product-pick-no-white-screen-20261017.mjs

      - name: Verify Main atomic last-piece reservation, pending retry and HTTP recovery
        if: github.base_ref == 'main'
        run: |
          node scripts/test-main-stage16-atomic-reservation-20261101.mjs
          node scripts/test-main-stage15-exact-pending-reserve-retry-20261101.mjs
          node scripts/test-main-stage16-worker-shipping-recovery-20261101.mjs

      - name: Verify Main in-app confirmations and reason inputs
        if: github.base_ref == 'main'
        run: node scripts/test-main-safe-dialogs-20261110.mjs

      - name: Verify Main isolated DDS ledger, dynamic directory, Excel and rights
        if: github.base_ref == 'main'
        run: |
          node scripts/test-simple-dds-ledger-20261110.mjs
          node scripts/test-dds-excel-ux-20261110.mjs

      - name: Verify Main timesheet preserves shifts, attendance role rights and mobile UX
        if: github.base_ref == 'main'
        run: |
          node scripts/test-main-attendance-schema-preserve-20261110.mjs
          node scripts/test-team-attendance-v1-20261110.mjs
          node scripts/test-team-attendance-manager-ux-20261110.mjs
          node scripts/test-team-timesheet-bulk-safe-20261110.mjs
          node scripts/test-team-timesheet-report-v2-20261110.mjs
          node scripts/test-team-timesheet-mobile-ux-20261110.mjs

      - name: Verify Main stock valuation, Russian Word/Excel reports and admin-only navigation
        if: github.base_ref == 'main'
        run: |
          node scripts/test-warehouse-capital-readonly-20261110.mjs
          node scripts/test-warehouse-reports-navigation-20261111.mjs
          node scripts/test-warehouse-reports-excel-20261110.mjs
          node scripts/test-warehouse-report-documents-20261111.mjs
          node scripts/test-warehouse-capital-ux-full-word-20261111.mjs

      - name: Run cumulative regression gate
        run: npm run release:check

      - name: Verify physical stock and reserved sizes are visible
        run: node scripts/test-inventory-stock-visible-reservations.mjs

      - name: Verify original return-item characteristics and distinguish duplicate model names
        run: node scripts/test-return-attributes-20261029.mjs

      - name: Read-only inventory of test usage and archived fixtures
        run: node scripts/audit-ci-test-usage-20261108.mjs

      - name: Build application
        run: npm run build
