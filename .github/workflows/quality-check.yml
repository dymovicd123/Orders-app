name: Quality check

on:
  push:
    branches:
      - 'w*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: release-check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ls @vitejs/plugin-react vite typescript --depth=0
          test -f node_modules/@vitejs/plugin-react/package.json
          node -e "console.log(require('fs').readFileSync('node_modules/@vitejs/plugin-react/package.json','utf8'))"

      - name: Run cumulative regression gate
        run: npm run release:check

      - name: Build application
        run: npm run build
