name: Quality check

on:
  # Full CI is no longer tied to every intermediate work-branch push.
  # Normal development is verified when it becomes a PR; ci-* remains
  # an explicit escape hatch for a full pre-PR run.
  push:
    branches:
      - 'ci-*'
  pull_request:
    branches:
      - branch2
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Draft PRs do not consume a full runner. The same complete gate starts
    # automatically when the PR becomes ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: release-check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit high-risk development dependencies
        run: npm audit --audit-level=high

      - name: Run cumulative regression gate
        run: npm run release:check

      - name: Build application
        run: npm run build
