name: Temporary catalog ready/resume validation

on:
  push:
    branches:
      - w-catalog-ready-resume-branch2-20260930
    paths:
      - 'worker/domains/catalog-retirement.ts'
      - 'worker/domains/catalog.ts'
      - 'src/features/inventory/views/CatalogRetirementHistory.tsx'
      - 'migrations/0078_v72_catalog_restore_resumability.sql'
      - 'scripts/test-catalog-safe-retirement.mjs'
      - 'scripts/test-catalog-safe-restore.mjs'
      - 'scripts/test-catalog-local-retirement.mjs'
      - 'scripts/test-step1906a-worker-modularization.mjs'
      - 'scripts/catalog-ready-resume-r1-worker-manifest.json'
      - 'scripts/fixtures/catalog-ready-resume-r1/worker/domains/catalog-retirement.ts'
      - 'scripts/fixtures/catalog-ready-resume-r1/worker/domains/catalog.ts'
      - '.github/workflows/catalog-ready-resume-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run build
