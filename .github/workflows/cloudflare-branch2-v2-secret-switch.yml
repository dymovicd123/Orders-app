name: Cloudflare Branch2 - Return V2 Secret Flag Switch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: cloudflare-branch2-return-v2-staging
  cancel-in-progress: false

jobs:
  branch2-only-secret:
    name: Set only Branch2 Return V2 secret (ON or OFF)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 864 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'dymovicd123' &&
      (
        github.event.comment.body == 'BRANCH2_RETURN_V2_SET_SECRET_TRUE_20261115' ||
        github.event.comment.body == 'BRANCH2_RETURN_V2_SET_SECRET_FALSE_20261115'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_FLAG_VALUE: ${{ github.event.comment.body == 'BRANCH2_RETURN_V2_SET_SECRET_TRUE_20261115' && 'true' || 'false' }}
    steps:
      - name: Checkout trusted Main-only identity guard
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Checkout the only allowed test Worker configuration
        uses: actions/checkout@v4
        with:
          ref: branch2
          path: stage
          persist-credentials: false

      - name: Confirm Main isolation and complete Branch2 D1 migrations (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/scripts/branch2_v2_stage_guard.py --stage stage --expected-index 9

      - name: Add exactly one Branch2 secret via official API and verify all other bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ env.TEST_FLAG_VALUE }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.error,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          value=os.environ['VALUE']
          assert value in ('true','false')
          target='0904a573-21ff-44d8-93b0-c9200f771702'
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/orders-app-branch2/settings'

          def remote():
              req=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+token,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  payload=json.load(response)
              if not payload.get('success'):
                  raise SystemExit('STOP: cannot inspect exact Branch2 Worker.')
              return payload.get('result',{}).get('bindings',[])

          before=remote()
          db=[b for b in before if b.get('name')=='DB']
          if len(db)!=1 or db[0].get('type')!='d1' or (
              (db[0].get('database_id') or db[0].get('id'))!=target):
              raise SystemExit('STOP: unexpected Branch2 D1 binding.')
          flag=[b for b in before if b.get('name')=='RETURN_V2_ENABLED']
          if len(flag)>1 or (flag and flag[0].get('type')!='secret_text'):
              raise SystemExit('STOP: existing flag binding has an unexpected type.')
          # Secret PUT adds one binding and creates/deploys a Worker version,
          # preserving all unrelated DB/asset/other bindings and source code.
          unchanged={b['name']:b for b in before if b.get('name')!='RETURN_V2_ENABLED'}
          if len(unchanged)!=len(before)-len(flag):
              raise SystemExit('STOP: duplicate or nameless Worker bindings.')
          config=json.load(open('stage/wrangler.jsonc',encoding='utf-8'))
          if (config.get('name')!='orders-app-branch2'
              or len(config.get('d1_databases',[]))!=1
              or config['d1_databases'][0].get('database_id')!=target):
              raise SystemExit('STOP: local Worker config is not Branch2.')
          print('Before: Branch2 D1 verified, original unrelated bindings:',len(unchanged))
          print('Applying one test Worker Return V2 binding via official Cloudflare API.')
          # Use the official single-secret endpoint, not Wrangler's CLI
          # interactive prompt (which returned exit 1 with no useful outcome).
          # This PUT targets one binding; no settings list replacement.
          secret_url=url.rsplit('/settings',1)[0]+'/secrets'
          body=json.dumps({
              'name':'RETURN_V2_ENABLED','type':'secret_text','text':value
          }).encode('utf-8')
          req=urllib.request.Request(secret_url,method='PUT',data=body,headers={
              'Authorization':'Bearer '+token,
              'Content-Type':'application/json','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=40) as response:
                  status=response.status
                  result=json.load(response)
          except urllib.error.HTTPError as error:
              status=error.code
              try:
                  result=json.loads(error.read().decode('utf-8'))
              except (ValueError,UnicodeError):
                  result={}
          if status not in (200,201) or not result.get('success'):
              codes=[str(entry.get('code','unknown')) for entry in result.get('errors',[])]
              # Cloudflare error codes only, never secrets, customer data or tokens.
              raise SystemExit('STOP: single-secret Cloudflare API PUT failed (HTTP %s, codes %s).' %
                               (status,','.join(codes) or 'n/a'))
          response_binding=result.get('result') or {}
          if response_binding.get('name')!='RETURN_V2_ENABLED' or response_binding.get('type')!='secret_text':
              raise SystemExit('STOP: Cloudflare accepted PUT but returned unexpected binding metadata.')
          print('PASS: Cloudflare accepted a single-secret API PUT for orders-app-branch2.')

          for attempt in range(1,11):
              time.sleep(3)
              after=remote()
              flags=[b for b in after if b.get('name')=='RETURN_V2_ENABLED']
              others={b['name']:b for b in after if b.get('name')!='RETURN_V2_ENABLED'}
              if others!=unchanged:
                  raise SystemExit('STOP: an existing test Worker binding changed unexpectedly.')
              if len(flags)==1 and flags[0].get('type')=='secret_text':
                  print('PASS: Return V2 secret binding exists on Branch2; all other bindings unchanged.')
                  print('Cloudflare accepted only the one requested literal; secret value is not returned by GET.')
                  print('Main Worker and Main D1 were never targeted.')
                  break
              if attempt==10:
                  raise SystemExit('STOP: Cloudflare did not confirm the secret binding.')
          PY

      - name: Read-only test URL availability (not a browser UAT)
        run: |
          python3 - <<'PY'
          import urllib.error,urllib.request
          req=urllib.request.Request(
              'https://orders-app-branch2.orders-clothes.workers.dev/api/auth/status',
              headers={'Accept':'application/json',
                       'User-Agent':'Mozilla/5.0 (Orders-app-Branch2-Safe-Test)'})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit('Unexpected Branch2 public HTTP status.')
                  print('PASS: public Branch2 auth-status GET HTTP 200.')
          except urllib.error.HTTPError as error:
              if error.code in (401,403):
                  print('::warning::GitHub runner sees Branch2 HTTP',error.code)
              else:
                  raise
          PY

      - name: Report exact outcome to Issue 864
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          FLAG_VALUE: ${{ env.TEST_FLAG_VALUE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          outcome=os.environ['OUTCOME']
          value=os.environ['FLAG_VALUE']
          assert value in ('true','false')
          body=('Return V2 Branch2 **secret-only switch '+value+'** — **'+outcome+'**.\n\n'+
                ('Official Cloudflare single-secret API accepted the request; exact test D1 and other bindings preserved. Browser UAT still required.' if outcome=='success'
                 else 'Do not assume the feature state. Inspect run and test Worker before retrying.')+
                '\n\n'+os.environ['RUN_URL']+
                '\n\nNo Main Worker or Main D1 operation was performed.')
          req=urllib.request.Request(
              'https://api.github.com/repos/'+os.environ['REPO']+'/issues/864/comments',
              data=json.dumps({'body':body}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                       'Accept':'application/vnd.github+json','Content-Type':'application/json'},
              method='POST')
          with urllib.request.urlopen(req,timeout=25) as response:
              assert response.status==201
          PY
