name: Branch2 Return V2 legacy reconciliation - one time
on:
  push:
    branches: [branch2]
permissions:
  contents: read
concurrency:
  group: cloudflare-branch2-return-v2-staging
  cancel-in-progress: false
jobs:
  release:
    if: >-
      startsWith(github.event.head_commit.message, 'Branch2: deploy Return V2 legacy baseline 0135 20261115')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested Branch2 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: stage
          persist-credentials: false
      - name: Checkout production identity guard only
        uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false
      - name: Setup dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: stage/package-lock.json
      - name: Verify Main separation and original test D1 schema without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 ops/.github/scripts/branch2_v2_stage_guard.py --stage stage --expected-index 9
      - name: Test and build all new Branch2 code
        working-directory: stage
        run: |
          npm ci --no-audit --no-fund
          npm run verify:return-v2-branch2
          npm run release:check
          npm run build
      - name: Prepare exact Branch2-only config and Wrangler dry run
        working-directory: stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          cfg=json.loads(Path('wrangler.jsonc').read_text())
          assert cfg['name']=='orders-app-branch2'
          assert not cfg.get('env')
          db=cfg['d1_databases']
          assert len(db)==1
          assert db[0]['binding']=='DB'
          assert db[0]['database_id']=='0904a573-21ff-44d8-93b0-c9200f771702'
          assert db[0]['database_name']=='orders_db_branch2_mirror_20261027'
          assert cfg.get('vars',{}).get('RETURN_V2_ENABLED') not in ('true',True)
          cfg['vars']={**cfg.get('vars',{}),'RETURN_V2_ENABLED':'true'}
          Path('wrangler.return-v2-ux.jsonc').write_text(json.dumps(cfg,indent=2)+'\n')
          print('PASS: exact test Worker and DB configured.')
          PY
          npx --no-install wrangler deploy --config wrangler.return-v2-ux.jsonc --name orders-app-branch2 --strict --dry-run
      - name: Verify additive V2 journal is present on test D1 (READ ONLY)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/0904a573-21ff-44d8-93b0-c9200f771702/query'
          sql="""SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='return_v2_unified_action_overrides') AS action_table,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_return_v2_unified_action_override_item') AS action_index"""
          request=urllib.request.Request(url,method='POST',
           data=json.dumps({'sql':sql,'params':[]}).encode(),
           headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:obj=json.load(response)
          if not obj.get('success'):raise SystemExit('STOP: cannot inspect test D1 schema')
          rows=obj['result'][0]['results']
          if len(rows)!=1 or int(rows[0]['action_table'])!=1 or int(rows[0]['action_index'])!=1:
            raise SystemExit('STOP: test D1 is not ready for new Return V2 actions')
          print('PASS: both additive journal capabilities present.')
          PY
      - name: Verify immutable reviewed 0135 source and absence in remote test D1
        working-directory: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,urllib.request
          name='0135_return_v2_legacy_contract_baseline.sql'
          data=(Path('migrations')/name).read_bytes()
          digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if digest!='32b60118de9a38fc0ea1e019e0e788f04d8a5d4e':
              raise SystemExit('STOP: unreviewed 0135 migration bytes')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          dbid='0904a573-21ff-44d8-93b0-c9200f771702'
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+dbid
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(base,headers=headers),timeout=30) as res:metadata=json.load(res)
          if not metadata.get('success') or metadata['result'].get('name')!='orders_db_branch2_mirror_20261027':
              raise SystemExit('STOP: remote target is NOT exact test D1')
          sql="""SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN
              ('return_v2_legacy_baselines','return_v2_legacy_baseline_returns',
               'return_v2_legacy_baseline_items')) AS new_tables,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table'
              AND name='return_v2_unified_action_overrides') AS old_action_table"""
          request=urllib.request.Request(base+'/query',method='POST',headers=headers,
             data=json.dumps({'sql':sql,'params':[]}).encode())
          with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
          if not result.get('success'):raise SystemExit('STOP: remote schema read failed')
          rows=result['result'][0].get('results') or []
          if len(rows)!=1 or rows[0]['new_tables']!=0 or rows[0]['old_action_table']!=1:
             raise SystemExit('STOP: test D1 schema has unexpected 0135 state')
          print('PASS: reviewed bytes, exact Branch2 D1 and no 0135 tables.')
          PY
      - name: Apply 0135 ADDITIVE migration to exact Branch2 test D1 ONLY
        working-directory: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler d1 execute orders_db_branch2_mirror_20261027 --config wrangler.jsonc --remote --file migrations/0135_return_v2_legacy_contract_baseline.sql --yes
      - name: Verify 0135 test D1 journal installed with no other target
        working-directory: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          url='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()+'/d1/database/0904a573-21ff-44d8-93b0-c9200f771702/query'
          sql="""SELECT
            (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN
             ('return_v2_legacy_baselines','return_v2_legacy_baseline_returns',
              'return_v2_legacy_baseline_items')) AS table_count,
            (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name IN
             ('idx_return_v2_legacy_returns_posting','idx_return_v2_legacy_items_posting')) AS index_count"""
          request=urllib.request.Request(url,method='POST',
            headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'].strip(),
              'Content-Type':'application/json'},
            data=json.dumps({'sql':sql,'params':[]}).encode())
          with urllib.request.urlopen(request,timeout=30) as res:result=json.load(res)
          if not result.get('success'):raise SystemExit('STOP: post-migration D1 schema read failed')
          rows=result['result'][0].get('results') or []
          if len(rows)!=1 or int(rows[0]['table_count'])!=3 or int(rows[0]['index_count'])!=2:
              raise SystemExit('STOP: 0135 not completely applied; refuse Worker release')
          print('PASS: all three additive baseline tables and both indexes on test D1.')
          PY
      - name: Deploy only Branch2 Worker
        working-directory: stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy --config wrangler.return-v2-ux.jsonc --name orders-app-branch2 --strict
      - name: Verify active Branch2 version at 100 percent, exact D1 and V2 enabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/orders-app-branch2'
          def get(path):
            request=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token})
            with urllib.request.urlopen(request,timeout=30) as response:obj=json.load(response)
            if not obj.get('success'):raise SystemExit('STOP: Cloudflare read failed: '+path)
            return obj['result']
          deployments=get('/deployments?per_page=1').get('deployments') or []
          if not deployments:raise SystemExit('STOP: no active test deployment')
          versions=deployments[0].get('versions') or []
          if len(versions)!=1 or float(versions[0].get('percentage') or 0)!=100:
            raise SystemExit('STOP: unexpected version split')
          active=versions[0]['version_id']
          bindings=(get('/versions/'+active).get('resources') or {}).get('bindings') or []
          dbs=[b for b in bindings if b.get('name')=='DB']
          flags=[b for b in bindings if b.get('name')=='RETURN_V2_ENABLED']
          if len(dbs)!=1 or (dbs[0].get('database_id') or dbs[0].get('id'))!='0904a573-21ff-44d8-93b0-c9200f771702':
            raise SystemExit('STOP: wrong D1 on active Worker')
          if len(flags)!=1 or flags[0].get('type')!='plain_text' or flags[0].get('text')!='true':
            raise SystemExit('STOP: Return V2 not enabled on active Worker')
          print('PASS: active Branch2 version has test D1 and V2 enabled at 100%.')
          PY
      - name: Read-only financial evidence for the known QA test order
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip()
          token=os.environ['CLOUDFLARE_API_TOKEN'].strip()
          url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/0904a573-21ff-44d8-93b0-c9200f771702/query'
          sql="""SELECT o.pricing_mode,o.total_amount,o.shipping_status,
          (SELECT COALESCE(SUM(i.quantity*i.unit_price),0) FROM order_items i WHERE i.order_id=o.id) AS price_sum,
          (SELECT COALESCE(SUM(i.line_total),0) FROM order_items i WHERE i.order_id=o.id) AS line_total_sum,
          (SELECT COUNT(*) FROM order_items i WHERE i.order_id=o.id AND i.quantity>0) AS item_count,
          (SELECT COALESCE(SUM(CASE WHEN r.status='active' THEN r.quantity ELSE 0 END),0) FROM inventory_reservations r WHERE r.order_id=o.id) AS active_reserved_qty,
          (SELECT COALESCE(SUM(CASE WHEN r.status='unresolved' THEN r.quantity ELSE 0 END),0) FROM inventory_reservations r WHERE r.order_id=o.id) AS unresolved_qty,
          (SELECT COALESCE(SUM(CASE WHEN r.status='fulfilled' THEN r.quantity ELSE 0 END),0) FROM inventory_reservations r WHERE r.order_id=o.id) AS fulfilled_qty,
          (SELECT COUNT(*) FROM returns ret WHERE ret.order_id=o.id AND COALESCE(ret.status,'completed')<>'cancelled') AS previous_returns,
          (SELECT COUNT(*) FROM exchanges e WHERE e.order_id=o.id AND COALESCE(e.status,'completed')<>'cancelled') AS previous_exchanges
          FROM orders o WHERE o.external_id='ORD-20261107192851-E3F3FF04'"""
          req=urllib.request.Request(url,method='POST',data=json.dumps({'sql':sql,'params':[]}).encode(),
           headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response:obj=json.load(response)
          if not obj.get('success'):raise SystemExit('STOP: read-only QA diagnosis failed')
          rows=obj['result'][0].get('results') or []
          if len(rows)!=1:raise SystemExit('STOP: QA test order was not found uniquely')
          print('TEST_QA_ORDER_NONPERSONAL_AGGREGATES:',json.dumps(rows[0],ensure_ascii=False,sort_keys=True))
          print('READ ONLY: no customer data, production D1, or business record mutation.')
          PY
