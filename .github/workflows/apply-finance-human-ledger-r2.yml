name: Apply finance human ledger R2

on:
  push:
    branches:
      - fix/finance-human-ledger-r2-20260916

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-human-ledger-r2-20260916
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Apply R2 patch
        run: python3 scripts/patch-finance-human-ledger-r2.py
      - name: Install dependencies
        run: npm ci
      - name: Focused finance regression
        run: node scripts/test-finance-day-transparency.mjs
      - name: Full cumulative gate
        run: npm run release:check
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff check
        run: git diff --check
      - name: Commit validated R2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/renderers/FinanceDashboardRenderer.tsx scripts/test-finance-day-transparency.mjs scripts/finance-day-transparency-manifest.json
          git commit -m "Make finance journal human-first by business date"
          git push origin HEAD:fix/finance-human-ledger-r2-20260916
