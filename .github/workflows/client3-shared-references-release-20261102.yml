name: Client3 split payments and shared references RELEASE (third tenant ONLY)
on:
  push:
    branches: [client3/shared-references-split-payments-20261102]
    paths: ['.github/workflows/client3-shared-references-release-20261102.yml']
permissions:
  contents: read
jobs:
  guarded-third-only-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24',cache: npm}
      - name: Refuse all tenants except the exact isolated watch Worker/D1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/client3/shared-references-split-payments-20261102
          test "$(jq -r .name wrangler.jsonc)" = orders-app-client3-old-client
          test "$(jq -r .d1_databases[0].database_name wrangler.jsonc)" = orders_db_client3_old_client
          test "$(jq -r .d1_databases[0].database_id wrangler.jsonc)" = 0717f239-6d81-4837-8586-777d94e22c53
          test "$(jq -r .d1_databases[0].migrations_dir wrangler.jsonc)" = migrations/client3-watch
          test "$(jq -r .vars.CLIENT3_WATCHES wrangler.jsonc)" = 1
          test "$(jq -r .vars.CLIENT3_INSTALLATION wrangler.jsonc)" = 1
          ! grep -Eq 'orders_db_prod|orders_db_branch2|orders-app-branch2|orders-app.orders-clothes' wrangler.jsonc
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - run: npm ci
      - name: Verify shared references, money ledger, stock and UI before any remote change
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/client3/test-watch-shared-references-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-order-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-exchange-engine-20261102.mjs
          node --experimental-strip-types scripts/client3/test-watch-full-stock-engine-20261102.mjs
          node scripts/client3/test-watch-form-20261102.mjs
          node scripts/client3/test-watch-warehouse-order-parity-20261102.mjs
          node scripts/client3/test-main-workflow-parity-20261102.mjs
          node scripts/client3/test-watch-shell-20261102.mjs
          npm run build
      - name: Capture isolated Client3 D1 Time Travel bookmark without publishing secret
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info orders_db_client3_old_client --config wrangler.jsonc > /tmp/third-bookmark.txt
          grep -Eiq 'bookmark' /tmp/third-bookmark.txt
      - name: Guard existing owner, production history and exact sole pending migration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM payments) AS payments_count,
              (SELECT COUNT(*) FROM app_users) AS users_count,
              (SELECT COUNT(*) FROM app_users WHERE login='owner-monitor' AND role='admin' AND is_active=1) AS monitoring_admin,
              (SELECT COUNT(*) FROM watch_brands) AS brand_count,
              (SELECT COUNT(*) FROM watch_variants) AS sku_count,
              (SELECT COUNT(*) FROM inventory_stock) AS stock_count,
              (SELECT COUNT(*) FROM sqlite_master WHERE name='watch_reference_values' AND type='table') AS reference_installed" \
            | jq -ce '.[0].results[0] | select(.orders_count>=2 and .payments_count>=2 and .users_count>=5 and .monitoring_admin==1 and .brand_count==2 and .reference_installed==0)' > /tmp/third-before.json
          npx wrangler d1 migrations list orders_db_client3_old_client --remote --config wrangler.jsonc > /tmp/third-pending.txt
          grep -Fq '0004_client3_shared_reference_values.sql' /tmp/third-pending.txt
          ! grep -Eq '000[123]_client3_' /tmp/third-pending.txt
          test "$(grep -Ec '000[0-9]+.*\.sql' /tmp/third-pending.txt)" = 1
      - name: Apply ONLY the additive Client3 references migration
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply orders_db_client3_old_client --remote --config wrangler.jsonc --yes
      - name: Verify migration, shared values and unchanged orders, payments and staff
        run: |
          set -euo pipefail
          npx wrangler d1 execute orders_db_client3_old_client --remote --config wrangler.jsonc --json \
            --command="SELECT (SELECT COUNT(*) FROM orders) AS orders_count,
              (SELECT COUNT(*) FROM payments) AS payments_count,
              (SELECT COUNT(*) FROM app_users) AS users_count,
              (SELECT COUNT(*) FROM app_users WHERE login='owner-monitor' AND role='admin' AND is_active=1) AS monitoring_admin,
              (SELECT COUNT(*) FROM watch_brands) AS brand_count,
              (SELECT COUNT(*) FROM watch_variants) AS sku_count,
              (SELECT COUNT(*) FROM inventory_stock) AS stock_count,
              (SELECT COUNT(*) FROM watch_reference_values WHERE is_active=1) AS active_references,
              (SELECT COUNT(*) FROM watch_reference_values WHERE kind='paymentMethods' AND is_active=1) AS payment_methods" \
            | jq -ce '.[0].results[0]' > /tmp/third-after-migration.json
          jq -e --slurpfile baseline /tmp/third-before.json '
            .orders_count==$baseline[0].orders_count and
            .payments_count==$baseline[0].payments_count and
            .users_count==$baseline[0].users_count and
            .monitoring_admin==1 and .brand_count==2 and
            .sku_count==$baseline[0].sku_count and .stock_count==$baseline[0].stock_count and
            .active_references>=7 and .payment_methods>=3
          ' /tmp/third-after-migration.json
      - name: Deploy code to exact third Worker (never Main or Branch2)
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.jsonc
      - name: Smoke new public shell and protected API without logging in
        run: |
          set -euo pipefail
          base=https://orders-app-client3-old-client.orders-clothes.workers.dev
          html=$(curl -sSL -o /tmp/third-public.html -w '%{http_code}' --max-time 25 "$base/")
          test "$html" = 200
          grep -Eq 'id="root"|type="module"' /tmp/third-public.html
          api=$(curl -sS -o /tmp/third-refs-unauth.txt -w '%{http_code}' --max-time 25 "$base/api/client3/watches/references")
          test "$api" = 401 -o "$api" = 403
          echo "THIRD_ONLY_SPLIT_PAYMENTS_REFERENCES_RELEASE_OK"
