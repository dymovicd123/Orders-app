name: W5 manager Warehouse access hotfix

on:
  push:
    branches:
      - safe/w5-manager-warehouse-access-20260905

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/w5-manager-warehouse-access-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Capture overview renderer baseline
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const relative = 'src/features/inventory/views/renderInventoryOverviewPanel.tsx'
          const text = fs.readFileSync(relative, 'utf8')
          const source = ts.createSourceFile(relative, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let fn = null
          const visit = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryOverviewPanel') fn = node; ts.forEachChild(node, visit) }
          source.forEachChild(visit)
          if (!fn?.body) throw new Error('renderInventoryOverviewPanel not found')
          const ret = [...fn.body.statements].find((statement) => ts.isReturnStatement(statement))
          if (!ret?.expression) throw new Error('overview return missing')
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          let rendered = expression.getText(source).replace('{renderRoutineCycleCountCue(ctx)}', '')
          const normalize = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')
          const hash = crypto.createHash('sha256').update(normalize(rendered)).digest('hex')
          const w53r = JSON.parse(fs.readFileSync('scripts/w5-3r-unified-check-frontend-manifest.json', 'utf8'))
          const expected = w53r.frontend?.panelReturnChanges?.renderInventoryOverviewPanel?.after
          if (expected && hash !== expected) throw new Error(`W5 manager access baseline mismatch: ${hash} != ${expected}`)
          fs.writeFileSync('/tmp/w5-manager-overview-before', hash)
          console.log(`Overview baseline: ${hash}`)
          NODE

      - name: Apply manager access fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('src/features/sections/InventorySection.tsx')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "  async function refreshActiveStocktakes() {\n    if (!isAdmin) return\n    try {",
              "  async function refreshActiveStocktakes() {\n    try {",
              'active stocktake manager gate')
          s = replace_once(s,
              "  useEffect(() => {\n    if (inventoryPanel !== 'stocktake' || !isAdmin) return\n    void refreshActiveStocktakes()\n  }, [inventoryPanel, isAdmin])",
              "  useEffect(() => {\n    if (inventoryPanel !== 'stocktake') return\n    void refreshActiveStocktakes()\n  }, [inventoryPanel])",
              'active stocktake effect gate')
          s = replace_once(s,
              "  useEffect(() => {\n    if (!isAdmin || activeSector !== 'inventory') return\n    if (inventoryPanel !== 'stocktake' && inventoryPanel !== 'catalog') return\n    if (!references) void loadReferencesData()\n  }, [activeSector, inventoryPanel, isAdmin, references])",
              "  useEffect(() => {\n    if (activeSector !== 'inventory') return\n    if (inventoryPanel === 'catalog' && !isAdmin) return\n    if (inventoryPanel !== 'stocktake' && inventoryPanel !== 'catalog') return\n    if (!references) void loadReferencesData()\n  }, [activeSector, inventoryPanel, isAdmin, references])",
              'stocktake reference read gate')
          s = replace_once(s,
              "  async function startStocktake() {\n    if (!isAdmin || stocktakeBusy) return",
              "  async function startStocktake() {\n    if (stocktakeBusy) return",
              'start stocktake manager gate')
          s = replace_once(s,
              "  async function loadHistoryMovements(reset = true) {\n    if (!isAdmin || historyBusy) return",
              "  async function loadHistoryMovements(reset = true) {\n    if (historyBusy) return",
              'movement history manager gate')
          s = replace_once(s,
              "  async function loadHistoryChecks() {\n    if (!isAdmin || historyBusy) return",
              "  async function loadHistoryChecks() {\n    if (historyBusy) return",
              'check history manager gate')
          s = replace_once(s,
              "  useEffect(() => {\n    if (!isAdmin || inventoryPanel !== 'history') return\n    if (historyMode === 'movements') void loadHistoryMovements(true)\n    else void loadHistoryChecks()\n  }, [inventoryPanel, historyMode, historyVariantFilter?.variantId, historyVariantFilter?.source])",
              "  useEffect(() => {\n    if (inventoryPanel !== 'history') return\n    if (historyMode === 'movements') void loadHistoryMovements(true)\n    else void loadHistoryChecks()\n  }, [inventoryPanel, historyMode, historyVariantFilter?.variantId, historyVariantFilter?.source])",
              'history effect manager gate')
          p.write_text(s, encoding='utf-8')

          p = Path('src/features/inventory/views/renderInventoryOverviewPanel.tsx')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s,
              "  const { cycleCountBusy, cycleCountData, cycleCountLoading, cycleCountNotice, cycleCountValues, isAdmin, openInventoryPanel, refreshCycleCountSuggestions, setCycleCountValues, simpleStockSource, submitRoutineCycleCount } = ctx as any",
              "  const { cycleCountBusy, cycleCountData, cycleCountLoading, cycleCountNotice, cycleCountValues, openInventoryPanel, refreshCycleCountSuggestions, setCycleCountValues, simpleStockSource, submitRoutineCycleCount } = ctx as any",
              'routine cue admin destructuring')
          s = replace_once(s,
              "<div className=\"inventory-cycle-count-state\"><div><strong>Здесь уже идёт полная проверка</strong><span>Сначала продолжите или отмените её — отдельная короткая проверка не должна менять остаток параллельно.</span></div>{isAdmin ? <button className=\"secondary compact\" type=\"button\" onClick={() => openInventoryPanel('stocktake')}>Открыть проверку</button> : null}</div>",
              "<div className=\"inventory-cycle-count-state\"><div><strong>Здесь уже идёт полная проверка</strong><span>Сначала продолжите или отмените её — отдельная короткая проверка не должна менять остаток параллельно.</span></div><button className=\"secondary compact\" type=\"button\" onClick={() => openInventoryPanel('stocktake')}>Открыть проверку</button></div>",
              'open stocktake manager visibility')
          s = replace_once(s,
              "    inventoryQuery,\n    isAdmin,\n    openOrderFromFinance,",
              "    inventoryQuery,\n    openOrderFromFinance,",
              'overview admin destructuring')
          s = replace_once(s,
              "                            {isAdmin ? <div className=\"inventory-calm-detail-actions\">{simpleStockDetail.aggregate ? <span className=\"inventory-quick-stocktake-hint\">Для сверки откройте конкретный вариант товара.</span> : null}{!simpleStockDetail.aggregate ? <button className=\"secondary\" type=\"button\" onClick={() => openSimpleStockHistory(simpleStockDetail)}>История позиции</button> : null}</div> : null}",
              "                            <div className=\"inventory-calm-detail-actions\">{simpleStockDetail.aggregate ? <span className=\"inventory-quick-stocktake-hint\">Для сверки откройте конкретный вариант товара.</span> : null}{!simpleStockDetail.aggregate ? <button className=\"secondary\" type=\"button\" onClick={() => openSimpleStockHistory(simpleStockDetail)}>История позиции</button> : null}</div>",
              'position history manager visibility')
          p.write_text(s, encoding='utf-8')
          print('Manager Warehouse access source patch applied')
          PY

      - name: Write preservation manifest and update cumulative gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'
          import ts from 'typescript'
          const relative = 'src/features/inventory/views/renderInventoryOverviewPanel.tsx'
          const text = fs.readFileSync(relative, 'utf8')
          const source = ts.createSourceFile(relative, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX)
          let fn = null
          const visit = (node) => { if (ts.isFunctionDeclaration(node) && node.name?.text === 'renderInventoryOverviewPanel') fn = node; ts.forEachChild(node, visit) }
          source.forEachChild(visit)
          if (!fn?.body) throw new Error('renderInventoryOverviewPanel not found')
          const ret = [...fn.body.statements].find((statement) => ts.isReturnStatement(statement))
          if (!ret?.expression) throw new Error('overview return missing')
          let expression = ret.expression
          while (ts.isParenthesizedExpression(expression)) expression = expression.expression
          let rendered = expression.getText(source).replace('{renderRoutineCycleCountCue(ctx)}', '')
          const normalize = (value) => value.replace(/\r\n/g, '\n').split('\n').map((line) => line.trim()).filter(Boolean).join('\n').replace(/^export\s+/, '')
          const after = crypto.createHash('sha256').update(normalize(rendered)).digest('hex')
          const before = fs.readFileSync('/tmp/w5-manager-overview-before', 'utf8').trim()
          fs.writeFileSync('scripts/w5-manager-warehouse-access-frontend-manifest.json', JSON.stringify({
            version: 1,
            revision: 'w5-manager-warehouse-access',
            frontend: { panelReturnChanges: { renderInventoryOverviewPanel: { before, after } } },
          }, null, 2) + '\n')
          console.log(`Overview preservation: ${before} -> ${after}`)
          NODE

          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('scripts/test-step1906b-frontend-modularization.mjs')
          s = p.read_text(encoding='utf-8')
          def one(old, new, label):
              global s
              c = s.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {c}')
              s = s.replace(old, new, 1)
          one(
              "const w5UnifiedCheckPath = path.join(root, 'scripts/w5-3r-unified-check-frontend-manifest.json')\n",
              "const w5UnifiedCheckPath = path.join(root, 'scripts/w5-3r-unified-check-frontend-manifest.json')\nconst w5ManagerWarehouseAccessPath = path.join(root, 'scripts/w5-manager-warehouse-access-frontend-manifest.json')\n",
              '1906b manifest path')
          one(
              "  const w5UnifiedCheck = fs.existsSync(w5UnifiedCheckPath) ? JSON.parse(fs.readFileSync(w5UnifiedCheckPath, 'utf8')) : null\n",
              "  const w5UnifiedCheck = fs.existsSync(w5UnifiedCheckPath) ? JSON.parse(fs.readFileSync(w5UnifiedCheckPath, 'utf8')) : null\n  const w5ManagerWarehouseAccess = fs.existsSync(w5ManagerWarehouseAccessPath) ? JSON.parse(fs.readFileSync(w5ManagerWarehouseAccessPath, 'utf8')) : null\n",
              '1906b manifest load')
          one(
              "  if (w5UnifiedCheck) check(w5UnifiedCheck.version === 1 && w5UnifiedCheck.revision === 'w5-3r-unified-check', 'W5.3R unified check frontend manifest invalid')\n",
              "  if (w5UnifiedCheck) check(w5UnifiedCheck.version === 1 && w5UnifiedCheck.revision === 'w5-3r-unified-check', 'W5.3R unified check frontend manifest invalid')\n  if (w5ManagerWarehouseAccess) check(w5ManagerWarehouseAccess.version === 1 && w5ManagerWarehouseAccess.revision === 'w5-manager-warehouse-access', 'W5 manager Warehouse access frontend manifest invalid')\n",
              '1906b manifest validation')
          one(
              "    const w5UnifiedCheckChange = w5UnifiedCheck?.frontend?.panelReturnChanges?.[panel.func]\n    if (w5UnifiedCheckChange) {\n      check(w5UnifiedCheckChange.before === expectedPanelHash, `${panel.func}: W5.3R unified check panel baseline hash mismatch`)\n      expectedPanelHash = w5UnifiedCheckChange.after\n    }\n    check(sha(normalize(text)) === expectedPanelHash, `${panel.func}: rendered JSX changed outside accepted baseline/B2A/autonomy/W1/W2/W3.1A/W3.1B/W4/W5/W5.2/W5.3/W5.3R delta`)",
              "    const w5UnifiedCheckChange = w5UnifiedCheck?.frontend?.panelReturnChanges?.[panel.func]\n    if (w5UnifiedCheckChange) {\n      check(w5UnifiedCheckChange.before === expectedPanelHash, `${panel.func}: W5.3R unified check panel baseline hash mismatch`)\n      expectedPanelHash = w5UnifiedCheckChange.after\n    }\n    const w5ManagerAccessChange = w5ManagerWarehouseAccess?.frontend?.panelReturnChanges?.[panel.func]\n    if (w5ManagerAccessChange) {\n      check(w5ManagerAccessChange.before === expectedPanelHash, `${panel.func}: W5 manager Warehouse access panel baseline hash mismatch`)\n      expectedPanelHash = w5ManagerAccessChange.after\n    }\n    check(sha(normalize(text)) === expectedPanelHash, `${panel.func}: rendered JSX changed outside accepted baseline/B2A/autonomy/W1/W2/W3.1A/W3.1B/W4/W5/W5.2/W5.3/W5.3R/manager-access delta`)",
              '1906b panel allowlist')
          one(
              "${w4HumanOperations ? ', exact W4 human Operations movement delta accepted' : ''}`)",
              "${w4HumanOperations ? ', exact W4 human Operations movement delta accepted' : ''}${w5ManagerWarehouseAccess ? ', exact W5 manager Warehouse access delta accepted' : ''}`)",
              '1906b log')
          p.write_text(s, encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          cmd = pkg['scripts']['release:check']
          marker = ' && node scripts/test-w5-manager-warehouse-access.mjs'
          if marker not in cmd:
              pkg['scripts']['release:check'] = cmd + marker
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Add focused manager-access regression and context
        run: |
          cat > scripts/test-w5-manager-warehouse-access.mjs <<'NODE'
          import fs from 'node:fs'
          const check = (ok, message) => { if (!ok) throw new Error(message) }
          const section = fs.readFileSync('src/features/sections/InventorySection.tsx', 'utf8')
          const overview = fs.readFileSync('src/features/inventory/views/renderInventoryOverviewPanel.tsx', 'utf8')
          const history = fs.readFileSync('src/features/inventory/views/renderInventoryHistoryPanel.tsx', 'utf8')
          const attention = fs.readFileSync('src/features/inventory/views/renderInventoryAttentionPanel.tsx', 'utf8')
          const worker = fs.readFileSync('worker/index.ts', 'utf8')

          check(section.includes("async function startStocktake() {\n    if (stocktakeBusy) return"), 'Manager stocktake start still has a role gate')
          check(!section.includes("async function startStocktake() {\n    if (!isAdmin"), 'Manager stocktake start silently returns')
          check(section.includes("async function refreshActiveStocktakes() {\n    try {"), 'Active stocktakes are not manager-readable')
          check(!section.includes("if (inventoryPanel !== 'stocktake' || !isAdmin) return"), 'Stocktake resume effect is still admin-only')
          check(section.includes("if (inventoryPanel === 'catalog' && !isAdmin) return"), 'Catalog/master-data admin boundary was weakened')
          check(section.includes("if (inventoryPanel !== 'stocktake' && inventoryPanel !== 'catalog') return"), 'Stocktake reference read is not scoped')

          check(section.includes("async function loadHistoryMovements(reset = true) {\n    if (historyBusy) return"), 'Movement history still blocks managers')
          check(section.includes("async function loadHistoryChecks() {\n    if (historyBusy) return"), 'Check history still blocks managers')
          check(!section.includes("if (!isAdmin || inventoryPanel !== 'history') return"), 'History auto-load is still admin-only')
          check(!overview.includes("{isAdmin ? <button className=\"secondary compact\" type=\"button\" onClick={() => openInventoryPanel('stocktake')}>Открыть проверку</button> : null}"), 'Open-check recovery action still hidden from managers')
          check(overview.includes("onClick={() => openSimpleStockHistory(simpleStockDetail)}>История позиции</button>"), 'Exact SKU history action missing')
          check(!overview.includes("{isAdmin ? <div className=\"inventory-calm-detail-actions\">"), 'Exact SKU history is still admin-only')

          check(history.includes("entry.row.canReverse && isAdmin"), 'Destructive movement reversal must stay admin-only')
          check(history.includes("{isAdmin ? <button className=\"link-button inventory-service-link\""), 'Service/diagnostics must stay admin-only')
          check(attention.includes('Требуется администратор'), 'Structural identity recovery admin boundary disappeared')
          check(worker.includes("const wantsNewReferenceValue = Object.values(createReferenceFields).some((value) => value === true);"), 'New reference-value boundary missing')
          check(worker.includes("if (wantsNewReferenceValue) {\n          const denied = requireAdminAccess(request);"), 'Managers must not create master-data values implicitly during stocktake')
          check(worker.includes("if (url.pathname === '/api/inventory/stocktakes' && request.method === 'GET') {\n        return json(await listInventoryStocktakeSessions(env.DB, url));"), 'Stocktake list backend unexpectedly admin-gated')
          check(worker.includes("if (url.pathname === '/api/inventory/history' && request.method === 'GET') {\n        return json(await listInventoryHistory(env.DB, url));"), 'Warehouse history backend unexpectedly admin-gated')
          check(worker.includes("if (url.pathname === '/api/inventory/check-history' && request.method === 'GET') {\n        return json(await listInventoryCheckHistory(env.DB, url));"), 'Check history backend unexpectedly admin-gated')

          const arrivalStart = section.indexOf('<div className="inventory-arrival-legacy-workspace">')
          const arrivalButton = '<button className="inventory-arrival-add-position" type="button" onClick={addInventoryArrivalPosition}>+ Добавить позицию</button>'
          check(arrivalStart >= 0 && section.indexOf(arrivalButton, arrivalStart) >= 0, 'Frozen Arrival structure changed')
          console.log('W5 MANAGER WAREHOUSE ACCESS PASSED — managers can start/resume checks and read Warehouse history; master-data, diagnostics and destructive reversal remain admin-only')
          NODE

          cat > docs/continuation/W5_MANAGER_WAREHOUSE_ACCESS_20260905.md <<'DOC'
          # W5 manager Warehouse access hotfix — 2026-09-05

          ## Why
          The W5.3R unified Check screen exposed manager-visible actions, but stale controller guards still returned immediately for non-admin users. The same stale pattern also prevented managers from loading active checks and the primary Warehouse History screen.

          ## Fixed
          - Managers can start selective and full stocktakes.
          - Managers can discover and resume active stocktake sessions.
          - Stocktake reference dictionaries are read for managers so existing known characteristics can be used during a check.
          - Managers can load Warehouse movement history and check/stocktake history.
          - `Открыть проверку` from the short-check conflict state is available to managers.
          - Exact SKU `История позиции` is available to managers as read-only history.

          ## Deliberately still admin-only
          - Catalog/master-data management and creation of new reference values.
          - Structural product identity recovery that requires catalog decisions.
          - Service/diagnostics.
          - Destructive reversal of an inventory movement.

          ## Safety
          No migration, no D1 diagnostic/read/write, no Branch2 change. Arrival visual workspace stays frozen. Backend stocktake and history routes were already manager-safe; this patch removes stale frontend-only role mismatches and preserves server authority for admin-only master-data creation.
          DOC

      - name: Validate
        run: |
          git diff --check
          node scripts/test-w5-manager-warehouse-access.mjs
          npm run release:check
          npm run verify:db-safety
          npm run build
          npx wrangler deploy --dry-run
          if git diff --name-only | grep -E '(^|/)(migrations?|schema)(/|\.|$)' ; then
            echo 'Unexpected migration/schema change in manager Warehouse access hotfix'
            exit 1
          fi

      - name: Commit validated tree
        run: |
          rm .github/workflows/w5-manager-warehouse-access.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'W5: restore manager Warehouse checks and history'
          git push origin HEAD:safe/w5-manager-warehouse-access-20260905
