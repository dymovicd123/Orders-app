name: Validate client fixes 20260912

on:
  push:
    branches:
      - client-fixes-20260912-r1
    paths:
      - .github/workflows/validate-client-fixes-20260912.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Full cumulative release gate
        run: npm run release:check
      - name: Lint
        run: npm run lint
