name: Arrival Production read-only forensic 3 2026-10-06

on:
  push:
    branches:
      - diag-arrival-prod-20261006
    paths:
      - '.github/workflows/arrival-prod-readonly-forensic3-20261006.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard-stop on Production identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "diag-arrival-prod-20261006" ]]
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Fq 'orders_db_branch2' wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Pinpoint failed Arrival candidates
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TARGET PRODUCT STATE ==='
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT p.id AS product_id, p.name, p.gender_scope, p.is_active,
                   sp.id AS execution_id, sp.material, sp.length, sp.is_active AS execution_active,
                   v.id AS variant_id, v.category, v.gender, v.color, v.size_label,
                   v.is_active AS variant_active, v.external_id,
                   COALESCE((SELECT s.quantity FROM inventory_stock s WHERE s.inventory_source='warehouse' AND s.variant_id=v.id LIMIT 1),0) AS warehouse_qty,
                   COALESCE((SELECT s.quantity FROM inventory_stock s WHERE s.inventory_source='boutique' AND s.variant_id=v.id LIMIT 1),0) AS boutique_qty
            FROM catalog_products p
            LEFT JOIN catalog_stock_positions sp ON sp.product_id=p.id
            LEFT JOIN catalog_variants v ON v.product_id=p.id AND v.stock_position_id=sp.id
            WHERE p.name IN ('ЭТНО КАРДИГАН','СӘУЛЕТ ЖИЛЕТ','АЙ-НӘЗІК ЖИЛЕТІ','ВОРОТНИК','СИНИЙ БОМБЕР')
            ORDER BY p.name, sp.is_active DESC, sp.id, v.is_active DESC, v.category, v.gender, v.color, v.size_label, v.id;
          " --json

          echo '=== PARTIAL MATERIALIZATION 15:30-15:45 ==='
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT v.id AS variant_id, p.name AS product_name, v.stock_position_id, v.category, v.gender, v.color,
                   v.material, v.length, v.size_label, v.is_active, v.external_id, v.created_at,
                   EXISTS(SELECT 1 FROM inventory_movements m WHERE m.variant_id=v.id AND m.movement_type='arrival') AS ever_arrived,
                   (SELECT MAX(m.created_at) FROM inventory_movements m WHERE m.variant_id=v.id AND m.movement_type='arrival') AS last_arrival_at
            FROM catalog_variants v
            JOIN catalog_products p ON p.id=v.product_id
            WHERE v.created_at >= '2026-10-06T15:30:00'
              AND v.created_at < '2026-10-06T15:45:00'
            ORDER BY v.created_at, v.id;
          " --json

          echo '=== EXECUTIONS CREATED WITHOUT ARRIVAL VARIANT 15:30-15:45 ==='
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT sp.id AS execution_id, p.name AS product_name, sp.material, sp.length, sp.is_active, sp.created_at,
                   COUNT(v.id) AS variant_count,
                   SUM(CASE WHEN EXISTS(SELECT 1 FROM inventory_movements m WHERE m.variant_id=v.id AND m.movement_type='arrival') THEN 1 ELSE 0 END) AS variants_ever_arrived
            FROM catalog_stock_positions sp
            JOIN catalog_products p ON p.id=sp.product_id
            LEFT JOIN catalog_variants v ON v.stock_position_id=sp.id
            WHERE sp.created_at >= '2026-10-06T15:30:00'
              AND sp.created_at < '2026-10-06T15:45:00'
            GROUP BY sp.id,p.name,sp.material,sp.length,sp.is_active,sp.created_at
            ORDER BY sp.created_at, sp.id;
          " --json

          echo '=== SAULET CHILD KHAKI AGE1 EXACT ==='
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT v.id, v.stock_position_id, v.category, v.gender, v.color, v.material, v.length, v.size_label,
                   v.is_active, v.external_id,
                   COALESCE((SELECT s.quantity FROM inventory_stock s WHERE s.inventory_source='warehouse' AND s.variant_id=v.id LIMIT 1),0) AS warehouse_qty,
                   COALESCE((SELECT s.quantity FROM inventory_stock s WHERE s.inventory_source='boutique' AND s.variant_id=v.id LIMIT 1),0) AS boutique_qty,
                   (SELECT MAX(m.created_at) FROM inventory_movements m WHERE m.variant_id=v.id AND m.movement_type='arrival') AS last_arrival_at
            FROM catalog_variants v
            JOIN catalog_products p ON p.id=v.product_id
            WHERE p.name='СӘУЛЕТ ЖИЛЕТ'
              AND v.category='child'
              AND UPPER(TRIM(COALESCE(v.color,'')))='ХАКИ'
              AND TRIM(COALESCE(v.size_label,''))='1'
            ORDER BY v.stock_position_id, v.gender, v.id;
          " --json

          echo '=== RECENT OPERATIONS 15:30-15:45 ==='
          npx wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT operation_id, operation_type, source_type, status, item_count, total_quantity, created_at, completed_at
            FROM inventory_operations
            WHERE created_at >= '2026-10-06T15:30:00'
              AND created_at < '2026-10-06T15:45:00'
            ORDER BY created_at, operation_id;
          " --json
