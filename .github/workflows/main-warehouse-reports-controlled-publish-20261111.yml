name: One-shot Main warehouse reports controlled publish (no D1 writes)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/main-warehouse-reports-controlled-publish-20261111.yml'
      - '.github/workflows/cloudflare-deploy-monitor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-warehouse-reports-controlled-publish-20261111.yml'
permissions:
  contents: read
concurrency:
  group: main-warehouse-reports-one-shot-20261111
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact production-only Worker and D1
        run: |
          set -euo pipefail
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
      - run: npm ci
      - name: Verify complete exports, exact roles, read-only stock, business and build
        run: |
          set -euo pipefail
          node scripts/test-warehouse-capital-readonly-20261110.mjs
          node scripts/test-warehouse-reports-navigation-20261111.mjs
          node scripts/test-warehouse-reports-excel-20261110.mjs
          node scripts/test-warehouse-report-documents-20261111.mjs
          node scripts/test-warehouse-capital-ux-full-word-20261111.mjs
          npm run release:check
          npm run build
      - name: Verify production catalog price structure in read-only Main D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('inventory_stock','catalog_variants','catalog_products')) AS base_tables,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_execution_prices') AS prices,
              (SELECT COUNT(*) FROM pragma_table_info('catalog_execution_prices') WHERE name IN ('stock_position_id','category','cost_price','sale_price')) AS price_columns
          " --json | jq -e '.[0].results[0] | .base_tables==3 and .prices==1 and .price_columns==4'
          echo MAIN_WAREHOUSE_REPORT_PREVIEW_D1_READONLY_PASS
      - name: Cloudflare production bundle dry-run without deployment
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const original=readFileSync('wrangler.jsonc','utf8')
          const safe=original.replace(/"build":\s*\{\s*"command":\s*"npm run build"\s*\},/,'')
          if(safe===original || !safe.includes('"name": "orders-app"') ||
            !safe.includes('"database_name": "orders_db_prod"') ||
            !safe.includes('"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"') ||
            safe.includes('orders_db_branch2'))throw Error('Unsafe Main config')
          writeFileSync('.main-warehouse-report-publish.jsonc',safe)
          NODE
          rm -f .wrangler/deploy/config.json
          npx --no-install wrangler deploy --dry-run --outdir .warehouse-report-package --config .main-warehouse-report-publish.jsonc
          echo MAIN_WAREHOUSE_REPORT_RELEASE_PREVIEW_PASS

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release(main): warehouse reports manual publish')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Lock Main parent, reviewed source and production D1
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dymovicd123/Orders-app'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git branch --show-current)" = 'main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 'ae66901287a4847935c454ca278ac23e162b3a0e'
          actual="$(git diff --name-only HEAD^ HEAD)"
          expected="$(printf '%s\n' '.github/workflows/cloudflare-deploy-monitor.yml' '.github/workflows/main-warehouse-reports-controlled-publish-20261111.yml')"
          test "$actual" = "$expected"
          test "$(git hash-object src/features/inventory/views/InventoryDemandStatistics.tsx)" = '0808384de91be003ad0af9a60848b92d55c4a96e'
          test "$(git hash-object src/features/inventory/views/WarehouseReportsWorkspace.tsx)" = '77700d459ffb275dfab4381ab95b31ba23981bdf'
          test "$(git hash-object src/features/inventory/views/warehouseReportExcel.ts)" = '6e6048499d3f621ae958302f21f301921bf1d3c1'
          test "$(git hash-object src/features/inventory/views/warehouseReportDocument.ts)" = '9cffa858b0796eb515ca4032ebbf7f0756712c93'
          test "$(git hash-object src/features/inventory/views/warehouseReportLocale.ts)" = 'b1c540ce28755797cc61977d294b153b6058db95'
          test "$(git hash-object src/features/sections/InventorySection.tsx)" = '856cb013d509c319497e854a1586146b7749b2e4'
          test "$(git hash-object src/app/controllers/useOperationalViewModel.ts)" = 'd22e9e4e2484b49ba235650cbf6f67ba379cf665'
          test "$(git hash-object src/app/types.ts)" = '3f0a1c034ae0f41dff3ec46cc27005ac2a874aa7'
          test "$(git hash-object src/App.tsx)" = '86312252315b0e0b319590f1d6568c81cd5d75d8'
          test "$(git hash-object worker/index.ts)" = '065a966a7b397a25127d526bd7b96c7ab307fa8c'
          test "$(git hash-object worker/domains/warehouse-capital.ts)" = '1bf091334396d6230cac1c6eccd121783e7da9d2'
          test "$(git hash-object worker/domains/warehouse-demand.ts)" = 'e0a35dd872f8d1a7bf5a6aa9c6fe310784993967'
          test "$(git hash-object shared/warehouse-capital-types.ts)" = '08c8ea5f1743b9eebf76666276f2abef4e2004eb'
          grep -Fq '"name": "orders-app"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_prod"' wrangler.jsonc
          grep -Fq '"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"' wrangler.jsonc
          ! grep -Eq 'orders_db_branch2|40065052-854e-44b8-bcd5-251bdd488301' wrangler.jsonc
          test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
          echo MAIN_WAREHOUSE_REPORT_SOURCE_AND_D1_PIN_PASS
      - run: npm ci
      - name: Rerun read-only financial tests, business release and production build
        run: |
          set -euo pipefail
          node scripts/test-warehouse-capital-readonly-20261110.mjs
          node scripts/test-warehouse-reports-navigation-20261111.mjs
          node scripts/test-warehouse-reports-excel-20261110.mjs
          node scripts/test-warehouse-report-documents-20261111.mjs
          node scripts/test-warehouse-capital-ux-full-word-20261111.mjs
          npm run release:check
          npm run build
      - name: Check Main D1 schema without writing and save fingerprint
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('inventory_stock','catalog_variants','catalog_products')) AS base_tables,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_execution_prices') AS prices,
              (SELECT COUNT(*) FROM pragma_table_info('catalog_execution_prices') WHERE name IN ('stock_position_id','category','cost_price','sale_price')) AS price_columns
          " --json | jq -e '.[0].results[0] | .base_tables==3 and .prices==1 and .price_columns==4'
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT name,sql FROM sqlite_master WHERE type='table'
            AND name IN ('inventory_stock','catalog_variants','catalog_products','catalog_execution_prices')
            ORDER BY name
          " --json | jq -Sc '.[0].results' > /tmp/warehouse-main-schema-before.json
          test -s /tmp/warehouse-main-schema-before.json
          echo MAIN_WAREHOUSE_REPORT_D1_SCHEMA_READONLY_PASS
      - name: Production-specific Wrangler dry-run and record current live deployment
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'
          const original=readFileSync('wrangler.jsonc','utf8')
          const safe=original.replace(/"build":\s*\{\s*"command":\s*"npm run build"\s*\},/,'')
          if(safe===original || !safe.includes('"name": "orders-app"') ||
            !safe.includes('"database_name": "orders_db_prod"') ||
            !safe.includes('"database_id": "17e68a41-1d58-4a36-8a63-47c3e32443c4"') ||
            safe.includes('orders_db_branch2'))throw Error('Unsafe Main config')
          writeFileSync('.main-warehouse-report-publish.jsonc',safe)
          NODE
          rm -f .wrangler/deploy/config.json
          npx --no-install wrangler deploy --dry-run --outdir .warehouse-report-package --config .main-warehouse-report-publish.jsonc
          curl --fail-with-body -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/orders-app/deployments" | jq -er '.result.deployments | sort_by(.created_on) | last.id' > /tmp/warehouse-main-before-deploy
          test -s /tmp/warehouse-main-before-deploy
      - name: Deploy ONLY Main Worker; zero migration/D1 writes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'ae66901287a4847935c454ca278ac23e162b3a0e'
          test -s /tmp/warehouse-main-schema-before.json
          test -s /tmp/warehouse-main-before-deploy
          rm -f .wrangler/deploy/config.json
          npx --no-install wrangler deploy --config .main-warehouse-report-publish.jsonc
          echo "MAIN_WAREHOUSE_REPORT_PUBLISHED: $GITHUB_SHA to Worker orders-app"
      - name: Verify new deployment, protected cost endpoint and unchanged D1 schema
        run: |
          set -euo pipefail
          before="$(cat /tmp/warehouse-main-before-deploy)"
          changed=""
          for attempt in $(seq 1 10); do
            live="$(curl --fail-with-body -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/orders-app/deployments")"
            deployed="$(jq -er '.result.deployments | sort_by(.created_on) | last.id' <<<"$live")"
            if [[ "$deployed" != "$before" ]]; then
              echo "$live" | jq -ec '.result.deployments | sort_by(.created_on) | last | {id,versions}'
              changed=yes
              break
            fi
            sleep 4
          done
          test "$changed" = yes
          npx --no-install wrangler d1 execute orders_db_prod --remote --config wrangler.jsonc --command "
            SELECT name,sql FROM sqlite_master WHERE type='table'
            AND name IN ('inventory_stock','catalog_variants','catalog_products','catalog_execution_prices')
            ORDER BY name
          " --json | jq -Sc '.[0].results' > /tmp/warehouse-main-schema-after.json
          cmp /tmp/warehouse-main-schema-before.json /tmp/warehouse-main-schema-after.json
          for attempt in $(seq 1 8); do
            auth="$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' https://orders-app.orders-clothes.workers.dev/api/auth/status)"
            cost="$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' https://orders-app.orders-clothes.workers.dev/api/reports/warehouse-capital)"
            if [[ "$auth" == 200 && "$cost" == 401 ]]; then
              echo "MAIN_WAREHOUSE_REPORT_DEPLOY_VERIFIED: exact SHA $GITHUB_SHA; auth=$auth protected_cost=$cost; D1_SCHEMA_UNCHANGED"
              exit 0
            fi
            sleep 5
          done
          exit 1
