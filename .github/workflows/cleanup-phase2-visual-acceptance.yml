name: Clean Phase 2 visual acceptance fixture

on:
  push:
    branches:
      - branch2
    paths:
      - .github/workflows/cleanup-phase2-visual-acceptance.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: branch2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Remove temporary visual fixture only
        shell: bash
        run: |
          set -euo pipefail
          git checkout c1598471a44668e45b24ec271c684ece13980f09 -- src/App.tsx
          rm -f docs/continuation/PHASE2_VISUAL_ACCEPTANCE_TEMP_2026-08-26.md
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/continuation/PHASE2_VISUAL_ACCEPTANCE_TEMP_2026-08-26.md\nsrc/App.tsx'
          ! grep -q "phase2accept" src/App.tsx
          ! grep -q "ТЕСТ · ШАПАН ЕҢЛІК" src/App.tsx
          ! git diff -- src/App.tsx | grep -E "inventoryArrival|Приход" >/dev/null
      - name: Install dependencies
        run: npm ci
      - name: Full release gate
        run: npm run release:check
      - name: Commit clean tested Phase 2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-phase2-visual-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Phase 2 visual fixture"
          git push origin HEAD:branch2
