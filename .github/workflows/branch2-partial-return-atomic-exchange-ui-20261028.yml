name: Branch2 atomic partial return and exchange form UI
on:
  pull_request:
    branches: [branch2]
    paths:
      - 'worker/domains/returns-exchanges.ts'
      - 'src/features/sections/OrderExchangeSmartSection.tsx'
      - 'src/styles/193-exchange-set-v2.css'
      - 'scripts/test-branch2-partial-return-atomic-and-exchange-ui-20261028.mjs'
      - '.github/workflows/branch2-partial-return-atomic-exchange-ui-20261028.yml'
  push:
    branches: [branch2]
    paths:
      - 'worker/domains/returns-exchanges.ts'
      - 'src/features/sections/OrderExchangeSmartSection.tsx'
      - 'src/styles/193-exchange-set-v2.css'
      - 'scripts/test-branch2-partial-return-atomic-and-exchange-ui-20261028.mjs'
      - '.github/workflows/branch2-partial-return-atomic-exchange-ui-20261028.yml'
permissions:
  contents: read
concurrency:
  group: branch2-return-atomic-exchange-ui
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - name: Simulate concurrent quantity claims and verify exchange scroll/selector
        run: node scripts/test-branch2-partial-return-atomic-and-exchange-ui-20261028.mjs
      - name: Existing return and exchange stock safety tests
        run: |
          node scripts/test-return-active-reserve-p0-20261021.mjs
          node scripts/test-return-kind-physical-truth-20261028.mjs
          node scripts/test-return-exchange-physical-receipt-r1.mjs
          node scripts/test-branch2-exchange-delayed-dispatch-20261028.mjs
      - name: Typecheck and build
        run: npm run build
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/branch2'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Guard isolated Branch2 Worker / D1 config
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = branch2
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -Fq '"name": "orders-app-branch2"' wrangler.jsonc
          grep -Fq '"database_name": "orders_db_branch2_mirror_20261027"' wrangler.jsonc
          grep -Fq '"database_id": "0904a573-21ff-44d8-93b0-c9200f771702"' wrangler.jsonc
          ! grep -Eiq 'orders_db_prod|17e68a41-1d58-4a36-8a63-47c3e32443c4' wrangler.jsonc
      - run: npm ci
      - run: node scripts/test-branch2-partial-return-atomic-and-exchange-ui-20261028.mjs
      - run: npm run build
      - name: Deploy Branch2 only, no D1 migration
        run: npx wrangler deploy
      - name: Verify staging responds
        run: |
          node --input-type=module <<'NODE'
          const r=await fetch('https://orders-app-branch2.orders-clothes.workers.dev/?return_atomic='+Date.now(),{cache:'no-store'})
          if(!r.ok||!(await r.text()).includes('/assets/')) throw Error('Branch2 origin failed to respond')
          console.log('BRANCH2_RETURN_ATOMIC_EXCHANGE_UI_DEPLOY_OK')
          NODE
