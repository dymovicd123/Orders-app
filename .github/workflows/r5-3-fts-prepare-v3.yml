name: R5.3 FTS order search prepare v3

on:
  push:
    branches:
      - safe/d1-read-budget-r5-3-fts-20260903
    paths:
      - scripts/.r5-3-fts-prepare-v3-trigger

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/d1-read-budget-r5-3-fts-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Replay reviewed R5.3 patch sources
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/r5-3-fts-prepare.yml').read_text(encoding='utf-8').splitlines()
          def extract_run(step_name):
              marker = f'- name: {step_name}'
              start = next(i for i, line in enumerate(workflow) if line.strip() == marker)
              run_index = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'run: |')
              run_indent = len(workflow[run_index]) - len(workflow[run_index].lstrip())
              content_indent = run_indent + 2
              out = []
              for line in workflow[run_index + 1:]:
                  if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                      break
                  out.append(line[content_indent:] if len(line) >= content_indent else '')
              return '\n'.join(out) + '\n'
          patch = extract_run('Patch R5.3 FTS search and regression gates')
          exec(compile(patch, '<r5-3-patch>', 'exec'), {'__name__': '__main__'})
          Path('/tmp/r5-3-register.sh').write_text(extract_run('Register exact R5.3 Worker declaration delta'), encoding='utf-8')

      - name: Preserve historical manager-snapshot semantics without schema coupling
        shell: python
        run: |
          from pathlib import Path

          worker = Path('worker/domains/orders-read.ts')
          text = worker.read_text(encoding='utf-8')
          old = """      baseWhereParts.push(`(\n        o.id IN (SELECT rowid FROM order_search_orders_fts WHERE order_search_orders_fts MATCH ?)\n        OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_items_fts WHERE order_search_items_fts MATCH ?)\n        OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_payments_fts WHERE order_search_payments_fts MATCH ?)\n      )`);\n      baseBindings.push(ftsQuery, ftsQuery, ftsQuery);\n"""
          new = """      baseWhereParts.push(`(\n        o.id IN (SELECT rowid FROM order_search_orders_fts WHERE order_search_orders_fts MATCH ?)\n        OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_items_fts WHERE order_search_items_fts MATCH ?)\n        OR o.id IN (SELECT CAST(order_id AS INTEGER) FROM order_search_payments_fts WHERE order_search_payments_fts MATCH ?)\n        OR ((o.manager_id IS NULL OR NOT EXISTS (SELECT 1 FROM managers search_manager WHERE search_manager.id = o.manager_id)) AND (\n          INSTR(COALESCE(o.manager_snapshot_name, ''), ?) > 0\n          OR INSTR(COALESCE(o.manager_snapshot_name, ''), ?) > 0\n          OR INSTR(COALESCE(o.manager_snapshot_name, ''), ?) > 0\n        ))\n      )`);\n      baseBindings.push(ftsQuery, ftsQuery, ftsQuery, q, q.toUpperCase(), q.toLowerCase());\n"""
          if old not in text:
              raise SystemExit('R5.3 FTS runtime anchor missing')
          worker.write_text(text.replace(old, new, 1), encoding='utf-8')

          migration = Path('migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql')
          sql = migration.read_text(encoding='utf-8')
          sql = sql.replace("COALESCE(m.name, o.manager_snapshot_name, '')", "COALESCE(m.name, '')")
          sql = sql.replace("COALESCE((SELECT name FROM managers WHERE id = NEW.manager_id), NEW.manager_snapshot_name, '')", "COALESCE((SELECT name FROM managers WHERE id = NEW.manager_id), '')")
          sql = sql.replace('AFTER UPDATE OF external_id, order_date, manager_id, manager_snapshot_name, customer_id, city, delivery_type, comment ON orders', 'AFTER UPDATE OF external_id, order_date, manager_id, customer_id, city, delivery_type, comment ON orders')
          if 'manager_snapshot_name' in sql:
              raise SystemExit('R5.3 migration still depends on non-canonical manager_snapshot_name schema drift')
          migration.write_text(sql, encoding='utf-8')

          test = Path('scripts/test-d1-read-budget-r5-3.mjs')
          test_text = test.read_text(encoding='utf-8')
          marker = "check(source.includes('order_search_payments_fts MATCH ?'), 'payment FTS candidate path missing')\n"
          insert = marker + "check(source.includes(\"INSTR(COALESCE(o.manager_snapshot_name, ''), ?) > 0\"), 'historical manager snapshot search fallback missing')\ncheck(!migration.includes('manager_snapshot_name'), 'R5.3 migration must run on canonical migration history without Production-only snapshot drift')\n"
          if marker not in test_text:
              raise SystemExit('R5.3 regression insertion anchor missing')
          test.write_text(test_text.replace(marker, insert, 1), encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Register exact R5.3 Worker declaration delta
        shell: bash
        run: bash /tmp/r5-3-register.sh

      - name: Targeted R5.3 regression
        run: node scripts/test-d1-read-budget-r5-3.mjs

      - name: Validate FTS5 migration and triggers on local D1
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/r5-3-fts-prepare-v2.yml').read_text(encoding='utf-8').splitlines()
          marker = '- name: Validate FTS5 migration and trigger semantics on local D1'
          start = next(i for i, line in enumerate(workflow) if line.strip() == marker)
          run_index = next(i for i in range(start + 1, len(workflow)) if workflow[i].strip() == 'run: |')
          run_indent = len(workflow[run_index]) - len(workflow[run_index].lstrip())
          content_indent = run_indent + 2
          out = []
          for line in workflow[run_index + 1:]:
              if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                  break
              out.append(line[content_indent:] if len(line) >= content_indent else '')
          Path('/tmp/r5-3-local-smoke.sh').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          bash /tmp/r5-3-local-smoke.sh

      - name: Database safety
        run: npm run verify:db-safety
      - name: Typecheck
        run: npm run typecheck
      - name: Full release check
        run: npm run release:check
      - name: Production build
        run: npm run build

      - name: Commit prepared R5.3 FTS
        run: |
          git config user.name "dymovicd123"
          git config user.email "dymovicd@gmail.com"
          git add worker/domains/orders-read.ts migrations/0064_v72_d1_read_budget_r5_order_search_fts.sql package.json scripts/test-d1-read-budget-r5-3.mjs scripts/test-d1-read-budget-r4.mjs scripts/test-step1906a-worker-modularization.mjs scripts/d1-read-budget-r5-3-worker-manifest.json scripts/test-step1906c-dead-code-cleanup.mjs
          git commit -m "Add trigram FTS order search index"
          git push origin HEAD:safe/d1-read-budget-r5-3-fts-20260903
