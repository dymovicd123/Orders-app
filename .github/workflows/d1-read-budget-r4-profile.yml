name: D1 read budget R4 profile

on:
  push:
    branches: [safe/d1-read-budget-r4-20260902]
    paths:
      - scripts/.d1-read-budget-r4-profile-trigger

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fresh top D1 queries last hour
        shell: bash
        run: |
          set -o pipefail
          npx wrangler d1 insights orders_db_prod --sort-type=sum --sort-by=reads --sort-direction=DESC --limit=40 --timePeriod=1h --json
